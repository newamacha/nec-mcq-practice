,"a":1,"s":"<p>Turnover = vehicles parked/number of bays = 200/50 = 4.0 vehicles per bay in 10 h.<br>Other options: A — this is bays per vehicle (upside down); C — this is vehicles per hour (200/10); D — this adds vehicles and bays<\/p>","tag":""},{"id":"6.4.14","m":1,"o":["25 %","36 %","75 %","133 %"],"q":"<p>In a 48-bay parking lot, the average accumulation observed during the peak is 36 vehicles. The parking index (occupancy) is:<\/p>","a":2,"s":"<p>Parking index = occupied bays/total bays × 100 = 36/48 × 100 = 75%.<br>Other options: A — this is the share of bays left empty; B — this just writes the accumulation as a percentage; D — this is 48/36, upside down<\/p>","tag":""},{"id":"6.4.15","m":1,"o":["17.1","51.4","154.1","411.0"],"q":"<p>An 8 km highway section with ADT 10,000 recorded 45 accidents in 3 years. The accident rate per 100 million vehicle-km is:<\/p>","a":1,"s":"<p>R = A×10⁸/(365·T·ADT·L) = 45×10⁸/(365×3×10000×8) = 51.4.<br>Other options: A — this divides by the number of years twice; C — this forgets to divide by the number of years; D — this forgets to divide by the section length<\/p>","tag":""},{"id":"6.4.16","m":1,"o":["A plan showing the paths of the vehicles and pedestrians in each accident, using standard symbols","A graph of accidents against year","A city map with a pin for each accident","A scale drawing of the physical features of the site only"],"q":"<p>In accident studies, a collision diagram is:<\/p>","a":0,"s":"<p>A collision diagram shows the type of each accident at a location (rear-end, right-angle, head-on and so on), which points to the common causes. A condition diagram shows the physical features.<br>Other options: B — this is a trend chart; C — this is a spot map; D — this is a condition diagram<\/p>","tag":""},{"id":"6.4.17","m":1,"o":["Primary, secondary and tertiary signs","Permanent, temporary and electronic signs","Overhead, roadside and pavement signs","Regulatory (mandatory), warning (cautionary) and informatory signs"],"q":"<p>As per IRC:67, road traffic signs are grouped into:<\/p>","a":3,"s":"<p>IRC:67 has three classes: regulatory signs (mandatory/prohibitory), warning signs and informatory signs. Nepal&#x27;s traffic sign practice uses similar groups.<br>Other options: A — these are not IRC classes; B — this is not the IRC grouping; C — this is about where signs are placed, not what they do<\/p>","tag":""},{"id":"6.4.18","m":1,"o":["Circle","Octagon","Equilateral triangle with apex upward","Inverted equilateral triangle"],"q":"<p>The GIVE WAY sign has the shape of a(n):<\/p>","a":3,"s":"<p>GIVE WAY is a downward-pointing triangle with a red border. STOP is a red octagon; warning signs are upward-pointing triangles; most regulatory signs are circular.<br>Other options: A — this is the shape of most regulatory signs; B — this is the STOP sign; C — this is the shape of warning signs<\/p>","tag":""},{"id":"6.4.19","m":1,"o":["Regulatory signs","Warning signs","Road markings","Informatory signs"],"q":"<p>Circular traffic signs with a red ring (e.g. &#x27;No entry&#x27;, &#x27;Speed limit&#x27;) or a blue background (e.g. &#x27;Compulsory turn left&#x27;) belong to the class of:<\/p>","a":0,"s":"<p>Circular signs are regulatory: red ring for prohibitory and blue disc for mandatory.<br>Other options: B — warning signs are triangular; C — markings are painted on the pavement; D — informatory signs are rectangular<\/p>","tag":""},{"id":"6.4.20","m":1,"o":["26.7 s","40.0 s","41.8 s","51.1 s"],"q":"<p>A two-phase signal has total lost time L = 12 s per cycle and critical flow ratios y1 = 0.3 and y2 = 0.25. Webster&#x27;s optimum cycle length is:<\/p>","a":3,"s":"<p>Co = (1.5L + 5)/(1 − Y) = (18 + 5)/(1 − 0.55) = 23/0.45 = 51.1 s.<br>Other options: A — this is L/(1 − Y), the minimum cycle; B — this leaves out the +5; C — this divides by Y instead of (1 − Y)<\/p>","tag":""},{"id":"6.4.21","m":1,"o":["18.0 s","21.8 s","26.2 s","32.7 s"],"q":"<p>For the signal with L = 12 s, y1 = 0.3, y2 = 0.25, a cycle of 60 s is adopted. The effective green time for phase 1 is:<\/p>","a":2,"s":"<p>Effective green = (C − L)·y1/Y = (60 − 12)×0.3/0.55 = 26.2 s (phase 2 gets 21.8 s).<br>Other options: A — this is C × y1; B — this is the green time for phase 2; D — this leaves out the lost time<\/p>","tag":""},{"id":"6.4.22","m":1,"o":["Average daily traffic divided by 24","30th highest hourly volume of the year","200th highest hourly volume of the year","Highest hourly volume of the year"],"q":"<p>For design of rural highways, the design hourly volume is commonly taken as the:<\/p>","a":1,"s":"<p>On the hourly-volume ranking curve, the 30th highest hour is near the &#x27;knee&#x27;; designing for it is economical and is exceeded only 29 hours a year.<br>Other options: A — this average hour badly underestimates peak demand; C — this would leave the road congested for many hours; D — designing for the single highest hour is uneconomical<\/p>","tag":""},{"id":"6.4.23","m":1,"o":["4","8","16","32"],"q":"<p>At an uncontrolled four-legged intersection of two two-way roads, the number of crossing (major) conflict points is:<\/p>","a":2,"s":"<p>A four-leg two-way intersection has 16 crossing, 8 merging and 8 diverging conflicts (32 in total).<br>Other options: A — this is far too few; B — 8 is the number of merging (or diverging) conflicts; D — 32 is the total of all conflict points<\/p>","tag":""},{"id":"6.4.24","m":1,"o":["3","6","9","32"],"q":"<p>At an uncontrolled T-intersection (three legs, all two-way), the total number of conflict points (crossing + merging + diverging) is:<\/p>","a":2,"s":"<p>A T-junction has 3 crossing, 3 merging and 3 diverging conflicts = 9.<br>Other options: A — this counts only the crossing conflicts; B — this leaves out one group; D — 32 is for a four-legged intersection<\/p>","tag":""},{"id":"6.4.25","m":1,"o":["2100 PCU/h","3675 PCU/h","4410 PCU/h","4900 PCU/h"],"q":"<p>Using Wardrop&#x27;s formula Qp = 280w(1 + e/w)(1 − p/3)/(1 + w/l), find the practical capacity of a rotary weaving section with w = 12 m, average entry/exit width e = 9 m, weaving length l = 36 m and proportion of weaving traffic p = 0.5.<\/p>","a":1,"s":"<p>Qp = 280×12×(1 + 0.75)×(1 − 0.167)/(1 + 0.333) = 3675 PCU/h.<br>Other options: A — this leaves out the (1 + e/w) factor; C — this leaves out the (1 − p/3) factor; D — this leaves out the (1 + w/l) divisor<\/p>","tag":""},{"id":"6.4.26","m":1,"o":["Weaving (merging and diverging) movements","Head-on conflicts","Right-angle crossing conflicts","Signal-controlled crossings"],"q":"<p>In a traffic rotary, the crossing conflicts of an ordinary intersection are turned into:<\/p>","a":0,"s":"<p>Vehicles travel one way round the central island and change lanes by weaving, so there are no direct crossing conflicts.<br>Other options: B — rotary traffic is one-way, so there are no head-on conflicts; C — a rotary removes these; D — a rotary works without signals<\/p>","tag":""},{"id":"6.4.27","m":1,"o":["Four legs with heavy turning in every direction","Very low traffic on a rural crossroad","Four legs where the minor road can have at-grade junctions","Three legs (T or Y junction)"],"q":"<p>A trumpet interchange is suitable for a grade-separated junction with:<\/p>","a":3,"s":"<p>A trumpet uses one loop and directional ramps to serve all turns at a three-legged junction.<br>Other options: A — this suits a cloverleaf or directional interchange; B — an at-grade junction is enough here; C — this suits a diamond interchange<\/p>","tag":""},{"id":"6.4.28","m":1,"o":["Channelizing islands","Pedestrian refuge islands","Rotary central islands","Divisional islands"],"q":"<p>Raised islands at an intersection that guide vehicles into the proper paths and reduce the conflict area are called:<\/p>","a":0,"s":"<p>Channelizing islands shape and separate turning paths at intersections.<br>Other options: B — these give pedestrians a safe waiting place; C — the central island of a rotary makes traffic circulate; D — these separate opposing flows along a road<\/p>","tag":""},{"id":"6.4.29","m":1,"o":["Forced or breakdown flow, with demand above capacity and queues","Stable flow with some restriction on speed","Free flow with complete freedom to manoeuvre","Unstable flow at or near capacity"],"q":"<p>In the Highway Capacity Manual concept of level of service (LOS), LOS F represents:<\/p>","a":0,"s":"<p>LOS A is free flow and LOS E is flow at capacity; LOS F is forced flow with stop-and-go queues.<br>Other options: B — this is roughly LOS C; C — this is LOS A; D — this is LOS E<\/p>","tag":""},{"id":"6.4.30","m":1,"o":["0.42 veh/h","150 veh/h","1500 veh/h","8640 veh/h"],"q":"<p>If the minimum average time headway between vehicles in a lane is 2.4 s, the capacity of the lane is:<\/p>","a":2,"s":"<p>Capacity = 3600/h = 3600/2.4 = 1500 veh/h/lane.<br>Other options: A — this is 1/h, giving vehicles per second; B — this uses 360 s in an hour; D — this multiplies by the headway<\/p>","tag":""}]},{"k":"6.5","t":"Road Pavement: Design, Construction and Maintenance","qs":[{"id":"6.5.1","m":1,"o":["Direct bearing on piles under the pavement","Grain-to-grain transfer through the granular layers, over a widening area","Flexural (slab) action of the surface layer","Tension in the bituminous surface course alone"],"q":"<p>A flexible pavement transmits wheel loads to the subgrade mainly by:<\/p>","a":1,"s":"<p>Flexible layers have little flexural strength; the load is spread through grain-to-grain contact, so the stress falls with depth. Rigid slabs act as plates in bending.<br>Other options: A — pavements are not carried on piles; C — this is how a rigid pavement works; D — the thin surface course cannot carry the load in tension<\/p>","tag":""},{"id":"6.5.2","m":1,"o":["Subgrade → sub-base → base course → surface course","Base course → surface course → sub-base → subgrade","Surface course → sub-base → base course → subgrade","Surface course → base course → sub-base → subgrade"],"q":"<p>The correct order of layers of a conventional flexible pavement, from top to bottom, is:<\/p>","a":3,"s":"<p>Material quality falls with depth as stresses fall: wearing surface, then base, then sub-base, on the prepared subgrade.<br>Other options: A — this lists the layers from bottom to top; B — the surface course is on top; C — the base course is above the sub-base<\/p>","tag":""},{"id":"6.5.3","m":1,"o":["Modulus of subgrade reaction, k","Penetration value","Marshall stability value","Group index"],"q":"<p>In the design of rigid (cement concrete) pavements as per IRC:58, the support given by the subgrade/sub-base is expressed by the:<\/p>","a":0,"s":"<p>Westergaard&#x27;s analysis treats the slab as resting on a Winkler foundation described by k (from a plate load test, or estimated from CBR).<br>Other options: B — this is a bitumen test; C — this is for bituminous mixes; D — group index is used in an old empirical flexible-pavement method<\/p>","tag":""},{"id":"6.5.4","m":1,"o":["80 kN tandem axle with single wheels","40 kN single axle with single wheels","160 kN tandem axle","80 kN single axle with dual wheels"],"q":"<p>The &#x27;standard axle&#x27; used in pavement design is a:<\/p>","a":3,"s":"<p>The standard axle is an 80 kN (8160 kg) single axle with dual wheels; other axle loads are converted to it by the fourth-power law.<br>Other options: A — the standard is a single axle with dual wheels; B — this is half the standard load; C — a tandem axle is not the standard<\/p>","tag":""},{"id":"6.5.5","m":1,"o":["1.25","1.56","1.95","2.44"],"q":"<p>Using the fourth-power law, a single axle of 100 kN is equivalent to how many standard 80 kN axles?<\/p>","a":3,"s":"<p>EF = (100/80)⁴ = 1.25⁴ = 2.44.<br>Other options: A — this is a straight linear ratio; B — this uses the square; C — this uses the cube<\/p>","tag":""},{"id":"6.5.6","m":1,"o":["The PCU value of a commercial vehicle","The number of standard axles per commercial vehicle","The ratio of tyre pressure to contact pressure","The impact factor for moving loads on bridges"],"q":"<p>The vehicle damage factor (VDF) used in IRC:37 is:<\/p>","a":1,"s":"<p>VDF turns the number of commercial vehicles into standard axle repetitions, from axle-load surveys and the fourth-power law.<br>Other options: A — PCU is for capacity, not damage; C — this is not VDF; D — this belongs to bridge design<\/p>","tag":""},{"id":"6.5.7","m":1,"o":["9.5 msa","19.2 msa","33.4 msa","66.7 msa"],"q":"<p>A two-lane single-carriageway road carries 2000 commercial vehicles per day (both directions) in the year of opening. Growth rate 7.5%, design life 15 years, VDF 3.5 and lane distribution factor 0.5. The cumulative design traffic N = 365A[(1 + r)ⁿ − 1]/r × D × F is about:<\/p>","a":2,"s":"<p>Growth factor [(1.075)¹⁵ − 1]/0.075 = 26.12; N = 365 × 2000 × 26.12 × 0.5 × 3.5 = 33,366,211 ≈ 33.4 million standard axles.<br>Other options: A — this leaves out the VDF; B — this ignores traffic growth (365 × A × n); D — this takes D = 1.0<\/p>","tag":""},{"id":"6.5.8","m":1,"o":["0.40","0.50","0.75","1.00"],"q":"<p>As per IRC:37, the lane distribution factor for a two-lane single-carriageway road (applied to total traffic in both directions) is:<\/p>","a":1,"s":"<p>IRC:37: single-lane 1.0; two-lane single carriageway 0.50; four-lane single carriageway 0.40; dual two-lane carriageway 0.75 of the traffic in each direction.<br>Other options: A — this is for a four-lane single carriageway; C — this is for a dual two-lane carriageway (per direction); D — this is for a single-lane road<\/p>","tag":""},{"id":"6.5.9","m":1,"o":["Horizontal tensile strain at the bottom of the bituminous layer, and vertical compressive strain on top of the subgrade","Shear strain in the base course only","Vertical tensile strain at the surface and horizontal compressive strain in the subgrade","Thermal strain in the surface course only"],"q":"<p>In the mechanistic-empirical design of flexible pavements as per IRC:37, the two critical strains considered are:<\/p>","a":0,"s":"<p>The tensile strain at the bottom of the bituminous layer controls fatigue cracking; the vertical compressive strain on the subgrade controls rutting.<br>Other options: B — this is not the IRC:37 criterion; C — the directions and locations are wrong; D — temperature is not the design strain in IRC:37<\/p>","tag":""},{"id":"6.5.10","m":1,"o":["25.1 cm","29.1 cm","35.3 cm","37.8 cm"],"q":"<p>Using the old IRC CBR formula t = √[1.75P/CBR − A/π] (t in cm), find the total pavement thickness for a wheel load P = 4085 kg, tyre pressure 7 kg/cm² and subgrade CBR = 5%.<\/p>","a":2,"s":"<p>A = P/p = 583.6 cm²; t = √(1.75×4085/5 − 583.6/π) = √(1429.8 − 185.8) = 35.3 cm.<br>Other options: A — this leaves out the 1.75 factor; B — this subtracts A instead of A/π; D — this leaves out the A/π term<\/p>","tag":""},{"id":"6.5.11","m":1,"o":["37.6 cm","84.1 cm","156.5 cm","7,068 cm"],"q":"<p>A concrete slab is 25 cm thick with E = 3 × 10⁵ kg/cm², Poisson&#x27;s ratio 0.15 and k = 8 kg/cm³. Its radius of relative stiffness l = [Eh³/(12(1 − μ²)k)]^(1/4) is about:<\/p>","a":1,"s":"<p>Eh³ = 3×10⁵ × 15625 = 4.6875 × 10⁹; 12(1 − 0.0225)×8 = 93.84; l = (4.995 × 10⁷)^(1/4) = 84.1 cm.<br>Other options: A — this uses h² instead of h³; C — this leaves out the 12; D — this takes the square root instead of the fourth root<\/p>","tag":""},{"id":"6.5.12","m":1,"o":["11.50 cm","14.07 cm","15.00 cm","27.57 cm"],"q":"<p>For Westergaard&#x27;s analysis, find the radius of the equivalent distribution of pressure b for a load contact radius a = 15 cm on a slab of thickness h = 20 cm. (b = √(1.6a² + h²) − 0.675h when a &lt; 1.724h.)<\/p>","a":1,"s":"<p>a = 15 &lt; 1.724h = 34.48, so b = √(1.6×225 + 400) − 0.675×20 = 27.57 − 13.5 = 14.07 cm.<br>Other options: A — this leaves out the 1.6 factor; C — b = a only when a ≥ 1.724h; D — this forgets to subtract 0.675h<\/p>","tag":""},{"id":"6.5.13","m":1,"o":["Centre, quarter-point and mid-joint","Top, middle and bottom of the slab","Dowel, tie bar and expansion joint","Interior, edge and corner"],"q":"<p>Westergaard analysed the stresses in a concrete pavement slab for three critical load positions, namely:<\/p>","a":3,"s":"<p>Westergaard gave stress formulas for a wheel load at the interior, at the edge and at the corner of the slab.<br>Other options: A — these are not Westergaard&#x27;s positions; B — these are depths, not load positions; C — these are joint details<\/p>","tag":""},{"id":"6.5.14","m":1,"o":["18.0 kg/cm²","22.5 kg/cm²","36.0 kg/cm²","45.0 kg/cm²"],"q":"<p>The warping stress at the edge of a concrete slab is given by σ = C·E·α·t/2. With C = 0.8, E = 3 × 10⁵ kg/cm², α = 10 × 10⁻⁶ per °C and a temperature difference of 15 °C between top and bottom, σ is:<\/p>","a":0,"s":"<p>σ = 0.8 × 3×10⁵ × 10⁻⁵ × 15/2 = 18.0 kg/cm².<br>Other options: B — this takes C = 1; C — this leaves out the division by 2; D — this takes C = 1 and also leaves out the /2<\/p>","tag":""},{"id":"6.5.15","m":1,"o":["2.22 m","4.44 m","6.67 m","8.89 m"],"q":"<p>Find the maximum spacing of contraction joints in a plain CC pavement for an allowable frictional stress Sf = 0.8 kg/cm², unit weight of concrete 2400 kg/m³ and coefficient of subgrade friction f = 1.5. (Sf = W·L·f/(2 × 10⁴), L in m.)<\/p>","a":1,"s":"<p>L = 2×10⁴ × Sf/(W·f) = 2×10⁴ × 0.8/(2400 × 1.5) = 4.44 m.<br>Other options: A — this uses 10⁴ instead of 2×10⁴; C — this takes f = 1.0; D — this uses 4×10⁴<\/p>","tag":""},{"id":"6.5.16","m":1,"o":["Across transverse joints, to transfer load while letting the slabs move along the road","As the main bending reinforcement of the slab","Only to stop warping of the slab","Across longitudinal joints, to tie adjacent lanes together"],"q":"<p>Dowel bars in a cement concrete pavement are provided:<\/p>","a":0,"s":"<p>Dowels are plain round bars, bonded at one end and free (greased) at the other. They transfer wheel load across expansion and contraction joints and still let the slabs move.<br>Other options: B — plain slabs have no main bending reinforcement; C — warping is controlled by joints and slab size; D — this is the job of tie bars<\/p>","tag":""},{"id":"6.5.17","m":1,"o":["Allow free expansion of the slabs","Transfer wheel load across transverse expansion joints","Resist the temperature warping stress at the slab centre","Hold adjacent slabs together and stop them separating"],"q":"<p>Tie bars in a cement concrete pavement are placed across longitudinal joints mainly to:<\/p>","a":3,"s":"<p>Tie bars are deformed bars bonded on both sides. They keep the lanes tight together, and the aggregate interlock this keeps does the load transfer.<br>Other options: A — tie bars restrain movement; B — this is the job of dowel bars; C — they are not designed for warping<\/p>","tag":""},{"id":"6.5.18","m":1,"o":["Stone screenings and binding material worked in with water and rolling","Cement mortar","Hot bitumen sprayed over the stones","Lime-stabilised soil only"],"q":"<p>In water bound macadam (WBM) construction, the coarse aggregate is bound together mainly by:<\/p>","a":0,"s":"<p>In WBM, broken stone is rolled, screenings fill the voids, and binding material (fine soil/stone dust) with water forms a slurry that locks the stones together.<br>Other options: B — this would make it a rigid layer; C — this is penetration macadam or surface dressing; D — WBM does not use lime<\/p>","tag":""},{"id":"6.5.19","m":1,"o":["Surface dressing","Tack coat","Prime coat","Seal coat"],"q":"<p>A thin application of low-viscosity bituminous binder (cutback or emulsion) on a porous granular base, to plug surface voids and bond it to the bituminous layer above, is called a:<\/p>","a":2,"s":"<p>A prime coat soaks into a granular surface (e.g. WMM/WBM). A tack coat is a very light spray on an existing bituminous or concrete surface to bond a new layer.<br>Other options: A — surface dressing is a binder spray covered with chips, forming a wearing surface; B — a tack coat is applied on an existing bituminous or concrete surface; D — a seal coat is a final waterproofing layer on top of an open surface<\/p>","tag":""},{"id":"6.5.20","m":1,"o":["5 mm","20 mm","50 mm","100 mm"],"q":"<p>The compacted thickness of a premix carpet (open-graded premix surfacing) commonly used in Nepal and India is about:<\/p>","a":1,"s":"<p>A premix carpet is a thin wearing course, normally 20 mm thick, usually finished with a seal coat.<br>Other options: A — too thin for a premix carpet; C — this is the thickness range of DBM/BC layers; D — this is a base course thickness<\/p>","tag":""},{"id":"6.5.21","m":1,"o":["No compaction is needed","It is used only as a wearing surface","Bitumen is used as the binder","Graded aggregate and water are premixed in a plant at OMC, then laid and compacted"],"q":"<p>Wet mix macadam (WMM) differs from WBM mainly because in WMM:<\/p>","a":3,"s":"<p>WMM is mixed in a pugmill at about OMC and laid by paver or grader; WBM is built up in the field by spreading stones, screenings and binder with water.<br>Other options: A — WMM is compacted by rolling; B — WMM is a base or sub-base layer; C — WMM is an unbound granular layer<\/p>","tag":""},{"id":"6.5.22","m":1,"o":["Wet mix macadam (WMM)","Dense bituminous macadam (DBM)","Granular sub-base (GSB)","Bituminous concrete (BC)"],"q":"<p>In a high-type flexible pavement, the top wearing course is normally:<\/p>","a":3,"s":"<p>BC (asphalt concrete) is a dense, high-quality wearing course laid over a DBM binder/base course.<br>Other options: A — WMM is a granular base; B — DBM is a binder/base course below the BC; C — GSB is the lowest pavement layer<\/p>","tag":""},{"id":"6.5.23","m":1,"o":["Low-temperature shrinkage","Excess bitumen in the mix","Fatigue failure under repeated loads (weak base/subgrade or thin pavement)","Poor bond between aggregate and binder only"],"q":"<p>Interconnected cracks forming small polygonal blocks, like crocodile skin, in the wheel paths of a bituminous road mainly show:<\/p>","a":2,"s":"<p>Alligator (fatigue) cracking starts at the bottom of the bituminous layer under repeated tensile strain and spreads to the surface.<br>Other options: A — shrinkage gives transverse or block cracks, not crocodile cracking in the wheel paths; B — excess bitumen causes bleeding; D — poor bond causes stripping and ravelling<\/p>","tag":""},{"id":"6.5.24","m":1,"o":["Too much bitumen, or too soft a binder in hot weather","Fatigue under repeated loading","Settlement of the subgrade","Too little bitumen in the mix"],"q":"<p>Bleeding (a shiny, sticky bitumen film on the surface) of a bituminous pavement is mainly caused by:<\/p>","a":0,"s":"<p>When the voids are overfilled with binder, or the binder is too soft, bitumen comes up to the surface under traffic in hot weather.<br>Other options: B — this causes alligator cracking; C — this causes depressions and rutting; D — this causes ravelling<\/p>","tag":""},{"id":"6.5.25","m":1,"o":["Blow-up","Spalling","Faulting","Pumping"],"q":"<p>Under traffic, water and fine subgrade/sub-base material are forced out through joints and cracks of a concrete pavement. This distress is called:<\/p>","a":3,"s":"<p>Pumping washes out the support under slab ends, which leads to faulting and corner cracking.<br>Other options: A — blow-up is buckling of slabs in hot weather when expansion is restrained; B — spalling is breaking of the concrete near joints; C — faulting is a step in level between slabs, often caused by pumping<\/p>","tag":""},{"id":"6.5.26","m":1,"o":["1.00 mm","1.20 mm","1.40 mm","1.60 mm"],"q":"<p>Benkelman beam rebound deflections (after temperature and seasonal corrections) on a major arterial road have a mean of 1.20 mm and a standard deviation of 0.20 mm. As per IRC:81, the characteristic deflection is:<\/p>","a":3,"s":"<p>For major arterial roads, Dc = x̄ + 2σ = 1.2 + 2×0.2 = 1.60 mm (x̄ + σ is used for other roads).<br>Other options: A — this subtracts instead of adds; B — this is just the mean; C — x̄ + σ is used for minor roads<\/p>","tag":""},{"id":"6.5.27","m":1,"o":["Deflection of a concrete slab under a rigid plate","Rebound deflection of a flexible pavement under a standard axle","Skid resistance of the surface","Roughness (unevenness) of the surface"],"q":"<p>The Benkelman beam is used in the field to measure the:<\/p>","a":1,"s":"<p>A loaded truck (8170 kg rear axle, dual tyres) moves away from the beam tip, and the elastic rebound of the surface is read. It is used to design overlays.<br>Other options: A — this is a plate bearing test; C — this is measured with a pendulum tester; D — this is measured with a bump integrator or profilometer<\/p>","tag":""},{"id":"6.5.28","m":1,"o":["4 MPa","40 MPa","42.7 MPa","400 MPa"],"q":"<p>As per IRC:37-2018, the resilient modulus of a subgrade with effective CBR = 4% is estimated as MR (MPa) = 10 × CBR for CBR ≤ 5%. MR is:<\/p>","a":1,"s":"<p>MR = 10 × 4 = 40 MPa (for CBR &gt; 5%, IRC:37 uses MR = 17.6 × CBR^0.64).<br>Other options: A — this forgets the factor of 10; C — this uses the CBR &gt; 5% formula, which does not apply here; D — this uses 100 × CBR<\/p>","tag":""},{"id":"6.5.29","m":1,"o":["Routine maintenance","Rehabilitation","Periodic maintenance","Emergency maintenance"],"q":"<p>Pothole patching, crack sealing, clearing side drains and cutting shoulder vegetation, done all through the year, are classed as:<\/p>","a":0,"s":"<p>Routine maintenance is small, regular work needed every year; resurfacing at intervals of several years is periodic maintenance.<br>Other options: B — this is major strengthening or reconstruction; C — periodic maintenance is resealing or overlays done every few years; D — this is for sudden events such as landslides or washouts<\/p>","tag":""},{"id":"6.5.30","m":1,"o":["Control the random cracking caused by shrinkage of concrete","Separate two days&#x27; concreting work","Let the slab expand as temperature rises, preventing buckling (blow-up)","Tie two traffic lanes together"],"q":"<p>Expansion joints in a cement concrete pavement are provided mainly to:<\/p>","a":2,"s":"<p>An expansion joint is a full-depth gap with filler that takes up thermal expansion. Contraction joints control shrinkage cracking.<br>Other options: A — this is the job of contraction joints; B — this is a construction joint; D — this is a longitudinal joint with tie bars<\/p>","tag":""}]},{"k":"6.6","t":"Bridges and Tunnels","qs":[{"id":"6.6.1","m":1,"o":["Major bridge","Culvert","Minor bridge","Long-span bridge"],"q":"<p>As per IRC classification, a bridge with a total length between 6 m and 60 m is called a:<\/p>","a":2,"s":"<p>IRC: culvert ≤ 6 m; minor bridge &gt; 6 m up to 60 m; major bridge &gt; 60 m.<br>Other options: A — major bridges are longer than 60 m; B — culverts are up to 6 m; D — this is not an IRC length class<\/p>","tag":""},{"id":"6.6.2","m":1,"o":["Suspension bridge","Arch bridge","Cantilever bridge","Cable-stayed bridge"],"q":"<p>A bridge whose deck hangs from cables (through vertical hangers) that pass over towers and are anchored into the ground at the ends is a:<\/p>","a":0,"s":"<p>In a suspension bridge, the main cables sag between towers and carry the deck through hangers; the cables are anchored at the ends. Many of Nepal&#x27;s trail bridges are of this type.<br>Other options: B — an arch carries load mainly in compression; C — a cantilever bridge uses arms projecting from piers; D — in a cable-stayed bridge, straight cables run directly from the towers to the deck<\/p>","tag":""},{"id":"6.6.3","m":1,"o":["A narrow channel with firm foundation strata at a reasonable depth","A crossing at right angles to the direction of flow","A straight reach with well-defined, stable banks","A sharp bend where the river is wide and meandering"],"q":"<p>Which of the following is NOT a desirable feature of a bridge site?<\/p>","a":3,"s":"<p>Good sites are straight reaches with narrow, stable, well-defined banks, a firm foundation and a crossing at right angles. Bends shift the flow and cause scour on one side.<br>Other options: A — this is desirable; B — this is desirable (no skew); C — this is desirable<\/p>","tag":""},{"id":"6.6.4","m":1,"o":["7.9 m","15.8 m","22.4 m","250 m"],"q":"<p>For a multi-span bridge, the cost of the superstructure of one span is Rs 2000·L² (L in m) and the cost of one pier with its foundation is Rs 500,000. The economic span length is about:<\/p>","a":1,"s":"<p>The total cost is lowest when the superstructure cost of one span equals the cost of one pier: 2000L² = 500,000, so L = √(500000/2000) = 15.8 m.<br>Other options: A — this is half the economic span; C — this uses 2 × pier cost; D — this forgets the square root<\/p>","tag":""},{"id":"6.6.5","m":1,"o":["Fixed (rocker/hinge) bearing","Elastomeric bearing","Sliding bearing","Roller bearing"],"q":"<p>A bridge bearing that allows rotation but prevents horizontal movement of the superstructure is a:<\/p>","a":0,"s":"<p>A fixed bearing (e.g. rocker or pin) lets the girder end rotate but not slide; the other end has a free bearing to allow expansion.<br>Other options: B — an elastomeric pad allows some rotation and some horizontal movement; C — a sliding bearing allows horizontal movement; D — a roller bearing allows both rotation and horizontal movement<\/p>","tag":""},{"id":"6.6.6","m":1,"o":["Wing walls","Bearings","Abutments","Piers"],"q":"<p>The end supports of a bridge, which carry the superstructure and also hold back the earth of the approach embankment, are the:<\/p>","a":2,"s":"<p>Abutments are the end supports and also act as retaining walls for the approach fill.<br>Other options: A — wing walls retain the fill at the sides but do not support the deck; B — bearings pass loads from the deck to the supports; D — piers are intermediate supports<\/p>","tag":""},{"id":"6.6.7","m":1,"o":["Carry the bearings","Support the deck between the abutments","Retain the approach fill beside the abutments and guide the stream","Resist wind load on the girders"],"q":"<p>Wing walls of a bridge are provided to:<\/p>","a":2,"s":"<p>Wing walls run from the abutment, holding up the side slopes of the approach embankment and guiding the flow into the opening.<br>Other options: A — bearings sit on the abutment or pier cap; B — piers support the deck between the abutments; D — wind load is resisted by the superstructure and bearings<\/p>","tag":""},{"id":"6.6.8","m":1,"o":["Bottom plug","Well curb","Steining","Well cap"],"q":"<p>In a well foundation, the concrete placed at the bottom of the well after sinking is complete, to seal it, is called the:<\/p>","a":0,"s":"<p>The bottom plug seals the well base and spreads the load to the soil. The steining is the wall, the curb and cutting edge are at its bottom, and the well cap is on top.<br>Other options: B — the curb is the tapered ring at the bottom of the steining; C — the steining is the wall of the well; D — the well cap is on top and carries the pier<\/p>","tag":""},{"id":"6.6.9","m":1,"o":["Can be built only in dry rocky beds","Need no investigation of scour depth","Are the cheapest option for small culverts","Can be sunk below the deep scour level in sand and resist large lateral forces"],"q":"<p>Well foundations are commonly used for bridges over large alluvial rivers of the Nepal Terai mainly because they:<\/p>","a":3,"s":"<p>A large rigid well can be taken below the maximum scour depth and resists floods, debris and earthquake forces.<br>Other options: A — they are typically used in deep alluvium; B — scour depth governs the design of a well; C — small culverts use open (raft) foundations<\/p>","tag":""},{"id":"6.6.10","m":1,"o":["4.73 m","9.46 m","10.00 m","14.96 m"],"q":"<p>Using Lacey&#x27;s theory, find the regime (normal scour) depth for a river with design flood discharge 1000 m³/s and silt factor f = 1.0. (R = 0.473(Q/f)^(1/3))<\/p>","a":0,"s":"<p>R = 0.473 × (1000/1.0)^(1/3) = 0.473 × 10.0 = 4.73 m.<br>Other options: B — this is 2R, the maximum scour at piers, not the regime depth; C — this leaves out the 0.473; D — this uses a square root instead of a cube root<\/p>","tag":""},{"id":"6.6.11","m":1,"o":["6.22 m","7.90 m","9.33 m","12.44 m"],"q":"<p>As per IRC:78, the mean scour depth is dsm = 1.34(Db²/Ksf)^(1/3). For design discharge per metre width Db = 10 m³/s/m and silt factor Ksf = 1.0, the maximum scour depth below HFL to be used for the design of piers (2 dsm) is:<\/p>","a":3,"s":"<p>dsm = 1.34 × (100)^(1/3) = 1.34 × 4.642 = 6.22 m; at piers, max scour = 2 × 6.22 = 12.44 m.<br>Other options: A — this is the mean scour depth; B — 1.27 dsm is used for abutments; C — 1.5 dsm does not apply here<\/p>","tag":""},{"id":"6.6.12","m":1,"o":["30.0 m","45.9 m","71.2 m","142.5 m"],"q":"<p>Using Lacey&#x27;s regime perimeter P = 4.75√Q, the waterway (taken as P for a wide alluvial river) for a design discharge of 900 m³/s is:<\/p>","a":3,"s":"<p>P = 4.75 × √900 = 4.75 × 30 = 142.5 m.<br>Other options: A — this leaves out the 4.75; B — this uses a cube root; C — this halves the waterway<\/p>","tag":""},{"id":"6.6.13","m":1,"o":["0.060 m","0.071 m","0.126 m","0.134 m"],"q":"<p>A bridge contracts a river, with the unobstructed area A and the contracted area a in the ratio A/a = 1.25. Approach velocity V = 2.0 m/s. Using Molesworth&#x27;s formula h = (V²/17.88 + 0.0152)(A²/a² − 1), the afflux is:<\/p>","a":3,"s":"<p>h = (4/17.88 + 0.0152)(1.5625 − 1) = 0.2389 × 0.5625 = 0.134 m.<br>Other options: A — this uses A/a instead of (A/a)²; B — this uses V instead of V²; C — this leaves out the 0.0152 term<\/p>","tag":""},{"id":"6.6.14","m":1,"o":["Vertical clearance between HFL and the soffit of the deck","Rise of the upstream water level caused by the narrowed waterway","Fall of water level just downstream of the bridge","Depth of scour below the river bed at the piers"],"q":"<p>Afflux at a bridge is the:<\/p>","a":1,"s":"<p>When the bridge narrows the natural waterway, the water heads up upstream. This rise is the afflux, and it affects the HFL, freeboard and scour.<br>Other options: A — this is the clearance or freeboard; C — afflux is measured upstream; D — this is scour depth<\/p>","tag":""},{"id":"6.6.15","m":1,"o":["Remove the need to design piers for scour","Guide the flow smoothly through the bridge and stop the river outflanking it","Store water upstream for irrigation","Raise the high flood level at the bridge"],"q":"<p>Guide bunds (Bell&#x27;s bunds) are built at a bridge site on a wide alluvial river mainly to:<\/p>","a":1,"s":"<p>Guide bunds train a wide, wandering river into a narrower waterway through the bridge, so that it does not attack the approaches or bypass the bridge.<br>Other options: A — scour is still designed for; C — they are not storage works; D — this is not their purpose<\/p>","tag":""},{"id":"6.6.16","m":1,"o":["Runs parallel to the bank along its whole length","Is a short spur at right angles that only changes the flow direction locally","Points upstream and pushes the flow away from the bank","Points downstream and draws the flow towards the bank"],"q":"<p>A repelling spur (groyne) built out from a river bank is one that:<\/p>","a":2,"s":"<p>Repelling groynes point upstream and form a pool of still water upstream of them, which pushes the current away. Attracting groynes point downstream and draw the flow towards the bank.<br>Other options: A — this is a revetment or guide bank; B — this is a deflecting spur; D — this is an attracting spur<\/p>","tag":""},{"id":"6.6.17","m":1,"o":["Settles into the scour hole as the bed scours, covering the slope below the toe","Raises the bed level permanently","Increases the waterway of the bridge","Serves as the road surface on the approach"],"q":"<p>A launching apron laid at the toe of a guide bund or bank revetment:<\/p>","a":0,"s":"<p>Loose stones are laid flat on the bed; as scour deepens, they slide down and form a protective layer on the scoured slope.<br>Other options: B — it settles; it does not raise the bed; C — it does not change the waterway; D — it is a river-protection work<\/p>","tag":""},{"id":"6.6.18","m":1,"o":["Square-ended nose","Rectangular pier set at a skew to the flow","Pointed or semicircular (streamlined) nose","Group of unconnected piles set across the flow"],"q":"<p>Among the following pier nose (cutwater) shapes, the one that causes the least scour and afflux is:<\/p>","a":2,"s":"<p>A streamlined nose lets water flow smoothly round the pier, which cuts down eddies, the horseshoe vortex and scour.<br>Other options: A — square ends cause strong eddies and scour; B — skew increases the blocked width and scour; D — this traps debris and increases scour<\/p>","tag":""},{"id":"6.6.19","m":1,"o":["Wearing coat","Pier","Deck slab","Longitudinal girder"],"q":"<p>Which of the following is part of the substructure of a bridge?<\/p>","a":1,"s":"<p>The substructure (abutments, piers and their foundations) supports the superstructure (deck, girders, wearing coat, parapets).<br>Other options: A — the wearing coat is on the deck; C — the deck slab is part of the superstructure; D — girders are part of the superstructure<\/p>","tag":""},{"id":"6.6.20","m":1,"o":["Circular","Rectangular","Horseshoe","D-shaped with vertical walls"],"q":"<p>For tunnels in soft ground, or tunnels under high external water pressure, the most suitable cross-section is:<\/p>","a":0,"s":"<p>A circle resists uniform radial pressure best, so it is used for soft ground and pressure tunnels (and suits TBMs).<br>Other options: B — rectangles suit cut-and-cover, not deep soft ground; C — horseshoe sections suit moderately good rock; D — the flat or straight parts are weak under external pressure<\/p>","tag":""},{"id":"6.6.21","m":1,"o":["Needs no lining in any rock","Is the best shape for very high internal pressure","Has an arched roof for rock loads and a fairly flat floor for traffic and construction","Is the only shape a TBM can excavate"],"q":"<p>The horseshoe-shaped cross-section is widely used for road and hydropower tunnels in rock because it:<\/p>","a":2,"s":"<p>Its arched crown and sides carry rock loads well, and the wide, flattish invert is convenient for vehicles and haulage.<br>Other options: A — the need for lining depends on the rock quality; B — the circle is best for pressure; D — TBMs cut circular sections<\/p>","tag":""},{"id":"6.6.22","m":1,"o":["Install a very rigid, heavy lining at once to stop all deformation","Use the rock around the tunnel as a load-carrying ring, with early flexible support and monitoring","Excavate only with a full-face tunnel boring machine","Build the tunnel in an open trench and backfill it"],"q":"<p>The basic principle of the New Austrian Tunnelling Method (NATM) is to:<\/p>","a":1,"s":"<p>NATM puts in shotcrete, rock bolts and steel ribs soon after excavation, so the ground can deform a little and carry load itself; convergence is measured to adjust the support.<br>Other options: A — NATM uses flexible early support; C — NATM is used with drill-and-blast or roadheaders; D — this is cut-and-cover<\/p>","tag":""},{"id":"6.6.23","m":1,"o":["Small and medium tunnels in stable, self-supporting rock, using drilling jumbos","Very large tunnels in poor rock","Soft, running ground that needs immediate support","Shallow tunnels in city streets"],"q":"<p>The full-face method of tunnelling is best suited to:<\/p>","a":0,"s":"<p>In good rock, the whole face is drilled and blasted in one go, which gives fast progress with mechanised drilling.<br>Other options: B — these are excavated in parts (heading and bench, drifts); C — soft ground needs shields or heading methods; D — these suit cut-and-cover<\/p>","tag":""},{"id":"6.6.24","m":1,"o":["The tunnel is pushed in as precast segments behind a shield only","The whole face is excavated in one round","The top portion (heading) is excavated first and the lower bench follows behind","Only a small pilot tunnel is excavated and never enlarged"],"q":"<p>In the heading and bench method of tunnelling:<\/p>","a":2,"s":"<p>The heading goes ahead, and the bench is drilled with vertical holes and blasted later, which suits large tunnels or medium-quality rock.<br>Other options: A — this is shield tunnelling; B — this is the full-face method; D — drifts are enlarged later<\/p>","tag":""},{"id":"6.6.25","m":1,"o":["Mucking → drilling → ventilation → charging → blasting → support","Drilling → charging → blasting → ventilation → mucking → scaling and support","Drilling → blasting → charging → support → mucking → ventilation","Charging → drilling → mucking → blasting → ventilation → support"],"q":"<p>The correct sequence of operations in one drill-and-blast cycle of tunnelling is:<\/p>","a":1,"s":"<p>Holes are drilled and charged and the round is fired; fumes are cleared before entry, then the muck is removed, loose rock is scaled and support is installed.<br>Other options: A — mucking follows blasting; C — charging must come before blasting; D — you cannot charge before drilling<\/p>","tag":""},{"id":"6.6.26","m":1,"o":["Lifter holes","Easer holes","Trimmer holes","Cut holes"],"q":"<p>In a tunnel blasting pattern, the holes fired first to open a cavity (free face) at the centre are the:<\/p>","a":3,"s":"<p>Cut holes (wedge, pyramid or burn cut) are fired first to make relief; easers fire next, then the trimmers (perimeter) and lifters (floor).<br>Other options: A — lifters at the floor fire last; B — easers enlarge the opening after the cut; C — trimmers shape the perimeter and fire late<\/p>","tag":""},{"id":"6.6.27","m":1,"o":["2.98 m","8.93 m","10.50 m","12.35 m"],"q":"<p>In a drill-and-blast tunnel, holes are drilled 3.5 m deep and the pull (advance efficiency) is 85%. With 3 rounds per day, the daily advance is:<\/p>","a":1,"s":"<p>Advance per round = 3.5 × 0.85 = 2.975 m; per day = 3 × 2.975 = 8.93 m.<br>Other options: A — this is the advance per round; C — this assumes 100% pull; D — this divides by the efficiency<\/p>","tag":""},{"id":"6.6.28","m":1,"o":["Natural ventilation","Mucking ventilation","Blowing (forced) ventilation","Exhaust ventilation"],"q":"<p>During tunnel construction, a ventilation system in which fresh air is blown through a duct to the working face is called:<\/p>","a":2,"s":"<p>In the blowing system, fresh air is delivered to the face and foul air flows back out along the tunnel. The exhaust system sucks foul air out through the duct.<br>Other options: A — natural ventilation is not enough for long tunnels; B — no such system exists; D — this sucks foul air out of the tunnel<\/p>","tag":""},{"id":"6.6.29","m":1,"o":["To speed up drilling and blasting","To give a smooth surface that cuts down friction losses in water tunnels","To support the surrounding ground","To control seepage of ground water"],"q":"<p>Which of the following is NOT a purpose of tunnel lining?<\/p>","a":0,"s":"<p>Lining supports the ground, keeps water out, gives a smooth surface (less friction in water tunnels) and improves appearance and lighting. It does nothing for blasting.<br>Other options: B — this is a purpose; C — this is a main purpose; D — this is a purpose<\/p>","tag":""},{"id":"6.6.30","m":1,"o":["2,513 m³","5,027 m³","6,400 m³","20,106 m³"],"q":"<p>A circular tunnel is excavated to a diameter of 8 m over a length of 100 m. The volume excavated (ignoring overbreak) is about:<\/p>","a":1,"s":"<p>V = (π/4)D²L = (π/4)×8²×100 = 5,027 m³.<br>Other options: A — this uses πD²/8; C — this uses D² × L (a square section); D — this takes D as the radius<\/p>","tag":""}]}]},{"n":7,"t":"Water Supply and Sanitary Engineering","subs":[{"k":"7.1","t":"Sources, Quantity and Quality of Water","qs":[{"id":"7.1.1","m":1,"o":["79,333","98,000","101,000","116,667"],"q":"<p>The census populations of a town were 42,000 (1991), 50,000 (2001), 61,000 (2011) and 70,000 (2021). By the arithmetic increase method, the expected population in 2051 is:<\/p>","a":1,"s":"<p>Average decadal increase x̄ = (8000 + 11000 + 9000)/3 = 9,333.3. P2051 = 70,000 + 3 × 9,333.3 = 98,000.<br>Other options: A — only one decade added (that is the 2031 figure); C — incremental increase method, not arithmetic; D — geometric projection using the overall 1991–2021 growth factor.<\/p>","tag":""},{"id":"7.1.2","m":1,"o":["98,000","98,750","101,000","102,500"],"q":"<p>The census populations of a town were 42,000 (1991), 50,000 (2001), 61,000 (2011) and 70,000 (2021). By the incremental increase method, the expected population in 2051 is:<\/p>","a":2,"s":"<p>x̄ = 9,333.3; increments of increase are +3000 and −2000, so ȳ = 500. Pn = P + n·x̄ + n(n+1)/2 · ȳ = 70,000 + 3 × 9,333.3 + 6 × 500 = 101,000.<br>Other options: A — the arithmetic value: ȳ term omitted; B — used n/2 instead of n(n+1)/2 for the ȳ term; D — used n² instead of n(n+1)/2.<\/p>","tag":""},{"id":"7.1.3","m":1,"o":["82,600","95,200","97,468","115,012"],"q":"<p>A town had a population of 70,000 in 2021 and is assumed to grow geometrically at a constant 18% per decade. Its population in 2041 will be about:<\/p>","a":2,"s":"<p>P = 70,000 × (1.18)² = 97,468.<br>Other options: A — only one decade projected; B — 18% per decade added arithmetically (1 + 2 × 0.18); D — three decades projected (that is 2051).<\/p>","tag":""},{"id":"7.1.4","m":1,"o":["81 MLD","8.1 MLD","4.5 MLD","0.81 MLD"],"q":"<p>A town of 60,000 people is to be supplied at 135 litres per capita per day (lpcd). The average daily demand is:<\/p>","a":1,"s":"<p>Q = 60,000 × 135 L/d = 8,100,000 L/d = 8.1 million litres per day.<br>Other options: A — decimal slip by a factor of 10; C — uses 75 lpcd instead of 135 lpcd; D — decimal slip by a factor of 10.<\/p>","tag":""},{"id":"7.1.5","m":1,"o":["148%","180%","247%","270%"],"q":"<p>Goodrich&#x27;s formula gives the percentage of the annual average demand as p = 180 t^(−0.10), where t is the period in days. The peak hourly demand (t = 1/24 day) as a percentage of the annual average is about:<\/p>","a":2,"s":"<p>p = 180 × (1/24)^(−0.10) = 180 × 24^0.10 = 247%.<br>Other options: A — t = 7 days: the maximum weekly demand; B — t = 1 day: the maximum daily demand; D — the 1.8 × 1.5 rule of thumb, not Goodrich&#x27;s formula.<\/p>","tag":""},{"id":"7.1.6","m":1,"o":["33 MLD","27 MLD","18 MLD","15 MLD"],"q":"<p>For a town with an average demand of 10 MLD, taking maximum daily demand = 1.8 × average and maximum hourly demand = 1.5 × maximum daily, the maximum hourly demand rate is:<\/p>","a":1,"s":"<p>Peak hourly = 1.8 × 1.5 × 10 = 2.7 × 10 = 27 MLD (expressed as a daily rate).<br>Other options: A — factors added (1.8 + 1.5) instead of multiplied; C — maximum daily demand only; D — factor 1.5 applied to the average.<\/p>","tag":""},{"id":"7.1.7","m":1,"o":["78 mg/L","150 mg/L","187 mg/L","224 mg/L"],"q":"<p>A water contains Ca²⁺ = 60 mg/L and Mg²⁺ = 18 mg/L (equivalent weights 20 and 12.15; CaCO₃ = 50). Its total hardness as CaCO₃ is about:<\/p>","a":3,"s":"<p>Ca: 60 × 50/20 = 150; Mg: 18 × 50/12.15 = 74; total ≈ 224 mg/L as CaCO₃.<br>Other options: A — ion concentrations simply added without conversion to CaCO₃; B — calcium hardness only; C — atomic weight of Mg (24.3) used instead of its equivalent weight.<\/p>","tag":""},{"id":"7.1.8","m":1,"o":["70 mg/L","180 mg/L","250 mg/L","430 mg/L"],"q":"<p>A water has total hardness 250 mg/L and total alkalinity 180 mg/L, both as CaCO₃. Its non-carbonate hardness is:<\/p>","a":0,"s":"<p>When total hardness &gt; alkalinity, carbonate hardness = alkalinity = 180 mg/L, so non-carbonate hardness = 250 − 180 = 70 mg/L.<br>Other options: B — this is the carbonate (temporary) hardness; C — total hardness; D — added instead of subtracted.<\/p>","tag":""},{"id":"7.1.9","m":1,"o":["0.01","1.33","2","100"],"q":"<p>The hydrogen-ion concentration of a water sample at pH 6 is how many times that of a sample at pH 8?<\/p>","a":3,"s":"<p>[H⁺] = 10^(−pH); ratio = 10^(−6)/10^(−8) = 10² = 100.<br>Other options: A — ratio inverted; B — ratio of pH values 8/6; C — pH difference taken as a linear ratio.<\/p>","tag":""},{"id":"7.1.10","m":1,"o":["0.125","7","8","175"],"q":"<p>In a threshold odour test, odour is just detectable when 25 mL of sample is diluted with odour-free water to a total volume of 200 mL. The threshold odour number (TON) is:<\/p>","a":2,"s":"<p>TON = (A + B)/A = 200/25 = 8, where A = sample volume and B = dilution water volume (175 mL).<br>Other options: A — ratio inverted; B — B/A used instead of (A + B)/A; D — volume of dilution water, not a ratio.<\/p>","tag":""},{"id":"7.1.11","m":1,"o":["0.5 mg/L","0.05 mg/L","0.01 mg/L","0.005 mg/L"],"q":"<p>As per Nepal Drinking Water Quality Standards (NDWQS) 2062, the maximum permissible concentration of arsenic in drinking water is:<\/p>","a":1,"s":"<p>NDWQS 2062 sets arsenic at 0.05 mg/L (an interim national value; the WHO guideline is 0.01 mg/L). Arsenic is a major concern in Terai tube wells.<br>Other options: A — ten times too high; C — the WHO guideline value, stricter than NDWQS 2062; D — ten times lower than the standard.<\/p>","tag":""},{"id":"7.1.12","m":1,"o":["1 µg/L","10 µg/L","50 µg/L","100 µg/L"],"q":"<p>The WHO Guidelines for Drinking-water Quality give a (provisional) guideline value for arsenic of:<\/p>","a":1,"s":"<p>WHO guideline value for arsenic = 0.01 mg/L = 10 µg/L.<br>Other options: A — ten times too low; C — 0.05 mg/L is the NDWQS 2062 value; D — ten times too high.<\/p>","tag":""},{"id":"7.1.13","m":1,"o":["5 NTU, or 10 NTU where no better source exists","1 NTU at all times, with no relaxation allowed","25 NTU","50 NTU, or 100 NTU during the monsoon season"],"q":"<p>As per NDWQS 2062, the turbidity standard for drinking water is:<\/p>","a":0,"s":"<p>NDWQS 2062 lists turbidity as 5 (10) NTU — the bracketed value is the maximum when no alternative exists.<br>Other options: B — a treatment-plant performance target, not the NDWQS value; C — far too turbid; visibly cloudy water; D — no such provision; this would be raw river water.<\/p>","tag":""},{"id":"7.1.14","m":1,"o":["6.0 – 9.0","7.0 – 8.0","5.5 – 7.5","6.5 – 8.5"],"q":"<p>As per NDWQS 2062, the acceptable pH range of drinking water is:<\/p>","a":3,"s":"<p>NDWQS 2062 (like many standards) specifies pH 6.5–8.5.<br>Other options: A — too wide; that range is closer to effluent discharge limits; B — too narrow; C — would allow corrosive acidic water.<\/p>","tag":""},{"id":"7.1.15","m":1,"o":["Methaemoglobinaemia (blue-baby syndrome)","Dental fluorosis (mottling of tooth enamel)","Goitre","Arsenicosis"],"q":"<p>Infants fed with formula prepared from water containing excessive nitrate are at risk of:<\/p>","a":0,"s":"<p>Nitrate is reduced to nitrite, which converts haemoglobin to methaemoglobin that cannot carry oxygen. WHO guideline is 50 mg/L as NO₃⁻.<br>Other options: B — caused by excess fluoride; C — linked to iodine deficiency; D — caused by arsenic, not nitrate.<\/p>","tag":""},{"id":"7.1.16","m":1,"o":["Dental caries","Methaemoglobinaemia","A laxative effect but no harm to bones or teeth","Dental and skeletal fluorosis"],"q":"<p>Prolonged consumption of water with fluoride well above 1.5 mg/L leads to:<\/p>","a":3,"s":"<p>Fluoride around 0.5–1.5 mg/L (the NDWQS 2062 range) protects teeth; much higher values mottle enamel and harden/deform bones.<br>Other options: A — caused by fluoride deficiency (below about 0.5 mg/L); B — caused by nitrate; C — associated with high sulphate/magnesium.<\/p>","tag":""},{"id":"7.1.17","m":1,"o":["0 (must not be detectable)","Up to 10","Up to 3","Up to 1 in 50% of samples"],"q":"<p>Under both the WHO guidelines and NDWQS 2062, the permissible count of E. coli (or thermotolerant coliforms) in any 100 mL sample of drinking water is:<\/p>","a":0,"s":"<p>Faecal indicator bacteria must be absent from every 100 mL sample of water for drinking.<br>Other options: B — would indicate faecal contamination; C — no positive count is allowed for E. coli; D — no such allowance for E. coli.<\/p>","tag":""},{"id":"7.1.18","m":1,"o":["Are the main cause of water-borne epidemics such as cholera and typhoid in towns","Are killed more easily by chlorine than viruses and cysts","Are abundant in faeces, easy to detect and outlive most pathogens","Occur naturally only in deep groundwater"],"q":"<p>Coliform bacteria are used as indicator organisms for drinking water mainly because they:<\/p>","a":2,"s":"<p>An indicator should always be present when faecal pollution is present, be easy to culture and outlive common pathogens; coliforms (especially E. coli) satisfy this.<br>Other options: A — most coliforms are harmless; they only indicate pollution; B — this is a weakness of the indicator, not the reason for its use; D — they come from the gut of warm-blooded animals.<\/p>","tag":""},{"id":"7.1.19","m":1,"o":["Confirmed test → presumptive test → completed test","Completed test → confirmed test → presumptive test","Presumptive test → completed test → confirmed test","Presumptive test → confirmed test → completed test"],"q":"<p>The correct sequence of the multiple-tube fermentation (MPN) test for coliforms is:<\/p>","a":3,"s":"<p>Lactose broth (presumptive, gas production) → brilliant green bile broth (confirmed) → EMB/agar plating and Gram stain (completed).<br>Other options: A — presumptive screening comes first; B — reverse order; C — confirmation precedes completion.<\/p>","tag":""},{"id":"7.1.20","m":1,"o":["9 per 100 mL","18 per 100 mL","36 per 100 mL","360 per 100 mL"],"q":"<p>In a membrane-filter test, 50 mL of water is filtered and 18 coliform colonies develop on the membrane. The coliform count is:<\/p>","a":2,"s":"<p>Count per 100 mL = colonies × 100 / volume filtered = 18 × 100/50 = 36.<br>Other options: A — multiplied by 50/100 instead of 100/50; B — volume filtered taken as 100 mL; D — factor of 10 slip.<\/p>","tag":""},{"id":"7.1.21","m":1,"o":["4,283 m³/day","1,860 m³/day","808 m³/day","207 m³/day"],"q":"<p>A well of radius 0.15 m fully penetrates an unconfined aquifer of saturated thickness 25 m (K = 20 m/day). At steady pumping the water depth in the well is 20 m and the radius of influence is 300 m. Using Dupuit&#x27;s equation, the discharge is about:<\/p>","a":1,"s":"<p>Q = πK(H² − h²)/ln(R/r) = π × 20 × (625 − 400)/ln(2000) = 1,860 m³/day.<br>Other options: A — log₁₀(R/r) used without the 2.303 factor; C — ln(R/r) wrongly multiplied by 2.303; D — (H − h)² used instead of (H² − h²).<\/p>","tag":""},{"id":"7.1.22","m":1,"o":["964 m³/day","1,927 m³/day","4,438 m³/day","7,709 m³/day"],"q":"<p>A well of radius 0.2 m in a confined aquifer 15 m thick (K = 40 m/day) has a steady drawdown of 4 m relative to the radius of influence of 500 m. Its discharge (Thiem) is about:<\/p>","a":1,"s":"<p>Q = 2πKb·s/ln(R/r) = 2π × 40 × 15 × 4/ln(2500) = 1,927 m³/day.<br>Other options: A — factor 2 omitted (πKbs); C — log₁₀ used without the 2.303 factor; D — drawdown squared.<\/p>","tag":""},{"id":"7.1.23","m":1,"o":["92.0 m³/h","27.6 m³/h","23.0 m³/h","10.0 m³/h"],"q":"<p>In a recuperation test on an open well of 4 m diameter, the depression head of 3 m recovers to 1 m in 90 minutes. The safe yield of the well under a working depression head of 2.5 m is about:<\/p>","a":2,"s":"<p>K/A = (2.303/T) log₁₀(s₁/s₂) = (2.303/1.5) log₁₀3 = 0.732 h⁻¹; Q = (K/A) × area × H = 0.732 × 12.57 × 2.5 = 23.0 m³/h.<br>Other options: A — area taken as π × D² instead of πD²/4; B — used the initial depression of 3 m instead of the working head; D — 2.303 factor omitted.<\/p>","tag":""},{"id":"7.1.24","m":1,"o":["Aquiclude","Aquifer","Aquitard","Aquifuge"],"q":"<p>A geological formation that is porous and can hold water but cannot transmit it in useful quantities (e.g. clay) is called an:<\/p>","a":0,"s":"<p>Aquiclude: porous but practically impermeable. Aquifer stores and yields water; aquitard leaks slowly; aquifuge (solid granite) neither holds nor transmits.<br>Other options: B — yields water freely; C — transmits water, though slowly; D — neither porous nor permeable.<\/p>","tag":""},{"id":"7.1.25","m":1,"o":["Porosity","Permeability","Storage coefficient of a confined aquifer","Void ratio"],"q":"<p>For an unconfined aquifer material, the sum of specific yield and specific retention equals the:<\/p>","a":0,"s":"<p>Of the total pore water (porosity), part drains by gravity (specific yield) and part is held by surface tension (specific retention).<br>Other options: B — a flow property, not a volume ratio; C — governed by compressibility, much smaller; D — void ratio = e = n/(1 − n), not n.<\/p>","tag":""},{"id":"7.1.26","m":1,"o":["2,227 L/min","22,274 L/min","155,918 L/min","704,366 L/min"],"q":"<p>Using Kuichling&#x27;s formula Q = 3182√P (Q in L/min, P = population in thousands), the fire demand for a city of 49,000 people is:<\/p>","a":1,"s":"<p>Q = 3182 × √49 = 3182 × 7 = 22,274 L/min.<br>Other options: A — decimal slip; C — square root not taken; D — P entered in persons instead of thousands.<\/p>","tag":""},{"id":"7.1.27","m":1,"o":["Gravity (depression) spring","Surface (contact) spring","Hot spring","Artesian spring"],"q":"<p>A spring formed where water confined under pressure beneath an impervious layer escapes to the surface through a fissure is a/an:<\/p>","a":3,"s":"<p>Artesian springs are fed by confined aquifers under hydrostatic pressure; they are usually perennial with steady yield.<br>Other options: A — occurs where the water table intersects a ground depression, without confining pressure; B — occurs at the contact of a permeable bed overlying an impervious one on a slope; C — classified by temperature, not by mechanism.<\/p>","tag":""},{"id":"7.1.28","m":1,"o":["A vertical shaft sunk into a confined aquifer","A masonry tower built in a reservoir, with inlet ports at several different levels","A shallow open well lined with brick","A horizontal perforated conduit laid in permeable strata beside a river"],"q":"<p>An infiltration gallery is best described as:<\/p>","a":3,"s":"<p>Infiltration galleries intercept water filtering through river-bed sand, giving naturally pre-filtered water.<br>Other options: A — that is a tube well; B — that is a reservoir intake tower; C — that is an open (dug) well.<\/p>","tag":""},{"id":"7.1.29","m":1,"o":["Bicarbonates of calcium and magnesium","Sulphates and chlorides of calcium and magnesium","Sodium chloride","Dissolved carbon dioxide"],"q":"<p>Temporary hardness of water is caused mainly by:<\/p>","a":0,"s":"<p>Bicarbonate hardness is removed by boiling (CaCO₃ precipitates), hence &#x27;temporary&#x27;.<br>Other options: B — these cause permanent (non-carbonate) hardness; C — sodium does not cause hardness; D — CO₂ causes acidity/corrosion, not hardness.<\/p>","tag":""},{"id":"7.1.30","m":1,"o":["Cause methaemoglobinaemia","Make the water hard","Cause brownish-black stains on laundry and fixtures","Are acutely toxic to human health even at these low concentrations"],"q":"<p>Iron and manganese present above their aesthetic limits in a supply are objectionable mainly because they:<\/p>","a":2,"s":"<p>These are aesthetic parameters; they also promote iron bacteria and deposits in pipes.<br>Other options: A — caused by nitrate; B — hardness is due to Ca and Mg; D — they are aesthetic, not acute-health, limits.<\/p>","tag":""}]},{"k":"7.2","t":"Intake Works, Conveyance, Valves and Fittings","qs":[{"id":"7.2.1","m":1,"o":["2.5 m","6.4 m","12.7 m","186 m"],"q":"<p>Water flows at 80 L/s through a 300 mm diameter, 1500 m long main (Hazen–Williams C = 130). Using hf = 10.67 L Q^1.852 / (C^1.852 D^4.87) in SI units, the head loss is about:<\/p>","a":1,"s":"<p>hf = 10.67 × 1500 × 0.08^1.852 / (130^1.852 × 0.3^4.87) = 6.37 m.<br>Other options: A — exponents 2 and 5 used in place of 1.852 and 4.87; C — doubled — length taken as 3000 m; D — radius (0.15 m) used for diameter.<\/p>","tag":""},{"id":"7.2.2","m":1,"o":["36.70 m","18.35 m","9.17 m","6.12 m"],"q":"<p>A 200 mm pipe, 800 m long, carries water at 1.5 m/s. Taking Darcy friction factor f = 0.02 (hf = fLV²/2gD), the head loss is:<\/p>","a":2,"s":"<p>hf = 0.02 × 800 × 1.5² / (2 × 9.81 × 0.2) = 9.17 m.<br>Other options: A — f taken as 4f (Fanning confusion); B — factor 2 in the denominator omitted; D — V not squared.<\/p>","tag":""},{"id":"7.2.3","m":1,"o":["0.31 m","0.49 m","0.61 m","1.22 m"],"q":"<p>Using Lea&#x27;s formula D = 1.22√Q (D in m, Q in m³/s), the economical diameter of a pumping main carrying 0.25 m³/s is:<\/p>","a":2,"s":"<p>D = 1.22 × √0.25 = 1.22 × 0.5 = 0.61 m.<br>Other options: A — used 1.22 × Q (no square root); B — lower coefficient 0.97 used; D — √0.25 taken as 1.<\/p>","tag":""},{"id":"7.2.4","m":1,"o":["92 m","183 m","275 m","1800 m"],"q":"<p>Flow at 1.5 m/s in a pipeline is stopped instantaneously. If the pressure wave speed is 1200 m/s, the rise in pressure head (Joukowsky) is about:<\/p>","a":1,"s":"<p>ΔH = cV/g = 1200 × 1.5/9.81 = 183 m of water.<br>Other options: A — cV/2g used; C — V squared; D — g omitted (that is cV in m²/s, not a head).<\/p>","tag":""},{"id":"7.2.5","m":1,"o":["0.67 s","1.5 s","3 s","6 s"],"q":"<p>For a 1800 m long pipeline with pressure wave speed 1200 m/s, valve closure is &#x27;rapid&#x27; (full water hammer develops) if the closure time is less than:<\/p>","a":2,"s":"<p>Critical time Tc = 2L/c = 2 × 1800/1200 = 3 s.<br>Other options: A — c/L used upside down; B — L/c — the one-way travel time; D — 4L/c — the full wave period.<\/p>","tag":""},{"id":"7.2.6","m":1,"o":["4.0 kW","22.1 kW","29.4 kW","39.2 kW"],"q":"<p>A pump lifts 50 L/s against a total head of 60 m with an overall efficiency of 75%. The power input required is about:<\/p>","a":3,"s":"<p>P = ρgQH/η = 1000 × 9.81 × 0.05 × 60 / 0.75 = 39,240 W ≈ 39.2 kW.<br>Other options: A — g omitted; B — multiplied by η instead of dividing; C — efficiency ignored (water power only).<\/p>","tag":""},{"id":"7.2.7","m":1,"o":["12 mm","6 mm","3 mm","0.6 mm"],"q":"<p>A 600 mm diameter pipe carries water at an internal pressure of 1.5 N/mm². If the allowable hoop stress of the pipe material is 75 N/mm², the required wall thickness (thin-cylinder theory) is:<\/p>","a":1,"s":"<p>t = pD/(2σ) = 1.5 × 600/(2 × 75) = 6 mm.<br>Other options: A — pD/σ — the factor 2 omitted; C — radius used in pD/2σ; D — decimal slip.<\/p>","tag":""},{"id":"7.2.8","m":1,"o":["10 m","51 m","102 m","1020 m"],"q":"<p>An HDPE pipe of pressure class PN 10 is rated for a nominal working pressure equivalent to a water head of about:<\/p>","a":2,"s":"<p>PN 10 = 10 bar = 10 × 10⁵ Pa; head = p/γw = 10⁶/9810 = 102 m.<br>Other options: A — bar confused with metre; B — half the rating; D — factor of 10 slip.<\/p>","tag":""},{"id":"7.2.9","m":1,"o":["3,637 m","1,500 m","1,000 m","653 m"],"q":"<p>A pipeline consists of 600 m of 300 mm pipe followed by 400 m of 200 mm pipe (same friction factor). The equivalent length of 300 mm pipe (Darcy, hf ∝ L/D⁵) is about:<\/p>","a":0,"s":"<p>Le = 600 + 400 × (0.3/0.2)⁵ = 600 + 400 × 7.59 = 3,637 m.<br>Other options: B — diameter ratio squared instead of fifth power; C — lengths just added; D — ratio inverted.<\/p>","tag":""},{"id":"7.2.10","m":1,"o":["1/2 of the original","1/4 of the original","1/16 of the original","1/32 of the original"],"q":"<p>For the same discharge and friction factor, if a pipe&#x27;s diameter is doubled, the Darcy–Weisbach head loss becomes:<\/p>","a":3,"s":"<p>With Q fixed, V ∝ 1/D², so hf = fLV²/2gD ∝ 1/D⁵; doubling D divides hf by 2⁵ = 32.<br>Other options: A — only the D in the denominator considered; B — hf ∝ 1/D² assumed; C — hf ∝ 1/D⁴ assumed (the 1/D in fLV²/2gD forgotten).<\/p>","tag":""},{"id":"7.2.11","m":1,"o":["20%","40%","44%","73%"],"q":"<p>In a pipe obeying the Hazen–Williams formula (hf ∝ Q^1.852), increasing the discharge by 20% increases the head loss by about:<\/p>","a":1,"s":"<p>hf₂/hf₁ = 1.2^1.852 = 1.402, i.e. about 40% more.<br>Other options: A — linear relation assumed; C — hf ∝ Q² assumed; D — exponent 3 assumed.<\/p>","tag":""},{"id":"7.2.12","m":1,"o":["0.42 m/s","1.70 m/s","2.55 m/s","6.79 m/s"],"q":"<p>A 150 mm diameter pipe carries 30 L/s. The mean flow velocity is about:<\/p>","a":1,"s":"<p>V = Q/A = 0.03 / (π × 0.15²/4) = 1.70 m/s.<br>Other options: A — area taken as πD² instead of πD²/4; C — arithmetic slip; D — radius used as diameter in πD²/4.<\/p>","tag":""},{"id":"7.2.13","m":1,"o":["Reset the static pressure to atmospheric so that pipes are not over-pressured","Store water for fire fighting","Treat water by plain sedimentation","Increase the flow velocity and hence the discharge in the next pipe section downstream"],"q":"<p>In gravity water supply schemes in the hills of Nepal, break-pressure tanks are provided along the transmission main mainly to:<\/p>","a":0,"s":"<p>A BPT is an open (vented) chamber; the static pressure downstream restarts from zero, allowing lower-class (e.g. HDPE) pipes.<br>Other options: B — storage is the job of the reservoir tank; C — detention in a BPT is too short; D — it dissipates energy, not adds it.<\/p>","tag":""},{"id":"7.2.14","m":1,"o":["Lowest points of the pipeline profile","Immediately downstream of every bend and every tee junction","At the pump suction only","Summits (high points) of the pipeline profile"],"q":"<p>Air-release valves on a pipeline are installed at:<\/p>","a":3,"s":"<p>Air collects at high points and can block flow (air lock); air valves release it and admit air when the pipe drains.<br>Other options: A — scour (wash-out) valves go there; B — thrust blocks, not air valves, are needed at bends; C — a foot valve is placed there.<\/p>","tag":""},{"id":"7.2.15","m":1,"o":["Low points, to drain the pipe and flush out sediment","Summits, to release trapped air","At every junction, so that branch lines can be isolated","Pump outlets, to prevent reverse flow"],"q":"<p>Scour (wash-out) valves on a water main are provided at:<\/p>","a":0,"s":"<p>Sediment settles at depressions; scour valves allow emptying for repair and flushing.<br>Other options: B — that is the air valve&#x27;s function; C — sluice (gate) valves do this; D — a check (reflux) valve does this.<\/p>","tag":""},{"id":"7.2.16","m":1,"o":["Sluice valve","Air valve","Pressure-relief valve","Check (reflux / non-return) valve"],"q":"<p>The valve fitted on the delivery side of a pump to prevent reverse flow when the pump stops is the:<\/p>","a":3,"s":"<p>It opens with forward flow and closes automatically on flow reversal, protecting the pump.<br>Other options: A — manually operated isolating valve; B — releases air at summits; C — opens on excess pressure, not on reversal.<\/p>","tag":""},{"id":"7.2.17","m":1,"o":["Isolate sections of mains for repair and regulate flow","Release entrapped air","Prevent water from flowing back into the main when the pump stops","Maintain a constant water level in a tank"],"q":"<p>Sluice (gate) valves in a distribution network are mainly used to:<\/p>","a":0,"s":"<p>They divide the network into blocks so a section can be shut off with minimum disruption.<br>Other options: B — air valve; C — check valve; D — float (ball) valve.<\/p>","tag":""},{"id":"7.2.18","m":1,"o":["Pressure-relief valve","Butterfly valve","Pressure-reducing valve","Foot valve"],"q":"<p>A valve that automatically lowers and holds a constant downstream pressure, whatever the upstream pressure, is a:<\/p>","a":2,"s":"<p>PRVs throttle flow to keep the downstream pressure at a set value; used in low-lying zones of gravity systems.<br>Other options: A — it vents excess pressure (opens at a set upstream pressure); B — a quarter-turn isolating/throttling valve with no automatic control; D — a non-return valve at the pump suction.<\/p>","tag":""},{"id":"7.2.19","m":1,"o":["Gate valve","Scour valve","Altitude valve","Float (ball) valve"],"q":"<p>The valve that closes the inlet of a storage tank automatically when the water reaches the full level is the:<\/p>","a":3,"s":"<p>A float rises with the water level and shuts the inlet.<br>Other options: A — manual operation; B — drains the main; C — controls tank levels from the main&#x27;s pressure, not by a float.<\/p>","tag":""},{"id":"7.2.20","m":1,"o":["Keep the suction pipe primed and keep out debris","Reduce water-hammer pressures in the long delivery main","Control the delivery head","Admit air into the pipe"],"q":"<p>A foot valve with a strainer is fitted at the lower end of a pump&#x27;s suction pipe to:<\/p>","a":0,"s":"<p>It is a non-return valve that holds the water column when the pump stops, so the pump does not lose prime.<br>Other options: B — surge devices do this; C — delivery valve regulates flow; D — air valve function.<\/p>","tag":""},{"id":"7.2.21","m":1,"o":["Butt fusion (heat) welding or compression fittings","Lead-caulked spigot and socket joints","Screwed (threaded) sockets","Solvent cement"],"q":"<p>HDPE pipes commonly used in rural water supply in Nepal are usually joined by:<\/p>","a":0,"s":"<p>HDPE cannot be threaded or solvent-cemented reliably; heated ends are fused together or compression couplers used.<br>Other options: B — used for cast-iron pipes; C — used for GI pipes; D — used for uPVC, not HDPE.<\/p>","tag":""},{"id":"7.2.22","m":1,"o":["Bitumen, to resist abrasion","Zinc, to resist corrosion","Cement mortar, to increase strength","Tin, to improve flow"],"q":"<p>GI (galvanised iron) pipes are coated with:<\/p>","a":1,"s":"<p>Galvanising is a zinc coating on mild-steel pipe; GI pipes are joined with threaded sockets and are used for house connections and exposed sections.<br>Other options: A — bitumen coats some DI/steel pipes; C — cement lining is for DI/steel mains; D — tin coating is not used.<\/p>","tag":""},{"id":"7.2.23","m":1,"o":["They need no internal lining or external protective coating of any kind","They are lighter than HDPE pipes","Their nodular graphite gives higher tensile strength and ductility","They are immune to corrosion"],"q":"<p>Ductile iron (DI) pipes are preferred over grey cast iron (CI) pipes because:<\/p>","a":2,"s":"<p>DI is tougher and less brittle, so thinner, lighter pipes resist impact and higher pressure.<br>Other options: A — DI mains are normally cement-mortar lined; B — DI is far heavier than HDPE; D — external protection is still required.<\/p>","tag":""},{"id":"7.2.24","m":1,"o":["The tower is able to resist wind, wave and earthquake loads safely","Sediment is flushed out of the reservoir","The pumps can operate without priming","Water of the best quality can be drawn at any reservoir level"],"q":"<p>In an impounding reservoir, an intake tower is provided with inlet ports at several levels so that:<\/p>","a":3,"s":"<p>Quality varies with depth (algae near the surface, silt and anoxic water near the bottom); multi-level ports allow selection.<br>Other options: A — structural issue, not the purpose of ports; B — done by scour sluices in the dam; C — unrelated to port levels.<\/p>","tag":""},{"id":"7.2.25","m":1,"o":["Upstream of the town and of any sewage or industrial outfall","Immediately downstream of the town&#x27;s sewage outfall","Where the river is shallowest","At any point, since treatment removes all pollution"],"q":"<p>A river intake for a town water supply should preferably be located:<\/p>","a":0,"s":"<p>Upstream siting gives cleaner water; the site must also draw water in the driest season and be safe from floods and erosion.<br>Other options: B — worst-quality water; C — may go dry in the lean season; D — treatment load and risk increase.<\/p>","tag":""},{"id":"7.2.26","m":1,"o":["Every straight pipe joint","Bends, tees, reducers and dead ends","Only at air valves","Only at the pump house"],"q":"<p>Concrete thrust (anchor) blocks are provided on pressure pipelines at:<\/p>","a":1,"s":"<p>At changes of direction or section, unbalanced hydraulic thrust would pull joints apart; blocks transfer it to soil.<br>Other options: A — straight runs have balanced thrust; C — air valves do not create large thrust; D — thrust acts at every fitting that changes the flow.<\/p>","tag":""},{"id":"7.2.27","m":1,"o":["0.02 m/km","2 m/km","20 m/km","80 m/km"],"q":"<p>A gravity main runs from an intake at RL 1500 m to a reservoir tank at RL 1420 m, with a pipe length of 4 km. Ignoring minor losses and residual head, the maximum allowable friction loss per km is:<\/p>","a":2,"s":"<p>Available head = 1500 − 1420 = 80 m over 4 km → 80/4 = 20 m per km (hydraulic gradient 2%).<br>Other options: A — gradient written as a fraction; B — gradient 2% read as 2 m/km; D — whole head assigned to 1 km.<\/p>","tag":""},{"id":"7.2.28","m":1,"o":["Closing valves as quickly as possible","Using pipes with a higher elastic modulus so that they do not expand","Increasing the flow velocity","Closing valves slowly and providing surge tanks or air vessels"],"q":"<p>Water-hammer pressures in a long pipeline can be reduced by:<\/p>","a":3,"s":"<p>Slow closure (longer than 2L/c) and surge devices absorb the pressure wave.<br>Other options: A — makes the surge worse; B — a stiffer pipe raises wave speed and surge pressure; C — ΔH = cV/g grows with V.<\/p>","tag":""},{"id":"7.2.29","m":1,"o":["Negative pressure there, leading to air locking and reduced flow","Higher flow due to siphon action without any problem","Water hammer at the summit","Bursting of the pipe at that point due to excessive internal pressure"],"q":"<p>If a gravity main rises above the hydraulic gradient line at some point, the likely result is:<\/p>","a":0,"s":"<p>Where the pipe is above the HGL, pressure is negative; dissolved air comes out and blocks the section.<br>Other options: B — siphoning is unreliable and needs priming; C — water hammer comes from sudden velocity change; D — pressure there is low, not high.<\/p>","tag":""},{"id":"7.2.30","m":1,"o":["42.1 L/s","59.5 L/s","72.2 L/s","238.2 L/s"],"q":"<p>A 250 mm main, 1000 m long, has an available head loss of 6 m. With Darcy f = 0.02, the discharge is about:<\/p>","a":1,"s":"<p>V = √(2g·D·hf/(fL)) = √(2 × 9.81 × 0.25 × 6/(0.02 × 1000)) = 1.213 m/s; Q = V × πD²/4 = 59.5 L/s.<br>Other options: A — factor 2 in 2g omitted; C — V² used in place of V; D — area taken as πD².<\/p>","tag":""}]},{"k":"7.3","t":"Water Treatment","qs":[{"id":"7.3.1","m":1,"o":["0.36 mm/s","0.58 mm/s","6.45 mm/s","35.8 mm/s"],"q":"<p>Using Stokes&#x27; law, the settling velocity of a discrete sand particle of diameter 0.02 mm and specific gravity 2.65 in water at 20 °C (ν = 1.004 × 10⁻⁶ m²/s, g = 9.81 m/s²) is about:<\/p>","a":0,"s":"<p>vs = g(Gs − 1)d²/(18ν) = 9.81 × 1.65 × (2 × 10⁻⁵)² / (18 × 1.004 × 10⁻⁶) = 0.358 × 10⁻³ m/s ≈ 0.36 mm/s.<br>Other options: B — Gs used instead of (Gs − 1); C — 18 in the denominator omitted; D — diameter taken as 0.2 mm.<\/p>","tag":""},{"id":"7.3.2","m":1,"o":["6.7 m³/m²/day","20 m³/m²/day","200 m³/m²/day","600 m³/m²/day"],"q":"<p>A rectangular plain sedimentation tank, 30 m long and 10 m wide, treats 6 MLD. Its surface overflow rate is:<\/p>","a":1,"s":"<p>SOR = Q/plan area = 6000 m³/day / (30 × 10) m² = 20 m³/m²/day.<br>Other options: A — flow divided by tank volume (900 m³), which gives a rate per day, not an overflow rate; C — area taken as 30 m² (length only); D — divided by width only.<\/p>","tag":""},{"id":"7.3.3","m":1,"o":["0.15 hours","1.2 hours","3.6 hours","9.0 hours"],"q":"<p>A sedimentation tank 30 m × 10 m × 3 m effective depth treats 6 MLD. The detention time is:<\/p>","a":2,"s":"<p>t = V/Q = 900 m³ / 6000 m³/day = 0.15 day = 3.6 h.<br>Other options: A — answer in days written as hours; B — depth taken as 1 m; D — 0.15 day converted with 60 instead of 24.<\/p>","tag":""},{"id":"7.3.4","m":1,"o":["0.5%","43.2%","56.8%","100%"],"q":"<p>An ideal settling tank has a surface overflow rate of 20 m³/m²/day. The percentage removal of discrete particles having a settling velocity of 0.1 mm/s is:<\/p>","a":1,"s":"<p>vs = 0.1 mm/s = 8.64 m/day; since vs &lt; SOR, fraction removed = vs/SOR = 8.64/20 = 43.2%.<br>Other options: A — units not converted (0.1 mm/s vs 20 m/day); C — fraction passing, not removed; D — would be true only if vs ≥ SOR.<\/p>","tag":""},{"id":"7.3.5","m":1,"o":["0.6 kg/day","24 kg/day","240 kg/day","2400 kg/day"],"q":"<p>Jar tests show an optimum alum dose of 20 mg/L for a plant treating 12 MLD. The daily alum requirement is:<\/p>","a":2,"s":"<p>Mass = dose × flow = 20 mg/L × 12 × 10⁶ L/day = 240 × 10⁶ mg = 240 kg/day.<br>Other options: A — dose divided by flow; B — factor 10 slip; D — factor 10 slip.<\/p>","tag":""},{"id":"7.3.6","m":1,"o":["1.58 s⁻¹","30 s⁻¹","50 s⁻¹","2500 s⁻¹"],"q":"<p>A flocculator of volume 600 m³ receives a power input of 1.5 kW. Taking μ = 1.0 × 10⁻³ N·s/m², the mean velocity gradient G is:<\/p>","a":2,"s":"<p>G = √(P/(μV)) = √(1500 / (10⁻³ × 600)) = √2500 = 50 s⁻¹.<br>Other options: A — power in kW not converted to W; B — V placed in the numerator; D — square root not taken.<\/p>","tag":""},{"id":"7.3.7","m":1,"o":["25","1,500","3,000","90,000"],"q":"<p>A flocculator operates at G = 50 s⁻¹ with a detention time of 30 minutes. The dimensionless product Gt (Camp number) is:<\/p>","a":3,"s":"<p>Gt = 50 × 30 × 60 = 90,000 (within the usual 10⁴ – 10⁵ range for flocculation).<br>Other options: A — t in hours; B — time used in minutes; C — time taken as 60 s.<\/p>","tag":""},{"id":"7.3.8","m":1,"o":["Chlorine demand of the water","Filtration rate of a rapid sand filter","Hardness of raw water","Optimum dose of coagulant"],"q":"<p>The jar test in a water treatment plant is used to determine the:<\/p>","a":3,"s":"<p>Samples in jars receive different coagulant doses, are flash-mixed, flocculated and settled; the dose giving the clearest supernatant is chosen.<br>Other options: A — found by a chlorine demand test; B — fixed by design; C — found by EDTA titration.<\/p>","tag":""},{"id":"7.3.9","m":1,"o":["100–200 litres/hour/m²","3000–6000 litres/hour/m²","10–20 litres/hour/m²","20,000–30,000 litres/hour/m²"],"q":"<p>The usual rate of filtration of a slow sand filter is:<\/p>","a":0,"s":"<p>Slow sand filters run at about 100–200 L/h/m² (2.4–4.8 m³/m²/day), roughly 1/30 of a rapid sand filter.<br>Other options: B — rate of a rapid sand filter; C — too slow; D — far above even pressure filters.<\/p>","tag":""},{"id":"7.3.10","m":1,"o":["2000 m²","83.3 m²","41.7 m²","33.3 m²"],"q":"<p>A town needs 10 MLD of filtered water. If rapid sand filters are designed for 5 m³/m²/h, the total filter area required (ignoring backwash and standby) is about:<\/p>","a":1,"s":"<p>Area = Q/rate = 10,000 m³/day / (5 × 24) m/day = 83.3 m².<br>Other options: A — rate taken per day instead of per hour; C — arithmetic slip; D — hours converted using 60.<\/p>","tag":""},{"id":"7.3.11","m":1,"o":["6.7 m²","111 m²","278 m²","6,667 m²"],"q":"<p>A slow sand filter is to treat 1 MLD at a filtration rate of 150 L/h/m². The required filter bed area is about:<\/p>","a":2,"s":"<p>Rate = 0.15 m³/m²/h = 3.6 m/day; area = 1000/3.6 = 278 m².<br>Other options: A — rate taken as 150 m/day; B — time conversion slip; D — rate taken per day instead of per hour.<\/p>","tag":""},{"id":"7.3.12","m":1,"o":["The under-drain gravel layer","The chemical floc carried over from settling tanks","The wash-water trough","A biologically active film on the sand surface"],"q":"<p>The &#x27;schmutzdecke&#x27; in a slow sand filter is:<\/p>","a":3,"s":"<p>A film of algae, bacteria and protozoa forms on top of the sand; when it clogs, the top 1–2 cm of sand is scraped off.<br>Other options: A — supports the sand; not active; B — SSF usually treats un-coagulated water; C — a component of rapid filters.<\/p>","tag":""},{"id":"7.3.13","m":1,"o":["Back-washing: forcing filtered water upward through the bed","Scraping off the top layer of sand","Replacing the sand every week","Dosing heavy chlorine on the filter surface to oxidise the trapped impurities"],"q":"<p>A rapid sand filter is cleaned by:<\/p>","a":0,"s":"<p>Upward flow expands the bed and carries trapped impurities to the wash-water troughs.<br>Other options: B — how slow sand filters are cleaned; C — not required; D — chlorination does not remove trapped floc.<\/p>","tag":""},{"id":"
