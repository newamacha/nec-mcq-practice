<style>
/* Layout: one reading column of question cards under a sticky set picker + score bar */
:root{

  --ok:#1b7f45; --ok-bg:#e4f4ea; --bad:#c2352b; --bad-bg:#fbe7e5; --code-bg:#eef1f4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header .wrap>*{min-width:0}
.top select{flex:1 1 260px;width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%;min-width:0}
.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.subs button{flex:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.subs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg)}
.bar{flex:1 1 140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;min-width:100px}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.reset{font:inherit;font-size:.8rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
.reset.arm{border-color:var(--bad);color:var(--bad)}
main .wrap{padding-block:18px 60px;display:grid;gap:14px}
.intro{color:var(--muted);font-size:.92rem;margin:0}
h2{font-size:1rem;margin:14px 0 0;color:var(--accent);text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;min-width:0}
.meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px;font-variant-numeric:tabular-nums}
.meta .id{font-weight:700;color:var(--fg);font-size:.85rem}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-weight:500}
.stem p{margin:0 0 8px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13.5px/1.5 var(--mono);margin:6px 0 10px}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border-radius:4px;padding:0 4px}
pre code{background:none;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:left}
th{background:var(--code-bg)}
.opts{display:grid;gap:7px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;margin-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .l{font-weight:600;margin-right:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.done .opt:not(.right):not(.wrong){opacity:.6}
.fb{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:.93rem}
.fb p{margin:0 0 6px} .fb p:last-child{margin:0}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.bad .h{color:var(--bad)} .fb.ok .h{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem;margin-top:2px}
details[open] summary{margin-bottom:6px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-variant-numeric:tabular-nums}
.psg{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:.95rem}
.psg p{margin:0 0 6px}
.result b.pass{color:var(--ok)} .result b.fail{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
@media (max-width:480px){body{font-size:15px}.card{padding:13px 12px 12px}}
</style>

<script>
const DATA = {"ch":[{"n":1,"t":"Communication English","subs":[{"k":"1.1","t":"Text Completion and Sentence Equivalence","qs":[{"id":"1.1.1","m":1,"o":["hasty","rigorous","tentative","durable"],"q":"<p>Choose the word that best completes the sentence:<br>Far from being ______, the new design guidelines were adopted only after years of field testing and public consultation.<\/p>","a":0,"s":"<p>&#x27;Far from&#x27; signals contrast with &#x27;years of testing and consultation&#x27;, so the blank needs the opposite of careful: hasty.<br>Other options: B — rigorous agrees with the testing, so &#x27;far from&#x27; makes no sense; C — tentative does not contrast with long testing; D — durable describes things, not a decision process.<\/p>","tag":""},{"id":"1.1.2","m":1,"o":["abstruse","lucid","verbose","cryptic"],"q":"<p>Choose the word that best completes the sentence:<br>The engineer&#x27;s report was so ______ that even members of the public with no technical background could follow its argument.<\/p>","a":1,"s":"<p>&#x27;So … that even lay readers could follow&#x27; requires a word meaning clear and easy to understand: lucid.<br>Other options: A — abstruse means hard to understand; C — verbose means wordy, which hinders rather than helps; D — cryptic means obscure.<\/p>","tag":""},{"id":"1.1.3","m":1,"o":["fragility","obsolescence","soundness","elegance"],"q":"<p>Choose the word that best completes the sentence:<br>Although the bridge had stood for eighty years, inspectors warned that its apparent ______ masked serious corrosion inside the steel cables.<\/p>","a":2,"s":"<p>&#x27;Masked serious corrosion&#x27; means the visible condition looked good; the contrast needs soundness (apparent good condition).<br>Other options: A — apparent fragility would not mask damage, it would reveal it; B — obsolescence is about being outdated, not condition; D — elegance is aesthetic and does not contrast with structural damage.<\/p>","tag":""},{"id":"1.1.4","m":1,"o":["conclusive","abundant","redundant","sparse"],"q":"<p>Choose the word that best completes the sentence:<br>Because the soil investigation data were ______, the designers adopted a conservative factor of safety.<\/p>","a":3,"s":"<p>A conservative (higher) factor of safety is the logical response to limited information: sparse data.<br>Other options: A — conclusive data would justify a less conservative choice; B — abundant data reduce uncertainty; C — redundant means superfluous, giving no reason for extra caution.<\/p>","tag":""},{"id":"1.1.5","m":1,"o":["deliberate","arbitrary","prudent","economical"],"q":"<p>Choose the word that best completes the sentence:<br>The committee&#x27;s decision to postpone the project was not ______ but a carefully reasoned response to the rising cost of materials.<\/p>","a":1,"s":"<p>&#x27;Not ___ but carefully reasoned&#x27; needs the opposite of reasoned: arbitrary (based on whim).<br>Other options: A — deliberate agrees with &#x27;carefully reasoned&#x27;, so &#x27;not … but&#x27; fails; C — prudent also agrees; D — economical does not contrast with &#x27;reasoned&#x27;.<\/p>","tag":""},{"id":"1.1.6","m":1,"o":["pragmatic","feasible","chimerical","mundane"],"q":"<p>Choose the word that best completes the sentence:<br>Critics dismissed the proposal as ______: attractive on paper but impossible to build with the available budget and technology.<\/p>","a":2,"s":"<p>The colon defines the blank: attractive but impossible = chimerical (wildly fanciful, unrealistic).<br>Other options: A — pragmatic means practical, the opposite; B — feasible means buildable, contradicts &#x27;impossible&#x27;; D — mundane means ordinary, not &#x27;attractive but impossible&#x27;.<\/p>","tag":""},{"id":"1.1.7","m":1,"o":["inadvisable","mandatory","irrelevant","inevitable"],"q":"<p>Choose the word that best completes the sentence:<br>Concrete gains strength gradually and reaches its design strength only after proper curing, so loading it too early is ______.<\/p>","a":0,"s":"<p>Since strength is not yet developed, early loading should be avoided: inadvisable.<br>Other options: B — mandatory contradicts the reasoning; C — irrelevant ignores the cause-effect &#x27;so&#x27;; D — inevitable does not follow from the premise.<\/p>","tag":""},{"id":"1.1.8","m":1,"o":["accidental","cumulative","instantaneous","negligible"],"q":"<p>Choose the word that best completes the sentence:<br>The landslide did not occur out of nowhere; it was the ______ result of years of deforestation, poor drainage and unplanned road cutting.<\/p>","a":1,"s":"<p>Many causes acting over years build up: cumulative.<br>Other options: A — accidental contradicts the listed causes; C — instantaneous contradicts &#x27;years of&#x27;; D — negligible contradicts a landslide being the outcome.<\/p>","tag":""},{"id":"1.1.9","m":1,"o":["specious","tenuous","cogent","digressive"],"q":"<p>Choose the word that best completes the sentence:<br>Her argument was ______: every step followed logically from the one before, leaving no room for objection.<\/p>","a":2,"s":"<p>Logically tight and convincing = cogent.<br>Other options: A — specious means plausible but actually false; B — tenuous means weak; D — digressive means wandering off the point.<\/p>","tag":""},{"id":"1.1.10","m":1,"o":["meticulous","vigilant","cautious","cavalier"],"q":"<p>Choose the word that best completes the sentence:<br>The contractor&#x27;s ______ attitude to safety, ignoring warning signs and skipping inspections, eventually led to the site being closed.<\/p>","a":3,"s":"<p>Ignoring warnings and skipping inspections shows a careless, offhand attitude: cavalier.<br>Other options: A, B, C — meticulous, vigilant and cautious all describe careful behaviour, the opposite of what is described.<\/p>","tag":""},{"id":"1.1.11","m":1,"o":["robust","autonomous","durable","temperamental"],"q":"<p>Choose the word that best completes the sentence:<br>Unlike earlier models, which were ______ and needed constant adjustment, the new sensor operates reliably for months without attention.<\/p>","a":3,"s":"<p>&#x27;Unlike&#x27; sets up a contrast with &#x27;operates reliably&#x27;; &#x27;needing constant adjustment&#x27; = temperamental (unpredictable, unreliable).<br>Other options: A — robust and C — durable describe reliability, the same as the new model; B — autonomous means self-operating, which contradicts &#x27;needed constant adjustment&#x27;.<\/p>","tag":""},{"id":"1.1.12","m":1,"o":["discrepant","consistent","corroborative","identical"],"q":"<p>Choose the word that best completes the sentence:<br>The results from the two laboratories were ______, so the researchers had to repeat the tests before drawing any conclusion.<\/p>","a":0,"s":"<p>Repeating tests is needed when results disagree: discrepant.<br>Other options: B, C, D — consistent, corroborative and identical results would allow a conclusion, not force a repeat.<\/p>","tag":""},{"id":"1.1.13","m":1,"o":["enthusiastic","zealous","sceptical","confident"],"q":"<p>Choose the word that best completes the sentence:<br>Although initially ______ about adopting the new software, the senior engineers became its strongest advocates once they saw how much time it saved.<\/p>","a":2,"s":"<p>&#x27;Although initially … became strongest advocates&#x27; needs an initial attitude opposite to advocacy: sceptical (doubtful).<br>Other options: A — enthusiastic, B — zealous and D — confident do not contrast with later advocacy, so &#x27;although&#x27; fails.<\/p>","tag":""},{"id":"1.1.14","m":1,"o":["prolix","rambling","tedious","concise"],"q":"<p>Choose the word that best completes the sentence:<br>The professor&#x27;s lectures were famously ______; she could cover in ten minutes what others needed an hour to explain.<\/p>","a":3,"s":"<p>Covering a lot in little time = concise (brief yet complete).<br>Other options: A — prolix and B — rambling mean long-winded, the opposite; C — tedious means boring, not short.<\/p>","tag":""},{"id":"1.1.15","m":1,"o":["optimistic … triple","pessimistic … triple","accurate … equal to","generous … double"],"q":"<p>Choose the pair of words that best completes the sentence:<br>The initial estimate proved far too (i) ______; the final cost of the dam was nearly (ii) ______ the original figure.<\/p>","a":0,"s":"<p>A cost estimate that is &#x27;far too optimistic&#x27; (too low) is followed by a final cost much higher, e.g. triple. Both blanks agree.<br>Other options: B — a too-pessimistic (too high) estimate cannot be followed by a final cost three times larger; C — &#x27;far too accurate&#x27; is illogical; D — a generous (high) estimate cannot be followed by a cost double the figure.<\/p>","tag":""},{"id":"1.1.16","m":1,"o":["celebrated … obsolete","ridiculed … orthodox","ignored … controversial","popular … fringe"],"q":"<p>Choose the pair of words that best completes the sentence:<br>Although the theory was (i) ______ when first proposed, it is now so widely accepted that it is considered (ii) ______.<\/p>","a":1,"s":"<p>&#x27;Although&#x27; contrasts the early reception with present acceptance: ridiculed then, orthodox (standard, accepted) now.<br>Other options: A — celebrated is not a contrast, and obsolete contradicts &#x27;widely accepted&#x27;; C — controversial contradicts &#x27;widely accepted&#x27;; D — fringe contradicts &#x27;widely accepted&#x27;.<\/p>","tag":""},{"id":"1.1.17","m":1,"o":["increase … confine","ignore … solve","curb … shift","measure … eliminate"],"q":"<p>Choose the pair of words that best completes the sentence:<br>The new policy is meant to (i) ______ pollution, but critics argue that its loopholes will merely (ii) ______ the problem to neighbouring districts.<\/p>","a":2,"s":"<p>A policy is meant to curb (restrain) pollution; loopholes would merely shift (move) the problem elsewhere rather than solve it.<br>Other options: A — no policy is &#x27;meant to increase&#x27; pollution; B — &#x27;merely solve&#x27; is self-contradictory; D — loopholes would not &#x27;eliminate&#x27; a problem, and &#x27;merely&#x27; signals a weak outcome.<\/p>","tag":""},{"id":"1.1.18","m":1,"o":["increasing … lowered","reducing … eliminated","assessing … ignored","reducing … aggravated"],"q":"<p>Choose the pair of words that best completes the sentence:<br>Far from (i) ______ the risk, the extra storey actually (ii) ______ it, because the foundation had been designed for a lighter load.<\/p>","a":3,"s":"<p>&#x27;Far from reducing … actually aggravated (worsened)&#x27; gives the needed reversal; an unplanned extra load worsens risk.<br>Other options: A — an extra storey on a light foundation does not lower risk; B — &#x27;far from reducing … eliminated&#x27; is self-contradictory; C — &#x27;assessing … ignored&#x27; makes no sense with the reason given.<\/p>","tag":""},{"id":"1.1.19","m":1,"o":["alarming … reassuring","measured … stark","strident … trivial","calm … vague"],"q":"<p>Choose the pair of words that best completes the sentence:<br>The speaker&#x27;s tone was (i) ______, yet her message was (ii) ______: unless water tariffs were reformed, the utility would be bankrupt within five years.<\/p>","a":1,"s":"<p>&#x27;Yet&#x27; contrasts tone with message. A measured (calm, restrained) tone with a stark (bluntly grim) message fits the bankruptcy warning after the colon.<br>Other options: A — the message after the colon is not reassuring; C — bankruptcy is not trivial; D — the message is specific, not vague.<\/p>","tag":""},{"id":"1.1.20","m":1,"o":["precise … obsolete","reliable … ambiguous","outdated … current","recent … dated"],"q":"<p>Choose the pair of words that best completes the sentence:<br>Because the old survey maps were (i) ______, the team relied instead on satellite imagery, which offered far more (ii) ______ data.<\/p>","a":2,"s":"<p>The team switched sources because the maps were outdated; the imagery is better because it is current.<br>Other options: A — precise maps give no reason to switch, and &#x27;more obsolete&#x27; is not an advantage; B — &#x27;more ambiguous&#x27; is not an advantage; D — recent maps give no reason to switch.<\/p>","tag":""},{"id":"1.1.21","m":1,"o":["brittle … ductile","elastic … plastic","rigid … malleable","ductile … brittle"],"q":"<p>Choose the pair of words that best completes the sentence:<br>Mild steel is (i) ______, deforming considerably before it fractures, whereas cast iron is (ii) ______ and fails with little warning.<\/p>","a":3,"s":"<p>Large deformation before fracture defines ductility; sudden failure with little deformation defines brittleness.<br>Other options: A — reverses the two properties; B — &#x27;plastic&#x27; does not mean failing without warning; C — rigid steel &#x27;deforming considerably&#x27; is contradictory.<\/p>","tag":""},{"id":"1.1.22","m":1,"o":["supported … confirm","vindicated … contradict","unsupported … contradict","strengthened … refute"],"q":"<p>Choose the pair of words that best completes the sentence:<br>The author&#x27;s claims are (i) ______ by the evidence she presents; in fact, several of her own tables (ii) ______ her conclusion.<\/p>","a":2,"s":"<p>&#x27;In fact&#x27; intensifies the first clause: the claims are unsupported, and worse, her own tables contradict them.<br>Other options: A — &#x27;in fact&#x27; would then add nothing stronger; B and D — first blank is positive, second negative, so the two clauses clash.<\/p>","tag":""},{"id":"1.1.23","m":1,"o":["unpopular … indispensable","welcome … redundant","familiar … unknown","essential … useless"],"q":"<p>Choose the pair of words that best completes the sentence:<br>Initially (i) ______ with the public, the bypass road soon became (ii) ______ once commuters found it cut their travel time in half.<\/p>","a":0,"s":"<p>&#x27;Initially … soon became … once commuters found it useful&#x27; shows a change from negative to positive: unpopular → indispensable.<br>Other options: B — halving travel time would not make it redundant; C — &#x27;familiar … unknown&#x27; is illogical; D — it became more useful, not useless.<\/p>","tag":""},{"id":"1.1.24","m":1,"o":["lengthy","brief and clear","confusing","detailed"],"q":"<p>Choose the word closest in meaning to &#x27;succinct&#x27; in the sentence:<br>The engineer gave a succinct summary of the test findings.<\/p>","a":1,"s":"<p>Succinct = expressed briefly and clearly.<br>Other options: A — lengthy and D — detailed are the opposite; C — confusing is unrelated.<\/p>","tag":""},{"id":"1.1.25","m":1,"o":["worsen","measure","lessen","predict"],"q":"<p>Choose the word closest in meaning to &#x27;mitigate&#x27; in the sentence:<br>The new retention ponds will mitigate the impact of flash floods.<\/p>","a":2,"s":"<p>Mitigate = make less severe.<br>Other options: A — worsen is the opposite; B — measure and D — predict do not reduce anything.<\/p>","tag":""},{"id":"1.1.26","m":1,"o":["obvious","recent","minor","hidden"],"q":"<p>Choose the word closest in meaning to &#x27;latent&#x27; in the sentence:<br>The collapse was traced to a latent defect in the welds.<\/p>","a":3,"s":"<p>Latent = present but not visible or active.<br>Other options: A — obvious is the opposite; B — recent concerns time; C — minor concerns size, and the defect caused a collapse.<\/p>","tag":""},{"id":"1.1.27","m":1,"o":["permanent","fleeting","fragile","brief"],"q":"<p>Choose the word most nearly OPPOSITE in meaning to &#x27;ephemeral&#x27;:<\/p>","a":0,"s":"<p>Ephemeral = lasting a very short time; its opposite is permanent.<br>Other options: B — fleeting and D — brief are synonyms of ephemeral; C — fragile concerns strength, not duration.<\/p>","tag":""},{"id":"1.1.28","m":1,"o":["The alarm sounded because the workers left the tunnel.","The workers left the tunnel long after the alarm sounded.","The workers left the tunnel as soon as the alarm sounded.","The workers hardly left the tunnel when the alarm sounded."],"q":"<p>Choose the sentence that has the same meaning as:<br>&#x27;Hardly had the alarm sounded when the workers left the tunnel.&#x27;<\/p>","a":2,"s":"<p>&#x27;Hardly had X when Y&#x27; means Y happened immediately after X, i.e. &#x27;as soon as&#x27;.<br>Other options: A — reverses cause and effect; B — &#x27;long after&#x27; contradicts &#x27;hardly … when&#x27;; D — changes the meaning to &#x27;barely left&#x27;.<\/p>","tag":""},{"id":"1.1.29","m":1,"o":["The project will be approved only if the design is revised.","If the design is revised, the project will certainly be approved.","The project will be approved even if the design is not revised.","Revising the design will prevent approval."],"q":"<p>Choose the sentence that has the same meaning as:<br>&#x27;Unless the design is revised, the project will not be approved.&#x27;<\/p>","a":0,"s":"<p>&#x27;Unless X, not Y&#x27; means X is a necessary condition for Y: Y only if X.<br>Other options: B — turns a necessary condition into a sufficient one (&#x27;certainly&#x27;); C — contradicts the original; D — reverses the meaning.<\/p>","tag":""},{"id":"1.1.30","m":1,"o":["aggravate","improve","survey","relocate"],"q":"<p>Choose the word that can replace &#x27;ameliorate&#x27; without changing the meaning of the sentence:<br>Better drainage will ameliorate conditions in the low-lying settlements.<\/p>","a":1,"s":"<p>Ameliorate = make better, improve.<br>Other options: A — aggravate means make worse; C — survey and D — relocate change the meaning.<\/p>","tag":""}]},{"k":"1.2","t":"Reading Passages and Critical Reasoning","qs":[{"id":"1.2.1","m":2,"o":["arguing that aviation should be regulated more strictly than cement","explaining the main source of cement&#x27;s emissions and the chief barrier to a known remedy","describing how clinker is manufactured in a kiln","proving that fly-ash concrete is stronger than Portland cement concrete"],"p":"<p><b>Passage 1<\/b><br>Cement production is responsible for roughly eight per cent of global carbon dioxide emissions, a share larger than that of aviation. Most of this comes not from the fuel burned in kilns but from the chemistry of the process itself: when limestone is heated to make clinker, it releases carbon dioxide as it decomposes. This means that even a cement plant running entirely on renewable energy would remain a major emitter. Engineers have therefore turned to reducing the amount of clinker in concrete. Supplementary materials such as fly ash, ground blast-furnace slag and calcined clay can replace a substantial portion of clinker while giving comparable long-term strength. The obstacle is less technical than institutional. Many building codes and specifications were written around ordinary Portland cement, and contractors, wary of liability, are reluctant to depart from familiar mixes. Until standards are revised to specify performance rather than composition, low-clinker concrete is likely to remain a niche product.<\/p>","q":"<p>(Passage 1) The passage is primarily concerned with:<\/p>","a":1,"s":"<p>The passage explains that emissions are mostly chemical (from limestone), presents clinker substitution as the remedy, and says the obstacle is institutional (codes, liability).<br>Other options: A — aviation is only a size comparison; C — kiln chemistry is mentioned in one sentence only; D — the passage claims &#x27;comparable&#x27;, not greater, strength.<\/p>","tag":""},{"id":"1.2.2","m":2,"o":["eliminate most of the industry&#x27;s emissions","increase the strength of the clinker produced","leave the larger part of the process emissions unchanged","make existing building codes obsolete"],"q":"<p>(Passage 1) It can be inferred from the passage that running cement kilns entirely on renewable energy would:<\/p>","a":2,"s":"<p>Most emissions come &#x27;not from the fuel … but from the chemistry&#x27; of limestone decomposition, so changing the fuel leaves that larger share untouched.<br>Other options: A — directly contradicted; B — strength is not linked to fuel in the passage; D — codes are linked to composition, not fuel.<\/p>","tag":""},{"id":"1.2.3","m":2,"o":["building more cement plants near limestone quarries","restricting the use of fly ash and slag","raising the strength of ordinary Portland cement","rewriting standards to specify required performance instead of mix ingredients"],"q":"<p>(Passage 1) According to the author, the adoption of low-clinker concrete would be most directly encouraged by:<\/p>","a":3,"s":"<p>The last sentence says low-clinker concrete will stay niche &#x27;until standards are revised to specify performance rather than composition&#x27;.<br>Other options: A — would increase clinker production; B — would block the substitute materials; C — irrelevant to the institutional obstacle.<\/p>","tag":""},{"id":"1.2.4","m":2,"o":["each user&#x27;s private gain from a shared resource exceeds the share of the cost that user bears, so the resource is overused","the government takes over common land for development","water becomes too expensive for poor households to buy","aquifers are polluted by sewage from nearby settlements"],"p":"<p><b>Passage 2<\/b><br>In many fast-growing cities of South Asia, groundwater fills the gap left by an inadequate piped supply. Households and hotels sink private wells, and tanker operators pump aquifers to sell water by the truckload. Because each user bears only a small fraction of the cost of a falling water table while keeping the whole benefit of the water drawn, the aquifer is used faster than it is replenished, a textbook case of the &#x27;tragedy of the commons&#x27;. The consequences are slow but serious: wells must be deepened at rising cost, shallow wells run dry first, hurting the poorest users, and in some soft sediments the ground itself subsides. Metering and licensing are often proposed, yet enforcement is weak where thousands of unregistered wells exist. Some hydrologists therefore argue that the cheapest reform is indirect: a reliable piped supply would reduce the incentive to pump in the first place, making regulation easier to enforce.<\/p>","q":"<p>(Passage 2) In the passage, the phrase &#x27;tragedy of the commons&#x27; describes a situation in which:<\/p>","a":0,"s":"<p>The sentence before the phrase defines it: each user keeps the whole benefit but bears only a fraction of the cost, so the aquifer is over-pumped.<br>Other options: B — no government seizure is mentioned; C — price is not the mechanism described; D — pollution is not discussed.<\/p>","tag":""},{"id":"1.2.5","m":2,"o":["Piped water in these cities costs less per litre than tanker water.","Most private-well owners say they would switch to a reliable mains supply.","In cities where piped supply was made reliable, private pumping continued at almost the same rate because well water remained free.","Land subsidence has been measured in several of these cities."],"q":"<p>(Passage 2) Which of the following, if true, would most WEAKEN the hydrologists&#x27; argument in the last sentence?<\/p>","a":2,"s":"<p>The argument assumes a reliable piped supply would reduce pumping. Evidence that pumping did not fall when supply became reliable attacks that assumption directly.<br>Other options: A and B — both make switching more likely, so they strengthen the argument; D — supports the seriousness of the problem, not the remedy.<\/p>","tag":""},{"id":"1.2.6","m":2,"o":["tanker operators","hotels with deep wells","regulators who license wells","poorer users who depend on shallow wells"],"q":"<p>(Passage 2) According to the passage, the effects of a falling water table are felt first by:<\/p>","a":3,"s":"<p>The passage states &#x27;shallow wells run dry first, hurting the poorest users&#x27;.<br>Other options: A and B — those who can afford to deepen wells are hurt later; C — regulators are not described as bearing the effects.<\/p>","tag":""},{"id":"1.2.7","m":2,"o":["dismissive of its practical value","strongly supportive, while frank about why it is often neglected","neutral and uninterested","sceptical about whether it actually prevents collapse"],"p":"<p><b>Passage 3<\/b><br>Seismologists like to say that earthquakes do not kill people; buildings do. The remark is not merely rhetorical. Two earthquakes of similar magnitude can produce death tolls that differ enormously, and the difference lies largely in what was built and how. Ductile detailing, such as closely spaced ties in columns, adequate lap lengths and strong columns paired with weaker beams, allows a frame to deform without collapsing, giving occupants time to escape. Such details add only a few per cent to construction cost. Why, then, are they so often omitted? Part of the answer is that the benefit is invisible: a well-detailed building and a poorly detailed one look identical until the ground shakes, and the owner who pays for the former receives no reward in ordinary years. Building codes attempt to correct this by making good detailing compulsory, but a code is only as effective as the inspection that enforces it.<\/p>","q":"<p>(Passage 3) The author&#x27;s attitude toward ductile detailing is best described as:<\/p>","a":1,"s":"<p>The author stresses that it prevents collapse at small cost (supportive) and then explains why owners skip it (frank about neglect).<br>Other options: A and D — contradict &#x27;allows a frame to deform without collapsing&#x27;; C — the rhetorical question and argument show engagement, not neutrality.<\/p>","tag":""},{"id":"1.2.8","m":2,"o":["it roughly doubles the construction cost","many building codes prohibit it","its benefit is not apparent until an earthquake occurs","it makes buildings look unattractive"],"q":"<p>(Passage 3) The author implies that owners often omit ductile detailing mainly because:<\/p>","a":2,"s":"<p>&#x27;The benefit is invisible … look identical until the ground shakes … no reward in ordinary years.&#x27;<br>Other options: A — the passage says only &#x27;a few per cent&#x27;; B — codes make it compulsory, not prohibited; D — the buildings &#x27;look identical&#x27;.<\/p>","tag":""},{"id":"1.2.9","m":2,"o":["without inspection, some builders would not follow code requirements","most building codes are poorly written","inspectors are more skilled than designers","earthquakes can be predicted accurately"],"q":"<p>(Passage 3) The final sentence of the passage assumes that:<\/p>","a":0,"s":"<p>Saying a code is &#x27;only as effective as the inspection&#x27; presupposes that, unchecked, some builders would ignore it.<br>Other options: B — the quality of codes is not questioned; C — no comparison of skills is implied; D — prediction is not mentioned.<\/p>","tag":""},{"id":"1.2.10","m":2,"o":["containing particles of widely mixed sizes","arranged in the wrong order","badly resolved","selected with little care"],"p":"<p><b>Passage 4<\/b><br>As Himalayan glaciers retreat, meltwater often collects behind the ridges of loose rock and debris, called moraines, that the ice left behind. These glacial lakes can grow for decades with little visible change. The danger is that a moraine is not an engineered dam: it is poorly sorted, may contain buried ice, and has no spillway. A rock or ice avalanche into the lake can generate a wave that overtops the moraine, or seepage may gradually erode it from within. When it fails, the result is a glacial lake outburst flood, which can travel tens of kilometres downstream, destroying bridges, hydropower intakes and villages. Mitigation is possible but expensive: lake levels can be lowered by siphons or by cutting an outlet channel, and early-warning systems can alert downstream communities. Because resources are limited, the practical question is not whether every lake can be made safe, but which lakes pose the greatest risk to the most people.<\/p>","q":"<p>(Passage 4) As used in the passage, &#x27;poorly sorted&#x27; most nearly means:<\/p>","a":0,"s":"<p>In geology, a poorly sorted deposit contains a jumble of particle sizes (boulders to silt), which makes it weaker and more permeable than an engineered fill.<br>Other options: B, C, D — everyday meanings of &#x27;sort&#x27; (order, resolve, select) do not fit the description of a natural debris ridge.<\/p>","tag":""},{"id":"1.2.11","m":2,"o":["Every glacial lake should be drained immediately.","Mitigation spending should be prioritised according to the level of risk.","Early-warning systems are not worth their cost.","Moraine dams are safer than engineered dams."],"q":"<p>(Passage 4) Which of the following best expresses the point of the last sentence?<\/p>","a":1,"s":"<p>With limited resources, the question is &#x27;which lakes pose the greatest risk to the most people&#x27;, i.e. prioritise by risk.<br>Other options: A — explicitly rejected (&#x27;not whether every lake can be made safe&#x27;); C — warning systems are listed as a mitigation; D — contradicts the passage.<\/p>","tag":""},{"id":"1.2.12","m":2,"o":["is usually built much higher","stores less water","cannot be overtopped by waves","has no controlled way to pass excess water"],"q":"<p>(Passage 4) It can be inferred that a moraine dam is more vulnerable than an engineered dam partly because it:<\/p>","a":3,"s":"<p>The passage lists &#x27;has no spillway&#x27; among the moraine&#x27;s weaknesses; a spillway is the controlled outlet an engineered dam uses to pass excess water.<br>Other options: A — moraines are not &#x27;built&#x27;; B — storage volume is not compared; C — the passage says waves can overtop it.<\/p>","tag":""},{"id":"1.2.13","m":2,"o":["Widening roads mainly to relieve congestion tends to fail, because shorter travel times generate new traffic.","Roads should never be widened under any circumstances.","Congestion charges are politically unpopular.","Public transport is always cheaper than private driving."],"p":"<p><b>Passage 5<\/b><br>For decades, the standard response to traffic congestion was to add lanes. Yet studies in many countries have found that, within a few years, traffic on a widened road tends to rise until congestion returns to roughly its former level. Transport economists call this &#x27;induced demand&#x27;. The explanation is simple once travel is viewed as a good with a price, the price being mostly time. When a new lane cuts journey times, trips that were previously not worth making, such as an extra shopping run or a commute from a more distant suburb, become worthwhile, and the road fills up. This does not mean that road building is never justified; a new link can open markets or improve safety. It does mean that congestion relief alone is a weak justification, and that measures which price road space directly, such as congestion charges, or which offer attractive alternatives, such as reliable public transport, are more likely to produce lasting gains.<\/p>","q":"<p>(Passage 5) Which of the following best states the main idea of the passage?<\/p>","a":0,"s":"<p>The passage explains induced demand and concludes that congestion relief alone is a weak reason for widening.<br>Other options: B — the author says road building can be justified for other reasons; C — popularity is not discussed; D — cost comparison is not made.<\/p>","tag":""},{"id":"1.2.14","m":2,"o":["is justified whenever traffic is heavy","may be worthwhile if it serves goals such as safety or access to markets","always increases total vehicle emissions","should be replaced by a congestion charge in every case"],"q":"<p>(Passage 5) The author would most likely agree that a new road project:<\/p>","a":1,"s":"<p>&#x27;This does not mean that road building is never justified; a new link can open markets or improve safety.&#x27;<br>Other options: A — heavy traffic alone is called a weak justification; C — emissions are not discussed; D — &#x27;in every case&#x27; is too absolute.<\/p>","tag":""},{"id":"1.2.15","m":2,"o":["irrelevant to people&#x27;s travel decisions","a fixed cost that never changes","a kind of price that influences how much people choose to travel","a measure of road safety"],"q":"<p>(Passage 5) In the author&#x27;s explanation of induced demand, travel time is treated as:<\/p>","a":2,"s":"<p>&#x27;Travel is viewed as a good with a price, the price being mostly time&#x27;; lower time-price → more trips.<br>Other options: A — the whole mechanism depends on time; B — new lanes change it; D — safety is a separate point.<\/p>","tag":""},{"id":"1.2.16","m":2,"o":["oppose the council member&#x27;s tree-planting proposal","show that air conditioners prevent heat stroke","criticise the motives of the council member","caution against treating a correlation as proof of cause"],"p":"<p><b>Passage 6<\/b><br>A municipal study found that neighbourhoods with more street trees reported fewer cases of heat stroke during summer. A council member promptly proposed planting trees across the city as a public-health measure. The proposal may well be sound, but the study alone does not establish it. Tree-lined neighbourhoods in that city also tend to be wealthier, and wealthier households are more likely to own air conditioners, to work indoors and to have access to medical care, any of which might explain the lower incidence of heat stroke. To isolate the effect of trees, researchers would need to compare neighbourhoods that are similar in income and housing but differ in tree cover, or to track what happens when trees are planted in areas where nothing else changes. None of this means that trees are unimportant. It means that a correlation, however plausible its causal story, is the beginning of an inquiry rather than its end.<\/p>","q":"<p>(Passage 6) The author&#x27;s main purpose is to:<\/p>","a":3,"s":"<p>The closing sentence states the point: a correlation is &#x27;the beginning of an inquiry rather than its end&#x27;.<br>Other options: A — the author says the proposal &#x27;may well be sound&#x27;; B — air conditioning is one possible confounder, not a conclusion; C — motives are never questioned.<\/p>","tag":""},{"id":"1.2.17","m":2,"o":["Wealthier neighbourhoods have more street trees.","Air-conditioner ownership is highest in tree-lined areas.","Among neighbourhoods of similar income and housing, those with more trees still had fewer heat-stroke cases.","Heat stroke is more common among people who work outdoors."],"q":"<p>(Passage 6) Which finding would most STRENGTHEN the claim that street trees reduce heat stroke?<\/p>","a":2,"s":"<p>Holding income and housing constant removes the main confounder, which is exactly the test the author proposes.<br>Other options: A and B — strengthen the alternative (wealth/air-conditioning) explanation, i.e. weaken the claim; D — says nothing about trees.<\/p>","tag":""},{"id":"1.2.18","m":2,"o":["separate out from other possible causes","quarantine","insulate thermally","abandon"],"q":"<p>(Passage 6) In the context of the passage, &#x27;isolate&#x27; most nearly means:<\/p>","a":0,"s":"<p>To isolate the effect of trees is to separate it from confounding factors such as income.<br>Other options: B — medical sense, not relevant; C — physical sense, not relevant; D — unrelated.<\/p>","tag":""},{"id":"1.2.19","m":2,"o":["it should be eliminated from technical writing","it is always preferable in scientific reports","it is useful in some cases but harmful when it hides responsibility","it is grammatically incorrect"],"p":"<p><b>Passage 7<\/b><br>Engineering students are often taught that reports must be written in the passive voice: &#x27;the sample was tested&#x27; rather than &#x27;we tested the sample&#x27;. The convention was meant to keep attention on the work rather than the worker, and it still has its uses. But applied mechanically, it produces prose in which no one appears responsible for anything: &#x27;it was decided that the inspection would be deferred&#x27;. In a design office, where knowing who decided what can matter enormously when something goes wrong, such vagueness is not a harmless stylistic habit. Many technical-writing guides now recommend the active voice as the default, keeping the passive for cases where the actor is unknown, unimportant or obvious. The aim is not to banish a grammatical form but to choose it deliberately. A reader should finish a report knowing not only what was done but, where it matters, who did it.<\/p>","q":"<p>(Passage 7) The author&#x27;s view of the passive voice is best described as:<\/p>","a":2,"s":"<p>The author says it &#x27;still has its uses&#x27; but criticises its mechanical use that hides who decided.<br>Other options: A — &#x27;the aim is not to banish a grammatical form&#x27;; B — the author recommends active as default; D — never called incorrect.<\/p>","tag":""},{"id":"1.2.20","m":2,"o":["a sentence that conceals who made a decision","correct use of the active voice","a grammatical error","the advantage of short sentences"],"q":"<p>(Passage 7) The example &#x27;it was decided that the inspection would be deferred&#x27; is used to illustrate:<\/p>","a":0,"s":"<p>It is quoted as prose in which &#x27;no one appears responsible&#x27;.<br>Other options: B — it is passive, not active; C — it is grammatical, merely vague; D — sentence length is not discussed.<\/p>","tag":""},{"id":"1.2.21","m":2,"o":["Reporting who approved a change to the design","&#x27;The specimens were oven-dried at 105 °C for 24 hours,&#x27; where it does not matter who dried them","Recording who cancelled a safety inspection","Assigning tasks to named team members"],"q":"<p>(Passage 7) Which of the following would the author consider an appropriate use of the passive voice?<\/p>","a":1,"s":"<p>The passive suits cases where the actor is &#x27;unknown, unimportant or obvious&#x27;; who dried the specimens is unimportant.<br>Other options: A, C, D — all are cases where who acted matters, so the author would want the active voice.<\/p>","tag":""},{"id":"1.2.22","m":2,"o":["they are too expensive to build","they flood too much land","their output rises and falls with the same seasonal river flows","the grid cannot be extended to connect them"],"p":"<p><b>Passage 8<\/b><br>Run-of-river hydropower, which diverts part of a river&#x27;s flow through turbines without a large storage reservoir, is attractive in mountainous countries: it floods little land and is relatively cheap to build. Its weakness is that its output follows the river. In the monsoon, plants may produce more electricity than the grid can absorb, and surplus water is simply spilled; in the dry season, when rivers shrink to a fraction of their monsoon flow, output falls sharply just as demand for lighting and heating peaks. A power system built almost entirely on such plants therefore faces a seasonal mismatch that additional run-of-river capacity cannot solve, since new plants share the same seasonal pattern. Remedies include storage reservoirs, which hold monsoon water for winter release; cross-border trade, which exports surplus and imports in deficit; and complementary sources such as solar power, which does not depend on river flow and is often strong in the clear dry-season months.<\/p>","q":"<p>(Passage 8) According to the passage, adding more run-of-river plants cannot solve the seasonal mismatch because:<\/p>","a":2,"s":"<p>&#x27;New plants share the same seasonal pattern&#x27;, so they add surplus in the monsoon and little in the dry season.<br>Other options: A and B — the passage says they are cheap and flood little land; D — grid connection is not mentioned as the reason.<\/p>","tag":""},{"id":"1.2.23","m":2,"o":["describing a limitation of one type of power plant and ways to address it","arguing that hydropower should be abandoned","comparing different turbine designs","promoting electricity imports over domestic generation"],"q":"<p>(Passage 8) The passage is primarily concerned with:<\/p>","a":0,"s":"<p>The passage states the seasonal weakness of run-of-river plants and lists three remedies.<br>Other options: B — the passage calls such plants attractive; C — turbine designs are not discussed; D — trade is only one of three remedies.<\/p>","tag":""},{"id":"1.2.24","m":2,"o":["imports are always cheaper than domestic power","storage reservoirs cannot be built","solar power is unreliable","neighbouring power systems can absorb surplus in the wet season and supply power in the dry season"],"q":"<p>(Passage 8) Proposing cross-border trade as a remedy assumes that:<\/p>","a":3,"s":"<p>Exporting surplus and importing in deficit only works if neighbours have demand in the monsoon and spare power in the dry season.<br>Other options: A — price is not assumed; B — reservoirs are listed as a separate remedy; C — solar is listed as a remedy, not called unreliable.<\/p>","tag":""},{"id":"1.2.25","m":2,"o":["building fences around roads under repair","reserving the funds so that they cannot be diverted to other uses","auctioning maintenance contracts","reducing the funds gradually"],"p":"<p><b>Passage 9<\/b><br>Politicians enjoy opening new roads and bridges; few hold ceremonies to celebrate a resurfaced highway or a repainted steel truss. This bias has a cost. Infrastructure deteriorates in a way that is gradual at first and then accelerates: a pavement with small cracks lets water reach the base, the weakened base deforms under traffic, and the cracks widen. Repair at the early stage is cheap, while reconstruction after failure can cost several times as much. Yet maintenance budgets are usually the first to be cut when money is tight, because the consequences of neglect appear only years later, often under a different administration. Some agencies have responded by ring-fencing maintenance funds or by reporting the condition of their assets publicly, so that a backlog of deferred repairs becomes visible as a liability rather than remaining hidden. The underlying lesson is that the cheapest road is often the one already built, provided it is looked after.<\/p>","q":"<p>(Passage 9) As used in the passage, &#x27;ring-fencing&#x27; maintenance funds most nearly means:<\/p>","a":1,"s":"<p>It is offered as a response to maintenance budgets being cut first, so it means protecting them for that purpose only.<br>Other options: A — literal, irrelevant reading; C — procurement is not discussed; D — the opposite of the intended protection.<\/p>","tag":""},{"id":"1.2.26","m":2,"o":["maintenance is technically difficult","new roads are cheaper than repairs","the harm from neglect is delayed and may fall on later officials","contractors refuse maintenance work"],"q":"<p>(Passage 9) The author suggests that maintenance budgets are cut readily partly because:<\/p>","a":2,"s":"<p>&#x27;The consequences of neglect appear only years later, often under a different administration.&#x27;<br>Other options: A — difficulty is not mentioned; B — the passage says reconstruction costs more; D — contractors are not mentioned.<\/p>","tag":""},{"id":"1.2.27","m":2,"o":["New roads should never be built.","Old roads are always cheaper to drive on.","A well-built road needs no maintenance.","Preserving existing infrastructure is often more economical than building new."],"q":"<p>(Passage 9) Which statement best captures the closing sentence?<\/p>","a":3,"s":"<p>&#x27;The cheapest road is often the one already built, provided it is looked after.&#x27;<br>Other options: A — &#x27;never&#x27; is too strong; B — cost to drivers is not the point; C — contradicts &#x27;provided it is looked after&#x27;.<\/p>","tag":""},{"id":"1.2.28","m":2,"o":["nostalgic and hostile to technology","cautionary but not opposed to software","enthusiastic and uncritical","sarcastic and dismissive"],"p":"<p><b>Passage 10<\/b><br>Software now performs in seconds the structural analyses that once took a design team weeks. Few engineers would wish to return to slide rules, but the speed brings a subtler risk. When results arrive instantly and in polished graphics, they acquire an authority they may not deserve. A model is only as good as its assumptions, its boundary conditions, material properties and load cases, and an error in input can produce output that looks entirely plausible. Experienced engineers guard against this by asking whether the answer is roughly what simple hand calculations would predict; a bending moment ten times larger than expected is a signal to check the model, not to order more steel. Some educators worry that students who learn analysis mainly through software may never develop this intuition. The remedy they propose is not to ban the tools but to insist that every computer result be accompanied by an independent estimate, however rough.<\/p>","q":"<p>(Passage 10) The tone of the passage is best described as:<\/p>","a":1,"s":"<p>The author warns of a risk yet says few would return to slide rules and the remedy is &#x27;not to ban the tools&#x27;.<br>Other options: A — explicitly rejects returning to slide rules; C — the passage is critical of blind trust; D — no sarcasm.<\/p>","tag":""},{"id":"1.2.29","m":2,"o":["how a rough hand check can reveal an error in a computer model","that software always overestimates bending moments","the need to order more reinforcing steel","a typical requirement of design codes"],"q":"<p>(Passage 10) The example of a bending moment &#x27;ten times larger than expected&#x27; illustrates:<\/p>","a":0,"s":"<p>It is the case where comparison with a hand estimate signals &#x27;check the model&#x27;.<br>Other options: B — &#x27;always&#x27; is not claimed; C — the passage says the opposite (&#x27;not to order more steel&#x27;); D — codes are not mentioned.<\/p>","tag":""},{"id":"1.2.30","m":2,"o":["Analysis software licences have become cheaper.","Hand calculations take longer than computer analysis.","Most design firms use the same analysis package.","In a test, students trained mainly on software were less able than others to spot obviously wrong computer outputs."],"q":"<p>(Passage 10) Which of the following, if true, would most support the educators&#x27; concern?<\/p>","a":3,"s":"<p>The concern is that software-trained students lack the intuition to detect wrong results; this finding directly supports it.<br>Other options: A, B, C — none bears on whether students develop the ability to judge results.<\/p>","tag":""}]},{"k":"1.3","t":"Error Analysis","qs":[{"id":"1.3.1","m":1,"o":["The results of the soil test was","sent to the design office","by the laboratory","last Friday"],"q":"<p>Identify the part of the sentence that contains an error:<br>The results of the soil test was (A) / sent to the design office (B) / by the laboratory (C) / last Friday. (D)<\/p>","a":0,"s":"<p>Subject-verb agreement: the subject is &#x27;results&#x27; (plural), not &#x27;test&#x27;; use &#x27;The results … were&#x27;.<br>Other options: B, C, D — correct; the error is only in the verb agreeing with the wrong noun.<\/p>","tag":""},{"id":"1.3.2","m":1,"o":["Each of the engineers","on the project","have submitted","a separate report"],"q":"<p>Identify the part of the sentence that contains an error:<br>Each of the engineers (A) / on the project (B) / have submitted (C) / a separate report. (D)<\/p>","a":2,"s":"<p>&#x27;Each&#x27; is singular and takes a singular verb: &#x27;Each of the engineers … has submitted&#x27;.<br>Other options: A — &#x27;each of the + plural noun&#x27; is correct; B, D — correct.<\/p>","tag":""},{"id":"1.3.3","m":1,"o":["When the slab was cast,","neither the contractor","nor the consultants","was present"],"q":"<p>Identify the part of the sentence that contains an error:<br>When the slab was cast, (A) / neither the contractor (B) / nor the consultants (C) / was present. (D)<\/p>","a":3,"s":"<p>With &#x27;neither … nor&#x27;, the verb agrees with the nearer subject, &#x27;consultants&#x27; (plural): &#x27;were present&#x27;.<br>Other options: A, B, C — correct; the conjunction pair itself is properly formed.<\/p>","tag":""},{"id":"1.3.4","m":1,"o":["The committee has approved","the proposal","and have forwarded it","to the ministry"],"q":"<p>Identify the part of the sentence that contains an error:<br>The committee has approved (A) / the proposal (B) / and have forwarded it (C) / to the ministry. (D)<\/p>","a":2,"s":"<p>A collective noun must be treated consistently; having used &#x27;has approved&#x27; (singular), continue with &#x27;has forwarded&#x27;.<br>Other options: A — singular use of &#x27;committee&#x27; acting as one body is correct; B, D — correct.<\/p>","tag":""},{"id":"1.3.5","m":1,"o":["By the time the inspector arrived,","the workers already left","the site,","so the inspection was postponed"],"q":"<p>Identify the part of the sentence that contains an error:<br>By the time the inspector arrived, (A) / the workers already left (B) / the site, (C) / so the inspection was postponed. (D)<\/p>","a":1,"s":"<p>An action completed before another past action takes the past perfect: &#x27;the workers had already left&#x27;.<br>Other options: A — simple past for the later event is correct; C, D — correct.<\/p>","tag":""},{"id":"1.3.6","m":1,"o":["If the beam would have been designed","properly,","it would not have","deflected so much"],"q":"<p>Identify the part of the sentence that contains an error:<br>If the beam would have been designed (A) / properly, (B) / it would not have (C) / deflected so much. (D)<\/p>","a":0,"s":"<p>Third conditional: the if-clause takes the past perfect, &#x27;If the beam had been designed properly&#x27;, not &#x27;would have&#x27;.<br>Other options: B, C, D — the main clause &#x27;would not have deflected&#x27; is the correct form.<\/p>","tag":""},{"id":"1.3.7","m":1,"o":["She works","as a hydraulic engineer","at an university","in Pokhara"],"q":"<p>Identify the part of the sentence that contains an error:<br>She works (A) / as a hydraulic engineer (B) / at an university (C) / in Pokhara. (D)<\/p>","a":2,"s":"<p>The article depends on sound, not spelling: &#x27;university&#x27; begins with a &#x27;yu&#x27; (consonant) sound, so &#x27;a university&#x27;.<br>Other options: A, D — correct; B — &#x27;a hydraulic&#x27; is correct (consonant sound &#x27;h&#x27;).<\/p>","tag":""},{"id":"1.3.8","m":1,"o":["The site engineer said","that the work would finish","in two weeks","and that it was an unique project"],"q":"<p>Identify the part of the sentence that contains an error:<br>The site engineer said (A) / that the work would finish (B) / in two weeks (C) / and that it was an unique project. (D)<\/p>","a":3,"s":"<p>&#x27;Unique&#x27; begins with a &#x27;yu&#x27; (consonant) sound, so it takes &#x27;a&#x27;: &#x27;a unique project&#x27;.<br>Other options: A — correct; B — &#x27;would&#x27; is the correct reported form of &#x27;will&#x27;; C — correct.<\/p>","tag":""},{"id":"1.3.9","m":1,"o":["In every respect","the new design","is superior","than the old one"],"q":"<p>Identify the part of the sentence that contains an error:<br>In every respect (A) / the new design (B) / is superior (C) / than the old one. (D)<\/p>","a":3,"s":"<p>Latin comparatives such as superior, inferior, senior, junior and prior take &#x27;to&#x27;, not &#x27;than&#x27;: &#x27;superior to the old one&#x27;.<br>Other options: A, B, C — correct.<\/p>","tag":""},{"id":"1.3.10","m":1,"o":["The inquiry","found the contractor","to be guilty","for negligence"],"q":"<p>Identify the part of the sentence that contains an error:<br>The inquiry (A) / found the contractor (B) / to be guilty (C) / for negligence. (D)<\/p>","a":3,"s":"<p>The fixed preposition is &#x27;guilty of&#x27; (also &#x27;accused of&#x27;, &#x27;charged with&#x27;): &#x27;guilty of negligence&#x27;.<br>Other options: A, B — correct; C — &#x27;found … to be guilty&#x27; is acceptable.<\/p>","tag":""},{"id":"1.3.11","m":1,"o":["We discussed about","the proposal","at length","in yesterday&#x27;s meeting"],"q":"<p>Identify the part of the sentence that contains an error:<br>We discussed about (A) / the proposal (B) / at length (C) / in yesterday&#x27;s meeting. (D)<\/p>","a":0,"s":"<p>&#x27;Discuss&#x27; is transitive and takes a direct object: &#x27;We discussed the proposal&#x27; (but &#x27;a discussion about&#x27;).<br>Other options: B, C, D — correct.<\/p>","tag":""},{"id":"1.3.12","m":1,"o":["Walking along the embankment, the cracks in the dam were clearly visible.","Walking along the embankment, the inspectors clearly saw the cracks in the dam.","Walking along the embankment, it was clear that the dam had cracks.","While walking along the embankment, the cracks became visible."],"q":"<p>Choose the sentence that does NOT contain a dangling modifier:<\/p>","a":1,"s":"<p>An introductory participle phrase must describe the subject that follows it; in B the inspectors are the ones walking.<br>Other options: A and D — say the cracks were walking; C — &#x27;it&#x27; cannot walk, so the modifier dangles.<\/p>","tag":""},{"id":"1.3.13","m":1,"o":["The new pumping system is","faster, cheaper,","and it is more reliable","than the old one"],"q":"<p>Identify the part of the sentence that contains an error:<br>The new pumping system is (A) / faster, cheaper, (B) / and it is more reliable (C) / than the old one. (D)<\/p>","a":2,"s":"<p>Parallelism: items in a list must share the same form; &#x27;faster, cheaper and more reliable&#x27;.<br>Other options: A, B, D — correct.<\/p>","tag":""},{"id":"1.3.14","m":1,"o":["The duties of a site engineer include","to check the materials,","supervising the workers","and keeping daily records"],"q":"<p>Identify the part of the sentence that contains an error:<br>The duties of a site engineer include (A) / to check the materials, (B) / supervising the workers (C) / and keeping daily records. (D)<\/p>","a":1,"s":"<p>Parallelism (and &#x27;include&#x27; takes a gerund): &#x27;checking the materials, supervising the workers and keeping daily records&#x27;.<br>Other options: A — correct; C, D — gerunds, matching the required form.<\/p>","tag":""},{"id":"1.3.15","m":1,"o":["Not only the design was flawed but also the construction was poor.","Not only the design was flawed, the construction also.","Not only was the design flawed, but also was the construction poor.","Not only was the design flawed, but the construction was also poor."],"q":"<p>Choose the grammatically correct sentence:<\/p>","a":3,"s":"<p>A sentence beginning with &#x27;Not only&#x27; inverts the first clause (&#x27;was the design flawed&#x27;); the &#x27;but (also)&#x27; clause keeps normal word order.<br>Other options: A — no inversion after initial &#x27;Not only&#x27;; B — incomplete second clause; C — wrongly inverts the second clause too.<\/p>","tag":""},{"id":"1.3.16","m":1,"o":["Of the two proposals,","the second is","the best","in terms of cost"],"q":"<p>Identify the part of the sentence that contains an error:<br>Of the two proposals, (A) / the second is (B) / the best (C) / in terms of cost. (D)<\/p>","a":2,"s":"<p>When comparing two things use the comparative: &#x27;the better&#x27;. The superlative is for three or more.<br>Other options: A, B, D — correct.<\/p>","tag":""},{"id":"1.3.17","m":1,"o":["Less accidents","were reported","on the highway","this year"],"q":"<p>Identify the part of the sentence that contains an error:<br>Less accidents (A) / were reported (B) / on the highway (C) / this year. (D)<\/p>","a":0,"s":"<p>Countable plural nouns take &#x27;fewer&#x27;; &#x27;less&#x27; is for uncountable quantities: &#x27;Fewer accidents&#x27;.<br>Other options: B — plural verb is correct for &#x27;accidents&#x27;; C, D — correct.<\/p>","tag":""},{"id":"1.3.18","m":1,"o":["The beam failed because the applied load exceeded its design capacity.","The beam kind of failed because the load was way too big.","Obviously, the beam failed because of the huge load.","The beam got broke as the load was too much."],"q":"<p>Choose the sentence most appropriate for a formal technical report:<\/p>","a":0,"s":"<p>Formal technical register is precise, objective and free of slang: &#x27;applied load exceeded its design capacity&#x27;.<br>Other options: B — slang (&#x27;kind of&#x27;, &#x27;way too&#x27;); C — subjective (&#x27;obviously&#x27;, &#x27;huge&#x27;) and imprecise; D — ungrammatical (&#x27;got broke&#x27;) and informal.<\/p>","tag":""},{"id":"1.3.19","m":1,"o":["The compressive strength ranged between 20 to 25 MPa.","The compressive strength ranged from 20 and 25 MPa.","The compressive strength ranged from 20 to 25 MPa.","The compressive strength ranged among 20 to 25 MPa."],"q":"<p>Choose the correct sentence for a test report:<\/p>","a":2,"s":"<p>The correct pairings are &#x27;from … to&#x27; or &#x27;between … and&#x27;.<br>Other options: A — mixes &#x27;between&#x27; with &#x27;to&#x27;; B — mixes &#x27;from&#x27; with &#x27;and&#x27;; D — &#x27;among&#x27; is for three or more items, not a range.<\/p>","tag":""},{"id":"1.3.20","m":1,"o":["The number of vehicles","using the bridge","have increased","sharply since 2020"],"q":"<p>Identify the part of the sentence that contains an error:<br>The number of vehicles (A) / using the bridge (B) / have increased (C) / sharply since 2020. (D)<\/p>","a":2,"s":"<p>&#x27;The number of&#x27; is singular (the head noun is &#x27;number&#x27;): &#x27;The number … has increased&#x27;.<br>Other options: A, B — correct; D — &#x27;since 2020&#x27; correctly goes with the present perfect.<\/p>","tag":""},{"id":"1.3.21","m":1,"o":["A number of residents","has complained","about the noise","from the new quarry"],"q":"<p>Identify the part of the sentence that contains an error:<br>A number of residents (A) / has complained (B) / about the noise (C) / from the new quarry. (D)<\/p>","a":1,"s":"<p>&#x27;A number of&#x27; means &#x27;several&#x27; and takes a plural verb: &#x27;A number of residents have complained&#x27;.<br>Other options: A, C, D — correct.<\/p>","tag":""},{"id":"1.3.22","m":1,"o":["Hardly had the concrete set than","the carpenters","removed","the formwork"],"q":"<p>Identify the part of the sentence that contains an error:<br>Hardly had the concrete set than (A) / the carpenters (B) / removed (C) / the formwork. (D)<\/p>","a":0,"s":"<p>&#x27;Hardly&#x27; and &#x27;scarcely&#x27; pair with &#x27;when&#x27; (or &#x27;before&#x27;); &#x27;than&#x27; goes with &#x27;no sooner&#x27;. Correct: &#x27;Hardly had the concrete set when …&#x27;.<br>Other options: B, C, D — correct.<\/p>","tag":""},{"id":"1.3.23","m":1,"o":["Along with its annexes,","the proposal","are being reviewed","by the panel"],"q":"<p>Identify the part of the sentence that contains an error:<br>Along with its annexes, (A) / the proposal (B) / are being reviewed (C) / by the panel. (D)<\/p>","a":2,"s":"<p>Phrases such as &#x27;along with&#x27;, &#x27;together with&#x27; and &#x27;as well as&#x27; do not change the number of the subject; &#x27;the proposal … is being reviewed&#x27;.<br>Other options: A, B, D — correct.<\/p>","tag":""},{"id":"1.3.24","m":1,"o":["She was","a honest engineer","who never","falsified test results"],"q":"<p>Identify the part of the sentence that contains an error:<br>She was (A) / a honest engineer (B) / who never (C) / falsified test results. (D)<\/p>","a":1,"s":"<p>The &#x27;h&#x27; in &#x27;honest&#x27; is silent, so it begins with a vowel sound: &#x27;an honest engineer&#x27;.<br>Other options: A, C, D — correct.<\/p>","tag":""},{"id":"1.3.25","m":1,"o":["The project comprises three phases.","The project comprises of three phases.","The project is comprised by three phases.","The project consists three phases."],"q":"<p>Choose the correct sentence for a project proposal:<\/p>","a":0,"s":"<p>&#x27;Comprise&#x27; means &#x27;consist of&#x27; and takes a direct object: &#x27;comprises three phases&#x27;. (&#x27;Consists of&#x27; is the alternative.)<br>Other options: B — &#x27;comprises of&#x27; is a common error; C — wrong preposition and voice; D — &#x27;consist&#x27; needs &#x27;of&#x27;.<\/p>","tag":""},{"id":"1.3.26","m":1,"o":["The structure lost it&#x27;s stiffness after the fire.","The structure lost its&#x27; stiffness after the fire.","The structure lost their stiffness after the fire.","The structure lost its stiffness after the fire."],"q":"<p>Choose the sentence with the correct possessive form:<\/p>","a":3,"s":"<p>The possessive of &#x27;it&#x27; is &#x27;its&#x27; (no apostrophe); &#x27;it&#x27;s&#x27; means &#x27;it is&#x27;.<br>Other options: A — &#x27;it&#x27;s&#x27; = &#x27;it is&#x27;; B — &#x27;its&#x27;&#x27; does not exist; C — &#x27;their&#x27; disagrees with the singular &#x27;structure&#x27;.<\/p>","tag":""},{"id":"1.3.27","m":1,"o":["The laboratory","is testing","these samples","since Monday"],"q":"<p>Identify the part of the sentence that contains an error:<br>The laboratory (A) / is testing (B) / these samples (C) / since Monday. (D)<\/p>","a":1,"s":"<p>An action that began in the past and continues now, with &#x27;since&#x27;, takes the present perfect continuous: &#x27;has been testing&#x27;.<br>Other options: A, C — correct; D — &#x27;since Monday&#x27; is fine once the verb is corrected.<\/p>","tag":""},{"id":"1.3.28","m":1,"o":["The contractor delivered the rusted steel to the site.","The contractor delivered the steel to the site that was rusted.","Rusted, the contractor delivered the steel to the site.","The contractor, rusted, delivered the steel to the site."],"q":"<p>Choose the sentence in which the modifier is placed correctly:<\/p>","a":0,"s":"<p>A modifier should sit next to the word it describes; &#x27;rusted&#x27; directly modifies &#x27;steel&#x27;.<br>Other options: B — &#x27;that was rusted&#x27; now seems to describe the site; C and D — &#x27;rusted&#x27; describes the contractor.<\/p>","tag":""},{"id":"1.3.29","m":1,"o":["One of the","main reasons","for the delays","were the shortage of cement"],"q":"<p>Identify the part of the sentence that contains an error:<br>One of the (A) / main reasons (B) / for the delays (C) / were the shortage of cement. (D)<\/p>","a":3,"s":"<p>The subject is &#x27;One&#x27;, which is singular: &#x27;One of the main reasons … was the shortage of cement&#x27;.<br>Other options: A, B — &#x27;one of the + plural noun&#x27; is correct; C — correct.<\/p>","tag":""},{"id":"1.3.30","m":1,"o":["The engineer recommended that the bridge is closed immediately.","The engineer recommended that the bridge be closed immediately.","The engineer recommended the bridge to close immediately.","The engineer recommended that the bridge will close immediately."],"q":"<p>Choose the correct sentence (standard formal usage):<\/p>","a":1,"s":"<p>Verbs of recommending, insisting and demanding take the subjunctive in formal writing: &#x27;that the bridge be closed&#x27; (British English also accepts &#x27;should be closed&#x27;).<br>Other options: A — indicative &#x27;is closed&#x27; is informal and not accepted as standard formal usage in exams; C — &#x27;recommend + object + to-infinitive&#x27; is non-standard, and the bridge does not close itself; D — &#x27;will&#x27; is wrong after &#x27;recommend that&#x27;.<\/p>","tag":""}]},{"k":"1.4","t":"Analogies","qs":[{"id":"1.4.1","m":1,"o":["barometer : humidity","anemometer : wind speed","hygrometer : pressure","ammeter : voltage"],"q":"<p>THERMOMETER : TEMPERATURE ::<\/p>","a":1,"s":"<p>Instrument : quantity it measures. An anemometer measures wind speed.<br>Other options: A — a barometer measures pressure; C — a hygrometer measures humidity; D — an ammeter measures current.<\/p>","tag":""},{"id":"1.4.2","m":1,"o":["author : manuscript","reader : novel","printer : ink","editor : library"],"q":"<p>ARCHITECT : BLUEPRINT ::<\/p>","a":0,"s":"<p>Creator : thing created. An author produces a manuscript.<br>Other options: B — a reader consumes a novel; C — ink is a material the printer uses; D — an editor does not create a library.<\/p>","tag":""},{"id":"1.4.3","m":1,"o":["elastic : break","rigid : bend","ductile : stretch","porous : repel"],"q":"<p>BRITTLE : SHATTER ::<\/p>","a":2,"s":"<p>Material property : characteristic behaviour. Brittle materials shatter; ductile materials stretch (draw out) before breaking.<br>Other options: A — elastic materials recover rather than break; B — rigid materials resist bending; D — porous materials absorb, not repel.<\/p>","tag":""},{"id":"1.4.4","m":1,"o":["flood : water","storm : wind","heat : sun","famine : food"],"q":"<p>DROUGHT : RAIN ::<\/p>","a":3,"s":"<p>Condition : thing whose lack causes it. A drought is a lack of rain; a famine is a lack of food.<br>Other options: A — a flood is an excess of water; B — a storm involves wind; C — heat comes from the sun, not its absence.<\/p>","tag":""},{"id":"1.4.5","m":1,"o":["hammer : nail","weld : electrode","bolt : spanner","mortar : bricks"],"q":"<p>RIVET : STEEL PLATES ::<\/p>","a":3,"s":"<p>Connector : things it joins. Rivets join steel plates; mortar binds bricks.<br>Other options: A — a hammer drives a nail; B — the electrode makes the weld; C — a spanner tightens a bolt (tool : fastener).<\/p>","tag":""},{"id":"1.4.6","m":1,"o":["timid : bold","lucid : clear","vague : precise","rapid : slow"],"q":"<p>CANDID : FRANK ::<\/p>","a":1,"s":"<p>Synonyms. Candid means frank; lucid means clear.<br>Other options: A, C, D — antonym pairs.<\/p>","tag":""},{"id":"1.4.7","m":1,"o":["frugal : extravagant","honest : truthful","calm : serene","rigid : stiff"],"q":"<p>PRUDENT : RECKLESS ::<\/p>","a":0,"s":"<p>Antonyms. Prudent (careful) is opposite to reckless; frugal (thrifty) is opposite to extravagant.<br>Other options: B, C, D — synonym pairs.<\/p>","tag":""},{"id":"1.4.8","m":1,"o":["page : paragraph","span : bridge","word : letter","pier : river"],"q":"<p>CHAPTER : BOOK ::<\/p>","a":1,"s":"<p>Part : whole. A chapter is a part of a book; a span is a part of a bridge.<br>Other options: A and C — whole : part (reversed order); D — a pier stands in a river but is not part of it.<\/p>","tag":""},{"id":"1.4.9","m":1,"o":["resistance : conductor","mass : volume","voltage : current","current : ammeter"],"q":"<p>FORCE : ACCELERATION ::<\/p>","a":2,"s":"<p>Cause : proportional response. Force produces acceleration (F = ma); voltage drives current (V = IR).<br>Other options: A — resistance is a property of a conductor; B — mass and volume are related through density, not cause and effect; D — quantity : instrument that measures it.<\/p>","tag":""},{"id":"1.4.10","m":1,"o":["carpenter : saw","patient : stethoscope","pilot : runway","chef : restaurant"],"q":"<p>SURVEYOR : THEODOLITE ::<\/p>","a":0,"s":"<p>Worker : tool used. A surveyor uses a theodolite; a carpenter uses a saw.<br>Other options: B — the doctor, not the patient, uses a stethoscope; C — a runway is a place; D — a restaurant is a workplace.<\/p>","tag":""},{"id":"1.4.11","m":1,"o":["capable : incapable","habitable : inhabitable","legible : illegible","moral : immoral"],"q":"<p>INFLAMMABLE : FLAMMABLE ::<\/p>","a":1,"s":"<p>Word pairs that mean the same despite the &#x27;in-&#x27; prefix. Inflammable = flammable; inhabitable = habitable.<br>Other options: A, C, D — the prefix makes an opposite.<\/p>","tag":""},{"id":"1.4.12","m":1,"o":["egg : nest","leaf : branch","brick : wall","tadpole : frog"],"q":"<p>ACORN : OAK ::<\/p>","a":3,"s":"<p>Early stage : mature form. An acorn grows into an oak; a tadpole grows into a frog.<br>Other options: A — a nest holds an egg; B — part : part of a tree; C — unit : assembly, no growth.<\/p>","tag":""},{"id":"1.4.13","m":1,"o":["rot : timber","paint : wall","rust : copper","fire : water"],"q":"<p>CORROSION : STEEL ::<\/p>","a":0,"s":"<p>Deterioration process : material it attacks. Corrosion degrades steel; rot (decay) degrades timber.<br>Other options: B — paint protects a wall; C — &#x27;rust&#x27; strictly refers to iron/steel, not copper; D — water puts out fire.<\/p>","tag":""},{"id":"1.4.14","m":1,"o":["litre : millilitre","second : minute","centimetre : kilometre","gram : kilogram"],"q":"<p>MILLIMETRE : METRE ::<\/p>","a":3,"s":"<p>Smaller unit : unit 1000 times larger. 1 m = 1000 mm; 1 kg = 1000 g.<br>Other options: A — reversed (larger : smaller); B — ratio 1 : 60; C — ratio 1 : 100 000.<\/p>","tag":""},{"id":"1.4.15","m":1,"o":["timid : fight","lethargic : run","voracious : eat","frugal : spend"],"q":"<p>LOQUACIOUS : TALK ::<\/p>","a":2,"s":"<p>Person with the trait : what they do excessively. A loquacious person talks a lot; a voracious person eats a lot.<br>Other options: A, B, D — the trait implies doing the action little, not excessively.<\/p>","tag":""},{"id":"1.4.16","m":1,"o":["dyke : sea","pipe : water","window : light","road : traffic"],"q":"<p>DAM : WATER ::<\/p>","a":0,"s":"<p>Barrier : what it holds back. A dam holds back water; a dyke holds back the sea.<br>Other options: B — a pipe conveys water; C — a window lets light through; D — a road carries traffic.<\/p>","tag":""},{"id":"1.4.17","m":1,"o":["brick : mortar","oven : bread","flour : dough","steel : ore"],"q":"<p>CEMENT : CONCRETE ::<\/p>","a":2,"s":"<p>Ingredient : mixture made with it. Cement is an ingredient of concrete; flour is an ingredient of dough.<br>Other options: A — brick and mortar are separate materials; B — an oven is equipment; D — steel is extracted from ore (product : source).<\/p>","tag":""},{"id":"1.4.18","m":1,"o":["creep : sustained loading","buckling : axial tension","shrinkage : applied load","corrosion : dry air"],"q":"<p>FATIGUE : CYCLIC LOADING ::<\/p>","a":0,"s":"<p>Failure/deformation mode : its cause. Fatigue results from cyclic (repeated) loading; creep results from sustained loading over time.<br>Other options: B — buckling is caused by compression, not tension; C — shrinkage occurs without load (moisture loss); D — dry air inhibits corrosion.<\/p>","tag":""},{"id":"1.4.19","m":1,"o":["exacerbate : relieve","corroborate : confirm","abate : increase","obviate : require"],"q":"<p>ENERVATE : WEAKEN ::<\/p>","a":1,"s":"<p>Synonyms. Enervate means weaken (not &#x27;energise&#x27;); corroborate means confirm.<br>Other options: A — exacerbate means worsen; C — abate means decrease; D — obviate means make unnecessary: all antonym pairs.<\/p>","tag":""},{"id":"1.4.20","m":1,"o":["lucid : clear","ample : plenty","opaque : transparent","rapid : fast"],"q":"<p>VERBOSE : CONCISE ::<\/p>","a":2,"s":"<p>Antonyms. Verbose (wordy) is the opposite of concise; opaque is the opposite of transparent.<br>Other options: A, B, D — synonym pairs.<\/p>","tag":""},{"id":"1.4.21","m":1,"o":["pascal : force","newton : pressure","ohm : current","joule : energy"],"q":"<p>KILOWATT : POWER ::<\/p>","a":3,"s":"<p>Unit : quantity it measures. The kilowatt is a unit of power; the joule is a unit of energy.<br>Other options: A — pascal is the unit of pressure; B — newton is the unit of force; C — ohm is the unit of resistance.<\/p>","tag":""},{"id":"1.4.22","m":1,"o":["roof : wall","pier : deck","chimney : roof","window : frame"],"q":"<p>FOOTING : COLUMN ::<\/p>","a":1,"s":"<p>Supporting element : element it supports. A footing supports a column; a pier supports a bridge deck.<br>Other options: A — a wall supports a roof (reversed); C — a chimney passes through a roof; D — a frame holds a window (reversed).<\/p>","tag":""},{"id":"1.4.23","m":1,"o":["drawing : pencil","key : lock","scale model : prototype","book : shelf"],"q":"<p>MAP : TERRITORY ::<\/p>","a":2,"s":"<p>Scaled representation : the real thing. A map represents a territory; a hydraulic scale model represents its full-size prototype.<br>Other options: A — a pencil is the tool for a drawing; B — a key operates a lock; D — a shelf holds a book.<\/p>","tag":""},{"id":"1.4.24","m":1,"o":["fireproof : flame","transparent : light","soluble : liquid","elastic : strain"],"q":"<p>IMPERVIOUS : WATER ::<\/p>","a":0,"s":"<p>Resistant to : agent. An impervious material does not let water through; a fireproof material resists flame.<br>Other options: B — transparent lets light through (the opposite relation); C — soluble dissolves in a liquid; D — elastic materials undergo strain.<\/p>","tag":""},{"id":"1.4.25","m":1,"o":["sage : wisdom","athlete : stre
