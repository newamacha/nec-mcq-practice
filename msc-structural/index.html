,"m":1,"o":["1.50","1.12","1.80","2.34"],"q":"<p>A T-section has a flange 100 mm × 20 mm and a web 80 mm deep × 20 mm thick (overall depth 100 mm). Its elastic section modulus (to the extreme fibre farther from the neutral axis) is 46 360 mm³. The shape factor is about:<\/p>","a":2,"s":"<p>Area 3600 mm² → plastic NA where 1800 mm² lies above: 18 mm below the top of the flange. Zp = 100 × 18 × 9 + 100 × 2 × 1 + 1600 × (60 − 18) = 16 200 + 200 + 67 200 = 83 600 mm³. S = 83 600/46 360 = 1.80.<br>Other options: A — rectangle value assumed; B — I-section value; D — triangle value.<\/p>","tag":""},{"id":"3.6.30","m":1,"o":["1.375","1.50","1.25","1.125"],"q":"<p>A rectangular beam section is loaded beyond first yield until the yielded zones extend d/4 from both top and bottom faces (elastic core = d/2). The ratio of the moment carried to the first-yield moment My is:<\/p>","a":0,"s":"<p>M = fy b (d²/4 − c²/3) with half-core c = d/4 → M = fy bd² (1/4 − 1/48) = (11/48) fy bd². My = fy bd²/6 → ratio = 11/8 = 1.375.<br>Other options: B — fully plastic (shape factor); C — linear interpolation between 1 and 1.5; D — no basis.<\/p>","tag":""}]}]},{"n":4,"t":"Geotechnical Engineering","subs":[{"k":"4.1","t":"Phase Relationships, Classification and Clay Mineralogy","qs":[{"id":"4.1.1","m":1,"o":["0.625","0.375","0.600","1.500"],"q":"<p>A soil sample has a void ratio of 0.60. Its porosity is:<\/p>","a":1,"s":"<p>n = e/(1 + e) = 0.60/1.60 = 0.375.<br>Other options: A — 1/(1 + e) is Vs/V, the solids fraction (= 1 − n); C — this is the void ratio itself; D — e/(1 − e) is a wrong inversion of n = e/(1 + e).<\/p>","tag":""},{"id":"4.1.2","m":1,"o":["0.074","0.20","0.54","0.35"],"q":"<p>A fully saturated clay has water content 20% and specific gravity of solids 2.70. Its void ratio is:<\/p>","a":2,"s":"<p>Se = wG with S = 1: e = 0.20 × 2.70 = 0.54.<br>Other options: A — w/G — the relation inverted; B — taking e = w and forgetting G; D — this is the porosity n = e/(1 + e), not e.<\/p>","tag":""},{"id":"4.1.3","m":1,"o":["S = weG","e = SwG","Se = wG","wS = eG"],"q":"<p>The fundamental relation between degree of saturation S, void ratio e, water content w and specific gravity of solids G is:<\/p>","a":2,"s":"<p>Vw = wGVs/1 (in units of Vs·ρw) and S = Vw/Vv = wG/e, hence Se = wG.<br>Other options: A — dimensionally consistent but wrong; e and G are not multiplied together; B — S belongs on the side of e, not with w and G; D — w and e are swapped.<\/p>","tag":""},{"id":"4.1.4","m":1,"o":["15.76 kN/m³","19.62 kN/m³","9.81 kN/m³","17.69 kN/m³"],"q":"<p>A soil has G = 2.65, e = 0.65 and S = 50%. Taking γw = 9.81 kN/m³, its bulk unit weight is:<\/p>","a":3,"s":"<p>γ = (G + Se)γw/(1 + e) = (2.65 + 0.325) × 9.81/1.65 = 17.69 kN/m³.<br>Other options: A — dry unit weight G·γw/(1 + e) — the water is ignored; B — saturated unit weight (S = 1); C — submerged unit weight (G − 1)γw/(1 + e).<\/p>","tag":""},{"id":"4.1.5","m":1,"o":["1.657 g/cm³","1.696 g/cm³","2.242 g/cm³","1.800 g/cm³"],"q":"<p>A soil has bulk density 1.95 g/cm³ and water content 15%. Its dry density is:<\/p>","a":1,"s":"<p>ρd = ρ/(1 + w) = 1.95/1.15 = 1.696 g/cm³.<br>Other options: A — ρ(1 − w) — an approximate, wrong conversion; C — ρ(1 + w) — multiplying instead of dividing; D — subtracting w directly from ρ.<\/p>","tag":""},{"id":"4.1.6","m":1,"o":["19.39 kN/m³","9.58 kN/m³","15.29 kN/m³","22.89 kN/m³"],"q":"<p>For a saturated soil with G = 2.68 and e = 0.72 (γw = 9.81 kN/m³), the submerged unit weight is:<\/p>","a":1,"s":"<p>γ&#x27; = (G − 1)γw/(1 + e) = 1.68 × 9.81/1.72 = 9.58 kN/m³.<br>Other options: A — this is γsat; γw was not subtracted; C — dry unit weight; D — divided by e instead of (1 + e).<\/p>","tag":""},{"id":"4.1.7","m":1,"o":["17.8%","40.0%","26.7%","32.0%"],"q":"<p>A soil has void ratio 0.80 and degree of saturation 60%. Its percentage air voids (na) is:<\/p>","a":0,"s":"<p>n = 0.8/1.8 = 0.4444; na = n(1 − S) = 17.8%.<br>Other options: B — this is the air content ac = Va/Vv = 1 − S; C — n·S is the volume fraction of water, not air; D — used e instead of n.<\/p>","tag":""},{"id":"4.1.8","m":1,"o":["25.0%","83.3%","33.3%","75.0%"],"q":"<p>A sand has emax = 0.90, emin = 0.50 and in-situ void ratio 0.60. Its relative density is:<\/p>","a":3,"s":"<p>Dr = (emax − e)/(emax − emin) = 0.30/0.40 = 75%, i.e. a dense sand.<br>Other options: A — (e − emin)/(emax − emin) — the complement of Dr; B — emin/e has no meaning as density index; C — wrong denominator.<\/p>","tag":""},{"id":"4.1.9","m":1,"o":["0.40","1.40","0.60","0.70"],"q":"<p>A clay has liquid limit 50%, plastic limit 25% and natural water content 35%. Its consistency index is:<\/p>","a":2,"s":"<p>Ip = 25; Ic = (wL − w)/Ip = (50 − 35)/25 = 0.60.<br>Other options: A — this is the liquidity index (w − wP)/Ip; B — w/Ip — wrong formula; D — w/wL — wrong formula.<\/p>","tag":""},{"id":"4.1.10","m":1,"o":["1.11, active","0.90, inactive","0.36, inactive","0.90, normal"],"q":"<p>A clay has plasticity index 36% and 40% of particles finer than 2 µm. Its activity and Skempton&#x27;s class are:<\/p>","a":3,"s":"<p>A = Ip/(% &lt; 2 µm) = 36/40 = 0.90; 0.75 ≤ A ≤ 1.25 is normal.<br>Other options: A — clay fraction/Ip — the ratio inverted; B — inactive is A &lt; 0.75; C — Ip/100, the clay fraction ignored.<\/p>","tag":""},{"id":"4.1.11","m":1,"o":["At which the soil begins to behave as a liquid","Below which further loss of water causes no further reduction in volume","At which a 3 mm thread just begins to crumble","At which the soil is fully saturated at maximum dry density"],"q":"<p>The shrinkage limit of a soil is the water content:<\/p>","a":1,"s":"<p>At SL the soil is still saturated but further drying removes water from pores that air enters, so volume stays constant.<br>Other options: A — that is the liquid limit; C — that is the plastic limit; D — that relates to compaction, not consistency.<\/p>","tag":""},{"id":"4.1.12","m":1,"o":["Cu = 6.0, Cc = 1.19","Cu = 6.0, Cc = 0.44","Cu = 0.17, Cc = 1.19","Cu = 2.25, Cc = 2.67"],"q":"<p>A sand has D10 = 0.15 mm, D30 = 0.40 mm and D60 = 0.90 mm. Its uniformity coefficient Cu and coefficient of curvature Cc are:<\/p>","a":0,"s":"<p>Cu = D60/D10 = 6.0; Cc = D30²/(D10·D60) = 0.16/0.135 = 1.19.<br>Other options: B — D30/D60 is not the Cc formula; C — Cu inverted (D10/D60); D — ratios of adjacent sizes, not the defined coefficients.<\/p>","tag":""},{"id":"4.1.13","m":1,"o":["SP","GW","SW","SM"],"q":"<p>As per IS 1498, a sand with less than 5% fines, Cu = 8 and Cc = 2 is classified as:<\/p>","a":2,"s":"<p>Fines &lt; 5%, Cu &gt; 6 and 1 ≤ Cc ≤ 3 → well-graded sand, SW.<br>Other options: A — SP is for sands not meeting Cu &gt; 6 and 1 ≤ Cc ≤ 3; B — G is used when the gravel fraction dominates; D — SM needs more than 12% silty fines.<\/p>","tag":""},{"id":"4.1.14","m":1,"o":["MI","CI","CH","CL"],"q":"<p>As per IS 1498, an inorganic fine-grained soil has liquid limit 45% and plasticity index 22%. It is classified as:<\/p>","a":1,"s":"<p>A-line: Ip = 0.73(wL − 20) = 0.73 × 25 = 18.25. Ip = 22 &gt; 18.25 → clay; 35 &lt; wL &lt; 50 → intermediate: CI.<br>Other options: A — M plots below the A-line; this soil plots above it; C — H needs wL &gt; 50%; D — L needs wL &lt; 35%.<\/p>","tag":""},{"id":"4.1.15","m":1,"o":["MH","CH","MI","CI"],"q":"<p>As per IS 1498, an inorganic fine-grained soil has liquid limit 60% and plasticity index 18%. It is classified as:<\/p>","a":0,"s":"<p>A-line: 0.73(60 − 20) = 29.2. Ip = 18 &lt; 29.2 → silt; wL &gt; 50% → high compressibility: MH.<br>Other options: B — C needs Ip above the A-line value of 29.2; C — I is for 35% &lt; wL &lt; 50%; D — wrong on both letters.<\/p>","tag":""},{"id":"4.1.16","m":1,"o":["Kaolinite","Montmorillonite","Illite","Halloysite"],"q":"<p>Which clay mineral shows the greatest swelling and shrinkage on wetting and drying?<\/p>","a":1,"s":"<p>Montmorillonite layers are held only by weak van der Waals forces and exchangeable cations, so water enters between layers easily.<br>Other options: A — strong hydrogen bonding between layers; least swelling; C — potassium ions bond the layers; moderate swelling; D — a kaolin-group mineral with low swelling.<\/p>","tag":""},{"id":"4.1.17","m":1,"o":["One gibbsite sheet between two silica sheets bonded by potassium ions","One gibbsite sheet between two silica sheets with water and exchangeable cations between layers","Two gibbsite sheets with a brucite sheet between layers","One silica sheet and one gibbsite sheet held by hydrogen bonds"],"q":"<p>The basic structural unit of kaolinite consists of:<\/p>","a":3,"s":"<p>Kaolinite is a 1:1 mineral; the strong hydrogen bonds between layers make it stable and low in swell.<br>Other options: A — that is illite; B — that is montmorillonite; C — no such clay; brucite occurs in chlorite.<\/p>","tag":""},{"id":"4.1.18","m":1,"o":["Hydrogen bonds","Water molecules only","Calcium carbonate cementation","Potassium ions"],"q":"<p>In illite, the adjacent 2:1 sheet units are bonded together mainly by:<\/p>","a":3,"s":"<p>Non-exchangeable K⁺ ions fit into the hexagonal holes of the silica sheets, giving illite intermediate properties.<br>Other options: A — that is kaolinite; B — describes montmorillonite&#x27;s weak bond; C — not a clay mineral bond.<\/p>","tag":""},{"id":"4.1.19","m":1,"o":["One-half","Twice","One-fourth","One-eighth"],"q":"<p>In a hydrometer analysis based on Stokes&#x27; law, if the particle diameter is halved, its settling velocity becomes:<\/p>","a":2,"s":"<p>v = (γs − γw)D²/(18μ), so v ∝ D²: (1/2)² = 1/4.<br>Other options: A — velocity varies with D², not D; B — velocity decreases with smaller size; D — that would be D³.<\/p>","tag":""},{"id":"4.1.20","m":1,"o":["2.667","1.600","1.278","0.615"],"q":"<p>In a pycnometer test: empty pycnometer 600 g, pycnometer + dry soil 1000 g, pycnometer + soil + water 1750 g, pycnometer full of water 1500 g. The specific gravity of the soil solids is:<\/p>","a":0,"s":"<p>G = (W2 − W1)/[(W2 − W1) − (W3 − W4)] = 400/(400 − 250) = 2.667.<br>Other options: B — divided by (W3 − W4) instead of (W2 − W1) − (W3 − W4); C — ratio of the two water-filled masses; D — added (W3 − W4) instead of subtracting it.<\/p>","tag":""},{"id":"4.1.21","m":1,"o":["105 °C to 110 °C","60 °C to 65 °C","150 °C to 160 °C","200 °C to 250 °C"],"q":"<p>As per IS 2720 (Part 2), the water content of a soil by the oven-drying method is determined by drying the sample at:<\/p>","a":0,"s":"<p>Standard oven drying is at 105–110 °C until constant mass (about 24 h).<br>Other options: B — used only for gypsum/organic soils, not the standard; C — too hot; may drive off structural water; D — would burn organics and destroy clay structure.<\/p>","tag":""},{"id":"4.1.22","m":1,"o":["1.655","0.396","0.655","0.688"],"q":"<p>A soil has dry unit weight 16.0 kN/m³ and G = 2.70 (γw = 9.81 kN/m³). Its void ratio is:<\/p>","a":2,"s":"<p>γd = Gγw/(1 + e) → e = 2.70 × 9.81/16.0 − 1 = 0.655.<br>Other options: A — Gγw/γd = 1 + e; the 1 was not subtracted; B — this is the porosity; D — γw taken as 10 kN/m³ instead of the stated 9.81.<\/p>","tag":""},{"id":"4.1.23","m":1,"o":["2.050 g/cm³","1.763 g/cm³","2.337 g/cm³","1.798 g/cm³"],"q":"<p>A core cutter of volume 1000 cm³ holds 2050 g of moist soil whose water content is 14%. The dry density is:<\/p>","a":3,"s":"<p>ρ = 2.05 g/cm³; ρd = 2.05/1.14 = 1.798 g/cm³.<br>Other options: A — this is the bulk density; B — ρ(1 − w) — wrong conversion; C — multiplied by (1 + w).<\/p>","tag":""},{"id":"4.1.24","m":1,"o":["14.63 kN/m³","9.21 kN/m³","22.64 kN/m³","19.02 kN/m³"],"q":"<p>A saturated clay has water content 30% and G = 2.70. With γw = 9.81 kN/m³, its saturated unit weight is:<\/p>","a":3,"s":"<p>e = wG = 0.81; γsat = (G + e)γw/(1 + e) = 3.51 × 9.81/1.81 = 19.02 kN/m³.<br>Other options: A — this is γd; B — this is γ&#x27;; C — took e = w instead of e = wG.<\/p>","tag":""},{"id":"4.1.25","m":1,"o":["All particles are nearly the same size","Some intermediate particle sizes are missing","Particles of all sizes are present in good proportion","More than 50% passes the 75 µm sieve"],"q":"<p>A gap-graded soil is one in which:<\/p>","a":1,"s":"<p>The grain-size curve shows a flat (horizontal) portion over the missing range of sizes.<br>Other options: A — that is uniformly (poorly) graded; C — that is well graded; D — that defines a fine-grained soil.<\/p>","tag":""},{"id":"4.1.26","m":1,"o":["4.75 mm sieve","75 µm sieve","425 µm sieve","2 mm sieve"],"q":"<p>As per IS 1498, a soil is called coarse-grained when more than half of its total mass is retained on the:<\/p>","a":1,"s":"<p>More than 50% retained on 75 µm → coarse grained; then gravel or sand based on the 4.75 mm sieve.<br>Other options: A — that separates gravel from sand within coarse soils; C — used for Atterberg-limit samples, not the coarse/fine boundary; D — not the IS coarse/fine boundary.<\/p>","tag":""},{"id":"4.1.27","m":1,"o":["25 blows","10 blows","50 blows","15 blows"],"q":"<p>In the Casagrande liquid limit test, the liquid limit is the water content at which the groove closes over about 13 mm at:<\/p>","a":0,"s":"<p>The flow curve (w vs log N) is read at N = 25.<br>Other options: B — not the standard count; C — not the standard count; D — not the standard count.<\/p>","tag":""},{"id":"4.1.28","m":1,"o":["2.0","0.5","288","36"],"q":"<p>A soil has plasticity index 24% and flow index 12%. Its toughness index is:<\/p>","a":0,"s":"<p>It = Ip/If = 24/12 = 2.0.<br>Other options: B — If/Ip — inverted; C — product, not ratio; D — sum, not ratio.<\/p>","tag":""},{"id":"4.1.29","m":1,"o":["Regain of strength with time after remoulding, at constant water content","Loss of strength due to remoulding","Increase in volume on shearing","Decrease of volume under sustained load"],"q":"<p>Thixotropy of a clay refers to:<\/p>","a":0,"s":"<p>Thixotropic hardening is a reversible, time-dependent strength gain as the particle structure re-orients.<br>Other options: B — that is sensitivity; C — that is dilatancy; D — that is consolidation/creep.<\/p>","tag":""},{"id":"4.1.30","m":1,"o":["Plastic limit &lt; shrinkage limit &lt; liquid limit","Liquid limit &lt; plastic limit &lt; shrinkage limit","Shrinkage limit &lt; plastic limit &lt; liquid limit","Shrinkage limit &lt; liquid limit &lt; plastic limit"],"q":"<p>For a fine-grained plastic soil, the correct order of the Atterberg limits is:<\/p>","a":2,"s":"<p>Drying moves the soil from liquid → plastic → semi-solid → solid, passing LL, then PL, then SL.<br>Other options: A — SL is the lowest; B — order reversed; D — LL is the highest.<\/p>","tag":""}]},{"k":"4.2","t":"Compaction, Permeability, Effective Stress and Seepage","qs":[{"id":"4.2.1","m":1,"o":["4.9 kg rammer, 450 mm drop, 5 layers, 25 blows per layer","2.6 kg rammer, 450 mm drop, 3 layers, 56 blows per layer","4.9 kg rammer, 310 mm drop, 3 layers, 25 blows per layer","2.6 kg rammer, 310 mm drop, 3 layers, 25 blows per layer"],"q":"<p>As per IS 2720 (Part 7), the light (standard Proctor) compaction test uses:<\/p>","a":3,"s":"<p>Light compaction: 2.6 kg rammer falling 310 mm, 3 layers, 25 blows each in a 1000 cm³ mould.<br>Other options: A — that is heavy compaction, IS 2720 (Part 8); B — mixed-up parameters; C — mixed-up parameters.<\/p>","tag":""},{"id":"4.2.2","m":1,"o":["1.9 times","2.7 times","1.7 times","4.6 times"],"q":"<p>As per IS 2720 (Parts 7 and 8), the compactive energy of heavy compaction (4.9 kg, 450 mm, 5 layers) compared with light compaction (2.6 kg, 310 mm, 3 layers), same blows per layer and same mould, is about:<\/p>","a":3,"s":"<p>Ratio = (4.9 × 0.45 × 5)/(2.6 × 0.31 × 3) = 4.56, i.e. about 4.6.<br>Other options: A — only the rammer mass ratio; B — number of layers ignored; C — only the layer ratio.<\/p>","tag":""},{"id":"4.2.3","m":1,"o":["Higher maximum dry density and higher optimum moisture content","Higher maximum dry density and lower optimum moisture content","Lower maximum dry density and lower optimum moisture content","No change in maximum dry density"],"q":"<p>Increasing the compactive effort on a given soil results in:<\/p>","a":1,"s":"<p>The compaction curve shifts up and to the left; the line of optimums runs roughly parallel to the zero-air-voids line.<br>Other options: A — OMC decreases, not increases; C — MDD increases with effort; D — MDD clearly increases.<\/p>","tag":""},{"id":"4.2.4","m":1,"o":["18.85 kN/m³","23.03 kN/m³","17.91 kN/m³","26.49 kN/m³"],"q":"<p>For a soil with G = 2.70 at water content 15% (γw = 9.81 kN/m³), the dry unit weight on the zero-air-voids line is:<\/p>","a":0,"s":"<p>γd(ZAV) = Gγw/(1 + wG) = 26.487/1.405 = 18.85 kN/m³.<br>Other options: B — used (1 + w) instead of (1 + wG); C — 5% air voids line, not zero air voids; D — unit weight of solids, w ignored.<\/p>","tag":""},{"id":"4.2.5","m":1,"o":["A flocculated particle arrangement and higher permeability","Higher swelling potential and higher strength","A dispersed particle arrangement and lower permeability","A flocculated arrangement and higher shrinkage"],"q":"<p>A clay compacted on the wet side of optimum, compared with the same clay compacted dry of optimum, tends to have:<\/p>","a":2,"s":"<p>Extra water lets particles align (dispersed); permeability falls, shrinkage rises, swelling and strength fall.<br>Other options: A — that describes the dry side; B — dry-side clays swell more and are stronger; D — wet side is dispersed and shrinks more.<\/p>","tag":""},{"id":"4.2.6","m":1,"o":["Smooth-wheeled roller","Vibratory roller","Sheepsfoot roller","Grid roller"],"q":"<p>The most suitable roller for compacting clayey soils in embankments is the:<\/p>","a":2,"s":"<p>The protruding feet give kneading action and high contact pressure, ideal for cohesive soils.<br>Other options: A — suited to finishing base courses; poor in clay; B — best for cohesionless soils; D — used mainly for breaking and compacting rocky fill.<\/p>","tag":""},{"id":"4.2.7","m":1,"o":["105.3%","5.0%","87.7%","95.0%"],"q":"<p>A field dry density of 17.1 kN/m³ is measured. Laboratory maximum dry density is 18.0 kN/m³ and the zero-air-voids dry density at the field water content is 19.5 kN/m³. The relative compaction is:<\/p>","a":3,"s":"<p>RC = γd(field)/γd,max(lab) = 17.1/18.0 = 95%.<br>Other options: A — ratio inverted; B — this is the shortfall, not relative compaction; C — ZAV density used instead of laboratory MDD.<\/p>","tag":""},{"id":"4.2.8","m":1,"o":["0.0080 cm/s","0.48 cm/s","0.0320 cm/s","0.0160 cm/s"],"q":"<p>In a constant-head permeability test, specimen length 20 cm, area 50 cm², head difference 40 cm, and 240 cm³ of water is collected in 5 minutes. The coefficient of permeability is:<\/p>","a":0,"s":"<p>k = QL/(Aht) = 240 × 20/(50 × 40 × 300) = 0.0080 cm/s.<br>Other options: B — time taken as 5 instead of 300 s; C — hydraulic gradient inverted (L/h); D — this is the discharge velocity; gradient ignored.<\/p>","tag":""},{"id":"4.2.9","m":1,"o":["1.16 × 10⁻³ cm/s","5.02 × 10⁻⁴ cm/s","4.62 × 10⁻¹ cm/s","3.33 × 10⁻³ cm/s"],"q":"<p>In a falling-head test: standpipe area 1 cm², specimen area 20 cm², length 10 cm; head falls from 50 cm to 25 cm in 300 s. The coefficient of permeability is:<\/p>","a":0,"s":"<p>k = (aL/At) ln(h1/h2) = (1 × 10/(20 × 300)) × ln 2 = 1.16 × 10⁻³ cm/s.<br>Other options: B — log₁₀ used without the 2.303 factor; C — areas a and A interchanged; D — h1/h2 used without the logarithm.<\/p>","tag":""},{"id":"4.2.10","m":1,"o":["0.0012 cm/s","0.0050 cm/s","0.0045 cm/s","0.0075 cm/s"],"q":"<p>The discharge (superficial) velocity through a sand of porosity 0.40 is 0.003 cm/s. The seepage velocity is:<\/p>","a":3,"s":"<p>vs = v/n = 0.003/0.40 = 0.0075 cm/s.<br>Other options: A — multiplied by n instead of dividing; B — divided by (1 − n), the solids fraction; C — divided by e instead of n.<\/p>","tag":""},{"id":"4.2.11","m":1,"o":["2.03 × 10⁻⁵ m/s","2.35 × 10⁻⁵ m/s","5.00 × 10⁻⁶ m/s","1.41 × 10⁻⁴ m/s"],"q":"<p>A deposit consists of three horizontal layers: 2 m (k = 4 × 10⁻⁵ m/s), 1 m (k = 1 × 10⁻⁶ m/s) and 3 m (k = 2 × 10⁻⁵ m/s). The equivalent coefficient of permeability for flow parallel to the layers is:<\/p>","a":1,"s":"<p>kh = Σkᵢhᵢ/Σhᵢ = (8 + 0.1 + 6) × 10⁻⁵/6 = 2.35 × 10⁻⁵ m/s.<br>Other options: A — simple average of k, thicknesses ignored; C — this is the equivalent vertical (normal) permeability; D — Σkh not divided by total thickness.<\/p>","tag":""},{"id":"4.2.12","m":1,"o":["2.35 × 10⁻⁵ m/s","5.00 × 10⁻⁶ m/s","2.79 × 10⁻⁶ m/s","1.00 × 10⁻⁶ m/s"],"q":"<p>For a deposit of three layers 2 m (k = 4 × 10⁻⁵ m/s), 1 m (k = 1 × 10⁻⁶ m/s) and 3 m (k = 2 × 10⁻⁵ m/s), the equivalent coefficient of permeability for flow perpendicular to the layers is:<\/p>","a":1,"s":"<p>kv = H/Σ(hᵢ/kᵢ) = 6/(5 × 10⁴ + 10⁶ + 1.5 × 10⁵) = 5.00 × 10⁻⁶ m/s.<br>Other options: A — this is the parallel-flow (horizontal) value; C — harmonic mean of k without layer thicknesses; D — only the least permeable layer.<\/p>","tag":""},{"id":"4.2.13","m":1,"o":["4.0 cm/s","2.0 cm/s","0.0004 cm/s","0.04 cm/s"],"q":"<p>Using Hazen&#x27;s formula k = C·D10² with C = 100 (k in cm/s, D10 in cm), a clean sand with D10 = 0.2 mm has k of about:<\/p>","a":3,"s":"<p>k = 100 × (0.02)² = 0.04 cm/s.<br>Other options: A — D10 used in mm instead of cm; B — D10 not squared; C — constant C omitted.<\/p>","tag":""},{"id":"4.2.14","m":1,"o":["2.11 times","1.78 times","2.37 times","1.33 times"],"q":"<p>According to the Kozeny–Carman relation k ∝ e³/(1 + e), if the void ratio of a sand increases from 0.60 to 0.80, its permeability becomes about:<\/p>","a":0,"s":"<p>Ratio = (0.512/1.8)/(0.216/1.6) = 2.107.<br>Other options: B — used k ∝ e²; C — the (1 + e) term ignored; D — used k ∝ e.<\/p>","tag":""},{"id":"4.2.15","m":1,"o":["74.76 kPa","114.00 kPa","55.14 kPa","80.76 kPa"],"q":"<p>Water table is 2 m below ground. Soil above it has γ = 17 kN/m³ and below it γsat = 20 kN/m³ (γw = 9.81 kN/m³). The vertical effective stress at 6 m depth is:<\/p>","a":0,"s":"<p>σ = 34 + 80 = 114 kPa; u = 4 × 9.81 = 39.24 kPa; σ&#x27; = 74.76 kPa.<br>Other options: B — total stress; pore pressure not subtracted; C — pore pressure taken over the full 6 m instead of 4 m; D — γsat used for the dry top 2 m as well.<\/p>","tag":""},{"id":"4.2.16","m":1,"o":["0.74 m","1.49 m","0.37 m","14.88 m"],"q":"<p>Taking surface tension 0.073 N/m, zero contact angle and γw = 9.81 kN/m³, the capillary rise in a soil whose effective pore diameter is 0.02 mm is about:<\/p>","a":1,"s":"<p>hc = 4T/(γw·d) = 4 × 0.073/(9810 × 2 × 10⁻⁵) = 1.488 m.<br>Other options: A — diameter used in place of radius in 2T/(rγw); C — missing factor 4; D — diameter taken as 0.002 mm.<\/p>","tag":""},{"id":"4.2.17","m":1,"o":["Greater than the total stress, because pore water pressure is negative","Less than the total stress, because pore water pressure is positive","Equal to the total stress, because pore pressure is zero","Zero, because the soil is saturated"],"q":"<p>In the zone of capillary saturation above the water table, the effective stress is:<\/p>","a":0,"s":"<p>u = −γw·hw in the capillary zone, so σ&#x27; = σ − u = σ + γw·hw.<br>Other options: B — pore pressure is negative (suction) above the WT; C — zero only at the water table itself; D — saturation does not make σ&#x27; zero.<\/p>","tag":""},{"id":"4.2.18","m":1,"o":["2.54","1.61","1.00","0.39"],"q":"<p>The critical hydraulic gradient for a sand with G = 2.65 and e = 0.65 is:<\/p>","a":2,"s":"<p>ic = (G − 1)/(1 + e) = 1.65/1.65 = 1.00.<br>Other options: A — divided by e instead of (1 + e); B — 1 not subtracted from G; D — this is the porosity.<\/p>","tag":""},{"id":"4.2.19","m":1,"o":["Stiff clay under downward seepage","Fine sand subjected to upward seepage at a gradient equal to or exceeding the critical gradient","Coarse gravel under any seepage","Dry sand under static load"],"q":"<p>Quick sand condition is most likely to develop in:<\/p>","a":1,"s":"<p>When i ≥ ic upward, σ&#x27; → 0 and a cohesionless soil loses all strength.<br>Other options: A — downward seepage increases σ&#x27;; clays have cohesion; C — gravels need impractically large flow to reach ic; D — requires upward seepage of water.<\/p>","tag":""},{"id":"4.2.20","m":1,"o":["0.25","9.60","10.72","3.95"],"q":"<p>A sheet-pile cofferdam rests in sand with G = 2.68 and e = 0.70. The exit gradient from the flow net is 0.25. The factor of safety against piping (boiling) is:<\/p>","a":3,"s":"<p>ic = 1.68/1.70 = 0.988; FS = ic/ie = 3.95.<br>Other options: A — ratio inverted; B — ic computed with e instead of (1 + e); C — G used instead of ic.<\/p>","tag":""},{"id":"4.2.21","m":1,"o":["3.11 m³/day","0.0576 m³/day","0.0144 m³/day","0.346 m³/day"],"q":"<p>A flow net under a weir has 4 flow channels and 12 equipotential drops. Head loss is 6 m and k = 2 × 10⁻⁶ m/s. The seepage loss per metre length of weir is:<\/p>","a":3,"s":"<p>q = kH·Nf/Nd = 2 × 10⁻⁶ × 6 × 4/12 = 4 × 10⁻⁶ m³/s/m = 0.346 m³/day/m.<br>Other options: A — Nd/Nf used instead of Nf/Nd; B — head H omitted; C — converted with 3600 s (per hour), not 86 400 s.<\/p>","tag":""},{"id":"4.2.22","m":1,"o":["Flow lines and equipotential lines cross at right angles and form approximately square fields","Flow lines may intersect one another","The head drop between successive equipotentials increases downstream","Discharge differs between adjacent flow channels"],"q":"<p>Which statement about a flow net for isotropic soil is correct?<\/p>","a":0,"s":"<p>These properties follow from the Laplace equation and the choice of equal Δq and equal Δh.<br>Other options: B — two flow lines can never cross; C — it is equal for all drops; D — every channel carries the same discharge.<\/p>","tag":""},{"id":"4.2.23","m":1,"o":["Darcy&#x27;s law is valid","The soil and water are incompressible","The soil is partially saturated","The soil is homogeneous with constant k"],"q":"<p>Which of the following is NOT an assumption in deriving the Laplace equation for 2-D steady seepage?<\/p>","a":2,"s":"<p>The soil is assumed fully saturated with no volume change during flow.<br>Other options: A — is an assumption; B — is an assumption; D — is an assumption (isotropic form).<\/p>","tag":""},{"id":"4.2.24","m":1,"o":["5.00 × 10⁻⁶ m/s","9.00 × 10⁻⁶ m/s","3.00 × 10⁻⁶ m/s","1.00 × 10⁻⁶ m/s"],"q":"<p>For flow-net construction in an anisotropic soil with kx = 9 × 10⁻⁶ m/s and kz = 1 × 10⁻⁶ m/s, the equivalent isotropic permeability to be used is:<\/p>","a":2,"s":"<p>k&#x27; = √(kx·kz) = √(9 × 10⁻¹²) = 3.00 × 10⁻⁶ m/s; horizontal distances are scaled by √(kz/kx) = 1/3.<br>Other options: A — arithmetic mean; B — horizontal value only; D — vertical value only.<\/p>","tag":""},{"id":"4.2.25","m":1,"o":["54.94 kPa","62.78 kPa","94.18 kPa","117.72 kPa"],"q":"<p>Under a dam the total head loss is 8 m with 10 equal potential drops. Point P lies on the 3rd equipotential from the upstream face (3 drops completed) and 4 m below the tailwater level (datum at tailwater). With γw = 9.81 kN/m³, the pore pressure at P is:<\/p>","a":2,"s":"<p>Total head at P = 8 − 3 × 0.8 = 5.6 m; pressure head = 5.6 + 4 = 9.6 m; u = 94.18 kPa.<br>Other options: A — elevation (depth below datum) ignored; B — used the head lost instead of the head remaining; D — no head loss considered.<\/p>","tag":""},{"id":"4.2.26","m":1,"o":["2.50","0.40","4.00","0.625"],"q":"<p>In a flow net with total head loss 5 m and 10 potential drops, the last field at the exit has a length of 1.25 m along the flow line. The exit gradient is:<\/p>","a":1,"s":"<p>Δh = 5/10 = 0.5 m; ie = 0.5/1.25 = 0.40.<br>Other options: A — ratio inverted; C — total head used instead of one drop; D — multiplied instead of divided.<\/p>","tag":""},{"id":"4.2.27","m":1,"o":["A circular arc through the toe","A straight line from upstream water level to the toe","Casagrande&#x27;s base parabola with an entrance correction","Newmark&#x27;s influence chart"],"q":"<p>In a homogeneous earth dam, the phreatic line is commonly drawn using:<\/p>","a":2,"s":"<p>The top flow line approximates a parabola with focus at the toe filter, corrected at entry to meet the upstream face at right angles.<br>Other options: A — that is a slip circle; B — too crude; ignores the parabolic shape; D — that is for vertical stress.<\/p>","tag":""},{"id":"4.2.28","m":1,"o":["10.57 kPa","20.38 kPa","30.19 kPa","40.00 kPa"],"q":"<p>A sand (γsat = 20 kN/m³) is subjected to upward seepage at hydraulic gradient 0.5. With γw = 9.81 kN/m³, the effective stress at 2 m depth below its surface (water level at the surface) is:<\/p>","a":0,"s":"<p>σ&#x27; = γ&#x27;z − i·z·γw = 10.19 × 2 − 0.5 × 2 × 9.81 = 10.57 kPa.<br>Other options: B — seepage force ignored (no-flow value); C — seepage force added — that is downward flow; D — total stress.<\/p>","tag":""},{"id":"4.2.29","m":1,"o":["Increases the effective stress","Reduces the effective stress at a given depth below the water table","Has no effect on effective stress","Reduces the total stress to zero"],"q":"<p>Raising the water table from great depth up to the ground surface in a sand deposit:<\/p>","a":1,"s":"<p>Below the new WT, u = γw·hw increases while σ changes less (γsat vs γ), so σ&#x27; = σ − u reduces.<br>Other options: A — pore pressure rises, so σ&#x27; falls; C — u changes, so σ&#x27; changes; D — total stress does not vanish.<\/p>","tag":""},{"id":"4.2.30","m":1,"o":["Crosses the zero-air-voids curve at OMC","Always lies below the zero-air-voids curve","Lies above the zero-air-voids curve on the wet side","Coincides with the zero-air-voids curve on the dry side"],"q":"<p>On a dry-density versus water-content plot, the compaction curve of a soil:<\/p>","a":1,"s":"<p>Compaction cannot expel all air, so na &gt; 0 and γd &lt; γd(ZAV) at every w.<br>Other options: A — it cannot reach 100% saturation; C — that would need negative air voids; D — dry side has the most air.<\/p>","tag":""}]},{"k":"4.3","t":"Stress Distribution and Consolidation","qs":[{"id":"4.3.1","m":1,"o":["6.37 kPa","19.10 kPa","1.91 kPa","9.55 kPa"],"q":"<p>A point load of 500 kN acts on the ground surface. By Boussinesq&#x27;s theory, the vertical stress at 5 m depth directly below the load is:<\/p>","a":3,"s":"<p>σz = 3Q/(2πz²) = 0.4775 × 500/25 = 9.55 kPa.<br>Other options: A — Westergaard&#x27;s value (ν = 0); B — 3Q/(πz²) — the 2 in the denominator omitted; C — divided by z³ instead of z².<\/p>","tag":""},{"id":"4.3.2","m":1,"o":["23.87 kPa","12.22 kPa","7.82 kPa","1.86 kPa"],"q":"<p>A point load of 800 kN acts at the surface. By Boussinesq&#x27;s theory, the vertical stress at a depth of 4 m and a horizontal distance of 3 m from the load line is:<\/p>","a":2,"s":"<p>IB = 0.4775/(1 + 0.5625)^2.5 = 0.1565; σz = 0.1565 × 800/16 = 7.82 kPa.<br>Other options: A — value directly below the load (r = 0); B — exponent 3/2 used instead of 5/2; D — r/z inverted.<\/p>","tag":""},{"id":"4.3.3","m":1,"o":["3/2","1","2/3","1/3"],"q":"<p>Directly below a surface point load, the ratio of vertical stress by Westergaard (ν = 0) to that by Boussinesq is:<\/p>","a":2,"s":"<p>Westergaard 1/π = 0.318 vs Boussinesq 3/(2π) = 0.477; 0.318/0.477 = 2/3.<br>Other options: A — ratio inverted; B — the theories give different values below the load; D — wrong constant.<\/p>","tag":""},{"id":"4.3.4","m":1,"o":["20.00 kPa","38.10 kPa","8.33 kPa","100.00 kPa"],"q":"<p>A 2 m × 3 m footing carries 600 kN. By the 2:1 dispersion method, the average vertical stress increase at 3 m depth is:<\/p>","a":0,"s":"<p>σz = P/[(B + z)(L + z)] = 600/(5 × 6) = 20 kPa.<br>Other options: B — spread of z/2 total instead of z; C — spread of 2z total (1:1 on each side); D — contact pressure, no dispersion.<\/p>","tag":""},{"id":"4.3.5","m":1,"o":["1.5B","0.5B","3B","6B"],"q":"<p>For a uniformly loaded square footing of width B, the pressure bulb of intensity 0.2q extends to a depth of approximately:<\/p>","a":0,"s":"<p>The 0.2q isobar (the usual &#x27;significant depth&#x27;) extends to about 1.5B for a square and about 3B for a strip footing.<br>Other options: B — far too shallow; C — approximately the value for a strip footing; D — far too deep.<\/p>","tag":""},{"id":"4.3.6","m":1,"o":["20 kPa","200 kPa","2 kPa","4000 kPa"],"q":"<p>Using a Newmark chart with influence value 0.005, a loaded area of intensity 100 kPa covers 40 units. The vertical stress at the point is:<\/p>","a":0,"s":"<p>σz = IV × n × q = 0.005 × 40 × 100 = 20 kPa.<br>Other options: B — influence value taken as 0.05; C — influence value taken as 0.0005; D — influence value omitted.<\/p>","tag":""},{"id":"4.3.7","m":1,"o":["64.13 kPa","56.25 kPa","42.67 kPa","96.97 kPa"],"q":"<p>A circular area of radius 2 m carries a uniform pressure of 150 kPa. The vertical stress at 4 m depth below its centre is:<\/p>","a":2,"s":"<p>σz = q[1 − (1/(1 + (a/z)²))^1.5] = 150[1 − 0.8^1.5] = 42.67 kPa.<br>Other options: A — exponent 5/2 (point-load form) used instead of 3/2; B — load treated as a point load; D — diameter used as radius.<\/p>","tag":""},{"id":"4.3.8","m":1,"o":["15.92 kPa","7.96 kPa","5.97 kPa","25.00 kPa"],"q":"<p>A line load of 50 kN/m acts on the surface. The vertical stress at 2 m depth directly below it is:<\/p>","a":0,"s":"<p>σz = 2q/(πz) = 100/(2π) = 15.92 kPa.<br>Other options: B — factor 2 omitted; C — point-load formula used; D — load divided by depth.<\/p>","tag":""},{"id":"4.3.9","m":1,"o":["Stress under the corner of the full B × L rectangle","4 × (stress under the corner of a B/2 × L/2 rectangle)","2 × (stress under the corner of a B/2 × L rectangle)","4 × (stress under the corner of the full B × L rectangle)"],"q":"<p>To find the vertical stress below the centre of a uniformly loaded rectangle B × L using corner influence factors, the stress equals:<\/p>","a":1,"s":"<p>The centre is a common corner of four B/2 × L/2 rectangles; superpose their corner values.<br>Other options: A — a corner value is much smaller than the centre value; C — would need 4 rectangles meeting at the centre; D — the full rectangle overcounts the area four times.<\/p>","tag":""},{"id":"4.3.10","m":1,"o":["The soil is homogeneous and fully saturated","Flow of water and compression are one-dimensional (vertical)","Darcy&#x27;s law is valid","The coefficient of permeability changes with effective stress"],"q":"<p>Which of the following is NOT an assumption of Terzaghi&#x27;s one-dimensional consolidation theory?<\/p>","a":3,"s":"<p>Terzaghi assumes k and mv remain constant during consolidation.<br>Other options: A — is an assumption; B — is an assumption; C — is an assumption.<\/p>","tag":""},{"id":"4.3.11","m":1,"o":["0.36","0.28","0.45","0.40"],"q":"<p>Using Skempton&#x27;s empirical relation for a normally consolidated clay of medium sensitivity (undisturbed), the compression index of a clay with liquid limit 50% is:<\/p>","a":0,"s":"<p>Cc = 0.009(wL − 10) = 0.009 × 40 = 0.36.<br>Other options: B — the remoulded-clay relation 0.007(wL − 10); C — 10 not subtracted; D — wrong coefficient.<\/p>","tag":""},{"id":"4.3.12","m":1,"o":["243.3 mm","211.3 mm","300.0 mm","105.7 mm"],"q":"<p>A 4 m thick normally consolidated clay (Cc = 0.30, e0 = 1.0) has initial effective stress 100 kPa at mid-depth. A load increases it by 50 kPa. The primary consolidation settlement is:<\/p>","a":3,"s":"<p>Sc = CcH/(1 + e0)·log[(σ0 + Δσ)/σ0] = 0.6 × log 1.5 = 0.1057 m.<br>Other options: A — natural log used instead of log₁₀; B — (1 + e0) omitted; C — Δσ/σ0 used instead of the logarithm.<\/p>","tag":""},{"id":"4.3.13","m":1,"o":["40 mm","60 mm","12 mm","120 mm"],"q":"<p>A 3 m thick clay layer has coefficient of volume compressibility 5 × 10⁻⁴ m²/kN. The average stress increase is 80 kPa. The consolidation settlement is:<\/p>","a":3,"s":"<p>S = mv·Δσ·H = 5 × 10⁻⁴ × 80 × 3 = 0.12 m = 120 mm.<br>Other options: A — thickness H omitted; B — half thickness used (drainage path confused with thickness); C — unit slip m → mm.<\/p>","tag":""},{"id":"4.3.14","m":1,"o":["5.00 × 10⁻⁴ m²/kN","2.63 × 10⁻⁴ m²/kN","2.70 × 10⁻⁴ m²/kN","2.50 × 10⁻⁴ m²/kN"],"q":"<p>In an oedometer test the void ratio drops from 0.90 to 0.85 when the effective stress rises from 100 to 200 kPa. The coefficient of volume compressibility mv is:<\/p>","a":1,"s":"<p>av = Δe/Δσ&#x27; = 0.05/100 = 5 × 10⁻⁴ m²/kN; mv = av/(1 + e0) = 2.63 × 10⁻⁴ m²/kN.<br>Other options: A — this is av; not divided by (1 + e0); C — final void ratio used in (1 + e); D — divided by 2 instead of (1 + e0).<\/p>","tag":""},{"id":"4.3.15","m":1,"o":["2.45 × 10⁻¹² m²/s","4.00 × 10⁻⁶ m²/s","4.08 × 10⁻⁷ m²/s","3.92 × 10⁻⁵ m²/s"],"q":"<p>A clay has k = 1 × 10⁻⁹ m/s and mv = 2.5 × 10⁻⁴ m²/kN. With γw = 9.81 kN/m³, its coefficient of consolidation is:<\/p>","a":2,"s":"<p>cv = k/(mv·γw) = 10⁻⁹/(2.5 × 10⁻⁴ × 9.81) = 4.08 × 10⁻⁷ m²/s.<br>Other options: A — multiplied instead of dividing; B — γw omitted; D — γw in the numerator.<\/p>","tag":""},{"id":"4.3.16","m":1,"o":["4.73 years","1.18 years","5.09 years","0.39 years"],"q":"<p>A 6 m thick clay layer drains at both top and bottom; cv = 1.5 m²/year. Taking Tv = 0.197 for 50% consolidation, the time for 50% consolidation is:<\/p>","a":1,"s":"<p>t = Tv·Hdr²/cv = 0.197 × 9/1.5 = 1.182 years.<br>Other options: A — drainage path taken as 6 m (single drainage); C — Tv for 90% used; D — drainage path not squared.<\/p>","tag":""},{"id":"4.3.17","m":1,"o":["0.3142","0.1600","0.5027","0.1257"],"q":"<p>For average degree of consolidation U &lt; 60%, the time factor is Tv = (π/4)U². For U = 40%, Tv is:<\/p>","a":3,"s":"<p>Tv = 0.7854 × 0.16 = 0.1257.<br>Other options: A — U not squared; B — π/4 omitted; C — π used instead of π/4.<\/p>","tag":""},{"id":"4.3.18","m":1,"o":["2 times","1/4 times","4 times","Unchanged"],"q":"<p>If a clay layer of given thickness is changed from double drainage to single drainage, the time for the same degree of consolidation becomes:<\/p>","a":2,"s":"<p>Hdr doubles (H/2 → H) and t ∝ Hdr², so t becomes 4 times.<br>Other options: A — time varies with Hdr², not Hdr; B — it increases, not decreases; D — drainage path doubles.<\/p>","tag":""},{"id":"4.3.19","m":1,"o":["1111 days","277.8 days","1.39 days","69.4 days"],"q":"<p>A 2 cm thick laboratory sample, drained top and bottom, reaches 50% consolidation in 10 minutes. The time for 50% consolidation of a 4 m thick field layer of the same clay, also doubly drained, is about:<\/p>","a":1,"s":"<p>t ∝ Hdr²: t = 10 × (200 cm/1 cm)² = 4 × 10⁵ min = 277.8 days.<br>Other options: A — field layer taken as singly drained (Hdr = 4 m); C — time scaled linearly with thickness; D — full sample thickness used for the lab drainage path.<\/p>","tag":""},{"id":"4.3.20","m":1,"o":["Overconsolidated with OCR = 2.5","Normally consolidated with OCR = 1","Overconsolidated with OCR = 0.4","Under-consolidated with OCR = 2.5"],"q":"<p>A clay has present effective overburden stress 80 kPa and preconsolidation pressure 200 kPa. It is:<\/p>","a":0,"s":"<p>OCR = 200/80 = 2.5 &gt; 1 → overconsolidated.<br>Other options: B — σp&#x27; exceeds σ0&#x27;; C — OCR = σp&#x27;/σ0&#x27;, not the inverse; D — under-consolidated means σp&#x27; &lt; σ0&#x27; (excess pore pressure still present).<\/p>","tag":""},{"id":"4.3.21","m":1,"o":["Coefficient of consolidation","Preconsolidation pressure","Secondary compression index","Coefficient of permeability"],"q":"<p>Casagrande&#x27;s graphical construction on the e–log σ&#x27; curve is used to determine the:<\/p>","a":1,"s":"<p>Bisect the angle between the horizontal and the tangent at the point of maximum curvature; its meeting point with the extended virgin line gives σp&#x27;.<br>Other options: A — found by log-time or √t fitting; C — slope of e–log t after primary; D — not from e–log σ&#x27;.<\/p>","tag":""},{"id":"4.3.22","m":1,"o":["1.15 times those of the initial straight line","2 times those of the initial straight line","0.85 times those of the initial straight line","1.5 times those of the initial straight line"],"q":"<p>In Taylor&#x27;s square-root-of-time fitting method, t90 is located where the consolidation curve meets a line whose abscissae are:<\/p>","a":0,"s":"<p>Theoretical U–√Tv is linear to 60%; at 90% the abscissa is 1.15 times the straight-line value.<br>Other options: B — wrong factor; C — the line lies to the right, not left; D — wrong factor.<\/p>","tag":""},{"id":"4.3.23","m":1,"o":["0.197","0.636","1.781","0.848"],"q":"<p>The time factor Tv corresponding to 90% average degree of consolidation is about:<\/p>","a":3,"s":"<p>From Terzaghi&#x27;s solution, T90 = 0.848.<br>Other options: A — that is Tv for 50%; B — not a standard value (T85 ≈ 0.68, T80 ≈ 0.57); C — that is about 99%.<\/p>","tag":""},{"id":"4.3.24","m":1,"o":["332 mm","55 mm","185 mm","209 mm"],"q":"<p>A 5 m overconsolidated clay layer has e0 = 0.80, Cc = 0.30, Cs = 0.05, σ0&#x27; = 100 kPa and σp&#x27; = 150 kPa at mid-depth. The final effective stress is 250 kPa. The consolidation settlement is:<\/p>","a":3,"s":"<p>S = H/(1 + e0)[Cs log(150/100) + Cc log(250/150)] = 2.778 × (0.0088 + 0.0666) = 0.2093 m.<br>Other options: A — Cc applied over the whole range (treated as NC); B — Cs applied over the whole range; C — recompression part (100 → 150 kPa) omitted.<\/p>","tag":""},{"id":"4.3.25","m":1,"o":["Dissipation of excess pore water pressure","Expulsion of air from the voids","Plastic readjustment (creep) of the soil skeleton under constant effective stress","Elastic compression of soil solids"],"q":"<p>Secondary consolidation of a clay is mainly due to:<\/p>","a":2,"s":"<p>It continues after excess pore pressure has practically dissipated, described by Cα on e–log t.<br>Other options: A — that is primary consolidation; B — that is compaction; D — solids are virtually incompressible.<\/p>","tag":""},{"id":"4.3.26","m":1,"o":["65%","35%","100%","54%"],"q":"<p>At a point in a consolidating clay the initial excess pore pressure was 100 kPa; it is now 35 kPa. The degree of consolidation at that point is:<\/p>","a":0,"s":"<p>Uz = 1 − u/ui = 1 − 35/100 = 65%.<br>Other options: B — u/ui is the fraction not yet dissipated; C — pore pressure has not fully dissipated; D — ratio of remaining to dissipated pressure, 35/65.<\/p>","tag":""},{"id":"4.3.27","m":1,"o":["Homogeneous, isotropic clay deposits","Stratified soils with thin, closely spaced rigid layers preventing lateral strain","Dry, uniform sand only","Rock below a shallow soil cover"],"q":"<p>Westergaard&#x27;s solution for stress distribution is more appropriate than Boussinesq&#x27;s for:<\/p>","a":1,"s":"<p>Westergaard assumes lateral strain is prevented by thin rigid reinforcing layers, as in varved clays.<br>Other options: A — Boussinesq suits these; C — no special reason; D — neither directly.<\/p>","tag":""},{"id":"4.3.28","m":1,"o":["40.0 mm","21.1 mm","48.5 mm","189.5 mm"],"q":"<p>A 4 m clay layer has Cα = 0.01 and void ratio 0.90 at the end of primary consolidation (1 year). The secondary settlement between 1 and 10 years is:<\/p>","a":1,"s":"<p>Ss = CαH/(1 + ep)·log(t2/t1) = 0.01 × 4/1.9 × 1 = 21.1 mm.<br>Other options: A — (1 + ep) omitted; C — natural log used; D — (t2 − t1) used instead of log(t2/t1).<\/p>","tag":""},{"id":"4.3.29","m":1,"o":["The soil is elastic, homogeneous and isotropic","The medium is semi-infinite","The soil is anisotropic and layered","The soil is weightless and initially unstressed"],"q":"<p>Which of the following is NOT an assumption of Boussinesq&#x27;s theory?<\/p>","a":2,"s":"<p>Boussinesq assumes a homogeneous, isotropic, linearly elastic half-space.<br>Other options: A — is an assumption; B — is an assumption; D — is an assumption.<\/p>","tag":""},{"id":"4.3.30","m":1,"o":["30 mm","96 mm","38 mm","144 mm"],"q":"<p>The final consolidation settlement of a layer is 240 mm. Using Tv = (π/4)U² (U &lt; 60%), the settlement when Tv = 0.1257 is about:<\/p>","a":1,"s":"<p>U = √(4Tv/π) = 0.400; S = 0.40 × 240 = 96 mm.<br>Other options: A — Tv used as U; C — U² used as U; D — 1 − U used.<\/p>","tag":""}]},{"k":"4.4","t":"Shear Strength and Slope Stability","qs":[{"id":"4.4.1","m":1,"o":["57.74 kPa","60.00 kPa","67.74 kPa","96.60 kPa"],"q":"<p>A soil has c = 10 kPa and φ = 30°. Its shear strength on a plane carrying normal stress 100 kPa is:<\/p>","a":2,"s":"<p>τf = c + σ tan φ = 10 + 100 × 0.5774 = 67.74 kPa.<br>Other options: A — cohesion omitted; B — sin φ used instead of tan φ; D — cos φ used.<\/p>","tag":""},{"id":"4.4.2","m":1,"o":["30°","60°","75°","45°"],"q":"<p>For a soil with φ = 30°, the failure plane makes an angle with the major principal plane of:<\/p>","a":1,"s":"<p>θf = 45° + φ/2 = 60° with the major principal plane.<br>Other options: A — 45° − φ/2 is the angle with the minor principal plane; C — 45° + φ; D — plane of maximum shear stress, not failure.<\/p>","tag":""},{"id":"4.4.3","m":1,"o":["30.0°","41.8°","26.6°","19.5°"],"q":"<p>A CD triaxial test on dry sand at cell pressure 100 kPa fails at deviator stress 200 kPa. The angle of shearing resistance is:<\/p>","a":0,"s":"<p>σ1 = 300 kPa; sin φ = (σ1 − σ3)/(σ1 + σ3) = 200/400 = 0.5 → φ = 30°.<br>Other options: B — sin φ = σd/σ1 used; C — tan φ = (σ1 − σ3)/(σ1 + σ3) used; D — sin φ = σ3/σ1 used.<\/p>","tag":""},{"id":"4.4.4","m":1,"o":["102.0 kPa","183.6 kPa","130.5 kPa","159.1 kPa"],"q":"<p>A soil has c = 20 kPa and φ = 20°. In a triaxial test at cell pressure 50 kPa, the major principal stress at failure is:<\/p>","a":3,"s":"<p>σ1 = σ3 tan²(45 + φ/2) + 2c tan(45 + φ/2) = 50 × 2.0396 + 40 × 1.4281 = 159.1 kPa.<br>Other options: A — cohesion term omitted; B — cohesion multiplied by tan² instead of tan; C — factor 2 omitted in the cohesion term.<\/p>","tag":""},{"id":"4.4.5","m":1,"o":["120 kPa","240 kPa","30 kPa","60 kPa"],"q":"<p>A saturated clay sample fails in an unconfined compression test at an axial stress of 120 kPa. Its undrained shear strength is:<\/p>","a":3,"s":"<p>For φu = 0, cu = qu/2 = 60 kPa.<br>Other options: A — qu itself; cu = qu/2; B — multiplied by 2; C — divided by 4.<\/p>","tag":""},{"id":"4.4.6","m":1,"o":["Mohr circles at failure have the same diameter, giving φu = 0","Mohr circles grow with cell pressure, giving a large φu","Failure always occurs at zero deviator stress","Effective stress parameters are obtained directly"],"q":"<p>In UU triaxial tests on saturated clay specimens at different cell pressures:<\/p>","a":0,"s":"<p>Added cell pressure is carried entirely by pore water (B = 1), so effective stress and strength do not change.<br>Other options: B — true of drained tests, not UU on saturated clay; C — deviator stress at failure = 2cu; D — pore pressure is not measured in UU.<\/p>","tag":""},{"id":"4.4.7","m":1,"o":["34.7 kPa","26.0 kPa","17.4 kPa","29.7 kPa"],"q":"<p>A vane of diameter 75 mm and height 150 mm needs a torque of 46 N·m to shear a clay (both ends shearing). The undrained shear strength is about:<\/p>","a":3,"s":"<p>T = πd²c(h/2 + d/6): c = 0.046/(π × 0.005625 × 0.0875) = 29.75 kPa.<br>Other options: A — end (top and bottom) resistance neglected; B — d/3 used instead of d/6 for the ends; C — h used instead of h/2.<\/p>","tag":""},{"id":"4.4.8","m":1,"o":["0.2, insensitive","5, sensitive","5, quick","120, extra-sensitive"],"q":"<p>A clay has unconfined compressive strength 150 kPa undisturbed and 30 kPa when remoulded at the same water content. Its sensitivity and class are:<\/p>","a":1,"s":"<p>St = 150/30 = 5; 4–8 is &#x27;sensitive&#x27; (Skempton).<br>Other options: A — ratio inverted; C — quick clays have St &gt; 16; D — difference, not ratio.<\/p>","tag":""},{"id":"4.4.9","m":1,"o":["160 kPa","36 kPa","48 kPa","76 kPa"],"q":"<p>A saturated soil (B = 1, A = 0.3) is subjected undrained to Δσ3 = 40 kPa and a deviator stress increment of 120 kPa. The change in pore pressure is:<\/p>","a":3,"s":"<p>Δu = B[Δσ3 + A(Δσ1 − Δσ3)] = 40 + 0.3 × 120 = 76 kPa.<br>Other options: A — A taken as 1; B — Δσ3 term omitted; C — A applied to the total.<\/p>","tag":""},{"id":"4.4.10","m":1,"o":["Negative","Between 0.5 and 1.0","Greater than 1","Exactly 1/3"],"q":"<p>Skempton&#x27;s pore pressure parameter A at failure for a heavily overconsolidated clay is typically:<\/p>","a":0,"s":"<p>Heavily OC clays dilate during shear, so pore pressure falls and Af &lt; 0.<br>Other options: B — typical of normally consolidated clays; C — typical of sensitive/loose soils; D — elastic value, not at failure.<\/p>","tag":""},{"id":"4.4.11","m":1,"o":["It cannot be used for sands","It needs very large specimens","The failure plane is predetermined and pore pressure cannot be measured","It cannot give φ"],"q":"<p>A major limitation of the direct shear test is that:<\/p>","a":2,"s":"<p>Shear stress is non-uniform, drainage cannot be controlled precisely and the failure plane is forced horizontal.<br>Other options: A — it is widely used for sands; B — specimens are small (60 mm × 60 mm); D — φ is obtained from several tests.<\/p>","tag":""},{"id":"4.4.12","m":1,"o":["The sand is in its densest state","The hydraulic gradient becomes critical","The sand shears without any change in volume","Liquefaction occurs under static load"],"q":"<p>The critical void ratio of a sand is the void ratio at which:<\/p>","a":2,"s":"<p>Denser sand dilates and looser sand contracts; at ecr there is no volume change on shearing.<br>Other options: A — that is emin; B — unrelated to the quick condition; D — not its definition.<\/p>","tag":""},{"id":"4.4.13","m":1,"o":["100 kPa at 45°","200 kPa at 45°","100 kPa at 60°","150 kPa at 30°"],"q":"<p>At a point σ1 = 300 kPa and σ3 = 100 kPa. The maximum shear stress and the inclination of its plane to the major principal plane are:<\/p>","a":0,"s":"<p>τmax = (σ1 − σ3)/2 = 100 kPa on planes at 45°.<br>Other options: B — deviator stress, not (σ1 − σ3)/2; C — 60° is the failure plane for φ = 30°; D — no basis.<\/p>","tag":""},{"id":"4.4.14","m":1,"o":["σn = 110 kPa, τ = 52.0 kPa","σn = 170 kPa, τ = 52.0 kPa","σn = 170 kPa, τ = 30.0 kPa","σn = 140 kPa, τ = 60.0 kPa"],"q":"<p>At a point σ1 = 200 kPa and σ3 = 80 kPa. On a plane inclined at 30° to the major principal plane, the normal and shear stresses are:<\/p>","a":1,"s":"<p>σn = 140 + 60 cos 60° = 170 kPa; τ = 60 sin 60° = 51.96 kPa.<br>Other options: A — angle measured from the minor principal plane; C — θ used instead of 2θ in the shear term; D — centre and radius of Mohr circle.<\/p>","tag":""},{"id":"4.4.15","m":1,"o":["36.9°","59.0°","20.6°","31.0°"],"q":"<p>In a direct shear test on dry sand (60 mm × 60 mm box), normal load 360 N gives a failure shear load of 216 N. The angle of shearing resistance is:<\/p>","a":3,"s":"<p>σ = 360/0.0036 = 100 kPa, τ = 60 kPa; φ = tan⁻¹(0.6) = 30.96°.<br>Other options: A — sin⁻¹ used instead of tan⁻¹; B — complement of φ; C — shear divided by (normal + shear).<\/p>","tag":""},{"id":"4.4.16","m":1,"o":["1.50","1.40","0.666","1.357"],"q":"<p>An infinite slope of dry cohesionless soil with φ = 35° is inclined at 25°. The factor of safety is:<\/p>","a":0,"s":"<p>FS = tan φ/tan β = 0.7002/0.4663 = 1.502.<br>Other options: B — ratio of angles; C — ratio inverted; D — sines used.<\/p>","tag":""},{"id":"4.4.17","m":1,"o":["2.00","3.92","0.51","1.02"],"q":"<p>An infinite cohesionless slope (φ&#x27; = 36°, γsat = 20 kN/m³) at 20° has the water table at the ground surface with seepage parallel to the slope. With γw = 9.81 kN/m³, the factor of safety is:<\/p>","a":3,"s":"<p>FS = (γ&#x27;/γsat)(tan φ/tan β) = 0.5095 × 1.996 = 1.017.<br>Other options: A — seepage effect ignored (dry or submerged value); B — γsat/γ&#x27; inverted; C — tan φ/tan β omitted.<\/p>","tag":""},{"id":"4.4.18","m":1,"o":["2.60 m","3.47 m","3.01 m","2.22 m"],"q":"<p>An infinite slope in c–φ soil (c = 10 kPa, φ = 20°, γ = 18 kN/m³) is inclined at 30°. The critical depth (FS = 1) is:<\/p>","a":1,"s":"<p>Hc = c/[γ cos²β (tan β − tan φ)] = 10/(18 × 0.75 × 0.2134) = 3.471 m.<br>Other options: A — cos²β omitted; C — cos β used instead of cos²β; D — vertical-cut formula 4c/γ used.<\/p>","tag":""},{"id":"4.4.19","m":1,"o":["0.576","0.174","1.736","17.36"],"q":"<p>For a cut slope 8 m high in soil with c = 25 kPa, γ = 18 kN/m³, Taylor&#x27;s stability number from the chart is 0.10. The factor of safety with respect to cohesion is:<\/p>","a":2,"s":"<p>Sn = c/(F·γ·H) → F = 25/(0.10 × 18 × 8) = 1.736.<br>Other options: A — ratio inverted; B — stability number omitted; D — Sn read as 0.01.<\/p>","tag":""},{"id":"4.4.20","m":1,"o":["2.22 m","8.89 m","1.11 m","4.44 m"],"q":"<p>Using Rankine&#x27;s theory and neglecting tension cracks, the critical height of an unsupported vertical cut in clay (c = 20 kPa, φ = 0, γ = 18 kN/m³) is:<\/p>","a":3,"s":"<p>Hc = 4c/(γ√Ka) with Ka = 1 for φ = 0: 4 × 20/18 = 4.44 m.<br>Other options: A — 2c/γ is the depth of tension crack; B — factor 8 used; C — c/γ only.<\/p>","tag":""},{"id":"4.4.21","m":1,"o":["0.750","1.333","0.111","6.00"],"q":"<p>By the Swedish circle (φ = 0) method: cohesion 30 kPa, slip arc length 20 m, radius 12 m, weight of sliding mass 1200 kN/m acting 4.5 m from the centre horizontally. The factor of safety is:<\/p>","a":1,"s":"<p>FS = c·L·R/(W·x) = 30 × 20 × 12/(1200 × 4.5) = 1.333.<br>Other options: A — ratio inverted; C — radius omitted from the resisting moment; D — lever arm of the weight omitted.<\/p>","tag":""},{"id":"4.4.22","m":1,"o":["Neglected (their resultant assumed zero on each slice)","Assumed horizontal only, vertical shear neglected","Fully satisfied in both force and moment equilibrium","Taken equal to the slice weight"],"q":"<p>In the ordinary (Fellenius) method of slices, the interslice forces are:<\/p>","a":0,"s":"<p>Fellenius ignores interslice forces, which usually makes FS conservative.<br>Other options: B — that is Bishop&#x27;s simplified method; C — that is Morgenstern–Price / Spencer; D — no basis.<\/p>","tag":""},{"id":"4.4.23","m":1,"o":["Steady seepage with full reservoir","End of construction only for the downstream slope","Sudden drawdown of the reservoir","Empty reservoir with dry fill"],"q":"<p>The most critical condition for the upstream slope of an earth dam is:<\/p>","a":2,"s":"<p>On rapid drawdown the stabilising water pressure is removed while the fill remains saturated with high pore pressure.<br>Other options: A — critical for the downstream slope; B — end of construction affects both slopes but is not the upstream&#x27;s worst; D — no pore pressure; not critical.<\/p>","tag":""},{"id":"4.4.24","m":1,"o":["Sudden drawdown","Empty reservoir","Steady seepage with the reservoir full","Earthquake from the upstream side only"],"q":"<p>The most critical condition for the downstream slope of an earth dam is:<\/p>","a":2,"s":"<p>Full-reservoir steady seepage creates the highest pore pressures in the downstream shell.<br>Other options: A — critical for the upstream slope; B — least pore pressure; D — not the standard design case.<\/p>","tag":""},{"id":"4.4.25","m":1,"o":["Loose saturated fine sand during an earthquake","Dense dry gravel under static load","Stiff overconsolidated clay","Dry loose sand under static load"],"q":"<p>Liquefaction is most likely in:<\/p>","a":0,"s":"<p>Cyclic shear causes loose sand to contract; undrained, pore pressure rises until σ&#x27; ≈ 0.<br>Other options: B — dense and dry: no pore pressure rise; C — cohesive and dilatant; D — needs water and cyclic loading.<\/p>","tag":""},{"id":"4.4.26","m":1,"o":["Negative, because the sand tends to dilate","Positive, because the sand tends to contract","Always zero","Equal to the cell pressure"],"q":"<p>When dense sand is sheared undrained, the pore water pressure developed is generally:<\/p>","a":0,"s":"<p>Dilation tendency under no-drainage creates suction, increasing effective stress.<br>Other options: B — behaviour of loose sand; C — undrained loading changes pore pressure; D — no such rule.<\/p>","tag":""},{"id":"4.4.27","m":1,"o":["Only undrained strength cu with φ = 0","Both total and effective stress strength parameters","Only the drained parameters, without pore pressure","Only the sensitivity"],"q":"<p>A consolidated-undrained (CU) triaxial test with pore pressure measurement gives:<\/p>","a":1,"s":"<p>Total-stress circles give c_cu, φ_cu; subtracting measured u gives c&#x27;, φ&#x27;.<br>Other options: A — that is the UU test on saturated clay; C — that is the CD test; D — sensitivity needs remoulded strength.<\/p>","tag":""},{"id":"4.4.28","m":1,"o":["A line through the origin at angle φ&#x27;","A vertical line at σ = qu","A horizontal line at τ = cu","A line at 45° to the σ axis"],"q":"<p>For a saturated clay tested under undrained conditions (φ = 0), the Mohr–Coulomb failure envelope is:<\/p>","a":2,"s":"<p>Strength is independent of total normal stress, so τf = cu.<br>Other options: A — drained envelope of NC clay; B — not an envelope; D — no basis.<\/p>","tag":""},{"id":"4.4.29","m":1,"o":["Cell pressure equal to the axial stress","Zero cell (confining) pressure","Drainage allowed throughout","Cell pressure equal to the pore pressure"],"q":"<p>The unconfined compression test is a special case of the triaxial test with:<\/p>","a":1,"s":"<p>σ3 = 0, so σ1 at failure = qu.<br>Other options: A — would give zero deviator stress; C — it is a quick, undrained test; D — no such condition.<\/p>","tag":""},{"id":"4.4.30","m":1,"o":["30°","53°","45°","70°"],"q":"<p>For a homogeneous φ = 0 clay slope, the critical slip circle always passes through the toe (toe failure) when the slope angle exceeds about:<\/p>","a":1,"s":"<p>Taylor showed that for β &gt; 53° the critical circle is a toe circle; flatter slopes may have base (or mid-point) circles.<br>Other options: A — flatter slopes can still have base failure; C — not Taylor&#x27;s limit; D — toe failure begins well before.<\/p>","tag":""}]},{"k":"4.5","t":"Earth Pressure, Retaining Structures and Soil Exploration","qs":[{"id":"4.5.1","m":1,"o":["0.50","0.33","3.00","0.87"],"q":"<p>By Jaky&#x27;s formula, the coefficient of earth pressure at rest for a normally consolidated sand with φ&#x27; = 30° is:<\/p>","a":0,"s":"<p>K0 = 1 − sin φ&#x27; = 1 − 0.5 = 0.50.<br>Other options: B — this is Rankine Ka; C — this is Rankine Kp; D — cos φ, not 1 − sin φ.<\/p>","tag":""},{"id":"4.5.2","m":1,"o":["108 kN/m at 3 m above the base","108 kN/m at 2 m above the base","324 kN/m at 2 m above the base","216 kN/m at 2 m above the base"],"q":"<p>A smooth vertical wall 6 m high retains dry sand (γ = 18 kN/m³, φ = 30°) with a horizontal surface. The Rankine active thrust and its point of application are:<\/p>","a":1,"s":"<p>Ka = 1/3; Pa = ½KaγH² = 0.5 × (1/3) × 18 × 36 = 108 kN/m, at H/3 = 2 m.<br>Other options: A — triangular pressure acts at H/3, not H/2; C — Ka omitted; D — factor ½ omitted.<\/p>","tag":""},{"id":"4.5.3","m":1,"o":["315.5 kN/m","23.2 kN/m","631.0 kN/m","36.5 kN/m"],"q":"<p>The Rankine passive resistance on a smooth vertical face 3 m deep in sand (γ = 19 kN/m³, φ = 35°, horizontal surface) is:<\/p>","a":0,"s":"<p>Kp = tan²62.5° = 3.690; Pp = ½KpγH² = 315.5 kN/m.<br>Other options: B — Ka used instead of Kp; C — factor ½ omitted; D — K0 used.<\/p>","tag":""},{"id":"4.5.4","m":1,"o":["33.3 kN/m acting at 1.67 m above the base","33.3 kN/m acting at 2.5 m above the base","100.0 kN/m acting at 2.5 m above the base","16.7 kN/m acting at 2.5 m above the base"],"q":"<p>A uniform surcharge of 20 kPa acts on the horizontal backfill (φ = 30°) of a 5 m high smooth vertical wall. The additional active thrust due to the surcharge is:<\/p>","a":1,"s":"<p>Δpa = Ka·q = 20/3 kPa, uniform; thrust = 6.67 × 5 = 33.3 kN/m at H/2.<br>Other options: A — surcharge pressure is uniform, so it acts at H/2; C — Ka omitted; D — ½ factor wrongly applied to a rectangular diagram.<\/p>","tag":""},{"id":"4.5.5","m":1,"o":["53.3 kN/m","27.2 kN/m","238.5 kN/m","105.7 kN/m"],"q":"<p>A smooth vertical wall 4 m high retains saturated sand (γsat = 20 kN/m³, φ&#x27; = 30°) with the water table at the surface (γw = 9.81 kN/m³). The total lateral thrust (soil + water) in the active state is:<\/p>","a":3,"s":"<p>Soil: ½Kaγ&#x27;H² = 27.17; water: ½γwH² = 78.48; total = 105.7 kN/m.<br>Other options: A — Ka applied to γsat with no separate water pressure; B — water pressure omitted; C — Ka omitted.<\/p>","tag":""},{"id":"4.5.6","m":1,"o":["1.67 m","2.38 m","1.17 m","4.76 m"],"q":"<p>A cohesive backfill has c = 15 kPa, φ = 20° and γ = 18 kN/m³. The depth of tension cracks in the active state is about:<\/p>","a":1,"s":"<p>z0 = 2c/(γ√Ka); √Ka = tan 35° = 0.7002; z0 = 30/(18 × 0.7002) = 2.380 m.<br>Other options: A — φ = 0 formula 2c/γ used; C — √Ka in the numerator; D — critical height of unsupported cut.<\/p>","tag":""},{"id":"4.5.7","m":1,"o":["Rankine accounts for wall friction, Coulomb does not","Coulomb&#x27;s wedge theory accounts for wall friction, while Rankine assumes a smooth wall","Coulomb applies only to cohesive soils","Rankine gives the passive state only"],"q":"<p>The main difference between Rankine&#x27;s and Coulomb&#x27;s earth pressure theories is that:<\/p>","a":1,"s":"<p>Rankine considers stress state in a semi-infinite mass (smooth vertical back); Coulomb considers equilibrium of a sliding wedge with wall friction δ.<br>Other options: A — reversed; C — classical Coulomb is for cohesionless soils; D — Rankine gives both active and passive.<\/p>","tag":""},{"id":"4.5.8","m":1,"o":["Much smaller wall movement","No wall movement","Much larger wall movement","Exactly the same movement"],"q":"<p>Compared with the active state, the development of full passive earth pressure requires:<\/p>","a":2,"s":"<p>Active state develops at about 0.1–0.5% of H rotation for sands, passive needs several percent.<br>Other options: A — active needs only a small movement; B — that is the at-rest state; D — passive needs many times more.<\/p>","tag":""},{"id":"4.5.9","m":1,"o":["0.67","3.0","0.17","1.5"],"q":"<p>A gravity wall has total vertical load 300 kN/m and base friction coefficient 0.5. The active horizontal thrust is 100 kN/m (passive resistance ignored). The factor of safety against sliding is:<\/p>","a":3,"s":"<p>FS = μΣV/ΣH = 0.5 × 300/100 = 1.5.<br>Other options: A — ratio inverted; B — friction coefficient omitted; C — μ·ΣH/ΣV — forces swapped.<\/p>","tag":""},{"id":"4.5.10","m":1,"o":["160 kPa and 40 kPa","100 kPa and 100 kPa","130 kPa and 70 kPa","200 kPa and 0 kPa"],"q":"<p>The base of a retaining wall is 3 m wide. The resultant vertical force 300 kN/m cuts the base 1.2 m from the toe. The maximum and minimum base pressures are:<\/p>","a":0,"s":"<p>e = 1.5 − 1.2 = 0.3 m &lt; B/6 = 0.5 m; q = (V/B)(1 ± 6e/B) = 100(1 ± 0.6) = 160 and 40 kPa.<br>Other options: B — eccentricity ignored; C — (1 ± e) used instead of (1 ± 6e/B); D — resultant assumed at the middle-third edge (e = B/6).<\/p>","tag":""},{"id":"4.5.11","m":1,"o":["Free earth support and fixed earth support methods","Swedish circle and Bishop&#x27;s methods","Newmark and Westergaard methods","Hiley and Engineering News methods"],"q":"<p>Anchored sheet pile walls are commonly analysed by the:<\/p>","a":0,"s":"<p>Free earth support assumes no fixity at the toe (shorter embedment); fixed earth support assumes the toe is fixed (Blum&#x27;s equivalent beam).<br>Other options: B — slope stability methods; C — stress distribution methods; D — pile driving formulae.<\/p>","tag":""},{"id":"4.5.12","m":1,"o":["48.0 kPa","93.6 kPa","31.2 kPa","15.6 kPa"],"q":"<p>Using Peck&#x27;s apparent pressure diagram, the uniform lateral pressure on the bracing of an 8 m deep cut in sand (γ = 18 kN/m³, φ = 30°) is:<\/p>","a":2,"s":"<p>pa = 0.65KaγH = 0.65 × (1/3) × 18 × 8 = 31.2 kPa (uniform over the full depth).<br>Other options: A — factor 0.65 omitted (triangular peak); B — Ka omitted; D — halved wrongly.<\/p>","tag":""},{"id":"4.5.13","m":1,"o":["It cannot penetrate soft soils","It is very costly and slow","It cannot be used below the water table","Representative undisturbed samples cannot be obtained from the wash water"],"q":"<p>A major drawback of wash boring is that:<\/p>","a":3,"s":"<p>Soil comes up mixed with water; change of strata is judged only from the wash, so separate sampling is needed.<br>Other options: A — it works well in soft to medium soils; B — it is fast and cheap; C — it uses water anyway.<\/p>","tag":""},{"id":"4.5.14","m":1,"o":["63.5 kg hammer falling 450 mm; N is the blow count for the first 300 mm","63.5 kg hammer falling 750 mm; N is the blow count for the last 300 mm of 450 mm penetration","49 kg hammer falling 750 mm; N is the blow count for 450 mm","63.5 kg hammer falling 750 mm; N is the blow count for the first 150 mm"],"q":"<p>As per IS 2131, the Standard Penetration Test uses a:<\/p>","a":1,"s":"<p>The first 150 mm is seating; N is counted over the next 300 mm.<br>Other options: A — wrong drop and wrong interval; C — wrong mass and interval; D — first 150 mm is the seating drive.<\/p>","tag":""},{"id":"4.5.15","m":1,"o":["17.5","32.5","35","25"],"q":"<p>In very fine or silty sand below the water table, an observed SPT value of 35 is corrected for dilatancy (Terzaghi and Peck) to:<\/p>","a":3,"s":"<p>N&#x27; = 15 + 0.5(N − 15) = 15 + 10 = 25.<br>Other options: A — 0.5N only; B — 15 + 0.5N; C — correction applies when N &gt; 15.<\/p>","tag":""},{"id":"4.5.16","m":1,"o":["16","25","20","31.25"],"q":"<p>Using the Liao–Whitman overburden correction CN = √(100/σ&#x27;v) (σ&#x27;v in kPa), an SPT N of 20 at σ&#x27;v = 64 kPa becomes:<\/p>","a":1,"s":"<p>CN = √(100/64) = 1.25; N = 1.25 × 20 = 25.<br>Other options: A — ratio inverted; C — correction not applied; D — square root omitted.<\/p>","tag":""},{"id":"4.5.17","m":1,"o":["6.25%","11.42%","12.89%","106.25%"],"q":"<p>A sampling tube has outside diameter 51 mm and inside diameter 48 mm. Its area ratio is:<\/p>","a":2,"s":"<p>Ar = (Do² − Di²)/Di² × 100 = 297/2304 × 100 = 12.89% (≤ 10% preferred for undisturbed sampling).<br>Other options: A — diameters not squared; B — divided by Do² instead of Di²; D — simple diameter ratio.<\/p>","tag":""},{"id":"4.5.18","m":1,"o":["Reduce frictional drag between the sample and the tube wall","Increase the area ratio","Allow water to drain out of the sample","Help the sampler cut through boulders"],"q":"<p>The inside clearance of a sampler (kept about 1–3%) is provided mainly to:<\/p>","a":0,"s":"<p>A slightly smaller cutting edge lets the sample expand elastically without rubbing against the tube.<br>Other options: B — unrelated; C — not the purpose; D — not the purpose.<\/p>","tag":""},{"id":"4.5.19","m":1,"o":["1.184","0.156","0.380","0.844"],"q":"<p>A sampler pushed 450 mm into the ground recovers a sample 380 mm long. The recovery ratio is:<\/p>","a":3,"s":"<p>Lr = L/H = 380/450 = 0.844.<br>Other options: A — ratio inverted; B — lost length ratio; C — sample length (m) taken as the ratio.<\/p>","tag":""},{"id":"4.5.20","m":1,"o":["30° apex angle and 10 cm² base area","60° apex angle and 20 cm² base area","60° apex angle and 10 cm² base area","90° apex angle and 5 cm² base area"],"q":"<p>The standard cone used in the static cone penetration test has:<\/p>","a":2,"s":"<p>The standard (Dutch/electric) cone has a 60° tip and 35.7 mm diameter (10 cm²).<br>Other options: A — wrong angle; B — wrong area for the standard cone; D — wrong angle and area.<\/p>","tag":""},{"id":"4.5.21","m":1,"o":["2%","50%","0.2%","20%"],"q":"<p>In a CPT, sleeve friction is 60 kPa and cone resistance is 3 MPa. The friction ratio is:<\/p>","a":0,"s":"<p>Rf = fs/qc × 100 = 60/3000 × 100 = 2%.<br>Other options: B — qc/fs with unit slip; C — 3 MPa taken as 30 000 kPa; D — 3 MPa taken as 300 kPa.<\/p>","tag":""},{"id":"4.5.22","m":1,"o":["Wave velocity increases with depth","Wave velocity decreases with depth","The ground is fully dry","Electrical resistivity is uniform"],"q":"<p>The seismic refraction method of subsurface exploration works only when:<\/p>","a":0,"s":"<p>Critical refraction along a deeper interface requires the lower layer to be faster.<br>Other options: B — a low-velocity layer below is not detected; C — not a requirement; D — that relates to resistivity surveys.<\/p>","tag":""},{"id":"4.5.23","m":1,"o":["70%, good","70%, fair","30%, poor","85%, good"],"q":"<p>In a 1.5 m core run, the total length of intact core pieces 100 mm or longer is 1.05 m. The RQD and Deere&#x27;s rock quality are:<\/p>","a":1,"s":"<p>RQD = 1.05/1.5 × 100 = 70%; 50–75% is fair.<br>Other options: A — good is 75–90%; C — 100 − RQD; D — all recovered pieces included instead of only those ≥ 100 mm.<\/p>","tag":""},{"id":"4.5.24","m":1,"o":["45° − φ/2","45°","45° + φ/2","φ"],"q":"<p>In Rankine&#x27;s active state for a cohesionless backfill with horizontal surface, the failure planes are inclined to the horizontal at:<\/p>","a":2,"s":"<p>Active failure planes are steeper (45° + φ/2); passive are flatter (45° − φ/2).<br>Other options: A — that is for the passive state; B — only for φ = 0; D — no basis.<\/p>","tag":""},{"id":"4.5.25","m":1,"o":["Negative (tension), equal to −2c√Ka","Zero","Positive, equal to 2c√Ka","Equal to Kaγ at unit depth"],"q":"<p>For an active Rankine pressure diagram in a cohesive (c–φ) backfill, the lateral pressure at the top of the wall is:<\/p>","a":0,"s":"<p>pa = Kaγz − 2c√Ka; at z = 0 it is −2c√Ka, becoming zero at z0 = 2c/(γ√Ka).<br>Other options: B — zero occurs at depth z0, not at the top; C — cohesion reduces active pressure; D — no basis.<\/p>","tag":""},{"id":"4.5.26","m":1,"o":["Underestimate passive resistance, which is conservative","Give exactly the log-spiral value","Give zero passive pressure","Overestimate passive resistance, which is unsafe"],"q":"<p>Coulomb&#x27;s theory with a plane failure surface, when used for passive pressure with large wall friction (δ &gt; φ/3), tends to:<\/p>","a":3,"s":"<p>The real passive failure surface is curved; log-spiral methods are used instead.<br>Other options: A — the error is on the unsafe side; B — the plane surface differs from the real curved surface; C — no basis.<\/p>","tag":""},{"id":"4.5.27","m":1,"o":["1 to 2 m","3 to 4 m","20 to 25 m","6 to 7 m"],"q":"<p>Counterfort retaining walls generally become more economical than cantilever walls when the height exceeds about:<\/p>","a":3,"s":"<p>For tall walls, counterforts reduce stem and heel bending moments by spanning between supports.<br>Other options: A — gravity walls suit such heights; B — cantilever walls are economical here; C — far beyond usual practice.<\/p>","tag":""},{"id":"4.5.28","m":1,"o":["Reduce the self-weight of the wall","Allow inspection of the backfill","Drain water from the backfill and relieve hydrostatic pressure","Increase passive resistance at the toe"],"q":"<p>Weep holes are provided in a retaining wall to:<\/p>","a":2,"s":"<p>Without drainage, pore water pressure can greatly increase the thrust on the wall.<br>Other options: A — negligible; B — not the purpose; D — unrelated.<\/p>","tag":""},{"id":"4.5.29","m":1,"o":["72 kPa","24 kPa","36 kPa","216 kPa"],"q":"<p>A rigid unyielding wall 4 m high retains sand with φ&#x27; = 30° and γ = 18 kN/m³. Using Jaky&#x27;s K0, the lateral pressure at the base is:<\/p>","a":2,"s":"<p>K0 = 0.5; p = K0γH = 0.5 × 18 × 4 = 36 kPa.<br>Other options: A — K0 taken as 1; B — Ka used — wall does not yield; D — Kp used.<\/p>","tag":""},{"id":"4.5.30","m":1,"o":["Greatly increases the active thrust","Slightly reduces the active thrust and inclines it to the normal of the wall","Makes the active thrust act horizontally","Has no effect on the active thrust"],"q":"<p>In Coulomb&#x27;s theory, introducing wall friction (δ &gt; 0) on the back of a retaining wall:<\/p>","a":1,"s":"<p>Wall friction helps hold the wedge, so Pa is slightly smaller and acts at angle δ to the wall normal.<br>Other options: A — it reduces Pa; C — it acts at δ to the normal; D — Ka changes with δ.<\/p>","tag":""}]},{"k":"4.6","t":"Shallow and Deep Foundations and Ground Improvement","qs":[{"id":"4.6.1","m":1,"o":["1114.2 kPa","405.0 kPa","759.6 kPa","582.3 kPa"],"q":"<p>A 2 m wide strip footing at 1 m depth rests on sand (c = 0, φ = 30°, γ = 18 kN/m³). With Terzaghi&#x27;s factors Nq = 22.5 and Nγ = 19.7, the ultimate bearing capacity (general shear) is:<\/p>","a":2,"s":"<p>qu = γDfNq + 0.5γBNγ = 405 + 354.6 = 759.6 kPa.<br>Other options: A — factor 0.5 in the Nγ term omitted; B — Nγ term omitted; D — Df used instead of B in the Nγ term.<\/p>","tag":""},{"id":"4.6.2","m":1,"o":["312.0 kPa","397.5 kPa","370.5 kPa","612.0 kPa"],"q":"<p>A square footing at 1.5 m depth rests on saturated clay (cu = 50 kPa, φ = 0, γ = 18 kN/m³). Using Terzaghi&#x27;s equation with Nc = 5.7, Nq = 1, the ultimate bearing capacity is:<\/p>","a":1,"s":"<p>qu = 1.3cNc + γDf = 1.3 × 50 × 5.7 + 27 = 397.5 kPa.<br>Other options: A — strip formula (no 1.3 shape factor); C — this is the net value (γDf omitted); D — Nc = 9 (deep foundation) used.<\/p>","tag":""},{"id":"4.6.3","m":1,"o":["5.70","5.14","9.00","3.14"],"q":"<p>Prandtl&#x27;s bearing capacity factor Nc for a strip footing on the surface of a φ = 0 soil is:<\/p>","a":1,"s":"<p>Nc = π + 2 = 5.14.<br>Other options: A — Terzaghi&#x27;s value (rough base); C — deep foundation value; D — π only.<\/p>","tag":""},{"id":"4.6.4","m":1,"o":["0.5","0.3","1.3","0.4"],"q":"<p>In Terzaghi&#x27;s bearing capacity equation for a square footing, the coefficient of the γBNγ term is:<\/p>","a":3,"s":"<p>Square: qu = 1.3cNc + qNq + 0.4γBNγ.<br>Other options: A — for a strip footing; B — for a circular footing (with B = diameter); C — the coefficient of cNc.<\/p>","tag":""},{"id":"4.6.5","m":1,"o":["605.7 kPa","759.6 kPa","430.0 kPa","799.0 kPa"],"q":"<p>For the strip footing (B = 2 m, Df = 1 m, sand φ = 30°, Nq = 22.5, Nγ = 19.7, γ = 18 kN/m³), the water table rises to the base of the footing. With γsat = 20 kN/m³ and γw = 9.81 kN/m³, the ultimate bearing capacity becomes:<\/p>","a":0,"s":"<p>Surcharge term unchanged = 405; Nγ term uses γ&#x27; = 10.19: 0.5 × 10.19 × 2 × 19.7 = 200.7; qu = 605.7 kPa.<br>Other options: B — water table effect ignored; C — γ&#x27; also used in the surcharge term (WT at ground surface case); D — γsat used instead of γ&#x27; below the WT.<\/p>","tag":""},{"id":"4.6.6","m":1,"o":["200 kPa","218 kPa","191 kPa","173 kPa"],"q":"<p>The ultimate bearing capacity of a footing is 600 kPa at depth 1.5 m (γ = 18 kN/m³). With FS = 3, the net safe bearing capacity is:<\/p>","a":2,"s":"<p>qnu = 600 − 27 = 573 kPa; qns = 573/3 = 191 kPa.<br>Other options: A — gross ultimate divided by FS; B — this is the gross safe bearing capacity; D — γDf subtracted after dividing.<\/p>","tag":""},{"id":"4.6.7","m":1,"o":["30.2 mm","66.7 mm","10.0 mm","17.4 mm"],"q":"<p>A plate load test on sand with a 300 mm square plate gives 10 mm settlement at the design pressure. The settlement of a 2 m wide footing at the same pressure (Terzaghi–Peck) is about:<\/p>","a":0,"s":"<p>Sf = Sp[B(Bp + 0.3)/(Bp(B + 0.3))]² = 10 × (1.2/0.69)² = 30.25 mm.<br>Other options: B — linear relation for clay used; C — assumed same as plate; D — bracket not squared.<\/p>","tag":""},{"id":"4.6.8","m":1,"o":["2 times the plate width","3 times the plate width","10 times the plate width","5 times the plate width"],"q":"<p>As per IS 1888, the width of the test pit for a plate load test should be at least:<\/p>","a":3,"s":"<p>A pit at least 5Bp wide ensures no surcharge effect at plate level.<br>Other options: A — too narrow; side surcharge would act; B — less than required; C — more than required.<\/p>","tag":""},{"id":"4.6.9","m":1,"o":["11.2 mm","12.3 mm","8.6 mm","5.6 mm"],"q":"<p>A rigid footing 2 m wide applies 150 kPa on soil with E = 20 MPa and ν = 0.3. Taking influence factor 0.82, the immediate settlement is:<\/p>","a":0,"s":"<p>Si = qB(1 − ν²)If/E = 150 × 2 × 0.91 × 0.82/20000 = 0.01119 m.<br>Other options: B — (1 − ν²) omitted; C — (1 − ν) used instead of (1 − ν²); D — B/2 used.<\/p>","tag":""},{"id":"4.6.10","m":1,"o":["25 mm","75 mm","50 mm","100 mm"],"q":"<p>As per IS 1904, the maximum permissible total settlement for an isolated foundation on sand supporting an RC framed structure is:<\/p>","a":2,"s":"<p>IS 1904 lists 50 mm for isolated foundations on sand and hard clay, 75 mm on plastic clay.<br>Other options: A — stricter than the IS 1904 value for this case; B — the limit for isolated foundations on plastic clay; D — far above the limit for isolated footings on sand.<\/p>","tag":""},{"id":"4.6.11","m":1,"o":["999.0 kN","622.0 kN","565.5 kN","791.7 kN"],"q":"<p>A 0.4 m diameter bored pile 15 m long is in uniform clay with cu = 50 kPa. Taking Nc = 9 and adhesion factor α = 0.6, the ultimate pile capacity is:<\/p>","a":1,"s":"<p>Qb = 9 × 50 × π(0.4)²/4 = 56.55 kN; Qs = 0.6 × 50 × π × 0.4 × 15 = 565.49 kN; Qu = 622.0 kN.<br>Other options: A — α omitted (full cohesion on the shaft); C — end bearing omitted; D — base area taken as πD² instead of πD²/4.<\/p>","tag":""},{"id":"4.6.12","m":1,"o":["72.7%","99.5%","86.3%","27.3%"],"q":"<p>A 3 × 3 pile group has pile diameter 0.4 m at 1.2 m centre-to-centre spacing. By the Converse–Labarre formula, the group efficiency is:<\/p>","a":0,"s":"<p>θ = tan⁻¹(d/s) = 18.43°; η = 1 − θ[n(m − 1) + m(n − 1)]/(90mn) = 1 − 18.43 × 12/810 = 0.7269.<br>Other options: B — θ used in radians instead of degrees; C — (m + n) used instead of n(m − 1) + m(n − 1); D — this is 1 − η.<\/p>","tag":""},{"id":"4.6.13","m":1,"o":["1285.7 kN","214.3 kN","750.0 kN","600.0 kN"],"q":"<p>A drop hammer of weight 30 kN falls 150 cm and the average set is 1 cm per blow. Using the Engineering News formula Qa = WH/[6(S + 2.5)] (H, S in cm), the allowable load is:<\/p>","a":1,"s":"<p>Qa = 30 × 150/(6 × 3.5) = 214.3 kN.<br>Other options: A — factor of safety 6 omitted (ultimate load); C — constant 2.5 omitted; D — steam-hammer constant 0.25 used.<\/p>","tag":""},{"id":"4.6.14","m":1,"o":["A recent fill placed over soft clay causes the clay to consolidate around the pile","The pile is driven into dense sand only","The water table rises permanently","The pile carries a lateral load"],"q":"<p>Negative skin friction on a pile is most likely when:<\/p>","a":0,"s":"<p>When surrounding soil settles more than the pile, it drags the pile down, adding load instead of support.<br>Other options: B — no settling layer around the shaft; C — rising WT reduces σ&#x27;, not causing drag; D — unrelated.<\/p>","tag":""},{"id":"4.6.15","m":1,"o":["125.7 kN","62.8 kN","40.0 kN","251.3 kN"],"q":"<p>A 0.5 m diameter pile passes through 4 m of soft clay (cu = 20 kPa) that is consolidating under a fresh fill. Taking adhesion factor 1, the negative skin friction load is:<\/p>","a":0,"s":"<p>Fn = α·c·πD·L = 1 × 20 × π × 0.5 × 4 = 125.7 kN.<br>Other options: B — radius used instead of diameter in the perimeter; C — π omitted from the perimeter; D — perimeter taken as 2πD.<\/p>","tag":""},{"id":"4.6.16","m":1,"o":["1256.6 kN","188.5 kN","120.0 kN","377.0 kN"],"q":"<p>A 0.5 m diameter, 10 m long pile in sand has average vertical effective stress 80 kPa along the shaft. Using the β method with β = 0.3, the ultimate shaft resistance is:<\/p>","a":3,"s":"<p>fs = βσ&#x27;v = 24 kPa; Qs = 24 × π × 0.5 × 10 = 377.0 kN.<br>Other options: A — β omitted; B — radius used in the perimeter; C — π omitted.<\/p>","tag":""},{"id":"4.6.17","m":1,"o":["Curb","Steining","Bottom plug","Well cap"],"q":"<p>In a well foundation, the main wall of the well that transfers the load to the base and acts as a cofferdam during sinking is the:<\/p>","a":1,"s":"<p>Steining is the masonry/RCC shell between the curb and the well cap.<br>Other options: A — the wedge-shaped ring above the cutting edge; C — the concrete seal at the base; D — the slab at the top that receives the pier.<\/p>","tag":""},{"id":"4.6.18","m":1,"o":["Excavate more on the higher side and place eccentric kentledge on the higher side","Excavate more on the lower side","Place kentledge on the lower side","Stop dredging and pour the bottom plug immediately"],"q":"<p>During sinking, a well foundation has tilted. A standard corrective measure is to:<\/p>","a":0,"s":"<p>Making the higher side sink faster brings the well back to vertical; w
