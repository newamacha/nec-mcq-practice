e flow component of a stream hydrograph is contributed mainly by:<\/p>","a":3,"s":"<p>Base flow is the delayed groundwater contribution that sustains dry-weather flow.<br>Other options: A — channel precipitation is part of direct runoff; B — overland flow is the main part of direct (surface) runoff; C — prompt interflow is usually counted with direct runoff.<\/p>","tag":""},{"id":"5.5.19","m":1,"o":["3.0 days","6.24 days","15.6 days","48.6 days"],"q":"<p>In base-flow separation, the time N (days) after the peak at which direct runoff is assumed to end is often taken as N = A^0.2, with A in km². For a catchment of 243 km², N is:<\/p>","a":0,"s":"<p>N = 243^0.2 = 3.0 days (since 3⁵ = 243).<br>Other options: B — cube root of A taken; C — square root of A taken; D — A multiplied by 0.2 instead of raised to 0.2.<\/p>","tag":""},{"id":"5.5.20","m":1,"o":["50.00 m³/s","59.05 m³/s","65.61 m³/s","90.00 m³/s"],"q":"<p>A recession limb follows Qt = Q0 K^t with K = 0.9 per day. If the discharge today is 100 m³/s, the discharge after 5 days without rain is:<\/p>","a":1,"s":"<p>Q5 = 100 × 0.9⁵ = 59.05 m³/s.<br>Other options: A — linear decrease of 10% of Q0 per day assumed; C — exponent 4 used instead of 5; D — only one day&#x27;s recession applied.<\/p>","tag":""},{"id":"5.5.21","m":1,"o":["1 cm of total rainfall falling in D hours","Any storm of D hours duration, scaled to a peak of 1 m³/s","1 cm (unit depth) of effective rainfall occurring uniformly over the catchment at a uniform rate during D hours","Rainfall of unit intensity (1 cm/h) lasting for 1 hour"],"q":"<p>A D-hour unit hydrograph of a catchment is defined as the direct runoff hydrograph resulting from:<\/p>","a":2,"s":"<p>The UH volume equals 1 cm × catchment area; linearity and time invariance allow superposition.<br>Other options: A — the unit is effective (excess) rainfall, after losses; B — a UH is defined by unit runoff depth, not unit peak; D — the duration is D hours and the depth, not intensity, is unity.<\/p>","tag":""},{"id":"5.5.22","m":1,"o":["1.728 km²","57.6 km²","172.8 km²","345.6 km²"],"q":"<p>The ordinates of a 3-h unit hydrograph at 3-hour intervals are 0, 10, 30, 50, 35, 20, 10, 5, 0 m³/s. The catchment area is:<\/p>","a":2,"s":"<p>ΣQ × Δt = 160 × 3 × 3600 = 1728000 m³ = A × 0.01 m → A = 172.8 km².<br>Other options: A — runoff depth taken as 1 m instead of 1 cm; B — time interval taken as 1 hour; D — time interval taken as 6 hours.<\/p>","tag":""},{"id":"5.5.23","m":1,"o":["54 m³/s","200 m³/s","210 m³/s","240 m³/s"],"q":"<p>The peak ordinate of a 3-h unit hydrograph is 50 m³/s. A 3-h storm produces 4 cm of effective rainfall, and the base flow is 10 m³/s. The peak discharge of the flood hydrograph is:<\/p>","a":2,"s":"<p>Peak = 4 × 50 + 10 = 210 m³/s (base flow is not scaled).<br>Other options: A — rainfall depth added instead of multiplied; B — base flow not added; D — base flow multiplied by the rainfall depth too.<\/p>","tag":""},{"id":"5.5.24","m":1,"o":["125.0 m³/s","347.2 m³/s","1389 m³/s","5556 m³/s"],"q":"<p>The equilibrium discharge of the S-curve derived from a 4-h unit hydrograph of a 500 km² catchment is:<\/p>","a":1,"s":"<p>Qe = A × (1 cm/D h) = 2.778 A/D (A in km², D in h) = 2.778 × 500/4 = 347.2 m³/s.<br>Other options: A — conversion factor 2.778 omitted; C — duration D not divided; D — multiplied by D instead of dividing.<\/p>","tag":""},{"id":"5.5.25","m":1,"o":["Add the 3-h UH to the same UH lagged by 3 h and divide the ordinates by 2","Multiply the ordinates of the 3-h UH by 2","Divide the ordinates of the 3-h UH by 2 and stretch the time base","Add the 3-h UH to itself without lag"],"q":"<p>A 6-h unit hydrograph is required from a known 3-h unit hydrograph. The simplest correct procedure is to:<\/p>","a":0,"s":"<p>Two 3-h UHs in succession give 2 cm in 6 h; dividing by 2 gives 1 cm in 6 h. For a non-integer multiple, the S-curve method is used.<br>Other options: B — that gives the runoff from 2 cm in 3 h, not a 6-h UH; C — time scaling is not valid for UH conversion; D — that is simply doubling the ordinates.<\/p>","tag":""},{"id":"5.5.26","m":1,"o":["4.85 h","7.94 h","11.91 h","20.71 h"],"q":"<p>For Snyder&#x27;s synthetic unit hydrograph, the basin lag is tp = Ct (L·Lca)^0.3 hours with L and Lca in km. With Ct = 1.5, L = 50 km and Lca = 20 km, the basin lag is:<\/p>","a":2,"s":"<p>tp = 1.5 × (1000)^0.3 = 1.5 × 7.943 = 11.91 h.<br>Other options: A — Lca left out of the product; B — Ct omitted; D — exponent 0.38 used.<\/p>","tag":""},{"id":"5.5.27","m":1,"o":["1.1 h","2 h","2.75 h","60.5 h"],"q":"<p>In Snyder&#x27;s method, the standard duration of effective rainfall for a basin lag of 11 hours is:<\/p>","a":1,"s":"<p>tr = tp/5.5 = 11/5.5 = 2 h.<br>Other options: A — divided by 10; C — divided by 4; D — lag multiplied by 5.5 instead of divided.<\/p>","tag":""},{"id":"5.5.28","m":1,"o":["46.61 mm","50.54 mm","61.16 mm","66.31 mm"],"q":"<p>Using the SCS-CN method (SI, Ia = 0.2S), the direct runoff from a rainfall of 100 mm on a catchment with curve number 80 is:<\/p>","a":1,"s":"<p>S = 25400/CN − 254 = 63.5 mm; Ia = 0.2S = 12.7 mm. Q = (P − 0.2S)²/(P + 0.8S) = 87.3²/150.8 = 50.54 mm.<br>Other options: A — denominator taken as P + S instead of P + 0.8S; C — initial abstraction ignored (P²/(P + S)); D — Ia not subtracted in the numerator.<\/p>","tag":""},{"id":"5.5.29","m":1,"o":["Measure the evaporation from the soil surface","Collect the surface runoff for measurement","Measure the rainfall intensity during the test","Reduce the lateral spread of water from the inner ring, so the inner ring measures nearly vertical infiltration"],"q":"<p>In a double-ring infiltrometer, the outer ring is used to:<\/p>","a":3,"s":"<p>Water is kept at the same depth in both rings; infiltration is computed from the inner ring only.<br>Other options: A — evaporation is not measured by an infiltrometer; B — rings are flooded; there is no runoff to collect; C — the test uses ponded water, not rainfall.<\/p>","tag":""},{"id":"5.5.30","m":1,"o":["Discharge against time","Accumulated rainfall against time","Lines of equal rainfall over an area","Rainfall intensity (or depth per interval) against time"],"q":"<p>A hyetograph is a plot of:<\/p>","a":3,"s":"<p>A hyetograph is usually drawn as a bar chart of rainfall per time interval; it is used to compute φ-index and effective rainfall.<br>Other options: A — that is a hydrograph; B — that is a mass curve of rainfall; C — those are isohyets.<\/p>","tag":""}]},{"k":"5.6","t":"Peak Flow, Statistical Hydrology and Flood Routing","qs":[{"id":"5.6.1","m":1,"o":["0.11 m³/s","11.11 m³/s","27.78 m³/s","40.00 m³/s"],"q":"<p>Using the rational formula, the peak runoff from a 2 km² catchment with runoff coefficient 0.4, for a rainfall intensity of 50 mm/h (duration equal to the time of concentration), is:<\/p>","a":1,"s":"<p>Qp = C i A/3.6 (i in mm/h, A in km²) = 0.4 × 50 × 2/3.6 = 11.11 m³/s.<br>Other options: A — hectare form (÷ 360) used with area in km²; C — runoff coefficient omitted; D — conversion factor 1/3.6 omitted.<\/p>","tag":""},{"id":"5.6.2","m":1,"o":["6.67 m³/s","11.11 m³/s","66.67 m³/s","666.7 m³/s"],"q":"<p>An urban catchment of 50 hectares has a runoff coefficient of 0.6. For a design rainfall intensity of 80 mm/h, the peak discharge by the rational method is:<\/p>","a":0,"s":"<p>Qp = C i A/360 (i in mm/h, A in ha) = 0.6 × 80 × 50/360 = 6.67 m³/s.<br>Other options: B — runoff coefficient omitted; C — divided by 36 instead of 360; D — km² form (÷ 3.6) used with area in hectares.<\/p>","tag":""},{"id":"5.6.3","m":1,"o":["24 hours","The time to peak of the unit hydrograph","The time of concentration of the catchment","The base time of the hydrograph"],"q":"<p>In the rational method, the design rainfall intensity is taken for a duration equal to:<\/p>","a":2,"s":"<p>Peak runoff occurs when the whole catchment contributes, i.e. when the storm duration equals tc; a longer storm has lower intensity.<br>Other options: A — a 24-h intensity is far smaller and would underestimate the peak of a small catchment; B — the rational method does not use a unit hydrograph; D — base time is much longer than tc.<\/p>","tag":""},{"id":"5.6.4","m":1,"o":["1.20 min","9.26 min","71.2 min","449 min"],"q":"<p>Using Kirpich&#x27;s formula tc = 0.01947 L^0.77 S^(−0.385) (tc in minutes, L in metres), the time of concentration for a catchment with a maximum flow length of 3000 m and an average slope of 0.005 is:<\/p>","a":2,"s":"<p>tc = 0.01947 × 3000^0.77 × 0.005^(−0.385) = 0.01947 × 475.8 × 7.689 = 71.2 min.<br>Other options: A — the sign of the slope exponent ignored (S^+0.385); B — slope term omitted; D — exponent 0.77 on L omitted.<\/p>","tag":""},{"id":"5.6.5","m":1,"o":["0.18","0.41","0.55","0.69"],"q":"<p>A small catchment has 30% of its area as roofs and pavements (C = 0.9) and 70% as lawns (C = 0.2). The composite runoff coefficient is:<\/p>","a":1,"s":"<p>C = Σ Ci Ai/ΣA = 0.3 × 0.9 + 0.7 × 0.2 = 0.27 + 0.14 = 0.41.<br>Other options: A — the two coefficients multiplied; C — simple average of the two coefficients, ignoring the area fractions; D — area fractions swapped between the two land uses.<\/p>","tag":""},{"id":"5.6.6","m":1,"o":["36.05 m³/s","114.0 m³/s","245.6 m³/s","360.5 m³/s"],"q":"<p>Using Dickens&#x27; formula Q = C_D A^(3/4) with C_D = 11.4 (SI, A in km²), the maximum flood discharge from a catchment of 100 km² is:<\/p>","a":3,"s":"<p>Q = 11.4 × 100^0.75 = 11.4 × 31.62 = 360.5 m³/s.<br>Other options: A — exponent 1/4 used; B — exponent 1/2 used; C — exponent 2/3 used (that is Ryves&#x27; formula).<\/p>","tag":""},{"id":"5.6.7","m":1,"o":["34 m³/s","170 m³/s","254.2 m³/s","850 m³/s"],"q":"<p>Using Ryves&#x27; formula Q = C_R A^(2/3) with C_R = 6.8 (SI, A in km²), the flood discharge from a catchment of 125 km² is:<\/p>","a":1,"s":"<p>Q = 6.8 × 125^(2/3) = 6.8 × 25 = 170 m³/s.<br>Other options: A — exponent 1/3 used; C — exponent 3/4 used (Dickens&#x27; form); D — area not raised to any power.<\/p>","tag":""},{"id":"5.6.8","m":1,"o":["112.3 m³/s","118.0 m³/s","1180.1 m³/s","1240 m³/s"],"q":"<p>Using Inglis&#x27; formula Q = 124A/√(A + 10.4) (SI, A in km², for fan-shaped catchments), the flood discharge from a catchment of 100 km² is:<\/p>","a":2,"s":"<p>Q = 124 × 100/√110.4 = 12 400/10.507 = 1180.1 m³/s.<br>Other options: A — square root in the denominator not taken; B — √A used in the numerator instead of A; D — the 10.4 term omitted.<\/p>","tag":""},{"id":"5.6.9","m":1,"o":["25 years","50 years","98 years","100 years"],"q":"<p>A flood has a probability of 0.02 of being equalled or exceeded in any one year. Its return period is:<\/p>","a":1,"s":"<p>T = 1/p = 1/0.02 = 50 years.<br>Other options: A — 1/(2p) used; C — non-exceedance probability 0.98 multiplied by 100; D — probability taken as 0.01.<\/p>","tag":""},{"id":"5.6.10","m":1,"o":["0.010","0.395","0.500","0.605"],"q":"<p>The probability that a 100-year flood will be equalled or exceeded at least once during a 50-year design life is:<\/p>","a":1,"s":"<p>Risk R = 1 − (1 − 1/T)^n = 1 − 0.99⁵⁰ = 0.395.<br>Other options: A — annual exceedance probability only; C — n/T taken as the probability; D — that is the probability of no exceedance (assurance).<\/p>","tag":""},{"id":"5.6.11","m":1,"o":["0.183","0.200","0.800","0.817"],"q":"<p>The probability that a 50-year flood will NOT occur at all during the next 10 years is:<\/p>","a":3,"s":"<p>q^n = (1 − 1/50)¹⁰ = 0.98¹⁰ = 0.817.<br>Other options: A — that is the probability of at least one occurrence (risk); B — n/T used; C — 1 − n/T used.<\/p>","tag":""},{"id":"5.6.12","m":1,"o":["11.4 years","25 years","238 years","250 years"],"q":"<p>A culvert with a design life of 25 years is to be designed so that the risk of its design flood being exceeded during that life is only 10%. The required return period is about:<\/p>","a":2,"s":"<p>R = 1 − (1 − 1/T)^n → 1/T = 1 − (0.9)^(1/25) = 0.00421 → T = 237.8 ≈ 238 years.<br>Other options: A — 0.1 used instead of 0.9 inside the root; B — return period taken equal to the design life; D — T = n/R used.<\/p>","tag":""},{"id":"5.6.13","m":1,"o":["0.066","0.328","0.410","0.500"],"q":"<p>The probability that a 10-year flood occurs exactly once in a period of 5 years is:<\/p>","a":1,"s":"<p>P(exactly 1) = n p (1 − p)^(n−1) = 5 × 0.1 × 0.9⁴ = 0.328.<br>Other options: A — the binomial coefficient 5 omitted; C — probability of at least once used; D — n/T used.<\/p>","tag":""},{"id":"5.6.14","m":1,"o":["3 years","9.67 years","10 years","14.5 years"],"q":"<p>In a record of 29 years of annual floods arranged in descending order, a flood ranked 3rd has a return period, by the Weibull plotting position formula, of:<\/p>","a":2,"s":"<p>T = (N + 1)/m = 30/3 = 10 years; P = 1/T = 0.1.<br>Other options: A — rank taken as the return period; B — N/m used instead of (N + 1)/m; D — N/(m − 1) used.<\/p>","tag":""},{"id":"5.6.15","m":1,"o":["471 m³/s","538 m³/s","971 m³/s","1190 m³/s"],"q":"<p>Annual flood peaks at a site have a mean of 500 m³/s and a standard deviation of 150 m³/s. Using Gumbel&#x27;s method for a very long record (K = −(√6/π)[0.5772 + ln ln(T/(T − 1))]), the 100-year flood is:<\/p>","a":2,"s":"<p>K = −0.7797 × (0.5772 + ln ln(100/99)) = 3.137; x100 = 500 + 3.137 × 150 = 971 m³/s.<br>Other options: A — mean not added; B — √σ used instead of σ; D — reduced variate yT used directly as the frequency factor K.<\/p>","tag":""},{"id":"5.6.16","m":1,"o":["−1.364","2.057","3.902","3.912"],"q":"<p>The Gumbel reduced variate yT for a return period of 50 years is:<\/p>","a":2,"s":"<p>yT = −ln[ln(T/(T − 1))] = −ln[ln(50/49)] = −ln(0.02020) = 3.902.<br>Other options: A — ln ln T used instead of ln ln[T/(T − 1)]; B — common logarithms used instead of natural logarithms; D — ln T used.<\/p>","tag":""},{"id":"5.6.17","m":1,"o":["1941 m³/s","2096 m³/s","2356 m³/s","2380 m³/s"],"q":"<p>A 30-year record of annual floods has mean 1000 m³/s and standard deviation 300 m³/s. For N = 30, Gumbel&#x27;s table gives ȳn = 0.5362 and Sn = 1.1124. The 100-year flood is:<\/p>","a":1,"s":"<p>yT = −ln ln(100/99) = 4.6001; K = (yT − ȳn)/Sn = (4.6001 − 0.5362)/1.1124 = 3.653; x100 = 1000 + 3.653 × 300 = 2096 m³/s.<br>Other options: A — infinite-sample values ȳn = 0.5772, Sn = 1.2825 used; C — multiplied by Sn instead of dividing; D — yT used directly as K without ȳn and Sn.<\/p>","tag":""},{"id":"5.6.18","m":1,"o":["Log-normal distribution","Gumbel (extreme value type I) distribution","Normal distribution of the flood values themselves","Exponential distribution"],"q":"<p>In the Log-Pearson Type III method, if the coefficient of skew of the logarithms of the annual floods is zero, the distribution reduces to the:<\/p>","a":0,"s":"<p>With Cs = 0 the frequency factor Kz equals the standard normal variate z, so log Q is normally distributed.<br>Other options: B — Gumbel has a fixed skew of 1.14, unrelated to LP-III with Cs = 0; C — the logarithms, not the floods, are normal; D — the exponential is a special case of gamma, not of LP-III with zero skew.<\/p>","tag":""},{"id":"5.6.19","m":1,"o":["2.965 m³/s","320 m³/s","392 m³/s","923 m³/s"],"q":"<p>In a Log-Pearson Type III analysis, the mean and standard deviation of log10 of annual floods are 2.5 and 0.2, and the skew is zero, so Kz = 2.326 for T = 100 years. The 100-year flood is:<\/p>","a":3,"s":"<p>log Q = 2.5 + 2.326 × 0.2 = 2.9652 → Q = 10^2.9652 = 923 m³/s.<br>Other options: A — antilog not taken; B — antilogs of the mean and σ taken separately and added; C — variance used instead of standard deviation.<\/p>","tag":""},{"id":"5.6.20","m":1,"o":["0.050","0.358","0.642","1.000"],"q":"<p>The probability that a 20-year flood is equalled or exceeded at least once in any 20-year period is about:<\/p>","a":2,"s":"<p>R = 1 − (1 − 1/20)²⁰ = 1 − 0.95²⁰ = 0.642 (≈ 64%, close to 1 − 1/e for large T).<br>Other options: A — annual probability only; B — probability of non-occurrence; D — it is wrongly assumed the T-year flood must occur within T years.<\/p>","tag":""},{"id":"5.6.21","m":1,"o":["Occurs where the outflow hydrograph intersects the falling limb of the inflow hydrograph","Occurs at the same time as the inflow peak, with the same magnitude","Occurs before the inflow peak","Is larger than the inflow peak"],"q":"<p>When a flood is routed through a reservoir with an uncontrolled (ungated) spillway, the peak of the outflow hydrograph:<\/p>","a":0,"s":"<p>Storage rises while I &gt; O; it is maximum, and so is the outflow (O depends only on head), when I = O — a point on the falling limb of the inflow.<br>Other options: B — storage attenuates and delays the peak; C — outflow cannot peak before storage stops increasing, i.e. after the inflow peak; D — reservoir storage always reduces the peak.<\/p>","tag":""},{"id":"5.6.22","m":1,"o":["0.00576 Mm³","0.3456 Mm³","0.4752 Mm³","0.6912 Mm³"],"q":"<p>During a 6-hour routing interval, the inflow to a reservoir changes from 20 to 40 m³/s and the outflow from 10 to 18 m³/s. The increase in storage during the interval is:<\/p>","a":1,"s":"<p>ΔS = [(I1 + I2)/2 − (O1 + O2)/2] Δt = (30 − 14) × 21 600 = 345600 m³ = 0.3456 × 10⁶ m³.<br>Other options: A — Δt converted with 60 instead of 3600 s per hour; C — end-of-interval flows used instead of averages; D — sums used without halving.<\/p>","tag":""},{"id":"5.6.23","m":1,"o":["10 m³/s","55 m³/s","80 m³/s","110 m³/s"],"q":"<p>In the modified Puls (storage-indication) method, (I1 + I2) = 60 m³/s for a routing period and (2S1/Δt − O1) = 50 m³/s at its start. The value of (2S2/Δt + O2) at the end of the period is:<\/p>","a":3,"s":"<p>Continuity: (I1 + I2) + (2S1/Δt − O1) = (2S2/Δt + O2) → 60 + 50 = 110 m³/s; O2 is then read from the storage-indication curve.<br>Other options: A — the two terms subtracted; B — the result halved; C — only the mean inflow (I1 + I2)/2 added.<\/p>","tag":""},{"id":"5.6.24","m":1,"o":["3.46 Mm³","3.63 Mm³","3.89 Mm³","4.15 Mm³"],"q":"<p>For a river reach, the Muskingum parameters are K = 12 h and x = 0.2. At an instant the inflow is 100 m³/s and the outflow is 80 m³/s. The storage in the reach is:<\/p>","a":1,"s":"<p>S = K[xI + (1 − x)O] = 12 × (20 + 64) = 1008 m³/s·h = 1008 × 3600 m³ = 3.63 × 10⁶ m³.<br>Other options: A — linear-reservoir storage KO used (x = 0); C — simple average of I and O used (x = 0.5); D — x applied to the outflow and (1 − x) to the inflow.<\/p>","tag":""},{"id":"5.6.25","m":1,"o":["0.048","0.429","0.524","0.550"],"q":"<p>For Muskingum routing with K = 12 h, x = 0.2 and Δt = 6 h, the routing coefficient C2 (multiplying O1) is:<\/p>","a":2,"s":"<p>Denominator = K − Kx + 0.5Δt = 12 − 2.4 + 3 = 12.6. C2 = (K − Kx − 0.5Δt)/12.6 = 6.6/12.6 = 0.524 (C0 = 0.048, C1 = 0.429; sum = 1).<br>Other options: A — that is C0 (multiplying I2); B — that is C1 (multiplying I1); D — divided by K instead of by (K − Kx + 0.5Δt).<\/p>","tag":""},{"id":"5.6.26","m":1,"o":["31.43 m³/s","42.86 m³/s","45.00 m³/s","60.00 m³/s"],"q":"<p>Using Muskingum coefficients C0 = 0.048, C1 = 0.429 and C2 = 0.524 (from K = 12 h, x = 0.2, Δt = 6 h), with inflows I1 = 30 m³/s and I2 = 60 m³/s and outflow O1 = 30 m³/s, the outflow O2 is:<\/p>","a":0,"s":"<p>O2 = C0 I2 + C1 I1 + C2 O1 = 0.0476 × 60 + 0.4286 × 30 + 0.5238 × 30 = 31.43 m³/s.<br>Other options: B — C0 and C1 applied to the wrong inflows; C — average of I2 and O1 taken; D — outflow taken equal to the current inflow (no attenuation).<\/p>","tag":""},{"id":"5.6.27","m":1,"o":["Pure translation of the flood wave without attenuation","A reach with no storage","Storage depending on inflow only","A linear reservoir, where storage depends on outflow only"],"q":"<p>In the Muskingum method, a weighting factor x = 0 corresponds to:<\/p>","a":3,"s":"<p>S = K[xI + (1 − x)O]; with x = 0, S = KO (level-pool type behaviour). Natural rivers usually have x ≈ 0.1–0.3.<br>Other options: A — that corresponds to x = 0.5; B — x = 0 means S = KO, which is maximum attenuation; C — that would be x = 1, outside the usual 0–0.5 range.<\/p>","tag":""},{"id":"5.6.28","m":1,"o":["C0 + C1 + C2 = 1","C0 + C1 + C2 = 0","C0 × C1 × C2 = 1","C0 = C1 = C2"],"q":"<p>The three Muskingum routing coefficients C0, C1 and C2 satisfy the relation:<\/p>","a":0,"s":"<p>Adding the three expressions gives (K − Kx + 0.5Δt)/(K − Kx + 0.5Δt) = 1; this is a useful arithmetic check.<br>Other options: B — the coefficients are weights and must add to one; C — no product relation exists; D — they depend on K, x and Δt and are generally unequal.<\/p>","tag":""},{"id":"5.6.29","m":1,"o":["The Saint-Venant equations of continuity and momentum for unsteady flow","The storage equation alone","Manning&#x27;s equation for uniform flow","The unit hydrograph convolution equation"],"q":"<p>Hydraulic (as opposed to hydrologic) flood routing is based on the solution of:<\/p>","a":0,"s":"<p>Hydraulic routing solves the full (or simplified, e.g. kinematic/diffusion wave) Saint-Venant equations along the channel.<br>Other options: B — that is hydrologic routing (Puls, Muskingum); C — uniform flow cannot describe a moving flood wave; D — that converts rainfall to runoff, it does not route a flood.<\/p>","tag":""},{"id":"5.6.30","m":1,"o":["Mean annual flood","25-year flood","Largest flood observed in the gauging record","Probable maximum flood (PMF)"],"q":"<p>For the spillway of a large dam whose failure would cause catastrophic loss of life and property, the design flood normally adopted is the:<\/p>","a":3,"s":"<p>The PMF, derived from the probable maximum precipitation, is the standard design flood for high-hazard large dams; smaller dams may use the standard project flood or a 100–1000-year flood.<br>Other options: A — far too frequent a flood for spillway safety; B — used for minor structures such as small culverts; C — short records rarely contain the extreme flood.<\/p>","tag":""}]}]},{"n":6,"t":"Transportation Engineering","subs":[{"k":"6.1","t":"Road Transportation in Nepal and Highway Alignment","qs":[{"id":"6.1.1","m":1,"o":["It gives door-to-door service with flexibility of route and timing","It is the cheapest mode for hauling bulk freight over very long distances","It needs a fixed track and fixed terminals","It has the lowest accident rate per passenger-km"],"q":"<p>Which of the following is the principal advantage of road transport over rail, air and water transport?<\/p>","a":0,"s":"<p>Roads reach almost every origin and destination, and a vehicle can change its route and schedule freely; the other modes need fixed terminals and transfers.<br>Other options: B — rail and water transport are cheaper per tonne-km for long-haul bulk freight; C — that describes railways, not roads; D — road transport has the highest accident rate of all modes<\/p>","tag":""},{"id":"6.1.2","m":1,"o":["Urban roads only","National Highways and Feeder Roads","All roads including agricultural and forest tracks","District Roads and Village Roads"],"q":"<p>In Nepal, the Strategic Road Network (SRN) that is planned and maintained by the Department of Roads consists of:<\/p>","a":1,"s":"<p>The SRN is made up of the National Highways and Feeder Roads under DoR; district, urban and village roads form the local road network looked after by local governments.<br>Other options: A — urban roads are looked after by municipalities; C — DoR does not maintain local roads and tracks; D — these are local roads, under local governments<\/p>","tag":""},{"id":"6.1.3","m":1,"o":["Ministry of Urban Development","Ministry of Energy, Water Resources and Irrigation","Ministry of Forests and Environment","Ministry of Physical Infrastructure and Transport"],"q":"<p>The Department of Roads (DoR) of Nepal, responsible for the Strategic Road Network, functions under the:<\/p>","a":3,"s":"<p>DoR is a department of the Ministry of Physical Infrastructure and Transport (MoPIT).<br>Other options: A — this ministry deals with urban planning and buildings; B — this ministry deals with hydropower and irrigation; C — this ministry deals with forests, not the road network<\/p>","tag":""},{"id":"6.1.4","m":1,"o":["Bardibas, via Sindhuli","Kodari on the Tibet border","Hetauda, via Palung and Daman","Pokhara"],"q":"<p>The Tribhuvan Rajpath, generally regarded as the first highway of Nepal, links Kathmandu with:<\/p>","a":2,"s":"<p>The Rajpath (built with Indian assistance in the 1950s) climbs from Naubise over Daman and drops to Hetauda, linking the capital to the Terai.<br>Other options: A — Banepa–Sindhuli–Bardibas is the BP Koirala Highway; B — Kathmandu–Kodari is the Araniko Highway; D — Kathmandu–Pokhara is the Prithvi Highway<\/p>","tag":""},{"id":"6.1.5","m":1,"o":["Switzerland","Japan","India","China"],"q":"<p>The Araniko Highway, connecting Kathmandu with Kodari on the Nepal–China (Tibet) border, was built with the assistance of:<\/p>","a":3,"s":"<p>The Araniko Highway was built with Chinese assistance in the 1960s.<br>Other options: A — Switzerland assisted the Lamosangu–Jiri road; B — Japan funded the Banepa–Sindhuli–Bardibas (BP) Highway; C — India helped build the Tribhuvan Rajpath and parts of the East–West Highway<\/p>","tag":""},{"id":"6.1.6","m":1,"o":["Belahiya (Bhairahawa) and Pokhara","Kathmandu and Pokhara","Kakarbhitta (Mechi) in the east and Gaddachauki (Mahakali) in the west","Banepa and Bardibas"],"q":"<p>The Mahendra Rajmarga (East–West Highway) of Nepal runs between:<\/p>","a":2,"s":"<p>The East–West Highway spans the length of the country through the Terai, from the Mechi border at Kakarbhitta to the Mahakali border at Gaddachauki.<br>Other options: A — this is the Siddhartha Highway; B — this is the Prithvi Highway; D — this is the BP Koirala Highway<\/p>","tag":""},{"id":"6.1.7","m":1,"o":["Japan","China","India","Switzerland"],"q":"<p>The Banepa–Sindhuli–Bardibas road (BP Koirala Highway) was constructed mainly with grant assistance from:<\/p>","a":0,"s":"<p>The Sindhuli road was built in phases with Japanese grant aid (JICA).<br>Other options: B — China assisted the Araniko and Prithvi highways; C — India assisted the Tribhuvan Rajpath; D — Switzerland assisted the Lamosangu–Jiri road<\/p>","tag":""},{"id":"6.1.8","m":1,"o":["Hulaki (Postal) Highway","Pushpalal (Mid-Hill) Highway","Kanti Lokpath","Tribhuvan Rajpath"],"q":"<p>The highway that runs east–west through the middle hills of Nepal, roughly parallel to the Mahendra Rajmarga, is the:<\/p>","a":1,"s":"<p>The Pushpalal Mid-Hill Highway links the hill districts from east to west.<br>Other options: A — the Postal Highway runs through the Terai, south of the East–West Highway; C — the Kanti Lokpath runs north–south from Lalitpur to Hetauda; D — the Rajpath runs north–south from Kathmandu to Hetauda<\/p>","tag":""},{"id":"6.1.9","m":1,"o":["It should touch as many towns as possible whatever the length","It should be as short as practicable between the terminals","It should be safe, with stable slopes and adequate geometric standards","It should be easy to construct, maintain and operate with easy gradients"],"q":"<p>Which of the following is NOT one of the basic requirements of an ideal highway alignment?<\/p>","a":0,"s":"<p>An ideal alignment is short, easy, safe and economical. Touching extra towns at any cost of length goes against the &#x27;short&#x27; requirement.<br>Other options: B — shortness is a basic requirement; C — safety is a basic requirement; D — ease is a basic requirement<\/p>","tag":""},{"id":"6.1.10","m":1,"o":["A costly, densely built-up area","A religious place or protected monument","A suitable bridge site across a major river","A marshy or landslide-prone area"],"q":"<p>In highway alignment, which of the following is an obligatory point through which the alignment should PASS?<\/p>","a":2,"s":"<p>Good bridge sites, mountain passes and intermediate towns are obligatory points the road must pass through; costly or unstable areas are obligatory points to avoid.<br>Other options: A — this is avoided to save cost and disruption; B — this is an obligatory point to avoid; D — this is a point to avoid<\/p>","tag":""},{"id":"6.1.11","m":1,"o":["Reconnaissance → map study → final location survey → preliminary survey","Map study → reconnaissance → preliminary survey → final location and detailed survey","Preliminary survey → map study → reconnaissance → final location survey","Map study → final location survey → reconnaissance → preliminary survey"],"q":"<p>The correct sequence of engineering surveys for locating a new highway is:<\/p>","a":1,"s":"<p>First possible routes are picked from maps, then checked on the ground (reconnaissance), then compared by preliminary survey; the chosen one is pegged and surveyed in detail.<br>Other options: A — you cannot do the final location before the preliminary comparison; C — map study and reconnaissance come before the preliminary survey; D — the final location survey is the last step<\/p>","tag":""},{"id":"6.1.12","m":1,"o":["Run levels and cross-sections along each alternative and estimate its cost","Determine the pavement thickness from soil tests","Peg the final centre line and collect data for working drawings","Examine the general character of the area and pick feasible routes for further study"],"q":"<p>The main objective of a reconnaissance survey for a new highway is to:<\/p>","a":3,"s":"<p>Reconnaissance is a rough field study of the routes chosen from maps: obligatory points, gradients, geology, drainage and other features, to shortlist alternatives.<br>Other options: A — this is done in the preliminary survey; B — this belongs to pavement design, after the route is fixed; C — this is done in the final location and detailed survey<\/p>","tag":""},{"id":"6.1.13","m":1,"o":["Preliminary survey","Map study","Final location and detailed survey","Reconnaissance survey"],"q":"<p>Fixing the highway centre line on the ground with pegs, and collecting detailed data for the working drawings, is done during the:<\/p>","a":2,"s":"<p>The final location survey transfers the chosen alignment to the ground and records the levels, cross-sections, soil and drainage data needed for design and estimates.<br>Other options: A — the preliminary survey compares alternatives; it does not peg the final line; B — no field work is done in a map study; D — reconnaissance is a rough survey to shortlist routes<\/p>","tag":""},{"id":"6.1.14","m":1,"o":["Nepal Bureau of Standards and Metrology","Department of Local Infrastructure (DoLI/DoLIDAR)","Survey Department","Department of Roads (DoR)"],"q":"<p>The Nepal Road Standard 2070, which sets geometric design standards for the strategic roads of Nepal, was issued by the:<\/p>","a":3,"s":"<p>NRS 2070 is a DoR publication covering classification and geometric standards for National Highways and Feeder Roads.<br>Other options: A — NBSM sets product and material standards, not road geometric standards; B — DoLIDAR issued the Nepal Rural Road Standards for local roads; C — the Survey Department produces maps<\/p>","tag":""},{"id":"6.1.15","m":1,"o":["Enoscope","Ghat tracer","Benkelman beam","Planimeter"],"q":"<p>Which instrument is commonly used during hill-road location to lay out a line of constant gradient on the ground?<\/p>","a":1,"s":"<p>A ghat tracer (or an Abney level) is set to the required gradient and used to fix a line of constant slope along the hillside.<br>Other options: A — an enoscope (mirror box) is used for spot speed studies; C — a Benkelman beam measures pavement deflection; D — a planimeter measures area on a map<\/p>","tag":""},{"id":"6.1.16","m":1,"o":["Dip out of the hill towards the road, roughly parallel to the slope","Are vertical and strike at right angles to the road","Dip into the hill, away from the road","Are horizontal"],"q":"<p>For a hill road cut into a rock slope, the bedding planes that are MOST unfavourable for the stability of the cut are those that:<\/p>","a":0,"s":"<p>Planes that dip towards the road come out (daylight) in the cut face, and blocks slide along them. Planes that dip into the hill are far safer.<br>Other options: B — these give no sliding plane along the slope; C — these planes do not come out in the cut face, so they are the most favourable; D — flat beds give no sliding plane towards the road<\/p>","tag":""},{"id":"6.1.17","m":1,"o":["Breast wall","Parapet wall","Retaining wall","Wing wall"],"q":"<p>A wall built on the uphill side of a hill road to support the cut slope and stop debris from falling onto the road is a:<\/p>","a":0,"s":"<p>Breast walls protect the cut face on the hill side; retaining walls hold up the fill on the valley side.<br>Other options: B — a parapet is a low safety wall at the valley edge; C — a retaining wall holds up the fill on the valley side; D — wing walls are part of a bridge or culvert<\/p>","tag":""},{"id":"6.1.18","m":1,"o":["2.4 km","4.8 km","9.6 km","12.0 km"],"q":"<p>A hill road has to gain 240 m in height between two points. If the ruling gradient is 1 in 20 and no grade compensation is needed, the minimum length of road (development length) is:<\/p>","a":1,"s":"<p>Length = rise × 20 = 240 × 20 = 4800 m = 4.8 km.<br>Other options: A — this uses 1 in 10; C — this uses 1 in 40; D — this uses a 2% gradient<\/p>","tag":""},{"id":"6.1.19","m":1,"o":["0.3 %","2.7 %","3.0 %","3.33 %"],"q":"<p>A road alignment rises from RL 1250 m to RL 1385 m over a horizontal distance of 4.5 km. The average gradient is:<\/p>","a":2,"s":"<p>Gradient = 135/4500 = 0.030 = 3.0 % (about 1 in 33.3).<br>Other options: A — this slips a decimal place (135 ÷ 45,000); B — this divides by 5 km instead of 4.5 km; D — this is 1 in 30 (the plain-terrain ruling gradient), not the given data<\/p>","tag":""},{"id":"6.1.20","m":1,"o":["Earthwork is always lower on sunny slopes","A flatter gradient is obtained automatically","Sight distance at night is better","The road surface dries faster and there is less frost and snow"],"q":"<p>In Nepal&#x27;s hills, which is the main reason for preferring to align a road on the sunny (south-facing) slope where possible?<\/p>","a":3,"s":"<p>Sunny slopes get more sun, so the road dries faster and there is less ice, frost and moisture damage.<br>Other options: A — the amount of earthwork depends on the terrain, not on which way the slope faces; B — the gradient depends on the length chosen, not on which way the slope faces; C — the way the slope faces does not control night-time sight distance<\/p>","tag":""},{"id":"6.1.21","m":1,"o":["Several bends are stacked one above another on the same unstable face","The slope is steepest, so that the length saved is greatest","The hill slope is gentle and stable, with room to spread the bend","A stream crosses the hill face"],"q":"<p>Hairpin bends on a hill road should preferably be located where:<\/p>","a":2,"s":"<p>A hairpin needs a wide, flat-ish, stable spot for the curve, widening and easy gradient; such sites cut down excavation and slips.<br>Other options: A — stacked bends load the same face and drain onto each other; B — steep slopes need deep cuts and big fills at the bend and are unstable; D — drainage and erosion problems are worst at stream crossings<\/p>","tag":""},{"id":"6.1.22","m":1,"o":["Number of vehicles per km of lane at an instant","Length of road per 100 km² of area (or per unit population)","Number of vehicles per km of road","Passenger car units per hour per lane"],"q":"<p>Road density of a country or region is commonly expressed as:<\/p>","a":1,"s":"<p>Road density measures how well a region is served by roads: road length per unit area or per head of population.<br>Other options: A — that is traffic density; C — that measures vehicle ownership or how crowded roads are, not road density; D — that is traffic flow<\/p>","tag":""},{"id":"6.1.23","m":1,"o":["Road transport","Air transport","Rail transport","Inland water transport"],"q":"<p>Within Nepal, the dominant mode for both passenger and freight transport is:<\/p>","a":0,"s":"<p>With almost no railway and no inland navigation, most of Nepal&#x27;s passengers and freight go by road; air serves remote areas but carries a small share.<br>Other options: B — air transport is important for remote areas but carries a small share overall; C — Nepal has only a few short railway lines; D — Nepal&#x27;s rivers are not used for regular navigation<\/p>","tag":""},{"id":"6.1.24","m":1,"o":["Kathmandu and Kodari","Dhulikhel and Sindhuli","Butwal and Pokhara","Naubise (near Kathmandu) and Pokhara"],"q":"<p>The Prithvi Highway of Nepal connects:<\/p>","a":3,"s":"<p>The Prithvi Highway leaves the Tribhuvan Rajpath at Naubise and runs west via Mugling to Pokhara.<br>Other options: A — this is the Araniko Highway; B — this is part of the BP Koirala Highway; C — this is the Siddhartha Highway<\/p>","tag":""},{"id":"6.1.25","m":1,"o":["Slope stability, geology and hill drainage, along with gradient and hairpin limits","Only the shortest length matters","Avoiding low-lying waterlogged land is the main concern","There is no gradient restriction"],"q":"<p>Compared with a road in the plains, which of the following is a SPECIAL consideration in the alignment of hill roads?<\/p>","a":0,"s":"<p>Hill roads are governed by unstable slopes, landslides, rock structure, cross drainage, ruling gradients and the number and siting of hairpin bends.<br>Other options: B — the shortest line is rarely feasible in hills because of gradient limits; C — this is a typical concern in the plains (e.g. the Terai); D — gradient limits are the main problem in hills<\/p>","tag":""},{"id":"6.1.26","m":1,"o":["High, well-drained ground","Long straight stretches","Areas with good subgrade soil","Low-lying, waterlogged and flood-prone areas"],"q":"<p>In plain terrain such as the Terai, a highway alignment should preferably avoid:<\/p>","a":3,"s":"<p>In plains, waterlogged and flood-prone ground weakens the subgrade and needs high embankments, so the alignment keeps to higher, well-drained ground.<br>Other options: A — this is what the alignment should look for; B — straight stretches are acceptable in plains, but very long ones can cause monotony; C — good soil reduces pavement cost and is preferred<\/p>","tag":""},{"id":"6.1.27","m":1,"o":["Aesthetic consideration","Traffic-capacity consideration","Economic consideration","Traffic-safety consideration"],"q":"<p>Choosing the alignment so that earth from cuts is used in nearby fills (balancing earthwork) is mainly a(n):<\/p>","a":2,"s":"<p>Balancing cut and fill cuts down borrow, disposal and haul costs, so it is part of the economics of the alignment.<br>Other options: A — appearance is not the purpose of balancing earthwork; B — the amount of earthwork does not affect capacity; D — balancing earthwork does not by itself improve safety<\/p>","tag":""},{"id":"6.1.28","m":1,"o":["Plate load test","Aerial photogrammetry and remote sensing with GIS","Spot speed survey","Benkelman beam survey"],"q":"<p>Which technique allows rapid study and comparison of alternative highway alignments over large and difficult terrain at the preliminary stage?<\/p>","a":1,"s":"<p>Aerial photos, satellite images and digital terrain models let engineers compare routes quickly without a full ground survey of each one.<br>Other options: A — this measures subgrade bearing; C — this is a traffic study; D — this measures pavement deflection<\/p>","tag":""},{"id":"6.1.29","m":1,"o":["Higher energy use and cost per tonne-km for bulk freight over long distances","Inability to serve hilly areas","Need for fixed time schedules for every vehicle","Lack of door-to-door service"],"q":"<p>Which of the following is a DISADVANTAGE of road transport compared with railways?<\/p>","a":0,"s":"<p>Trains carry large loads on low-friction track, so long-haul bulk freight costs less per tonne-km by rail; roads cost more and use more fuel for such traffic.<br>Other options: B — roads serve hilly areas better than railways do; C — road vehicles can run at any time; D — door-to-door service is an advantage of roads<\/p>","tag":""},{"id":"6.1.30","m":1,"o":["Cross the slide at the steepest permissible gradient","Locate hairpin bends inside the slide area","Make deep cuts at the toe of the slide","Shift the alignment to stable ground and avoid the slide, even if the road gets longer"],"q":"<p>A proposed hill road alignment in Nepal would cross an active landslide zone. At the alignment stage, the most effective decision generally is to:<\/p>","a":3,"s":"<p>Active slides are very costly to stabilise and keep moving; moving the road onto stable ground is usually the best long-term choice.<br>Other options: A — a steep grade does not stop the slide moving; B — bends in unstable ground make the problem worse; C — cutting at the toe removes support and sets off more movement<\/p>","tag":""}]},{"k":"6.2","t":"Geometric Design","qs":[{"id":"6.2.1","m":1,"o":["Reduce the cost of the pavement","Drain rainwater quickly off the road surface","Increase the stopping sight distance","Counteract centrifugal force on horizontal curves"],"q":"<p>The main purpose of providing camber on a road surface is to:<\/p>","a":1,"s":"<p>Camber is the cross slope from the crown to the edges, so that surface water runs off quickly and does not soak into the pavement and subgrade.<br>Other options: A — camber is for drainage, not for saving money; C — camber has no effect on sight distance; D — that is the job of superelevation<\/p>","tag":""},{"id":"6.2.2","m":1,"o":["Cement concrete roads","High-type bituminous roads","Earth roads","Water bound macadam roads"],"q":"<p>As per IRC recommendations, the steepest camber among the following road surfaces is required for:<\/p>","a":2,"s":"<p>IRC values: cement concrete and high-type bituminous 1.7–2.0%, thin bituminous 2.0–2.5%, WBM/gravel 2.5–3.0%, earth 3.0–4.0%. Earth surfaces soak up water, so they need the steepest camber.<br>Other options: A — these need the flattest camber (1.7–2.0%); B — 1.7–2.0% is enough for this smooth, waterproof surface; D — 2.5–3.0%, less than for earth roads<\/p>","tag":""},{"id":"6.2.3","m":1,"o":["No camber at all, with longitudinal slope only","Straight-line (two-plane) camber","Inverted camber sloping towards the centre","Parabolic (elliptical) camber"],"q":"<p>For fast-moving vehicles on bituminous roads, the camber profile generally preferred is:<\/p>","a":3,"s":"<p>A parabolic profile is flat near the crown and steeper at the edges, which is comfortable for fast vehicles and lets them cross the crown easily.<br>Other options: A — the surface would not drain sideways; B — this is used on rigid (cement concrete) pavements; C — this is used only in some special drainage cases, e.g. paved courtyards<\/p>","tag":""},{"id":"6.2.4","m":1,"o":["2.50 cm","4.375 cm","8.75 cm","17.50 cm"],"q":"<p>A two-lane road has a carriageway width of 7.0 m with a straight-line camber of 1 in 40 (2.5%). The height of the crown above the edges is:<\/p>","a":2,"s":"<p>Rise = (W/2) × camber = 3.5 × 0.025 = 0.0875 m = 8.75 cm.<br>Other options: A — this just writes the camber percentage as centimetres; B — this uses a quarter of the width; D — this uses the full width instead of half<\/p>","tag":""},{"id":"6.2.5","m":1,"o":["3.75 m","5.5 m","7.0 m","10.5 m"],"q":"<p>As per IRC, the standard carriageway width of a two-lane road without raised kerbs is:<\/p>","a":2,"s":"<p>IRC: single lane 3.75 m, intermediate lane 5.5 m, two lanes (no raised kerbs) 7.0 m.<br>Other options: A — this is a single-lane carriageway; B — this is an intermediate carriageway; D — this is roughly three lanes<\/p>","tag":""},{"id":"6.2.6","m":1,"o":["55.6 m","72.0 m","116.5 m","127.6 m"],"q":"<p>Calculate the stopping sight distance on a level road for a design speed of 80 km/h, taking reaction time = 2.5 s and longitudinal friction coefficient f = 0.35.<\/p>","a":3,"s":"<p>SSD = 0.278Vt + V²/(254f) = 0.278×80×2.5 + 80²/(254×0.35) = 55.6 + 72.0 = 127.6 m.<br>Other options: A — this is the lag distance only; B — this is the braking distance only; C — this uses a reaction time of 2.0 s<\/p>","tag":""},{"id":"6.2.7","m":1,"o":["45.2 m","86.8 m","91.4 m","97.2 m"],"q":"<p>Find the SSD for a vehicle moving at 65 km/h down a 4% descending gradient. Take reaction time 2.5 s and f = 0.36.<\/p>","a":3,"s":"<p>On a downgrade, braking distance = V²/[254(f − 0.01n)] = 65²/[254(0.36 − 0.04)] = 52.0 m; lag = 0.278×65×2.5 = 45.2 m; SSD = 97.2 m.<br>Other options: A — this is the lag distance only; B — this uses (f + 0.04), which is for an ascending gradient; C — this ignores the gradient<\/p>","tag":""},{"id":"6.2.8","m":1,"o":["1.0 s","2.0 s","2.5 s","5.0 s"],"q":"<p>In calculating the stopping sight distance, IRC assumes a total reaction (PIEV) time of:<\/p>","a":2,"s":"<p>IRC takes 2.5 s for perception–intellection–emotion–volition (reaction) in SSD calculations.<br>Other options: A — too short for design; B — 2 s is the driver&#x27;s reaction time used for d1 in the overtaking sight distance; D — too long; IRC uses 2.5 s<\/p>","tag":""},{"id":"6.2.9","m":1,"o":["Equal to the stopping sight distance","Twice the stopping sight distance","Half the overtaking sight distance","Equal to the overtaking sight distance"],"q":"<p>Intermediate sight distance (ISD), used where full OSD cannot be provided, is generally taken as:<\/p>","a":1,"s":"<p>ISD = 2 × SSD, which lets two vehicles coming towards each other on the same lane both stop.<br>Other options: A — this is the minimum, not ISD; C — this is not how ISD is defined; D — ISD is used precisely because full OSD cannot be given<\/p>","tag":""},{"id":"6.2.10","m":1,"o":["252 m","359 m","477 m","955 m"],"q":"<p>Find the overtaking sight distance on a two-way road for a design speed of 80 km/h. Overtaken vehicle speed = 64 km/h, driver reaction time = 2 s, acceleration of the overtaking vehicle = 0.72 m/s². (Use s = 0.7vb + 6, T = √(4s/a), OSD = d1 + d2 + d3 with speeds in m/s.)<\/p>","a":2,"s":"<p>vb = 17.78 m/s, s = 18.44 m, T = √(4×18.44/0.72) = 10.12 s; d1 = 17.78×2 = 35.6 m; d2 = vbT + 2s = 216.8 m; d3 = vT = 22.22×10.12 = 224.9 m; OSD = 477 m.<br>Other options: A — this is d1 + d2 only, which would be correct for a one-way road; B — this uses T = √(2s/a) instead of √(4s/a); D — this doubles the OSD<\/p>","tag":""},{"id":"6.2.11","m":1,"o":["3 times the OSD","2 times the OSD","10 times the OSD","Equal to the OSD"],"q":"<p>As per IRC, the minimum length of an overtaking zone should be:<\/p>","a":0,"s":"<p>IRC: the minimum length of an overtaking zone is 3 × OSD; 5 × OSD is desirable.<br>Other options: B — less than the IRC minimum; C — much more than required; desirable is 5 × OSD; D — too short to let drivers overtake safely<\/p>","tag":""},{"id":"6.2.12","m":1,"o":["0.052","0.070","0.114","0.202"],"q":"<p>A horizontal curve of radius 250 m on a plain-terrain highway has a design speed of 80 km/h. Following IRC practice (design for 75% of speed with no friction, maximum e = 0.07, f = 0.15), the superelevation to be provided is:<\/p>","a":1,"s":"<p>e = V²/(225R) = 6400/(225×250) = 0.114 &gt; 0.07, so provide 0.07. Check: f needed = V²/(127R) − 0.07 = 0.202 − 0.07 = 0.132 &lt; 0.15, so it is safe.<br>Other options: A — this takes the full friction of 0.15 and gives the rest to e; IRC does not do it this way; C — this is the calculated value before limiting it to the maximum; D — this is V²/(127R), the total e + f needed<\/p>","tag":""},{"id":"6.2.13","m":1,"o":["358 m","525 m","984 m","1125 m"],"q":"<p>Find the ruling minimum radius of a horizontal curve for a design speed of 100 km/h, with e = 0.07 and f = 0.15.<\/p>","a":0,"s":"<p>R = V²/[127(e + f)] = 10000/(127 × 0.22) = 358 m.<br>Other options: B — this ignores superelevation (f only); C — this subtracts e from f; D — this ignores friction (e only)<\/p>","tag":""},{"id":"6.2.14","m":1,"o":["4 %","7 %","10 %","15 %"],"q":"<p>As per IRC, the maximum superelevation for roads in plain and rolling terrain, and for snow-bound hill roads, is:<\/p>","a":1,"s":"<p>IRC limits e to 7% in plain/rolling and snow-bound hill areas, and to 10% on hill roads not bound by snow.<br>Other options: A — 4% is recommended for urban roads with frequent intersections; C — 10% is for hill roads not bound by snow; D — 15% is the lateral friction coefficient, not a superelevation limit<\/p>","tag":""},{"id":"6.2.15","m":1,"o":["e = v²/(gR)","e = v²/(2gR)","e = v/(gR)","e = gR/v²"],"q":"<p>If the superelevation alone is to balance the centrifugal force (no lateral friction), the required superelevation e for speed v (m/s) on radius R is:<\/p>","a":0,"s":"<p>Equilibrium: e + f = v²/(gR); with f = 0, e = v²/(gR) (= V²/(127R) with V in km/h).<br>Other options: B — the factor 2 is wrong (2g comes from the energy formula); C — v must be squared; D — this is upside down<\/p>","tag":""},{"id":"6.2.16","m":1,"o":["Skid and overturn at the same speed","Neither skid nor overturn at any speed","Overturn first, since the overturning limit is lower","Skid first, since the skid limit (0.15) is below the overturning limit (0.60)"],"q":"<p>A vehicle has a wheel track of 1.8 m and a centre of gravity 1.5 m above the road. It goes round an unbanked curve where the lateral friction coefficient is 0.15. As the speed is raised, the vehicle will:<\/p>","a":3,"s":"<p>Overturning starts when v²/(gR) = b/(2h) = 1.8/(2×1.5) = 0.60; skidding starts when v²/(gR) = f = 0.15. Since 0.15 &lt; 0.60, the vehicle skids first.<br>Other options: A — this would need f = b/(2h); B — every vehicle has a limiting speed; C — the overturning limit (0.60) is the higher one<\/p>","tag":""},{"id":"6.2.17","m":1,"o":["0.24 m","0.52 m","0.64 m","0.76 m"],"q":"<p>Find the total extra widening on a two-lane road curve of radius 150 m. Wheel base l = 6 m, design speed 60 km/h. Use We = nl²/(2R) + V/(9.5√R).<\/p>","a":3,"s":"<p>Mechanical = 2×36/(2×150) = 0.24 m; psychological = 60/(9.5×√150) = 0.52 m; total = 0.76 m.<br>Other options: A — this is the mechanical widening only; B — this is the psychological widening only; C — this takes n = 1 in the mechanical term<\/p>","tag":""},{"id":"6.2.18","m":1,"o":["45.9 m","61.2 m","71.1 m","142.2 m"],"q":"<p>Find the length of transition curve for a design speed of 80 km/h on a curve of radius 300 m, from the rate of change of centrifugal acceleration. Use C = 80/(75 + V) m/s³ and Ls = 0.0215V³/(CR).<\/p>","a":2,"s":"<p>C = 80/155 = 0.516 m/s³ (within 0.5–0.8); Ls = 0.0215×80³/(0.516×300) = 71.1 m.<br>Other options: A — this uses the upper limit C = 0.8; B — this assumes C = 0.6; D — this doubles the length<\/p>","tag":""},{"id":"6.2.19","m":1,"o":["0.25 m","0.50 m","1.50 m","2.00 m"],"q":"<p>A transition curve of length 60 m joins a circular curve of radius 300 m. The shift of the circular curve is:<\/p>","a":1,"s":"<p>Shift S = L²/(24R) = 3600/(24×300) = 0.50 m.<br>Other options: A — this uses 48R; C — L²/(8R) is a mid-ordinate type formula; D — L²/(6R) is the offset at the end of the transition, not the shift<\/p>","tag":""},{"id":"6.2.20","m":1,"o":["Spiral (clothoid)","Cubic parabola","Lemniscate","Simple circular arc"],"q":"<p>The ideal shape of a transition curve, recommended by IRC because its radius falls in direct proportion to its length, is the:<\/p>","a":0,"s":"<p>In a spiral, L × R = constant, so centrifugal acceleration builds up at a steady rate; IRC recommends it.<br>Other options: B — the cubic parabola is a simpler approximation used mainly on railways; C — the lemniscate only nearly meets the L·R = constant condition; D — a circular arc has constant radius, so it cannot act as a transition<\/p>","tag":""},{"id":"6.2.21","m":1,"o":["168.8 m","184.1 m","272.0 m","368.2 m"],"q":"<p>A summit curve joins an ascending gradient of +3% and a descending gradient of −2%. The SSD is 180 m. Assuming L &gt; SSD and the IRC heights (eye 1.2 m, object 0.15 m), the length of the summit curve is:<\/p>","a":3,"s":"<p>N = 0.03 + 0.02 = 0.05; L = NS²/4.4 = 0.05×180²/4.4 = 368.2 m (&gt; 180 m, so the assumption holds).<br>Other options: A — 9.6 is used for OSD (both heights 1.2 m); B — this uses 8.8 in place of 4.4; C — this uses the L &lt; S formula, 2S − 4.4/N<\/p>","tag":""},{"id":"6.2.22","m":1,"o":["121.9 m","139.4 m","147.3 m","432.0 m"],"q":"<p>A valley curve has a deviation angle N = 0.08 and the headlight sight distance required is 90 m. Assuming L &gt; S (headlight 0.75 m high, 1° upward beam), the length of the valley curve is:<\/p>","a":1,"s":"<p>L = NS²/(1.5 + 0.035S) = 0.08×90²/(1.5 + 3.15) = 139.4 m (&gt; 90 m, so the assumption holds).<br>Other options: A — this uses the L &lt; S formula; C — this uses the summit-curve formula; D — this drops the 0.035S term<\/p>","tag":""},{"id":"6.2.23","m":1,"o":["30.6 m","61.1 m","122.2 m","417.4 m"],"q":"<p>For comfort, find the total length of a valley curve with deviation angle N = 0.07 and design speed 72 km/h, taking the allowable rate of change of centrifugal acceleration C = 0.6 m/s³. Use L = 2√(Nv³/C).<\/p>","a":1,"s":"<p>v = 20 m/s; one transition = √(0.07×8000/0.6) = 30.55 m; total L = 2 × 30.55 = 61.1 m.<br>Other options: A — this is one transition only; C — this takes four transitions; D — this puts V in km/h instead of m/s<\/p>","tag":""},{"id":"6.2.24","m":1,"o":["Headlight sight distance at night and rider comfort","Overtaking sight distance only","Stopping sight distance in daylight with eye 1.2 m and object 0.15 m","Drainage requirements only"],"q":"<p>Valley curves are designed mainly for:<\/p>","a":0,"s":"<p>On a valley curve, daytime visibility is no problem. The governing needs are headlight sight distance at night and limiting the rate of change of centrifugal acceleration.<br>Other options: B — OSD is a summit-curve concern; C — this is the summit-curve criterion; D — drainage is checked, but it is not the design basis<\/p>","tag":""},{"id":"6.2.25","m":1,"o":["1 in 30 (3.3 %)","1 in 20 (5 %)","1 in 50 (2 %)","1 in 15 (6.7 %)"],"q":"<p>As per IRC, the ruling gradient for highways in plain and rolling terrain is:<\/p>","a":0,"s":"<p>IRC ruling gradients: plain/rolling 3.3% (1 in 30), mountainous 5% (1 in 20), steep terrain 6% (1 in 16.7).<br>Other options: B — this is the ruling gradient for mountainous terrain; C — this is flatter than needed; D — this is about the exceptional gradient for plain/rolling terrain<\/p>","tag":""},{"id":"6.2.26","m":1,"o":["3.50 %","3.75 %","4.00 %","5.00 %"],"q":"<p>A hill road has a ruling gradient of 5%. Following IRC, find the compensated gradient on a horizontal curve of radius 60 m. (Grade compensation = (30 + R)/R %, max 75/R %; compensated grade need not be less than 4%.)<\/p>","a":2,"s":"<p>(30 + 60)/60 = 1.50%, but the limit is 75/60 = 1.25%, so compensation = 1.25%. 5 − 1.25 = 3.75% is below 4%, and the grade need not be less than 4%, so use 4.00%.<br>Other options: A — this uses 1.5% and ignores the 75/R limit; B — this forgets the rule that the compensated grade need not be below 4%; D — this applies no compensation<\/p>","tag":""},{"id":"6.2.27","m":1,"o":["1 in 20 (5 %)","1 in 15 (6.7 %)","1 in 40 (2.5 %)","1 in 200 (0.5 %)"],"q":"<p>As per IRC hill-road practice (IRC:52), the gradient at a hairpin bend should not be steeper than:<\/p>","a":2,"s":"<p>IRC:52 limits the gradient at hairpin bends to between 1 in 40 (max) and 1 in 200 (min).<br>Other options: A — this is the ruling gradient for mountainous terrain, too steep at a hairpin; B — too steep at a hairpin; D — this is the minimum gradient at a hairpin (for drainage)<\/p>","tag":""},{"id":"6.2.28","m":1,"o":["5 m","14 m","30 m","60 m"],"q":"<p>As per IRC:52, the minimum radius of the inner curve at a hairpin bend is:<\/p>","a":1,"s":"<p>IRC:52 gives 14 m as the minimum radius of the inner curve at hairpin bends (design speed 20 km/h).<br>Other options: A — too small even for single units; C — more than the minimum; D — this is a normal curve radius in hills, not a hairpin<\/p>","tag":""},{"id":"6.2.29","m":1,"o":["2.0 m","4.0 m","8.0 m","16.0 m"],"q":"<p>On a single-lane road, a horizontal curve of radius 200 m must give an SSD of 80 m (curve longer than SSD, line of sight measured along the centre line). The set-back distance from the centre line is approximately:<\/p>","a":1,"s":"<p>m ≈ S²/(8R) = 80²/(8×200) = 4.0 m (exact R[1 − cos(S/2R)] = 3.99 m).<br>Other options: A — this uses 16R in the denominator; C — this uses 4R in the denominator; D — this uses 2R in the denominator<\/p>","tag":""},{"id":"6.2.30","m":1,"o":["Carriageway, shoulders, side drains and land kept for future widening","Carriageway and median only","Carriageway only","Carriageway and shoulders"],"q":"<p>The formation width (roadway width) of a highway is the sum of the widths of:<\/p>","a":3,"s":"<p>Formation width = carriageway + shoulders on both sides (the top width of the embankment, or the bottom width of the cutting, not counting side drains).<br>Other options: A — this is the right of way (land width); B — this leaves out the shoulders; C — this leaves out the shoulders<\/p>","tag":""}]},{"k":"6.3","t":"Highway Drainage and Highway Materials","qs":[{"id":"6.3.1","m":1,"o":["Surface drainage","Subsurface drainage","Cross drainage","Capillary cut-off"],"q":"<p>Removing rainwater that falls on the road surface and on the land next to it, by camber, side drains and so on, is called:<\/p>","a":0,"s":"<p>Surface drainage collects and carries away rainwater from the pavement, shoulders and nearby land.<br>Other options: B — this lowers the water table and keeps seepage away from the subgrade; C — this lets streams and drains pass under the road; D — this stops water rising into the subgrade from below<\/p>","tag":""},{"id":"6.3.2","m":1,"o":["0.1 to 0.2 m","0.3 to 0.5 m","1.0 to 1.2 m","3 to 5 m"],"q":"<p>To keep the subgrade from being softened by ground water, the highest level of the water table should be kept below the subgrade by at least about:<\/p>","a":2,"s":"<p>Standard practice (Khanna &amp; Justo, following IRC) keeps the water table at least 1.0–1.2 m below the subgrade, using longitudinal subsurface drains where needed.<br>Other options: A — too small; capillary water would still reach the subgrade; B — not enough to keep capillary moisture out; D — more than is normally needed<\/p>","tag":""},{"id":"6.3.3","m":1,"o":["Increase the camber of the road","Drain rainwater off the pavement surface","Intercept seepage flowing down the hill slope above the road","Stop capillary water rising from the water table into the subgrade"],"q":"<p>A capillary cut-off is provided in a road embankment in order to:<\/p>","a":3,"s":"<p>A layer of coarse granular material (or bitumen/impermeable sheet) is placed between the water table and the subgrade to break capillary rise.<br>Other options: A — camber is a surface property; B — this is done by camber and side drains; C — this is the job of a catch-water drain or longitudinal drain<\/p>","tag":""},{"id":"6.3.4","m":1,"o":["On the hill slope above the cut, to catch runoff before it reaches the road","Along the valley-side edge of the road","Across the road surface as a shallow dip","Under the pavement to lower the water table"],"q":"<p>On a hill road, a catch-water drain is provided:<\/p>","a":0,"s":"<p>Catch-water drains run roughly along the contour above the road, taking hill-side runoff to the nearest cross drain so that it does not flow over the cut slope and road.<br>Other options: B — side drains in hills are on the hill side, and the valley edge has the parapet; C — this describes a causeway or dip crossing; D — this is a subsurface drain<\/p>","tag":""},{"id":"6.3.5","m":1,"o":["Minor bridge","Aqueduct","Major bridge","Culvert"],"q":"<p>As per IRC, a cross-drainage structure whose total linear waterway (between the inner faces of the end supports) does not exceed 6 m is classified as a:<\/p>","a":3,"s":"<p>IRC: up to 6 m linear waterway is a culvert; above that it is a bridge (minor up to 60 m total length).<br>Other options: A — minor bridges are more than 6 m; B — an aqueduct carries a canal over a drain or road; C — major bridges are longer than 60 m<\/p>","tag":""},{"id":"6.3.6","m":1,"o":["Viaduct","Pipe culvert","Causeway (Irish crossing)","Box culvert"],"q":"<p>A road structure built so that floodwater can pass over the road during floods, used where a stream is dry or shallow for most of the year, is a:<\/p>","a":2,"s":"<p>A causeway is a submersible crossing; traffic stops briefly during high floods.<br>Other options: A — a viaduct is a long elevated bridge over a valley or road; B — flow passes through pipes under the road; D — a culvert carries the flow under the road<\/p>","tag":""},{"id":"6.3.7","m":1,"o":["0.12 m³/s","1.20 m³/s","12.0 m³/s","120 m³/s"],"q":"<p>Using the rational formula, find the peak runoff from a catchment of 12 hectares with runoff coefficient 0.6 and rainfall intensity 60 mm/h. (Q = CIA/360, Q in m³/s, I in mm/h, A in ha.)<\/p>","a":1,"s":"<p>Q = 0.6×60×12/360 = 1.20 m³/s.<br>Other options: A — this slips a factor of 10 in the units; C — this uses 36 in place of 360; D — this treats A as km² (Q = CIA/3.6)<\/p>","tag":""},{"id":"6.3.8","m":1,"o":["0.123 m³/s","0.221 m³/s","0.388 m³/s","0.552 m³/s"],"q":"<p>A rectangular lined side drain is 0.6 m wide and 0.4 m deep, flowing full, with Manning&#x27;s n = 0.015 and bed slope 1 in 500. Its discharge capacity is about:<\/p>","a":1,"s":"<p>A = 0.24 m², P = 1.4 m, R = 0.1714 m; v = (1/n)R^(2/3)S^(1/2) = 0.920 m/s; Q = vA = 0.221 m³/s.<br>Other options: A — this uses R instead of R^(2/3); C — this takes R = depth (0.4 m); D — this multiplies v by the width instead of the area<\/p>","tag":""},{"id":"6.3.9","m":1,"o":["D15 of filter ≤ 5 × D85 of the protected soil","D15 of filter ≥ 5 × D85 of the protected soil","D85 of filter ≤ D15 of the protected soil","D50 of filter = D50 of the protected soil"],"q":"<p>For a granular filter around a subsurface drain, Terzaghi&#x27;s piping (retention) criterion requires that:<\/p>","a":0,"s":"<p>D15(filter)/D85(soil) ≤ 5 stops the soil being washed into the filter. The separate permeability criterion is D15(filter)/D15(soil) ≥ 5.<br>Other options: B — this would let the soil wash into the filter; C — this would make the filter finer than the soil, so it would clog; D — equal grading gives no drainage advantage<\/p>","tag":""},{"id":"6.3.10","m":1,"o":["On both sides","On the valley side only","On the hill side of the road only","Along the centre line of the road"],"q":"<p>On hill roads, the longitudinal side drain is normally provided:<\/p>","a":2,"s":"<p>In hill roads the whole road slopes towards the hill side (or the hill side catches the runoff), so one side drain on the inner (hill) side is provided, with cross drains at intervals.<br>Other options: A — a valley-side drain is not needed and would make the fill unstable; B — water would run down the valley-side fill and erode it; D — a drain is never placed in the carriageway<\/p>","tag":""},{"id":"6.3.11","m":1,"o":["4.0 %","5.8 %","6.0 %","8.8 %"],"q":"<p>In a CBR test on a soaked subgrade sample, the loads at 2.5 mm and 5.0 mm penetration were 82 kg and 120 kg. Taking standard loads of 1370 kg and 2055 kg, the CBR of the soil is:<\/p>","a":2,"s":"<p>CBR(2.5) = 82/1370 = 5.99%; CBR(5.0) = 120/2055 = 5.84%. The 2.5 mm value is higher, so CBR = 6.0%.<br>Other options: A — this divides the 2.5 mm load by the 5.0 mm standard load; B — this is the 5.0 mm value, which is the lower one here; D — this divides the 5.0 mm load by the 2.5 mm standard load<\/p>","tag":""},{"id":"6.3.12","m":1,"o":["1000 kg and 1500 kg","2055 kg and 1370 kg","685 kg and 1370 kg","1370 kg and 2055 kg"],"q":"<p>In the CBR test, the standard loads used to calculate CBR at 2.5 mm and 5.0 mm penetration are:<\/p>","a":3,"s":"<p>These are the loads that crushed-stone standard material carries at 2.5 mm and 5.0 mm penetration (on a 50 mm diameter plunger).<br>Other options: A — these are not the standard values; B — these are reversed; C — these are wrong values<\/p>","tag":""},{"id":"6.3.13","m":1,"o":["The value at 5.0 mm penetration","The average of the two values","The smaller of the two values","The value at 2.5 mm penetration"],"q":"<p>In a CBR test, the CBR at 5.0 mm penetration again comes out higher than at 2.5 mm when the test is repeated. The CBR value reported is:<\/p>","a":0,"s":"<p>Normally the 2.5 mm value is reported; if the 5.0 mm value is higher even on repeating the test, the 5.0 mm value is adopted.<br>Other options: B — averaging is not the standard rule; C — the code takes the 5.0 mm value here; D — this would understate the strength in this case<\/p>","tag":""},{"id":"6.3.14","m":1,"o":["0.075 kg/cm³","2.4 kg/cm³","4.8 kg/cm³","48 kg/cm³"],"q":"<p>In a plate load test with a 75 cm diameter plate, the pressure for a settlement of 0.125 cm is 0.6 kg/cm². The modulus of subgrade reaction k is:<\/p>","a":2,"s":"<p>k = p/δ = 0.6/0.125 = 4.8 kg/cm³.<br>Other options: A — this multiplies instead of divides; B — this uses a settlement of 0.25 cm; D — this takes the settlement as 0.125 mm<\/p>","tag":""},{"id":"6.3.15","m":1,"o":["2.4 kg/cm³","6.0 kg/cm³","15.0 kg/cm³","37.5 kg/cm³"],"q":"<p>A plate load test with a 30 cm diameter plate gives k = 15 kg/cm³. Using the approximate relation k1·a1 = k2·a2, the k value for the standard 75 cm plate is:<\/p>","a":1,"s":"<p>k75 = 15 × 30/75 = 6.0 kg/cm³. A bigger plate stresses a deeper zone, so k is smaller.<br>Other options: A — this uses the square of the diameter ratio; C — this ignores the size correction; D — this uses the ratio the wrong way round<\/p>","tag":""},{"id":"6.3.16","m":1,"o":["2.1 %","21.0 %","26.6 %","79.0 %"],"q":"<p>In an aggregate crushing test, 3000 g of aggregate was tested and 630 g passed the 2.36 mm sieve after loading. The aggregate crushing value is:<\/p>","a":1,"s":"<p>ACV = 630/3000 × 100 = 21.0%.<br>Other options: A — this slips a decimal place; C — this divides by the retained mass; D — this is the retained fraction<\/p>","tag":""},{"id":"6.3.17","m":1,"o":["305 mm","380 mm","450 mm","1000 mm"],"q":"<p>In the aggregate impact test, a hammer weighing 13.5–14.0 kg is dropped 15 times on the sample from a height of:<\/p>","a":1,"s":"<p>Standard aggregate impact test: 15 blows of a 13.5–14 kg hammer falling 380 mm; the fines passing 2.36 mm are expressed as the impact value.<br>Other options: A — 305 mm is close to the standard Proctor drop of 310 mm; C — 450 mm is the modified Proctor drop; D — far too high<\/p>","tag":""},{"id":"6.3.18","m":1,"o":["15 revolutions","100 revolutions","500 revolutions","1000 revolutions"],"q":"<p>In the Los Angeles abrasion test on gradings A to D, the drum holding the aggregate and the steel-ball abrasive charge is rotated for:<\/p>","a":2,"s":"<p>Gradings A–D: 500 revolutions at 30–33 rpm; the material passing the 1.70 mm sieve is the abrasion value.<br>Other options: A — 15 is the number of blows in the impact test; B — too few; D — 1000 revolutions are used for the coarser gradings E–G<\/p>","tag":""},{"id":"6.3.19","m":1,"o":["Less than 0.6 times its mean dimension","Less than 0.5 times its greatest dimension","More than 1.8 times its mean dimension","Equal to its mean dimension"],"q":"<p>An aggregate particle is called &#x27;flaky&#x27; when its least dimension is:<\/p>","a":0,"s":"<p>Flaky: thickness &lt; 0.6 × mean size. Elongated: length &gt; 1.8 × mean size.<br>Other options: B — this is not the IS definition; C — this is the elongation criterion, and it concerns length; D — this describes a roughly cubical particle<\/p>","tag":""},{"id":"6.3.20","m":1,"o":["Its softening point lies between 80 and 100 °C","Its viscosity lies between 80 and 100 poise","Its ductility lies between 80 and 100 cm","Its penetration at 25 °C (100 g, 5 s) is 80–100 tenths of a mm"],"q":"<p>A paving bitumen of penetration grade 80/100 means that:<\/p>","a":3,"s":"<p>Penetration is measured in units of 0.1 mm with a 100 g needle for 5 s at 25 °C; 80/100 is a fairly soft grade.<br>Other options: A — softening points of paving bitumens are much lower; B — grade names using viscosity are VG grades; C — ductility is not used to name the grade<\/p>","tag":""},{"id":"6.3.21","m":1,"o":["5 mm/min","10 mm/min","50 mm/min","500 mm/min"],"q":"<p>The bitumen ductility test is carried out at 27 °C with the briquette pulled apart at a rate of:<\/p>","a":2,"s":"<p>Ductility = the distance (cm) the standard briquette (1 cm² cross-section) stretches before breaking, pulled at 50 mm/min at 27 °C.<br>Other options: A — too slow; B — not the standard rate; D — too fast<\/p>","tag":""},{"id":"6.3.22","m":1,"o":["Ring and ball apparatus","Tar viscometer","Dean and Stark apparatus","Pensky–Martens closed tester"],"q":"<p>The softening point of bitumen is determined using the:<\/p>","a":0,"s":"<p>A steel ball rests on bitumen in a brass ring and the bath is heated at 5 °C/min; the softening point is the temperature at which the bitumen sags 25 mm and touches the base plate.<br>Other options: B — this measures viscosity (time of flow through an orifice); C — this measures water content; D — this is for flash and fire points<\/p>","tag":""},{"id":"6.3.23","m":1,"o":["Equal to its softening point","Always lower than its flash point","Equal to its flash point","Always higher than its flash point"],"q":"<p>For a given bitumen, the fire point is:<\/p>","a":3,"s":"<p>Flash point: the vapours flash briefly. Fire point: the material keeps burning for at least 5 s. This needs a higher temperature.<br>Other options: A — these are unrelated properties; B — it is the other way round; C — the fire point is a few degrees higher<\/p>","tag":""},{"id":"6.3.24","m":1,"o":["Penetration at 25 °C","Kinematic viscosity at 135 °C","Softening point","Absolute viscosity at 60 °C"],"q":"<p>Viscosity grade (VG-10, VG-30, VG-40) paving bitumens are classified on the basis of:<\/p>","a":3,"s":"<p>VG grading uses absolute viscosity (poise) at 60 °C, about the highest pavement service temperature; kinematic viscosity at 135 °C is a further requirement.<br>Other options: A — penetration was the basis of the older penetration grades; B — this is specified but is not the basis of the grade; C — this is a supporting test<\/p>","tag":""},{"id":"6.3.25","m":1,"o":["Can be applied cold and used on damp surfaces or in wet weather","Gives the stiffest binder for heavy-traffic wearing courses","Must be heated to about 180 °C before use","Contains no water"],"q":"<p>The main advantage of using bitumen emulsion is that it:<\/p>","a":0,"s":"<p>An emulsion is bitumen dispersed in water with an emulsifier; it needs no heating and works on damp aggregate, which makes it useful for patching and for tack coats.<br>Other options: B — emulsions are used mainly for surface treatments and patching; C — emulsions are used cold; D — an emulsion is mostly bitumen dispersed in water<\/p>","tag":""},{"id":"6.3.26","m":1,"o":["Petrol (gasoline or naphtha)","Kerosene","Water and an emulsifier","Heavy diesel or other low-volatility oil"],"q":"<p>A rapid-curing (RC) cutback bitumen is prepared by blending bitumen with:<\/p>","a":0,"s":"<p>RC uses a volatile solvent such as petrol or naphtha; MC uses kerosene; SC uses low-volatility oils.<br>Other options: B — kerosene gives medium-curing cutback; C — this gives an emulsion, not a cutback; D — this gives slow-curing cutback<\/p>","tag":""},{"id":"6.3.27","m":1,"o":["100 mm diameter × 200 mm high, tested at 25 °C","101.6 mm diameter × 63.5 mm high, tested at 60 °C","150 mm cubes, tested at 27 °C","101.6 mm diameter × 63.5 mm high, tested at 25 °C"],"q":"<p>In the Marshall method of bituminous mix design, the standard specimen and test temperature are:<\/p>","a":1,"s":"<p>Marshall specimens are 101.6 mm (4 in) diameter and 63.5 mm (2.5 in) high, compacted by blows on each face and loaded at 50.8 mm/min at 60 °C.<br>Other options: A — this is a cylinder for a different test; C — these are concrete-cube dimensions; D — the size is right but the test temperature is 60 °C<\/p>","tag":""},{"id":"6.3.28","m":1,"o":["4.08 %","4.26 %","10.0 %","95.92 %"],"q":"<p>A compacted Marshall specimen has bulk specific gravity Gmb = 2.35 and the mix has theoretical maximum specific gravity Gmm = 2.45. The air voids Va is:<\/p>","a":0,"s":"<p>Va = (1 − Gmb/Gmm) × 100 = (1 − 2.35/2.45) × 100 = 4.08%.<br>Other options: B — this divides by Gmb instead of Gmm; C — this just subtracts the two specific gravities; D — this is the percentage of solids, not voids<\/p>","tag":""},{"id":"6.3.29","m":1,"o":["4.08 %","11.32 %","15.75 %","74.1 %"],"q":"<p>For a bituminous mix with Gmb = 2.35, bulk specific gravity of the aggregate Gsb = 2.65 and bitumen content 5% by weight of total mix, the voids in mineral aggregate (VMA) is:<\/p>","a":2,"s":"<p>VMA = 100 − Gmb·Ps/Gsb = 100 − 2.35×95/2.65 = 15.75%.<br>Other options: A — this is the air voids (with Gmm = 2.45), not the VMA; B — this ignores the aggregate fraction Ps; D — this is the VFB, the voids filled with bitumen<\/p>","tag":""},{"id":"6.3.30","m":1,"o":["2","4","6","10"],"q":"<p>A subgrade soil has 55% passing the 75 µm sieve, liquid limit 40% and plasticity index 15%. Its group index GI = 0.2a + 0.005ac + 0.01bd is:<\/p>","a":2,"s":"<p>a = 55−35 = 20, b = 55−15 = 40, c = 40−40 = 0, d = 15−10 = 5; GI = 0.2×20 + 0 + 0.01×40×5 = 6.<br>Other options: A — this includes only the 0.01bd term; B — this includes only the 0.2a term; D — this takes d = PI instead of PI − 10<\/p>","tag":""}]},{"k":"6.4","t":"Traffic Studies, Control Devices and Intersections","qs":[{"id":"6.4.1","m":1,"o":["Count only private cars and ignore other vehicles","Rate the riding quality of a pavement","Measure the parking demand of a city centre","Express mixed traffic as an equivalent number of passenger cars"],"q":"<p>The passenger car unit (PCU) is used in traffic engineering to:<\/p>","a":3,"s":"<p>Vehicles differ in size and speed, so each type is given a PCU factor to turn a mixed stream into one common unit for capacity and design.<br>Other options: A — PCU includes all vehicle types through equivalence factors; B — riding quality is measured by roughness; C — PCU is a traffic-flow unit, not a parking measure<\/p>","tag":""},{"id":"6.4.2","m":1,"o":["870 PCU/h","890 PCU/h","1060 PCU/h","1210 PCU/h"],"q":"<p>A one-hour classified count gives 400 cars, 120 buses, 300 two-wheelers and 50 trucks. Using PCU factors car 1.0, bus 3.0, two-wheeler 0.5 and truck 3.0, the flow is:<\/p>","a":2,"s":"<p>PCU = 400×1 + 120×3 + 300×0.5 + 50×3 = 400 + 360 + 150 + 150 = 1060 PCU/h.<br>Other options: A — this is the plain vehicle count; B — this uses 2.0 for buses and trucks; D — this counts two-wheelers as 1.0<\/p>","tag":""},{"id":"6.4.3","m":1,"o":["1.25 veh/h","90 veh/h","2000 veh/h","4000 veh/h"],"q":"<p>On a road section, the traffic density is 40 vehicles/km and the space-mean speed is 50 km/h. The flow is:<\/p>","a":2,"s":"<p>q = k·v = 40 × 50 = 2000 veh/h.<br>Other options: A — this divides speed by density; B — this adds the two numbers; D — this doubles the product<\/p>","tag":""},{"id":"6.4.4","m":1,"o":["1200 veh/h","2400 veh/h","4800 veh/h","9600 veh/h"],"q":"<p>A road follows Greenshields&#x27; linear speed–density model with free-flow speed 80 km/h and jam density 120 veh/km. Its maximum flow (capacity) is:<\/p>","a":1,"s":"<p>qmax = vf·kj/4 = 80×120/4 = 2400 veh/h (at k = kj/2 = 60 veh/km and v = vf/2 = 40 km/h).<br>Other options: A — this divides by 8; C — this divides by 2; D — this is vf × kj, which is never reached<\/p>","tag":""},{"id":"6.4.5","m":1,"o":["Zero","The free-flow speed","One quarter of the free-flow speed","Half the free-flow speed"],"q":"<p>In Greenshields&#x27; linear speed–density model, at maximum flow the speed of the stream equals:<\/p>","a":3,"s":"<p>q = vf·k(1 − k/kj) is greatest at k = kj/2, where v = vf(1 − 1/2) = vf/2.<br>Other options: A — zero speed happens at jam density, when the flow is zero; B — free-flow speed happens only near zero density, when the flow is almost zero; C — vf/4 is not the speed at capacity<\/p>","tag":""},{"id":"6.4.6","m":1,"o":["55.4 km/h","57.7 km/h","60.0 km/h","62.2 km/h"],"q":"<p>Three vehicles pass a point at spot speeds of 40, 60 and 80 km/h. The space-mean speed is:<\/p>","a":0,"s":"<p>SMS = harmonic mean = 3/(1/40 + 1/60 + 1/80) = 55.4 km/h.<br>Other options: B — this is the geometric mean; C — this is the time-mean speed (arithmetic mean); D — this is the root-mean-square value<\/p>","tag":""},{"id":"6.4.7","m":1,"o":["vt is always less than vs","vt is always equal to or greater than vs","vt and vs are always equal","vt is always exactly twice vs"],"q":"<p>Comparing the time-mean speed (vt) and the space-mean speed (vs) of a traffic stream:<\/p>","a":1,"s":"<p>vt = vs + σs²/vs, so vt ≥ vs; the two are equal only when all vehicles travel at the same speed.<br>Other options: A — the reverse is true; C — they are equal only if there is no spread in speeds; D — there is no fixed ratio<\/p>","tag":""},{"id":"6.4.8","m":1,"o":["50th percentile speed","15th percentile speed","98th percentile speed","85th percentile speed"],"q":"<p>The speed generally adopted for setting the upper speed limit on a road section is the:<\/p>","a":3,"s":"<p>Only about 15% of drivers go faster than the 85th percentile speed, so it is used as the speed limit. The 98th percentile is used for geometric design, and the 15th for the lower limit.<br>Other options: A — the median is too low for a speed limit; B — this is used for the minimum speed limit; C — this is used as the design speed for geometric design<\/p>","tag":""},{"id":"6.4.9","m":1,"o":["Ghat tracer","Tar viscometer","Benkelman beam","Enoscope"],"q":"<p>A mirror box used to measure spot speed by timing vehicles over a short marked base length is the:<\/p>","a":3,"s":"<p>An enoscope (an L-shaped mirror box) lets one observer see vehicles cross both ends of a base length, so the travel time can be recorded.<br>Other options: A — this is used to set out gradients in hills; B — this measures binder viscosity; C — this measures pavement deflection<\/p>","tag":""},{"id":"6.4.10","m":1,"o":["21 veh/h","1200 veh/h","1260 veh/h","2520 veh/h"],"q":"<p>In a moving-observer (floating car) study, the test car met 80 vehicles while travelling against the stream, and (overtaking − overtaken) was 4 while travelling with the stream. Each run took 2 min. The flow in the stream is:<\/p>","a":2,"s":"<p>q = (na + ny)/(ta + tw) = (80 + 4)/(2 + 2) = 21 veh/min = 1260 veh/h.<br>Other options: A — this is the value per minute, wrongly given per hour; B — this leaves out ny; D — this divides by one run time only<\/p>","tag":""},{"id":"6.4.11","m":1,"o":["Find travel desire lines to plan new routes and facilities","Find the physical causes of accidents at a junction","Record the turning volumes at a single intersection","Measure spot speeds at a section"],"q":"<p>The main purpose of an origin–destination (O–D) survey is to:<\/p>","a":0,"s":"<p>O–D data show where trips start and end; drawn as desire lines, they guide the planning of routes, bypasses, bus services and terminals.<br>Other options: B — this is an accident study; C — this is a volume count; D — this is a spot-speed study<\/p>","tag":""},{"id":"6.4.12","m":1,"o":["Home interview method","Moving-observer (floating car) method","Roadside interview method","Licence (number) plate method"],"q":"<p>Which of the following is NOT a method of conducting an O–D survey?<\/p>","a":1,"s":"<p>The moving-observer method measures stream flow and journey speed; it does not record where trips start and end.<br>Other options: A — this is the most complete O–D method; C — this is a common O–D method; D — this is an O–D method (matching plates at survey points)<\/p>","tag":""},{"id":"6.4.13","m":1,"o":["0.25","4.0","20","250"],"q":"<p>A parking lot of 50 bays is studied for a 10-hour period, during which 200 different vehicles parked there. The parking turnover (vehicles per bay over the study period) is:<\/p>"
