7.3.14","m":1,"o":["0.30","0.625","0.78","1.6"],"q":"<p>A filter sand has D10 = 0.30 mm and D60 = 0.48 mm. Its uniformity coefficient is:<\/p>","a":3,"s":"<p>Cu = D60/D10 = 0.48/0.30 = 1.6 (effective size = D10 = 0.30 mm).<br>Other options: A — effective size, not Cu; B — ratio inverted; C — sum of sizes.<\/p>","tag":""},{"id":"7.3.15","m":1,"o":["Negative head in the bed, which releases dissolved air","Too high a back-wash rate","Use of graded coarse gravel layers in the under-drain system below the sand","Low turbidity of the influent"],"q":"<p>Air binding in a rapid sand filter is caused mainly by:<\/p>","a":0,"s":"<p>When the head loss exceeds the depth of water over the sand, the pressure falls below atmospheric and gas bubbles form, blocking pores.<br>Other options: B — causes loss of media, not air binding; C — normal design; D — low turbidity does not release gas.<\/p>","tag":""},{"id":"7.3.16","m":1,"o":["0.4 mg/L","2.1 mg/L","2.9 mg/L","6.25 mg/L"],"q":"<p>Water is dosed with 2.5 mg/L of chlorine and the residual after 30 minutes&#x27; contact is 0.4 mg/L. The chlorine demand of the water is:<\/p>","a":1,"s":"<p>Chlorine demand = applied − residual = 2.5 − 0.4 = 2.1 mg/L.<br>Other options: A — residual, not demand; C — added instead of subtracted; D — ratio of applied to residual.<\/p>","tag":""},{"id":"7.3.17","m":1,"o":["9 kg/day","30 kg/day","100 kg/day","1000 kg/day"],"q":"<p>A plant treating 15 MLD is to be chlorinated at 2 mg/L using bleaching powder with 30% available chlorine. The daily quantity of bleaching powder is:<\/p>","a":2,"s":"<p>Chlorine = 2 × 15 = 30 kg/day; bleaching powder = 30/0.30 = 100 kg/day.<br>Other options: A — multiplied by 0.30 instead of dividing; B — available-chlorine fraction ignored; D — 30% read as 3%.<\/p>","tag":""},{"id":"7.3.18","m":1,"o":["Combined chlorine (chloramines)","Free available chlorine (HOCl and OCl⁻)","Chloride ions only","Chlorine dioxide"],"q":"<p>In breakpoint chlorination, the chlorine residual remaining after the breakpoint is mainly:<\/p>","a":1,"s":"<p>Up to the breakpoint, chlorine forms and then oxidises chloramines; beyond it, added chlorine remains as free residual.<br>Other options: A — these are destroyed between the hump and the breakpoint; C — chloride has no disinfecting power; D — not formed by chlorination.<\/p>","tag":""},{"id":"7.3.19","m":1,"o":["More OCl⁻ is formed at low pH","Stable chloramines, which are stronger than free chlorine, form only at low pH","Bacteria are killed by acidity alone","More of it exists as HOCl, a far stronger disinfectant than OCl⁻"],"q":"<p>Chlorine is a more effective disinfectant at lower pH (around 6–7) because:<\/p>","a":3,"s":"<p>HOCl ⇌ H⁺ + OCl⁻ (pKa ≈ 7.5); low pH shifts the balance to HOCl, which penetrates cell walls easily.<br>Other options: A — OCl⁻ dominates at high pH; B — chloramines need ammonia and are weaker; C — pH 6–7 is not lethal.<\/p>","tag":""},{"id":"7.3.20","m":1,"o":["27.6 min","18.4 min","12.0 min","4.0 min"],"q":"<p>A disinfection process follows Chick&#x27;s law, N/N₀ = e^(−kt), with k = 0.25 min⁻¹. The contact time needed for 99.9% kill is about:<\/p>","a":0,"s":"<p>N/N₀ = 0.001 → t = ln(1000)/k = 6.908/0.25 = 27.6 min.<br>Other options: B — computed for 99% kill; C — log₁₀ used with a base-e rate constant; D — linear kill assumed.<\/p>","tag":""},{"id":"7.3.21","m":1,"o":["Sodium thiosulphate or sulphur dioxide","Alum followed by plain sedimentation and filtration","Lime","Ozone"],"q":"<p>Water heavily dosed with chlorine (super-chlorination) is made palatable before supply by dechlorination using:<\/p>","a":0,"s":"<p>These reduce excess chlorine to chloride.<br>Other options: B — a coagulant; C — used for softening or pH correction; D — another oxidant; it would not remove chlorine.<\/p>","tag":""},{"id":"7.3.22","m":1,"o":["Removes only temporary hardness","Can give near-zero hardness; regenerated with brine","Is regenerated with lime","Is well suited to highly turbid water without any pre-treatment"],"q":"<p>The base-exchange (zeolite) process of water softening:<\/p>","a":1,"s":"<p>Ca²⁺ and Mg²⁺ are exchanged for Na⁺; exhausted zeolite is regenerated with NaCl.<br>Other options: A — both temporary and permanent hardness are removed; C — lime is used in lime-soda softening; D — turbidity clogs the zeolite.<\/p>","tag":""},{"id":"7.3.23","m":1,"o":["Carbonate (temporary) hardness","Turbidity","Non-carbonate (permanent) calcium hardness","Dissolved carbon dioxide"],"q":"<p>In lime-soda softening, soda ash (Na₂CO₃) is added mainly to remove:<\/p>","a":2,"s":"<p>Lime removes carbonate hardness and magnesium; soda ash precipitates the Ca of sulphates/chlorides as CaCO₃.<br>Other options: A — removed by lime; B — removed by coagulation and filtration; D — removed by aeration or lime.<\/p>","tag":""},{"id":"7.3.24","m":1,"o":["Carbon dioxide","Hydrogen sulphide","Dissolved iron","Permanent hardness"],"q":"<p>Aeration of water is NOT effective in removing:<\/p>","a":3,"s":"<p>Aeration strips CO₂ and H₂S, removes volatile tastes/odours and oxidises Fe²⁺/Mn²⁺ to insoluble forms; it has no effect on sulphate/chloride hardness.<br>Other options: A — removed by aeration; B — removed by aeration; C — oxidised and precipitated by aeration.<\/p>","tag":""},{"id":"7.3.25","m":1,"o":["Settling of suspended matter and die-off of bacteria","Removing hardness","Removing dissolved salts","Raising the dissolved iron and manganese content to safe levels"],"q":"<p>Storing raw water in an impounding reservoir for several weeks improves its quality mainly by:<\/p>","a":0,"s":"<p>Natural purification by storage: sedimentation, sunlight and starvation reduce bacteria, though algae may grow.<br>Other options: B — storage does not soften water; C — storage does not reduce TDS; D — this is not an improvement.<\/p>","tag":""},{"id":"7.3.26","m":1,"o":["Disinfection → screening → filtration → sedimentation","Screening → coagulation–flocculation → sedimentation → rapid sand filtration → disinfection","Filtration → sedimentation → coagulation → screening","Plain sedimentation → disinfection → screening → coagulation–flocculation → rapid sand filtration"],"q":"<p>The usual sequence of units in a conventional surface-water treatment plant is:<\/p>","a":1,"s":"<p>Large objects are screened first; floc formed by coagulation settles; the filter removes fine floc; chlorine is applied last for a residual.<br>Other options: A — disinfection must follow particle removal; C — reverse order; D — screening must be first.<\/p>","tag":""},{"id":"7.3.27","m":1,"o":["25 m²","40 m²","400 m²","4000 m²"],"q":"<p>To remove all discrete particles with a settling velocity of 0.25 mm/s from a flow of 0.1 m³/s in an ideal horizontal-flow settling tank, the minimum plan area needed is:<\/p>","a":2,"s":"<p>Ideal tank: all particles with vs ≥ Q/A are removed, so A = Q/vs = 0.1/0.00025 = 400 m² (independent of depth).<br>Other options: A — vs taken as 4 mm/s; B — vs taken as 2.5 mm/s; D — vs taken as 0.025 mm/s.<\/p>","tag":""},{"id":"7.3.28","m":1,"o":["Reverse osmosis through a semi-permeable membrane under pump pressure","Boiling and evaporation","Chlorination","Adsorption on iron hydroxide from rusting iron nails"],"q":"<p>The Kanchan Arsenic Filter, developed for household use in Nepal&#x27;s Terai, removes arsenic mainly by:<\/p>","a":3,"s":"<p>Arsenic adsorbs on ferric hydroxide from the corroding nails; the underlying biosand layer also removes pathogens.<br>Other options: A — energy-intensive; not this filter; B — boiling concentrates arsenic; C — chlorine oxidises but does not remove arsenic by itself.<\/p>","tag":""},{"id":"7.3.29","m":1,"o":["Add lime or soda ash to supply the alkalinity","Add more alum until visible floc begins to form","Add chlorine","Aerate the water"],"q":"<p>When raw water lacks sufficient natural alkalinity for alum coagulation, the usual remedy is to:<\/p>","a":0,"s":"<p>Alum reacts with bicarbonate alkalinity to form Al(OH)₃ floc; lime or soda ash supplies the shortfall.<br>Other options: B — without alkalinity, the pH falls and floc does not form; C — chlorine does not provide alkalinity; D — aeration removes CO₂ but adds no alkalinity.<\/p>","tag":""},{"id":"7.3.30","m":1,"o":["1 – 2 mg/L","0.1 – 0.2 mg/L","5 – 10 mg/L","Zero (no residual)"],"q":"<p>As per NDWQS 2062, where chlorination is practised, the residual chlorine to be maintained in the supply system is:<\/p>","a":1,"s":"<p>NDWQS 2062 specifies residual chlorine 0.1–0.2 mg/L in systems where chlorination is practised.<br>Other options: A — ten times higher; would cause taste complaints; C — super-chlorination levels; D — a residual protects against recontamination.<\/p>","tag":""}]},{"k":"7.4","t":"Reservoirs and Distribution System","qs":[{"id":"7.4.1","m":1,"o":["0.8 ML","1.2 ML","1.6 ML","2.4 ML"],"q":"<p>A town&#x27;s demand of 2.4 ML/day is drawn uniformly over 24 h, while the pumps run only 8 h a day (08:00–16:00) at a uniform rate. The minimum balancing storage needed in the service reservoir is:<\/p>","a":2,"s":"<p>Pump rate = 2.4/8 = 0.3 ML/h; demand = 0.1 ML/h. Surplus during pumping = (0.3 − 0.1) × 8 = 1.6 ML, which must be stored to meet the 16 h without pumping.<br>Other options: A — only the demand during the 8 pumping hours; B — half the daily demand assumed; D — whole daily demand.<\/p>","tag":""},{"id":"7.4.2","m":1,"o":["333 m³","367 m³","467 m³","833 m³"],"q":"<p>Demand (m³) in successive 4-hour periods from midnight: 300, 900, 1000, 700, 900, 200 (total 4000 m³). If water is pumped into the service reservoir uniformly over 24 hours, the required balancing storage is about:<\/p>","a":3,"s":"<p>Supply = 666.7 m³ per period. Cumulative surplus (supply − demand): +366.7, +133.3, −200, −233.3, −466.7, 0. Storage = max surplus + max deficit = 366.7 + 466.7 = 833 m³.<br>Other options: A — only the largest single-period deficit; B — only the maximum cumulative surplus; C — only the maximum cumulative deficit.<\/p>","tag":""},{"id":"7.4.3","m":1,"o":["4000 m³","1400 m³","1200 m³","833 m³"],"q":"<p>Demand (m³) in successive 4-hour periods from midnight: 300, 900, 1000, 700, 900, 200 (total 4000 m³). If instead the pumps deliver the whole 4000 m³ at a uniform rate between 08:00 and 20:00 only, the required balancing storage is about:<\/p>","a":1,"s":"<p>Cumulative (supply − demand): −300, −1200, −866.7, −233.3, +200, 0. Storage = 200 + 1200 = 1400 m³.<br>Other options: A — whole day&#x27;s demand; C — maximum deficit only; D — value for 24-h pumping.<\/p>","tag":""},{"id":"7.4.4","m":1,"o":["+0.33","−0.33","+0.66","+2.71"],"q":"<p>A single loop has four pipes with head loss hf = rQ². Taking clockwise flow as positive, the assumed flows and r values are: pipe 1: Q = +6, r = 1; pipe 2: Q = +3, r = 2; pipe 3: Q = −4, r = 3; pipe 4: Q = −5, r = 1 (consistent units). The Hardy Cross correction ΔQ for the first iteration is about:<\/p>","a":0,"s":"<p>ΔQ = −ΣrQ|Q| / Σ2r|Q| = −(−19) / 58 = +0.33 (added to all clockwise flows, i.e. clockwise flows increase).<br>Other options: B — sign convention reversed; C — factor n = 2 omitted from the denominator; D — denominator taken as Σr.<\/p>","tag":""},{"id":"7.4.5","m":1,"o":["35%","42%","54%","65%"],"q":"<p>A utility&#x27;s system input volume is 12,000 m³/day and its billed authorised consumption is 7,800 m³/day. Non-revenue water (NRW) as a percentage of system input is:<\/p>","a":0,"s":"<p>NRW = system input − billed authorised consumption = 4,200 m³/day; 4,200/12,000 = 35%.<br>Other options: B — 4200 read directly as a percentage; C — divided by billed consumption instead of system input; D — the billed fraction.<\/p>","tag":""},{"id":"7.4.6","m":1,"o":["It needs the largest number of valves","Water stagnates at dead ends and one repair cuts off a whole area","Its hydraulic design calculations are the most complex of all layouts","It cannot be used with gravity supply"],"q":"<p>The main drawback of a dead-end (tree) distribution system is that:<\/p>","a":1,"s":"<p>Each point has only one supply path; dead ends need frequent flushing through scour valves.<br>Other options: A — the grid-iron system needs more valves; C — dead-end flows are simple to compute; D — it works with any source.<\/p>","tag":""},{"id":"7.4.7","m":1,"o":["All mains radiate from a central reservoir","Pipes branch like a tree from a single main","Each point is fed from more than one direction, so there are no dead ends","It needs fewer pipes and valves than any other layout, so it is the cheapest system"],"q":"<p>In a grid-iron (interlaced) distribution system:<\/p>","a":2,"s":"<p>Circulation is good and fire flow can be drawn from several directions, but more pipes and valves are needed and design is harder (Hardy Cross).<br>Other options: A — radial system; B — dead-end system; D — it needs more of both.<\/p>","tag":""},{"id":"7.4.8","m":1,"o":["Ring (circular) system","Grid-iron system","Dead-end system","Radial system"],"q":"<p>A distribution layout in which the area is divided into zones, each fed from a reservoir at its centre with pipes laid outward along roads, is the:<\/p>","a":3,"s":"<p>Radial systems give quick service and high pressures; they suit areas with radially laid-out roads.<br>Other options: A — a main encircles the area and branches feed inward; B — interconnected rectangular network; C — tree-like branching from one main.<\/p>","tag":""},{"id":"7.4.9","m":1,"o":["Well-planned towns, with a main laid round the periphery","Haphazardly grown old town centres with narrow, irregular lanes and courtyards","A single long village along a road","Areas served only by tankers"],"q":"<p>A ring (circular) distribution system is most suitable for:<\/p>","a":0,"s":"<p>The peripheral ring supplies every block from two sides, like a grid.<br>Other options: B — a dead-end system is usually unavoidable there; C — a simple branched line suffices; D — no pipe network.<\/p>","tag":""},{"id":"7.4.10","m":1,"o":["12 m","28 m","40 m","52 m"],"q":"<p>The water level in a service reservoir is at RL 1350 m. A node at ground RL 1310 m is reached after a total head loss of 12 m. The residual pressure head at the node is:<\/p>","a":1,"s":"<p>Residual head = (1350 − 12) − 1310 = 28 m (≈ 275 kPa).<br>Other options: A — head loss taken as the pressure; C — head loss ignored (static head); D — head loss added.<\/p>","tag":""},{"id":"7.4.11","m":1,"o":["Water must be chlorinated twice","It needs smaller pipe diameters, which are harder to clean and disinfect","Low pressure lets polluted water enter through leaky joints","Consumers always use more water"],"q":"<p>A major public-health disadvantage of intermittent water supply is that:<\/p>","a":2,"s":"<p>Negative or zero pressure draws in contaminated groundwater; customers also install suction pumps and storage, worsening the problem.<br>Other options: A — chlorination dose is not doubled; B — pipes must be larger, which is an economic drawback, not a health one; D — intermittent supply usually reduces consumption.<\/p>","tag":""},{"id":"7.4.12","m":1,"o":["Head loss is higher in continuous systems","Per-capita demand is higher in intermittent systems","Leakage is zero in intermittent systems","The day&#x27;s demand must be delivered in a few hours"],"q":"<p>Pipe sizes in an intermittent supply system must generally be larger than in a continuous system serving the same population because:<\/p>","a":3,"s":"<p>Flow rate = daily volume / supply hours, so the design flow increases as supply hours shrink.<br>Other options: A — the opposite—design flow is lower; B — it is usually lower; C — leakage still occurs and pressures are irregular.<\/p>","tag":""},{"id":"7.4.13","m":1,"o":["Balance hourly demand against a steady supply and maintain pressure","Provide long-term seasonal storage of raw water for the whole dry season","Settle suspended solids before filtration","Reduce hardness of water"],"q":"<p>The main function of a service (distribution) reservoir is to:<\/p>","a":0,"s":"<p>It also stores water for emergencies and fire fighting, allowing pumps and treatment to run at a uniform rate.<br>Other options: B — role of an impounding reservoir; C — role of a sedimentation tank; D — storage does not soften water.<\/p>","tag":""},{"id":"7.4.14","m":1,"o":["Dead storage, live storage and flood storage","Balancing storage, breakdown (emergency) storage and fire reserve","Balancing storage and sediment storage only","Daily demand multiplied by the peak factor"],"q":"<p>The total capacity of a service reservoir is normally the sum of:<\/p>","a":1,"s":"<p>Balancing storage comes from the mass-curve analysis; extra storage covers pump/main failure and fire demand.<br>Other options: A — zones of an impounding dam reservoir; C — service reservoirs receive treated water; D — not a storage formula.<\/p>","tag":""},{"id":"7.4.15","m":1,"o":["2.00 D","1.41 D","1.32 D","1.15 D"],"q":"<p>Two identical pipes of diameter D laid in parallel are to be replaced by a single pipe of the same length that carries the same total flow with the same head loss (Darcy, same f). Its diameter is about:<\/p>","a":2,"s":"<p>With hf fixed, Q ∝ D^2.5. Total Q = 2 × Q₁, so D_eq = 2^(1/2.5) D = 2^0.4 D = 1.32 D.<br>Other options: A — diameters added; B — same area assumed (Q ∝ D²); D — hf ∝ Q²/D⁵ rearranged as Q ∝ D⁵.<\/p>","tag":""},{"id":"7.4.16","m":1,"o":["Velocity is the same in all pipes","Head loss is the same in every pipe","Every pipe in the network carries the same discharge at all times","Nodal continuity and zero net head loss around each loop"],"q":"<p>Hardy Cross analysis of a looped pipe network is based on the conditions that:<\/p>","a":3,"s":"<p>Assumed flows satisfying continuity are corrected loop by loop until ΣhF ≈ 0 in each loop.<br>Other options: A — not required; B — only the loop sum must vanish; C — flows differ; only nodal continuity holds.<\/p>","tag":""},{"id":"7.4.17","m":1,"o":["Rational method","Hardy Cross method","Equivalent pipe method","Newton–Raphson method"],"q":"<p>Which of the following is NOT a method of analysing a water distribution network?<\/p>","a":0,"s":"<p>The rational method (Q = CIA) estimates storm runoff. Hardy Cross, equivalent pipe and Newton–Raphson methods are network methods.<br>Other options: B — standard loop-correction method; C — replaces pipes by hydraulically equivalent ones; D — simultaneous solution used in software.<\/p>","tag":""},{"id":"7.4.18","m":1,"o":["Measure each household&#x27;s monthly consumption for billing purposes","Locate leakage by recording night flows in a section","Measure residual chlorine","Record reservoir levels"],"q":"<p>A Deacon (waste-water) meter is used in a distribution system to:<\/p>","a":1,"s":"<p>High flows at night, when legitimate demand is minimal, indicate leakage; the section is then narrowed down by closing valves.<br>Other options: A — domestic meters do this; C — a comparator does this; D — a level gauge does this.<\/p>","tag":""},{"id":"7.4.19","m":1,"o":["Has no moving parts","Causes no head loss","Measures small flows accurately","Is unaffected by suspended matter"],"q":"<p>A positive-displacement water meter is preferred over an inferential (velocity) meter for domestic connections because it:<\/p>","a":2,"s":"<p>Each rotation of the piston/disc passes a fixed volume, so low household flows are registered; velocity meters suit large flows.<br>Other options: A — it has a moving piston or disc; B — it causes a noticeable head loss; D — it is sensitive to grit.<\/p>","tag":""},{"id":"7.4.20","m":1,"o":["Water flows entirely by gravity from a source located far above the town","Pumps feed the mains directly with no storage","Consumers draw water only from public stand-posts","Pumps run uniformly; surplus is stored in elevated tanks for peaks"],"q":"<p>In the most common &#x27;pumping with storage&#x27; (combined) system of distribution:<\/p>","a":3,"s":"<p>This allows economical pump sizes and continuous pressure even during power failures for a limited time.<br>Other options: A — pure gravity system; B — direct pumping; pumps must follow demand; C — not a distribution system type.<\/p>","tag":""},{"id":"7.4.21","m":1,"o":["Polluted water drawn into the main through a cross connection at low pressure","Treated water flowing back to the treatment plant through the mains during night hours","Siphon action across a hill in a gravity main","Reverse flow in a sewer"],"q":"<p>Back-siphonage in a water distribution system means:<\/p>","a":0,"s":"<p>Sub-atmospheric pressure in the main sucks water from tanks, basins or sewers; air gaps and non-return valves prevent it.<br>Other options: B — not the definition; C — a different phenomenon; D — sewer surcharge, not back-siphonage.<\/p>","tag":""},{"id":"7.4.22","m":1,"o":["6.3 m","11.2 m","12.6 m","159.2 m"],"q":"<p>A circular service reservoir is to hold 500 m³ with a water depth of 4 m. Its internal diameter is about:<\/p>","a":2,"s":"<p>D = √(4V/(πh)) = √(4 × 500/(π × 4)) = 12.6 m.<br>Other options: A — radius found instead of diameter; B — square tank of side √(V/h) assumed; D — square root not taken.<\/p>","tag":""},{"id":"7.4.23","m":1,"o":["2,943 kPa","294 kPa","30 kPa","3 kPa"],"q":"<p>A residual pressure head of 30 m of water in a main corresponds to about:<\/p>","a":1,"s":"<p>p = γw h = 9.81 × 30 = 294 kPa (≈ 3 bar).<br>Other options: A — factor of 10 slip; C — head taken directly as kPa; D — factor of 100 slip.<\/p>","tag":""},{"id":"7.4.24","m":1,"o":["Reduce the number of consumers per zone for billing","Convert the network into a dead-end system that is easier to analyse","Increase the velocity in all pipes","Keep pressures acceptable at both high and low elevations"],"q":"<p>Dividing a hilly town&#x27;s distribution network into pressure zones is done mainly to:<\/p>","a":3,"s":"<p>Low-lying areas would otherwise get excessive pressure (leakage, bursts) and high areas too little.<br>Other options: A — administrative, not hydraulic; B — zoning is independent of layout; C — not the aim.<\/p>","tag":""},{"id":"7.4.25","m":1,"o":["The maximum inflow rate to the reservoir","The average daily demand","The fire demand only","Half of the outlet capacity"],"q":"<p>The overflow pipe of a service reservoir must be able to discharge at least:<\/p>","a":0,"s":"<p>If the inlet fails to close, all inflow must spill safely without over-topping the structure.<br>Other options: B — too small if inflow exceeds it; C — unrelated to inflow; D — unrelated to inflow.<\/p>","tag":""},{"id":"7.4.26","m":1,"o":["8 m","16 m","20 m","24 m"],"q":"<p>The farthest node of a network (ground RL 100 m) needs a residual head of 12 m, and the head loss from an elevated tank to the node at peak flow is 8 m. If the ground at the tank site is RL 104 m, the minimum height of the tank&#x27;s lowest water level above the ground is:<\/p>","a":1,"s":"<p>Required lowest water level = 100 + 12 + 8 = 120 m; staging height = 120 − 104 = 16 m.<br>Other options: A — residual head ignored; C — ground difference of the tank site ignored; D — site elevation difference added instead of subtracted.<\/p>","tag":""},{"id":"7.4.27","m":1,"o":["Average daily demand, or the annual average demand of the design year","Minimum night flow, or leakage flow","Peak hourly demand, or maximum daily demand plus fire demand","Annual demand divided by 365"],"q":"<p>In an urban distribution system (without separate fire mains), pipes are commonly designed for the larger of:<\/p>","a":2,"s":"<p>The network must deliver either the peak-hour flow or a fire flow on the maximum day, whichever governs.<br>Other options: A — averages would give under-sized pipes; B — minimum flows do not govern size; D — that is the average daily demand.<\/p>","tag":""},{"id":"7.4.28","m":1,"o":["Leakage from transmission mains","Overflow from service reservoirs","Leakage on service connections up to the customer&#x27;s meter","Meter under-registration and illegal connections"],"q":"<p>In the IWA water balance, which of the following counts as an apparent (commercial) loss rather than a real (physical) loss?<\/p>","a":3,"s":"<p>Apparent losses are water consumed but not paid for; real losses are leaks, bursts and reservoir overflows.<br>Other options: A — real (physical) loss; B — real (physical) loss; C — real (physical) loss.<\/p>","tag":""},{"id":"7.4.29","m":1,"o":["Maximum cumulative surplus plus maximum cumulative deficit","The maximum hourly demand","The total daily demand","The difference between the peak and the minimum hourly demand rates"],"q":"<p>In the mass-curve method with continuous uniform supply, the required balancing capacity of a service reservoir equals:<\/p>","a":0,"s":"<p>Graphically, it is the sum of the largest ordinates above and below the supply line drawn tangent to the demand mass curve.<br>Other options: B — a rate, not a volume; C — far too large; D — a rate difference, not a volume.<\/p>","tag":""},{"id":"7.4.30","m":1,"o":["The supply is entirely by gravity from a spring source high above the town","The town is flat, with no natural high ground for a reservoir","Very large storage volumes are needed","Water needs to be kept cool"],"q":"<p>An elevated (overhead) service reservoir on a staging is preferred to a ground-level reservoir mainly where:<\/p>","a":1,"s":"<p>In hilly areas, ground reservoirs placed on high ground give pressure cheaply; on plains the water must be raised on a tower.<br>Other options: A — a ground reservoir on high ground suffices; C — elevated tanks are economical only for limited volumes; D — not the reason.<\/p>","tag":""}]},{"k":"7.5","t":"Wastewater Quantity, Characteristics and Sewers","qs":[{"id":"7.5.1","m":1,"o":["1.08 MLD","4.32 MLD","5.40 MLD","43.2 MLD"],"q":"<p>A town of 40,000 people is supplied at 135 lpcd. If 80% of the water supplied reaches the sewers, the average dry-weather flow is:<\/p>","a":1,"s":"<p>DWF = 40,000 × 135 × 0.8 = 4,320,000 L/day = 4.32 MLD.<br>Other options: A — 20% used instead of 80%; C — 80% factor not applied; D — factor 10 slip.<\/p>","tag":""},{"id":"7.5.2","m":1,"o":["25 m³/s","4.17 m³/s","2.5 m³/s","0.25 m³/s"],"q":"<p>Using the rational method, Q = CIA/360 (Q in m³/s, I in mm/h, A in hectares), the peak runoff from a 30 ha catchment with C = 0.6 and design rainfall intensity 50 mm/h is:<\/p>","a":2,"s":"<p>Q = 0.6 × 50 × 30 / 360 = 2.5 m³/s.<br>Other options: A — divided by 36 instead of 360; B — runoff coefficient omitted; D — factor 10 slip.<\/p>","tag":""},{"id":"7.5.3","m":1,"o":["0.600","0.617","0.645","0.900"],"q":"<p>A drainage area consists of 40% roofs (C = 0.9), 30% paved roads (C = 0.8) and 30% lawns (C = 0.15). The weighted runoff coefficient is:<\/p>","a":2,"s":"<p>C = 0.4 × 0.9 + 0.3 × 0.8 + 0.3 × 0.15 = 0.645.<br>Other options: A — lawns omitted; B — simple average without area weights; D — highest value only.<\/p>","tag":""},{"id":"7.5.4","m":1,"o":["10 min","20 min","22 min","30 min"],"q":"<p>Storm water takes 10 minutes to reach the first inlet and then flows 1.2 km through the drain at an average velocity of 1 m/s to the design point. The time of concentration is:<\/p>","a":3,"s":"<p>Tc = inlet time + flow time = 10 + 1200/(1 × 60) = 10 + 20 = 30 min.<br>Other options: A — flow time omitted; B — inlet time omitted; C — 1200 s read as 12 min instead of 20 min.<\/p>","tag":""},{"id":"7.5.5","m":1,"o":["Sends a smaller, steadier flow to treatment but needs two pipe sets","Needs only one set of pipes for both sewage and storm water","Causes storm overflows of diluted sewage into rivers","Always guarantees self-cleansing velocity in the small sanitary sewers at all times"],"q":"<p>Compared with a combined system, a separate system of sewerage:<\/p>","a":0,"s":"<p>Sanitary sewage goes to treatment; storm water can go directly to streams. Small sanitary sewers may need flushing.<br>Other options: B — that is the combined system; C — a drawback of combined systems; D — small sanitary flows may fall below it.<\/p>","tag":""},{"id":"7.5.6","m":1,"o":["Prevent erosion of the sewer invert","Prevent deposition of solids in the sewer","Increase the dissolved oxygen of sewage","Reduce the required pipe diameter"],"q":"<p>A minimum &#x27;self-cleansing&#x27; velocity (typically around 0.6–0.9 m/s) is maintained in sewers in order to:<\/p>","a":1,"s":"<p>If velocity falls below this, grit and organic solids settle, reducing capacity and causing septic conditions.<br>Other options: A — that is the maximum (non-scouring) velocity; C — not the purpose; D — not the purpose.<\/p>","tag":""},{"id":"7.5.7","m":1,"o":["24.2 L/s","48.4 L/s","76.8 L/s","193 L/s"],"q":"<p>A 300 mm sewer (Manning n = 0.013) is laid at a slope of 1 in 400. Running full, its discharge is about:<\/p>","a":1,"s":"<p>R = D/4 = 0.075 m; V = (1/n)R^(2/3)S^(1/2) = (1/0.013)(0.075)^(2/3)(0.05) = 0.684 m/s; Q = V × π(0.3)²/4 = 48.4 L/s.<br>Other options: A — half-full discharge; C — R taken as D/2; D — area taken as πD².<\/p>","tag":""},{"id":"7.5.8","m":1,"o":["1 in 15","1 in 578","1 in 1456","1 in 229"],"q":"<p>What minimum slope must a 250 mm sewer (n = 0.013) have to give a self-cleansing velocity of 0.8 m/s when running full?<\/p>","a":3,"s":"<p>S = (Vn / R^(2/3))², R = 0.0625 m → S = (0.8 × 0.013 / 0.0625^(2/3))² = 0.00436 ≈ 1 in 229.<br>Other options: A — not squared; B — R taken as D/2; C — R taken as D.<\/p>","tag":""},{"id":"7.5.9","m":1,"o":["The same velocity and half the discharge","Half the velocity and half the discharge","The same velocity and the same discharge","Twice the velocity and the same discharge"],"q":"<p>A circular sewer running exactly half full (constant n) has, compared with running full:<\/p>","a":0,"s":"<p>At half depth, A = A_full/2 and P = P_full/2, so R = D/4 as when full; V is unchanged and Q = V·A halves.<br>Other options: B — R is unchanged, so V is unchanged; C — area is halved; D — no such effect.<\/p>","tag":""},{"id":"7.5.10","m":1,"o":["0.50 D","0.81 D","0.94 D","1.00 D"],"q":"<p>For a circular sewer with constant Manning&#x27;s n, the maximum discharge occurs at a depth of about:<\/p>","a":2,"s":"<p>Above ~0.94D, the wetted perimeter rises faster than area near the crown, so discharge falls slightly; maximum velocity occurs at ~0.81D.<br>Other options: A — half full: V = V_full, Q = Q_full/2; B — depth of maximum velocity; D — full flow carries less than the maximum.<\/p>","tag":""},{"id":"7.5.11","m":1,"o":["95 mg/L","205 mg/L","279 mg/L","300 mg/L"],"q":"<p>A wastewater has ultimate first-stage BOD L₀ = 300 mg/L and rate constant k = 0.23 day⁻¹ (base e) at 20 °C. Its 5-day BOD is about:<\/p>","a":1,"s":"<p>BOD₅ = L₀(1 − e^(−kt)) = 300(1 − e^(−1.15)) = 205 mg/L.<br>Other options: A — BOD remaining, not exerted; C — k used as a base-10 constant; D — ultimate BOD.<\/p>","tag":""},{"id":"7.5.12","m":1,"o":["508 mg/L","300 mg/L","292 mg/L","137 mg/L"],"q":"<p>The 5-day BOD of a sewage is 200 mg/L. If the deoxygenation constant K_D = 0.1 day⁻¹ (base 10), the ultimate BOD is about:<\/p>","a":2,"s":"<p>L₀ = BOD₅ / (1 − 10^(−K_D t)) = 200 / (1 − 10^(−0.5)) = 200/0.684 = 292 mg/L.<br>Other options: A — base-10 constant used with e; B — BOD₅ × 1.5 assumed instead of using the rate equation; D — multiplied instead of divided.<\/p>","tag":""},{"id":"7.5.13","m":1,"o":["0.145 day⁻¹","0.241 day⁻¹","0.338 day⁻¹","0.364 day⁻¹"],"q":"<p>A BOD rate constant is 0.23 day⁻¹ at 20 °C. Using θ = 1.047, its value at 30 °C is about:<\/p>","a":3,"s":"<p>k_T = k₂₀ θ^(T−20) = 0.23 × 1.047¹⁰ = 0.364 day⁻¹.<br>Other options: A — exponent sign reversed; B — exponent taken as 1; C — θ^(10) approximated as 1 + 10 × 0.047.<\/p>","tag":""},{"id":"7.5.14","m":1,"o":["5 mg/L","100 mg/L","250 mg/L","300 mg/L"],"q":"<p>In a BOD test, 6 mL of wastewater is diluted to 300 mL. The initial DO is 8.5 mg/L and the DO after 5 days&#x27; incubation at 20 °C is 3.5 mg/L. The BOD₅ of the wastewater is:<\/p>","a":2,"s":"<p>P = 6/300 = 0.02; BOD₅ = (D₁ − D₂)/P = (8.5 − 3.5)/0.02 = 250 mg/L.<br>Other options: A — dilution factor ignored; B — P taken as 0.05; D — dilution bottle volume taken as the answer.<\/p>","tag":""},{"id":"7.5.15","m":1,"o":["320 mg/L","300 mg/L","281 mg/L","53 mg/L"],"q":"<p>The theoretical oxygen demand of a solution containing 300 mg/L of glucose (C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O; C = 12, H = 1, O = 16) is:<\/p>","a":0,"s":"<p>180 g glucose needs 6 × 32 = 192 g O₂; ThOD = 300 × 192/180 = 320 mg/L.<br>Other options: B — taken equal to the glucose concentration; C — ratio inverted; D — only one mole of O₂ counted.<\/p>","tag":""},{"id":"7.5.16","m":1,"o":["COD includes the oxygen consumed by algae","BOD is measured at a higher temperature, so the microbes consume oxygen more slowly","COD measures only inorganic matter","COD oxidises nearly all organics; BOD₅ only part of the biodegradable fraction"],"q":"<p>For a typical domestic sewage, the COD is higher than the BOD₅ because:<\/p>","a":3,"s":"<p>A BOD₅/COD ratio of about 0.4–0.6 indicates readily biodegradable wastewater.<br>Other options: A — COD is a chemical test; B — BOD is incubated at 20 °C; COD is refluxed with dichromate; C — it measures mainly organic matter.<\/p>","tag":""},{"id":"7.5.17","m":1,"o":["400 mg/L","500 mg/L","900 mg/L","1400 mg/L"],"q":"<p>A sewage sample has total solids 900 mg/L. On igniting the residue at 550 °C, 500 mg/L remains. The volatile solids are:<\/p>","a":0,"s":"<p>Volatile (organic) solids = total − fixed = 900 − 500 = 400 mg/L.<br>Other options: B — fixed (inorganic) solids; C — total solids; D — added instead of subtracted.<\/p>","tag":""},{"id":"7.5.18","m":1,"o":["1,125","11,250","16,667","11,250,000"],"q":"<p>An industry discharges 1500 m³/day of wastewater with a BOD₅ of 600 mg/L. Taking a per-capita BOD₅ contribution of 80 g/day, the population equivalent is:<\/p>","a":1,"s":"<p>BOD load = 1500 × 600 g/m³ = 900 kg/day; PE = 900,000 g / 80 g = 11,250 persons.<br>Other options: A — factor 10 slip; C — 54 g/day per capita used; D — kg/day not converted consistently (×1000 slip).<\/p>","tag":""},{"id":"7.5.19","m":1,"o":["Increases as water temperature increases","Is independent of temperature","Increases with salinity","Decreases as water temperature increases"],"q":"<p>The saturation dissolved-oxygen concentration of water:<\/p>","a":3,"s":"<p>Gas solubility falls with temperature (about 9.1 mg/L at 20 °C and 7.6 mg/L at 30 °C, fresh water at sea level), so warm streams are more vulnerable to pollution.<br>Other options: A — the reverse; B — strongly temperature dependent; C — salinity decreases DO saturation.<\/p>","tag":""},{"id":"7.5.20","m":1,"o":["Resist corrosion by acids and sewage gases and have smooth interiors","Have very high tensile and bending strength","Are available in very large diameters","Are lighter than PVC pipes"],"q":"<p>Salt-glazed vitrified clay pipes are widely used for house and small street sewers mainly because they:<\/p>","a":0,"s":"<p>They are durable and impervious but brittle and weak in tension, so they are used in smaller sizes with proper bedding.<br>Other options: B — they are brittle; C — they are limited to small sizes; D — they are much heavier.<\/p>","tag":""},{"id":"7.5.21","m":1,"o":["Sulphuric acid from bacterial oxidation of H₂S at the crown","Abrasion by grit and sand carried along the invert at high velocity","Alkaline cleaning agents in sewage","Freezing and thawing of sewage"],"q":"<p>The crown corrosion of concrete sewers is caused mainly by:<\/p>","a":0,"s":"<p>Under septic conditions, H₂S is released, oxidised to H₂SO₄ above the water line, attacking the concrete crown.<br>Other options: B — that erodes the invert, not the crown; C — do not attack concrete; D — not the cause.<\/p>","tag":""},{"id":"7.5.22","m":1,"o":["Only at the outfall end of the sewer","Changes of direction, gradient or size, junctions and long straight runs","Only where the sewer crosses a road, railway line, canal or another underground service","At every pipe joint"],"q":"<p>Manholes on sewer lines are provided at:<\/p>","a":1,"s":"<p>They allow inspection, cleaning and ventilation; straight lengths between manholes are kept short enough for cleaning rods.<br>Other options: A — not sufficient; C — they are needed at all changes of alignment; D — far too many.<\/p>","tag":""},{"id":"7.5.23","m":1,"o":["Two sewers meet at the same level","A sewer passes below a river","An incoming branch sewer is at a much higher level (more than about 0.6 m) than the main sewer","Storm water is to be separated from sewage"],"q":"<p>A drop manhole is provided where:<\/p>","a":2,"s":"<p>A vertical drop pipe outside the manhole delivers sewage to the lower invert without splashing on workmen or eroding the manhole.<br>Other options: A — an ordinary manhole suffices; B — an inverted siphon is used; D — a storm-regulator/overflow is used.<\/p>","tag":""},{"id":"7.5.24","m":1,"o":["Lift sewage to a higher level using siphon action, without pumping","Ventilate a sewer","Remove grit from sewage","Carry sewage under an obstruction such as a river, flowing full"],"q":"<p>An inverted siphon (depressed sewer) is used to:<\/p>","a":3,"s":"<p>It dips below the hydraulic gradient line; it is designed for self-cleansing velocities, often with several pipes for varying flows.<br>Other options: A — it cannot raise sewage above the inlet; B — vent shafts do this; C — grit chambers do this.<\/p>","tag":""},{"id":"7.5.25","m":1,"o":["Provide a water seal that keeps sewer gases out of the building","Increase the velocity of waste water so that pipes are self-cleansing","Remove grease from kitchen waste","Measure the flow from a building"],"q":"<p>The primary purpose of a trap in house drainage is to:<\/p>","a":0,"s":"<p>A depth of water standing in the trap blocks gas flow while allowing waste water to pass.<br>Other options: B — traps slightly retard flow; C — a grease trap is a special type for that; D — not a measuring device.<\/p>","tag":""},{"id":"7.5.26","m":1,"o":["Water closets","Hotels, restaurants and large kitchens","Roof rain-water pipes","Washing areas of a car service station"],"q":"<p>A grease trap is most commonly required on the drainage from:<\/p>","a":1,"s":"<p>Grease congeals in sewers and causes blockage; the trap cools the waste so grease floats and is removed.<br>Other options: A — WCs need an ordinary trap; C — no grease; D — these need an oil/grit interceptor.<\/p>","tag":""},{"id":"7.5.27","m":1,"o":["Has no grating at the top","Is used only on sanitary sewers","Has a sump below the outlet that retains grit and debris","Discharges storm water directly to the sewage treatment plant"],"q":"<p>A catch basin at a storm-water inlet differs from a simple inlet in that it:<\/p>","a":2,"s":"<p>The sump must be cleaned regularly, otherwise it can breed mosquitoes and produce odours.<br>Other options: A — it has a grating; B — it serves storm drains; D — it discharges into the storm sewer.<\/p>","tag":""},{"id":"7.5.28","m":1,"o":["Check the self-cleansing velocity","Measure BOD of the sewage","Check the alignment of the sewer","Detect leaks in joints and pipes"],"q":"<p>The smoke test on a laid sewer or house drainage system is carried out to:<\/p>","a":3,"s":"<p>Smoke is forced into the closed system; it escapes visibly through defective joints and cracks.<br>Other options: A — found by hydraulic calculation; B — a laboratory test; C — checked with a mirror and light.<\/p>","tag":""},{"id":"7.5.29","m":1,"o":["Allow ventilation of sewer gases and a margin for unforeseen flows","Maximise the velocity at all flows","Reduce the BOD of sewage","Avoid the need for manholes"],"q":"<p>Sanitary sewers are usually designed to run only partly full (e.g. about 0.8 D) at peak flow so as to:<\/p>","a":0,"s":"<p>The air space above the flow carries gases to vents, and spare capacity handles infiltration and growth.<br>Other options: B — velocity at 0.8D is near maximum anyway, but that is not the reason; C — not the purpose; D — manholes are still needed.<\/p>","tag":""},{"id":"7.5.30","m":1,"o":["Exfiltration","Infiltration","Inflow","Surcharge"],"q":"<p>Ground water entering a sewer through defective joints, cracks and manhole walls is called:<\/p>","a":1,"s":"<p>Infiltration increases sewage flow, especially in high water-table areas; an allowance is made in design.<br>Other options: A — sewage leaking out of the sewer; C — storm water entering directly through manhole covers and connections; D — flow above pipe capacity causing pressure flow.<\/p>","tag":""}]},{"k":"7.6","t":"Sewage Treatment, Disposal, Solid Waste, WASH and Ecosan","qs":[{"id":"7.6.1","m":1,"o":["0.011 day⁻¹","0.27 day⁻¹","3.75 day⁻¹","6.4 day⁻¹"],"q":"<p>An activated sludge aeration tank of volume 1500 m³ treats 5000 m³/day of settled sewage with BOD₅ 200 mg/L, at MLSS 2500 mg/L. The food-to-microorganism (F/M) ratio is about:<\/p>","a":1,"s":"<p>F/M = QS₀/(VX) = 5000 × 200 / (1500 × 2500) = 0.267 kg BOD/kg MLSS·day.<br>Other options: A — flow divided by 24 as if hourly; C — ratio inverted; D — time unit converted wrongly (×24).<\/p>","tag":""},{"id":"7.6.2","m":1,"o":["0.1 mL/g","10 mL/g","100 mL/g","250 mL/g"],"q":"<p>An activated sludge aeration tank of volume 1500 m³ treats 5000 m³/day of settled sewage with BOD₅ 200 mg/L, at MLSS 2500 mg/L. A 1-litre sample of mixed liquor settles to 250 mL in 30 minutes. The sludge volume index (SVI) is:<\/p>","a":2,"s":"<p>SVI = settled volume (mL/L) × 1000 / MLSS (mg/L) = 250 × 1000/2500 = 100 mL/g, indicating good settling.<br>Other options: A — 1000 factor omitted; B — factor 1000 replaced by 100; D — settled volume taken as SVI.<\/p>","tag":""},{"id":"7.6.3","m":1,"o":["0.3 days","1.25 days","12.5 days","50 days"],"q":"<p>An activated sludge aeration tank of volume 1500 m³ treats 5000 m³/day of settled sewage with BOD₅ 200 mg/L, at MLSS 2500 mg/L. If 30 m³/day of sludge at 10,000 mg/L is wasted and effluent solids are negligible, the mean cell residence time (SRT) is:<\/p>","a":2,"s":"<p>θc = VX/(Qw Xw) = 1500 × 2500 / (30 × 10,000) = 12.5 days.<br>Other options: A — hydraulic retention time V/Q mistaken for SRT; B — Xw taken as 100,000 mg/L (decimal slip); D — Xw taken as 2500 mg/L.<\/p>","tag":""},{"id":"7.6.4","m":1,"o":["18 hours","7.2 hours","3.33 hours","0.3 hours"],"q":"<p>An activated sludge aeration tank of volume 1500 m³ treats 5000 m³/day of settled sewage with BOD₅ 200 mg/L, at MLSS 2500 mg/L. The hydraulic retention time of the aeration tank is:<\/p>","a":1,"s":"<p>HRT = V/Q = 1500/5000 day = 0.3 day = 7.2 h.<br>Other options: A — 0.3 × 60; C — Q/V used; D — answer in days written as hours.<\/p>","tag":""},{"id":"7.6.5","m":1,"o":["Excessive growth of filamentous organisms","Very good settling of compact floc","Too much grit in the influent","High dissolved oxygen in the aeration tank"],"q":"<p>Sludge bulking in an activated sludge plant, indicated by a high SVI (say above 150–200 mL/g), is usually caused by:<\/p>","a":0,"s":"<p>Filaments keep the floc open and light, so it settles poorly and escapes with the effluent.<br>Other options: B — that gives a low SVI; C — grit settles rapidly; D — low DO and low F/M usually favour filaments.<\/p>","tag":""},{"id":"7.6.6","m":1,"o":["60%","72%","77%","83%"],"q":"<p>A single-stage trickling filter of volume 1000 m³ receives a BOD load of 750 kg/day with recirculation ratio R = 1. Using the NRC formula E = 100/[1 + 0.4432√(W/VF)] with F = (1 + R)/(1 + 0.1R)², the BOD removal efficiency is about:<\/p>","a":2,"s":"<p>F = 2/1.1² = 1.653; W/(VF) = 750/(1000 × 1.653) = 0.454; E = 100/(1 + 0.4432 × 0.674) = 77%.<br>Other options: A — coefficient 0.4432 omitted; B — recirculation factor F ignored; D — square root not taken.<\/p>","tag":""},{"id":"7.6.7","m":1,"o":["Add oxygen chemically to the filter","Remove nitrogen completely","Reduce the hydraulic load on the filter and the size of the final clarifier","Dilute strong influent and keep the bed wet, raising efficiency"],"q":"<p>Recirculation of effluent in a high-rate trickling filter mainly serves to:<\/p>","a":3,"s":"<p>Recirculation evens out loading, prevents drying and ponding, and gives the waste a second pass through the bed.<br>Other options: A — air flows naturally through the bed; B — not its main function; C — it increases the hydraulic load.<\/p>","tag":""},{"id":"7.6.8","m":1,"o":["Mechanical surface aerators running continuously day and night, with no role for algae","Chemical coagulation","Filtration through sand","Algae–bacteria symbiosis: algae supply oxygen, bacteria oxidise organics"],"q":"<p>The treatment in a facultative oxidation (stabilisation) pond depends mainly on:<\/p>","a":3,"s":"<p>Bacteria produce CO₂ and nutrients used by algae; algae supply DO in the upper layer; the bottom layer is anaerobic.<br>Other options: A — that is an aerated lagoon; B — no chemicals are used; C — ponds have no filter medium.<\/p>","tag":""},{"id":"7.6.9","m":1,"o":["Anaerobic digestion in upflow through a granular sludge blanket","Aerobic oxidation by diffused aeration","Aerobic filtration of the wastewater downward through a fixed rock medium","Chemical precipitation with lime"],"q":"<p>A UASB reactor treats wastewater by:<\/p>","a":0,"s":"<p>A gas–liquid–solid separator at the top retains sludge and collects methane-rich biogas; no aeration energy is needed.<br>Other options: B — UASB is anaerobic; C — that is a trickling filter; D — UASB is biological.<\/p>","tag":""},{"id":"7.6.10","m":1,"o":["Water hyacinth floating on the surface","Phragmites karka (common reed)","Rice paddy","Eucalyptus trees"],"q":"<p>Horizontal sub-surface-flow constructed wetlands (reed beds) built for wastewater treatment in Nepal are commonly planted with:<\/p>","a":1,"s":"<p>Reeds supply oxygen through their roots and keep the gravel bed permeable; reed beds are used, for example, at hospitals and small towns in Nepal.<br>Other options: A — a floating aquatic plant, used in ponds, not in sub-surface beds; C — not used as a treatment plant; D — used for land disposal/plantation, not reed beds.<\/p>","tag":""},{"id":"7.6.11","m":1,"o":["7.14 mg/L","9.05 mg/L","9.50 mg/L","76 mg/L"],"q":"<p>A town discharges 0.5 m³/s of sewage with BOD 150 mg/L into a river flowing at 10 m³/s with BOD 2 mg/L. Assuming complete mixing, the BOD of the river just downstream is about:<\/p>","a":1,"s":"<p>BOD_mix = (10 × 2 + 0.5 × 150)/(10 + 0.5) = 95/10.5 = 9.05 mg/L.<br>Other options: A — river&#x27;s own BOD ignored; C — divided by river flow only; D — simple average.<\/p>","tag":""},{"id":"7.6.12","m":1,"o":["9.71 mg/L","5.66 mg/L","5.05 mg/L","4.66 mg/L"],"q":"<p>Just below an outfall, a river has ultimate BOD L₀ = 20 mg/L and initial DO deficit D₀ = 1 mg/L, with k₁ = 0.23 day⁻¹ and k₂ = 0.46 day⁻¹ (both base e). Using the Streeter–Phelps equation, the DO deficit after 2 days is about:<\/p>","a":2,"s":"<p>D = k₁L₀/(k₂ − k₁) × (e^(−k₁t) − e^(−k₂t)) + D₀e^(−k₂t) = 20 × (0.6313 − 0.3985) + 1 × 0.3985 = 5.05 mg/L.<br>Other options: A — k₂ used in place of k₁ in the numerator k₁L₀/(k₂ − k₁); B — initial deficit not decayed (D₀ added as 1); D — initial deficit term omitted.<\/p>","tag":""},{"id":"7.6.13","m":1,"o":["1.21 days","1.40 days","2.79 days","3.01 days"],"q":"<p>Just below an outfall, a river has ultimate BOD L₀ = 20 mg/L and initial DO deficit D₀ = 1 mg/L, with k₁ = 0.23 day⁻¹ and k₂ = 0.46 day⁻¹ (both base e). The critical time (time to minimum DO) is about:<\/p>","a":2,"s":"<p>tc = [1/(k₂ − k₁)] ln[(k₂/k₁)(1 − D₀(k₂ − k₁)/(k₁L₀))] = (1/0.23) ln[2 × (1 − 0.23/4.6)] = (1/0.23) ln 1.9 = 2.79 days.<br>Other options: A — log₁₀ used instead of ln; B — divided by k₂ instead of (k₂ − k₁); D — D₀ term ignored.<\/p>","tag":""},{"id":"7.6.14","m":1,"o":["40 m³","60 m³","97 m³","250 m³"],"q":"<p>The volume of 100 m³ of sludge at 98% moisture content is reduced by thickening to 95% moisture. The new volume is about:<\/p>","a":0,"s":"<p>Solids are constant: V₂ = V₁(100 − p₁)/(100 − p₂) = 100 × 2/5 = 40 m³.<br>Other options: B — volume removed (100 − 40) given instead of the volume remaining; C — volume reduced only by the 3% moisture difference; D — ratio inverted.<\/p>","tag":""},{"id":"7.6.15","m":1,"o":["Methanogenesis → hydrolysis → acidogenesis","Acidogenesis → methanogenesis → hydrolysis","Nitrification → denitrification → methanogenesis","Hydrolysis → acid formation → methanogenesis"],"q":"<p>The correct sequence of stages in anaerobic sludge digestion is:<\/p>","a":3,"s":"<p>Complex organics are first broken into soluble compounds, then converted to volatile acids, then to CH₄ and CO₂ by methane formers, which are pH-sensitive.<br>Other options: A — methane formers need the acids first; B — hydrolysis is first; C — these are nitrogen-removal processes.<\/p>","tag":""},{"id":"7.6.16","m":1,"o":["5–10 °C","30–38 °C","50–57 °C","80–100 °C"],"q":"<p>Conventional mesophilic anaerobic sludge digesters are operated at a temperature of about:<\/p>","a":1,"s":"<p>Mesophilic bacteria are most active around 35 °C; thermophilic digestion works at about 50–57 °C.<br>Other options: A — too cold; digestion almost stops; C — thermophilic range; D — kills digester bacteria.<\/p>","tag":""},{"id":"7.6.17","m":1,"o":["1.2 m³","2.0 m³","2.6 m³","3.2 m³"],"q":"<p>A septic tank serves 20 persons contributing 100 L/person/day of sewage. With 24 hours&#x27; detention and sludge accumulation of 30 L/person/year with desludging every 2 years, the required liquid capacity is:<\/p>","a":3,"s":"<p>Settling volume = 20 × 100 × 1 day = 2.0 m³; sludge = 20 × 30 × 2 = 1200 L = 1.2 m³; total = 3.2 m³.<br>Other options: A — only the sludge volume; B — sludge storage omitted; C — sludge for only 1 year.<\/p>","tag":""},{"id":"7.6.18","m":1,"o":["4.24 m","8.49 m","11.3 m","13.3 m"],"q":"<p>Septic-tank effluent of 2000 L/day is to be disposed of in a soak pit of 1.5 m diameter. If the soil can absorb 100 L per m² of side-wall area per day (ignore the base), the effective depth of the pit is about:<\/p>","a":0,"s":"<p>Wall area = 2000/100 = 20 m²; depth = 20/(π × 1.5) = 4.24 m.<br>Other options: B — radius used instead of diameter; C — used the base area πD²/4 instead of the wall area; D — π omitted.<\/p>","tag":""},{"id":"7.6.19","m":1,"o":["Is safe for drinking after 24 hours&#x27; detention","Can be discharged straight into an open roadside drain without any risk","Contains no dissolved organic matter","Still has pathogens and BOD, so it needs a soak pit or drain field"],"q":"<p>The effluent from a septic tank:<\/p>","a":3,"s":"<p>A septic tank only settles and partly digests solids anaerobically; the effluent is septic and foul.<br>Other options: A — not treated to drinking standard; B — creates nuisance and health risk; C — much dissolved organic matter remains.<\/p>","tag":""},{"id":"7.6.20","m":1,"o":["15 tonnes/day","150 tonnes/day","600 tonnes/day","1500 tonnes/day"],"q":"<p>A city of 300,000 people generates municipal solid waste at 0.5 kg/person/day. The daily quantity of waste is:<\/p>","a":1,"s":"<p>300,000 × 0.5 = 150,000 kg/day = 150 t/day.<br>Other options: A — factor 10 slip; C — divided by 0.5 instead of multiplying; D — factor 10 slip.<\/p>","tag":""},{"id":"7.6.21","m":1,"o":["87,600 m³","73,000 m³","49,275 m³","14,600 m³"],"q":"<p>A landfill receives 150 t/day of solid waste compacted to 750 kg/m³. Allowing 20% extra volume for daily and intermediate cover, the landfill volume used per year is about:<\/p>","a":0,"s":"<p>Daily waste volume = 150/0.75 = 200 m³; with cover = 240 m³/day; per year = 240 × 365 = 87,600 m³.<br>Other options: B — cover allowance ignored; C — multiplied by density instead of dividing; D — only the cover volume.<\/p>","tag":""},{"id":"7.6.22","m":1,"o":["Speed up aerobic composting of the waste","Increase methane production","Control flies, rodents, odour, litter and fire, and limit infiltration","Allow immediate construction of buildings on top of the freshly filled area"],"q":"<p>In a sanitary landfill, the compacted waste is covered with soil at the end of each working day mainly to:<\/p>","a":2,"s":"<p>Daily cover (about 15 cm of soil) distinguishes a sanitary landfill from open dumping.<br>Other options: A — landfills become anaerobic; B — not the purpose; D — landfills settle for many years.<\/p>","tag":""},{"id":"7.6.23","m":1,"o":["Hydrogen and oxygen","Nitrogen and argon","Chlorine and ammonia","Methane and carbon dioxide"],"q":"<p>Landfill gas produced by anaerobic decomposition of municipal waste consists mainly of:<\/p>","a":3,"s":"<p>Typically about 45–60% CH₄ and 40–60% CO₂; it can be flared or used for energy and is explosive if allowed to accumulate.<br>Other options: A — not major products; B — atmospheric gases; C — not landfill gas.<\/p>","tag":""},{"id":"7.6.24","m":1,"o":["1 : 1","5 : 1","25–30 : 1","100 : 1"],"q":"<p>For efficient aerobic composting of organic solid waste, the initial carbon-to-nitrogen (C/N) ratio should be about:<\/p>","a":2,"s":"<p>Too high a C/N slows decomposition; too low loses nitrogen as ammonia.<br>Other options: A — far too low; B — too much nitrogen; ammonia odour; D — too much carbon; very slow.<\/p>","tag":""},{"id":"7.6.25","m":1,"o":["Composting (or biogas generation)","Incineration","Open burning","Dumping into rivers"],"q":"<p>Municipal solid waste in most Nepalese towns is largely organic (over half of it by weight) with high moisture. The most suitable treatment for the organic fraction is:<\/p>","a":0,"s":"<p>Wet organic waste has a low calorific value for burning but decomposes readily, giving compost or biogas.<br>Other options: B — high moisture means low calorific value and fuel is needed; C — air pollution; not a treatment; D — pollutes water and is illegal.<\/p>","tag":""},{"id":"7.6.26","m":1,"o":["Water Resources Act, 2049","Solid Waste Management Act, 2068 (2011)","Environment Protection Act, 2053 only, with no separate waste law","Drinking Water Regulation, 2055"],"q":"<p>The principal law governing solid waste management in Nepal is the:<\/p>","a":1,"s":"<p>The Act assigns local bodies responsibility for collection, transport and disposal, and promotes reduce–reuse–recycle and waste segregation at source.<br>Other options: A — deals with water use rights; C — a separate Solid Waste Management Act exists; D — deals with drinking water supply.<\/p>","tag":""},{"id":"7.6.27","m":1,"o":["2009 (2066 BS)","2015 (2072 BS)","2019 (2076 BS)","2023 (2080 BS)"],"q":"<p>Nepal was officially declared an Open Defecation Free (ODF) country in:<\/p>","a":2,"s":"<p>After the national sanitation campaign, Nepal was declared ODF on 30 September 2019.<br>Other options: A — the campaign was still ongoing; B — the earthquake year; not declared; D — declaration came earlier.<\/p>","tag":""},{"id":"7.6.28","m":1,"o":["Faeces are flushed with large volumes of water into a sewer","Urine and faeces are mixed, flushed with water and discharged to a soak pit or sewer","All excreta are burned on site","Urine and faeces are kept separate; urine is reused as fertiliser and faeces dried"],"q":"<p>In an ecological sanitation (Ecosan) urine-diverting dry toilet:<\/p>","a":3,"s":"<p>Ecosan &#x27;closes the loop&#x27; between sanitation and agriculture and uses little or no flushing water.<br>Other options: A — conventional flush sanitation; B — pit/septic system; C — not an Ecosan practice.<\/p>","tag":""},{"id":"7.6.29","m":1,"o":["50–65% of suspended solids and 25–40% of BOD","95% of BOD and 99% of suspended solids","Nearly all dissolved solids","Only grit, with no BOD removal"],"q":"<p>A properly designed primary sedimentation tank treating domestic sewage typically removes about:<\/p>","a":0,"s":"<p>Primary settling removes settleable (largely organic) solids, but much BOD is dissolved or colloidal and needs secondary treatment.<br>Other options: B — secondary-treatment-level removal; C — dissolved solids do not settle; D — grit chambers remove grit; PST removes organic solids.<\/p>","tag":""},{"id":"7.6.30","m":1,"o":["All organic solids settle with the grit","Heavy grit settles while light organic matter stays suspended","No particles settle at all","Sewage is aerated sufficiently to raise its dissolved oxygen content"],"q":"<p>In a grit chamber, a horizontal velocity of about 0.3 m/s is maintained (often by a proportional-flow weir or Parshall flume) so that:<\/p>","a":1,"s":"<p>A near-constant velocity at all flows prevents organic solids from settling with the grit, which would cause odour.<br>Other options: A — would make the grit putrescible; C — grit must settle; D — not the purpose of velocity control.<\/p>","tag":""}]}]}],"mock":[{"m":1,"secs":[{"t":"Section A · Communication English (Q1–8)","qs":[{"id":"M1-1","m":1,"o":["concise","lucid","succinct","convoluted"],"q":"<p>Choose the word that best completes the sentence: The committee&#x27;s report was so ______ that even the experts struggled to follow its argument.<\/p>","a":3,"s":"<p>&quot;Struggled to follow&quot; needs a word meaning tangled or hard to follow; convoluted fits.<br>Other options: A, B, C — all mean clear or brief, which contradicts &quot;struggled to follow&quot;.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M1-2","m":1,"o":["obstinate","amenable","compliant","diffident"],"q":"<p>Choose the word that best completes the sentence: Despite repeated warnings from the consultant, the contractor remained ______, refusing to change the unsafe formwork design.<\/p>","a":0,"s":"<p>Refusing to change despite warnings = stubborn, i.e. obstinate.<br>Other options: B, C — mean willing to accept advice, the opposite; D — means shy or lacking confidence.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M1-3","m":2,"o":["Bio-engineering alone can prevent all landslides on Nepal&#x27;s roads","Many landslides along mid-hill roads are made worse by hurried construction practices","Nepal&#x27;s geology makes road building in the hills impossible","Rural roads in Nepal should no longer be built with public budgets"],"p":"<p><b>Passage 1<\/b><br>Read the passage and answer Q3 and Q4.<\/p><p>Nepal&#x27;s mid-hill roads are among the most landslide-prone in the world, yet much of the damage is not caused by nature alone. Roads are often opened with bulldozers that push excavated spoil straight down the slope, overloading the weak soil below and burying the vegetation that held it in place. Drainage is usually an afterthought: side drains are left unlined, culverts are too few, and water released at a single point cuts gullies into the hillside. Engineers have long argued that a road built more slowly, with balanced cut and fill, controlled spoil disposal and bio-engineering such as grass and bamboo planting, costs more at the start but far less over its life. Yet budgets are released year by year, and local pressure favours a quick track that reaches every village before the next election. The result is a network that grows quickly on paper but is closed for weeks every monsoon.<\/p>","q":"<p>The main point of the passage is that:<\/p>","a":1,"s":"<p>The passage says the damage is &quot;not caused by nature alone&quot; and lists bulldozing, poor drainage and rushed budgets as causes.<br>Other options: A — bio-engineering is one of several measures, and &quot;all&quot; overstates it; C — the passage never says hill roads are impossible; D — not suggested anywhere.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M1-4","m":2,"o":["It is cheaper to build than a bulldozed track","It reaches more villages before an election","It attracts larger annual budget releases","Its higher initial cost is outweighed by lower costs over its life"],"q":"<p>According to the passage, a road built slowly with balanced cut and fill makes economic sense because:<\/p>","a":3,"s":"<p>&quot;Costs more at the start but far less over its life.&quot;<br>Other options: A — the passage says it costs more at the start; B — this is what the quick track does; C — budgets are mentioned as a constraint, not a benefit.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M1-5","m":1,"o":["Neither the engineer nor the contractors","was willing","to accept responsibility for the collapse","No error"],"q":"<p>Find the part of the sentence that contains an error: &quot;Neither the engineer nor the contractors / was willing / to accept responsibility for the collapse.&quot;<\/p>","a":1,"s":"<p>With neither … nor, the verb agrees with the nearer subject, &quot;contractors&quot; (plural), so it should be &quot;were willing&quot;.<br>Other options: A — the correlative pair is correctly formed; C — correct infinitive phrase; D — there is an agreement error.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M1-6","m":1,"o":["Each of samples have been tested twice.","Each of the sample were tested twice.","Each of the samples was tested twice.","Each of the samples were tested twice."],"q":"<p>Choose the grammatically correct sentence.<\/p>","a":2,"s":"<p>&quot;Each&quot; is the singular subject, so the verb is &quot;was&quot;; &quot;of the samples&quot; takes the plural noun.<br>Other options: A — missing &quot;the&quot; and plural verb; B — singular &quot;sample&quot; after &quot;each of the&quot; and plural verb; D — plural verb with singular &quot;each&quot;.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M1-7","m":1,"o":["Odometer : Speed","Hygrometer : Humidity","Barometer : Temperature","Anemometer : Rainfall"],"q":"<p>THEODOLITE : ANGLE :: ?<\/p>","a":1,"s":"<p>A theodolite measures angles; a hygrometer measures humidity (instrument : quantity measured).<br>Other options: A — an odometer measures distance (a speedometer measures speed); C — a barometer measures pressure; D — an anemometer measures wind speed.<\/p>","tag":"Sub-chapter 1.4"},{"id":"M1-8","m":1,"o":["Drought : Water","Fire : Smoke","Storm : Wind","Flood : Rain"],"q":"<p>FAMINE : FOOD :: ?<\/p>","a":0,"s":"<p>Famine is a severe shortage of food; drought is a severe shortage of water.<br>Other options: B — fire produces smoke; C — a storm has strong wind (excess, not shortage); D — heavy rain causes floods (cause–effect, not shortage).<\/p>","tag":"Sub-chapter 1.4"}]},{"t":"Section A · Mathematics (Q9–48)","qs":[{"id":"M1-9","m":1,"o":["30","65","10","15"],"q":"<p>If n(A) = 40, n(B) = 25 and n(A ∪ B) = 55, then n(A ∩ B) is:<\/p>","a":2,"s":"<p>n(A ∩ B) = n(A) + n(B) − n(A ∪ B) = 40 + 25 − 55 = 10.<br>Other options: A — n(A ∪ B) − n(B); B — n(A) + n(B), ignoring the overlap; D — n(A ∪ B) − n(A).<\/p>","tag":"Sub-chapter 2.1"},{"id":"M1-10","m":1,"o":["16","14","16/3","12"],"q":"<p>The sum to infinity of the geometric series 8 + 4 + 2 + 1 + … is:<\/p>","a":0,"s":"<p>a = 8, r = 1/2; S∞ = a/(1 − r) = 8/0.5 = 16.<br>Other options: B — sum of the first three terms only; C — used a/(1 + r); D — first two terms.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M1-11","m":1,"o":["5","7/√2","5√2","5/√2"],"q":"<p>The modulus of the complex number (3 + 4i)/(1 − i) is:<\/p>","a":3,"s":"<div class=\"tw\"><table><thead><tr><th>z1/z2<\/th><th>=<\/th><th>z1<\/th><th>/<\/th><th>z2<\/th><th>= 5/√2.<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div><p>Other options: A — ignored the denominator; B — took |3 + 4i| as 3 + 4 = 7; C — multiplied the moduli.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M1-12","m":1,"o":["8","−8","5","0"],"q":"<p>The determinant of the matrix with rows (2, 1, 3), (0, 4, 5), (0, 0, −1) is:<\/p>","a":1,"s":"<p>Upper-triangular matrix: determinant = product of diagonal entries = 2 × 4 × (−1) = −8.<br>Other options: A — sign of −1 dropped; C — sum of the diagonal (the trace); D — the matrix is not singular.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-13","m":1,"o":["1 and 6","2 and 5","−2 and −5","3 and 4"],"q":"<p>The eigenvalues of the matrix with rows (4, 1) and (2, 3) are:<\/p>","a":1,"s":"<p>λ² − 7λ + 10 = 0 (trace 7, determinant 12 − 2 = 10), so λ = 2, 5.<br>Other options: A — product 6 ≠ 10; C — signs wrong (sum must equal the trace, 7); D — the diagonal entries, which are eigenvalues only for a triangular matrix.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-14","m":1,"o":["3","2","1","0"],"q":"<p>The rank of the matrix with rows (1, 2, 3), (2, 4, 6), (1, 1, 1) is:<\/p>","a":1,"s":"<p>Row 2 = 2 × Row 1, so it reduces to two independent rows; the 3 × 3 determinant is 0.<br>Other options: A — the determinant is zero; C — rows 1 and 3 are not proportional; D — only the zero matrix has rank 0.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-15","m":1,"o":["k has any value other than 4","k = 2","k = 4","k = 0"],"q":"<p>The system x + y = 2, 2x + 2y = k has infinitely many solutions when:<\/p>","a":2,"s":"<p>The second equation must be exactly twice the first: k = 2 × 2 = 4.<br>Other options: A — every k ≠ 4 gives no solution; B, D — the equations are then parallel and inconsistent (no solution).<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-16","m":1,"o":["(−3, 1) and (5, −2)","(2, −5) and (−1, 3)","(3, −5) and (−1, 2)","(3, −1) and (−5, 2)"],"q":"<p>The inverse of the matrix with rows (2, 1) and (5, 3) is the matrix with rows:<\/p>","a":3,"s":"<p>det = 6 − 5 = 1; inverse = adjoint/1: swap the diagonal, change sign of the off-diagonal terms.<br>Other options: A — the negative of the inverse; B — transpose of the matrix with the diagonal not swapped; C — the transpose of the inverse.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-17","m":1,"o":["1/8","1/7","7","8"],"q":"<p>A 3 × 3 matrix A has eigenvalues 1, 2 and 4. The determinant of A⁻¹ is:<\/p>","a":0,"s":"<p>det A = product of eigenvalues = 8; det A⁻¹ = 1/det A = 1/8.<br>Other options: B — reciprocal of the trace; C — the trace (sum); D — det A itself.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-18","m":1,"o":["11","12","4","18"],"q":"<p>Maximise Z = 3x + 2y subject to x + y ≤ 4, x + 3y ≤ 6, x ≥ 0, y ≥ 0. The maximum value of Z is:<\/p>","a":1,"s":"<p>Corner points: (0, 0) → 0, (4, 0) → 12, (3, 1) → 11, (0, 2) → 4. Maximum 12 at (4, 0).<br>Other options: A — value at the intersection (3, 1); C — value at (0, 2); D — at (6, 0), which violates x + y ≤ 4.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-19","m":1,"o":["The largest right-hand-side value","The smallest entry in the pivot column","The largest coefficient in the objective-function row","The minimum ratio test (smallest non-negative ratio of RHS to positive pivot-column entry)"],"q":"<p>In the simplex method, the variable that leaves the basis is selected by:<\/p>","a":3,"s":"<p>The minimum ratio keeps the next solution feasible (all RHS ≥ 0).<br>Other options: A, B — would make some basic variable negative; C — this picks the entering variable, not the leaving one.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M1-20","m":1,"o":["−2.5","1.5","5","2.5"],"q":"<p>The value of λ for which a = 2i + λj + k and b = i − 2j + 3k are perpendicular is:<\/p>","a":3,"s":"<p>a · b = 2 − 2λ + 3 = 0 → λ = 2.5.<br>Other options: A — sign error in −2λ; B — used 1 instead of 3 for the k-product (2 − 2λ + 1 = 0); C — forgot to divide by 2.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-21","m":1,"o":["7 square units","3.5 square units","5 square units","2.5 square units"],"q":"<p>The area of the triangle whose two sides are the vectors a = i + 2j and b = 3i + j is:<\/p>","a":3,"s":"<p>a × b = (1·1 − 2·3)k = −5k; area = ½|a × b| = 2.5.<br>Other options: A — |1·1| + |2·3| without the ½; B — ½(1 × 1 + 2 × 3); C — area of the parallelogram (no ½).<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-22","m":1,"o":["2","0","2√2","1"],"q":"<p>The volume of the parallelepiped with edges a = i + j, b = j + k and c = i + k is:<\/p>","a":0,"s":"<p>Volume = |a · (b × c)| = det of rows (1,1,0), (0,1,1), (1,0,1) = 1(1) − 1(−1) + 0 = 2.<br>Other options: B — sign of the second cofactor term missed (1 − 1 = 0); C — product of magnitudes |a||b||c|, which is not the volume; D — first term of the expansion only.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-23","m":1,"o":["4i + j + 2k","4i + 4j + 3k","4i + 4j + 2k","2i + 4j + 2k"],"q":"<p>The gradient of φ = x²y + yz at the point (1, 2, 3) is:<\/p>","a":2,"s":"<p>∇φ = (2xy, x² + z, y) = (4, 1 + 3, 2).<br>Other options: A — dropped z from ∂φ/∂y; B — used z instead of y for ∂φ/∂z; D — used 2x instead of 2xy.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-24","m":1,"o":["11","0","6","3"],"q":"<p>The divergence of F = xy i + yz j + zx k at the point (1, 2, 3) is:<\/p>","a":2,"s":"<p>div F = ∂(xy)/∂x + ∂(yz)/∂y + ∂(zx)/∂z = y + z + x = 2 + 3 + 1 = 6.<br>Other options: A — xy + yz + zx; B — confusing it with a solenoidal field; D — z only.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-25","m":1,"o":["10","10/3","6","2√3"],"q":"<p>The directional derivative of φ = x² + y² + z² at (1, 1, 1) in the direction of i + 2j + 2k is:<\/p>","a":1,"s":"<p>∇φ = (2, 2, 2); unit vector = (1, 2, 2)/3; derivative = (2 + 4 + 4)/3 = 10/3.<br>Other options: A — direction vector not normalised; C — sum of the gradient components; D — |∇φ|, the maximum rate.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M1-26","m":1,"o":["1","3/5","5/3","0"],"q":"<p>lim (x → 0) of sin 3x / 5x is:<\/p>","a":1,"s":"<p>sin 3x ≈ 3x for small x, so the limit is 3x/5x = 3/5.<br>Other options: A — used lim sin x/x = 1 without the coefficients; C — ratio inverted; D — treated sin 3x as 0 alone.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-27","m":1,"o":["e²","2","e","1"],"q":"<p>lim (x → ∞) of (1 + 2/x)^x is:<\/p>","a":0,"s":"<p>lim (1 + a/x)^x = e^a with a = 2.<br>Other options: B — took the limit as a; C — the case a = 1; D — 1^∞ is indeterminate, not 1.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-28","m":1,"o":["x^x (1 + ln x)","x^x","x · x^(x − 1)","x^x ln x"],"q":"<p>The derivative of y = x^x (x &gt; 0) is:<\/p>","a":0,"s":"<p>ln y = x ln x → y&#x27;/y = ln x + 1.<br>Other options: B — derivative of e^x pattern; C — power rule wrongly applied (exponent is not constant); D — exponential rule only (base not constant).<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-29","m":1,"o":["9","1","5","3"],"q":"<p>The local maximum value of f(x) = x³ − 6x² + 9x + 1 is:<\/p>","a":2,"s":"<p>f′ = 3(x − 1)(x − 3) = 0; f″(1) = −6 &lt; 0, so maximum at x = 1: f(1) = 1 − 6 + 9 + 1 = 5.<br>Other options: A — the coefficient 9; B — local minimum value f(3); D — the x-value of the minimum.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-30","m":1,"o":["1","π/2","1/2","π/4"],"q":"<p>The value of ∫ sin²x dx from 0 to π/2 is:<\/p>","a":3,"s":"<p>sin²x = (1 − cos 2x)/2; integral = ½[x − sin 2x/2] from 0 to π/2 = π/4.<br>Other options: A — ∫ sin x dx over the same limits; B — forgot the ½; C — the mean value ½ of sin²x, not multiplied by the interval length.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-31","m":1,"o":["1","e","−1","e − 1"],"q":"<p>The value of ∫ x eˣ dx from 0 to 1 is:<\/p>","a":0,"s":"<p>By parts: [x eˣ − eˣ] from 0 to 1 = (e − e) − (0 − 1) = 1.<br>Other options: B — only the x eˣ term at x = 1; C — sign slip at the lower limit; D — ∫eˣ dx alone.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-32","m":1,"o":["1/3 square unit","5/6 square unit","1/2 square unit","1/6 square unit"],"q":"<p>The area enclosed between the curves y = x² and y = x is:<\/p>","a":3,"s":"<p>They meet at x = 0 and 1; area = ∫(x − x²) dx from 0 to 1 = 1/2 − 1/3 = 1/6.<br>Other options: A — area under y = x² only; B — added the two areas; C — area under y = x only.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-33","m":1,"o":["3u","u","0","2u"],"q":"<p>If u = (x² + y²)/(x + y), then x ∂u/∂x + y ∂u/∂y equals:<\/p>","a":1,"s":"<p>u is homogeneous of degree 2 − 1 = 1; by Euler&#x27;s theorem the sum equals n u = u.<br>Other options: A — added the degrees; C — degree 0 would give 0; D — used the degree of the numerator only.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-34","m":1,"o":["y = x² + 1","y = e^(x²)","y = e^(x²/2)","y = e^(2x)"],"q":"<p>The solution of dy/dx = 2xy with y(0) = 1 is:<\/p>","a":1,"s":"<p>Separate: dy/y = 2x dx → ln y = x² + C; y(0) = 1 gives C = 0.<br>Other options: A — ignored y on the right side; C — integrated 2x as x²/2; D — integrated 2x as 2x.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-35","m":1,"o":["Order 2, degree 4","Order 4, degree 2","Order 2, degree 3","Order 3, degree 2"],"q":"<p>The order and degree of the differential equation (d²y/dx²)³ + (dy/dx)⁴ + y = 0 are:<\/p>","a":2,"s":"<p>Order = highest derivative (2); degree = power of that highest derivative (3).<br>Other options: A — degree taken from dy/dx; B — both taken from the first-order term; D — order and degree swapped.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-36","m":1,"o":["x²","1/x²","2 ln x","e^(2x)"],"q":"<p>The integrating factor of dy/dx + (2/x) y = x is:<\/p>","a":0,"s":"<p>IF = e^(∫2/x dx) = e^(2 ln x) = x².<br>Other options: B — sign error; C — the exponent, not the factor; D — integrated 2/x as 2x.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-37","m":1,"o":["y = (C1 + C2 x) e^(2x)","y = C1 cos 2x + C2 sin 3x","y = C1 e^(2x) + C2 e^(3x)","y = C1 e^(−2x) + C2 e^(−3x)"],"q":"<p>The general solution of y″ − 5y′ + 6y = 0 is:<\/p>","a":2,"s":"<p>Auxiliary equation m² − 5m + 6 = 0 → m = 2, 3 (real, distinct).<br>Other options: A — the form for a repeated root; B — the form for complex roots; D — root signs reversed.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M1-38","m":1,"o":["11","12","8","10"],"q":"<p>The mean of five numbers is 12. If one number, 20, is removed, the mean of the remaining four numbers is:<\/p>","a":3,"s":"<p>Sum = 60; new sum = 40; mean = 40/4 = 10.<br>Other options: A — guessed halfway; B — assumed the mean is unchanged; C — subtracted 20 from 60 and divided by 5.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M1-39","m":1,"o":["1/9","1/6","7/36","5/36"],"q":"<p>Two fair dice are thrown. The probability that the sum is 8 is:<\/p>","a":3,"s":"<p>Favourable: (2,6), (3,5), (4,4), (5,3), (6,2) = 5 of 36.<br>Other options: A — 4/36, the double (4,4) missed; B — 6/36, the probability of a sum of 7; C — counted 7 cases.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M1-40","m":1,"o":["1/16","1/2","3/8","1/4"],"q":"<p>A fair coin is tossed 4 times. The probability of exactly 2 heads is:<\/p>","a":2,"s":"<p>P = 4C2 (1/2)⁴ = 6/16 = 3/8.<br>Other options: A — one sequence only; B — assumed half the outcomes; D — (1/2)² without the combinations.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M1-41","m":1,"o":["(√3 + 1)/2","(√6 + √2)/4","(√6 − √2)/4","√3/2"],"q":"<p>The exact value of sin 75° is:<\/p>","a":1,"s":"<p>sin(45° + 30°) = sin45 cos30 + cos45 sin30 = (√6 + √2)/4.<br>Other options: A — missing the 1/√2 factor; C — this is sin 15°; D — sin 60°.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M1-42","m":1,"o":["7/25","24/25","3/5","12/25"],"q":"<p>If tan θ = 3/4 and θ is acute, then sin 2θ is:<\/p>","a":1,"s":"<p>sin 2θ = 2 tan θ/(1 + tan²θ) = 1.5/(25/16) = 24/25.<br>Other options: A — this is cos 2θ; C — sin θ; D — sin θ cos θ without the 2.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M1-43","m":1,"o":["5","−3","7","3"],"q":"<p>The value of log₂ 32 + log₃ (1/9) is:<\/p>","a":3,"s":"<p>log₂ 32 = 5 and log₃ (1/9) = −2, so the sum is 3.<br>Other options: A — first term only; B — sign of both terms reversed; C — took log₃(1/9) as +2.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M1-44","m":1,"o":["x = nπ + (−1)ⁿ π/6","x = nπ + π/6","x = 2nπ ± π/6","x = nπ ± π/3"],"q":"<p>The general solution of sin x = 1/2 is:<\/p>","a":0,"s":"<p>sin x = sin α gives x = nπ + (−1)ⁿ α with α = π/6.<br>Other options: B — the form for tan x = tan α; C — the form for cos x = cos α; D — wrong principal angle and form.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M1-45","m":1,"o":["1/(s − 2)²","1/(s + 2)²","1/(s − 2)","2/(s − 2)²"],"q":"<p>The Laplace transform of t e^(2t) is:<\/p>","a":0,"s":"<p>L{t} = 1/s²; first shifting theorem replaces s by s − 2.<br>Other options: B — shifted the wrong way; C — transform of e^(2t) alone; D — extra factor 2.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M1-46","m":1,"o":["cos 2t","sin 2t","(1/2) cos 2t","(1/2) sin 2t"],"q":"<p>The inverse Laplace transform of 1/(s² + 4) is:<\/p>","a":3,"s":"<p>L{sin at} = a/(s² + a²), so 1/(s² + 4) = ½ × 2/(s² + 4) → ½ sin 2t.<br>Other options: A, C — cosine transforms have s in the numerator; B — missing the ½.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M1-47","m":1,"o":["sF(s) − f(0)","s²F(s) − s f(0) − f′(0)","F(s)/s","sF(s) + f(0)"],"q":"<p>If L{f(t)} = F(s), then L{f′(t)} equals:<\/p>","a":0,"s":"<p>Integration by parts of ∫e^(−st) f′(t) dt gives sF(s) − f(0).<br>Other options: B — transform of f″(t); C — transform of the integral of f; D — sign of f(0) wrong.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M1-48","m":1,"o":["Only cosine terms and a constant","Only a constant term","Both sine and cosine terms","Only sine terms"],"q":"<p>The Fourier series of f(x) = x on the interval (−π, π) contains:<\/p>","a":3,"s":"<p>f(x) = x is odd, so a0 = an = 0 and only the bn sin nx terms remain.<br>Other options: A — true for even functions; B — f is not constant; C — needed only when f is neither even nor odd.<\/p>","tag":"Sub-chapter 2.7"}]},{"t":"Section B · Structural Engineering (Q49–58)","qs":[{"id":"M1-49","m":1,"o":["6.37 mm","0.159 mm","1.59 mm","0.40 mm"],"q":"<p>A steel bar 2 m long and 20 mm in diameter carries an axial tensile load of 50 kN. Taking E = 200 GPa, its elongation is:<\/p>","a":2,"s":"<p>A = π × 10² = 314.2 mm²; δ = PL/(AE) = 50 000 × 2000/(314.2 × 200 000) = 1.59 mm.<br>Other options: A — used A = πr²/4; B — slipped a factor of 10 in units; D — used the diameter as the radius.<\/p>","tag":"Sub-chapter 3.1"},{"id":"M1-50","m":1,"o":["133.3 GPa","100 GPa","80 GPa","160 GPa"],"q":"<p>For a material with E = 200 GPa and Poisson&#x27;s ratio 0.25, the modulus of rigidity G is:<\/p>","a":2,"s":"<p>E = 2G(1 + μ) → G = 200/(2 × 1.25) = 80 GPa.<br>Other options: A — this is the bulk modulus E/[3(1 − 2μ)]; B — E/2; D — E/(1 + μ), the 2 dropped.<\/p>","tag":"Sub-chapter 3.1"},{"id":"M1-51","m":1,"o":["PL³/(3EI)","PL³/(48EI)","5PL³/(384EI)","PL³/(192EI)"],"q":"<p>The maximum deflection of a simply supported beam of span L carrying a central point load P (flexural rigidity EI) is:<\/p>","a":1,"s":"<p>Standard result for a simply supported beam with central load.<br>Other options: A — cantilever with end load; C — the coefficient belongs to a UDL (5wL⁴/384EI); D — fixed-ended beam with central load.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M1-52","m":1,"o":["90 kNm","180 kNm","60 kNm","360 kNm"],"q":"<p>A simply supported beam of 6 m span carries a uniformly distributed load of 20 kN/m over its whole length. The maximum bending moment is:<\/p>","a":0,"s":"<p>M max = wL²/8 = 20 × 36/8 = 90 kNm at mid-span.<br>Other options: B — used wL²/4; C — the support reaction wL/2 in kN; D — wL²/2, the cantilever value.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M1-53","m":1,"o":["3","2","6","1"],"q":"<p>The degree of static indeterminacy of a beam fixed at both ends, under general in-plane loading, is:<\/p>","a":0,"s":"<p>6 reactions (3 at each fixed end) − 3 equilibrium equations = 3.<br>Other options: B — the value when only vertical loads act (axial reactions ignored); C — the number of reactions; D — a propped cantilever.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M1-54","m":1,"o":["PL/(2AE)","P²L/(AE)","P²L/(2AE)","P²L²/(2AE)"],"q":"<p>The strain energy stored in a prismatic bar of length L, area A and modulus E under an axial load P is:<\/p>","a":2,"s":"<p>U = ½ P δ = ½ P × PL/(AE).<br>Other options: A — this is δ/2, not energy; B — missing the ½ (load not applied gradually); D — L squared wrongly.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M1-55","m":1,"o":["30 kNm","15 kNm","60 kNm","20 kNm"],"q":"<p>A fixed-ended beam of 6 m span carries a central point load of 40 kN. The fixed-end moment at each support is:<\/p>","a":0,"s":"<p>FEM = PL/8 = 40 × 6/8 = 30 kNm (hogging) at each end.<br>Other options: B — PL/16; C — PL/4, the simply supported mid-span moment; D — PL/12 (the UDL coefficient applied to P).<\/p>","tag":"Sub-chapter 3.4"},{"id":"M1-56","m":1,"o":["1","3/4","0","1/2"],"q":"<p>In the moment distribution method, the carry-over factor from the near end to the far end of a prismatic member whose far end is fixed is:<\/p>","a":
