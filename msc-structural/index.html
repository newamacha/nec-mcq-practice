,"m":1,"o":["4/25","2/5","1/15","2/15"],"q":"<p>A bag has 4 red and 6 blue balls. Two balls are drawn without replacement. The probability that both are red is:<\/p>","a":3,"s":"<p>4/10 × 3/9 = 12/90 = 2/15.<br>Other options: A — with replacement (4/10)²; B — probability of one red only; C — half the correct value.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M3-41","m":1,"o":["7/25","24/25","−7/25","6/5"],"q":"<p>If cos A = 3/5, then cos 2A is:<\/p>","a":2,"s":"<p>cos 2A = 2cos²A − 1 = 18/25 − 1 = −7/25.<br>Other options: A — sign lost; B — sin 2A; D — 2 cos A.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M3-42","m":1,"o":["60°","30°","45°","90°"],"q":"<p>If tan A = 1/2 and tan B = 1/3 (A, B acute), then A + B equals:<\/p>","a":2,"s":"<p>tan(A + B) = (1/2 + 1/3)/(1 − 1/6) = (5/6)/(5/6) = 1.<br>Other options: A — tan⁻¹ √3; B — tan⁻¹ (1/√3); D — would need the denominator to be 0.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M3-43","m":1,"o":["0.7781","0.1436","1.3802","1.0791"],"q":"<p>Given log 2 = 0.3010 and log 3 = 0.4771, the value of log 12 is:<\/p>","a":3,"s":"<p>log 12 = 2 log 2 + log 3 = 0.6020 + 0.4771 = 1.0791.<br>Other options: A — log 6; B — product of the two logs; C — log 24.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M3-44","m":1,"o":["4π/3","2π/3","−π/3","π/3"],"q":"<p>The principal value of cos⁻¹(−1/2) is:<\/p>","a":1,"s":"<p>The principal range of cos⁻¹ is [0, π]; cos(2π/3) = −1/2.<br>Other options: A — also outside the principal range; C — outside [0, π]; D — cos⁻¹(1/2).<\/p>","tag":"Sub-chapter 2.6"},{"id":"M3-45","m":1,"o":["s/(s² − a²)","a/(s² − a²)","1/(s − a)","s/(s² + a²)"],"q":"<p>The Laplace transform of cosh at is:<\/p>","a":0,"s":"<p>cosh at = (e^(at) + e^(−at))/2 → ½[1/(s − a) + 1/(s + a)] = s/(s² − a²).<br>Other options: B — sinh at; C — e^(at); D — cos at.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M3-46","m":1,"o":["e^(−2t) cos 3t","e^(2t) cos 3t","e^(−2t) sin 3t","(1/3) e^(−2t) sin 3t"],"q":"<p>The inverse Laplace transform of (s + 2)/[(s + 2)² + 9] is:<\/p>","a":0,"s":"<p>s/(s² + 9) ↔ cos 3t; replacing s by s + 2 multiplies by e^(−2t).<br>Other options: B — shift direction reversed; C — the sine form would have 3 in the numerator; D — inverse of 1/[(s + 2)² + 9].<\/p>","tag":"Sub-chapter 2.7"},{"id":"M3-47","m":1,"o":["1/s","e^(−as)","e^(as)/s","e^(−as)/s"],"q":"<p>The Laplace transform of the unit step function u(t − a), a &gt; 0, is:<\/p>","a":3,"s":"<p>∫ from a to ∞ of e^(−st) dt = e^(−as)/s.<br>Other options: A — the step at t = 0; B — transform of the delta function δ(t − a); C — sign of exponent wrong.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M3-48","m":1,"o":["A constant","An odd function","Zero","An even function"],"q":"<p>To obtain a half-range cosine series of f(x) defined on (0, L), the function is extended to (−L, 0) as:<\/p>","a":3,"s":"<p>An even extension makes all bn = 0, leaving a cosine series.<br>Other options: A, C — do not reproduce f on (0, L) as a cosine series; B — gives the half-range sine series.<\/p>","tag":"Sub-chapter 2.7"}]},{"t":"Section B · Structural Engineering (Q49–58)","qs":[{"id":"M3-49","m":1,"o":["0.0015 mm","0.050 mm","0.015 mm","0.150 mm"],"q":"<p>A steel rod of 50 mm diameter has an axial tensile strain of 0.001. If Poisson&#x27;s ratio is 0.3, its diameter decreases by:<\/p>","a":2,"s":"<p>Lateral strain = μ × axial strain = 0.0003; Δd = 0.0003 × 50 = 0.015 mm.<br>Other options: A — a factor-of-10 slip; B — axial strain × d (Poisson&#x27;s ratio ignored); D — μ × d × 0.01.<\/p>","tag":"Sub-chapter 3.1"},{"id":"M3-50","m":1,"o":["50 MPa","100 MPa","200 MPa","25 MPa"],"q":"<p>A thin cylindrical shell of 1 m internal diameter and 10 mm wall thickness carries an internal pressure of 2 MPa. The hoop (circumferential) stress is:<\/p>","a":1,"s":"<p>σh = pD/(2t) = 2 × 1000/(2 × 10) = 100 MPa.<br>Other options: A — the longitudinal stress pD/(4t); C — the 2 omitted; D — pD/(8t).<\/p>","tag":"Sub-chapter 3.1"},{"id":"M3-51","m":1,"o":["1.5 MPa","15.0 MPa","7.5 MPa","30.0 MPa"],"q":"<p>A rectangular beam 200 mm wide and 400 mm deep carries a bending moment of 80 kNm. The maximum bending stress is:<\/p>","a":1,"s":"<p>Z = bd²/6 = 200 × 400²/6 = 5.333 × 10⁶ mm³; σ = M/Z = 15.0 MPa.<br>Other options: A — a factor-of-10 slip; C — Z taken as bd²/3; D — b and d interchanged.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M3-52","m":1,"o":["2 times the average shear stress, at the top fibre","Equal to the average shear stress, uniform over the depth","1.5 times the average shear stress, at the neutral axis","4/3 times the average shear stress, at the neutral axis"],"q":"<p>For a beam of rectangular cross-section, the maximum shear stress is:<\/p>","a":2,"s":"<p>τ = VQ/(Ib) gives a parabolic distribution, peaking at the neutral axis at 3V/(2bd).<br>Other options: A — shear stress is zero at the extreme fibres; B — the distribution is parabolic, not uniform; D — the value for a solid circular section.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M3-53","m":1,"o":["∂U/∂P, the partial derivative of strain energy with respect to P","U/P, the strain energy divided by P","∂P/∂U, the derivative of load with respect to strain energy","P × U, load times strain energy"],"q":"<p>According to Castigliano&#x27;s theorem, the deflection of a linearly elastic structure at the point and in the direction of a load P equals:<\/p>","a":0,"s":"<p>δ = ∂U/∂P; similarly the rotation under a couple M is ∂U/∂M.<br>Other options: B — dimensionally a length but not the theorem (it would give δ/2 for a linear system); C, D — not the theorem.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M3-54","m":1,"o":["1","2","0","4"],"q":"<p>A pin-jointed plane truss has 10 members, 6 joints and 3 support reaction components. Its total degree of static indeterminacy is:<\/p>","a":0,"s":"<p>D = (m + r) − 2j = 13 − 12 = 1.<br>Other options: B — counted reactions twice; C — would need m + r = 2j; D — m − j.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M3-55","m":1,"o":["16 kNm","24 kNm","64 kNm","32 kNm"],"q":"<p>A prismatic member 5 m long with EI = 20 000 kNm² has its far end fixed. The moment needed at the near end to rotate it by 0.002 rad (no translation) is:<\/p>","a":3,"s":"<p>M = (4EI/L) θ = 4 × 20 000 × 0.002/5 = 32 kNm.<br>Other options: A — 2EI/L, the carried-over moment; B — 3EI/L, the stiffness for a hinged far end; C — 8EI/L.<\/p>","tag":"Sub-chapter 3.4"},{"id":"M3-56","m":1,"o":["1","0","0.5","Equal to the number of members"],"q":"<p>In the moment distribution method, the sum of the distribution factors of all members meeting at a rigid joint (not at a support) is:<\/p>","a":0,"s":"<p>The unbalanced moment is shared among the members in proportion to their stiffness; the shares add up to the whole.<br>Other options: B — nothing would be distributed; C — the carry-over factor; D — each factor is less than 1.<\/p>","tag":"Sub-chapter 3.4"},{"id":"M3-57","m":1,"o":["125 kN","100 kN","62.5 kN","250 kN"],"q":"<p>A three-hinged parabolic arch of 20 m span and 4 m central rise carries a UDL of 10 kN/m over the whole span. The horizontal thrust at each support is:<\/p>","a":0,"s":"<p>H = wL²/(8h) = 10 × 400/32 = 125 kN.<br>Other options: B — the vertical reaction wL/2; C — wL²/(16h); D — wL²/(4h).<\/p>","tag":"Sub-chapter 3.5"},{"id":"M3-58","m":1,"o":["r − 1","r + 1","r","2r"],"q":"<p>For a structure with degree of static indeterminacy r, the number of plastic hinges needed for a complete collapse mechanism is:<\/p>","a":1,"s":"<p>Each hinge removes one redundancy; one more makes the structure a mechanism (e.g. fixed beam: r = 2 for vertical loads, 3 hinges).<br>Other options: A, D — do not match the fixed-beam case; C — the structure becomes just statically determinate.<\/p>","tag":"Sub-chapter 3.6"}]},{"t":"Section B · Geotechnical Engineering (Q59–68)","qs":[{"id":"M3-59","m":1,"o":["21.43 kN/m³","18.64 kN/m³","15.84 kN/m³","16.21 kN/m³"],"q":"<p>A soil sample of volume 1000 cm³ has a mass of 1.9 kg and a water content of 15%. Its dry unit weight (g = 9.81 m/s²) is:<\/p>","a":3,"s":"<p>γ = 1.9 g/cm³ × 9.81 = 18.64 kN/m³; γd = γ/(1 + w) = 16.21 kN/m³.<br>Other options: A — multiplied by (1 + w); B — the bulk unit weight; C — multiplied by (1 − w).<\/p>","tag":"Sub-chapter 4.1"},{"id":"M3-60","m":1,"o":["(e max − e)/(e max − e min)","(LL − w)/PI","(e − e min)/(e max − e min)","e/(1 + e)"],"q":"<p>The relative density (density index) of a cohesionless soil is defined as:<\/p>","a":0,"s":"<p>It compares the natural void ratio with the loosest and densest states: 0 = loosest, 1 = densest.<br>Other options: B — consistency index for clays; C — measures looseness, the complement; D — porosity.<\/p>","tag":"Sub-chapter 4.1"},{"id":"M3-61","m":1,"o":["Neither changes","Maximum dry density decreases and optimum moisture content increases","Both maximum dry density and optimum moisture content increase","Maximum dry density increases and optimum moisture content decreases"],"q":"<p>When the compactive effort on a soil is increased (e.g. from standard to modified Proctor):<\/p>","a":3,"s":"<p>Greater energy packs particles closer at lower water content; the curve shifts up and to the left.<br>Other options: A — both change; B — the opposite trend; C — OMC falls, not rises.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M3-62","m":1,"o":["64.33 kPa","124.00 kPa","84.76 kPa","163.24 kPa"],"q":"<p>A soil profile has 3 m of dry sand (γ = 16 kN/m³) over 4 m of saturated sand (γsat = 19 kN/m³), with the water table at 3 m depth. The effective vertical stress at 7 m depth (γw = 9.81 kN/m³) is:<\/p>","a":2,"s":"<p>σ = 3 × 16 + 4 × 19 = 124 kPa; u = 4 × 9.81 = 39.24 kPa; σ′ = 84.76 kPa.<br>Other options: A — whole depth treated as submerged; B — total stress; D — pore pressure added instead of subtracted.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M3-63","m":1,"o":["The vertical stress below a uniformly loaded area of any shape","The coefficient of consolidation from a test curve","The bearing capacity of a pile group","The factor of safety of a finite slope"],"q":"<p>Newmark&#x27;s influence chart is used to find:<\/p>","a":0,"s":"<p>The loaded area is drawn to scale on the chart; stress = q × number of blocks covered × influence value.<br>Other options: B — Casagrande&#x27;s or Taylor&#x27;s fitting method; C — group-efficiency methods; D — slope stability charts (e.g. Taylor&#x27;s).<\/p>","tag":"Sub-chapter 4.3"},{"id":"M3-64","m":1,"o":["0.88 years","2.25 years","3.53 years","0.29 years"],"q":"<p>A clay layer 6 m thick, drained at top and bottom, has cv = 2 m²/year. Using Tv = (π/4)U² for U &lt; 60%, the time for 50% consolidation is about:<\/p>","a":0,"s":"<p>Tv = (π/4)(0.5)² = 0.196; d = 3 m; t = Tv d²/cv = 0.196 × 9/2 = 0.88 years.<br>Other options: B — Tv taken equal to U; C — used d = 6 m (single drainage); D — d not squared.<\/p>","tag":"Sub-chapter 4.3"},{"id":"M3-65","m":1,"o":["c = 30 kPa, φ = 30.0°","c = 30 kPa, φ = 26.6°","c = 50 kPa, φ = 26.6°","c = 0, φ = 38.7°"],"q":"<p>Two direct-shear tests on a soil give failure shear stresses of 80 kPa at normal stress 100 kPa and 130 kPa at normal stress 200 kPa. The shear-strength parameters are:<\/p>","a":1,"s":"<p>tan φ = (130 − 80)/(200 − 100) = 0.5 → φ = 26.6°; c = 80 − 100 × 0.5 = 30 kPa.<br>Other options: A — φ guessed, not from the slope; C — c taken as the difference 130 − 80; D — first test only, line forced through the origin.<\/p>","tag":"Sub-chapter 4.4"},{"id":"M3-66","m":1,"o":["0.67","1.50","1.36","1.40"],"q":"<p>An infinite slope of dry cohesionless soil (φ = 35°) is inclined at 25° to the horizontal. Its factor of safety is about:<\/p>","a":1,"s":"<p>F = tan φ/tan β = tan 35°/tan 25° = 1.50.<br>Other options: A — ratio inverted; C — ratio of sines; D — ratio of angles instead of tangents.<\/p>","tag":"Sub-chapter 4.4"},{"id":"M3-67","m":1,"o":["The first 300 mm of a 450 mm penetration","The first 150 mm of penetration","The last 300 mm of a 450 mm total penetration","The full 450 mm of penetration"],"q":"<p>In the Standard Penetration Test, the N-value is the number of hammer blows required to drive the split-spoon sampler:<\/p>","a":2,"s":"<p>The first 150 mm is a seating drive (disturbed soil at the borehole bottom) and is not counted.<br>Other options: A — includes the seating drive and omits the last 150 mm; B — the seating drive only; D — includes the seating drive.<\/p>","tag":"Sub-chapter 4.5"},{"id":"M3-68","m":1,"o":["Hard rock at the ground surface","Very loose saturated sand below the water table","Deep soft marine clay where friction piles are long","Expansive (black cotton) soils"],"q":"<p>Under-reamed piles are especially suited to:<\/p>","a":3,"s":"<p>The enlarged bulb anchors the pile below the zone of seasonal swelling and shrinkage, resisting uplift.<br>Other options: A — no pile needed; B — bulbs are hard to form and unstable there; C — under-reamed piles are short, typically a few metres.<\/p>","tag":"Sub-chapter 4.6"}]},{"t":"Section B · Water Resources Engineering (Q69–78)","qs":[{"id":"M3-69","m":1,"o":["0.30 m","0.83 m","0.50 m","0.20 m"],"q":"<p>A wooden block 0.5 m thick (specific gravity 0.6) floats in fresh water with its large face horizontal. The depth of immersion is:<\/p>","a":0,"s":"<p>Weight = buoyancy: 0.6 × 0.5 = 1.0 × d → d = 0.30 m.<br>Other options: B — 0.5/0.6, ratio inverted; C — full thickness (sinks level with the surface); D — the height above water.<\/p>","tag":"Sub-chapter 5.1"},{"id":"M3-70","m":1,"o":["Directly proportional to the tube diameter","Inversely proportional to the tube diameter","Independent of the tube diameter","Proportional to the square of the diameter"],"q":"<p>The capillary rise of water in a clean glass tube is:<\/p>","a":1,"s":"<p>h = 4σ cos θ/(γ d): halving the diameter doubles the rise.<br>Other options: A, C, D — contradict h ∝ 1/d.<\/p>","tag":"Sub-chapter 5.1"},{"id":"M3-71","m":1,"o":["0.99 m/s","1.98 m/s","1.40 m/s","3.92 m/s"],"q":"<p>A Pitot tube in a water stream shows a difference of 0.2 m between the stagnation and static heads. The stream velocity (g = 9.81 m/s²) is about:<\/p>","a":1,"s":"<p>V = √(2gh) = √(2 × 9.81 × 0.2) = 1.98 m/s.<br>Other options: A — halved; C — √(gh), the 2 omitted; D — 2gh without the square root.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M3-72","m":1,"o":["64/Re","16/Re","0.316/Re^0.25","Independent of Re"],"q":"<p>For fully developed laminar flow in a circular pipe, the Darcy friction factor is:<\/p>","a":0,"s":"<p>From Hagen–Poiseuille: hf = 32μLV/(γD²), which gives f = 64/Re.<br>Other options: B — the Fanning friction factor (¼ of Darcy&#x27;s); C — Blasius equation for smooth turbulent flow; D — true only for fully rough turbulent flow.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M3-73","m":1,"o":["0.74, subcritical","1.35, subcritical","1.92, supercritical","1.35, supercritical"],"q":"<p>Water flows at 3 m/s and 0.5 m depth in a wide rectangular channel (g = 9.81 m/s²). The Froude number and flow regime are:<\/p>","a":3,"s":"<p>Fr = V/√(gy) = 3/√(4.905) = 1.35 &gt; 1, so supercritical.<br>Other options: A — ratio inverted; B — Fr &gt; 1 is supercritical, not subcritical; C — used y/2.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M3-74","m":1,"o":["0.65 m³/s","1.83 m³/s","1.29 m³/s","1.94 m³/s"],"q":"<p>A rectangular sharp-crested weir 2 m long (no end contractions, Cd = 0.62) runs under a head of 0.5 m. Using Q = (2/3) Cd √(2g) L H^(3/2) with g = 9.81 m/s², the discharge is about:<\/p>","a":2,"s":"<p>Q = (2/3) × 0.62 × 4.429 × 2 × 0.5^1.5 = 1.29 m³/s.<br>Other options: A — L taken as 1 m; B — H used instead of H^(3/2); D — the 2/3 omitted.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M3-75","m":1,"o":["Froude similarity is ignored","The horizontal and vertical length scales are different","The fluid in the model differs from the prototype","The model is built at full size"],"q":"<p>A distorted hydraulic model is one in which:<\/p>","a":1,"s":"<p>River and estuary models use a smaller horizontal scale so that model depths stay large enough to avoid surface-tension and laminar effects.<br>Other options: A — river models still use Froude similarity; C — not what &#x27;distorted&#x27; means; D — that is a prototype.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M3-76","m":1,"o":["Flows at critical depth everywhere","Carries no sediment at all","Has a rigid lined boundary","Neither silts nor scours over a period of time"],"q":"<p>According to Lacey&#x27;s regime theory, an alluvial channel is in &#x27;regime&#x27; when it:<\/p>","a":3,"s":"<p>In regime the channel adjusts its width, depth and slope so that the sediment carried in equals the sediment carried out.<br>Other options: A — not part of the theory; B — regime channels do carry sediment; C — Lacey&#x27;s theory is for mobile (alluvial) boundaries.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M3-77","m":1,"o":["72 mm","68 mm","70 mm","64 mm"],"q":"<p>Three rain gauges record 50, 70 and 90 mm; their Thiessen polygon areas are 30%, 50% and 20% of the catchment. The mean areal rainfall is:<\/p>","a":1,"s":"<p>P = 0.3 × 50 + 0.5 × 70 + 0.2 × 90 = 15 + 35 + 18 = 68 mm.<br>Other options: A — weights of the 50 and 90 mm gauges swapped; C — arithmetic mean; D — weights of the 50 and 70 mm gauges swapped.<\/p>","tag":"Sub-chapter 5.5"},{"id":"M3-78","m":1,"o":["S = K[xI + (1 − x)O]","S = (I − O)/K","S = K × I only","S = K × O only, with x = 1"],"q":"<p>In the Muskingum method of flood routing, the channel storage is expressed as:<\/p>","a":0,"s":"<p>Storage is a weighted mix of prism (outflow) and wedge (inflow) storage; x is between 0 and 0.5.<br>Other options: B — dimensionally wrong; C — ignores outflow; D — with x = 1 the Muskingum form gives S = KI, not KO (S = KO is the x = 0 linear reservoir).<\/p>","tag":"Sub-chapter 5.6"}]},{"t":"Section B · Transportation Engineering (Q79–88)","qs":[{"id":"M3-79","m":1,"o":["Siddhartha Highway","Tribhuvan Rajpath","Prithvi Highway","B.P. Koirala Highway"],"q":"<p>The first motorable road linking Kathmandu with the Terai, completed in the mid-1950s via Daman, is the:<\/p>","a":1,"s":"<p>The Tribhuvan Rajpath (Kathmandu–Hetauda–Bhainse) was Nepal&#x27;s first long motorable road to the plains.<br>Other options: A — Pokhara–Butwal–Bhairahawa; C — Kathmandu–Pokhara, built later; D — the Banepa–Sindhuli–Bardibas road, completed much later.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M3-80","m":1,"o":["Steepest gradient allowed for short stretches in exceptional cases","Gradient at which no tractive effort is needed","Maximum gradient used in normal design of the alignment","Minimum gradient needed for drainage"],"q":"<p>In highway design, the ruling gradient is the:<\/p>","a":2,"s":"<p>It is the design gradient the alignment normally keeps within, set by terrain and vehicle performance.<br>Other options: A — limiting/exceptional gradient; B — floating gradient; D — minimum gradient.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M3-81","m":1,"o":["73.2 m","3413 m","146.3 m","36.6 m"],"q":"<p>A transition curve is designed for 80 km/h on a circular curve of 300 m radius with an allowable rate of change of centripetal acceleration C = 0.5 m/s³. Using L = v³/(CR), the length is about:<\/p>","a":0,"s":"<p>v = 80/3.6 = 22.22 m/s; L = 22.22³/(0.5 × 300) = 73.2 m.<br>Other options: B — V left in km/h; C — C taken as 0.25; D — C taken as 1.0.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M3-82","m":1,"o":["4.6%","7.0%","5.0%","6.0%"],"q":"<p>A 6% ruling gradient meets a horizontal curve of 75 m radius. Using the IRC grade-compensation rule (30 + R)/R %, limited to 75/R %, the compensated gradient on the curve is:<\/p>","a":2,"s":"<p>(30 + 75)/75 = 1.4% but the limit is 75/75 = 1.0%, so 6 − 1 = 5.0%.<br>Other options: A — the 75/R limit ignored; B — compensation added instead of subtracted; D — no compensation.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M3-83","m":1,"o":["Testing the flexural strength of pavement concrete","Measuring the hardness of aggregates","Mix design of bituminous concrete (stability and flow)","Determining the CBR of subgrade soil"],"q":"<p>The Marshall test is used for:<\/p>","a":2,"s":"<p>Compacted bituminous specimens are tested at 60 °C for stability (load) and flow (deformation) to fix the optimum binder content.<br>Other options: A — modulus-of-rupture beam test; B — Los Angeles abrasion test; D — CBR test.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M3-84","m":1,"o":["1.8 times their mean dimension","0.6 times their mean dimension","0.6 times their greatest dimension","Half their length"],"q":"<p>The flakiness index of an aggregate is the percentage by weight of particles whose least dimension is less than:<\/p>","a":1,"s":"<p>Measured with a thickness gauge; flaky particles break easily and reduce interlock.<br>Other options: A — that defines elongated particles (length &gt; 1.8 × mean dimension); C, D — not the standard definition.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M3-85","m":1,"o":["2400 veh/h","8640 veh/h","1500 veh/h","150 veh/h"],"q":"<p>The average time headway between vehicles in a lane is 2.4 s. The flow is:<\/p>","a":2,"s":"<p>q = 3600/h = 3600/2.4 = 1500 veh/h.<br>Other options: A — headway digits read as flow; B — 3600 × 2.4 instead of 3600 ÷ 2.4; D — a factor-of-10 slip.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M3-86","m":1,"o":["30 veh/km","3 veh/km","0.033 veh/km","48 000 veh/km"],"q":"<p>A traffic stream has a flow of 1200 veh/h at a space-mean speed of 40 km/h. Its density is:<\/p>","a":0,"s":"<p>k = q/v = 1200/40 = 30 veh/km.<br>Other options: B — a factor-of-10 slip; C — v/q; D — q × v.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M3-87","m":1,"o":["Shear strain in the subgrade and thermal strain in the surface","Vertical tensile strain at the surface and horizontal compressive strain in the base","Horizontal compressive strain at the top of the surface course only","Horizontal tensile strain at the bottom of the bituminous layer and vertical compressive strain on top of the subgrade"],"q":"<p>In the mechanistic design of flexible pavements, the two critical strains usually checked are:<\/p>","a":3,"s":"<p>The first controls fatigue cracking; the second controls rutting.<br>Other options: A, B, C — not the standard fatigue and rutting criteria.<\/p>","tag":"Sub-chapter 6.5"},{"id":"M3-88","m":1,"o":["The cost of the superstructure is zero","All spans are as long as possible","The span equals the depth of scour","The cost of one span of superstructure equals the cost of one pier with its foundation"],"q":"<p>For a multi-span bridge, the economical span length is approximately the one at which:<\/p>","a":3,"s":"<p>Total cost is minimum when superstructure cost per span ≈ substructure cost per pier.<br>Other options: A — impossible; B — very long spans make the superstructure too costly; C — scour sets foundation depth, not span.<\/p>","tag":"Sub-chapter 6.6"}]},{"t":"Section B · Water Supply and Sanitary Engineering (Q89–98)","qs":[{"id":"M3-89","m":1,"o":["64 mg/L","100 mg/L","200 mg/L","160 mg/L"],"q":"<p>A water sample contains 40 mg/L of Ca²⁺ and 24 mg/L of Mg²⁺. Its total hardness as CaCO₃ is:<\/p>","a":2,"s":"<p>Hardness = 40 × 50/20 + 24 × 50/12 = 100 + 100 = 200 mg/L as CaCO₃ (equivalent weights 20, 12 and 50).<br>Other options: A — ions added without conversion; B — Ca²⁺ only, Mg²⁺ ignored; D — Mg converted with factor 50/20.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M3-90","m":1,"o":["Hydrometer","Conductivity meter","pH meter","Nephelometer (light scattered at 90°)"],"q":"<p>Turbidity of water is measured in NTU using a:<\/p>","a":3,"s":"<p>NTU = nephelometric turbidity units: the intensity of light scattered by suspended particles.<br>Other options: A — measures specific gravity; B — measures dissolved ions; C — measures hydrogen-ion activity.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M3-91","m":1,"o":["Store water for fire fighting","Limit static pressure in the pipeline by resetting it to atmospheric","Treat water by sedimentation","Pump water to higher villages"],"q":"<p>In gravity water-supply schemes in the hills of Nepal, break-pressure tanks are provided to:<\/p>","a":1,"s":"<p>Long drops build up high static head; a break-pressure tank opens the line to atmosphere so cheaper low-pressure pipes can be used.<br>Other options: A, C — not their purpose (any settling is incidental); D — they work by gravity.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M3-92","m":1,"o":["203.9 m","101.9 m","2000 m","20.4 m"],"q":"<p>A valve at the end of a pipeline is closed suddenly while water flows at 2 m/s. If the pressure-wave speed is 1000 m/s (g = 9.81 m/s²), the water-hammer pressure rise in metres of water is about:<\/p>","a":0,"s":"<p>Joukowsky: Δh = cV/g = 1000 × 2/9.81 = 203.9 m.<br>Other options: B — halved; C — g omitted; D — a factor-of-10 slip.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M3-93","m":1,"o":["0.17 hours","6 hours","4 hours","2 hours"],"q":"<p>A settling tank of 600 m³ volume treats 3.6 MLD. Its detention time is:<\/p>","a":2,"s":"<p>3.6 MLD = 3600 m³/day = 150 m³/h; t = 600/150 = 4 h.<br>Other options: A — 600/3600 is in days, not hours; B — ratio inverted (3600/600); D — halved.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M3-94","m":1,"o":["Chlorination","Adding alum only","Plain sedimentation","Boiling"],"q":"<p>Temporary (carbonate) hardness of water can be removed by:<\/p>","a":3,"s":"<p>Boiling decomposes bicarbonates to insoluble CaCO₃ (and Mg(OH)₂), which precipitate.<br>Other options: A — a disinfectant; B — a coagulant, not a softener; C — dissolved ions do not settle.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M3-95","m":1,"o":["600 m³","1200 m³","2400 m³","100 m³"],"q":"<p>A town uses 100 m³/h uniformly over 24 hours. Water is pumped at a constant rate for 12 hours only (8 am to 8 pm). The balancing storage needed in the service reservoir is:<\/p>","a":1,"s":"<p>Pump rate = 2400/12 = 200 m³/h; surplus of 100 m³/h for 12 h fills 1200 m³, which supplies the 12 h without pumping.<br>Other options: A — half the needed storage; C — the whole daily demand; D — one hour&#x27;s demand.<\/p>","tag":"Sub-chapter 7.4"},{"id":"M3-96","m":1,"o":["Joins a manhole at a high level","Runs at a steep slope down a hill","Must pass below an obstruction such as a river or deep cutting","Is too small to carry peak flow"],"q":"<p>An inverted siphon (depressed sewer) is provided where a sewer:<\/p>","a":2,"s":"<p>It runs full under pressure below the obstruction and rises again on the other side.<br>Other options: A — that is a drop manhole; B — handled by drop manholes or steep sewers; D — needs a larger sewer.<\/p>","tag":"Sub-chapter 7.5"},{"id":"M3-97","m":1,"o":["1.00 per day","0.07 per day","0.33 per day","3.00 per day"],"q":"<p>An activated-sludge aeration tank of 1000 m³ treats 5000 m³/day of wastewater with BOD 200 mg/L. The MLSS is 3000 mg/L. The F/M ratio is:<\/p>","a":2,"s":"<p>F/M = QS0/(V X) = 5000 × 200/(1000 × 3000) = 0.33 d⁻¹.<br>Other options: A — MLSS taken as 1000 mg/L; B — S0/X only, flow and tank volume ignored; D — ratio inverted.<\/p>","tag":"Sub-chapter 7.6"},{"id":"M3-98","m":1,"o":["Fluoride levels in groundwater","The financial flow of a water-supply project","Routes of faecal–oral disease transmission (fluids, fields, flies, fingers, food)","The flow diagram of a treatment plant"],"q":"<p>In WASH programmes, the &#x27;F-diagram&#x27; is used to show:<\/p>","a":2,"s":"<p>It shows how pathogens in faeces reach a new host and where barriers (toilets, hand-washing, safe water) block them.<br>Other options: A, B, D — not what the F-diagram shows.<\/p>","tag":"Sub-chapter 7.6"}]}],"n":98,"marks":100}]};
const L = 'ABCD';
const store = {
  get(k){ try{ const v = localStorage.getItem('iosq:'+k); return v===null?null:+v }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('necq:'+k, v) }catch(e){} },
  del(k){ try{ localStorage.removeItem('necq:'+k) }catch(e){} }
};
const mem = {};
const pick = id => (id in mem) ? mem[id] : store.get(id);
const $ = s => document.querySelector(s);

// set picker
const sel = $('#set');
const og1 = document.createElement('optgroup'); og1.label = 'Chapters (30 questions per block)';
DATA.ch.forEach(c => og1.append(new Option(`Chapter ${c.n} · ${c.t}`, 'ch'+c.n)));
const og2 = document.createElement('optgroup'); og2.label = 'Mock exams (2 hours, 100 marks)';
DATA.mock.forEach(m => og2.append(new Option(`Mock exam ${m.m}`, 'mock'+m.m)));
sel.append(og1, og2);

let cur = null; // {kind, qs}
function route(){
  const h = location.hash.slice(1);
  let m = h.match(/^ch(\d+)-(\d+)$/), k = h.match(/^mock(\d)$/);
  if (k && DATA.mock[k[1]-1]) return show('mock', +k[1]);
  if (!m || !DATA.ch[m[1]-1]) m = [0, 1, 1];
  show('ch', +m[1], +m[2]);
}
function go(h){ if (location.hash !== '#'+h) location.hash = h; else route(); }
sel.onchange = () => go(sel.value.startsWith('ch') ? sel.value+'-1' : sel.value);
window.addEventListener('hashchange', route);

function show(kind, n, s){
  const list = $('#list'), subs = $('#subs'); list.innerHTML = ''; subs.innerHTML = '';
  if (kind === 'ch'){
    const c = DATA.ch[n-1]; sel.value = 'ch'+n; subs.hidden = false;
    c.subs.forEach((b, i) => {
      const bt = document.createElement('button'); bt.textContent = `${b.k} ${b.t}`; bt.setAttribute('role','tab');
      bt.setAttribute('aria-current', String(i+1 === s)); bt.onclick = () => go(`ch${n}-${i+1}`); subs.append(bt);
    });
    const b = c.subs[s-1];
    list.insertAdjacentHTML('beforeend', `<p class="intro">Chapter ${c.n} · <b>${b.k} ${esc(b.t)}</b> · ${b.qs.length} questions. Tick an option to check it.</p>`);
    b.qs.forEach(q => { q.p && list.insertAdjacentHTML('beforeend', `<div class="psg">${q.p}</div>`); list.append(card(q, 'Q'+q.id)); });
    cur = {kind, qs: b.qs, label: `${b.k} block`};
    const ac = subs.children[s-1]; ac && ac.scrollIntoView({block:'nearest', inline:'nearest'});
  } else {
    const m = DATA.mock[n-1]; sel.value = 'mock'+n; subs.hidden = true;
    list.insertAdjacentHTML('beforeend', `<p class="intro">Mock exam ${m.m}: ${m.n} questions, ${m.marks} marks, laid out like the IOE paper. Wrong answers cost 10% of the question's mark, blanks cost nothing. Set a 2-hour timer.</p>`);
    let k = 0, all = [];
    m.secs.forEach(sec => {
      list.insertAdjacentHTML('beforeend', `<h2>${esc(sec.t)}</h2>`);
      sec.qs.forEach(q => { k++; q.p && list.insertAdjacentHTML('beforeend', `<div class="psg">${q.p}</div>`); list.append(card(q, 'Q'+k)); all.push(q); });
    });
    list.insertAdjacentHTML('beforeend', '<div class="result" id="result"></div>');
    cur = {kind, qs: all, label: 'mock exam'};
  }
  score(); window.scrollTo(0, 0);
}
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function card(q, label){
  const el = document.createElement('article'); el.className = 'card'; el.id = 'q-'+q.id;
  el.innerHTML = `<div class="meta"><span class="id">${label}</span><span>${q.m} mark${q.m>1?'s':''}</span>${q.tag?`<span class="chip">${esc(q.tag)}</span>`:''}</div>
    <div class="stem">${q.q}</div>
    <div class="opts" role="group" aria-label="Options for ${label}">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="box" aria-hidden="true"></span><span class="t"><span class="l">${L[i]}.</span>${o}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { mem[q.id] = +b.dataset.i; store.set(q.id, b.dataset.i); paint(el, q); score(); });
  paint(el, q); return el;
}
function paint(el, q){
  const p = pick(q.id), btns = el.querySelectorAll('.opt'), old = el.querySelector('.fb'); old && old.remove();
  btns.forEach((b, i) => { b.className = 'opt'; b.disabled = p !== null; b.querySelector('.box').textContent = ''; b.removeAttribute('aria-label'); });
  el.classList.toggle('done', p !== null);
  if (p === null) return;
  const right = btns[q.a]; right.classList.add('right'); right.querySelector('.box').textContent = '✓';
  const ans = `${L[q.a]}. ${right.querySelector('.t').innerHTML.replace(/^<span class="l">[A-D]\.<\/span>/, '')}`;
  const fb = document.createElement('div');
  if (p === q.a){
    right.setAttribute('aria-label', 'Your answer, correct');
    fb.className = 'fb ok';
    fb.innerHTML = `<div class="h">✓ Correct</div><details><summary>Show explanation</summary>${q.s}</details>`;
  } else {
    const w = btns[p]; w.classList.add('wrong'); w.querySelector('.box').textContent = '✗'; w.setAttribute('aria-label', 'Your answer, wrong');
    fb.className = 'fb bad';
    fb.innerHTML = `<div class="h">✗ Wrong. Correct answer: ${ans}</div>${q.s}`;
  }
  el.append(fb);
}
function score(){
  const qs = cur.qs, n = qs.length; let a = 0, c = 0, net = 0, full = 0;
  qs.forEach(q => { full += q.m; const p = pick(q.id); if (p !== null){ a++; if (p === q.a){ c++; net += q.m; } else net -= q.m/10; } });
  net = Math.round(net*10)/10;
  const pct = a ? Math.round(c*100/a) : 0;
  $('#score').innerHTML = `<span>Answered <b>${a}/${n}</b></span><span>Correct <b>${c}</b> · Wrong <b>${a-c}</b></span><span>Score <b>${a?pct+'%':'–'}</b></span><span>Net <b>${a?net:'–'}</b> (−10%/wrong)</span>
    <span class="bar" aria-hidden="true"><i class="c" style="width:${c*100/n}%"></i><i class="w" style="width:${(a-c)*100/n}%"></i></span>
    <button class="reset" id="reset" type="button">Reset this ${cur.label}</button>`;
  const r = $('#reset'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.classList.add('arm'); r.textContent = 'Tap again to clear your answers'; setTimeout(()=>{ if (armed){ armed=false; r.classList.remove('arm'); r.textContent=`Reset this ${cur.label}`; } }, 3500); return; }
    qs.forEach(q => { delete mem[q.id]; store.del(q.id); });
    document.querySelectorAll('.card').forEach(el => { const q = qs.find(x => 'q-'+x.id === el.id); q && paint(el, q); });
    score();
  };
  const res = $('#result');
  if (res){
    res.innerHTML = a < n ? `${n-a} questions left. Your net score so far: <b>${net}/${full}</b>. You can stop any time (blanks score 0).`
      : `Result: <b class="${net>=60?'pass':'fail'}">${net}/${full} net</b> (${c} right, ${a-c} wrong). ${net>=60?'Strong score: admission is by rank, keep pushing.':'Aim for 60+ net: revise the sub-chapters named in the wrong answers.'}`;
  }
}
route();
</script>
</body></html>
