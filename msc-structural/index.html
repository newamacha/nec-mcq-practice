ater jetting and pulling on the higher side also help.<br>Other options: B — this increases the tilt; C — pushes the low side further down; D — locks in the tilt.<\/p>","tag":""},{"id":"4.6.19","m":1,"o":["Increase the final consolidation settlement","Reduce permeability of the clay","Prevent any settlement","Shorten the drainage path so that consolidation occurs faster (largely radial flow)"],"q":"<p>Sand drains installed in a thick soft clay deposit mainly:<\/p>","a":3,"s":"<p>Radial drainage to closely spaced drains (Barron&#x27;s theory) greatly reduces consolidation time.<br>Other options: A — final settlement depends on load, not drains; B — they provide drainage, not sealing; C — settlement still occurs, only faster.<\/p>","tag":""},{"id":"4.6.20","m":1,"o":["Injecting cement grout into the soil","Applying a temporary surcharge before construction so that settlement takes place in advance","Vibrating a probe to densify sand","Freezing pore water"],"q":"<p>Preloading as a ground-improvement technique involves:<\/p>","a":1,"s":"<p>The clay consolidates (often with vertical drains) under the surcharge, which is removed before the structure is built.<br>Other options: A — that is grouting; C — that is vibroflotation; D — that is ground freezing.<\/p>","tag":""},{"id":"4.6.21","m":1,"o":["Soft saturated clays","Organic peat","Loose clean sands","Stiff overconsolidated clay"],"q":"<p>Vibroflotation is most effective for densifying:<\/p>","a":2,"s":"<p>Vibration rearranges cohesionless grains into a denser packing; fines content should be low.<br>Other options: A — vibration does not densify clay; B — unsuitable; D — cannot be densified by vibration.<\/p>","tag":""},{"id":"4.6.22","m":1,"o":["Make the soil impermeable","Reduce the shear strength of the soil","Increase bearing capacity, reduce settlement and provide radial drainage","Lower the water table permanently"],"q":"<p>Stone columns are mainly used in soft clays and loose silty soils to:<\/p>","a":2,"s":"<p>Compacted gravel columns act as stiff reinforcing elements and vertical drains.<br>Other options: A — they increase drainage; B — they increase composite strength; D — not their function.<\/p>","tag":""},{"id":"4.6.23","m":1,"o":["Coarse gravels","Silts and clays","Fissured rock","Coarse sands"],"q":"<p>Cement grouting by permeation is generally unsuitable for:<\/p>","a":1,"s":"<p>Cement particles cannot enter the tiny pores of fine soils; chemical grouts or other methods are used instead.<br>Other options: A — readily groutable; C — commonly grouted; D — groutable.<\/p>","tag":""},{"id":"4.6.24","m":1,"o":["Containment of liquids","Separation","Thermal insulation","Increasing subgrade fines"],"q":"<p>A geotextile placed between a soft subgrade and the granular base of a road mainly performs the function of:<\/p>","a":1,"s":"<p>It prevents intermixing of subgrade and aggregate, preserving the base thickness (also filtration and some reinforcement).<br>Other options: A — that is a geomembrane function; C — not a geotextile function; D — it prevents mixing of fines.<\/p>","tag":""},{"id":"4.6.25","m":1,"o":["17.32 m","27.12 m","150 m","8.66 m"],"q":"<p>In dynamic compaction, a 15 t weight is dropped from 20 m. Using Ménard&#x27;s relation D = n√(WH) with n = 0.5 (W in tonnes, H in m), the depth of influence is about:<\/p>","a":3,"s":"<p>D = 0.5 × √(15 × 20) = 0.5 × 17.32 = 8.66 m.<br>Other options: A — n omitted; B — W taken in kN instead of tonnes; C — square root omitted.<\/p>","tag":""},{"id":"4.6.26","m":1,"o":["Expansive soils such as black cotton soil","Dense gravel deposits","Very soft organic clays","Rock at shallow depth"],"q":"<p>As per IS 2911 (Part 3), under-reamed piles are particularly suited for:<\/p>","a":0,"s":"<p>The bulbs anchor the pile below the active zone, resisting uplift from swelling.<br>Other options: B — boring and under-reaming is difficult; C — bulbs cannot be formed reliably; D — end bearing on rock needs no bulb.<\/p>","tag":""},{"id":"4.6.27","m":1,"o":["Ignores the self-weight of the soil","Applies only to clays","Uses only the surcharge term","Considers the shearing resistance of the soil above the base level of the footing"],"q":"<p>Meyerhof&#x27;s bearing capacity theory differs from Terzaghi&#x27;s mainly because it:<\/p>","a":3,"s":"<p>Terzaghi treats soil above the base as a surcharge only; Meyerhof extends the failure surface into it.<br>Other options: A — both include it; B — applies to c–φ soils; C — uses all three terms.<\/p>","tag":""},{"id":"4.6.28","m":1,"o":["20.00°","30.00°","40.89°","21.05°"],"q":"<p>For local shear failure, Terzaghi reduces the strength parameters. For a soil with φ = 30°, the reduced angle φ&#x27; used is:<\/p>","a":3,"s":"<p>tan φ&#x27; = (2/3) tan 30° = 0.3849 → φ&#x27; = 21.05°; c&#x27; = 2c/3.<br>Other options: A — 2φ/3 instead of tan⁻¹(2/3 tan φ); B — no reduction applied; C — increased instead of reduced.<\/p>","tag":""},{"id":"4.6.29","m":1,"o":["2.8 m","3.4 m","2.6 m","1.8 m"],"q":"<p>A 3 m wide strip footing carries a load with eccentricity 0.2 m along its width. By Meyerhof&#x27;s approach, the effective width for bearing capacity is:<\/p>","a":2,"s":"<p>B&#x27; = B − 2e = 3 − 0.4 = 2.6 m.<br>Other options: A — only one e deducted; B — eccentricity added; D — 6e deducted (confused with pressure formula).<\/p>","tag":""},{"id":"4.6.30","m":1,"o":["Loose sand","Very loose sand or soft clay at depth","Dense sand or stiff clay","All soils equally"],"q":"<p>General shear failure beneath a footing is typical of:<\/p>","a":2,"s":"<p>Dense, incompressible soils show a well-defined failure surface reaching the ground with heave and a clear peak load.<br>Other options: A — typically local shear; B — punching shear; D — failure mode depends on density/stiffness.<\/p>","tag":""}]}]},{"n":5,"t":"Water Resources Engineering","subs":[{"k":"5.1","t":"Fluid Properties, Pressure and Buoyancy","qs":[{"id":"5.1.1","m":1,"o":["A Newtonian fluid","An ideal fluid","A thixotropic fluid","A Bingham plastic"],"q":"<p>A fluid in which the shear stress is directly proportional to the rate of shear strain (velocity gradient), starting from zero, is called:<\/p>","a":0,"s":"<p>Newton&#x27;s law of viscosity τ = μ·(du/dy) with a constant μ defines a Newtonian fluid (water, air, thin oils).<br>Other options: B — an ideal fluid has zero viscosity, so it carries no shear stress at all; C — its apparent viscosity changes with the duration of shearing; D — it needs a yield stress before it flows, so τ is not proportional to du/dy from zero.<\/p>","tag":""},{"id":"5.1.2","m":1,"o":["8.33 × 10⁻² N·s/m²","4.80 × 10⁴ N·s/m²","8.33 × 10⁻⁷ N·s/m²","8.33 × 10⁻⁵ N·s/m²"],"q":"<p>A plate 0.025 mm from a fixed plate moves at 60 cm/s and needs a force of 2 N per m² of plate area to maintain this speed. The dynamic viscosity of the fluid between the plates is:<\/p>","a":3,"s":"<p>μ = τ/(du/dy) = τ·dy/du = 2 × 0.025×10⁻³ / 0.6 = 8.33 × 10⁻⁵ N·s/m².<br>Other options: A — the gap is left in mm instead of metres; B — τ multiplied by velocity and divided by gap (inverted formula); C — velocity taken as 60 (cm/s) instead of 0.6 m/s.<\/p>","tag":""},{"id":"5.1.3","m":1,"o":["0.0425 stoke","0.0588 stoke","0.588 stoke","5.88 stoke"],"q":"<p>An oil of specific gravity 0.85 has a dynamic viscosity of 0.05 N·s/m². Its kinematic viscosity is:<\/p>","a":2,"s":"<p>ν = μ/ρ = 0.05/850 = 5.88 × 10⁻⁵ m²/s; 1 stoke = 10⁻⁴ m²/s, so ν = 0.588 stoke.<br>Other options: A — μ multiplied by the specific gravity instead of dividing by the density; B — 1 stoke taken as 10⁻³ m²/s; D — 1 stoke taken as 10⁻⁵ m²/s instead of 10⁻⁴ m²/s.<\/p>","tag":""},{"id":"5.1.4","m":1,"o":["1 N·s/m²","0.1 N·s/m²","10 N·s/m²","10⁻⁴ m²/s"],"q":"<p>One poise is equal to:<\/p>","a":1,"s":"<p>1 poise = 1 dyne·s/cm² = 10⁻⁵ N × s / 10⁻⁴ m² = 0.1 N·s/m².<br>Other options: A — that is one pascal-second (10 poise); C — that is 100 poise; D — that is one stoke, a unit of kinematic, not dynamic, viscosity.<\/p>","tag":""},{"id":"5.1.5","m":1,"o":["Liquids decreases and gases increases","Both liquids and gases increases","Both liquids and gases decreases","Liquids increases and gases decreases"],"q":"<p>With a rise in temperature, the viscosity of:<\/p>","a":0,"s":"<p>Liquid viscosity is due mainly to cohesion, which weakens on heating; gas viscosity is due to molecular momentum exchange, which grows with temperature.<br>Other options: B — liquid viscosity falls with temperature because cohesion weakens; C — gas viscosity rises with temperature because molecular momentum exchange increases; D — this is the reverse of the actual behaviour.<\/p>","tag":""},{"id":"5.1.6","m":1,"o":["3.75 mm","7.5 mm","15.0 mm","30.0 mm"],"q":"<p>Water (σ = 0.0736 N/m, contact angle 0°) stands in a clean glass tube of 2 mm internal diameter. The capillary rise is:<\/p>","a":2,"s":"<p>h = 4σ cosθ/(ρ g d) = 4 × 0.0736/(1000 × 9.81 × 0.002) = 0.0150 m = 15.0 mm.<br>Other options: A — σ/(ρgd) used, dropping the factor 4; B — 2σ/(ρgd) used, i.e. radius formula with diameter; D — 4σ/(ρgr) used, i.e. diameter formula with the radius.<\/p>","tag":""},{"id":"5.1.7","m":1,"o":["Rises above the outside level because adhesion exceeds cohesion","Stays at the same level as outside","Rises because mercury has high surface tension","Is depressed below the outside level because the contact angle exceeds 90°"],"q":"<p>When a glass tube is dipped in mercury, the mercury level inside the tube:<\/p>","a":3,"s":"<p>For mercury on glass θ ≈ 130°, so cos θ &lt; 0 and h = 4σcosθ/(ρgd) is negative: a capillary depression with a convex meniscus.<br>Other options: A — that is water&#x27;s behaviour; for mercury cohesion exceeds adhesion; B — a capillary effect exists whenever the contact angle is not 90°; C — high σ with cos θ &lt; 0 gives a depression, not a rise.<\/p>","tag":""},{"id":"5.1.8","m":1,"o":["2 N/m²","4 N/m²","8 N/m²","16 N/m²"],"q":"<p>A soap bubble of 40 mm diameter has a surface tension of 0.04 N/m. The pressure inside it in excess of outside pressure is:<\/p>","a":2,"s":"<p>A soap bubble has two surfaces: Δp = 8σ/d = 8 × 0.04/0.04 = 8 N/m².<br>Other options: A — 2σ/d used (wrong formula for any case); B — 4σ/d is for a liquid drop, which has only one surface; D — radius used in the 8σ/d formula.<\/p>","tag":""},{"id":"5.1.9","m":1,"o":["0.867 GPa","0.4 GPa","4 MPa","40 kPa"],"q":"<p>When the pressure on a liquid is increased from 70 N/cm² to 130 N/cm², its volume decreases by 0.15%. The bulk modulus of the liquid is:<\/p>","a":1,"s":"<p>K = Δp/(−ΔV/V) = (130 − 70)×10⁴ N/m² / 0.0015 = 4 × 10⁸ N/m² = 0.4 GPa.<br>Other options: A — final pressure used instead of the pressure increase; C — 0.15 used instead of 0.0015 (percentage not converted); D — N/cm² not converted to N/m².<\/p>","tag":""},{"id":"5.1.10","m":1,"o":["Equal to its bulk modulus","The ratio of shear stress to shear strain","The product of density and bulk modulus","The reciprocal of its bulk modulus"],"q":"<p>The compressibility of a fluid is:<\/p>","a":3,"s":"<p>Compressibility β = 1/K = −(dV/V)/dp; a fluid with large K (water ≈ 2.1 GPa) is almost incompressible.<br>Other options: A — bulk modulus measures resistance to compression; compressibility is its inverse; B — that is the shear (rigidity) modulus of a solid; C — this has no physical meaning as compressibility; √(K/ρ) gives sound speed.<\/p>","tag":""},{"id":"5.1.11","m":1,"o":["Falls to the vapour pressure of the liquid","Rises above atmospheric pressure","Becomes equal to the atmospheric pressure","Exceeds the stagnation pressure"],"q":"<p>Cavitation in hydraulic machines and pipelines occurs when the local absolute pressure:<\/p>","a":0,"s":"<p>When absolute pressure drops to vapour pressure, vapour bubbles form; they collapse violently in higher-pressure regions, pitting the surface.<br>Other options: B — high pressure collapses vapour cavities, it does not form them; C — atmospheric pressure is well above the vapour pressure of cold water; D — stagnation pressure is the highest pressure in the flow; cavities form at the lowest.<\/p>","tag":""},{"id":"5.1.12","m":1,"o":["39.24 kPa","49.05 kPa","61.31 kPa","140.54 kPa"],"q":"<p>The gauge pressure at a depth of 5 m below the free surface of an oil of specific gravity 0.8 is:<\/p>","a":0,"s":"<p>p = S γw h = 0.8 × 9.81 × 5 = 39.24 kPa (gauge).<br>Other options: B — specific gravity of oil ignored (water assumed); C — divided by the specific gravity instead of multiplying; D — atmospheric pressure (101.3 kPa) added, i.e. absolute pressure.<\/p>","tag":""},{"id":"5.1.13","m":1,"o":["882 mm of mercury","952 mm of mercury","8656 mm of mercury","12000 mm of mercury"],"q":"<p>A pressure of 117.72 kPa expressed as a head of mercury (specific gravity 13.6) is:<\/p>","a":0,"s":"<p>h = p/(S γw) = 117.72/(13.6 × 9.81) = 0.8824 m ≈ 882 mm of Hg.<br>Other options: B — 13.6 − 1 = 12.6 used, which applies only to a differential manometer with water above mercury; C — g omitted (kPa divided by 13.6 only); D — head of water (12 m) given, not of mercury.<\/p>","tag":""},{"id":"5.1.14","m":1,"o":["−30 kPa","30 kPa","71.3 kPa","131.3 kPa"],"q":"<p>A vacuum gauge on a suction pipe reads 30 kPa. If the atmospheric pressure is 101.3 kPa, the absolute pressure in the pipe is:<\/p>","a":2,"s":"<p>p_abs = p_atm − vacuum = 101.3 − 30 = 71.3 kPa.<br>Other options: A — that is the gauge pressure, not absolute; B — the vacuum reading taken as absolute pressure; D — vacuum added to atmospheric pressure instead of subtracted.<\/p>","tag":""},{"id":"5.1.15","m":1,"o":["24.72 kPa","25.21 kPa","26.68 kPa","28.15 kPa"],"q":"<p>A simple U-tube manometer containing mercury (S = 13.6) is connected to a pipe carrying water. The right limb is open to the atmosphere. The mercury in the right limb stands 0.2 m above the mercury in the left limb, and the centre of the pipe is 0.15 m above the mercury surface in the left limb. The gauge pressure at the pipe centre is:<\/p>","a":1,"s":"<p>Equate pressures at the left-limb mercury level: pA + 9.81 × 0.15 = 13.6 × 9.81 × 0.2 → pA = 26.68 − 1.47 = 25.21 kPa.<br>Other options: A — (13.6 − 1) used as for a differential manometer; C — the 0.15 m water column ignored; D — water column added instead of subtracted (pipe centre is above the left-limb mercury).<\/p>","tag":""},{"id":"5.1.16","m":1,"o":["1.236 kPa","12.36 kPa","13.34 kPa","14.32 kPa"],"q":"<p>Two pipes A and B carrying water at the same level are connected by a differential mercury manometer (S = 13.6). The mercury level difference is 100 mm. The pressure difference pA − pB is:<\/p>","a":1,"s":"<p>pA − pB = (S_m − S_w) γw h = (13.6 − 1) × 9.81 × 0.1 = 12.36 kPa (≈ 1.26 m of water).<br>Other options: A — 100 mm taken as 0.01 m; C — water above the mercury not deducted (13.6 instead of 13.6 − 1); D — 13.6 + 1 used instead of 13.6 − 1.<\/p>","tag":""},{"id":"5.1.17","m":1,"o":["29.43 kN","88.29 kN","117.72 kN","176.58 kN"],"q":"<p>A vertical rectangular gate 2 m wide and 3 m high has its top edge at the water surface. The total hydrostatic force on the gate is:<\/p>","a":1,"s":"<p>F = γ A h̄ = 9.81 × (2 × 3) × 1.5 = 88.29 kN.<br>Other options: A — area taken as 2 m² (width only); C — depth of centre of pressure (2 m) used instead of centroid depth; D — depth of bottom edge used instead of depth of centroid.<\/p>","tag":""},{"id":"5.1.18","m":1,"o":["2.000 m","2.167 m","2.333 m","3.000 m"],"q":"<p>A vertical rectangular plate 2 m high is immersed in water with its top edge 1 m below the free surface. The depth of its centre of pressure below the free surface is:<\/p>","a":1,"s":"<p>h_cp = h̄ + I_G/(A h̄) = 2 + (d²/12)/h̄ = 2 + (4/12)/2 = 2.167 m.<br>Other options: A — that is the depth of the centroid; the centre of pressure lies below it; C — 2/3 of the plate height measured from the top edge, valid only when the top edge is at the surface; D — depth of the bottom edge taken.<\/p>","tag":""},{"id":"5.1.19","m":1,"o":["21.67 kN","34.67 kN","47.67 kN","138.69 kN"],"q":"<p>A circular plate of 1.5 m diameter is immersed vertically in water with its centre 2 m below the free surface. The total pressure force on one face is:<\/p>","a":1,"s":"<p>F = γ A h̄ = 9.81 × (π/4 × 1.5²) × 2 = 34.67 kN.<br>Other options: A — depth of the topmost point used; C — depth of the lowest point used instead of centroid depth; D — area taken as πd² instead of πd²/4.<\/p>","tag":""},{"id":"5.1.20","m":1,"o":["Coincides with the centroid at all depths","Lies above the centroid","Lies below the centroid, moving further away as the depth increases","Lies below the centroid, approaching it as depth of immersion increases"],"q":"<p>For a plane surface submerged vertically (or inclined) in a liquid, the centre of pressure:<\/p>","a":3,"s":"<p>h_cp − h̄ = I_G sin²θ/(A h̄), which is positive and decreases as h̄ grows.<br>Other options: A — it coincides only for a horizontal surface; B — pressure increases with depth, so the resultant acts below the centroid; C — the gap I_G/(A h̄) shrinks as h̄ increases.<\/p>","tag":""},{"id":"5.1.21","m":1,"o":["9.81 kN","13.08 kN","16.99 kN","19.62 kN"],"q":"<p>A rectangular plate 1 m wide and 2 m long (along the slope) is inclined at 30° to the horizontal with its upper edge at the water surface. The total hydrostatic force on the plate is:<\/p>","a":0,"s":"<p>Centroid is 1 m along the slope, so its vertical depth h̄ = 1 × sin 30° = 0.5 m; F = γ A h̄ = 9.81 × 2 × 0.5 = 9.81 kN.<br>Other options: B — depth of the centre of pressure (2/3 × 1 m) used instead of the centroid depth; C — cos 30° used instead of sin 30° for the vertical depth; D — slope distance to the centroid (1 m) used as vertical depth.<\/p>","tag":""},{"id":"5.1.22","m":1,"o":["The force on the vertical projection of the curved surface","The weight of liquid displaced by the whole body","Pressure at the centroid × the curved area","The weight of liquid vertically above the curved surface up to the free surface"],"q":"<p>For a curved surface submerged in a static liquid, the vertical component of the hydrostatic force equals:<\/p>","a":3,"s":"<p>F_V = weight of the real or imaginary liquid column between the curved surface and the free surface, acting through its centroid.<br>Other options: A — that gives the horizontal component; B — that is the buoyant force on a fully immersed body; C — valid only for plane surfaces; on a curved surface pressure acts in varying directions.<\/p>","tag":""},{"id":"5.1.23","m":1,"o":["58.86 kN","78.48 kN","92.46 kN","117.72 kN"],"q":"<p>A sector gate is a quarter of a circular cylinder of radius 2 m and length 3 m. It holds water on one side up to the level of its top edge, so the vertical projection of the wetted surface is a rectangle 2 m high and 3 m long with its top at the water surface. The horizontal component of the water force on the gate is:<\/p>","a":0,"s":"<p>F_H = γ × (projected area) × h̄ = 9.81 × (2 × 3) × 1 = 58.86 kN.<br>Other options: B — centre-of-pressure depth (2/3 × 2 m) used instead of the centroid depth; C — that is the weight of a quarter-circle of water (vertical component); D — bottom depth used instead of centroid depth of the projection.<\/p>","tag":""},{"id":"5.1.24","m":1,"o":["The centre of gravity of the body","The metacentre of the body","The centroid of the displaced volume of liquid","The centroid of the waterline (plane of flotation) area"],"q":"<p>The centre of buoyancy of a floating body is:<\/p>","a":2,"s":"<p>Buoyant force = weight of displaced liquid, acting through the centroid of the displaced volume (Archimedes&#x27; principle).<br>Other options: A — G depends on mass distribution; the centre of buoyancy depends on the immersed shape; B — the metacentre is the intersection point used for stability when the body tilts; D — that point is used for I in BM = I/V, not for the location of B.<\/p>","tag":""},{"id":"5.1.25","m":1,"o":["0.15 m","0.35 m","0.50 m","0.71 m"],"q":"<p>A wooden block 2 m × 1 m in plan and 0.5 m high, of specific gravity 0.7, floats in water with the 2 m × 1 m face horizontal. The depth of immersion is:<\/p>","a":1,"s":"<p>Weight = buoyancy: 0.7 × 2 × 1 × 0.5 = 2 × 1 × d → d = 0.7 × 0.5 = 0.35 m.<br>Other options: A — height above water (1 − 0.7) × 0.5 found instead; C — full height taken, i.e. block assumed fully submerged; D — height divided by S instead of multiplied.<\/p>","tag":""},{"id":"5.1.26","m":1,"o":["0.33","1.5","2.0","3.0"],"q":"<p>A solid body weighs 300 N in air and 200 N when fully immersed in water. The specific gravity of the body is:<\/p>","a":3,"s":"<p>Loss of weight = buoyancy = 100 N = γw V → V = 0.01019 m³. S = W_air/(loss of weight) = 300/100 = 3.0.<br>Other options: A — loss of weight divided by air weight (inverse); B — air weight divided by the immersed weight instead of the loss of weight; C — immersed weight divided by loss of weight.<\/p>","tag":""},{"id":"5.1.27","m":1,"o":["Its centre of buoyancy lies above its centre of gravity","Its metacentre lies below its centre of gravity","Its metacentre lies above its centre of gravity","Its metacentre coincides with its centre of gravity"],"q":"<p>A floating body is in stable equilibrium when:<\/p>","a":2,"s":"<p>For a floating body, GM &gt; 0 (M above G) gives a restoring couple W·GM·sinθ on tilting.<br>Other options: A — that is the condition for a fully submerged body, not a floating body; B — that gives an overturning couple (unstable); D — that is neutral equilibrium.<\/p>","tag":""},{"id":"5.1.28","m":1,"o":["0.356 m","0.556 m","0.756 m","1.050 m"],"q":"<p>A rectangular pontoon 3 m long, 2 m wide and 1 m high, with uniform specific gravity 0.6, floats in water with its 1 m height vertical. The metacentric height for rolling about its longitudinal axis is:<\/p>","a":0,"s":"<p>Immersion d = 0.6 m. BM = I/V = (L b³/12)/(L b d) = b²/(12d) = 4/7.2 = 0.5556 m. B at 0.3 m, G at 0.5 m → BG = 0.2 m. GM = 0.5556 − 0.2 = 0.356 m.<br>Other options: B — BM found but BG not subtracted; C — BG added instead of subtracted (G is above B); D — length 3 m used in I instead of the 2 m width.<\/p>","tag":""},{"id":"5.1.29","m":1,"o":["0.03 m","0.06 m","1.72 m","1.74 m"],"q":"<p>In an inclining experiment on a ship of total weight 20 000 kN, a load of 200 kN is moved 6 m across the deck and the ship heels through 2°. The metacentric height is:<\/p>","a":2,"s":"<p>GM = w x/(W tan θ) = 200 × 6/(20 000 × tan 2°) = 1200/(20 000 × 0.03492) = 1.72 m.<br>Other options: A — angle used in degrees (tan θ replaced by 2); B — tan θ omitted; D — weight of the moved load subtracted from W.<\/p>","tag":""},{"id":"5.1.30","m":1,"o":["Increases, making the ship more comfortable","Remains unchanged","Becomes infinite","Decreases, making the ship stiffer and less comfortable"],"q":"<p>If the metacentric height of a ship is increased (other things unchanged), its natural period of rolling:<\/p>","a":3,"s":"<p>T = 2π k/√(g·GM). Larger GM gives a shorter, jerkier roll; passenger ships use a moderate GM for comfort.<br>Other options: A — T ∝ 1/√GM, so a larger GM shortens the period; B — the period depends directly on GM; C — an infinite period corresponds to GM → 0 (neutral stability).<\/p>","tag":""}]},{"k":"5.2","t":"Kinematics and Dynamics of Flow","qs":[{"id":"5.2.1","m":1,"o":["Flow properties at any given point do not change with time","Flow properties do not change from point to point at a given instant","The fluid particles move in well-defined layers","The fluid particles do not rotate about their own axes"],"q":"<p>A flow is said to be steady when:<\/p>","a":0,"s":"<p>Steady flow: ∂V/∂t = 0, ∂p/∂t = 0, ∂ρ/∂t = 0 at every fixed point.<br>Other options: B — that defines uniform flow; C — that describes laminar flow; D — that describes irrotational flow.<\/p>","tag":""},{"id":"5.2.2","m":1,"o":["Steady and uniform","Unsteady and uniform","Unsteady and non-uniform","Steady and non-uniform"],"q":"<p>Water flows at a constant discharge through a long tapering pipe. The flow is:<\/p>","a":3,"s":"<p>Constant Q → nothing at a point varies with time (steady); area changes along the pipe so V changes with x (non-uniform).<br>Other options: A — velocity changes along the taper, so the flow is not uniform; B — discharge is constant in time, so it is steady; and velocity varies with position; C — nothing at a fixed point changes with time.<\/p>","tag":""},{"id":"5.2.3","m":1,"o":["0.5 m/s","4.0 m/s","8.0 m/s","32.0 m/s"],"q":"<p>Water flows through a pipe that reduces from 300 mm to 150 mm diameter. If the velocity in the 300 mm section is 2 m/s, the velocity in the 150 mm section is:<\/p>","a":2,"s":"<p>A1V1 = A2V2 → V2 = V1 (D1/D2)² = 2 × 2² = 8 m/s.<br>Other options: A — area ratio inverted; B — diameter ratio used instead of area ratio; D — diameter ratio raised to the fourth power.<\/p>","tag":""},{"id":"5.2.4","m":1,"o":["Steady","Irrotational","Two-dimensional","Laminar"],"q":"<p>A velocity potential function φ exists only when the flow is:<\/p>","a":1,"s":"<p>u = −∂φ/∂x etc. requires curl V = 0, i.e. irrotational flow. (ψ exists for any 2-D incompressible flow.)<br>Other options: A — φ can exist in unsteady flow; steadiness is not the condition; C — φ exists in 3-D irrotational flows as well; D — laminar flows are generally rotational (e.g. Poiseuille flow).<\/p>","tag":""},{"id":"5.2.5","m":1,"o":["3.61 m/s","7.21 m/s","10.00 m/s","12.00 m/s"],"q":"<p>The stream function of a two-dimensional flow is ψ = 2xy (SI units). The magnitude of the resultant velocity at the point (2, 3) is:<\/p>","a":1,"s":"<p>Magnitudes: u = ∂ψ/∂y = 2x = 4 and v = ∂ψ/∂x = 2y = 6 (signs depend on the sign convention). V = √(4² + 6²) = √52 = 7.21 m/s.<br>Other options: A — factor 2 dropped from the derivatives; C — the two components added arithmetically; D — the value of ψ itself taken as the velocity.<\/p>","tag":""},{"id":"5.2.6","m":1,"o":["0.5 s⁻¹","1.0 s⁻¹","2.5 s⁻¹","5.0 s⁻¹"],"q":"<p>A two-dimensional flow has velocity components u = 2y and v = 3x. The vorticity ωz = ∂v/∂x − ∂u/∂y is:<\/p>","a":1,"s":"<p>∂v/∂x = 3, ∂u/∂y = 2 → ωz = 3 − 2 = 1 s⁻¹ (flow is rotational).<br>Other options: A — that is the rotation ω = ½(∂v/∂x − ∂u/∂y), half the vorticity; C — half of the sum of derivatives (wrong formula); D — the two derivatives added instead of subtracted.<\/p>","tag":""},{"id":"5.2.7","m":1,"o":["Are parallel to each other","Intersect at 45°","Intersect each other at right angles","Never intersect"],"q":"<p>In a flow net for two-dimensional irrotational flow, streamlines and equipotential lines:<\/p>","a":2,"s":"<p>Slope of streamline = v/u, slope of equipotential = −u/v; the product is −1, so they are orthogonal.<br>Other options: A — the velocity is along a streamline and normal to equipotentials, so they cannot be parallel; B — the slopes are negative reciprocals, giving 90°; D — they form a mesh of curvilinear squares.<\/p>","tag":""},{"id":"5.2.8","m":1,"o":["Viscous and compressible","Viscous and incompressible","Turbulent","Non-viscous (ideal), with only pressure and gravity forces acting"],"q":"<p>Euler&#x27;s equation of motion along a streamline, (dp/ρ) + V dV + g dz = 0, is derived on the assumption that the fluid is:<\/p>","a":3,"s":"<p>Euler&#x27;s equation is Newton&#x27;s second law for an inviscid fluid element along a streamline; integrating it for steady incompressible flow gives Bernoulli&#x27;s equation.<br>Other options: A — viscous forces are neglected in Euler&#x27;s equation; B — viscous forces are neglected; incompressibility is needed only to integrate it into Bernoulli&#x27;s form; C — turbulent stresses are not included.<\/p>","tag":""},{"id":"5.2.9","m":1,"o":["Energy per unit weight of fluid","Energy per unit mass of fluid","Energy per unit volume of fluid","Power per unit discharge"],"q":"<p>Each term of Bernoulli&#x27;s equation in the form p/γ + V²/2g + z = constant represents:<\/p>","a":0,"s":"<p>Each term has the unit of metres (J/N), i.e. energy per unit weight — pressure head, velocity head and datum head.<br>Other options: B — that is the form p/ρ + V²/2 + gz (J/kg); C — that is the form p + ρV²/2 + ρgz (Pa); D — the terms have units of length (m), i.e. head.<\/p>","tag":""},{"id":"5.2.10","m":1,"o":["101.57 kPa","131.00 kPa","160.43 kPa","179.43 kPa"],"q":"<p>Water flows through a pipe at 0.05 m³/s. At section 1 (diameter 200 mm, elevation 5 m) the pressure is 150 kPa. Section 2 has diameter 100 mm and elevation 2 m. Neglecting losses, the pressure at section 2 is:<\/p>","a":2,"s":"<p>V1 = 1.592 m/s, V2 = 6.366 m/s. p2 = p1 + γ(z1 − z2) + ρ(V1² − V2²)/2 = 150 + 29.43 + (2.533 − 40.528)/2 = 160.43 kPa.<br>Other options: A — elevation change taken with the wrong sign (section 2 is lower); B — elevation difference ignored; D — velocity heads ignored.<\/p>","tag":""},{"id":"5.2.11","m":1,"o":["39.6 L/s","140.6 L/s","143.5 L/s","146.1 L/s"],"q":"<p>A horizontal venturimeter (inlet 300 mm, throat 150 mm) carries water. A differential mercury manometer (S = 13.6) shows a deflection of 250 mm. With Cd = 0.98, the discharge is:<\/p>","a":1,"s":"<p>h = 0.25 × (13.6 − 1) = 3.15 m of water. Q = Cd a1 a2 √(2gh)/√(a1² − a2²) = 0.98 × 0.07069 × 0.01767 × 7.861/0.06844 = 0.1406 m³/s.<br>Other options: A — manometer reading used as the water head without conversion; C — Cd omitted (ideal discharge); D — head taken as 13.6 × 0.25 instead of (13.6 − 1) × 0.25.<\/p>","tag":""},{"id":"5.2.12","m":1,"o":["1.68 m/s","2.38 m/s","2.43 m/s","5.77 m/s"],"q":"<p>A pitot-static tube placed at the centre of a pipe carrying water shows a difference of 0.3 m of water between the stagnation and static heads. With a coefficient of 0.98, the velocity at the centre is:<\/p>","a":1,"s":"<p>V = C √(2gh) = 0.98 × √(2 × 9.81 × 0.3) = 2.38 m/s.<br>Other options: A — √(gh) used instead of √(2gh); C — the coefficient 0.98 not applied; D — square root not taken.<\/p>","tag":""},{"id":"5.2.13","m":1,"o":["0.621","0.660","0.805","1.516"],"q":"<p>For an orifice with coefficient of contraction 0.64 and coefficient of velocity 0.97, the coefficient of discharge is:<\/p>","a":0,"s":"<p>Cd = Cc × Cv = 0.64 × 0.97 = 0.621.<br>Other options: B — Cc divided by Cv; C — average of the two coefficients; D — Cv divided by Cc (exceeds 1, impossible).<\/p>","tag":""},{"id":"5.2.14","m":1,"o":["10.78 L/s","17.39 L/s","43.14 L/s","95.54 L/s"],"q":"<p>Water discharges from a tank through a sharp-edged orifice of 50 mm diameter under a constant head of 4 m. Taking Cd = 0.62, the discharge is:<\/p>","a":0,"s":"<p>Q = Cd a √(2gH) = 0.62 × 0.001963 × √(2 × 9.81 × 4) = 0.01078 m³/s = 10.78 L/s.<br>Other options: B — Cd not applied; C — area taken as πd² (factor 4 missing); D — square root of 2gH not taken.<\/p>","tag":""},{"id":"5.2.15","m":1,"o":["1.0","4/3","1.06","2.0"],"q":"<p>For fully developed laminar flow in a circular pipe, the kinetic energy correction factor α is:<\/p>","a":3,"s":"<p>With the parabolic profile u = Umax(1 − r²/R²), α = (1/A)∫(u/V)³dA = 2 and β = 4/3.<br>Other options: A — that assumes uniform velocity over the section; B — that is the momentum correction factor β for laminar pipe flow; C — a typical value for turbulent pipe flow.<\/p>","tag":""},{"id":"5.2.16","m":1,"o":["39.27 N","785.4 N","1570.8 N","3141.6 N"],"q":"<p>A water jet 50 mm in diameter with a velocity of 20 m/s strikes a fixed flat plate held normal to the jet. The force exerted on the plate is:<\/p>","a":1,"s":"<p>F = ρ a V² = 1000 × 0.001963 × 20² = 785.4 N.<br>Other options: A — mass flow rate ρaV taken as the force (velocity not multiplied again); C — factor 2 applies only when the jet is turned back through 180°; D — 50 mm taken as the radius.<\/p>","tag":""},{"id":"5.2.17","m":1,"o":["282.7 N","471.2 N","785.4 N","1539.4 N"],"q":"<p>The same 50 mm diameter jet (velocity 20 m/s) strikes a single flat plate held normal to the jet and moving away from it at 8 m/s. The force on the plate is:<\/p>","a":0,"s":"<p>For a single moving plate the mass striking per second is ρa(V − u): F = ρa(V − u)² = 1000 × 0.001963 × 12² = 282.7 N.<br>Other options: B — ρaV(V − u), valid for a series of plates (wheel) where all the jet is used; C — plate velocity ignored; D — relative velocity taken as V + u.<\/p>","tag":""},{"id":"5.2.18","m":1,"o":["2.81 kN","14.56 kN","17.77 kN","20.59 kN"],"q":"<p>A horizontal 90° pipe bend of 400 mm diameter carries water at 0.5 m³/s. The pressure at both the inlet and outlet is 100 kPa (gauge). Neglecting losses, the magnitude of the resultant force on the bend is:<\/p>","a":3,"s":"<p>A = 0.1257 m², V = 3.979 m/s. Each component = pA + ρQV = 12566 + 1989 = 14556 N. R = √2 × 14556 = 20.59 kN at 45°.<br>Other options: A — pressure forces ignored; B — only one component (x or y) found; C — momentum flux ρQV ignored.<\/p>","tag":""},{"id":"5.2.19","m":1,"o":["29.45 N","441.8 N","883.6 N","3534.3 N"],"q":"<p>A water jet of 25 mm diameter moving at 30 m/s is deflected through 180° by a fixed smooth curved vane. The force exerted on the vane in the direction of the jet is:<\/p>","a":2,"s":"<p>F = ρaV[V − (−V)] = 2ρaV² = 2 × 1000 × 0.0004909 × 900 = 883.6 N.<br>Other options: A — velocity not squared; B — ρaV² is for a flat plate normal to the jet (jet turned only 90°); D — 25 mm taken as the radius.<\/p>","tag":""},{"id":"5.2.20","m":1,"o":["The continuity equation for compressible flow","Newton&#x27;s second law for an inviscid fluid","Newton&#x27;s second law applied to a viscous fluid element","The energy equation for steady flow"],"q":"<p>The Navier–Stokes equations are essentially:<\/p>","a":2,"s":"<p>ρ DV/Dt = ρg − ∇p + μ∇²V (incompressible). Setting μ = 0 gives Euler&#x27;s equations.<br>Other options: A — continuity expresses conservation of mass, not momentum; B — that is Euler&#x27;s equation; N–S adds the viscous terms μ∇²V; D — N–S are momentum equations.<\/p>","tag":""},{"id":"5.2.21","m":1,"o":["1875, turbulent","18750, turbulent","187.5, laminar","1875, laminar"],"q":"<p>An oil of kinematic viscosity 0.4 stoke flows in a 50 mm diameter pipe with a mean velocity of 1.5 m/s. The Reynolds number and the type of flow are:<\/p>","a":3,"s":"<p>ν = 0.4 × 10⁻⁴ m²/s; Re = VD/ν = 1.5 × 0.05/(0.4 × 10⁻⁴) = 1875 &lt; 2000 → laminar.<br>Other options: A — Re &lt; 2000 in a pipe means laminar flow; B — 1 stoke taken as 10⁻⁵ m²/s; C — 1 stoke taken as 10⁻³ m²/s.<\/p>","tag":""},{"id":"5.2.22","m":1,"o":["0.362 m","3.262 m","3.624 m","7.249 m"],"q":"<p>Oil (μ = 0.1 N·s/m², specific gravity 0.9) flows in a 100 mm diameter pipe with a mean velocity of 1 m/s (laminar flow). The head loss in 100 m of pipe is:<\/p>","a":2,"s":"<p>Re = 900 × 1 × 0.1/0.1 = 900 (laminar). h_f = 32μVL/(γD²) = 32 × 0.1 × 1 × 100/(900 × 9.81 × 0.01) = 3.624 m.<br>Other options: A — D not squared; B — specific weight of water used instead of oil; D — 64 used in place of 32 in the Hagen–Poiseuille formula.<\/p>","tag":""},{"id":"5.2.23","m":1,"o":["0.010","0.020","0.040","0.080"],"q":"<p>For laminar flow in a pipe at a Reynolds number of 1600, the Darcy friction factor f is:<\/p>","a":2,"s":"<p>Darcy f = 64/Re = 64/1600 = 0.04 (Fanning f′ = 16/Re = 0.01).<br>Other options: A — 16/Re, the Fanning friction factor; B — 32/Re (wrong constant); D — 128/Re (wrong constant).<\/p>","tag":""},{"id":"5.2.24","m":1,"o":["Is constant across the section","Varies parabolically, maximum at the centre","Varies linearly from maximum at the centre to zero at the wall","Varies linearly from zero at the centre to a maximum at the wall"],"q":"<p>In fully developed laminar flow through a circular pipe, the shear stress across the section:<\/p>","a":3,"s":"<p>τ = (−dp/dx)(r/2): linear in r, zero on the axis, τ0 at the wall; the velocity profile is parabolic.<br>Other options: A — τ = (−dp/dx) r/2 depends on r; B — the velocity is parabolic; shear is zero at the centre; C — reverse of the actual distribution.<\/p>","tag":""},{"id":"5.2.25","m":1,"o":["3.40 m","6.80 m","13.59 m","27.18 m"],"q":"<p>Water flows at 2 m/s through a 300 mm diameter pipe 500 m long. Taking Darcy friction factor f = 0.02, the head lost in friction is:<\/p>","a":1,"s":"<p>h_f = fLV²/(2gD) = 0.02 × 500 × 2²/(2 × 9.81 × 0.3) = 6.80 m.<br>Other options: A — velocity not squared; C — 2g replaced by g; D — 4fLV²/(2gD) used with the Darcy f (that form needs the Fanning f).<\/p>","tag":""},{"id":"5.2.26","m":1,"o":["0.408 m","0.459 m","0.765 m","0.917 m"],"q":"<p>Water flowing at 4 m/s in a pipe enters a sudden enlargement where the velocity drops to 1 m/s. The head loss due to the sudden expansion is:<\/p>","a":1,"s":"<p>h_L = (V1 − V2)²/(2g) = 3²/19.62 = 0.459 m (Borda–Carnot).<br>Other options: A — 0.5V²/2g, the entrance (contraction) loss formula; C — (V1² − V2²)/2g used instead of (V1 − V2)²/2g; D — g used in place of 2g.<\/p>","tag":""},{"id":"5.2.27","m":1,"o":["0.742 mm","1.92 mm","5.59 mm","16.11 mm"],"q":"<p>Water (ν = 10⁻⁶ m²/s) flows at 0.4 m/s parallel to a smooth flat plate. Using the Blasius result for a laminar boundary layer, the boundary layer thickness at 0.5 m from the leading edge is:<\/p>","a":2,"s":"<p>Re_x = Ux/ν = 0.4 × 0.5/10⁻⁶ = 200000 (&lt; 5 × 10⁵, laminar). δ = 5x/√Re_x = 2.5/447.2 = 5.59 mm.<br>Other options: A — that is the momentum thickness (0.664x/√Re); B — that is the displacement thickness (1.72x/√Re); D — turbulent formula 0.37x/Re^0.2 used for a laminar layer.<\/p>","tag":""},{"id":"5.2.28","m":1,"o":["δ/6","δ/2","δ/4","δ/3"],"q":"<p>If the velocity profile in a boundary layer is linear, u/U = y/δ, the momentum thickness is:<\/p>","a":0,"s":"<p>θ = ∫₀^δ (y/δ)(1 − y/δ) dy = δ/2 − δ/3 = δ/6.<br>Other options: B — that is the displacement thickness ∫(1 − u/U)dy; C — that is the energy thickness ∫(u/U)(1 − u²/U²)dy; D — only ∫(u/U)² dy was evaluated, not ∫(u/U)(1 − u/U) dy.<\/p>","tag":""},{"id":"5.2.29","m":1,"o":["The pressure increases in the direction of flow (adverse pressure gradient)","The pressure decreases in the direction of flow","The pressure gradient along the surface is zero","The flow becomes turbulent"],"q":"<p>Boundary layer separation from a surface occurs when:<\/p>","a":0,"s":"<p>With dp/dx &gt; 0 the slow near-wall fluid is decelerated until (∂u/∂y) at the wall = 0; beyond that point flow reverses and the layer separates.<br>Other options: B — a favourable gradient accelerates the layer and delays separation; C — a flat plate at zero incidence does not separate; D — turbulence actually delays separation by energising the near-wall flow.<\/p>","tag":""},{"id":"5.2.30","m":1,"o":["10.8 N","162 N","324 N","648 N"],"q":"<p>A car has a frontal area of 2 m² and a drag coefficient of 0.3. The drag force at 30 m/s in air of density 1.2 kg/m³ is:<\/p>","a":2,"s":"<p>F_D = ½ C_D ρ A V² = 0.5 × 0.3 × 1.2 × 2 × 30² = 324 N.<br>Other options: A — velocity not squared; B — frontal area omitted; D — the factor ½ omitted.<\/p>","tag":""}]},{"k":"5.3","t":"Uniform Flow, Energy and Momentum in Open Channels","qs":[{"id":"5.3.1","m":1,"o":["0.25 m³/s","1.25 m³/s","10.00 m³/s","11.55 m³/s"],"q":"<p>A rectangular channel 4 m wide carries water at a uniform depth of 2 m on a bed slope of 1 in 1600. Taking Chezy&#x27;s C = 50 m^½/s, the discharge is:<\/p>","a":2,"s":"<p>A = 8 m², P = 4 + 2 × 2 = 8 m, R = 1 m. V = C√(RS) = 50 × √(1/1600) = 1.25 m/s; Q = 8 × 1.25 = 10.00 m³/s.<br>Other options: A — square root of the slope not taken; B — velocity found but not multiplied by the area; D — wetted perimeter taken as b + y = 6 m instead of b + 2y = 8 m.<\/p>","tag":""},{"id":"5.3.2","m":1,"o":["1.10 m³/s","4.95 m³/s","5.20 m³/s","7.86 m³/s"],"q":"<p>A rectangular channel 3 m wide, with Manning&#x27;s n = 0.015 and bed slope 0.0004, carries a uniform flow 1.5 m deep. The discharge is:<\/p>","a":1,"s":"<p>A = 4.5 m², P = 6 m, R = 0.75 m. V = (1/n)R^(2/3)S^(1/2) = 66.67 × 0.8255 × 0.02 = 1.101 m/s; Q = 4.95 m³/s.<br>Other options: A — velocity found but not multiplied by the area; C — R raised to ½ instead of ⅔; D — hydraulic radius taken as the depth (wide-channel approximation, not valid for b/y = 2).<\/p>","tag":""},{"id":"5.3.3","m":1,"o":["C = n·R^(1/6)","C = R^(2/3)/n","C = 1/(n·R^(1/6))","C = R^(1/6)/n"],"q":"<p>Chezy&#x27;s coefficient C is related to Manning&#x27;s roughness coefficient n by:<\/p>","a":3,"s":"<p>C√(RS) = (1/n)R^(2/3)S^(1/2) → C = R^(2/3)/(n R^(1/2)) = R^(1/6)/n.<br>Other options: A — C decreases with roughness, so n must be in the denominator; B — R^(2/3)/n is the Manning velocity factor; dividing it by √R (from Chezy) leaves R^(1/6)/n; C — the exponent of R is positive.<\/p>","tag":""},{"id":"5.3.4","m":1,"o":["b = 2y","b = y","b = 3y","b = y/2"],"q":"<p>For the most economical rectangular channel section, the bottom width b and depth y are related by:<\/p>","a":0,"s":"<p>P = A/y + 2y; dP/dy = −A/y² + 2 = 0 → A = 2y² → b = 2y, and R = y/2.<br>Other options: B — a square section has a larger perimeter for the same area; C — too wide; dP/dy = 0 gives b = 2y; D — too deep and narrow.<\/p>","tag":""},{"id":"5.3.5","m":1,"o":["Half of a regular hexagon","Half of a square","An equilateral triangle","A trapezoid with side slopes of 45°"],"q":"<p>Among all trapezoidal channel sections, the most economical one is:<\/p>","a":0,"s":"<p>Optimising both b and side slope gives sides at 60° to the horizontal (1/√3 H : 1 V) with all three sides equal: half a regular hexagon, R = y/2.<br>Other options: B — that is the best rectangular section, not the best trapezoid; C — a triangle has zero bottom width and a larger perimeter; D — the optimum side slope is 60° to the horizontal.<\/p>","tag":""},{"id":"5.3.6","m":1,"o":["Width 2 m, depth 4 m","Width 2.83 m, depth 2.83 m","Width 8 m, depth 1 m","Width 4 m, depth 2 m"],"q":"<p>A rectangular channel of the most economical section has a flow area of 8 m². Its bottom width and depth are:<\/p>","a":3,"s":"<p>A = b y = 2y² = 8 → y = 2 m, b = 4 m.<br>Other options: A — b and y interchanged; the best section has b = 2y; B — a square section (b = y) assumed; C — b = 8y is far from economical.<\/p>","tag":""},{"id":"5.3.7","m":1,"o":["The depth of flow","Twice the depth of flow","Half the depth of flow","One-third the depth of flow"],"q":"<p>The hydraulic radius of any most economical trapezoidal (or rectangular) channel section is equal to:<\/p>","a":2,"s":"<p>For the most economical trapezoid the sides are tangent to a semicircle of radius y centred on the water surface, giving R = A/P = y/2.<br>Other options: A — R ≈ y only for a very wide channel; B — R is always less than y for these sections; D — the optimum condition gives exactly y/2.<\/p>","tag":""},{"id":"5.3.8","m":1,"o":["0.938 D","0.81 D","0.50 D","1.00 D"],"q":"<p>Using Manning&#x27;s formula, the mean velocity in a circular conduit flowing partly full is maximum when the depth of flow is about:<\/p>","a":1,"s":"<p>Maximising R = A/P with respect to the central angle gives θ ≈ 257.5°, i.e. y ≈ 0.81D (maximum Q occurs at y ≈ 0.938D).<br>Other options: A — that is the depth for maximum discharge; C — at half-full the velocity equals the full-pipe velocity, not the maximum; D — at full flow the wetted perimeter jumps, lowering R.<\/p>","tag":""},{"id":"5.3.9","m":1,"o":["90°","60°","120°","45°"],"q":"<p>The most economical triangular channel section has a vertex angle of:<\/p>","a":0,"s":"<p>P = 2y√(1 + m²) with A = m y²; minimising gives m = 1 (side slope 1 H : 1 V), i.e. each side at 45° to the vertical and a 90° vertex.<br>Other options: B — an equilateral V-section is not optimal; C — too flat, giving a large perimeter; D — too narrow and deep.<\/p>","tag":""},{"id":"5.3.10","m":1,"o":["0.319 m","1.055 m","1.119 m","1.437 m"],"q":"<p>Water flows in a rectangular channel at 2 m³/s per metre width with a depth of 0.8 m. The specific energy is:<\/p>","a":2,"s":"<p>V = q/y = 2.5 m/s; E = y + V²/2g = 0.8 + 6.25/19.62 = 1.119 m.<br>Other options: A — only the velocity head; the depth was left out; B — q²/(2g y) used — y must be squared; D — V²/g used instead of V²/2g.<\/p>","tag":""},{"id":"5.3.11","m":1,"o":["0.674 m","0.771 m","0.972 m","1.458 m"],"q":"<p>The critical depth in a rectangular channel carrying 3 m³/s per metre width is:<\/p>","a":2,"s":"<p>yc = (q²/g)^(1/3) = (9/9.81)^(1/3) = 0.972 m.<br>Other options: A — q used instead of q² in (q²/g)^(1/3); B — 2g used instead of g; D — that is the minimum specific energy 1.5 yc.<\/p>","tag":""},{"id":"5.3.12","m":1,"o":["0.911 m","1.366 m","2.049 m","2.732 m"],"q":"<p>The minimum specific energy for a discharge of 5 m³/s per metre width in a rectangular channel is:<\/p>","a":2,"s":"<p>yc = (25/9.81)^(1/3) = 1.366 m; E_min = 1.5 yc = 2.049 m.<br>Other options: A — 2/3 of yc taken (relation inverted); B — that is the critical depth itself; D — E_min taken as 2yc.<\/p>","tag":""},{"id":"5.3.13","m":1,"o":["1.35, subcritical","1.35, supercritical","1.83, supercritical","0.96, subcritical"],"q":"<p>Water flows at 3 m/s in a wide rectangular channel at a depth of 0.5 m. The Froude number and the flow regime are:<\/p>","a":1,"s":"<p>F = V/√(gy) = 3/√(9.81 × 0.5) = 1.35 &gt; 1 → supercritical (shooting) flow.<br>Other options: A — F &gt; 1 means supercritical, not subcritical; C — V²/(gy) computed; that is F², not F; D — √(2gy) used in the denominator instead of √(gy).<\/p>","tag":""},{"id":"5.3.14","m":1,"o":["Subcritical","Supercritical","Uniform","Critical"],"q":"<p>For a given specific energy in a rectangular channel, the discharge per unit width is maximum when the flow is:<\/p>","a":3,"s":"<p>q = y√(2g(E − y)); dq/dy = 0 gives y = (2/3)E = yc. The same state gives minimum E for a given q.<br>Other options: A — subcritical depth gives less q for the same E; B — supercritical depth gives less q for the same E; C — uniform flow can be in any regime; uniformity is not the condition.<\/p>","tag":""},{"id":"5.3.15","m":1,"o":["Conjugate (sequent) depths","Normal depths","Critical depths","Alternate depths"],"q":"<p>Two depths of flow in a channel that have the same specific energy for the same discharge are called:<\/p>","a":3,"s":"<p>One alternate depth is subcritical and the other supercritical; they merge at critical depth.<br>Other options: A — conjugate depths have equal specific force, as before and after a hydraulic jump; B — normal depth is the uniform-flow depth for a given slope; C — there is only one critical depth for a given discharge.<\/p>","tag":""},{"id":"5.3.16","m":1,"o":["Q²/(gA²T) = 1","Q²T/(gA³) = 1","QT/(gA²) = 1","Q²A/(gT³) = 1"],"q":"<p>The general condition for critical flow in a channel of any cross-section (top width T, area A) carrying discharge Q is:<\/p>","a":1,"s":"<p>dE/dy = 1 − Q²T/(gA³) = 0 at critical flow; equivalently F = V/√(g·A/T) = 1.<br>Other options: A — A must be cubed and T in the numerator; C — Q must be squared; D — A and T are interchanged.<\/p>","tag":""},{"id":"5.3.17","m":1,"o":["0.836 m","0.934 m","0.960 m","1.200 m"],"q":"<p>A triangular channel with side slopes 1 H : 1 V carries 2 m³/s. The critical depth is:<\/p>","a":2,"s":"<p>For a triangle A = m y², T = 2m y: Q²T/(gA³) = 1 → yc = (2Q²/(g m²))^(1/5) = (8/9.81)^(1/5) = 0.960 m.<br>Other options: A — factor 2 omitted in (2Q²/(g m²))^(1/5); B — exponent 1/3 used (rectangular-channel form); D — that is the critical specific energy 1.25 yc of a triangular channel.<\/p>","tag":""},{"id":"5.3.18","m":1,"o":["Relate the depths before and after a hydraulic jump, which have equal M","Find alternate depths, which have equal M","Compute the normal depth","Compute friction loss in uniform flow"],"q":"<p>The specific force (momentum function) M = Q²/(gA) + A·ȳ in a channel is used mainly to:<\/p>","a":0,"s":"<p>Across a jump on a horizontal frictionless bed, external forces vanish, so M1 = M2. M is minimum at critical depth.<br>Other options: B — alternate depths have equal specific energy, not equal M; C — normal depth comes from Manning&#x27;s/Chezy&#x27;s equation; D — friction loss uses the uniform-flow formulae.<\/p>","tag":""},{"id":"5.3.19","m":1,"o":["0.888 m","0.939 m","1.258 m","1.309 m"],"q":"<p>A rectangular channel carries 2 m³/s per metre width at a depth of 2 m. The minimum height of a smooth hump on the bed that will just make the flow critical over it (neglect losses) is:<\/p>","a":1,"s":"<p>V1 = 1 m/s, E1 = 2 + 1/19.62 = 2.0510 m. yc = (4/9.81)^(1/3) = 0.7415 m, Ec = 1.5yc = 1.1123 m. ΔZ = E1 − Ec = 0.939 m.<br>Other options: A — approach velocity head neglected (y1 − Ec); C — y1 − yc used, ignoring velocity heads; D — E1 − yc used; the hump must equal E1 − Ec = E1 − 1.5yc.<\/p>","tag":""},{"id":"5.3.20","m":1,"o":["Rises, because the bed rises","Stays at the same elevation","Rises upstream and a hydraulic jump forms on the hump","Drops, the depth over the hump being less than the upstream depth"],"q":"<p>Subcritical flow in a rectangular channel passes over a smooth hump whose height is less than the critical hump height. The water surface over the hump:<\/p>","a":3,"s":"<p>E2 = E1 − ΔZ; on the subcritical branch, lower E means lower depth, and the fall in depth exceeds ΔZ, so the water surface dips.<br>Other options: A — in subcritical flow the specific energy drop lowers the depth by more than the hump height; B — the depth must change because E decreases by ΔZ; C — a jump needs supercritical flow; the flow here stays subcritical.<\/p>","tag":""},{"id":"5.3.21","m":1,"o":["0.652 m","1.198 m","1.244 m","1.500 m"],"q":"<p>A rectangular channel 3 m wide carries 6 m³/s at a depth of 2 m. Neglecting losses, the minimum width to which it can be contracted without affecting the upstream flow (i.e. critical flow just occurs at the throat) is:<\/p>","a":1,"s":"<p>V1 = 1 m/s, E1 = 2.051 m. At the throat yc = (2/3)E1 = 1.3673 m, q2 = √(g yc³) = 5.008 m²/s, b2 = 6/q2 = 1.198 m.<br>Other options: A — critical depth at the throat taken equal to E1 instead of (2/3)E1; C — velocity head of the approach flow ignored (E1 taken as 2 m); D — width simply halved without analysis.<\/p>","tag":""},{"id":"5.3.22","m":1,"o":["0.1354 m³/s","0.319 m³/s","0.451 m³/s","0.677 m³/s"],"q":"<p>A rectangular sharp-crested notch 1.5 m long (no end contractions considered) has a head of 0.3 m. With Cd = 0.62, the discharge is:<\/p>","a":2,"s":"<p>Q = (2/3) Cd L √(2g) H^(3/2) = (2/3) × 0.62 × 1.5 × 4.429 × 0.3^1.5 = 0.451 m³/s.<br>Other options: A — H raised to 5/2 (V-notch exponent); B — √g used instead of √(2g); D — factor 2/3 omitted.<\/p>","tag":""},{"id":"5.3.23","m":1,"o":["31.3 L/s","44.3 L/s","55.4 L/s","177.2 L/s"],"q":"<p>A 90° V-notch with Cd = 0.6 runs under a head of 0.25 m. The discharge is:<\/p>","a":1,"s":"<p>Q = (8/15) Cd √(2g) tan(θ/2) H^(5/2) = 0.5333 × 0.6 × 4.429 × 1 × 0.25^2.5 = 0.04429 m³/s = 44.3 L/s.<br>Other options: A — √g used instead of √(2g); C — coefficient 2/3 used instead of 8/15; D — H raised to 3/2 (rectangular exponent).<\/p>","tag":""},{"id":"5.3.24","m":1,"o":["0.5%","1.0%","1.5%","2.5%"],"q":"<p>For a rectangular weir, an error of 1% in measuring the head produces an error in the computed discharge of about:<\/p>","a":2,"s":"<p>Q = k H^(3/2) → dQ/Q = 1.5 dH/H = 1.5 × 1% = 1.5%.<br>Other options: A — the exponent is 3/2, not 1/2; B — Q ∝ H^1.5, not H; D — that is for a V-notch, Q ∝ H^2.5.<\/p>","tag":""},{"id":"5.3.25","m":1,"o":["1 horizontal to 4 vertical, so that the side triangles offset the end-contraction loss","1 horizontal to 1 vertical, giving a 90° notch","4 horizontal to 1 vertical","1 horizontal to 2 vertical, giving maximum discharge"],"q":"<p>A Cipolletti weir is a trapezoidal weir whose sides are inclined at:<\/p>","a":0,"s":"<p>With 1 H : 4 V sides (≈ 14° to the vertical), the extra flow through the triangular parts equals the reduction due to two end contractions, so Q = 1.86 L H^(3/2) (SI) with L the crest length.<br>Other options: B — that is a V-notch geometry; C — the ratio is inverted; such flat sides add far too much flow; D — the slope is chosen to cancel end contractions, not to maximise Q.<\/p>","tag":""},{"id":"5.3.26","m":1,"o":["0.856 m³/s","0.894 m³/s","0.912 m³/s","0.931 m³/s"],"q":"<p>A rectangular weir 2 m long with two end contractions discharges under a head of 0.4 m. Using Francis&#x27; formula Q = 1.84 L_e H^(3/2) (SI), the discharge is:<\/p>","a":1,"s":"<p>L_e = L − 0.1 n H = 2 − 0.1 × 2 × 0.4 = 1.92 m; Q = 1.84 × 1.92 × 0.4^1.5 = 0.894 m³/s.<br>Other options: A — 0.2 nH deducted instead of 0.1 nH; C — only one end contraction deducted; D — end contractions ignored.<\/p>","tag":""},{"id":"5.3.27","m":1,"o":["1.284 m³/s","2.140 m³/s","2.377 m³/s","3.706 m³/s"],"q":"<p>A broad-crested weir 3 m long has a head of 0.6 m above the crest. Neglecting the velocity of approach and taking Cd = 0.9, the maximum discharge Q = 1.705 Cd L H^(3/2) is:<\/p>","a":1,"s":"<p>Q = 1.705 × 0.9 × 3 × 0.6^1.5 = 2.140 m³/s (critical depth (2/3)H forms on the crest).<br>Other options: A — H raised to 5/2; C — Cd not applied; D — sharp-crested weir formula used.<\/p>","tag":""},{"id":"5.3.28","m":1,"o":["Decreased by the approach velocity head","Unchanged; only Cd changes","Increased by twice the measured head","Increased, because the approach velocity head ha = Va²/2g is added"],"q":"<p>When the velocity of approach is taken into account in the discharge over a weir, the effective head is:<\/p>","a":3,"s":"<p>Q = (2/3)Cd L√(2g)[(H + ha)^(3/2) − ha^(3/2)], giving a larger Q than with H alone.<br>Other options: A — approach velocity carries extra energy, it does not reduce head; B — the formula is modified as (H + ha)^(3/2) − ha^(3/2); C — only ha is added, which is usually small.<\/p>","tag":""},{"id":"5.3.29","m":1,"o":["The depth of flow","Half the depth of flow","The width of the channel","Twice the depth of flow"],"q":"<p>For a very wide rectangular channel, the hydraulic radius is approximately equal to:<\/p>","a":0,"s":"<p>R = by/(b + 2y) = y/(1 + 2y/b) → y when b ≫ y.<br>Other options: B — y/2 is the R of the most economical rectangular section; C — R = by/(b + 2y) → y as b → ∞, not b; D — R can never exceed y in a rectangular channel.<\/p>","tag":""},{"id":"5.3.30","m":1,"o":["0.00134","0.00221","0.00244","0.00298"],"q":"<p>A wide rectangular channel (n = 0.015) carries 2 m³/s per metre width. The bed slope at which uniform flow would be critical (critical slope) is:<\/p>","a":2,"s":"<p>yc = (4/9.81)^(1/3) = 0.7415 m. Equating q = (1/n) y^(5/3) S^(1/2) with q² = g yc³ gives Sc = g n²/yc^(1/3) = 9.81 × 0.000225/0.9051 = 0.00244.<br>Other options: A — q² n²/y^(4/3) used — the depth exponent for q² must be 10/3; B — yc term omitted; D — yc raised to 1 instead of 1/3.<\/p>","tag":""}]},{"k":"5.4","t":"Non-uniform Flow, Hydraulic Jump, Mobile Boundary and Similitude","qs":[{"id":"5.4.1","m":1,"o":["dy/dx = (S0 − Sf)/(1 − F²)","dy/dx = (S0 + Sf)/(1 − F²)","dy/dx = (S0 − Sf)/(1 + F²)","dy/dx = (1 − F²)/(S0 − Sf)"],"q":"<p>The dynamic equation of gradually varied flow in a prismatic channel (S0 = bed slope, Sf = friction slope, F = Froude number) is:<\/p>","a":0,"s":"<p>From dE/dx = S0 − Sf and dE/dy = 1 − F²: dy/dx = (S0 − Sf)/(1 − F²).<br>Other options: B — friction reduces the energy, so Sf is subtracted; C — the denominator is 1 − F², which vanishes at critical flow; D — numerator and denominator interchanged.<\/p>","tag":""},{"id":"5.4.2","m":1,"o":["Equal to the bed slope everywhere","Zero, because the flow varies gradually","Equal to the slope of the water surface","Given by a uniform-flow formula (Manning or Chezy) using the local depth and velocity"],"q":"<p>In the analysis of gradually varied flow, the friction slope at a section is assumed to be:<\/p>","a":3,"s":"<p>GVF assumes hydrostatic pressure and that the head loss at a section equals that of uniform flow with the same depth and velocity.<br>Other options: A — Sf = S0 only in uniform flow; GVF is non-uniform; B — friction is the very cause of the profile curvature; C — the water-surface slope equals S0 − dy/dx, not Sf.<\/p>","tag":""},{"id":"5.4.3","m":1,"o":["M2 profile","M3 profile","M1 profile","S1 profile"],"q":"<p>The backwater curve formed upstream of a dam or weir across a channel of mild slope is a:<\/p>","a":2,"s":"<p>Behind the dam y &gt; yn &gt; yc on a mild slope (zone 1); the depth increases in the flow direction — the M1 backwater curve.<br>Other options: A — M2 is a drawdown curve with yn &gt; y &gt; yc; B — M3 lies below critical depth, e.g. downstream of a sluice gate; D — S profiles occur on steep slopes.<\/p>","tag":""},{"id":"5.4.4","m":1,"o":["M1","M2","M3","H2"],"q":"<p>The water surface profile just upstream of a free overfall at the end of a long channel of mild slope is:<\/p>","a":1,"s":"<p>The depth falls from yn towards yc at the brink (yn &gt; y &gt; yc): a drawdown M2 curve.<br>Other options: A — M1 is a rising (backwater) curve above normal depth; C — M3 is below critical depth; flow approaching the overfall is subcritical; D — H2 occurs on a horizontal bed, not a mild slope.<\/p>","tag":""},{"id":"5.4.5","m":1,"o":["M3 profile","M1 profile","M2 profile","S3 profile"],"q":"<p>Supercritical flow issuing from under a sluice gate onto a mild slope, before a hydraulic jump forms, follows an:<\/p>","a":0,"s":"<p>Below the gate y &lt; yc &lt; yn on a mild slope; the depth increases downstream until a jump to the subcritical depth occurs.<br>Other options: B — M1 is subcritical and above normal depth; C — M2 lies between yn and yc, i.e. it is subcritical; D — S3 occurs on a steep slope.<\/p>","tag":""},{"id":"5.4.6","m":1,"o":["Its normal depth exceeds its critical depth","Its normal depth equals its critical depth","Its bed slope exceeds 1 in 100","Its critical depth exceeds its normal depth (yc &gt; yn)"],"q":"<p>A channel is said to have a steep slope when:<\/p>","a":3,"s":"<p>A steep (S) slope is one on which uniform flow would be supercritical, i.e. yn &lt; yc.<br>Other options: A — yn &gt; yc defines a mild slope; B — yn = yc defines a critical slope; C — classification depends on yn vs yc, not on a fixed slope value.<\/p>","tag":""},{"id":"5.4.7","m":1,"o":["H2","H3","H1","A2"],"q":"<p>On a horizontal channel bed, which of the following gradually varied flow profiles cannot occur?<\/p>","a":2,"s":"<p>For S0 = 0, yn → ∞, so there is no zone above normal depth; similarly A1 does not exist on adverse slopes.<br>Other options: A — H2 (y &gt; yc) occurs, e.g. upstream of a free overfall on a horizontal bed; B — H3 (y &lt; yc) occurs, e.g. below a sluice gate on a horizontal bed; D — A2 is a real profile on an adverse slope.<\/p>","tag":""},{"id":"5.4.8","m":1,"o":["The bed is horizontal","The normal depth equals the critical depth","The bed slope is adverse","The normal depth exceeds the critical depth"],"q":"<p>Critical-slope (C) water surface profiles occur in a channel in which:<\/p>","a":1,"s":"<p>When yn = yc only zones 1 and 3 exist, giving C1 and C3 profiles that are nearly horizontal.<br>Other options: A — that gives H profiles; C — that gives A profiles; D — that is a mild slope (M profiles).<\/p>","tag":""},{"id":"5.4.9","m":1,"o":["M2 and S2, passing through critical depth at the break","M1 and S1","M3 and S3","M2 and S3, with a hydraulic jump at the break"],"q":"<p>A long channel of mild slope changes abruptly to a long channel of steep slope. The water surface profiles upstream and downstream of the break are respectively:<\/p>","a":0,"s":"<p>Flow accelerates from yn(mild) &gt; yc down to yc at the break (M2) and then from yc to the smaller yn(steep) (S2).<br>Other options: B — M1/S1 are backwater curves above yn; nothing here raises the depth; C — upstream flow is subcritical, so it cannot be M3; D — a jump occurs going from supercritical to subcritical, the reverse of this case.<\/p>","tag":""},{"id":"5.4.10","m":1,"o":["36.4 m","50.0 m","80.0 m","133.3 m"],"q":"<p>In a direct-step computation, the specific energies at two sections are 1.500 m (section 1) and 1.520 m (section 2). The bed slope is 0.0004 and the mean friction slope between the sections is 0.00015. The distance between the sections is:<\/p>","a":2,"s":"<p>Δx = (E2 − E1)/(S0 − S̄f) = 0.020/(0.0004 − 0.00015) = 0.020/0.00025 = 80.0 m.<br>Other options: A — S0 + Sf used in the denominator; B — friction slope ignored (ΔE/S0); D — bed slope ignored (ΔE/Sf).<\/p>","tag":""},{"id":"5.4.11","m":1,"o":["Subcritical to supercritical","Laminar to turbulent","Uniform to gradually varied flow","Supercritical to subcritical"],"q":"<p>A hydraulic jump occurs in an open channel when the flow changes from:<\/p>","a":3,"s":"<p>The jump is the abrupt rise from a supercritical depth y1 to its sequent subcritical depth y2, with large energy loss.<br>Other options: A — that change is gradual, through critical depth (e.g. at a free overfall or a break to steep slope); B — the jump concerns depth regimes (Froude number), not Reynolds number; C — a jump is rapidly varied flow.<\/p>","tag":""},{"id":"5.4.12","m":1,"o":["0.940 m","1.682 m","2.182 m","3.364 m"],"q":"<p>A hydraulic jump forms in a rectangular channel where the supercritical depth is 0.5 m and the velocity is 6 m/s. The sequent (conjugate) depth is:<\/p>","a":1,"s":"<p>F1 = 6/√(9.81 × 0.5) = 2.709. y2 = (y1/2)[√(1 + 8F1²) − 1] = 0.25 × [√59.72 − 1] = 1.682 m.<br>Other options: A — F1 used instead of F1² inside the root; C — +1 used instead of −1; D — the factor ½ omitted.<\/p>","tag":""},{"id":"5.4.13","m":1,"o":["0.80 m","1.28 m","2.56 m","5.12 m"],"q":"<p>The depths before and after a hydraulic jump in a rectangular channel are 0.4 m and 2.0 m. The head lost in the jump is:<\/p>","a":1,"s":"<p>h_L = (y2 − y1)³/(4 y1 y2) = 1.6³/(4 × 0.4 × 2.0) = 4.096/3.2 = 1.28 m.<br>Other options: A — (y2 − y1) squared instead of cubed; C — denominator taken as 2y1y2; D — the factor 4 in the denominator omitted.<\/p>","tag":""},{"id":"5.4.14","m":1,"o":["1.242 m","2.663 m","2.863 m","3.063 m"],"q":"<p>A rectangular channel carries 4 m³/s per metre width. A hydraulic jump forms with an initial depth of 0.4 m. The sequent depth is:<\/p>","a":1,"s":"<p>y2 = −y1/2 + √(y1²/4 + 2q²/(g y1)) = −0.2 + √(0.04 + 32/3.924) = −0.2 + 2.8627 = 2.663 m.<br>Other options: A — q used instead of q²; C — the −y1/2 term omitted; D — +y1/2 used instead of −y1/2.<\/p>","tag":""},{"id":"5.4.15","m":1,"o":["Weak jump","Oscillating jump","Steady jump","Undular jump"],"q":"<p>A hydraulic jump with an initial Froude number of 6 is classified (USBR) as a:<\/p>","a":2,"s":"<p>F1 between 4.5 and 9 gives a well-established steady jump with 45–70% energy dissipation — preferred for stilling basins. F1 &gt; 9 is a strong jump.<br>Other options: A — weak jumps have F1 ≈ 1.7–2.5; B — oscillating jumps have F1 ≈ 2.5–4.5; D — undular jumps have F1 ≈ 1–1.7.<\/p>","tag":""},{"id":"5.4.16","m":1,"o":["12.8 kW","76.6 kW","125.6 kW","1256 kW"],"q":"<p>A hydraulic jump in a stilling basin dissipates a head of 1.28 m when the discharge is 10 m³/s. The power dissipated in the jump is:<\/p>","a":2,"s":"<p>P = γ Q h_L = 9.81 × 10 × 1.28 = 125.6 kW.<br>Other options: A — ρQh used without g; B — head divided instead of multiplied; D — decimal slip by a factor 10.<\/p>","tag":""},{"id":"5.4.17","m":1,"o":["The critical shear stress for the beginning of sediment motion","The regime width of an alluvial channel","The fall velocity of sediment particles","The roughness coefficient of a lined canal"],"q":"<p>The Shields diagram is used in mobile-boundary hydraulics to determine:<\/p>","a":0,"s":"<p>Shields plots the dimensionless shear τc/[(γs − γ)d] against the boundary (shear) Reynolds number u*d/ν; above the curve, particles move.<br>Other options: B — regime width comes from Lacey&#x27;s P = 4.75√Q; C — fall velocity is from Stokes&#x27; law or Rubey&#x27;s formula; D — Manning&#x27;s n is taken from tables, not from Shields.<\/p>","tag":""},{"id":"5.4.18","m":1,"o":["0.400 N/m²","1.962 N/m²","3.924 N/m²","7.848 N/m²"],"q":"<p>The average boundary shear stress (tractive force) on the bed of a wide channel flowing 2 m deep on a slope of 1 in 5000 is:<\/p>","a":2,"s":"<p>τ0 = γ R S ≈ γ y S = 9810 × 2 × (1/5000) = 3.924 N/m².<br>Other options: A — ρ used instead of γ (g omitted); B — factor ½ wrongly introduced; D — depth squared.<\/p>","tag":""},{"id":"5.4.19","m":1,"o":["15.02 m","22.05 m","47.5 m","475 m"],"q":"<p>According to Lacey&#x27;s regime theory, the wetted perimeter of a regime channel carrying 100 m³/s is:<\/p>","a":2,"s":"<p>P = 4.75 √Q = 4.75 × 10 = 47.5 m (SI units).<br>Other options: A — √10 taken instead of √100; B — cube root of Q used instead of square root; D — square root of Q not taken.<\/p>","tag":""},{"id":"5.4.20","m":1,"o":["0.793 m/s","0.801 m/s","0.868 m/s","0.895 m/s"],"q":"<p>Using Lacey&#x27;s theory, the regime velocity for a channel carrying 50 m³/s in alluvium with silt factor f = 1.2 is:<\/p>","a":3,"s":"<p>V = (Q f²/140)^(1/6) = (50 × 1.44/140)^(1/6) = 0.5143^(1/6) = 0.895 m/s.<br>Other options: A — f² placed in the denominator; B — exponent 1/3 used instead of 1/6; C — f used instead of f².<\/p>","tag":""},{"id":"5.4.21","m":1,"o":["0.857 m/s","0.943 m/s","1.210 m/s","1.440 m/s"],"q":"<p>Using Kennedy&#x27;s formula V0 = 0.55 m D^0.64 (SI), the critical velocity in a channel 2 m deep with critical velocity ratio m = 1.1 is:<\/p>","a":1,"s":"<p>V0 = 0.55 × 1.1 × 2^0.64 = 0.605 × 1.5583 = 0.943 m/s.<br>Other options: A — critical velocity ratio m omitted; C — D not raised to the power 0.64; D — FPS coefficient 0.84 used with depth in metres.<\/p>","tag":""},{"id":"5.4.22","m":1,"o":["Just starts scouring of a lined canal","Gives the maximum discharge for a given section","Makes the Froude number equal to one","Keeps the channel free from both silting and scouring"],"q":"<p>In Kennedy&#x27;s silt theory, the critical velocity is defined as the mean velocity that:<\/p>","a":3,"s":"<p>Kennedy attributed silt support to eddies from the bed; at V0 the channel neither silts nor scours. V/V0 = m is the critical velocity ratio.<br>Other options: A — Kennedy&#x27;s theory is for unlined alluvial channels; B — critical velocity is about sediment balance, not discharge maximisation; C — that is critical flow in the hydraulic (specific energy) sense.<\/p>","tag":""},{"id":"5.4.23","m":1,"o":["3","4","7","10"],"q":"<p>A physical phenomenon is described by 7 variables involving 3 fundamental dimensions (M, L, T). By Buckingham&#x27;s π theorem, the number of independent dimensionless π groups is:<\/p>","a":1,"s":"<p>Number of π terms = n − m = 7 − 3 = 4.<br>Other options: A — that is the number of fundamental dimensions (repeating variables); C — that is the number of variables; D — variables and dimensions added.<\/p>","tag":""},{"id":"5.4.24","m":1,"o":["M L⁻¹ T⁻¹","L² T⁻¹","M L T⁻²","M L⁻¹ T⁻²"],"q":"<p>The dimensions of dynamic viscosity μ are:<\/p>","a":0,"s":"<p>μ = τ/(du/dy) = (M L⁻¹ T⁻²)/(T⁻¹) = M L⁻¹ T⁻¹.<br>Other options: B — that is kinematic viscosity ν; C — that is force; D — that is stress or pressure.<\/p>","tag":""},{"id":"5.4.25","m":1,"o":["0.16 m³/s","0.80 m³/s","4.00 m³/s","100 m³/s"],"q":"<p>A spillway model is built to a scale of 1 : 25 using Froude&#x27;s law. If the prototype discharge is 500 m³/s, the model discharge is:<\/p>","a":0,"s":"<p>Qr = Lr^(5/2) = 25^2.5 = 3125 → Qm = 500/3125 = 0.16 m³/s.<br>Other options: B — Lr² used (area ratio only); C — Lr^1.5 used; D — Lr^0.5 used (that is the velocity ratio).<\/p>","tag":""},{"id":"5.4.26","m":1,"o":["0.33 s","12 s","72 s","432 s"],"q":"<p>In a 1 : 36 Froude model of a harbour, a wave period of 2 s is observed. The corresponding wave period in the prototype is:<\/p>","a":1,"s":"<p>Tr = √Lr = √36 = 6 → Tp = 6 × 2 = 12 s.<br>Other options: A — the scale applied the wrong way (prototype ÷ √Lr); C — time scaled by Lr instead of √Lr; D — time scaled by Lr^1.5.<\/p>","tag":""},{"id":"5.4.27","m":1,"o":["0.2 m/s","6.32 m/s","20 m/s","200 m/s"],"q":"<p>A pipe model at 1 : 10 scale is tested with the same fluid as the prototype using Reynolds&#x27; model law. If the prototype velocity is 2 m/s, the velocity in the model must be:<\/p>","a":2,"s":"<p>Re equal, same ν: Vm Lm = Vp Lp → Vm = Vp × Lp/Lm = 2 × 10 = 20 m/s.<br>Other options: A — ratio applied the wrong way; B — Froude law (√Lr) used; D — Lr² used.<\/p>","tag":""},{"id":"5.4.28","m":1,"o":["12.5 kN","88.4 kN","625 kN","4419 kN"],"q":"<p>A force of 5 N is measured on a 1 : 50 Froude model of a structure (same fluid as the prototype). The corresponding prototype force is:<\/p>","a":2,"s":"<p>Fr = ρr Lr³ = 50³ = 125 000 → Fp = 5 × 125 000 N = 625 kN.<br>Other options: A — force scaled by Lr² instead of Lr³; B — Lr^2.5 (discharge scale) used; D — Lr^3.5 (power scale) used.<\/p>","tag":""},{"id":"5.4.29","m":1,"o":["Ship hulls in towing tanks","Pumps and turbines","Flow through closed pipes","Rivers and estuaries, where an undistorted model would give very small depths"],"q":"<p>Distorted models, with a larger vertical scale than horizontal scale, are commonly used for:<\/p>","a":3,"s":"<p>Exaggerating the vertical scale keeps depths large enough to avoid surface tension effects and laminar flow, and makes levels measurable.<br>Other options: A — ship models must be geometrically similar to reproduce wave resistance; B — hydraulic machines need geometric similarity and use specific-speed laws; C — pipe models follow Reynolds&#x27; law and are undistorted.<\/p>","tag":""},{"id":"5.4.30","m":1,"o":["Froude&#x27;s law","Weber&#x27;s law","Mach&#x27;s law","Reynolds&#x27; law"],"q":"<p>The model law appropriate for studying flow through a closed pipe running full (no free surface) is:<\/p>","a":3,"s":"<p>In full pipe flow, gravity has no effect on the flow pattern; viscous and inertia forces dominate, so the Reynolds number must be equal in model and prototype.<br>Other options: A — Froude similarity matters where gravity/free surface dominates (spillways, open channels); B — Weber similarity matters where surface tension is important (capillary waves, small jets); C — Mach similarity matters for compressible high-speed flows.<\/p>","tag":""}]},{"k":"5.5","t":"Physical Hydrology, Runoff and Hydrographs","qs":[{"id":"5.5.1","m":1,"o":["Orographic precipitation","Convective precipitation","Frontal (cyclonic) precipitation","Advective fog drip"],"q":"<p>The heavy monsoon rainfall on the southern slopes of the Himalaya, caused by moist air being forced to rise over the mountain barrier, is an example of:<\/p>","a":0,"s":"<p>Mechanical lifting of moist air over mountains cools it adiabatically, producing heavy rain on the windward side and a rain shadow on the leeward side.<br>Other options: B — convective rain is due to local surface heating and rising warm air; C — frontal rain results from the meeting of warm and cold air masses; D — fog drip is a minor form of deposition, not monsoon rainfall.<\/p>","tag":""},{"id":"5.5.2","m":1,"o":["2.22 m³/s","3.49 m³/s","5.71 m³/s","83.7 m³/s"],"q":"<p>A catchment of 100 km² receives an annual rainfall of 1800 mm, of which 700 mm is lost as evapotranspiration. Assuming no change in storage and no deep groundwater loss, the mean annual flow at the outlet is:<\/p>","a":1,"s":"<p>Runoff depth = 1800 − 700 = 1100 mm. Volume = 1.1 × 100 × 10⁶ = 110 × 10⁶ m³/yr. Q = 110 × 10⁶/(365 × 86 400) = 3.49 m³/s.<br>Other options: A — evapotranspiration taken as the runoff; C — evapotranspiration not subtracted; D — seconds in a year taken as 365 × 3600.<\/p>","tag":""},{"id":"5.5.3","m":1,"o":["Tipping bucket gauge","Weighing bucket gauge","Symon&#x27;s gauge","Natural siphon (float) gauge"],"q":"<p>Which of the following rain gauges is a non-recording type?<\/p>","a":2,"s":"<p>Symon&#x27;s gauge (the standard non-recording gauge) only collects rainfall, which is measured once a day with a graduated jar.<br>Other options: A — it records each 0.2 mm (or similar) tip electrically, giving intensity; B — it records the accumulated weight on a chart; D — it records the float rise on a clock-driven drum.<\/p>","tag":""},{"id":"5.5.4","m":1,"o":["4","11","16","21"],"q":"<p>A catchment has 5 rain gauges. The coefficient of variation of their annual rainfall is 40%. The number of additional gauges needed to limit the error in the mean rainfall to 10% is:<\/p>","a":1,"s":"<p>N = (Cv/ε)² = (40/10)² = 16. Additional gauges = 16 − 5 = 11.<br>Other options: A — (Cv/ε) not squared; C — that is the total number of gauges required, not the additional number; D — existing gauges added instead of subtracted.<\/p>","tag":""},{"id":"5.5.5","m":1,"o":["47 mm","50 mm","53 mm","60 mm"],"q":"<p>Three rain gauges A, B and C recorded 40 mm, 50 mm and 60 mm of rain. Their Thiessen polygon areas within the catchment are 20 km², 30 km² and 50 km² respectively. The mean areal rainfall is:<\/p>","a":2,"s":"<p>P = Σ PiAi/ΣAi = (40 × 20 + 50 × 30 + 60 × 50)/100 = 53 mm.<br>Other options: A — areas matched to the wrong stations (reversed); B — arithmetic mean of the three gauges, ignoring areas; D — the highest gauge reading taken.<\/p>","tag":""},{"id":"5.5.6","m":1,"o":["19 mm","24 mm","25 mm","29 mm"],"q":"<p>For a storm over a 100 km² catchment, the areas between successive isohyets are: 10–20 mm: 30 km², 20–30 mm: 50 km², 30–40 mm: 20 km². The mean areal rainfall by the isohyetal method is:<\/p>","a":1,"s":"<p>P = Σ(mean of two isohyets × area)/ΣA = (15 × 30 + 25 × 50 + 35 × 20)/100 = 24 mm.<br>Other options: A — the lower isohyet value used for each strip; C — plain average of the isohyet values; D — the upper isohyet value used for each strip instead of the mean.<\/p>","tag":""},{"id":"5.5.7","m":1,"o":["51.85 mm","55.00 mm","59.17 mm","155.56 mm"],"q":"<p>Station X (normal annual rainfall 1000 mm) was out of order during a storm. Three surrounding stations A, B, C with normal annual rainfalls of 1200, 900 and 1100 mm recorded 60, 50 and 55 mm in that storm. Using the normal ratio method, the storm rainfall at X is:<\/p>","a":0,"s":"<p>Px = (Nx/3)(PA/NA + PB/NB + PC/NC) = (1000/3)(0.05 + 0.0556 + 0.05) = 51.85 mm.<br>Other options: B — simple arithmetic mean, valid only if normals differ by less than 10%; C — the ratios Ni/Nx inverted; D — the sum not divided by the number of stations.<\/p>","tag":""},{"id":"5.5.8","m":1,"o":["45 mm","60 mm","72 mm","80 mm"],"q":"<p>The double mass curve of a station against a group of base stations shows a slope of 1.2 up to a known gauge relocation and 0.9 after it. To make the recent record consistent with the earlier record, a monthly rainfall of 60 mm recorded after the relocation should be corrected to:<\/p>","a":3,"s":"<p>Pcx = Px × (Mc/Ma) = 60 × (1.2/0.9) = 80 mm. The double mass curve checks the consistency of a gauge record.<br>Other options: A — slope ratio inverted (0.9/1.2); B — no correction applied; C — multiplied by 1.2 only, ignoring the present slope.<\/p>","tag":""},{"id":"5.5.9","m":1,"o":["6.77 mm/h","8.12 mm/h","16.77 mm/h","28.39 mm/h"],"q":"<p>For a soil, Horton&#x27;s infiltration parameters are f0 = 60 mm/h, fc = 10 mm/h and k = 2 h⁻¹. The infiltration capacity 1 hour after the start of rain (with rain intensity always exceeding capacity) is:<\/p>","a":2,"s":"<p>f = fc + (f0 − fc)e^(−kt) = 10 + 50 e^(−2) = 10 + 6.77 = 16.77 mm/h.<br>Other options: A — fc not added; B — f0 e^(−kt) used, ignoring fc; D — k taken as 1 h⁻¹ (exponent −1).<\/p>","tag":""},{"id":"5.5.10","m":1,"o":["21.83 mm","24.54 mm","44.54 mm","120.00 mm"],"q":"<p>With Horton&#x27;s parameters f0 = 60 mm/h, fc = 10 mm/h and k = 2 h⁻¹, the total infiltration depth during the first 2 hours (rain intensity always above capacity) is:<\/p>","a":2,"s":"<p>F = fc t + [(f0 − fc)/k](1 − e^(−kt)) = 10 × 2 + (50/2)(1 − e^(−4)) = 20 + 24.54 = 44.54 mm.<br>Other options: A — capacity at t = 2 h multiplied by 2 h; B — the fc·t term omitted; D — initial capacity f0 used for the whole 2 h.<\/p>","tag":""},{"id":"5.5.11","m":1,"o":["0.90 cm/h","1.00 cm/h","1.125 cm/h","1.50 cm/h"],"q":"<p>A 5-hour storm has hourly rainfall intensities of 0.5, 1.5, 3.0, 2.5 and 1.0 cm/h. The resulting direct runoff is 4.0 cm. The φ-index of the storm is:<\/p>","a":1,"s":"<p>Trial: with φ ≈ 1 the hours with intensity &gt; φ are 1.5, 3.0, 2.5 → (1.5 + 3.0 + 2.5 − 4.0)/3 = 1.0 cm/h; the 1.0 and 0.5 cm/h hours give no excess, so φ = 1.0 cm/h is consistent.<br>Other options: A — all 5 hours assumed to produce runoff; C — the 0.5 cm hour excluded from the time but its rain left in the total; D — the second-hour intensity taken as φ without checking.<\/p>","tag":""},{"id":"5.5.12","m":1,"o":["Includes initial losses, so it is larger","Is based on the peak rainfall intensity","Applies only to impervious urban catchments","Excludes initial losses such as interception and depression storage, so it is smaller"],"q":"<p>The W-index of infiltration differs from the φ-index in that the W-index:<\/p>","a":3,"s":"<p>W = (P − R − Ia)/te; removing Ia makes W ≤ φ. For very wet conditions the two are nearly equal.<br>Other options: A — initial losses are removed in the W-index, not added; B — both indices are average loss rates; C — both are used for natural catchments.<\/p>","tag":""},{"id":"5.5.13","m":1,"o":["5.6 mm/day","6.4 mm/day","8.0 mm/day","11.4 mm/day"],"q":"<p>A Class A land pan records an evaporation of 8 mm/day. Taking a pan coefficient of 0.7, the evaporation from a nearby lake is:<\/p>","a":0,"s":"<p>Lake evaporation = Cp × pan evaporation = 0.7 × 8 = 5.6 mm/day (pans overestimate lake evaporation).<br>Other options: B — pan coefficient 0.8 used (that is for a sunken pan); C — pan coefficient not applied; D — pan evaporation divided by the coefficient.<\/p>","tag":""},{"id":"5.5.14","m":1,"o":["The air temperature alone","The relative humidity of the air","The depth of water in the reservoir","The difference between the saturation vapour pressure at water temperature and the actual vapour pressure of the air"],"q":"<p>According to Dalton&#x27;s law of evaporation, the rate of evaporation from a water surface is proportional to:<\/p>","a":3,"s":"<p>E = K(ew − ea), with K depending on wind speed.<br>Other options: A — temperature acts only through the vapour pressures; B — higher humidity reduces evaporation; the driver is the vapour-pressure deficit; C — depth affects heat storage, not the Dalton driving term.<\/p>","tag":""},{"id":"5.5.15","m":1,"o":["Afforestation of the catchment","Construction of farm ponds and check dams","An elongated (fern-leaf) catchment shape","Urbanisation with paved surfaces and storm drains"],"q":"<p>Other factors remaining the same, which change in a catchment increases the peak of the flood hydrograph?<\/p>","a":3,"s":"<p>Impervious surfaces cut infiltration and drains shorten the travel time, so runoff volume and peak both increase.<br>Other options: A — forests increase interception and infiltration, lowering peaks; B — these add storage and attenuate peaks; C — elongated catchments give lower, flatter peaks than fan-shaped ones.<\/p>","tag":""},{"id":"5.5.16","m":1,"o":["21.00 mm","21.87 mm","24.30 mm","27.00 mm"],"q":"<p>The antecedent precipitation index of a catchment is 30 mm today. If no rain falls for the next 3 days and the recession constant K = 0.9 per day, the index after 3 days is:<\/p>","a":1,"s":"<p>API_t = API_0 × K^t = 30 × 0.9³ = 21.87 mm.<br>Other options: A — linear decay of 10% per day assumed; C — decay applied for two days; D — decay applied for only one day.<\/p>","tag":""},{"id":"5.5.17","m":1,"o":["1.50 Mm³","2.10 Mm³","2.50 Mm³","15 Mm³"],"q":"<p>For a catchment of 50 km², the rainfall–runoff correlation is R = 0.6(P − 20) mm for P &gt; 20 mm. The runoff volume from a storm of 70 mm is:<\/p>","a":0,"s":"<p>R = 0.6 × (70 − 20) = 30 mm; volume = 0.030 × 50 × 10⁶ = 1.50 × 10⁶ m³.<br>Other options: B — the threshold 20 mm not subtracted; C — coefficient 0.6 omitted; D — mm converted to m by dividing by 100.<\/p>","tag":""},{"id":"5.5.18","m":1,"o":["Direct rainfall on the stream channel","Overland flow from the catchment surface","Prompt interflow through the upper soil","Groundwater discharge into the stream"],"q":"<p>The bas
