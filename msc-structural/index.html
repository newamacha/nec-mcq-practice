3,"s":"<p>Applying M at a pinned near end with far end fixed induces M/2 at the far end.<br>Other options: A — no member carries over the full moment; B — the stiffness reduction factor 3/4 used for a pinned far end; C — far end pinned (nothing carried over).<\/p>","tag":"Sub-chapter 3.4"},{"id":"M1-57","m":1,"o":["200 kNm","50 kNm","100 kNm","400 kNm"],"q":"<p>A single concentrated load of 50 kN rolls across a simply supported beam of 8 m span. Using the influence line, the maximum bending moment at mid-span is:<\/p>","a":2,"s":"<p>ILD for mid-span moment is a triangle with peak L/4 = 2 m under the section; M max = 50 × 2 = 100 kNm.<br>Other options: A — used ordinate L/2; B — ordinate taken as 1; D — 50 × 8, the span itself.<\/p>","tag":"Sub-chapter 3.5"},{"id":"M1-58","m":1,"o":["1.7","1.5","2.0","1.14"],"q":"<p>The shape factor of a solid rectangular cross-section is:<\/p>","a":1,"s":"<p>S = Zp/Ze = (bd²/4)/(bd²/6) = 1.5.<br>Other options: A — solid circular section; C — diamond (rhombus) section; D — typical rolled I-section.<\/p>","tag":"Sub-chapter 3.6"}]},{"t":"Section B · Geotechnical Engineering (Q59–68)","qs":[{"id":"M1-59","m":1,"o":["20.23 kN/m³","10.42 kN/m³","16.55 kN/m³","26.49 kN/m³"],"q":"<p>A saturated soil has void ratio 0.6 and specific gravity of solids 2.7. Taking γw = 9.81 kN/m³, its dry unit weight is:<\/p>","a":2,"s":"<p>γd = G γw/(1 + e) = 2.7 × 9.81/1.6 = 16.55 kN/m³.<br>Other options: A — the saturated unit weight (G + e)γw/(1 + e); B — the submerged unit weight; D — G γw, the unit weight of solids.<\/p>","tag":"Sub-chapter 4.1"},{"id":"M1-60","m":1,"o":["Kaolinite","Montmorillonite","Halloysite","Illite"],"q":"<p>The clay mineral that shows the greatest swelling and shrinkage on wetting and drying is:<\/p>","a":1,"s":"<p>Montmorillonite has weak bonds between unit layers, so water enters freely between them; its specific surface and activity are the highest.<br>Other options: A — strong hydrogen bonds between layers make it stable; C — a hydrated kaolin-group mineral of low swell; D — potassium bonds give intermediate behaviour.<\/p>","tag":"Sub-chapter 4.1"},{"id":"M1-61","m":1,"o":["3 layers with 56 blows per layer","5 layers with 25 blows per layer","5 layers with 56 blows per layer","3 layers with 25 blows per layer"],"q":"<p>In the standard Proctor compaction test (about 1000 cm³ mould), the soil is compacted in:<\/p>","a":3,"s":"<p>Standard Proctor: 3 equal layers, 25 blows each of the light rammer.<br>Other options: A, C — 56 blows are used with the larger 2250 cm³ (6-inch) mould; B — modified Proctor (heavy rammer).<\/p>","tag":"Sub-chapter 4.2"},{"id":"M1-62","m":1,"o":["0.50 cm/s","3.33 × 10⁻² cm/s","1.39 × 10⁻⁴ cm/s","8.33 × 10⁻³ cm/s"],"q":"<p>In a constant-head permeability test, 500 cm³ of water passes in 10 minutes through a sample 20 cm long with cross-sectional area 50 cm² under a head of 40 cm. The coefficient of permeability is:<\/p>","a":3,"s":"<p>k = QL/(Aht) = 500 × 20/(50 × 40 × 600) = 8.33 × 10⁻³ cm/s.<br>Other options: A — time left in minutes; B — length and head interchanged; C — time taken as 10 h instead of 10 min.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M1-63","m":1,"o":["The soil is compacted at optimum moisture content","The upward seepage gradient reaches the critical hydraulic gradient","The downward seepage gradient exceeds unity","The water table rises to the ground surface"],"q":"<p>A quick (boiling) condition develops in a cohesionless soil when:<\/p>","a":1,"s":"<p>When i = ic = (G − 1)/(1 + e) under upward flow, effective stress becomes zero and the sand loses its strength.<br>Other options: A — unrelated to seepage; C — downward seepage increases effective stress; D — a high water table reduces but does not remove effective stress.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M1-64","m":1,"o":["47.75 kPa","23.87 kPa","5.97 kPa","11.94 kPa"],"q":"<p>A vertical point load of 100 kN acts at the ground surface. By Boussinesq&#x27;s theory, the vertical stress at a depth of 2 m directly below the load is:<\/p>","a":3,"s":"<p>σz = 3Q/(2πz²) = 0.4775 × 100/4 = 11.94 kPa.<br>Other options: A — used z = 1 m; B — divided by z instead of z²; C — divided by z³.<\/p>","tag":"Sub-chapter 4.3"},{"id":"M1-65","m":1,"o":["69.4 days","1111 days","1.39 days","278 days"],"q":"<p>A 20 mm thick clay sample drained at top and bottom reaches 50% consolidation in 10 minutes in the laboratory. A 4 m thick layer of the same clay, drained at both faces in the field, will reach 50% consolidation in about:<\/p>","a":3,"s":"<p>Same Tv → t ∝ d²; d lab = 10 mm, d field = 2000 mm; t = 10 × 200² = 400 000 min ≈ 278 days.<br>Other options: A — lab sample treated as single drained; B — field layer treated as single drained (d = 4 m); C — ratio of thicknesses not squared.<\/p>","tag":"Sub-chapter 4.3"},{"id":"M1-66","m":1,"o":["Vertical","A straight line through the origin","Inclined at the effective friction angle φ′","Horizontal (φu = 0), cutting the shear-stress axis at cu"],"q":"<p>In an unconsolidated undrained (UU) triaxial test on a saturated clay, the Mohr–Coulomb failure envelope is:<\/p>","a":3,"s":"<p>Extra confining pressure only raises pore pressure in a saturated clay, so all Mohr circles have the same diameter.<br>Other options: A — not physically meaningful; B — a normally consolidated clay in drained shear; C — drained or CU tests with pore pressure measured.<\/p>","tag":"Sub-chapter 4.4"},{"id":"M1-67","m":1,"o":["108 kN/m","216 kN/m","972 kN/m","324 kN/m"],"q":"<p>A 6 m high smooth vertical wall retains dry cohesionless backfill (γ = 18 kN/m³, φ = 30°) with a horizontal surface. The total Rankine active thrust per metre run is:<\/p>","a":0,"s":"<p>Ka = (1 − sin30)/(1 + sin30) = 1/3; Pa = ½ Ka γ H² = ½ × 1/3 × 18 × 36 = 108 kN/m.<br>Other options: B — the ½ omitted; C — passive coefficient Kp = 3 used; D — Ka omitted.<\/p>","tag":"Sub-chapter 4.5"},{"id":"M1-68","m":1,"o":["The soil around the pile settles more than the pile","The water table drops below the pile tip","The pile is driven into dense sand","The pile carries a lateral load"],"q":"<p>Negative skin friction on a pile develops when:<\/p>","a":0,"s":"<p>Settling soil (e.g. fresh fill over soft clay) drags the pile down and adds load instead of resisting it.<br>Other options: B — lowering below the tip affects end bearing, not shaft drag; C — dense sand gives positive shaft friction; D — lateral load causes bending, not drag.<\/p>","tag":"Sub-chapter 4.6"}]},{"t":"Section B · Water Resources Engineering (Q69–78)","qs":[{"id":"M1-69","m":1,"o":["4.00 kPa","49.05 kPa","39.24 kPa","392.4 kPa"],"q":"<p>The gauge pressure at a depth of 5 m in an oil of specific gravity 0.8 (g = 9.81 m/s²) is:<\/p>","a":2,"s":"<p>p = ρgh = 800 × 9.81 × 5 = 39 240 Pa = 39.24 kPa.<br>Other options: A — g omitted (pressure in m of water × SG); B — water density used; D — kPa/Pa slip of 10.<\/p>","tag":"Sub-chapter 5.1"},{"id":"M1-70","m":1,"o":["Its metacentre lies below its centre of gravity","Its centre of gravity coincides with its metacentre","Its metacentre lies above its centre of gravity","Its centre of buoyancy lies above its centre of gravity"],"q":"<p>A floating body is in stable equilibrium when:<\/p>","a":2,"s":"<p>Positive metacentric height GM gives a restoring couple when the body heels.<br>Other options: A — unstable; B — neutral equilibrium; D — not necessary for floating bodies (ships have B below G and are still stable).<\/p>","tag":"Sub-chapter 5.1"},{"id":"M1-71","m":1,"o":["Unsteady, compressible and viscous","Rotational and turbulent only","Steady, incompressible and frictionless","Steady, compressible and viscous"],"q":"<p>Bernoulli&#x27;s equation in its basic form (p/γ + V²/2g + z = constant) applies along a streamline for flow that is:<\/p>","a":2,"s":"<p>It is derived from Euler&#x27;s equation assuming steady, incompressible, inviscid flow.<br>Other options: A, D — viscous losses need an hf term; B — turbulence brings losses not in the basic form.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M1-72","m":1,"o":["1.2","2.0","1.0","1.5"],"q":"<p>For laminar flow in a circular pipe, the ratio of maximum velocity to mean velocity is:<\/p>","a":1,"s":"<p>The velocity profile is parabolic; V max = 2 V mean.<br>Other options: A — roughly turbulent pipe flow; C — uniform (ideal) flow; D — laminar flow between parallel plates.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M1-73","m":1,"o":["4.0 m³/s","8.0 m³/s","1.0 m³/s","12.7 m³/s"],"q":"<p>A rectangular channel 4 m wide carries water 2 m deep. With Manning&#x27;s n = 0.02 and bed slope 0.0004, the discharge is:<\/p>","a":1,"s":"<p>A = 8 m², P = 8 m, R = 1 m; V = (1/n) R^(2/3) S^(1/2) = 50 × 1 × 0.02 = 1 m/s; Q = AV = 8.0 m³/s.<br>Other options: A — area taken as 4 m²; C — that is the velocity in m/s; D — depth used as hydraulic radius.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M1-74","m":1,"o":["0.97 m","1.46 m","2.92 m","0.65 m"],"q":"<p>A rectangular channel carries 3 m³/s per metre width. The minimum specific energy (g = 9.81 m/s²) is about:<\/p>","a":1,"s":"<p>yc = (q²/g)^(1/3) = (9/9.81)^(1/3) = 0.972 m; E min = 1.5 yc = 1.46 m.<br>Other options: A — critical depth itself; C — 3 yc; D — ⅔ yc.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M1-75","m":1,"o":["Supercritical to subcritical, with loss of energy","Supercritical to subcritical, with no loss of energy","Subcritical to supercritical, with gain of energy","Subcritical to supercritical, with loss of energy"],"q":"<p>In a hydraulic jump, the flow changes from:<\/p>","a":0,"s":"<p>A jump forms where fast shallow (Fr &gt; 1) flow meets deeper slow flow; turbulence dissipates energy.<br>Other options: B — energy is always lost in a jump; C, D — the reverse transition happens smoothly (e.g. at a free fall) without a jump.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M1-76","m":1,"o":["62.5 m³/s","0.5 m³/s","12.5 m³/s","2.5 m³/s"],"q":"<p>A spillway model is built to a scale of 1:25 using Froude similarity. If the model discharge is 0.02 m³/s, the prototype discharge is:<\/p>","a":0,"s":"<p>Qr = Lr^2.5 = 25^2.5 = 3125; Qp = 0.02 × 3125 = 62.5 m³/s.<br>Other options: B — used Lr; C — used Lr²; D — used Lr³.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M1-77","m":1,"o":["1 cm of total rainfall falling at any rate over the catchment","1 cm of effective rainfall falling uniformly over the catchment at a uniform rate in a specified duration","The maximum recorded storm on the catchment","1 cm of base flow over a unit duration"],"q":"<p>A unit hydrograph of a catchment is the direct runoff hydrograph resulting from:<\/p>","a":1,"s":"<p>Sherman&#x27;s definition: unit depth of rainfall excess, uniform in space and time, for a stated duration (D-h UH).<br>Other options: A — total rainfall includes losses; C — that defines a design flood, not a UH; D — base flow is separated out of a UH.<\/p>","tag":"Sub-chapter 5.5"},{"id":"M1-78","m":1,"o":["36 m³/s","2.78 m³/s","10 m³/s","1 m³/s"],"q":"<p>A 2 km² urban catchment has runoff coefficient 0.5. For a design rainfall intensity of 36 mm/h, the rational-method peak discharge is:<\/p>","a":2,"s":"<p>Q = CIA/3.6 = 0.5 × 36 × 2/3.6 = 10 m³/s (I in mm/h, A in km²).<br>Other options: A — the 3.6 unit factor omitted; B — divided by 3.6 twice; D — divided by 36 instead of 3.6.<\/p>","tag":"Sub-chapter 5.6"}]},{"t":"Section B · Transportation Engineering (Q79–88)","qs":[{"id":"M1-79","m":1,"o":["Urban roads and agricultural roads","District roads and village roads","Expressways and urban arterials","National Highways and Feeder Roads"],"q":"<p>In Nepal, the Strategic Road Network (SRN) looked after by the Department of Roads consists of:<\/p>","a":3,"s":"<p>The SRN = National Highways + Feeder Roads; district, urban and village roads form the local road network.<br>Other options: A, B — local roads under local governments; C — not the Nepal classification.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M1-80","m":1,"o":["A suitable bridge site across a river","A mountain pass","A religious place or costly structure","An intermediate town to be connected"],"q":"<p>Which of the following is a negative (avoid) obligatory point when fixing a highway alignment?<\/p>","a":2,"s":"<p>Negative obligatory points are features the road must avoid: costly structures, religious places, unstable ground, lakes.<br>Other options: A, B, D — positive obligatory points that the alignment must pass through.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M1-81","m":1,"o":["164.4 m","40.5 m","82.2 m","41.7 m"],"q":"<p>For a design speed of 60 km/h, reaction time 2.5 s and longitudinal friction coefficient 0.35 on a level road, the stopping sight distance is about:<\/p>","a":2,"s":"<p>SSD = 0.278Vt + V²/(254f) = 41.7 + 40.5 = 82.2 m.<br>Other options: A — twice SSD (intermediate sight distance); B — braking distance only; D — lag distance only.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M1-82","m":1,"o":["0.350","0.052","0.202","0.150"],"q":"<p>A horizontal curve of 250 m radius is designed for 80 km/h with lateral friction factor 0.15. The superelevation required for equilibrium is about:<\/p>","a":1,"s":"<p>e + f = V²/(127R) = 6400/31 750 = 0.202; e = 0.202 − 0.15 = 0.052.<br>Other options: A — friction added twice; C — friction not subtracted; D — the friction factor itself.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M1-83","m":1,"o":["Crushing strength","Flakiness","Hardness (resistance to wear)","Toughness (resistance to impact)"],"q":"<p>The Los Angeles abrasion test on road aggregates measures their:<\/p>","a":2,"s":"<p>Abrasive charge of steel balls in a rotating drum wears the aggregate; the percentage passing 1.7 mm is the LA value.<br>Other options: A — aggregate crushing test; B — thickness-gauge shape test; D — aggregate impact test.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M1-84","m":1,"o":["80 to 100 cm","0.8 to 1.0 mm","80 to 100 mm","8 to 10 mm"],"q":"<p>A bitumen graded 80/100 by penetration means that, under standard test conditions, a needle penetrates:<\/p>","a":3,"s":"<p>Penetration is reported in units of 0.1 mm (25 °C, 100 g, 5 s); 80–100 units = 8–10 mm.<br>Other options: A — impossible depth for the test; B — units taken as 0.01 mm; C — units taken as mm.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M1-85","m":1,"o":["1200 veh/h","2400 veh/h","9600 veh/h","4800 veh/h"],"q":"<p>On a road with free-flow speed 80 km/h and jam density 120 veh/km, Greenshields&#x27; model gives a capacity of:<\/p>","a":1,"s":"<p>q max = vf kj/4 = 80 × 120/4 = 2400 veh/h (at k = kj/2, v = vf/2).<br>Other options: A — vf kj/8; C — vf × kj, without the ¼; D — vf kj/2.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M1-86","m":1,"o":["23.0 s","38.3 s","57.5 s","45.0 s"],"q":"<p>A signalised intersection has total lost time 12 s per cycle and sum of critical flow ratios Y = 0.6. Webster&#x27;s optimum cycle length is:<\/p>","a":2,"s":"<p>Co = (1.5L + 5)/(1 − Y) = (18 + 5)/0.4 = 57.5 s.<br>Other options: A — numerator only; B — divided by Y instead of (1 − Y); D — the +5 omitted.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M1-87","m":1,"o":["1.96","3.84","7.54","14.8"],"q":"<p>By the fourth-power law, one pass of a 16 t single axle causes pavement damage equivalent to about how many passes of the 8.16 t standard axle?<\/p>","a":3,"s":"<p>EF = (16/8.16)⁴ = 14.8.<br>Other options: A — simple ratio; B — squared ratio; C — cubed ratio.<\/p>","tag":"Sub-chapter 6.5"},{"id":"M1-88","m":1,"o":["The vertical clearance between the high flood level and the soffit","The horizontal distance between abutments","The depth of scour below the bed at the piers","The rise in water level upstream of a bridge caused by the constriction of the waterway"],"q":"<p>In bridge hydraulics, afflux is:<\/p>","a":3,"s":"<p>Narrowing the waterway heads up the flow; the heading-up above normal HFL is afflux.<br>Other options: A — freeboard/clearance; B — linear waterway; C — scour depth.<\/p>","tag":"Sub-chapter 6.6"}]},{"t":"Section B · Water Supply and Sanitary Engineering (Q89–98)","qs":[{"id":"M1-89","m":1,"o":["76 000","66 450","64 000","58 000"],"q":"<p>The population of a town was 40 000 in 2001, 46 000 in 2011 and 52 000 in 2021. By the arithmetic increase method, the population in 2041 will be:<\/p>","a":2,"s":"<p>Average increase = 6000 per decade; P2041 = 52 000 + 2 × 6000 = 64 000.<br>Other options: A — added 12 000 per decade; B — geometric growth at the last decade&#x27;s rate; D — projected only one decade.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M1-90","m":1,"o":["10 per 100 mL","0 per 100 mL","1 per mL","100 per 100 mL"],"q":"<p>As per Nepal&#x27;s National Drinking Water Quality Standards (NDWQS 2062), the permissible E. coli count in drinking water is:<\/p>","a":1,"s":"<p>No faecal indicator bacteria are allowed in any 100 mL sample of drinking water.<br>Other options: A, C, D — any E. coli indicates faecal contamination and is not acceptable.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M1-91","m":1,"o":["The summits (high points) of the pipeline","The lowest points of the pipeline","The start of every branch","Just upstream of every tap stand"],"q":"<p>In a gravity water-supply pipeline laid over undulating ground, air release valves are installed at:<\/p>","a":0,"s":"<p>Air collects at high points and blocks flow; air valves vent it there.<br>Other options: B — scour (wash-out) valves go at low points; C, D — sluice/gate valves control branches and taps.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M1-92","m":1,"o":["2.29 m","0.76 m","7.65 m","15.29 m"],"q":"<p>Water flows at 1.5 m/s through a 300 mm diameter pipe 1000 m long with Darcy friction factor f = 0.02. The head loss due to friction (g = 9.81 m/s²) is:<\/p>","a":2,"s":"<p>hf = fLV²/(2gD) = 0.02 × 1000 × 2.25/(2 × 9.81 × 0.3) = 7.65 m.<br>Other options: A — D omitted from the denominator; B — L taken as 100 m; D — the 2 in 2g omitted.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M1-93","m":1,"o":["30 m³/m²/day","10 m³/m²/day","240 m³/m²/day","600 m³/m²/day"],"q":"<p>A rectangular sedimentation tank 20 m long, 8 m wide and 3 m deep treats 4800 m³/day. Its surface overflow rate is:<\/p>","a":0,"s":"<p>SOR = Q/plan area = 4800/(20 × 8) = 30 m³/m²/day.<br>Other options: B — Q ÷ volume (gives 1/detention time); C — Q ÷ length only; D — Q ÷ width only.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M1-94","m":1,"o":["Remains as free available chlorine residual","Is lost to the atmosphere","Forms only combined (chloramine) residual","Is fully consumed by ammonia"],"q":"<p>In breakpoint chlorination, the chlorine added beyond the breakpoint:<\/p>","a":0,"s":"<p>Up to the breakpoint chlorine reacts with reducing matter and destroys chloramines; after it, residual rises as free chlorine.<br>Other options: B — not the basis of the method; C, D — these happen before the breakpoint.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M1-95","m":1,"o":["Its pipe sizes are easiest to design","It uses the least length of pipe","It needs fewer valves","Water reaches any point from more than one direction, with no dead ends"],"q":"<p>The main advantage of a grid-iron (interconnected) distribution system over a dead-end (tree) system is:<\/p>","a":3,"s":"<p>Looping avoids stagnant dead ends and keeps supply going during repairs.<br>Other options: A, B, C — these are advantages of the dead-end system.<\/p>","tag":"Sub-chapter 7.4"},{"id":"M1-96","m":1,"o":["250 mg/L","5 mg/L","100 mg/L","125 mg/L"],"q":"<p>In a BOD test, 6 mL of wastewater is diluted to 300 mL. The initial DO is 8.0 mg/L and the DO after 5 days at 20 °C is 3.0 mg/L. The BOD5 of the wastewater is:<\/p>","a":0,"s":"<p>BOD5 = (D1 − D2)/P = (8 − 3)/(6/300) = 5/0.02 = 250 mg/L.<br>Other options: B — DO drop not divided by the dilution fraction; C — divided by P = 0.05; D — half the correct value.<\/p>","tag":"Sub-chapter 7.5"},{"id":"M1-97","m":1,"o":["Separating urine and faeces so they can be sanitised and reused as fertiliser","Flushing excreta into a sewer with large volumes of water","Burning excreta in a small incinerator","Discharging excreta directly into a soak pit"],"q":"<p>Ecological sanitation (Ecosan) toilets, promoted in Nepal, are based on:<\/p>","a":0,"s":"<p>Urine-diverting dry toilets close the nutrient loop: urine is a liquid fertiliser, faeces are dried/composted.<br>Other options: B — conventional water-borne sanitation; C, D — not Ecosan practice.<\/p>","tag":"Sub-chapter 7.6"},{"id":"M1-98","m":1,"o":["Mechanical aerators","Chlorine dosing","Photosynthesis by algae","Anaerobic bacteria in the bottom sludge"],"q":"<p>In a facultative waste-stabilisation (oxidation) pond, most of the oxygen used by the aerobic bacteria is supplied by:<\/p>","a":2,"s":"<p>Algae and bacteria live in symbiosis: algae release O₂, bacteria release CO₂ and nutrients.<br>Other options: A — used in aerated lagoons, not natural ponds; B — a disinfectant, not an oxygen source; D — anaerobes produce methane, not oxygen.<\/p>","tag":"Sub-chapter 7.6"}]}],"n":98,"marks":100},{"m":2,"secs":[{"t":"Section A · Communication English (Q1–8)","qs":[{"id":"M2-1","m":1,"o":["economy","redundancy","ornamentation","extravagance"],"q":"<p>Choose the word that best completes the sentence: The bridge design was praised for its ______: it used the least material that could still carry the load safely.<\/p>","a":0,"s":"<p>Using the least material that does the job = economy of design.<br>Other options: B — extra members beyond those needed; C — decoration, unrelated to material saving; D — wasteful excess, the opposite.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M2-2","m":1,"o":["obscure","verbose","lucid","ambiguous"],"q":"<p>Choose the word that best completes the sentence: Her explanation of the method was so ______ that the whole class understood it at the first reading.<\/p>","a":2,"s":"<p>Understood at once = clear, i.e. lucid.<br>Other options: A, D — unclear or open to two meanings, which would slow understanding; B — wordy, not necessarily clear.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M2-3","m":2,"o":["The valley received far more rainfall in the past","Ponds, recharge areas and conduits were managed together by the community","It used powerful pumps to lift water from deep aquifers","Deep tube wells supplemented it in the dry season"],"p":"<p><b>Passage 1<\/b><br>Read the passage and answer Q3 and Q4.<\/p><p>For centuries the stone spouts, or dhunge dhara, of the Kathmandu Valley supplied water without pumps or treatment plants. Water from the hills was led through canals into ponds that recharged shallow aquifers, and the spouts tapped this groundwater through brick and stone conduits. The system worked because the whole landscape was managed as one: ponds were cleaned each year by community groups, and building over recharge areas was forbidden by custom. Today many of the spouts have dried up. Ponds have been filled to make room for roads and houses, deep tube wells draw down the aquifer, and the guthi institutions that once organised maintenance have lost much of their land and income. Recent restoration projects show that spouts can flow again when ponds are revived, but they also show that engineering alone is not enough; without a local institution to look after them, restored systems soon fall back into neglect.<\/p>","q":"<p>According to the passage, the traditional stone-spout system worked mainly because:<\/p>","a":1,"s":"<p>&quot;The whole landscape was managed as one&quot;: ponds cleaned by community groups and recharge areas protected by custom.<br>Other options: A — rainfall is never mentioned; C — the passage says the system had no pumps; D — tube wells are named as a cause of decline.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M2-4","m":2,"o":["Spouts that have dried up can never flow again","Guthi institutions are richer today than in the past","Deep tube wells are the best replacement for stone spouts","Restoring spouts needs both physical repair and a local body to maintain them"],"q":"<p>Which conclusion is best supported by the passage?<\/p>","a":3,"s":"<p>Restoration works when ponds are revived, &quot;but engineering alone is not enough&quot; without a local institution.<br>Other options: A — contradicted: restored spouts do flow again; B — guthis have lost land and income; C — tube wells are part of the problem.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M2-5","m":1,"o":["One of the main reasons for the delays","are","the shortage of skilled workers","No error"],"q":"<p>Find the part of the sentence that contains an error: &quot;One of the main reasons for the delays / are / the shortage of skilled workers.&quot;<\/p>","a":1,"s":"<p>The subject is &quot;one&quot; (singular), so the verb must be &quot;is&quot;.<br>Other options: A — correctly formed subject phrase; C — correct complement; D — there is an agreement error.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M2-6","m":1,"o":["He has been working on this project for 2019.","He is working on this project since 2019.","He was working on this project since 2019.","He has been working on this project since 2019."],"q":"<p>Choose the grammatically correct sentence.<\/p>","a":3,"s":"<p>An action that began in the past and continues now takes the present perfect (continuous) with &quot;since&quot; + point in time.<br>Other options: A — &quot;for&quot; needs a period (for six years), not a year; B — simple present continuous cannot take &quot;since&quot;; C — past continuous with &quot;since&quot; is wrong.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M2-7","m":1,"o":["Mason : Brick","Composer : Score","Author : Library","Painter : Brush"],"q":"<p>ARCHITECT : BLUEPRINT :: ?<\/p>","a":1,"s":"<p>An architect creates a blueprint; a composer creates a score (creator : what is created).<br>Other options: A, D — tool or material used, not the work created; C — a library holds books, it is not what an author writes.<\/p>","tag":"Sub-chapter 1.4"},{"id":"M2-8","m":1,"o":["Gather : Collect","Assist : Help","Build : Construct","Expand : Contract"],"q":"<p>ENCOURAGE : DETER :: ?<\/p>","a":3,"s":"<p>Encourage and deter are opposites; so are expand and contract.<br>Other options: A, B, C — pairs of synonyms.<\/p>","tag":"Sub-chapter 1.4"}]},{"t":"Section A · Mathematics (Q9–48)","qs":[{"id":"M2-9","m":1,"o":["21","35","210","343"],"q":"<p>The number of ways of choosing a committee of 3 people from 7 is:<\/p>","a":1,"s":"<p>7C3 = 7!/(3! 4!) = 35 (order does not matter).<br>Other options: A — 7C2; C — 7P3, counts ordered selections; D — 7³, selections with repetition and order.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M2-10","m":1,"o":["49","16","11","7"],"q":"<p>If f(x) = 2x + 3 and g(x) = x², then (f ∘ g)(2) is:<\/p>","a":2,"s":"<p>(f ∘ g)(2) = f(g(2)) = f(4) = 2 × 4 + 3 = 11.<br>Other options: A — (g ∘ f)(2) = (7)²; B — g(4); D — f(2) only.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M2-11","m":1,"o":["39","43","40","35"],"q":"<p>The 10th term of the arithmetic progression 3, 7, 11, … is:<\/p>","a":0,"s":"<p>Tn = a + (n − 1)d = 3 + 9 × 4 = 39.<br>Other options: B — used n instead of n − 1; C — 10 × 4; D — the 9th term.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M2-12","m":1,"o":["−7","7","5","−5"],"q":"<p>The determinant of the matrix with rows (1, 2, 0), (3, 1, 2), (0, 1, 1) is:<\/p>","a":0,"s":"<p>1(1 × 1 − 2 × 1) − 2(3 × 1 − 2 × 0) + 0 = −1 − 6 = −7.<br>Other options: B — sign of the result lost; C — both sign slips; D — sign of the second cofactor taken as +.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-13","m":1,"o":["(1, −1)","(1, 1)","(1, 2)","(2, 1)"],"q":"<p>For the matrix with rows (2, 1) and (1, 2), an eigenvector corresponding to the eigenvalue 3 is:<\/p>","a":1,"s":"<p>(A − 3I)x = 0 gives −x1 + x2 = 0, so x = (1, 1). Check: A(1, 1) = (3, 3).<br>Other options: A — eigenvector for λ = 1; C, D — A times these is not a multiple of the vector.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-14","m":1,"o":["Every square matrix satisfies its own characteristic equation","The determinant of a matrix equals the sum of its eigenvalues","The eigenvalues of a symmetric matrix are always real and distinct","Every square matrix is diagonalisable"],"q":"<p>The Cayley–Hamilton theorem states that:<\/p>","a":0,"s":"<p>If p(λ) = |A − λI| = 0 is the characteristic equation, then p(A) = 0; this is used to find A⁻¹ and powers of A.<br>Other options: B — the determinant is the product of the eigenvalues; C — real yes, but not necessarily distinct, and not this theorem; D — false (e.g. defective matrices).<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-15","m":1,"o":["k = 3","k = 6","k = 0 only","k ≠ 6"],"q":"<p>The system x + 2y = 3, 3x + ky = 9 has a unique solution when:<\/p>","a":3,"s":"<p>Unique solution when the coefficient determinant k − 6 ≠ 0.<br>Other options: A, C — special cases of k ≠ 6, not the full condition; B — gives infinitely many solutions (second equation = 3 × first).<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-16","m":1,"o":["A Aᵀ = I","A² = A","A = −Aᵀ","A = Aᵀ"],"q":"<p>A real square matrix A is orthogonal if:<\/p>","a":0,"s":"<p>Orthogonal ⇔ Aᵀ = A⁻¹ ⇔ A Aᵀ = I; its determinant is ±1.<br>Other options: B — idempotent; C — skew-symmetric; D — symmetric.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-17","m":1,"o":["29","100","49","10"],"q":"<p>If A is the matrix with rows (3, 1) and (2, 4), the sum of the eigenvalues of A² is:<\/p>","a":0,"s":"<p>Eigenvalues of A are 2 and 5; those of A² are 4 and 25, sum 29 (= trace of A²).<br>Other options: B — (det A)², the product of eigenvalues of A²; C — (trace A)²; D — det A.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-18","m":1,"o":["9","6","12","8"],"q":"<p>Minimise Z = 2x + 3y subject to x + y ≥ 4, x + 3y ≥ 6, x ≥ 0, y ≥ 0. The minimum value of Z is:<\/p>","a":0,"s":"<p>Corner points of the (unbounded) feasible region: (0, 4) → 12, (3, 1) → 9, (6, 0) → 12. Minimum 9 at (3, 1).<br>Other options: B — at (0, 2), which violates x + y ≥ 4; C — value at (0, 4) or (6, 0); D — at (4, 0), which violates x + 3y ≥ 6.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-19","m":1,"o":["Always at the origin","At a corner (extreme) point of the feasible region","Only on the x-axis","At the centroid of the feasible region"],"q":"<p>In a two-variable linear programming problem, if an optimal solution exists, it is found:<\/p>","a":1,"s":"<p>The objective is linear, so its maximum or minimum over a convex polygon lies at a vertex (or along an edge between two vertices).<br>Other options: A, C — only by coincidence; D — the centroid is never better than the best vertex.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M2-20","m":1,"o":["(3i − 4j)/7","(3i − 4j)/5","(3i − 4j)/25","(3i + 4j)/5"],"q":"<p>The unit vector in the direction of 3i − 4j is:<\/p>","a":1,"s":"<div class=\"tw\"><table><thead><tr><th>3i − 4j<\/th><th>= √(9 + 16) = 5; divide the vector by 5.<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div><p>Other options: A — added components instead of using the magnitude; C — divided by the square of the magnitude; D — sign of j changed.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-21","m":1,"o":["30°","90°","45°","60°"],"q":"<p>The angle between the vectors a = i + j and b = j + k is:<\/p>","a":3,"s":"<p>cos θ = a · b/(|a||b|) = 1/(√2 × √2) = 1/2 → θ = 60°.<br>Other options: A — sin θ taken as 1/2; B — assumed perpendicular; C — cos θ taken as 1/√2.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-22","m":1,"o":["i − 5j + 3k","−i + 5j − 3k","5i − j − 3k","−i − 5j − 3k"],"q":"<p>The cross product a × b for a = i + 2j + 3k and b = 2i + j + k is:<\/p>","a":1,"s":"<p>a × b = (2·1 − 3·1)i − (1·1 − 3·2)j + (1·1 − 2·2)k = −i + 5j − 3k.<br>Other options: A — this is b × a; C — i and j components swapped; D — the minus sign of the j-cofactor missed.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-23","m":1,"o":["curl F = 0","grad (div F) = 0 only","F · F = 0","div F = 0"],"q":"<p>A vector field F is called solenoidal if:<\/p>","a":3,"s":"<p>Solenoidal (no sources or sinks) means zero divergence everywhere.<br>Other options: A — irrotational; B — not the definition; C — only the zero vector.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-24","m":1,"o":["−2k","2k","−2i","0"],"q":"<p>The curl of F = y i − x j is:<\/p>","a":0,"s":"<p>curl F = (∂Fy/∂x − ∂Fx/∂y)k = (−1 − 1)k = −2k.<br>Other options: B — sign slip; C — wrong component; D — it is not irrotational.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-25","m":1,"o":["16 units","14 units","10 units","6 units"],"q":"<p>A constant force F = 2i + 3j + k moves a particle from (1, 1, 1) to (3, 2, 4). The work done is:<\/p>","a":2,"s":"<p>d = (2, 1, 3); W = F · d = 4 + 3 + 3 = 10.<br>Other options: A — F · (3, 2, 4), the final position vector instead of the displacement; B — F · F = |F|²; D — sum of the force components.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M2-26","m":1,"o":["1","1/2","2","0"],"q":"<p>lim (x → 0) of (1 − cos x)/x² is:<\/p>","a":1,"s":"<p>1 − cos x = 2 sin²(x/2) ≈ x²/2, so the limit is 1/2.<br>Other options: A — took 1 − cos x ≈ x²; C — inverted; D — stopped at the 0/0 form.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-27","m":1,"o":["2","Does not exist","0","4"],"q":"<p>lim (x → 2) of (x² − 4)/(x − 2) is:<\/p>","a":3,"s":"<p>(x − 2)(x + 2)/(x − 2) = x + 2 → 4.<br>Other options: A — cancelled to x; B — the 0/0 form is removable; C — evaluated numerator only.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-28","m":1,"o":["−1/√(1 − x²)","1/(1 + x²)","1/√(1 − x²)","1/√(x² − 1)"],"q":"<p>The derivative of sin⁻¹ x is:<\/p>","a":2,"s":"<p>Standard result for |x| &lt; 1.<br>Other options: A — derivative of cos⁻¹ x; B — derivative of tan⁻¹ x; D — related to cosh⁻¹ x.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-29","m":1,"o":["4","12","10","6"],"q":"<p>The slope of the tangent to the curve y = x³ − 2x at x = 2 is:<\/p>","a":2,"s":"<p>dy/dx = 3x² − 2 = 12 − 2 = 10.<br>Other options: A — the y-value at x = 2; B — forgot the −2; D — 3x without squaring.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-30","m":1,"o":["2.5","2","1.5","4"],"q":"<p>For f(x) = x² on [1, 3], the value of c given by Lagrange&#x27;s mean value theorem is:<\/p>","a":1,"s":"<p>f′(c) = [f(3) − f(1)]/(3 − 1) = 8/2 = 4 = 2c → c = 2.<br>Other options: A, C — guessed points; D — the mean slope, not c.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-31","m":1,"o":["π/4","1","π/2","ln 2"],"q":"<p>The value of ∫ dx/(1 + x²) from 0 to 1 is:<\/p>","a":0,"s":"<p>[tan⁻¹ x] from 0 to 1 = π/4.<br>Other options: B — integrand treated as 1; C — limit to ∞; D — ∫ dx/(1 + x).<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-32","m":1,"o":["x ln x − x + C","x ln x + C","(ln x)²/2 + C","1/x + C"],"q":"<p>∫ ln x dx equals:<\/p>","a":0,"s":"<p>By parts with u = ln x, dv = dx: x ln x − ∫ x (1/x) dx.<br>Other options: B — the −x term missed; C — ∫ (ln x)/x dx; D — the derivative of ln x.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-33","m":1,"o":["9π/2 cubic units","18π cubic units","9π cubic units","27π cubic units"],"q":"<p>The volume generated when the line y = x from x = 0 to x = 3 is revolved about the x-axis is:<\/p>","a":2,"s":"<p>V = π ∫ x² dx from 0 to 3 = π × 27/3 = 9π (a cone of radius 3, height 3).<br>Other options: A — π ∫ x dx, radius not squared; B — an extra factor 2 (2π ∫ x² dx); D — forgot to divide by 3.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-34","m":1,"o":["(x + y) e^(xy)","e^(xy)","xy e^(xy)","e^(xy)(1 + xy)"],"q":"<p>If u = e^(xy), then ∂²u/∂x∂y is:<\/p>","a":3,"s":"<p>∂u/∂y = x e^(xy); ∂/∂x of that = e^(xy) + xy e^(xy).<br>Other options: A — added the two first derivatives&#x27; factors; B — derivative of the exponent ignored; C — product rule missed the first term.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-35","m":1,"o":["x² + y² = C","x² − y² = C","xy = C","y = Cx"],"q":"<p>The general solution of dy/dx = −x/y is:<\/p>","a":0,"s":"<p>y dy = −x dx → y²/2 = −x²/2 + C, a family of circles.<br>Other options: B — solves dy/dx = x/y; C — solves dy/dx = −y/x; D — solves dy/dx = y/x.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-36","m":1,"o":["y = x e^(x) + C","y = (x + C) e^(x)","y = C e^(−x)","y = (x + C) e^(−x)"],"q":"<p>The general solution of dy/dx + y = e^(−x) is:<\/p>","a":3,"s":"<p>IF = eˣ; d(y eˣ)/dx = 1 → y eˣ = x + C.<br>Other options: A, B — integrating factor applied with the wrong sign; C — the complementary function only.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-37","m":1,"o":["y = (C1 + C2 x) e^(3x)","y = C1 e^(3x) + C2 e^(−3x)","y = C1 cos 3x + C2 sin 3x","y = C1 e^(3x) + C2 e^(3x)"],"q":"<p>The general solution of y″ − 6y′ + 9y = 0 is:<\/p>","a":0,"s":"<p>m² − 6m + 9 = (m − 3)² = 0: repeated root 3, so the second solution carries the factor x.<br>Other options: B — roots ±3 (for y″ − 9y = 0); C — for roots ±3i; D — the two terms merge into one, not a general solution.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M2-38","m":1,"o":["10","6","8","2.83"],"q":"<p>The variance of the data 2, 4, 6, 8, 10 (taken as a population) is:<\/p>","a":2,"s":"<p>Mean 6; squared deviations 16, 4, 0, 4, 16 sum to 40; σ² = 40/5 = 8.<br>Other options: A — sample variance (÷ 4); B — the mean; D — the standard deviation √8.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M2-39","m":1,"o":["0.271","0.500","0.865","0.135"],"q":"<p>The number of defects per sheet follows a Poisson distribution with mean 2. The probability that a sheet has no defect is about:<\/p>","a":3,"s":"<p>P(0) = e^(−λ) = e^(−2) ≈ 0.135.<br>Other options: A — P(X = 1) = 2e^(−2); B — a guess; C — P(at least one defect).<\/p>","tag":"Sub-chapter 2.5"},{"id":"M2-40","m":1,"o":["0.5","0.7","0.2","0.9"],"q":"<p>Events A and B are independent with P(A) = 0.5 and P(B) = 0.4. P(A ∪ B) is:<\/p>","a":1,"s":"<p>P(A ∪ B) = 0.5 + 0.4 − 0.5 × 0.4 = 0.7.<br>Other options: A — P(A) only; C — P(A ∩ B); D — assumed mutually exclusive.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M2-41","m":1,"o":["1/√3","2 − √3","2 + √3","√3 − 1"],"q":"<p>The exact value of tan 15° is:<\/p>","a":1,"s":"<p>tan(45° − 30°) = (1 − 1/√3)/(1 + 1/√3) = (√3 − 1)/(√3 + 1) = 2 − √3.<br>Other options: A — tan 30°; C — tan 75°; D — numerator only.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M2-42","m":1,"o":["1.44","0.22","0.44","0.20"],"q":"<p>If sin θ + cos θ = 1.2, then sin 2θ equals:<\/p>","a":2,"s":"<p>(sin θ + cos θ)² = 1 + sin 2θ = 1.44 → sin 2θ = 0.44.<br>Other options: A — forgot to subtract 1; B — halved (sin θ cos θ); D — 1.2 − 1.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M2-43","m":1,"o":["x = 5","x = 5 or x = −2","x = −2","x = 10"],"q":"<p>The solution of log₁₀ x + log₁₀ (x − 3) = 1 is:<\/p>","a":0,"s":"<p>x(x − 3) = 10 → x² − 3x − 10 = 0 → x = 5 or −2; log of a negative number is undefined, so x = 5.<br>Other options: B, C — x = −2 makes both logarithms undefined; D — took x(x − 3) as x.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M2-44","m":1,"o":["60°","90°","150°","120°"],"q":"<p>In a triangle with sides a = 7, b = 8 and c = 13, the angle C opposite side c is:<\/p>","a":3,"s":"<p>cos C = (a² + b² − c²)/(2ab) = (49 + 64 − 169)/112 = −0.5 → C = 120°.<br>Other options: A — sign of cos C ignored; B — assumed right-angled; C — cos C taken as −√3/2.<\/p>","tag":"Sub-chapter 2.6"},{"id":"M2-45","m":1,"o":["2/s²","2/s³","1/s³","1/s²"],"q":"<p>The Laplace transform of t² is:<\/p>","a":1,"s":"<p>L{tⁿ} = n!/s^(n+1) = 2/s³.<br>Other options: A — power of s one too low; C — n! omitted; D — transform of t.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M2-46","m":1,"o":["1 + e^(−t)","1 − e^(−t)","e^(−t)","t e^(−t)"],"q":"<p>The inverse Laplace transform of 1/[s(s + 1)] is:<\/p>","a":1,"s":"<p>Partial fractions: 1/s − 1/(s + 1) → 1 − e^(−t).<br>Other options: A — sign error; C — second term only, sign lost; D — inverse of 1/(s + 1)².<\/p>","tag":"Sub-chapter 2.7"},{"id":"M2-47","m":1,"o":["(s + 3)/[(s + 3)² + 4]","2/(s² + 4)","2/[(s + 3)² + 4]","2/[(s − 3)² + 4]"],"q":"<p>The Laplace transform of e^(−3t) sin 2t is:<\/p>","a":2,"s":"<p>L{sin 2t} = 2/(s² + 4); multiplying by e^(−3t) replaces s by s + 3.<br>Other options: A — transform of e^(−3t) cos 2t; B — the shift ignored; D — shifted the wrong way.<\/p>","tag":"Sub-chapter 2.7"},{"id":"M2-48","m":1,"o":["f(x) is an odd function","f(x) is not continuous","f(x) is an even function","f(x) is periodic with period π"],"q":"<p>For f(x) = x² on (−π, π), all the Fourier sine coefficients bn are zero because:<\/p>","a":2,"s":"<p>bn = (1/π)∫ f(x) sin nx dx; even × odd is odd, so the integral over (−π, π) vanishes.<br>Other options: A — odd functions have an = 0 instead; B — x² is continuous; D — the period is 2π.<\/p>","tag":"Sub-chapter 2.7"}]},{"t":"Section B · Structural Engineering (Q49–58)","qs":[{"id":"M2-49","m":1,"o":["48 MPa (compressive)","96 MPa (compressive)","960 MPa (compressive)","96 MPa (tensile)"],"q":"<p>A steel rod fixed rigidly between two walls is heated by 40 °C. With α = 12 × 10⁻⁶ /°C and E = 200 GPa, the thermal stress induced is:<\/p>","a":1,"s":"<p>σ = E α ΔT = 200 000 × 12 × 10⁻⁶ × 40 = 96 MPa; expansion is prevented, so the stress is compressive.<br>Other options: A — divided by 2 wrongly; C — a factor-of-10 slip; D — heating a restrained bar compresses it.<\/p>","tag":"Sub-chapter 3.1"},{"id":"M2-50","m":1,"o":["90 MPa","50 MPa","100 MPa","80 MPa"],"q":"<p>At a point, σx = 80 MPa, σy = 20 MPa (both tensile) and τxy = 40 MPa. The major principal stress is:<\/p>","a":2,"s":"<p>Centre = (80 + 20)/2 = 50; radius = √(30² + 40²) = 50; σ1 = 50 + 50 = 100 MPa.<br>Other options: A — centre + τxy, ignoring the 30 MPa term; B — the centre (also τmax); D — σx alone.<\/p>","tag":"Sub-chapter 3.1"},{"id":"M2-51","m":1,"o":["The shear force is maximum","The bending moment is maximum","The deflection is maximum","The bending moment changes sign"],"q":"<p>A point of contraflexure in a beam is a point where:<\/p>","a":3,"s":"<p>Curvature reverses there, so BM passes through zero and changes sign (e.g. in overhanging and continuous beams).<br>Other options: A — not a contraflexure property; B — maximum BM is where SF changes sign; C — maximum deflection is where slope is zero.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M2-52","m":1,"o":["54 mm","18 mm","6.75 mm","9 mm"],"q":"<p>A cantilever 3 m long carries a point load of 10 kN at its free end. If EI = 5000 kNm², the deflection at the free end is:<\/p>","a":1,"s":"<p>δ = PL³/(3EI) = 10 × 27/(3 × 5000) = 0.018 m = 18 mm.<br>Other options: A — the 3 omitted; C — the UDL coefficient 1/8 used with a point load; D — the end slope PL²/(2EI) = 0.009 rad read as metres.<\/p>","tag":"Sub-chapter 3.2"},{"id":"M2-53","m":1,"o":["The deflection at A due to a unit load at B equals the deflection at B due to a unit load at A","Strain energy is always equal to the work done by the reactions","Deflections are proportional to the square of the loads","The partial derivative of strain energy with respect to a load equals its deflection"],"q":"<p>Maxwell&#x27;s reciprocal theorem states that, in a linearly elastic structure:<\/p>","a":0,"s":"<p>δAB = δBA; the flexibility matrix is symmetric.<br>Other options: B — reactions at rigid supports do no work; C — deflections are linear in the loads; D — Castigliano&#x27;s first theorem.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M2-54","m":1,"o":["0","2","1","3"],"q":"<p>The degree of static indeterminacy of a two-hinged parabolic arch is:<\/p>","a":2,"s":"<p>4 reactions (2 at each hinge) − 3 equations = 1; the horizontal thrust is usually taken as the redundant.<br>Other options: A — a three-hinged arch; B — no standard arch gives 2 with these supports; D — a fixed (hingeless) arch.<\/p>","tag":"Sub-chapter 3.3"},{"id":"M2-55","m":1,"o":["3/5","1/2","1/3","2/3"],"q":"<p>At a joint B, member BA (length 4 m, far end fixed) and member BC (length 6 m, far end hinged) meet. Both have the same EI. The distribution factor for BA is:<\/p>","a":3,"s":"<p>K_BA = 4EI/4 = EI; K_BC = 3EI/6 = 0.5EI; DF_BA = 1/(1 + 0.5) = 2/3.<br>Other options: A — 4EI/L used for BC too (1/(1 + 0.667)); B — stiffnesses assumed equal; C — this is DF_BC.<\/p>","tag":"Sub-chapter 3.4"},{"id":"M2-56","m":1,"o":["Relative transverse displacement (sway) of the member ends","Temperature change along the member","Rotation of the far end","Axial shortening of the member"],"q":"<p>In the slope-deflection equation M_AB = M_FAB + (2EI/L)(2θA + θB − 3Δ/L), the term 3Δ/L accounts for:<\/p>","a":0,"s":"<p>Δ is the relative perpendicular movement of one end of the member with respect to the other, as in sway frames or support settlement.<br>Other options: B — not included in the standard equation; C — that is θB; D — axial deformation is neglected in the method.<\/p>","tag":"Sub-chapter 3.4"},{"id":"M2-57","m":1,"o":["Indeterminate","Zero","Equal to the force in either collinear member","Half the sum of the other two forces"],"q":"<p>Three members meet at an unloaded truss joint. Two of them are collinear. The force in the third member is:<\/p>","a":1,"s":"<p>Resolve perpendicular to the collinear pair: only the third member has a component there, so its force must be zero.<br>Other options: A — the joint is statically determinate; C, D — the collinear members carry equal forces to each other, the third carries none.<\/p>","tag":"Sub-chapter 3.5"},{"id":"M2-58","m":1,"o":["240 kN","160 kN","80 kN","120 kN"],"q":"<p>A beam fixed at both ends, 6 m span, carries a central point load. Its plastic moment capacity is 120 kNm. The collapse load is:<\/p>","a":1,"s":"<p>Three hinges (both ends and centre): Wc L/4 = 2Mp → Wc = 8Mp/L = 160 kN.<br>Other options: A — 12Mp/L; C — 4Mp/L, a simply supported beam; D — took Wc = Mp numerically.<\/p>","tag":"Sub-chapter 3.6"}]},{"t":"Section B · Geotechnical Engineering (Q59–68)","qs":[{"id":"M2-59","m":1,"o":["0.46","0.074","0.54","0.35"],"q":"<p>A fully saturated soil has water content 20% and specific gravity of solids 2.7. Its void ratio is:<\/p>","a":2,"s":"<p>Se = wG with S = 1: e = 0.20 × 2.7 = 0.54.<br>Other options: A — 1 − wG; B — w/G; D — the porosity e/(1 + e).<\/p>","tag":"Sub-chapter 4.1"},{"id":"M2-60","m":1,"o":["0.25","0.75","0.20","4.00"],"q":"<p>A clay has liquid limit 45%, plastic limit 25% and natural water content 30%. Its liquidity index is:<\/p>","a":0,"s":"<p>PI = 45 − 25 = 20; LI = (w − PL)/PI = 5/20 = 0.25.<br>Other options: B — consistency index (LL − w)/PI; C — divided by PL instead of PI; D — the ratio inverted.<\/p>","tag":"Sub-chapter 4.1"},{"id":"M2-61","m":1,"o":["Through gravel at high velocity","Laminar","Unsaturated and transient","Turbulent"],"q":"<p>Darcy&#x27;s law v = ki is valid only when the flow through the soil is:<\/p>","a":1,"s":"<p>Velocity is proportional to gradient only in laminar flow, which holds for most silts, sands and clays.<br>Other options: A, D — in coarse gravels at high gradients the flow becomes turbulent and the law fails; C — the law assumes steady saturated flow.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M2-62","m":1,"o":["1.7 × 10⁻⁶ m³/s","3.0 × 10⁻⁵ m³/s","1.0 × 10⁻⁵ m³/s","9.0 × 10⁻⁵ m³/s"],"q":"<p>A flow net under a weir has 4 flow channels and 12 equipotential drops. The head loss across the weir is 6 m and k = 5 × 10⁻⁶ m/s. The seepage per metre length is:<\/p>","a":2,"s":"<p>q = kH Nf/Nd = 5 × 10⁻⁶ × 6 × 4/12 = 1.0 × 10⁻⁵ m³/s per metre.<br>Other options: A — head H omitted; B — shape factor omitted (kH only); D — Nf/Nd inverted.<\/p>","tag":"Sub-chapter 4.2"},{"id":"M2-63","m":1,"o":["416 mm","600 mm","361 mm","181 mm"],"q":"<p>A normally consolidated clay layer 4 m thick has e0 = 1.0 and Cc = 0.3. The mid-layer effective stress of 100 kPa is increased by 100 kPa. The consolidation settlement is about:<\/p>","a":3,"s":"<p>Sc = Cc H/(1 + e0) × log10(200/100) = 0.3 × 4/2 × 0.301 = 0.181 m.<br>Other options: A — natural log used; B — the log term omitted; C — (1 + e0) omitted.<\/p>","tag":"Sub-chapter 4.3"},{"id":"M2-64","m":1,"o":["Under-consolidated (OCR &lt; 1)","Pre-compressed","Over-consolidated (OCR &gt; 1)","Normally consolidated (OCR = 1)"],"q":"<p>A clay whose present effective overburden pressure is the maximum it has ever experienced is called:<\/p>","a":3,"s":"<p>OCR = σ′max past/σ′present = 1 for normally consolidated clay.<br>Other options: A — still consolidating under the present load; B, C — it has carried more load in the past.<\/p>","tag":"Sub-chapter 4.3"},{"id":"M2-65","m":1,"o":["Undisturbed to remoulded unconfined compressive strength (same water content)","Liquid limit to plastic limit","Remoulded to undisturbed unconfined compressive strength","Drained to undrained shear strength"],"q":"<p>The sensitivity of a clay is defined as the ratio of:<\/p>","a":0,"s":"<p>St = qu (undisturbed)/qu (remoulded); quick clays have St &gt; 16.<br>Other options: B — not a strength ratio; C — inverted, always ≤ 1; D — not sensitivity.<\/p>","tag":"Sub-chapter 4.4"},{"id":"M2-66","m":1,"o":["45°","30°","75°","60°"],"q":"<p>In a triaxial test on a sand with φ = 30° and c = 0, the failure plane makes an angle with the major principal plane of:<\/p>","a":3,"s":"<p>θ = 45° + φ/2 = 45 + 15 = 60°.<br>Other options: A — the φ = 0 case; B — φ itself; C — 45° + φ.<\/p>","tag":"Sub-chapter 4.4"},{"id":"M2-67","m":1,"o":["Inclined at 45° + φ/2 to the horizontal","Smooth and vertical, with no friction between wall and soil","Rough, with wall friction equal to φ","Perfectly rigid and fixed against any movement"],"q":"<p>Rankine&#x27;s earth-pressure theory assumes that the retaining wall is:<\/p>","a":1,"s":"<p>Rankine treats the soil behind a smooth vertical back as being in a state of plastic equilibrium; Coulomb&#x27;s wedge theory allows wall friction δ.<br>Other options: A — that is the inclination of the failure planes in the active state; C — wall friction is part of Coulomb&#x27;s theory; D — a fixed wall gives at-rest pressure, not Rankine active/passive.<\/p>","tag":"Sub-chapter 4.5"},{"id":"M2-68","m":1,"o":["312.0 kPa","169.5 kPa","339.0 kPa","285.0 kPa"],"q":"<p>A strip footing 2 m wide is founded at 1.5 m depth in saturated clay (cu = 50 kPa, φu = 0, γ = 18 kN/m³). Using Terzaghi&#x27;s factors Nc = 5.7, Nq = 1, Nγ = 0, the ultimate bearing capacity is:<\/p>","a":0,"s":"<p>qu = c Nc + γ Df Nq = 5.7 × 50 + 18 × 1.5 × 1 = 285 + 27 = 312 kPa.<br>Other options: B — used cu/2; C — the overburden term counted twice; D — the overburden term omitted.<\/p>","tag":"Sub-chapter 4.6"}]},{"t":"Section B · Water Resources Engineering (Q69–78)","qs":[{"id":"M2-69","m":1,"o":["1 cm²/s","1 N·s/m²","0.1 N·s/m²","1 m²/s"],"q":"<p>The stoke, a unit of kinematic viscosity, equals:<\/p>","a":0,"s":"<p>Kinematic viscosity ν = μ/ρ has units of area per time; 1 stoke = 1 cm²/s = 10⁻⁴ m²/s.<br>Other options: B — the SI unit of dynamic viscosity (Pa·s); C — 1 poise, a dynamic viscosity unit; D — 10⁴ stokes.<\/p>","tag":"Sub-chapter 5.1"},{"id":"M2-70","m":1,"o":["176.58 kN","58.86 kN","44.15 kN","88.29 kN"],"q":"<p>A vertical rectangular gate 2 m wide and 3 m high has its top edge at the water surface. The total hydrostatic force on it (γw = 9.81 kN/m³) is:<\/p>","a":3,"s":"<p>F = γ A h̄ = 9.81 × 6 × 1.5 = 88.29 kN.<br>Other options: A — depth to the bottom used instead of to the centroid; B — centroid depth taken as 1 m; C — ½γH², the force per metre width only.<\/p>","tag":"Sub-chapter 5.1"},{"id":"M2-71","m":1,"o":["500, laminar","5 000, turbulent","50 000, turbulent","50 000, laminar"],"q":"<p>Water (ν = 1 × 10⁻⁶ m²/s) flows at 0.5 m/s in a 100 mm diameter pipe. The Reynolds number and flow type are:<\/p>","a":2,"s":"<p>Re = VD/ν = 0.5 × 0.1/10⁻⁶ = 50 000; well above about 4000, so turbulent.<br>Other options: A — a factor-of-100 slip; B — a factor-of-10 slip in D; D — Re &gt; 2000 is not laminar in pipes.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M2-72","m":1,"o":["The free-stream velocity is uniform and the surface is flat","The pressure increases in the flow direction and the velocity gradient at the wall becomes zero","The pressure decreases in the flow direction","The Reynolds number is very low"],"q":"<p>Boundary-layer separation from a surface occurs when:<\/p>","a":1,"s":"<p>An adverse pressure gradient slows the fluid near the wall until (∂u/∂y) at the wall = 0, and the flow detaches.<br>Other options: A — a flat plate at zero gradient does not separate; C — a favourable gradient keeps the layer attached; D — not the condition.<\/p>","tag":"Sub-chapter 5.2"},{"id":"M2-73","m":1,"o":["Width = 2 × depth, and hydraulic radius = depth/2","Width = 3 × depth, and hydraulic radius = depth/3","Width = depth, and hydraulic radius = depth","Width = depth/2, and hydraulic radius = 2 × depth"],"q":"<p>For the most economical (efficient) rectangular channel section:<\/p>","a":0,"s":"<p>Minimising the wetted perimeter for a given area gives b = 2y; then R = 2y²/4y = y/2.<br>Other options: B, C, D — these give a longer wetted perimeter for the same area.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M2-74","m":1,"o":["The flow is always laminar","The Froude number is greater than 1","The specific energy is a minimum","The specific energy is a maximum"],"q":"<p>For a given discharge in an open channel, critical depth is the depth at which:<\/p>","a":2,"s":"<p>On the E–y curve the critical depth is the turning point (minimum E), and there Fr = 1.<br>Other options: A — open-channel flow is almost always turbulent; B — Fr = 1 at critical depth; D — E has no maximum.<\/p>","tag":"Sub-chapter 5.3"},{"id":"M2-75","m":1,"o":["2.59 m","1.29 m","2.00 m","5.18 m"],"q":"<p>A hydraulic jump forms in a rectangular channel with initial depth 0.5 m and initial Froude number 4. The sequent depth is about:<\/p>","a":0,"s":"<p>y2/y1 = ½[√(1 + 8F1²) − 1] = ½(√129 − 1) = 5.18; y2 = 2.59 m.<br>Other options: B — halved twice; C — y1 × F1; D — the ½ omitted.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M2-76","m":1,"o":["H2","S1","M1 (backwater curve)","M2 (drawdown curve)"],"q":"<p>The water-surface profile that forms upstream of a dam built across a channel of mild slope is:<\/p>","a":2,"s":"<p>Depth upstream of the dam exceeds normal depth (y &gt; yn &gt; yc) on a mild slope: zone 1, rising backwater.<br>Other options: A — horizontal bed only; B — occurs on steep slopes; D — forms upstream of a free overfall.<\/p>","tag":"Sub-chapter 5.4"},{"id":"M2-77","m":1,"o":["2.0 cm/h","1.0 cm/h","4.0 cm/h","0.5 cm/h"],"q":"<p>A 4-hour storm gives hourly rainfalls of 1.5, 2.5, 2.5 and 1.5 cm, and the observed direct runoff is 4 cm. The φ-index is:<\/p>","a":1,"s":"<p>Total rain 8 cm; loss 8 − 4 = 4 cm over 4 h = 1.0 cm/h. Every hourly rainfall exceeds 1.0, so all 4 hours count.<br>Other options: A — total rainfall ÷ time; C — total loss, not a rate; D — loss ÷ 8.<\/p>","tag":"Sub-chapter 5.5"},{"id":"M2-78","m":1,"o":["0.020","0.817","0.183","0.200"],"q":"<p>The probability that a 50-year flood is equalled or exceeded at least once in the next 10 years is about:<\/p>","a":2,"s":"<p>p = 1/50 = 0.02; risk = 1 − (1 − p)¹⁰ = 1 − 0.98¹⁰ = 0.183.<br>Other options: A — the annual probability; B — probability of no such flood; D — 10 × 0.02 (adding probabilities).<\/p>","tag":"Sub-chapter 5.6"}]},{"t":"Section B · Transportation Engineering (Q79–88)","qs":[{"id":"M2-79","m":1,"o":["Araniko Highway","Prithvi Highway","Tribhuvan Rajpath","Mahendra Highway"],"q":"<p>The East–West Highway of Nepal, running across the Terai from Mechi to Mahakali, is also known as the:<\/p>","a":3,"s":"<p>The East–West (Mahendra) Highway is the country&#x27;s longest national highway.<br>Other options: A — Kathmandu–Kodari (Tibet border); B — Kathmandu (Naubise)–Pokhara; C — Kathmandu–Hetauda via Daman.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M2-80","m":1,"o":["Reconnaissance → map study → final location → preliminary survey","Preliminary survey → map study → reconnaissance → final location survey","Final location survey → preliminary survey → reconnaissance → map study","Map study → reconnaissance → preliminary survey → final location survey"],"q":"<p>The usual order of engineering surveys for locating a new highway is:<\/p>","a":3,"s":"<p>Work proceeds from the cheapest, broadest study to the detailed staking of the chosen centre line.<br>Other options: A, B, C — out of logical order: detailed surveys cannot come before the route options are known.<\/p>","tag":"Sub-chapter 6.1"},{"id":"M2-81","m":1,"o":["0.18 m","0.36 m","0.63 m","0.99 m"],"q":"<p>A two-lane road has a horizontal curve of radius 100 m, design speed 60 km/h and vehicle wheelbase 6 m. Using IRC-type formulas (mechanical nl²/2R plus psychological V/(9.5√R)), the extra widening is about:<\/p>","a":3,"s":"<p>Mechanical = 2 × 36/200 = 0.36 m; psychological = 60/(9.5 × 10) = 0.63 m; total ≈ 0.99 m.<br>Other options: A — mechanical widening for one lane; B — mechanical widening only; C — psychological widening only.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M2-82","m":1,"o":["358 m","525 m","179 m","1125 m"],"q":"<p>For a design speed of 100 km/h, maximum superelevation 0.07 and lateral friction 0.15, the minimum radius of horizontal curve is about:<\/p>","a":0,"s":"<p>R = V²/[127(e + f)] = 10 000/(127 × 0.22) = 358 m.<br>Other options: B — superelevation ignored; C — 254 used in place of 127; D — friction ignored.<\/p>","tag":"Sub-chapter 6.2"},{"id":"M2-83","m":1,"o":["Ratio of dry density to maximum dry density","Load at a given penetration as a percentage of the standard load on crushed stone at that penetration","Penetration of a needle into bitumen at 25 °C","Ratio of soaked to unsoaked moisture content"],"q":"<p>The California Bearing Ratio (CBR) of a subgrade soil is the:<\/p>","a":1,"s":"<p>CBR = test load/standard load × 100, normally read at 2.5 mm and 5.0 mm penetration of the plunger.<br>Other options: A — relative compaction; C — the penetration test for bitumen; D — not a strength measure.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M2-84","m":1,"o":["Lower the ground-water table and keep the subgrade dry","Serve as utility ducts for cables","Increase the camber of the road","Carry surface runoff from the carriageway"],"q":"<p>Sub-surface drains (e.g. perforated pipes in gravel trenches) are provided along a highway mainly to:<\/p>","a":0,"s":"<p>A high water table softens the subgrade and cuts its bearing capacity; sub-drains keep it at least about 1–1.2 m below formation.<br>Other options: B — not a drainage purpose; C — camber is set by the surface shape; D — handled by side drains and camber.<\/p>","tag":"Sub-chapter 6.3"},{"id":"M2-85","m":1,"o":["48 km/h","24 km/h","50 km/h","52 km/h"],"q":"<p>Two vehicles cross a 1 km stretch at 40 km/h and 60 km/h. The space-mean speed is:<\/p>","a":0,"s":"<p>Space-mean speed is the harmonic mean: 2/(1/40 + 1/60) = 48 km/h.<br>Other options: B — half of the harmonic mean; C — the time-mean (arithmetic) speed; D — a weighted guess.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M2-86","m":1,"o":["8","16","32","24"],"q":"<p>At an uncontrolled four-legged intersection of two two-way roads, the total number of potential conflict points is:<\/p>","a":2,"s":"<p>16 crossing + 8 merging + 8 diverging = 32.<br>Other options: A — merging only; B — crossing conflicts only; D — crossing + merging.<\/p>","tag":"Sub-chapter 6.4"},{"id":"M2-87","m":1,"o":["At the subgrade level to reinforce the soil","Within the bituminous surface course","Across transverse joints, to transfer wheel load between adjacent slabs","Along the slab centre to resist bending"],"q":"<p>In a cement-concrete (rigid) pavement, dowel bars are provided mainly:<\/p>","a":2,"s":"<p>Smooth dowels let slabs expand and contract while sharing load across the joint.<br>Other options: A, B — dowels are inside the concrete slab; D — plain concrete slabs resist bending by their own flexural strength.<\/p>","tag":"Sub-chapter 6.5"},{"id":"M2-88","m":1,"o":["A tunnel boring machine with segmental lining only","A rigid cast-iron lining installed before excavation","The surrounding rock mass carrying load, with shotcrete and rock bolts as flexible support","Cut-and-cover construction from the surface"],"q":"<p>The New Austrian Tunnelling Method (NATM) relies mainly on:<\/p>","a":2,"s":"<p>NATM monitors deformation and uses flexible support so the rock forms a load-bearing ring.<br>Other options: A — TBM tunnelling is a separate method; B — rigid early lining is what NATM avoids; D — an open-cut method.<\/p>","tag":"Sub-chapter 6.6"}]},{"t":"Section B · Water Supply and Sanitary Engineering (Q89–98)","qs":[{"id":"M2-89","m":1,"o":["65 000","80 000","51 500","67 200"],"q":"<p>A town of 50 000 grows at 3% per year compounded. Its population after 10 years will be about:<\/p>","a":3,"s":"<p>P = 50 000 × 1.03¹⁰ = 67 196.<br>Other options: A — simple (arithmetic) growth 3% × 10; B — 6% per year simple growth; C — one year only.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M2-90","m":1,"o":["5.0 to 7.0","4.5 to 9.5","6.5 to 8.5","7.0 to 10.0"],"q":"<p>As per Nepal&#x27;s National Drinking Water Quality Standards (NDWQS 2062), the acceptable pH range of drinking water is:<\/p>","a":2,"s":"<p>NDWQS 2062 sets pH 6.5–8.5 (in line with WHO guidance).<br>Other options: A, B, D — outside the standard: low pH corrodes pipes, high pH tastes bitter and reduces chlorine efficiency.<\/p>","tag":"Sub-chapter 7.1"},{"id":"M2-91","m":1,"o":["Immediately downstream of the sewage outfall","Where the river is shallowest","Upstream of the town&#x27;s sewage and drainage outfalls","On the inner bank of a bend where silt deposits"],"q":"<p>A river intake for a town&#x27;s water supply should be located:<\/p>","a":2,"s":"<p>Locating upstream gives the least polluted water; it should also have enough depth and a stable bank.<br>Other options: A — most polluted point; B — intake may run dry in low flow; D — the inner bank silts up.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M2-92","m":1,"o":["316 mm","357 mm","714 mm","178 mm"],"q":"<p>A pipe is to carry 0.1 m³/s at a velocity of 1.0 m/s. The required internal diameter is about:<\/p>","a":1,"s":"<p>A = Q/V = 0.1 m²; D = √(4A/π) = 0.357 m.<br>Other options: A — π/4 omitted (D = √A); C — twice the diameter; D — the radius.<\/p>","tag":"Sub-chapter 7.2"},{"id":"M2-93","m":1,"o":["200 kg","2 kg","2000 kg","20 kg"],"q":"<p>A water-treatment plant treats 10 MLD with an alum dose of 20 mg/L. The daily alum requirement is:<\/p>","a":0,"s":"<p>1 mg/L × 1 ML = 1 kg; so 20 × 10 = 200 kg/day.<br>Other options: B — dose ÷ flow; C — a factor-of-10 slip; D — dose alone.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M2-94","m":1,"o":["Under-drainage system","Schmutzdecke (biological layer on top of the sand)","Gravel support layer","Clear-water outlet chamber"],"q":"<p>In a slow sand filter, most of the purification takes place in the:<\/p>","a":1,"s":"<p>The dirty skin of algae, bacteria and protozoa at the sand surface strains and digests impurities and pathogens.<br>Other options: A — only collects filtered water; C — supports the sand; D — stores filtered water.<\/p>","tag":"Sub-chapter 7.3"},{"id":"M2-95","m":1,"o":["Forecast population growth","Find the coagulant dose for treatment","Analyse flows and head losses in looped pipe networks","Design the capacity of service reservoirs"],"q":"<p>The Hardy Cross method in water-supply engineering is used to:<\/p>","a":2,"s":"<p>Flows in each loop are corrected iteratively until the head losses around every loop sum to zero.<br>Other options: A — population forecasting methods; B — jar test; D — mass curve method.<\/p>","tag":"Sub-chapter 7.4"},{"id":"M2-96","m":1,"o":["2.70 MLD","0.54 MLD","21.6 MLD","2.16 MLD"],"q":"<p>A town of 20 000 people is supplied 135 L/person/day, and 80% of it reaches the sewers. The dry-weather flow is:<\/p>","a":3,"s":"<p>DWF = 20 000 × 135 × 0.8 = 2 160 000 L/day = 2.16 MLD.<br>Other options: A — 100% returned to sewer; B — the 20% not returned; C — a factor-of-10 slip.<\/p>","tag":"Sub-chapter 7.5"},{"id":"M2-97","m":1,"o":["Aerobic oxidation","Chlorination","Chemical coagulation","Anaerobic digestion"],"q":"<p>In a septic tank, the settled sludge is stabilised mainly by:<\/p>","a":3,"s":"<p>The tank is closed and oxygen-free; anaerobic bacteria liquefy and gasify the organic matter.<br>Other options: A — needs aeration, as in activated sludge; B, C — chemical processes not used in septic tanks.<\/p>","tag":"Sub-chapter 7.6"},{"id":"M2-98","m":1,"o":["Incineration","Sanitary landfilling","Open dumping","Waste reduction at source"],"q":"<p>In the solid-waste management hierarchy, the most preferred option is:<\/p>","a":3,"s":"<p>Order of preference: reduce → reuse → recycle/compost → energy recovery → landfill.<br>Other options: A, B — the bottom of the hierarchy; C — not an acceptable option at all.<\/p>","tag":"Sub-chapter 7.6"}]}],"n":98,"marks":100},{"m":3,"secs":[{"t":"Section A · Communication English (Q1–8)","qs":[{"id":"M3-1","m":1,"o":["promising","inconclusive","flawed","disappointing"],"q":"<p>Choose the word that best completes the sentence: Although the first test results were ______, the team decided to repeat the experiment before publishing them.<\/p>","a":0,"s":"<p>&quot;Although&quot; signals contrast: the results were good, yet the team still repeated the test.<br>Other options: B, C, D — each would be a natural reason to repeat the test, so &quot;although&quot; would make no sense.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M3-2","m":1,"o":["service","disuse","demand","prominence"],"q":"<p>Choose the word that best completes the sentence: The old suspension bridge, once a vital link between the two villages, has fallen into ______ since the new motorable bridge opened.<\/p>","a":1,"s":"<p>A structure no longer used after a replacement opens has fallen into disuse.<br>Other options: A, C, D — all imply that the bridge is still used or important, contradicting the sense of the sentence.<\/p>","tag":"Sub-chapter 1.1"},{"id":"M3-3","m":2,"o":["Gates of the river intake","Channels that carry sediment away","Rotating parts of a turbine","Workers who operate the plant"],"p":"<p><b>Passage 1<\/b><br>Read the passage and answer Q3 and Q4.<\/p><p>Himalayan rivers carry some of the highest sediment loads on earth. During the monsoon, a single run-of-river plant in Nepal may receive more sand in a week than many European plants see in a year. Quartz, which makes up much of this sediment, is harder than turbine steel, so runners, guide vanes and seals can be worn away within a few seasons. Designers respond in several ways. Settling basins are sized to trap the coarser particles, intakes are closed when sediment concentration peaks, and turbine parts are coated with hard materials such as tungsten carbide. Each measure has a cost: larger basins mean more excavation, closing the intake means lost generation, and coatings must be renewed. The best design is therefore not the one that removes all sediment, but the one that balances the cost of removal against the cost of wear and lost energy over the life of the plant.<\/p>","q":"<p>As used in the passage, the word &quot;runners&quot; refers to:<\/p>","a":2,"s":"<p>It is listed with guide vanes and seals as turbine parts worn away by quartz.<br>Other options: A, B, D — the context is wear of turbine components, not people, channels or gates.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M3-4","m":2,"o":["Removes all sediment, whatever the cost","Avoids hard coatings because they must be renewed","Never closes the intake during the monsoon","Balances the cost of sediment removal against the cost of wear and lost energy"],"q":"<p>According to the passage, the best design for a plant on a sediment-laden river is one that:<\/p>","a":3,"s":"<p>The last sentence states this directly.<br>Other options: A — the passage rejects this explicitly; B — coatings are a recommended measure despite their cost; C — closing the intake is one of the accepted measures.<\/p>","tag":"Sub-chapter 1.2"},{"id":"M3-5","m":1,"o":["The quantity of materials","used on the site","were less than estimated","No error"],"q":"<p>Find the part of the sentence that contains an error: &quot;The quantity of materials / used on the site / were less than estimated.&quot;<\/p>","a":2,"s":"<p>The subject is &quot;quantity&quot; (singular), so the verb should be &quot;was&quot;.<br>Other options: A — correct subject phrase; B — correct participle phrase; D — there is an agreement error.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M3-6","m":1,"o":["This is the economicalest of the two designs.","This is the more economical of the two designs.","This is the most economical of the two designs.","This is more economical of the two designs."],"q":"<p>Choose the grammatically correct sentence.<\/p>","a":1,"s":"<p>When exactly two things are compared, use the comparative with &quot;the&quot;: the more economical of the two.<br>Other options: A — not a valid English form; C — superlative is for three or more; D — &quot;the&quot; is needed before the comparative here.<\/p>","tag":"Sub-chapter 1.3"},{"id":"M3-7","m":1,"o":["Saw : Wood","Ink : Pen","Mould : Concrete","Link : Chain"],"q":"<p>BRICK : WALL :: ?<\/p>","a":3,"s":"<p>Bricks are the units that make up a wall; links make up a chain (part : whole).<br>Other options: A — a saw cuts wood (tool : material); B — ink is held in a pen (contents : container); C — a mould shapes concrete (tool : product).<\/p>","tag":"Sub-chapter 1.4"},{"id":"M3-8","m":1,"o":["Candid : Secretive","Frugal : Thrifty","Generous : Mean","Timid : Bold"],"q":"<p>LOQUACIOUS : TALKATIVE :: ?<\/p>","a":1,"s":"<p>Loquacious and talkative are synonyms; so are frugal and thrifty.<br>Other options: A, C, D — pairs of antonyms.<\/p>","tag":"Sub-chapter 1.4"}]},{"t":"Section A · Mathematics (Q9–48)","qs":[{"id":"M3-9","m":1,"o":["8","3","7","6"],"q":"<p>The number of proper subsets of the set {1, 2, 3} is:<\/p>","a":2,"s":"<p>A set with n elements has 2ⁿ = 8 subsets; excluding the set itself leaves 7.<br>Other options: A — all subsets including the set itself; B — counted only one-element subsets; D — excluded both ∅ and the set.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M3-10","m":1,"o":["225","196","256","240"],"q":"<p>The sum of the first 15 odd natural numbers is:<\/p>","a":0,"s":"<p>1 + 3 + … + (2n − 1) = n² = 15² = 225.<br>Other options: B — 14²; C — 16²; D — n(n + 1) for n = 15.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M3-11","m":1,"o":["35","56","28","70"],"q":"<p>The coefficient of the middle term in the expansion of (x + 1/x)⁸ is:<\/p>","a":3,"s":"<p>9 terms; the middle (5th) term is 8C4 x⁴ (1/x)⁴ = 70.<br>Other options: A — 7C3, using n = 7; B — 8C3, the 4th term; C — 8C2.<\/p>","tag":"Sub-chapter 2.1"},{"id":"M3-12","m":1,"o":["2 × 4","3 × 3","4 × 2","Not defined"],"q":"<p>If A is a 2 × 3 matrix and B is a 3 × 4 matrix, the product AB is of order:<\/p>","a":0,"s":"<p>(2 × 3)(3 × 4): inner dimensions match, outer dimensions give 2 × 4.<br>Other options: B — the inner dimensions; C — the order of BᵀAᵀ; D — the product is defined since columns of A = rows of B.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-13","m":1,"o":["−1 and −6","5 and 2","2 and 3","1 and 6"],"q":"<p>The eigenvalues of the matrix with rows (5, 4) and (1, 2) are:<\/p>","a":3,"s":"<p>λ² − 7λ + 6 = 0 (trace 7, determinant 10 − 4 = 6) → λ = 1, 6.<br>Other options: A — signs wrong; B — the diagonal entries, eigenvalues only for a triangular matrix; C — product 6 but sum 5, not 7.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-14","m":1,"o":["8","64","16","32"],"q":"<p>If A is a 3 × 3 matrix with |A| = 4, then |2A| is:<\/p>","a":3,"s":"<div class=\"tw\"><table><thead><tr><th>kA<\/th><th>= kⁿ<\/th><th>A<\/th><th>= 2³ × 4 = 32.<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div><p>Other options: A — k|A|; B — |A|³; C — k²|A|, as for a 2 × 2 matrix.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-15","m":1,"o":["1/5","25","125","5"],"q":"<p>If A is a 3 × 3 matrix with |A| = 5, then |adj A| is:<\/p>","a":1,"s":"<div class=\"tw\"><table><thead><tr><th>adj A<\/th><th>=<\/th><th>A<\/th><th>^(n − 1) = 5² = 25.<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div><p>Other options: A — |A⁻¹|; C — |A|³; D — |A| itself.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-16","m":1,"o":["|A| ≠ 0","A is the identity matrix","A is symmetric","|A| = 0"],"q":"<p>The homogeneous system AX = 0 (A square) has a non-trivial solution if and only if:<\/p>","a":3,"s":"<p>Non-trivial solutions exist only when A is singular (rank &lt; n).<br>Other options: A — then X = 0 is the only solution; B — then X = 0 only; C — symmetry is irrelevant.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-17","m":1,"o":["6 and −3","5 and 2","5 and −4","2 and −1"],"q":"<p>The eigenvalues of A are 2 and −1. The eigenvalues of A + 3I are:<\/p>","a":1,"s":"<p>If Ax = λx then (A + 3I)x = (λ + 3)x: 2 + 3 = 5 and −1 + 3 = 2.<br>Other options: A — multiplied by 3 instead of adding; C — subtracted 3 from the negative eigenvalue; D — unchanged.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-18","m":1,"o":["24","21","20","12"],"q":"<p>Maximise Z = 5x + 4y subject to 6x + 4y ≤ 24, x + 2y ≤ 6, x ≥ 0, y ≥ 0. The maximum value of Z is:<\/p>","a":1,"s":"<p>Corner points: (4, 0) → 20, (0, 3) → 12, (3, 1.5) → 15 + 6 = 21. Maximum 21 at (3, 1.5).<br>Other options: A — the RHS of the first constraint; C — value at (4, 0); D — value at (0, 3).<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-19","m":1,"o":["Find the initial value of Z directly","Convert a ≥ constraint into an equation","Convert a ≤ constraint into an equation","Make the objective function linear"],"q":"<p>In the simplex method, a slack variable is added to:<\/p>","a":2,"s":"<p>s ≥ 0 takes up the unused amount: 6x + 4y + s1 = 24.<br>Other options: A — not its purpose; B — needs a surplus (and an artificial) variable; D — the objective is already linear.<\/p>","tag":"Sub-chapter 2.2"},{"id":"M3-20","m":1,"o":["49","7","5","11"],"q":"<p>The magnitude of the vector 2i − 3j + 6k is:<\/p>","a":1,"s":"<p>√(4 + 9 + 36) = √49 = 7.<br>Other options: A — the square of the magnitude; C — 2 − 3 + 6; D — sum of absolute components.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-21","m":1,"o":["8/9","8","8/3","3"],"q":"<p>The scalar projection of a = 2i + j + 2k on b = i + 2j + 2k is:<\/p>","a":2,"s":"<p>a · b/|b| = (2 + 2 + 4)/3 = 8/3.<br>Other options: A — divided by |b|²; B — a · b only; D — |b|.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-22","m":1,"o":["2","4","6","−4"],"q":"<p>The vectors i + j + k, i + 2j + 3k and 2i + 3j + λk are coplanar when λ equals:<\/p>","a":1,"s":"<p>Scalar triple product = 1(2λ − 9) − 1(λ − 6) + 1(3 − 4) = λ − 4 = 0.<br>Other options: A, C — arithmetic slips in the cofactors; D — sign slip.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-23","m":1,"o":["Always zero","Equal to |F|²","Always equal to curl (div F)","Equal to ∇²F"],"q":"<p>For any vector field F with continuous second derivatives, div (curl F) is:<\/p>","a":0,"s":"<p>A standard identity: ∇ · (∇ × F) = 0 (mixed partial derivatives cancel).<br>Other options: B — unrelated; C — div F is a scalar, so curl (div F) is not even defined; D — that is a different operator.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-24","m":1,"o":["4","8","2","0"],"q":"<p>For φ = x² − y² + 2z², the Laplacian ∇²φ is:<\/p>","a":0,"s":"<p>∇²φ = 2 − 2 + 4 = 4.<br>Other options: B — doubled; C — added 2 + 2 − 2; D — dropped the z term.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-25","m":1,"o":["The gradient of a field to its Laplacian","A line integral in a plane to a double integral over the enclosed region","The flux of F through a closed surface to the volume integral of div F","A line integral around a closed curve to a surface integral of curl F"],"q":"<p>Gauss&#x27;s divergence theorem relates:<\/p>","a":2,"s":"<p>∯ F · n dS = ∭ div F dV.<br>Other options: A — no such theorem; B — Green&#x27;s theorem; D — Stokes&#x27; theorem.<\/p>","tag":"Sub-chapter 2.3"},{"id":"M3-26","m":1,"o":["∞","1","0","e"],"q":"<p>lim (x → 0) of (eˣ − 1)/x is:<\/p>","a":1,"s":"<p>eˣ ≈ 1 + x for small x, or by L&#x27;Hôpital: eˣ/1 → 1.<br>Other options: A — not divergent; C — stopped at the 0/0 form; D — evaluated eˣ at x = 1.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-27","m":1,"o":["0","1/2","1/6","1"],"q":"<p>lim (x → 0) of (tan x − sin x)/x³ is:<\/p>","a":1,"s":"<p>tan x − sin x = tan x (1 − cos x) ≈ x · x²/2, so the limit is 1/2.<br>Other options: A — treated tan x and sin x as equal; C — used only the sin x cubic term; D — took 1 − cos x ≈ x².<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-28","m":1,"o":["eˣ sin x","eˣ cos x","eˣ (sin x − cos x)","eˣ (sin x + cos x)"],"q":"<p>The derivative of eˣ sin x is:<\/p>","a":3,"s":"<p>Product rule: eˣ sin x + eˣ cos x.<br>Other options: A — derivative of sin x ignored; B — derivative of eˣ ignored; C — sign error.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-29","m":1,"o":["400","200","75","100"],"q":"<p>Two positive numbers have a sum of 20. The maximum value of their product is:<\/p>","a":3,"s":"<p>xy = x(20 − x) is maximum at x = 10, giving 100.<br>Other options: A — 20²; B — 20 × 10; C — taking 15 and 5.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-30","m":1,"o":["−1/6","1/3","−1/2","1/6"],"q":"<p>In the Maclaurin series of sin x, the coefficient of x³ is:<\/p>","a":0,"s":"<p>sin x = x − x³/3! + x⁵/5! − …<br>Other options: B — 1/3 instead of 1/3!; C — confused with the x² term of cos x; D — sign lost.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-31","m":1,"o":["3/4","1/3","2/3","π/4"],"q":"<p>The value of ∫ cos³x dx from 0 to π/2 is:<\/p>","a":2,"s":"<p>Wallis&#x27; formula for odd n: (n − 1)/n × … = 2/3 × 1 = 2/3.<br>Other options: A — wrong Wallis product; B — integrated as cos²x · ⅓; D — the even-power π/2 factor wrongly included.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-32","m":1,"o":["1","∞","1/2","2"],"q":"<p>The value of ∫ e^(−2x) dx from 0 to ∞ is:<\/p>","a":2,"s":"<p>[−e^(−2x)/2] from 0 to ∞ = 0 + 1/2.<br>Other options: A — ignored the 2 in the exponent; B — the integral converges; D — multiplied by 2 instead of dividing.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-33","m":1,"o":["1","1/2","4","2"],"q":"<p>The value of the double integral ∫∫ xy dy dx with x from 0 to 1 and y from 0 to 2 is:<\/p>","a":0,"s":"<p>∫ x dx (0 to 1) × ∫ y dy (0 to 2) = 1/2 × 2 = 1.<br>Other options: B — y-integral taken as 1; C — both ½ factors omitted; D — forgot the ½ in ∫ x dx.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-34","m":1,"o":["2t + 2t²","2t + 4t","4t³","2t + 4t³"],"q":"<p>If z = x² + y² with x = t and y = t², then dz/dt is:<\/p>","a":3,"s":"<p>dz/dt = 2x(dx/dt) + 2y(dy/dt) = 2t + 2t²(2t) = 2t + 4t³.<br>Other options: A — forgot dy/dt; B — wrong substitution for y; C — dropped the x term.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-35","m":1,"o":["∂M/∂x = ∂N/∂y","M = N","∂M/∂y = ∂N/∂x","∂M/∂x + ∂N/∂y = 0"],"q":"<p>The differential equation M(x, y) dx + N(x, y) dy = 0 is exact when:<\/p>","a":2,"s":"<p>Exactness means M dx + N dy is the total differential of some f(x, y); equality of mixed partials gives this test.<br>Other options: A — wrong variables; B — not required; D — not the exactness test.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-36","m":1,"o":["2e","e","e²","2"],"q":"<p>If dy/dx = y and y(0) = 2, then y(1) is:<\/p>","a":0,"s":"<p>y = 2eˣ, so y(1) = 2e.<br>Other options: B — ignored the initial value; C — wrote e^(2x); D — no growth.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-37","m":1,"o":["x e^(2x)/3","e^(2x)","e^(2x)/5","e^(2x)/3"],"q":"<p>A particular integral of y″ − y = e^(2x) is:<\/p>","a":3,"s":"<p>PI = e^(2x)/(D² − 1) with D = 2: e^(2x)/(4 − 1).<br>Other options: A — the x factor is needed only when 2 is a root of the auxiliary equation; B — forgot to divide; C — used D² + 1.<\/p>","tag":"Sub-chapter 2.4"},{"id":"M3-38","m":1,"o":["6.5","5","6.67","8"],"q":"<p>The median of the data 2, 8, 3, 12, 5, 10 is:<\/p>","a":0,"s":"<p>Sorted: 2, 3, 5, 8, 10, 12; median = (5 + 8)/2 = 6.5.<br>Other options: B, D — one of the two middle values only; C — the mean.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M3-39","m":1,"o":["0.954","0.997","0.500","0.683"],"q":"<p>For a normally distributed variable, the probability of lying within one standard deviation of the mean is about:<\/p>","a":3,"s":"<p>The 68–95–99.7 rule: P(−1 &lt; Z &lt; 1) ≈ 0.683.<br>Other options: A — within ±2σ; B — within ±3σ; C — one side of the mean.<\/p>","tag":"Sub-chapter 2.5"},{"id":"M3-40"
