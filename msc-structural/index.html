e ½; B — this is the strain σ/E, not energy; C — σ²/4E.<\/p>","tag":""},{"id":"3.1.12","m":1,"o":["The same","1.5 times","2 times","4 times"],"q":"<p>A load is suddenly applied (not gradually) to an elastic bar. Compared with the same load applied gradually, the maximum stress produced is:<\/p>","a":2,"s":"<p>Work done P·δ = strain energy σ²AL/2E with σ = Eδ/L gives σ = 2P/A, twice the gradual value P/A.<br>Other options: A — gradual loading; B, D — no such factor for sudden loading (4 times is the strain energy ratio).<\/p>","tag":""},{"id":"3.1.13","m":1,"o":["4 MPa","202 MPa","143.4 MPa","2 MPa"],"q":"<p>A weight of 1 kN falls through 100 mm onto a collar at the lower end of a vertical bar 2 m long and 500 mm² in area. Take E = 200 GPa. The maximum instantaneous stress in the bar is about:<\/p>","a":1,"s":"<p>σ = (W/A)[1 + √(1 + 2AEh/(WL))] = 2 × [1 + √(1 + 2 × 500 × 200 000 × 100/(1000 × 2000))] = 2 × (1 + √10 001) ≈ 202 MPa.<br>Other options: A — sudden load with h = 0 (2W/A); C — dropped the 2 inside the root: 2[1 + √(1 + AEh/WL)]; D — static stress W/A.<\/p>","tag":""},{"id":"3.1.14","m":1,"o":["100 MPa and 0","90 MPa and 10 MPa","122.1 MPa and −22.1 MPa","50 MPa and 50 MPa"],"q":"<p>At a point in a strained material σx = 80 MPa (tension), σy = 20 MPa (tension) and τxy = 40 MPa. The major and minor principal stresses are:<\/p>","a":0,"s":"<p>Centre = (80 + 20)/2 = 50; radius R = √(30² + 40²) = 50. σ1,2 = 50 ± 50 = 100 and 0 MPa.<br>Other options: B — radius taken as 40 (ignored (σx − σy)/2); C — radius taken as √(60² + 40²) = 72.1, using the full difference σx − σy instead of half; D — centre only.<\/p>","tag":""},{"id":"3.1.15","m":1,"o":["53.1°","45°","26.6°","36.9°"],"q":"<p>For σx = 80 MPa, σy = 20 MPa and τxy = 40 MPa, the major principal plane is inclined to the plane of σx at about:<\/p>","a":2,"s":"<p>tan 2θ = 2τxy/(σx − σy) = 80/60 → 2θ = 53.13° → θ = 26.6°.<br>Other options: A — this is 2θ, not θ; B — plane of maximum shear relative to principal planes; D — complement of 2θ.<\/p>","tag":""},{"id":"3.1.16","m":1,"o":["±τ/2 at 45° to the shear planes","±τ, acting on the shear planes themselves","+2τ and 0 at 45°","+τ and −τ on planes at 45° to the shear planes"],"q":"<p>An element is in a state of pure shear τ. The principal stresses and their planes are:<\/p>","a":3,"s":"<p>Mohr&#x27;s circle for pure shear is centred at the origin with radius τ, so σ1 = +τ, σ2 = −τ, at 2θ = 90° (θ = 45°).<br>Other options: A — wrong magnitude; B — the shear planes carry no normal stress; C — that is the uniaxial-tension pattern, not pure shear.<\/p>","tag":""},{"id":"3.1.17","m":1,"o":["σ on planes at 45° to the axis","σ/2 on planes at 45° to the axis","σ/2 on cross-sectional planes","σ/4 on planes at 30° to the axis"],"q":"<p>A bar is in uniaxial tension with stress σ. The maximum shear stress and the plane on which it acts are:<\/p>","a":1,"s":"<p>τθ = (σ/2) sin 2θ, maximum σ/2 at θ = 45°. Mohr&#x27;s circle radius = σ/2.<br>Other options: A — magnitude doubled; C — cross-section carries only normal stress; D — wrong angle and value.<\/p>","tag":""},{"id":"3.1.18","m":1,"o":["75 MPa","50 MPa","43.3 MPa","86.6 MPa"],"q":"<p>A bar carries a uniaxial tensile stress of 100 MPa. On a plane whose normal makes 30° with the bar axis, the normal stress is:<\/p>","a":0,"s":"<p>σn = σ cos²θ = 100 × cos² 30° = 75 MPa (shear on that plane = (σ/2) sin 60° = 43.3 MPa).<br>Other options: B — σ/2; C — this is the shear stress on that plane; D — σ cos θ, cosine not squared.<\/p>","tag":""},{"id":"3.1.19","m":1,"o":["50 MPa and 100 MPa","200 MPa and 100 MPa","100 MPa and 50 MPa","100 MPa and 100 MPa"],"q":"<p>A thin cylinder of internal diameter 1 m and wall thickness 10 mm carries an internal pressure of 2 MPa. The hoop and longitudinal stresses are:<\/p>","a":2,"s":"<p>Hoop σc = pd/2t = 2 × 1000/20 = 100 MPa; longitudinal σl = pd/4t = 50 MPa.<br>Other options: A — swapped; B — used pd/t and pd/2t; D — a sphere would have equal stresses, but pd/4t = 50 MPa.<\/p>","tag":""},{"id":"3.1.20","m":1,"o":["2.0","1.75","4.5","3.5"],"q":"<p>For a thin cylinder under internal pressure with ν = 0.25, the ratio of hoop strain to longitudinal strain is:<\/p>","a":3,"s":"<p>εc = (σ/E)(1 − ν/2), εl = (σ/E)(½ − ν) with σ = hoop stress. Ratio = (2 − ν)/(1 − 2ν) = 1.75/0.5 = 3.5.<br>Other options: A — this is the stress ratio, not the strain ratio; B — only the numerator (2 − ν); C — used (2 + ν)/(1 − 2ν).<\/p>","tag":""},{"id":"3.1.21","m":1,"o":["100 MPa","50 MPa","25 MPa","200 MPa"],"q":"<p>A thin spherical shell of 2 m internal diameter and 10 mm wall thickness carries an internal pressure of 1 MPa. The stress in the shell wall is:<\/p>","a":1,"s":"<p>σ = pd/4t = 1 × 2000/40 = 50 MPa (same in all directions).<br>Other options: A — used pd/2t (cylinder hoop formula); C — pd/8t; D — pd/t.<\/p>","tag":""},{"id":"3.1.22","m":1,"o":["50.9 MPa","25.5 MPa","101.9 MPa","12.7 MPa"],"q":"<p>A solid circular shaft of 100 mm diameter transmits a torque of 10 kN·m. The maximum shear stress is about:<\/p>","a":0,"s":"<p>τmax = 16T/(πd³) = 16 × 10 × 10⁶/(π × 100³) = 50.9 MPa.<br>Other options: B — used 8T/πd³; C — 32T/πd³ (used J/d instead of J/(d/2)); D — section modulus taken as πd³/4.<\/p>","tag":""},{"id":"3.1.23","m":1,"o":["0.58°","2.33°","1.17°","0.020°"],"q":"<p>A solid shaft of 50 mm diameter and 1 m length is subjected to a torque of 1 kN·m. Take G = 80 GPa. The angle of twist is about:<\/p>","a":2,"s":"<p>J = π × 50⁴/32 = 6.136 × 10⁵ mm⁴. θ = TL/GJ = 10⁶ × 1000/(80 000 × 6.136 × 10⁵) = 0.0204 rad = 1.17°.<br>Other options: A — half (used J = πd⁴/16); B — double (used πd⁴/64, the I value); D — the radian value read as degrees.<\/p>","tag":""},{"id":"3.1.24","m":1,"o":["333 N·m","3183 N·m","6366 N·m","1592 N·m"],"q":"<p>A shaft transmits 100 kW at 300 rpm. The mean torque on the shaft is about:<\/p>","a":1,"s":"<p>P = 2πNT/60 → T = 100 000 × 60/(2π × 300) = 3183 N·m.<br>Other options: A — P/N without 2π/60 conversion (100 000/300); C — used πN/60 instead of 2πN/60; D — used 4πN/60 (double the angular speed).<\/p>","tag":""},{"id":"3.1.25","m":1,"o":["2 times","4 times","16 times","8 times"],"q":"<p>If the diameter of a solid shaft is doubled (same allowable shear stress), the torque it can transmit becomes:<\/p>","a":3,"s":"<p>T = (π/16) τ d³, so T ∝ d³ → 2³ = 8 times.<br>Other options: A — linear; B — square (area); C — d⁴ applies to torsional stiffness (J), not strength.<\/p>","tag":""},{"id":"3.1.26","m":1,"o":["0.5L","0.7L","2L","L"],"q":"<p>For a column with one end fixed and the other end free, the effective length is (L = actual length):<\/p>","a":2,"s":"<p>A fixed–free column buckles like half of a pinned column of length 2L, so Le = 2L.<br>Other options: A — both ends fixed; B — one end fixed, other hinged (≈ 0.707L); D — both ends hinged.<\/p>","tag":""},{"id":"3.1.27","m":1,"o":["4","2","1/4","16"],"q":"<p>Two columns of the same material, length and section; one has both ends fixed, the other both ends hinged. The ratio of Euler buckling loads (fixed–fixed : hinged–hinged) is:<\/p>","a":0,"s":"<p>Pcr ∝ 1/Le². Le = 0.5L for fixed–fixed, L for hinged–hinged → (1/0.25)/(1) = 4.<br>Other options: B — ratio of effective lengths instead of their squares; C — inverted; D — squared twice.<\/p>","tag":""},{"id":"3.1.28","m":1,"o":["438.6 kN","1754.6 kN","7018 kN","558.5 kN"],"q":"<p>A column hinged at both ends is 3 m long. Its I = 8 × 10⁶ mm⁴ and E = 200 GPa. The Euler buckling load is about:<\/p>","a":1,"s":"<p>Pcr = π²EI/Le² = π² × 200 000 × 8 × 10⁶/3000² = 1.7546 × 10⁶ N = 1754.6 kN.<br>Other options: A — used Le = 2L (fixed–free); C — used Le = 0.5L (fixed–fixed); D — used π instead of π².<\/p>","tag":""},{"id":"3.1.29","m":1,"o":["50","100","400","200"],"q":"<p>A solid circular strut of 40 mm diameter has an effective length of 2 m. Its slenderness ratio is:<\/p>","a":3,"s":"<p>r = √(I/A) = d/4 = 10 mm. λ = Le/r = 2000/10 = 200.<br>Other options: A — Le/d; B — took r = d/2 = 20 mm; C — took r = d/8.<\/p>","tag":""},{"id":"3.1.30","m":1,"o":["3.14","1000","99.3","314"],"q":"<p>For mild steel with E = 200 GPa and proportional limit 200 MPa, the minimum slenderness ratio above which Euler&#x27;s formula is valid is about:<\/p>","a":2,"s":"<p>Euler stress π²E/λ² ≤ σp → λ ≥ π√(E/σp) = π√1000 = 99.3.<br>Other options: A — E in GPa with σp in MPa mixed (π√1); B — E/σp without square root and π; D — 10 times too large (√1000 misread as 100).<\/p>","tag":""}]},{"k":"3.2","t":"Bending and Deflection","qs":[{"id":"3.2.1","m":1,"o":["360 kN·m","180 kN·m","90 kN·m","60 kN·m"],"q":"<p>A simply supported beam of 6 m span carries a uniformly distributed load of 20 kN/m over the whole span. The maximum bending moment is:<\/p>","a":2,"s":"<p>Mmax = wL²/8 = 20 × 36/8 = 90 kN·m at mid-span.<br>Other options: A — wL² (no divisor); B — wL²/2 (cantilever formula); D — wL²/12 (fixed-end moment of a fixed beam).<\/p>","tag":""},{"id":"3.2.2","m":1,"o":["Linear (triangular) and parabolic","Rectangular and linear","Parabolic and cubic","Linear and linear"],"q":"<p>For a cantilever carrying a uniformly distributed load over its whole length, the shapes of the shear force and bending moment diagrams are respectively:<\/p>","a":0,"s":"<p>dV/dx = −w (constant) → V varies linearly; dM/dx = V → M is second-degree (parabolic).<br>Other options: B — that is for a point load at the free end; C — that is for a uniformly varying (triangular) load; D — M cannot be linear when V varies.<\/p>","tag":""},{"id":"3.2.3","m":1,"o":["The load intensity is maximum","The shear force is maximum","The deflection is zero","The shear force is zero or changes sign"],"q":"<p>In a beam, the bending moment is maximum at the section where:<\/p>","a":3,"s":"<p>Since dM/dx = V, M is stationary (maximum or minimum) where V = 0 or changes sign.<br>Other options: A — load intensity is dV/dx, not the moment; B — maximum shear is usually at supports where M may be zero; C — zero deflection is at supports.<\/p>","tag":""},{"id":"3.2.4","m":1,"o":["80 kN·m","60 kN·m","40 kN·m","120 kN·m"],"q":"<p>A simply supported beam of 8 m span carries a point load of 40 kN at 2 m from the left support. The maximum bending moment is:<\/p>","a":1,"s":"<p>Mmax = Wab/L = 40 × 2 × 6/8 = 60 kN·m under the load.<br>Other options: A — WL/4 (load assumed at mid-span); C — W × a/2; D — W × a × b/4 (wrong divisor).<\/p>","tag":""},{"id":"3.2.5","m":1,"o":["135.0 kN·m","45.0 kN·m","69.3 kN·m","90.0 kN·m"],"q":"<p>A simply supported beam of 6 m span carries a triangular load varying from zero at the left support to 30 kN/m at the right support. The maximum bending moment is about:<\/p>","a":2,"s":"<p>Mmax = wL²/(9√3) = 30 × 36/(9 × 1.732) = 69.3 kN·m, at x = L/√3 = 3.46 m from the zero end.<br>Other options: A — wL²/8, treating the load as a full UDL of 30 kN/m; B — wL²/24 used; D — wL²/12.<\/p>","tag":""},{"id":"3.2.6","m":1,"o":["The bending moment changes sign","The shear force changes sign","The deflection is maximum","The slope is zero"],"q":"<p>A point of contraflexure in a beam is a point where:<\/p>","a":0,"s":"<p>At a point of contraflexure the BM passes through zero and changes from sagging to hogging (curvature reverses).<br>Other options: B — that gives maximum BM; C, D — these relate to the elastic curve, not the BM sign.<\/p>","tag":""},{"id":"3.2.7","m":1,"o":["2.67 m","4.00 m","6.00 m","5.33 m"],"q":"<p>A beam ABC is simply supported at A and B (AB = 6 m) with an overhang BC = 2 m. It carries a UDL of 10 kN/m over the whole length AC. The point of contraflexure in span AB is at a distance from A of about:<\/p>","a":3,"s":"<p>ΣMA: RB × 6 = 10 × 8 × 4 → RB = 53.33 kN, RA = 26.67 kN. M(x) = 26.67x − 5x² = 0 → x = 5.33 m.<br>Other options: A — x where shear is zero (max sagging moment); B — mid-way guess; C — that is support B, where the hogging moment is 20 kN·m.<\/p>","tag":""},{"id":"3.2.8","m":1,"o":["M/I = σ/A = E/y","M/I = σ/y = E/R","M/y = σ/I = R/E","M/E = σ/R = I/y"],"q":"<p>The simple bending (flexure) equation is:<\/p>","a":1,"s":"<p>For pure bending with plane sections remaining plane: M/I = σ/y = E/R.<br>Other options: A, C, D — the terms are mixed up; σ varies with y, and curvature 1/R is M/EI.<\/p>","tag":""},{"id":"3.2.9","m":1,"o":["15 MPa","10 MPa","30 MPa","7.5 MPa"],"q":"<p>A rectangular beam 200 mm wide and 400 mm deep is subjected to a bending moment of 80 kN·m. The maximum bending stress is:<\/p>","a":0,"s":"<p>Z = bd²/6 = 200 × 400²/6 = 5.333 × 10⁶ mm³. σ = M/Z = 80 × 10⁶/5.333 × 10⁶ = 15 MPa.<br>Other options: B — used the plastic modulus bd²/4; C — used bd²/12 as Z; D — half the answer (y taken as d/4).<\/p>","tag":""},{"id":"3.2.10","m":1,"o":["πd⁴/64","πd³/16","πd³/32","πd²/4"],"q":"<p>The elastic section modulus of a solid circular section of diameter d is:<\/p>","a":2,"s":"<p>Z = I/ymax = (πd⁴/64)/(d/2) = πd³/32.<br>Other options: A — this is I; B — this is the polar section modulus Zp = J/r used in torsion; D — the area.<\/p>","tag":""},{"id":"3.2.11","m":1,"o":["√2","1","2","1/√2"],"q":"<p>A square beam of side a is used once with a side horizontal and once with a diagonal vertical. The ratio of moment of resistance (diagonal vertical : side horizontal) is:<\/p>","a":3,"s":"<p>I is a⁴/12 both ways. Side horizontal: Z = a³/6. Diagonal vertical: ymax = a/√2 → Z = a³/(6√2). Ratio = 1/√2 ≈ 0.707.<br>Other options: A — inverted; B — I is equal but Z is not; C — no basis.<\/p>","tag":""},{"id":"3.2.12","m":1,"o":["1","√2","√3","2"],"q":"<p>The strongest rectangular beam (maximum section modulus) that can be cut from a circular log of diameter D has depth-to-width ratio:<\/p>","a":1,"s":"<p>Z = b(D² − b²)/6, maximise → b = D/√3, d = D√(2/3), d/b = √2.<br>Other options: A — square section, not optimum; C — ratio for the stiffest beam (maximum I); D — no basis.<\/p>","tag":""},{"id":"3.2.13","m":1,"o":["1.5 MPa","1.0 MPa","2.0 MPa","3.0 MPa"],"q":"<p>A rectangular section 200 mm wide and 300 mm deep carries a shear force of 60 kN. The maximum shear stress is:<\/p>","a":0,"s":"<p>τavg = V/bd = 60 000/(200 × 300) = 1.0 MPa; τmax = 1.5 τavg = 1.5 MPa at the neutral axis.<br>Other options: B — average value only; C — took τmax as 2 × average; D — used 3 × average.<\/p>","tag":""},{"id":"3.2.14","m":1,"o":["1.5","2.0","4/3","1.125"],"q":"<p>For a solid circular section, the ratio of maximum to average shear stress is:<\/p>","a":2,"s":"<p>τmax = (4/3) V/A at the neutral axis of a circle.<br>Other options: A — rectangular section; B — thin circular tube; D — no standard section.<\/p>","tag":""},{"id":"3.2.15","m":1,"o":["Is uniform over the depth","Is maximum at the extreme fibres and zero at the neutral axis","Is maximum in the flanges, which carry most of the shear force","Is maximum at the neutral axis in the web and jumps suddenly at the flange–web junction"],"q":"<p>In an I-section beam under transverse shear, the shear stress distribution:<\/p>","a":3,"s":"<p>τ = VAȳ/(Ib); b drops from flange width to web thickness at the junction, so τ jumps; the web carries most of the shear, peak at the NA.<br>Other options: A — never uniform; B — τ is zero at the extreme fibres; C — flanges carry little shear because b is large.<\/p>","tag":""},{"id":"3.2.16","m":1,"o":["200 MPa","400 MPa","100 MPa","50 MPa"],"q":"<p>A steel beam (E = 200 GPa) of 400 mm depth, symmetric about its neutral axis, is bent into an arc of radius 200 m. The maximum bending stress is:<\/p>","a":0,"s":"<p>σ = Ey/R = 200 000 × 200/200 000 = 200 MPa (y = 200 mm, R = 200 000 mm).<br>Other options: B — used full depth 400 mm as y; C — y = d/4; D — y taken as d/8.<\/p>","tag":""},{"id":"3.2.17","m":1,"o":["2.25 mm","4.5 mm","1.69 mm","13.5 mm"],"q":"<p>A cantilever of 3 m span carries a point load of 10 kN at its free end. EI = 2 × 10⁴ kN·m². The free-end deflection is:<\/p>","a":1,"s":"<p>δ = PL³/3EI = 10 × 27/(3 × 20 000) = 0.0045 m = 4.5 mm.<br>Other options: A — PL³/6EI; C — wL⁴/8EI pattern applied to a point load (PL³/8EI); D — PL³/EI without the 3.<\/p>","tag":""},{"id":"3.2.18","m":1,"o":["2.70 mm","64.8 mm","6.75 mm","1.35 mm"],"q":"<p>A simply supported beam of 6 m span carries a UDL of 12 kN/m. EI = 3 × 10⁴ kN·m². The central deflection is:<\/p>","a":2,"s":"<p>δ = 5wL⁴/384EI = 5 × 12 × 6⁴/(384 × 30 000) = 0.00675 m = 6.75 mm.<br>Other options: A — wL⁴/192EI, coefficient borrowed from the fixed-beam point-load case; B — wL⁴/8EI (cantilever formula); D — wL⁴/384EI (fixed-beam UDL formula).<\/p>","tag":""},{"id":"3.2.19","m":1,"o":["WL²/8EI and WL³/3EI","WL²/2EI and WL³/48EI","WL²/16EI and WL³/192EI","WL²/16EI and WL³/48EI"],"q":"<p>For a simply supported beam of span L with a central point load W, the slope at the supports and the central deflection are respectively:<\/p>","a":3,"s":"<p>Standard results: θA = WL²/16EI, δC = WL³/48EI.<br>Other options: A — cantilever-type values; B — slope of a cantilever with end load; C — WL³/192EI is the fixed-beam deflection.<\/p>","tag":""},{"id":"3.2.20","m":1,"o":["19.2 mm","25.6 mm","12.8 mm","6.4 mm"],"q":"<p>A cantilever of 4 m span carries a UDL of 12 kN/m over its full length. EI = 2 × 10⁴ kN·m². The free-end deflection is:<\/p>","a":0,"s":"<p>δ = wL⁴/8EI = 12 × 256/(8 × 20 000) = 0.0192 m = 19.2 mm.<br>Other options: B — wL⁴/6EI (the slope formula pattern); C — wL⁴/12EI; D — wL⁴/24EI.<\/p>","tag":""},{"id":"3.2.21","m":1,"o":["1.6","0.625","0.5","0.8"],"q":"<p>A simply supported beam carries a total load W either as a UDL over the span or as a single central point load. The ratio of central deflections (UDL : point load) is:<\/p>","a":1,"s":"<p>UDL: 5WL³/384EI; point: WL³/48EI. Ratio = 5 × 48/384 = 0.625.<br>Other options: A — inverted; C — ratio of maximum BMs (WL/8 : WL/4); D — no basis.<\/p>","tag":""},{"id":"3.2.22","m":1,"o":["EI d⁴y/dx⁴ = M","EI dy/dx = M","EI d²y/dx² = M","EI d³y/dx³ = M"],"q":"<p>In the double integration method, the differential equation of the elastic curve is:<\/p>","a":2,"s":"<p>Curvature 1/R ≈ d²y/dx² = M/EI. Integrating twice gives slope and deflection; constants from boundary conditions.<br>Other options: A — EI y&#x27;&#x27;&#x27;&#x27; equals the load intensity w; B — dy/dx is slope; D — EI y&#x27;&#x27;&#x27; is the shear force.<\/p>","tag":""},{"id":"3.2.23","m":1,"o":["Always included in the moment expression","Integrated as a product with x","Replaced by its absolute value","Taken as zero when (x − a) is negative"],"q":"<p>In Macaulay&#x27;s method, a term written as [x − a] inside Macaulay brackets is:<\/p>","a":3,"s":"<p>Macaulay brackets switch a load term on only beyond its point of application; [x − a] = 0 for x &lt; a, and it is integrated as a whole, e.g. [x − a]²/2.<br>Other options: A — would apply loads before they act; B — must be integrated as a unit; C — absolute value would be wrong for x &lt; a.<\/p>","tag":""},{"id":"3.2.24","m":1,"o":["The moment of the M/EI diagram between the points about one point","The area of the M/EI diagram between the two points","The area of the shear force diagram between the points","The maximum ordinate of the M/EI diagram"],"q":"<p>According to the first moment-area theorem, the change in slope between two points of a beam&#x27;s elastic curve equals:<\/p>","a":1,"s":"<p>θB − θA = ∫ (M/EI) dx between A and B.<br>Other options: A — this is the second theorem (tangential deviation); C — area of SFD gives change in BM; D — no basis.<\/p>","tag":""},{"id":"3.2.25","m":1,"o":["4 mm","2 mm","8 mm","1.33 mm"],"q":"<p>A cantilever of 4 m span carries a clockwise moment of 20 kN·m at its free end. EI = 4 × 10⁴ kN·m². The free-end deflection is:<\/p>","a":0,"s":"<p>Uniform M: δ = ML²/2EI = 20 × 16/(2 × 40 000) = 0.004 m = 4 mm.<br>Other options: B — ML²/4EI; C — ML²/EI (forgot ½); D — ML²/6EI.<\/p>","tag":""},{"id":"3.2.26","m":1,"o":["Fixed end","Hinged support","Free end","Roller support"],"q":"<p>In the conjugate beam method, a fixed end of the real beam becomes in the conjugate beam a:<\/p>","a":2,"s":"<p>Real fixed end: slope = 0 and deflection = 0, so conjugate shear = 0 and moment = 0 → free end.<br>Other options: A — a free end of the real beam becomes fixed; B, D — simple supports stay simple supports.<\/p>","tag":""},{"id":"3.2.27","m":1,"o":["Fixed end","Free end","Internal hinge","Intermediate support"],"q":"<p>In the conjugate beam method, an internal hinge in the real beam becomes in the conjugate beam a(n):<\/p>","a":3,"s":"<p>At an internal hinge there can be deflection and a jump in slope (moment zero) → conjugate has moment ≠ 0 and a jump in shear → an internal support. Conversely, an intermediate support becomes an internal hinge.<br>Other options: A, B — these swap with free and fixed ends; C — a hinge in the conjugate beam corresponds to an intermediate support in the real beam.<\/p>","tag":""},{"id":"3.2.28","m":1,"o":["1.6 mm","8 mm","3.2 mm","25.6 mm"],"q":"<p>A cantilever of 4 m span carries a point load of 24 kN at mid-length (2 m from the fixed end). EI = 2 × 10⁴ kN·m². The free-end deflection is:<\/p>","a":1,"s":"<p>δ(free) = 5PL³/48EI = 5 × 24 × 64/(48 × 20 000) = 0.008 m = 8 mm. (Deflection under load P(L/2)³/3EI plus slope × L/2.)<br>Other options: A — PL³/48EI (simply supported central-load formula); C — deflection under the load only, P(L/2)³/3EI; D — PL³/3EI with load at the tip.<\/p>","tag":""},{"id":"3.2.29","m":1,"o":["1/2","1/4","1/8","1/16"],"q":"<p>If the depth of a rectangular beam is doubled (other things unchanged), its deflection under a given load becomes:<\/p>","a":2,"s":"<p>δ ∝ 1/I and I = bd³/12 ∝ d³ → 1/2³ = 1/8.<br>Other options: A — doubling the width; B — the change in maximum bending stress (Z ∝ d²); D — d⁴ applies to circular diameter.<\/p>","tag":""},{"id":"3.2.30","m":1,"o":["24 mm","3 mm","12 mm","6 mm"],"q":"<p>A simply supported beam of 8 m span is bent by equal and opposite end couples of 30 kN·m (uniform sagging moment). EI = 4 × 10⁴ kN·m². The central deflection is:<\/p>","a":3,"s":"<p>Uniform M: δ = ML²/8EI = 30 × 64/(8 × 40 000) = 0.006 m = 6 mm.<br>Other options: A — ML²/2EI (cantilever formula); B — ML²/16EI; C — ML²/4EI.<\/p>","tag":""}]},{"k":"3.3","t":"Energy Methods and Indeterminacy","qs":[{"id":"3.3.1","m":1,"o":["∫ M/(2EI) dx","∫ M²/(2EI) dx","∫ M²/(EI) dx","∫ M²/(2GJ) dx"],"q":"<p>The strain energy stored in a beam due to bending is given by:<\/p>","a":1,"s":"<p>U = ∫ M² dx/(2EI) over the length (from dU = ½ M dθ with dθ = M dx/EI).<br>Other options: A — M must be squared; C — missing the ½; D — GJ is for torsion with T, not bending.<\/p>","tag":""},{"id":"3.3.2","m":1,"o":["The reaction at the support nearest to Pi","The load Pi itself","The internal moment at the load point","The displacement at the point of Pi in the direction of Pi"],"q":"<p>Castigliano&#x27;s second theorem states that, for a linearly elastic structure, the partial derivative of the total strain energy with respect to a load Pi gives:<\/p>","a":3,"s":"<p>∂U/∂Pi = Δi. (The first theorem is ∂U/∂Δi = Pi.)<br>Other options: A — reactions follow from ∂U/∂R = 0 for redundants, not this statement; B — that is the first theorem (derivative w.r.t. displacement); C — no such relation.<\/p>","tag":""},{"id":"3.3.3","m":1,"o":["50 J","100 J","25 J","500 J"],"q":"<p>A bar 2 m long with cross-sectional area 1000 mm² carries an axial load of 100 kN. Take E = 200 GPa. The strain energy stored is:<\/p>","a":0,"s":"<p>U = P²L/2AE = (10⁵)² × 2000/(2 × 1000 × 200 000) = 50 000 N·mm = 50 J.<br>Other options: B — P²L/AE (no ½); C — P²L/4AE; D — mm-to-m slip by a factor of 10.<\/p>","tag":""},{"id":"3.3.4","m":1,"o":["40.0 J","6.7 J","13.3 J","26.7 J"],"q":"<p>A cantilever 2 m long carries a point load of 10 kN at its free end. EI = 1 × 10⁴ kN·m². The bending strain energy stored is about:<\/p>","a":2,"s":"<p>U = ∫(Px)² dx/2EI = P²L³/6EI = 100 × 8/(6 × 10⁴) = 0.01333 kN·m = 13.3 J.<br>Other options: A — P²L³/2EI; B — P²L³/12EI; D — P²L³/3EI (forgot the ½).<\/p>","tag":""},{"id":"3.3.5","m":1,"o":["Σ P k /(AE)","Σ P k L/(AE)","Σ P² L/(2AE)","Σ k² L/(AE)"],"q":"<p>In the unit load method, the deflection of a joint of a pin-jointed truss is computed as:<\/p>","a":1,"s":"<p>Δ = Σ (P k L)/(A E), where P = member force due to actual loads, k = member force due to a unit load at the joint in the required direction.<br>Other options: A — length missing; C — strain energy, not deflection; D — this is the flexibility coefficient for a redundant, not the deflection.<\/p>","tag":""},{"id":"3.3.6","m":1,"o":["The deflection at point 1 due to a unit load at point 2 equals the deflection at point 2 due to a unit load at point 1","The deflection at a point equals the derivative of strain energy with respect to the load there","Work done by external loads equals the strain energy","The sum of virtual works is zero"],"q":"<p>Maxwell&#x27;s reciprocal theorem states that, in a linearly elastic structure:<\/p>","a":0,"s":"<p>δ12 = δ21 — flexibility coefficients are symmetric.<br>Other options: B — Castigliano&#x27;s second theorem; C — Clapeyron&#x27;s theorem/energy conservation; D — principle of virtual work.<\/p>","tag":""},{"id":"3.3.7","m":1,"o":["3.0 mm","1.2 mm","75 mm","7.5 mm"],"q":"<p>A 10 kN load at point 1 of an elastic beam produces a deflection of 3 mm at point 2. If instead a 25 kN load is applied at point 2, the deflection at point 1 is:<\/p>","a":3,"s":"<p>By Maxwell&#x27;s theorem δ12 = δ21 = 3/10 = 0.3 mm/kN. Deflection at 1 = 0.3 × 25 = 7.5 mm.<br>Other options: A — copies the given value; B — 3 × 10/25 (inverted ratio); C — 3 × 25, forgot to divide by 10 kN.<\/p>","tag":""},{"id":"3.3.8","m":1,"o":["The strain energy stored due to P equals the strain energy stored due to Q","P and Q produce equal deflections at all points","The work done by P through the displacements due to Q equals the work done by Q through the displacements due to P","The reactions due to P equal those due to Q"],"q":"<p>Betti&#x27;s law states that, for two systems of loads P and Q on the same linearly elastic structure:<\/p>","a":2,"s":"<p>Betti&#x27;s (generalised reciprocal) law; Maxwell&#x27;s theorem is its special case with unit loads.<br>Other options: A, B, D — none of these is generally true for different load systems.<\/p>","tag":""},{"id":"3.3.9","m":1,"o":["Castigliano&#x27;s first theorem","The principle of virtual work","The moment-area theorems","Müller-Breslau principle"],"q":"<p>The unit load method for finding deflections is derived from:<\/p>","a":1,"s":"<p>A virtual unit load is applied; external virtual work 1 × Δ = internal virtual work Σ k (PL/AE) or ∫ m M dx/EI.<br>Other options: A — gives loads from displacements; C — geometric method from the elastic curve; D — used for influence lines.<\/p>","tag":""},{"id":"3.3.10","m":1,"o":["1.1 mm","0.5 mm","1.475 mm","0.1 mm"],"q":"<p>In a pin-jointed truss (AE = 2 × 10⁵ kN for all members) the forces due to the applied loads (P) and due to a unit vertical load at joint J (k) are: member 1: P = +50 kN, k = +0.5, L = 4 m; member 2: P = −40 kN, k = −1.0, L = 3 m; member 3: P = +30 kN, k = 0, L = 5 m. The vertical deflection of J is:<\/p>","a":0,"s":"<p>Δ = Σ PkL/AE = (50 × 0.5 × 4 + (−40)(−1.0)(3) + 0)/(2 × 10⁵) = (100 + 120)/2 × 10⁵ = 0.0011 m = 1.1 mm.<br>Other options: B — member 1 only; C — member 3 wrongly given k = 0.5; D — member 2 term taken as −120 (sign error), |100 − 120|/AE.<\/p>","tag":""},{"id":"3.3.11","m":1,"o":["1","2","3","6"],"q":"<p>A beam is fixed at both ends and may carry loads in any direction in its plane. Its degree of static indeterminacy is:<\/p>","a":2,"s":"<p>Reactions = 3 + 3 = 6; equilibrium equations = 3 → Ds = 3. (For vertical loads only, axial reactions are dropped and Ds = 2.)<br>Other options: A — propped cantilever; B — fixed beam under transverse loads only; D — total reactions, not redundants.<\/p>","tag":""},{"id":"3.3.12","m":1,"o":["1","2","4","3"],"q":"<p>A beam ABCD is fixed at A and rests on rollers at B, C and D (general planar loading). Its degree of static indeterminacy is:<\/p>","a":3,"s":"<p>r = 3 (fixed) + 1 + 1 + 1 = 6; Ds = r − 3 = 3.<br>Other options: A — counts only the fixed end as redundant; B — counts only intermediate rollers; C — r − 2.<\/p>","tag":""},{"id":"3.3.13","m":1,"o":["1","2","3","4"],"q":"<p>A single-bay, single-storey rigid portal frame has both column bases hinged. Its degree of static indeterminacy is:<\/p>","a":0,"s":"<p>Ds = 3m + r − 3j = 3 × 3 + 4 − 3 × 4 = 1.<br>Other options: B — one base fixed, one hinged; C — both bases fixed; D — counts all four reactions.<\/p>","tag":""},{"id":"3.3.14","m":1,"o":["3","6","9","5"],"q":"<p>A two-bay, single-storey rigid portal frame has all three column bases fixed. Its degree of static indeterminacy is:<\/p>","a":1,"s":"<p>Members m = 5 (3 columns + 2 beams), joints j = 6, reactions r = 9. Ds = 3m + r − 3j = 15 + 9 − 18 = 6 (or: 2 closed loops × 3).<br>Other options: A — single-bay value; C — total reactions; D — off by one.<\/p>","tag":""},{"id":"3.3.15","m":1,"o":["0","1","2","4"],"q":"<p>A plane pin-jointed truss has 10 members, 6 joints and 4 external reaction components. Its total degree of static indeterminacy is:<\/p>","a":2,"s":"<p>Ds = m + r − 2j = 10 + 4 − 12 = 2.<br>Other options: A — would need m + r = 2j; B — counts only the external redundant (r − 3 = 1); D — m − j.<\/p>","tag":""},{"id":"3.3.16","m":1,"o":["Statically determinate and stable","Statically indeterminate","Redundant internally","Unstable (a mechanism)"],"q":"<p>For a pin-jointed plane truss, the condition m + r &lt; 2j (m members, r reactions, j joints) indicates that the truss is:<\/p>","a":3,"s":"<p>Fewer unknowns than equilibrium equations → cannot be in equilibrium under general loading → unstable.<br>Other options: A — needs m + r = 2j (and proper arrangement); B, C — need m + r &gt; 2j.<\/p>","tag":""},{"id":"3.3.17","m":1,"o":["1","2","3","0"],"q":"<p>A propped cantilever (fixed at A, roller at B) is analysed neglecting axial deformations. Its degree of kinematic indeterminacy is:<\/p>","a":0,"s":"<p>Only the rotation at B is unknown (A is fully fixed; vertical movement at B is prevented; axial movement neglected).<br>Other options: B — includes the horizontal displacement at B (axial deformation considered); C — counts a full free joint; D — fixed–fixed beam.<\/p>","tag":""},{"id":"3.3.18","m":1,"o":["1","2","3","4"],"q":"<p>A simply supported beam (hinge at one end, roller at the other) is analysed neglecting axial deformation. Its degree of kinematic indeterminacy is:<\/p>","a":1,"s":"<p>Unknown displacements: rotation at each end → Dk = 2. (Including axial deformation, the roller&#x27;s horizontal movement adds one: 3.)<br>Other options: A — one rotation only; C — includes axial displacement; D — no basis.<\/p>","tag":""},{"id":"3.3.19","m":1,"o":["2","6","3","4"],"q":"<p>A single-bay portal frame has both column bases fixed. Neglecting axial deformation of members, its degree of kinematic indeterminacy is:<\/p>","a":2,"s":"<p>Two joint rotations at the top corners + one common sway displacement = 3. (Including axial deformation: 2 joints × 3 = 6.)<br>Other options: A — rotations only, sway missed; B — axial deformations included; D — counts two separate sways.<\/p>","tag":""},{"id":"3.3.20","m":1,"o":["12","3","6","9"],"q":"<p>A plane pin-jointed truss has 6 joints and is supported by one hinge and one roller. Its degree of kinematic indeterminacy is:<\/p>","a":3,"s":"<p>Each truss joint has 2 translations: Dk = 2j − r = 12 − 3 = 9.<br>Other options: A — ignores support restraints; B — the number of reactions; C — j only.<\/p>","tag":""},{"id":"3.3.21","m":1,"o":["6m + r − 6j","3m + r − 3j","m + r − 3j","6m − r − 6j"],"q":"<p>For a rigid-jointed space frame, the degree of static indeterminacy is (m members, r reactions, j joints):<\/p>","a":0,"s":"<p>Each space member has 6 unknown end actions, each joint 6 equilibrium equations: Ds = 6m + r − 6j.<br>Other options: B — plane rigid frame; C — space truss; D — sign of r wrong.<\/p>","tag":""},{"id":"3.3.22","m":1,"o":["50 kN","30 kN","40 kN","20 kN"],"q":"<p>A propped cantilever of span 5 m carries a UDL of 16 kN/m over the whole span. The reaction at the prop is:<\/p>","a":1,"s":"<p>R = 3wL/8 = 3 × 16 × 5/8 = 30 kN (fixed-end reaction 5wL/8 = 50 kN).<br>Other options: A — fixed-end reaction 5wL/8; C — wL/2 (simply supported); D — wL/4.<\/p>","tag":""},{"id":"3.3.23","m":1,"o":["33.3 kN·m","100 kN·m","50 kN·m","28.1 kN·m"],"q":"<p>A propped cantilever of span 5 m carries a UDL of 16 kN/m over the whole span. The fixing moment at the fixed end is:<\/p>","a":2,"s":"<p>MA = wL²/8 = 16 × 25/8 = 50 kN·m (hogging). Maximum sagging moment = 9wL²/128 = 28.1 kN·m.<br>Other options: A — wL²/12 (fixed-beam end moment); B — wL²/4; D — this is the maximum sagging moment.<\/p>","tag":""},{"id":"3.3.24","m":1,"o":["24 kN","33 kN","18 kN","15 kN"],"q":"<p>A propped cantilever carries a central point load of 48 kN. The reaction at the prop is:<\/p>","a":3,"s":"<p>R = 5W/16 = 5 × 48/16 = 15 kN (fixed end carries 11W/16 = 33 kN).<br>Other options: A — W/2 (simply supported); B — fixed-end reaction 11W/16; C — 3W/8 (UDL coefficient misapplied).<\/p>","tag":""},{"id":"3.3.25","m":1,"o":["36 kN·m sagging","72 kN·m sagging","108 kN·m sagging","72 kN·m hogging"],"q":"<p>A fixed beam of span 6 m carries a UDL of 24 kN/m over the whole span. The bending moment at mid-span is:<\/p>","a":0,"s":"<p>Free BM wL²/8 = 108; end moments wL²/12 = 72 (hogging). Mid-span = 108 − 72 = 36 kN·m = wL²/24.<br>Other options: B — end moment value with wrong sense; C — free (simply supported) moment; D — this is the end moment.<\/p>","tag":""},{"id":"3.3.26","m":1,"o":["One-half","One-fourth","One-fifth","One-eighth"],"q":"<p>The central deflection of a fixed beam with a central point load, compared with that of a simply supported beam of the same span and section with the same load, is:<\/p>","a":1,"s":"<p>Fixed: WL³/192EI; simply supported: WL³/48EI → ratio 48/192 = 1/4. (For UDL the ratio is 1/5.)<br>Other options: A — moment ratio, not deflection; C — the UDL case; D — no basis.<\/p>","tag":""},{"id":"3.3.27","m":1,"o":["40 kN·m","120 kN·m","80 kN·m","67.5 kN·m"],"q":"<p>A fixed beam AB of span 6 m carries a point load of 90 kN at 2 m from A. The fixed-end moment at A is:<\/p>","a":2,"s":"<p>MA = Wab²/L² = 90 × 2 × 4²/36 = 80 kN·m; MB = Wa²b/L² = 40 kN·m.<br>Other options: A — this is MB; B — Wab/L (free BM under the load); D — WL/8 (central-load formula).<\/p>","tag":""},{"id":"3.3.28","m":1,"o":["Displacement method using joint rotations as unknowns","Graphical method for influence lines","Method valid only for statically determinate structures","Force (flexibility) method using redundant forces as unknowns"],"q":"<p>The method of consistent deformations is a:<\/p>","a":3,"s":"<p>Redundants are removed to get a determinate primary structure; compatibility conditions (deflections at redundants) give equations for the redundant forces.<br>Other options: A — describes slope-deflection; B — that is Müller-Breslau; C — it is used precisely for indeterminate structures.<\/p>","tag":""},{"id":"3.3.29","m":1,"o":["Three-moment theorem (Clapeyron)","Slope-deflection method","Moment distribution method","Kani&#x27;s method"],"q":"<p>Which of the following is a force (flexibility) method of analysis of indeterminate structures?<\/p>","a":0,"s":"<p>In the three-moment equation the unknowns are support moments (forces), found from slope compatibility.<br>Other options: B, C, D — displacement (stiffness) methods; joint rotations/displacements are the basic unknowns.<\/p>","tag":""},{"id":"3.3.30","m":1,"o":["∂U/∂R = R","U = 0","∂U/∂R = 0","∂²U/∂R² = 0"],"q":"<p>For a statically indeterminate structure, the redundant reaction R can be found from Castigliano&#x27;s theorem (theorem of least work) using the condition:<\/p>","a":2,"s":"<p>The point of a redundant support does not move, so ∂U/∂R = 0 (least work).<br>Other options: A — dimensionally wrong; B — strain energy is never zero under load; D — second derivative is positive (minimum).<\/p>","tag":""}]},{"k":"3.4","t":"Slope-Deflection and Moment Distribution","qs":[{"id":"3.4.1","m":1,"o":["MFAB + (EI/L)(2θA + θB − 3Δ/L)","MFAB + (2EI/L)(θA + 2θB − 3Δ/L)","MFAB + (2EI/L)(2θA + θB − 3Δ/L)","MFAB + (4EI/L)(θA + θB − Δ/L)"],"q":"<p>In the slope-deflection method (clockwise moments and rotations positive, Δ = relative transverse displacement of end B with respect to A, positive when the chord rotates clockwise), the end moment MAB of a member AB of length L is:<\/p>","a":2,"s":"<p>Standard equation: MAB = MFAB + (2EI/L)(2θA + θB − 3ψ), ψ = Δ/L.<br>Other options: A — coefficient should be 2EI/L; B — near-end rotation must carry the factor 2; D — wrong grouping of terms.<\/p>","tag":""},{"id":"3.4.2","m":1,"o":["40 kN·m","60 kN·m","20 kN·m","30 kN·m"],"q":"<p>A beam of 4 m span, fixed at both ends, carries a UDL of 30 kN/m. The fixed-end moment at each end is:<\/p>","a":0,"s":"<p>MF = wL²/12 = 30 × 16/12 = 40 kN·m.<br>Other options: B — wL²/8 (propped/simply supported value); C — wL²/24 (mid-span moment of the fixed beam); D — wL²/16.<\/p>","tag":""},{"id":"3.4.3","m":1,"o":["120 kN·m","30 kN·m","40 kN·m","60 kN·m"],"q":"<p>A beam of 6 m span, fixed at both ends, carries a central point load of 80 kN. The fixed-end moment is:<\/p>","a":3,"s":"<p>MF = WL/8 = 80 × 6/8 = 60 kN·m.<br>Other options: A — WL/4 (free BM); B — WL/16; C — WL/12 (UDL coefficient misapplied).<\/p>","tag":""},{"id":"3.4.4","m":1,"o":["4EI/L","3EI/L","2EI/L","6EI/L"],"q":"<p>The rotational (absolute) stiffness of a prismatic member at its near end, when the far end is hinged, is:<\/p>","a":1,"s":"<p>Rotating the near end by unit angle with the far end free to rotate requires M = 3EI/L. With far end fixed it is 4EI/L.<br>Other options: A — far end fixed; C — carry-over moment for far end fixed (4EI/L × ½); D — antisymmetric (central span) modified stiffness.<\/p>","tag":""},{"id":"3.4.5","m":1,"o":["0","1","1/2","3/4"],"q":"<p>The carry-over factor for a prismatic member whose far end is fixed is:<\/p>","a":2,"s":"<p>A moment M at the near end induces M/2 of the same sense at the fixed far end. For a hinged far end the carry-over factor is 0.<br>Other options: A — far end hinged; B — no such case; D — ratio of stiffnesses 3EI/L : 4EI/L.<\/p>","tag":""},{"id":"3.4.6","m":1,"o":["0.667 and 0.333","0.6 and 0.4","0.5 and 0.5","0.333 and 0.667"],"q":"<p>At joint B of a continuous beam, member BA is 4 m long with its far end A fixed, and member BC is 6 m long with its far end C hinged. Both have the same EI. The distribution factors at B for BA and BC are:<\/p>","a":0,"s":"<p>kBA = 4EI/4 = EI; kBC = 3EI/6 = 0.5EI; ΣK = 1.5EI. DFBA = 1/1.5 = 0.667; DFBC = 0.333.<br>Other options: B — used I/L for both (0.25 : 0.167 = 0.6 : 0.4), ignoring the hinged far end; C — assumed equal; D — swapped.<\/p>","tag":""},{"id":"3.4.7","m":1,"o":["Zero","0.5","Equal to the number of members","One"],"q":"<p>The sum of the distribution factors of all members meeting at a rigid joint is:<\/p>","a":3,"s":"<p>DFi = ki/Σk, so ΣDF = 1: the whole unbalanced moment is shared among the members.<br>Other options: A — that is the sum of balanced moments at a joint; B — carry-over factor; C — no basis.<\/p>","tag":""},{"id":"3.4.8","m":1,"o":["1 and 0","0 and 1","0.5 and 0.5","1 and 1"],"q":"<p>In moment distribution, the distribution factor of a member at a fixed support and at a simple end support (hinge/roller, the only member there) is respectively:<\/p>","a":1,"s":"<p>A fixed support has infinite stiffness, so the member takes none of the balancing moment (DF = 0); at a free hinged end the single member must take all of it (DF = 1).<br>Other options: A — reversed; C — carry-over value; D — no basis.<\/p>","tag":""},{"id":"3.4.9","m":1,"o":["60 kN·m","45 kN·m","90 kN·m","120 kN·m"],"q":"<p>A two-span continuous beam ABC, simply supported at A, B and C, has equal spans of 6 m and constant EI, and carries a UDL of 20 kN/m on both spans. The support moment at B is:<\/p>","a":2,"s":"<p>For two equal spans under full UDL, MB = wL²/8 = 20 × 36/8 = 90 kN·m (hogging). Check by moment distribution: modified FEM wL²/8 from each side, balanced by symmetry.<br>Other options: A — wL²/12 (fixed-end moment); B — wL²/16; D — wL²/6.<\/p>","tag":""},{"id":"3.4.10","m":1,"o":["13.7 kN·m","24.0 kN·m","16.0 kN·m","6.9 kN·m"],"q":"<p>A continuous beam ABC is fixed at A and simply supported on rollers at B and C. AB = BC = 4 m, EI is constant, and a UDL of 12 kN/m acts on BC only. The support moment at B is about:<\/p>","a":0,"s":"<p>Modified FEM in BC (C hinged) = wL²/8 = 24. kBA = 4EI/4 = EI, kBC = 3EI/4 → DFBA = 0.571, DFBC = 0.429. Balancing 24 × 0.571 = 13.7 to BA; MB = 24 − 10.3 = 13.7 kN·m. (Carry-over to A = 6.9 kN·m.)<br>Other options: B — unbalanced modified FEM, no distribution; C — wL²/12 (fixed-end value); D — this is the moment at A.<\/p>","tag":""},{"id":"3.4.11","m":1,"o":["Compatibility of rotations at each joint","Moment equilibrium at each joint","Equal carry-over at fixed ends","Horizontal force (shear) equilibrium of the storey"],"q":"<p>In the slope-deflection or moment distribution analysis of a frame that sways, the additional equation required for each independent sway is obtained from:<\/p>","a":3,"s":"<p>The sum of column shears in a storey must equal the applied horizontal storey force — one shear equation per sway degree of freedom.<br>Other options: A — compatibility is built into the method; B — gives the joint equations, not the sway equation; C — not an equilibrium condition.<\/p>","tag":""},{"id":"3.4.12","m":1,"o":["60 kN·m","120 kN·m","240 kN·m","24 kN·m"],"q":"<p>A beam of span 5 m, fixed at both ends (EI = 5 × 10⁴ kN·m²), has one support that settles by 10 mm relative to the other. The fixed-end moment induced at each end is:<\/p>","a":1,"s":"<p>M = 6EIΔ/L² = 6 × 5 × 10⁴ × 0.010/25 = 120 kN·m (both ends, same sense).<br>Other options: A — 3EIΔ/L² (far end hinged); C — 12EIΔ/L² (that is a shear × L term); D — 6EIΔ/L³ (an extra L).<\/p>","tag":""},{"id":"3.4.13","m":1,"o":["6EIΔ/L²","12EIΔ/L³","3EIΔ/L²","4EIΔ/L²"],"q":"<p>For a member with one end fixed and the other end hinged, a relative transverse settlement Δ between the ends induces at the fixed end a moment of:<\/p>","a":2,"s":"<p>With the far end free to rotate, MF = 3EIΔ/L².<br>Other options: A — both ends fixed; B — the end shear (force) in a fixed–fixed member; D — no such standard term.<\/p>","tag":""},{"id":"3.4.14","m":1,"o":["40 kN·m","80 kN·m","20 kN·m","60 kN·m"],"q":"<p>The near end of a prismatic beam (far end fixed) is rotated through 0.002 rad without translation. EI = 6 × 10⁴ kN·m² and L = 6 m. The moment developed at the far end is:<\/p>","a":0,"s":"<p>Near-end moment = (4EI/L)θ = 4 × 6 × 10⁴/6 × 0.002 = 80 kN·m; far-end moment = ½ × 80 = 40 kN·m (same sense).<br>Other options: B — this is the near-end moment; C — used 2EI/L then halved; D — used 3EI/L.<\/p>","tag":""},{"id":"3.4.15","m":1,"o":["Force method with redundant moments as unknowns","Graphical method","Energy method based on least work","Displacement (stiffness) method"],"q":"<p>The slope-deflection method is classified as a:<\/p>","a":3,"s":"<p>End moments are written in terms of joint rotations and sway; joint equilibrium gives equations in those displacements.<br>Other options: A — three-moment/consistent deformation; B — not graphical; C — Castigliano/least work.<\/p>","tag":""},{"id":"3.4.16","m":1,"o":["1","3","2","4"],"q":"<p>A two-span continuous beam ABC is supported on a hinge at A and rollers at B and C (all simple supports). Neglecting axial deformation, the number of unknown joint displacements in a slope-deflection analysis is:<\/p>","a":1,"s":"<p>Rotations θA, θB, θC are all unknown (no translations). (Using modified stiffness for end spans reduces the work but the kinematic unknowns are 3.)<br>Other options: A — only the interior joint, as if A and C were fixed; C — misses one end; D — counts a sway that does not exist.<\/p>","tag":""},{"id":"3.4.17","m":1,"o":["30.0 kN·m","15.0 kN·m","37.5 kN·m","45.0 kN·m"],"q":"<p>A two-span beam ABC is fixed at A and C and rests on a roller at B. AB = BC = 6 m, EI constant. A UDL of 10 kN/m acts on AB only. The fixed-end moment at A after analysis is:<\/p>","a":2,"s":"<p>FEM AB = 30. MBA = 30 + (2EI/6)(2θB), MBC = (2EI/6)(2θB); ΣMB = 0 → EIθB = −22.5. MAB = −30 + (2EI/6)θB = −30 − 7.5 = −37.5 → 37.5 kN·m.<br>Other options: A — FEM only (no rotation of B); B — this is the moment at B; D — added 15 kN·m instead of 7.5.<\/p>","tag":""},{"id":"3.4.18","m":1,"o":["Sway is absent, so no sway correction is needed","Sway must always be included","The beam moments are zero","The columns carry no moment"],"q":"<p>A portal frame symmetrical in geometry and support conditions carries a symmetrical vertical load. In its analysis:<\/p>","a":0,"s":"<p>With symmetry of frame and loading, the horizontal displacement of the beam is zero.<br>Other options: B — sway arises only with unsymmetric geometry/loading or lateral load; C, D — rigid joints transfer moments to columns and beam.<\/p>","tag":""},{"id":"3.4.19","m":1,"o":["A horizontal load acts at beam level","The frame and its vertical loading are both symmetrical","The columns have different heights","The vertical load on the beam is unsymmetrical"],"q":"<p>Sway in a single-bay portal frame does NOT occur when:<\/p>","a":1,"s":"<p>Only full symmetry (or a horizontal restraint at beam level) prevents sway.<br>Other options: A, C, D — each of these causes sway.<\/p>","tag":""},{"id":"3.4.20","m":1,"o":["−1.5","+1","−0.5","0"],"q":"<p>In Kani&#x27;s method, the sum of the rotation factors of all members meeting at a joint is:<\/p>","a":2,"s":"<p>Rotation factor uij = −½ × kij/Σk, so Σu = −½.<br>Other options: A — sum of displacement factors for the columns of a storey; B — sum of distribution factors; D — no basis.<\/p>","tag":""},{"id":"3.4.21","m":1,"o":["−0.5","+1.5","−1","−1.5"],"q":"<p>In Kani&#x27;s method for a sway frame with equal-height columns in a storey, the sum of the displacement factors of the columns of that storey is:<\/p>","a":3,"s":"<p>Displacement factor = −(3/2) × kc/Σkc, summing to −1.5.<br>Other options: A — sum of rotation factors at a joint; B — sign wrong; C — no basis.<\/p>","tag":""},{"id":"3.4.22","m":1,"o":["Errors in any cycle are automatically corrected in later iterations","It gives exact results in a single cycle without iteration","It does not require fixed-end moments to start the analysis","It is a force method"],"q":"<p>An important practical advantage of Kani&#x27;s method is that:<\/p>","a":0,"s":"<p>Kani&#x27;s iteration always uses the latest rotation contributions with the original FEMs, so a mistake in one cycle is eliminated by convergence.<br>Other options: B — it is iterative; C — FEMs are the starting values; D — it is a displacement method.<\/p>","tag":""},{"id":"3.4.23","m":1,"o":["Gaspar Kani","Hardy Cross","Clapeyron","Müller-Breslau"],"q":"<p>The moment distribution method was developed by:<\/p>","a":1,"s":"<p>Hardy Cross introduced moment distribution in 1930.<br>Other options: A — Kani&#x27;s rotation-contribution method; C — three-moment theorem; D — influence line principle.<\/p>","tag":""},{"id":"3.4.24","m":1,"o":["4EI/L","3EI/L","6EI/L","2EI/L"],"q":"<p>For a symmetric continuous beam or frame under symmetric loading, the modified stiffness of the central member (the one cut by the axis of symmetry) used at its end is:<\/p>","a":3,"s":"<p>Symmetric loading: θ at the far end = −θ at the near end → M = (2EI/L)(2θ − θ) = 2EI/L × θ.<br>Other options: A — far end fixed; B — far end hinged; C — antisymmetric loading (far end rotation equal and same sense).<\/p>","tag":""},{"id":"3.4.25","m":1,"o":["36 kN·m","90 kN·m","54 kN·m","45 kN·m"],"q":"<p>A beam AB of span 6 m, fixed at both ends, carries a triangular load varying from zero at A to 30 kN/m at B. The fixed-end moment at B is:<\/p>","a":2,"s":"<p>MFB = wL²/20 = 30 × 36/20 = 54 kN·m (larger end); MFA = wL²/30 = 36 kN·m.<br>Other options: A — the moment at the zero end A; B — wL²/12 (full UDL); D — wL²/24.<\/p>","tag":""},{"id":"3.4.26","m":1,"o":["40 kN·m","80 kN·m","160 kN·m","20 kN·m"],"q":"<p>A single-bay portal frame with fixed bases has two identical columns 4 m high and a beam that may be taken as infinitely rigid. A horizontal load of 40 kN acts at beam level. The moment at the base of each column is:<\/p>","a":0,"s":"<p>Each column shears H/2 = 20 kN. With both ends fixed against rotation, the point of contraflexure is at mid-height: M = 20 × 4/2 = 40 kN·m at top and base.<br>Other options: B — 20 kN × 4 m (assumed pinned at the top); C — full H × h; D — H × h/8.<\/p>","tag":""},{"id":"3.4.27","m":1,"o":["60 kN","80 kN","45 kN","72 kN"],"q":"<p>A portal frame with a rigid beam has two fixed-base columns of the same EI with heights 3 m and 6 m. A horizontal load of 90 kN acts at beam level. The shear carried by the shorter column is:<\/p>","a":1,"s":"<p>Lateral stiffness 12EI/h³ ∝ 1/h³: 1/27 : 1/216 = 8 : 1. Short column takes 90 × 8/9 = 80 kN.<br>Other options: A — stiffness taken ∝ 1/h (2 : 1); C — equal sharing; D — stiffness taken ∝ 1/h² (4 : 1).<\/p>","tag":""},{"id":"3.4.28","m":1,"o":["1","0.5","Equal to that of the adjoining span","Zero"],"q":"<p>In moment distribution, the distribution factor assigned to a cantilever overhang at a joint is:<\/p>","a":3,"s":"<p>A cantilever has no rotational restraint at its free end, so its stiffness is zero and it takes no balancing moment (its end moment is statically known).<br>Other options: A — would mean the overhang takes all the unbalance; B, C — no basis.<\/p>","tag":""},{"id":"3.4.29","m":1,"o":["−12 kN·m","−9 kN·m","−6 kN·m","−15 kN·m"],"q":"<p>At joint B, members BA and BC (far ends A and C fixed) have distribution factors 0.6 and 0.4. The unbalanced moment at B is +30 kN·m. After balancing, the moment carried over to end C is:<\/p>","a":2,"s":"<p>Balancing moment −30 is distributed: BA −18, BC −12. Carry-over (½) to C = −6 kN·m.<br>Other options: A — distributed moment in BC, not carried over; B — carry-over to A; D — half the full unbalance.<\/p>","tag":""},{"id":"3.4.30","m":1,"o":["32 000 kN·m/rad","24 000 kN·m/rad","16 000 kN·m/rad","8000 kN·m/rad"],"q":"<p>A member AB has E = 200 GPa, I = 2 × 10⁸ mm⁴, L = 5 m and its far end fixed. Its rotational stiffness at the near end is:<\/p>","a":0,"s":"<p>EI = 200 kN/mm² × 2 × 10⁸ mm⁴ = 4 × 10¹⁰ kN·mm² = 4 × 10⁴ kN·m². k = 4EI/L = 4 × 4 × 10⁴/5 = 32 000 kN·m/rad.<br>Other options: B — 3EI/L (far end hinged); C — 2EI/L; D — EI/L.<\/p>","tag":""}]},{"k":"3.5","t":"Influence Lines, Trusses and Arches","qs":[{"id":"3.5.1","m":1,"o":["The bending moment diagram due to a unit load at the section","The deflected shape obtained by removing the restraint for that function and applying a unit displacement in its direction","The shear force diagram for a unit load at mid-span","Always a straight line for any structure"],"q":"<p>Müller-Breslau principle states that the influence line for a force function (reaction, shear or moment) of a structure is:<\/p>","a":1,"s":"<p>Release the restraint corresponding to the function, impose unit displacement (or rotation); the deflected shape, to scale, is the ILD. Valid for determinate and indeterminate structures.<br>Other options: A, C — these are force diagrams for a fixed load position, not influence lines; D — only determinate structures have straight-line ILDs.<\/p>","tag":""},{"id":"3.5.2","m":1,"o":["A parabola with maximum ordinate 1 at mid-span","A triangle with ordinate L/4 at mid-span","A rectangle of ordinate 1","A straight line with ordinate 1 at A and 0 at B"],"q":"<p>For a simply supported beam AB of span L, the influence line for the reaction at A is:<\/p>","a":3,"s":"<p>RA = (L − x)/L for a unit load at x from A — linear from 1 to 0.<br>Other options: A — ILDs of determinate beams are straight lines; B — that is the ILD for moment at mid-span; C — reaction falls as the load moves away.<\/p>","tag":""},{"id":"3.5.3","m":1,"o":["−0.4 and +0.6","−0.6 and +0.4","+0.4 and −0.6","−0.5 and +0.5"],"q":"<p>For a simply supported beam of 10 m span, the influence line for shear at a section 4 m from the left support has ordinates just to the left and just to the right of the section equal to:<\/p>","a":0,"s":"<p>ILD of shear: −a/L just left (= −0.4) and +b/L just right (= +0.6), parallel lines with a unit jump.<br>Other options: B — a and b interchanged; C — sign convention reversed; D — mid-span section only.<\/p>","tag":""},{"id":"3.5.4","m":1,"o":["0.24 m","2.5 m","2.4 m","4.0 m"],"q":"<p>For a simply supported beam of 10 m span, the maximum ordinate of the influence line for bending moment at a section 4 m from the left support is:<\/p>","a":2,"s":"<p>Maximum ordinate (under the section) = ab/L = 4 × 6/10 = 2.4 m.<br>Other options: A — divided by L twice; B — L/4 (mid-span section only); D — a, distance to section.<\/p>","tag":""},{"id":"3.5.5","m":1,"o":["250 kN·m","240 kN·m","480 kN·m","120 kN·m"],"q":"<p>A UDL of 20 kN/m, longer than the span, rolls over a simply supported beam of 10 m span. The maximum bending moment at a section 4 m from the left support is:<\/p>","a":1,"s":"<p>M = w × area of ILD = 20 × ½ × 10 × 2.4 = 240 kN·m (= wab/2).<br>Other options: A — wL²/8 (mid-span maximum, not at this section); C — w × L × 2.4 (forgot the ½); D — took the area under half the base.<\/p>","tag":""},{"id":"3.5.6","m":1,"o":["The load covers the section from one end","The centre of the load lies exactly at mid-span of the beam","The load&#x27;s head is at the section","The section divides the load in the same ratio as it divides the span"],"q":"<p>For a UDL shorter than the span moving over a simply supported beam, the bending moment at a given section is maximum when:<\/p>","a":3,"s":"<p>Moving the load slightly must not change M, which requires equal ILD ordinates at both ends of the load → load divided in the ratio a : b.<br>Other options: A, C — not optimal in general; B — gives the maximum at mid-span only for a mid-span section.<\/p>","tag":""},{"id":"3.5.7","m":1,"o":["WL/4, at mid-span","WL/8, at mid-span","WL/4, at the quarter point","WL/2, at mid-span"],"q":"<p>A single concentrated load W moves across a simply supported beam of span L. The absolute maximum bending moment in the beam is:<\/p>","a":0,"s":"<p>M under the load at x = Wx(L − x)/L, maximum at x = L/2: WL/4.<br>Other options: B — UDL coefficient; C — at L/4 the value is 3WL/16; D — cantilever-type value.<\/p>","tag":""},{"id":"3.5.8","m":1,"o":["That load is placed exactly at mid-span of the beam","The resultant of the loads is at mid-span","Mid-span lies midway between that load and the resultant of all loads on the span","The heaviest load is at a support"],"q":"<p>For a train of concentrated loads moving on a simply supported beam, the absolute maximum bending moment occurs under a load when:<\/p>","a":2,"s":"<p>Standard criterion: place the load and the resultant symmetrically about the centre line; the maximum occurs under that load (usually the one nearest the resultant).<br>Other options: A — gives the maximum at mid-span, not the absolute maximum; B — then the moment under a load is usually less; D — gives maximum shear/reaction.<\/p>","tag":""},{"id":"3.5.9","m":1,"o":["375.0 kN·m","378.1 kN·m","450.0 kN·m","312.5 kN·m"],"q":"<p>Two point loads of 100 kN and 50 kN, 3 m apart, cross a simply supported beam of 12 m span. The absolute maximum bending moment is about:<\/p>","a":1,"s":"<p>Resultant 150 kN is 1 m from the 100 kN load. Put mid-span midway between them: 100 kN at 5.5 m from A, resultant at 6.5 m. RA = 150 × 5.5/12 = 68.75 kN. M = 68.75 × 5.5 = 378.1 kN·m (under 100 kN).<br>Other options: A — 100 kN load placed at mid-span; C — both loads together at mid-span (150 × 12/4); D — maximum under the 50 kN load with the same criterion.<\/p>","tag":""},{"id":"3.5.10","m":1,"o":["16 kN","100 kN","60 kN","36 kN"],"q":"<p>A UDL of 20 kN/m, longer than the span, moves over a simply supported beam of 10 m span. The maximum positive shear force at a section 4 m from the left support is:<\/p>","a":3,"s":"<p>Positive ILD region: right of the section, triangle with base 6 m and height 0.6. Max +V = 20 × ½ × 6 × 0.6 = 36 kN (load covers 6 m on the right only).<br>Other options: A — this is the maximum negative shear (left 4 m); B — wL/2, reaction under full load; C — w × 6 × 0.5 wrong ordinate.<\/p>","tag":""},{"id":"3.5.11","m":1,"o":["Curved lines","Straight lines","Rectangles","Always symmetrical"],"q":"<p>Influence lines for reactions and internal forces of statically indeterminate structures are generally:<\/p>","a":0,"s":"<p>The released structure of an indeterminate system deforms elastically (curved shape), so ILDs are curves; determinate ones are straight (rigid-body mechanism).<br>Other options: B — determinate structures; C — no basis; D — depends on geometry and position.<\/p>","tag":""},{"id":"3.5.12","m":1,"o":["One","Two","Three","Four"],"q":"<p>In the method of joints for a plane truss, at any joint chosen for analysis the number of unknown member forces should not exceed:<\/p>","a":1,"s":"<p>Only two equilibrium equations (ΣFx = 0, ΣFy = 0) are available for a concurrent force system at a joint.<br>Other options: A — unnecessarily restrictive; C — the limit for the method of sections; D — not solvable.<\/p>","tag":""},{"id":"3.5.13","m":1,"o":["One member with unknown force","Two members with unknown forces","Three members with unknown forces","Five members with unknown forces"],"q":"<p>In the method of sections for a plane truss, the section should in general cut not more than:<\/p>","a":2,"s":"<p>A free body of part of the truss has three equilibrium equations (ΣFx, ΣFy, ΣM).<br>Other options: A, B — possible but not the limit; D — would leave extra unknowns.<\/p>","tag":""},{"id":"3.5.14","m":1,"o":["Both members carry equal tension","One member carries the full force of the other","The forces are equal and opposite","Both members are zero-force members"],"q":"<p>In a plane truss, at an unloaded joint where only two non-collinear members meet:<\/p>","a":3,"s":"<p>Resolving perpendicular to one member shows the other must have zero force, and then the first is also zero.<br>Other options: A, B, C — any non-zero force would leave an unbalanced component.<\/p>","tag":""},{"id":"3.5.15","m":1,"o":["The third (non-collinear) member is a zero-force member and the collinear ones carry equal forces","All three are zero-force members because the joint is unloaded","The two collinear members are zero-force members and the third carries the force","The third member carries the sum of the forces in the other two"],"q":"<p>At an unloaded joint of a plane truss, three members meet; two of them are collinear. Then:<\/p>","a":0,"s":"<p>Resolve perpendicular to the collinear pair: the third member&#x27;s force must be zero; the collinear forces are equal.<br>Other options: B — collinear members may carry force; C — reversed; D — violates joint equilibrium.<\/p>","tag":""},{"id":"3.5.16","m":1,"o":["37.5 kN tension","30 kN tension","22.5 kN tension","22.5 kN compression"],"q":"<p>A symmetrical triangular truss has a span of 6 m and its apex 4 m above the mid-point of the horizontal bottom tie. A vertical load of 60 kN acts at the apex (supports simple at the ends of the tie). The force in the tie is:<\/p>","a":2,"s":"<p>Each support reaction 30 kN. Rafter slope: tan θ = 4/3, sin θ = 0.8, cos θ = 0.6. Rafter force = 30/0.8 = 37.5 kN (compression); tie = 37.5 × 0.6 = 22.5 kN (tension).<br>Other options: A — rafter force; B — the support reaction; D — the tie is in tension (it holds the rafter feet together).<\/p>","tag":""},{"id":"3.5.17","m":1,"o":["80 kN compression","90 kN compression","90 kN tension","150 kN compression"],"q":"<p>A parallel-chord truss of span 18 m and depth 3 m has six panels of 3 m. A load of 20 kN acts at each of the five interior bottom panel points. Using the method of sections, the force in the top chord member whose moment centre is the bottom joint at mid-span is:<\/p>","a":1,"s":"<p>RA = 50 kN. Moment about the mid-span bottom joint (x = 9 m): M = 50 × 9 − 20 × (6 + 3) = 270 kN·m. Top chord force = M/h = 270/3 = 90 kN (compression, sagging moment).<br>Other options: A — moment about x = 6 m instead; C — top chord is compressed under sagging; D — RA × 9/3 without the loads on the left.<\/p>","tag":""},{"id":"3.5.18","m":1,"o":["wL²/8","Maximum at the quarter points","Maximum at the crown","Zero"],"q":"<p>A three-hinged parabolic arch carries a uniformly distributed load over the whole span. The bending moment at any section of the arch is:<\/p>","a":3,"s":"<p>For UDL on the full span, the funicular (thrust line) is a parabola, which coincides with the arch axis: Mbeam − H y = 0 everywhere.<br>Other options: A — beam moment at mid-span; B, C — the arch carries the load in pure compression.<\/p>","tag":""},{"id":"3.5.19","m":1,"o":["375 kN","750 kN","300 kN","187.5 kN"],"q":"<p>A three-hinged parabolic arch of span 30 m and rise 6 m carries a UDL of 20 kN/m over the whole span. The horizontal thrust at each support is:<\/p>","a":0,"s":"<p>H = wL²/8h = 20 × 900/(8 × 6) = 375 kN.<br>Other options: B — wL²/4h; C — the vertical reaction wL/2; D — wL²/16h.<\/p>","tag":""},{"id":"3.5.20","m":1,"o":["50 kN","200 kN","100 kN","400 kN"],"q":"<p>A three-hinged arch of span 20 m and rise 5 m carries a point load of 100 kN at the crown. The horizontal thrust is:<\/p>","a":2,"s":"<p>H = WL/4h = 100 × 20/(4 × 5) = 100 kN (moment of left half about the crown: 50 × 10 = H × 5).<br>Other options: A — vertical reaction W/2; B — WL/2h; D — WL/h.<\/p>","tag":""},{"id":"3.5.21","m":1,"o":["250 kN·m sagging","Zero","375 kN·m hogging","125 kN·m hogging"],"q":"<p>A three-hinged parabolic arch of span 20 m and rise 4 m carries a point load of 100 kN at the crown. The bending moment at the left quarter-span point (5 m from the left support) is:<\/p>","a":3,"s":"<p>H = WL/4h = 125 kN. y at x = 5 m: y = 4hx(L − x)/L² = 16 × 5 × 15/400 = 3 m. M = Mbeam − Hy = 50 × 5 − 125 × 3 = −125 kN·m (hogging).<br>Other options: A — beam moment only; B — true only for a UDL on a parabolic arch; C — the H × y term alone.<\/p>","tag":""},{"id":"3.5.22","m":1,"o":["62 kN","98 kN","36 kN","104.4 kN"],"q":"<p>At a section of a three-hinged arch the horizontal thrust is H = 100 kN, the beam shear is V = 30 kN, and the tangent to the arch makes angle θ with the horizontal, where tan θ = 0.75. The normal thrust at the section is:<\/p>","a":1,"s":"<p>sin θ = 0.6, cos θ = 0.8. N = H cos θ + V sin θ = 80 + 18 = 98 kN. (Radial shear Q = V cos θ − H sin θ = 24 − 60 = −36 kN.)<br>Other options: A — H cos θ − V sin θ (sign of V term wrong); C — magnitude of the radial shear; D — resultant √(H² + V²).<\/p>","tag":""},{"id":"3.5.23","m":1,"o":["Zero","2","1","3"],"q":"<p>The degree of static indeterminacy of a two-hinged arch is:<\/p>","a":2,"s":"<p>Four reaction components (two at each hinge) − three equations = 1; the horizontal thrust H is usually taken as the redundant.<br>Other options: A — three-hinged arch; B — no basis; D — fixed (hingeless) arch.<\/p>","tag":""},{"id":"3.5.24","m":1,"o":["wL²/8h","wL²/4h","wL/2","wL²/16h"],"q":"<p>A two-hinged parabolic arch of span L and rise h carries a UDL w over the whole span (rib shortening neglected). The horizontal thrust is:<\/p>","a":0,"s":"<p>With w over the whole span the funicular is the parabola itself, so H = wL²/8h, the same as for a three-hinged arch, and the bending moment is zero throughout.<br>Other options: B — double the value; C — vertical reaction; D — half the value.<\/p>","tag":""},{"id":"3.5.25","m":1,"o":["W/2","W/4","2W/π","W/π"],"q":"<p>A two-hinged semicircular arch of radius R carries a concentrated load W at the crown. The horizontal thrust is:<\/p>","a":3,"s":"<p>From H = ∫M′ y ds/∫y² ds for the semicircle: H = W/π ≈ 0.318W.<br>Other options: A — vertical reaction; B — no basis (a three-hinged semicircle with a crown load gives W/2); C — double the value.<\/p>","tag":""},{"id":"3.5.26","m":1,"o":["A three-hinged arch only","A two-hinged arch, but not a three-hinged arch","Neither two- nor three-hinged arches","Both two- and three-hinged arches equally"],"q":"<p>A rise in temperature produces bending stresses in:<\/p>","a":1,"s":"<p>A three-hinged arch is determinate; it simply rises at the crown. A two-hinged arch is restrained horizontally, so a thrust H = EIαTL/∫y² ds develops.<br>Other options: A — reversed; C — two-hinged arch is affected; D — determinate arch is unaffected.<\/p>","tag":""},{"id":"3.5.27","m":1,"o":["1250 kN","500 kN","1346 kN","1750 kN"],"q":"<p>A cable of span 100 m with central sag 10 m carries a UDL of 10 kN/m of horizontal span (supports at the same level). The maximum tension in the cable is about:<\/p>","a":2,"s":"<p>H = wL²/8d = 10 × 10⁴/80 = 1250 kN; V = wL/2 = 500 kN. Tmax (at supports) = √(1250² + 500²) = 1346 kN.<br>Other options: A — horizontal tension only (minimum, at mid-span); B — vertical reaction; D — H + V added arithmetically.<\/p>","tag":""},{"id":"3.5.28","m":1,"o":["Catenary","Parabola","Circular arc","Cubic curve"],"q":"<p>A flexible cable hanging under its own weight only (uniform along its length) takes the shape of a:<\/p>","a":0,"s":"<p>Load uniform along the curve length gives a catenary; load uniform along the horizontal span gives a parabola.<br>Other options: B — load per horizontal length; C, D — no such load case.<\/p>","tag":""},{"id":"3.5.29","m":1,"o":["Reaction at the left support","Bending moment at the panel point","Deflection at mid-span","Shear in that panel"],"q":"<p>For a parallel-chord truss with single diagonals in each panel and loads at panel points, the influence line for the force in a diagonal is similar in shape to the influence line for:<\/p>","a":3,"s":"<p>Vertical equilibrium of a section through the panel: F sin θ = panel shear, so the diagonal ILD = (shear ILD of the panel)/sin θ.<br>Other options: A — reaction ILD covers the whole span uniformly linearly; B — governs chord forces; C — not an ILD of member force.<\/p>","tag":""},{"id":"3.5.30","m":1,"o":["0.5","0.3125","0.6875","0.375"],"q":"<p>A propped cantilever AB (fixed at A, propped at B, span L, constant EI) carries a unit load at distance a from A. The prop reaction is RB = a²(3L − a)/(2L³). The ordinate of the influence line for RB at mid-span is:<\/p>","a":1,"s":"<p>a = L/2: RB = (L²/4)(2.5L)/(2L³) = 2.5/8 = 0.3125 (= 5/16, the familiar propped-cantilever result).<br>Other options: A — simply supported value; C — the fixed-end reaction 11/16; D — 3/8 (the UDL coefficient).<\/p>","tag":""}]},{"k":"3.6","t":"Plastic Analysis","qs":[{"id":"3.6.1","m":1,"o":["1.12","1.70","1.50","2.00"],"q":"<p>The shape factor of a rectangular cross-section (bending about either principal axis) is:<\/p>","a":2,"s":"<p>Zp = bd²/4, Z = bd²/6 → S = Zp/Z = 1.5.<br>Other options: A — typical I-section; B — solid circle; D — diamond (square with diagonal vertical).<\/p>","tag":""},{"id":"3.6.2","m":1,"o":["1.70","1.50","1.27","2.34"],"q":"<p>The shape factor of a solid circular section is about:<\/p>","a":0,"s":"<p>Zp = d³/6, Z = πd³/32 → S = 16/(3π) = 1.70.<br>Other options: B — rectangle; C — thin-walled circular tube (4/π); D — isosceles triangle.<\/p>","tag":""},{"id":"3.6.3","m":1,"o":["1.5 to 1.7","1.0 to 1.05","1.7 to 2.0","1.10 to 1.20"],"q":"<p>Rolled steel I-sections bent about their major axis have a shape factor typically in the range:<\/p>","a":3,"s":"<p>Most of the material is in the flanges, which are already near yield when the extreme fibre yields, so Zp is only 10–20 % above Z (≈ 1.12–1.15).<br>Other options: A — rectangle/circle range; B — too low (only an idealised two-flange section approaches 1.0); C — diamond/triangle range.<\/p>","tag":""},{"id":"3.6.4","m":1,"o":["1.5","2.0","1.7","2.34"],"q":"<p>The shape factor of a square section bent about a diagonal (diagonal vertical) is:<\/p>","a":1,"s":"<p>Side a, half-diagonal h = a/√2. Z = I/h = (a⁴/12)/(a/√2) = a³/(6√2). Each half is a triangle of area a²/2 with centroid h/3 from the NA: Zp = 2 × (a²/2) × a/(3√2) = a³/(3√2). S = 2.<br>Other options: A — square with side horizontal; C — circle; D — triangle.<\/p>","tag":""},{"id":"3.6.5","m":1,"o":["1.50","2.00","2.34","1.70"],"q":"<p>The shape factor of an isosceles triangular section with its base horizontal (bending about the horizontal centroidal axis) is about:<\/p>","a":2,"s":"<p>Z = bh²/24 (to the apex); plastic NA at h/√2 from the apex gives Zp ≈ 0.0976 bh² → S = 2.34.<br>Other options: A — rectangle; B — diamond; D — circle.<\/p>","tag":""},{"id":"3.6.6","m":1,"o":["250 kN·m","166.7 kN·m","500 kN·m","125 kN·m"],"q":"<p>A rectangular steel beam section is 100 mm wide and 200 mm deep, with fy = 250 MPa. Its plastic moment capacity is:<\/p>","a":0,"s":"<p>Zp = bd²/4 = 100 × 200²/4 = 10⁶ mm³. Mp = fy Zp = 250 × 10⁶ N·mm = 250 kN·m.<br>Other options: B — elastic My = fy bd²/6; C — used bd²/2; D — used bd²/8.<\/p>","tag":""},{"id":"3.6.7","m":1,"o":["Always passes through the centroid","Passes through the shear centre","Coincides with the elastic neutral axis for all sections","Divides the section into two equal areas"],"q":"<p>The plastic (equal-area) neutral axis of a cross-section:<\/p>","a":3,"s":"<p>In the fully plastic state, total tension = total compression with stress fy on both sides, so areas are equal.<br>Other options: A, C — true only for sections symmetric about the bending axis; B — shear centre is for torsion-free bending.<\/p>","tag":""},{"id":"3.6.8","m":1,"o":["1.0","4/π ≈ 1.27","1.5","16/(3π) ≈ 1.70"],"q":"<p>The shape factor of a thin-walled hollow circular tube approaches:<\/p>","a":1,"s":"<p>For a thin ring of radius r and thickness t: Zp = 4r²t, Z = πr²t → S = 4/π.<br>Other options: A — ideal two-flange section; C — rectangle; D — solid circle.<\/p>","tag":""},{"id":"3.6.9","m":1,"o":["Has zero moment and rotates freely, exactly like a mechanical pin","Is still fully elastic","Is fully yielded and rotates freely while resisting a constant moment Mp","Has fractured"],"q":"<p>A plastic hinge is a section that:<\/p>","a":2,"s":"<p>Once M = Mp, the section rotates without further increase of moment (elastic–perfectly plastic material). Unlike a real hinge, it transmits Mp.<br>Other options: A — a mechanical hinge carries no moment; B — it is fully plastic; D — no fracture is implied.<\/p>","tag":""},{"id":"3.6.10","m":1,"o":["3","2","1","4"],"q":"<p>A beam fixed at both ends carries a single point load. The number of plastic hinges needed to form a collapse mechanism is:<\/p>","a":0,"s":"<p>For a complete mechanism n = Ds + 1. A fixed beam under transverse load has Ds = 2, so 3 hinges (two ends and under the load).<br>Other options: B — propped cantilever; C — simply supported beam; D — overestimated (Ds = 3 counts axial redundancy that does not affect bending).<\/p>","tag":""},{"id":"3.6.11","m":1,"o":["50 kN","200 kN","150 kN","100 kN"],"q":"<p>A simply supported beam of 6 m span has Mp = 150 kN·m. The collapse load for a central point load is:<\/p>","a":3,"s":"<p>One hinge under the load: Wc L/4 = Mp → Wc = 4Mp/L = 4 × 150/6 = 100 kN.<br>Other options: A — 2Mp/L; B — 8Mp/L (fixed beam); C — 6Mp/L (propped cantilever).<\/p>","tag":""},{"id":"3.6.12","m":1,"o":["60 kN","120 kN","240 kN","90 kN"],"q":"<p>A fixed beam of 8 m span has Mp = 120 kN·m. The collapse load for a central point load is:<\/p>","a":1,"s":"<p>Hinges at both ends and centre: W(L/2)θ = Mp(θ + 2θ + θ) → Wc = 8Mp/L = 120 kN.<br>Other options: A — simply supported value 4Mp/L; C — 16Mp/L (UDL coefficient misapplied); D — 6Mp/L (propped cantilever).<\/p>","tag":""},{"id":"3.6.13","m":1,"o":["20 kN/m","30 kN/m","40 kN/m","60 kN/m"],"q":"<p>A fixed beam of 6 m span has Mp = 90 kN·m. The collapse UDL is:<\/p>","a":2,"s":"<p>wc = 16Mp/L² = 16 × 90/36 = 40 kN/m.<br>Other options: A — 8Mp/L² (simply supported); B — 12Mp/L² (elastic end moment basis wL²/12); D — 24Mp/L².<\/p>","tag":""},{"id":"3.6.14","m":1,"o":["46.6 kN/m","32.0 kN/m","64.0 kN/m","48.0 kN/m"],"q":"<p>A propped cantilever of 5 m span has Mp = 100 kN·m. The collapse UDL over the whole span is about:<\/p>","a":0,"s":"<p>wc = 2(3 + 2√2)Mp/L² = 11.66 Mp/L² = 11.66 × 100/25 = 46.6 kN/m; the sagging hinge forms 0.414L from the prop.<br>Other options: B — 8Mp/L² (simply supported); C — 16Mp/L² (fixed beam); D — 12Mp/L², from assuming the sagging hinge at mid-span (an upper-bound mechanism, higher than the true value).<\/p>","tag":""},{"id":"3.6.15","m":1,"o":["53.3 kN","106.7 kN","120 kN","80 kN"],"q":"<p>A propped cantilever of 6 m span with Mp = 80 kN·m carries a central point load. The collapse load is:<\/p>","a":3,"s":"<p>Hinges at the fixed end and under the load: W(L/2)θ = Mp(θ + 2θ) → Wc = 6Mp/L = 80 kN.<br>Other options: A — 4Mp/L (simply supported); B — 8Mp/L (fixed beam); C — 9Mp/L, no basis.<\/p>","tag":""},{"id":"3.6.16","m":1,"o":["4Mp/L²","8Mp/L²","16Mp/L²","11.66Mp/L²"],"q":"<p>The collapse load of a simply supported beam of span L carrying a UDL over the whole span (plastic moment Mp) is:<\/p>","a":1,"s":"<p>Hinge at mid-span: wL²/8 = Mp → wc = 8Mp/L².<br>Other options: A — half the value; C — fixed beam; D — propped cantilever.<\/p>","tag":""},{"id":"3.6.17","m":1,"o":["Always equal to the true collapse load","Less than or equal to the true collapse load","Greater than or equal to the true collapse load","Independent of the mechanism chosen"],"q":"<p>The upper bound (kinematic or mechanism) theorem of plastic analysis states that the load computed from any assumed mechanism is:<\/p>","a":2,"s":"<p>A mechanism satisfies equilibrium (virtual work) and mechanism conditions but may violate the yield condition, so it gives an unsafe (upper) bound. The smallest mechanism load is the collapse load.<br>Other options: A — only for the correct mechanism; B — that is the lower bound theorem; D — different mechanisms give different loads.<\/p>","tag":""},{"id":"3.6.18","m":1,"o":["Less than or equal to the true collapse load","Greater than or equal to the true collapse load","Exactly the collapse load","The first-yield load"],"q":"<p>The lower bound (static or safe) theorem states that a load for which a statically admissible bending moment distribution exists with |M| ≤ Mp everywhere is:<\/p>","a":0,"s":"<p>Equilibrium and yield conditions are met but not necessarily the mechanism condition → safe (lower) bound.<br>Other options: B — upper bound theorem; C — only if a mechanism also forms; D — first yield is a particular lower bound, not the statement.<\/p>","tag":""},{"id":"3.6.19","m":1,"o":["Only equilibrium and yield conditions","Only the mechanism condition","Compatibility of elastic deflections","Equilibrium, yield (|M| ≤ Mp) and mechanism conditions together"],"q":"<p>The true collapse load is obtained (uniqueness theorem) when a bending moment distribution satisfies:<\/p>","a":3,"s":"<p>When all three conditions are met, upper and lower bounds coincide and the load is the collapse load.<br>Other options: A — lower bound only; B — upper bound only; C — elastic compatibility is not needed in plastic collapse analysis.<\/p>","tag":""},{"id":"3.6.20","m":1,"o":["1.5","2.25","1.0","3.0"],"q":"<p>A statically determinate beam of rectangular section is designed elastically with a factor of safety of 1.5 against first yield. Its load factor against plastic collapse is:<\/p>","a":1,"s":"<p>For a determinate beam, collapse occurs when the critical section reaches Mp = S × My. Load factor = FOS × shape factor = 1.5 × 1.5 = 2.25.<br>Other options: A — ignores the reserve from shape factor; C — no basis; D — 2 × 1.5.<\/p>","tag":""},{"id":"3.6.21","m":1,"o":["66.7 kN","100 kN","133.3 kN","200 kN"],"q":"<p>A fixed-base portal frame of span 6 m and column height 4 m has the same Mp = 100 kN·m for all members. It carries only a vertical point load W at mid-span of the beam. The collapse load is:<\/p>","a":2,"s":"<p>Beam mechanism (hinges at both beam ends and under the load): W(L/2)θ = 4Mpθ → W = 8Mp/L = 133.3 kN.<br>Other options: A — 4Mp/L (simply supported beam); B — 6Mp/L; D — 12Mp/L.<\/p>","tag":""},{"id":"3.6.22","m":1,"o":["60 kN","30 kN","120 kN","15 kN"],"q":"<p>A fixed-base portal frame with columns 4 m high and the same Mp = 60 kN·m for all members carries a horizontal load H at beam level. The collapse load for the sway mechanism is:<\/p>","a":0,"s":"<p>Four hinges (top and bottom of both columns): H × h θ = 4Mpθ → H = 4Mp/h = 4 × 60/4 = 60 kN.<br>Other options: B — 2Mp/h (pinned bases); C — 8Mp/h; D — Mp/h.<\/p>","tag":""},{"id":"3.6.23","m":1,"o":["66.7 kN","100 kN","75 kN","60 kN"],"q":"<p>A fixed-base portal frame (span 6 m, column height 4 m, uniform Mp = 100 kN·m) carries a vertical load 2P at mid-span of the beam and a horizontal load P acting at the left top corner towards the right. The collapse value of P is:<\/p>","a":3,"s":"<p>Beam: 2P × 3 = 4Mp → P = 66.7. Sway: P × 4 = 4Mp → P = 100. Combined: 2P × 3 + P × 4 = 6Mp → P = 60 kN (lowest). Hinges at both bases, under the load and at the right top corner; the moment at the left top corner then works out to 60 kN·m &lt; Mp, so this is the true collapse load.<br>Other options: A — beam mechanism only; B — sway mechanism only; C — sway work taken with h/2 (2P × 3 + P × 2 = 6Mp).<\/p>","tag":""},{"id":"3.6.24","m":1,"o":["Plane sections remain plane","The material obeys Hooke&#x27;s law up to failure","The material is elastic–perfectly plastic (no strain hardening)","Yield stress is the same in tension and compression"],"q":"<p>Which assumption is NOT made in the simple plastic theory of bending?<\/p>","a":1,"s":"<p>Simple plastic theory uses an idealised elastic–perfectly plastic stress–strain curve; Hooke&#x27;s law up to failure would allow no plastic hinge at all.<br>Other options: A, C, D — all are standard assumptions of the theory.<\/p>","tag":""},{"id":"3.6.25","m":1,"o":["Over-complete collapse","Elastic buckling","Partial collapse","Combined mechanism"],"q":"<p>If a collapse mechanism forms with fewer plastic hinges than (Ds + 1), the collapse is called:<\/p>","a":2,"s":"<p>Part of the structure becomes a mechanism while the rest remains statically indeterminate.<br>Other options: A — when more than one mechanism forms simultaneously; B — instability, not plastic collapse; D — combination of independent mechanisms.<\/p>","tag":""},{"id":"3.6.26","m":1,"o":["2","3","5","1"],"q":"<p>A fixed-base single-bay portal frame carries a vertical point load at mid-span of the beam and a horizontal load at beam level. The number of independent mechanisms is:<\/p>","a":0,"s":"<p>Possible hinge positions: both bases, both corners, under the load = 5. Ds = 3. Independent mechanisms = 5 − 3 = 2 (beam and sway); the combined mechanism is their combination.<br>Other options: B — Ds itself; C — number of possible hinge positions; D — only one would form.<\/p>","tag":""},{"id":"3.6.27","m":1,"o":["80 kN","160 kN","100 kN","120 kN"],"q":"<p>A continuous beam ABC is simply supported at A, B and C with two equal spans of 6 m and uniform Mp = 120 kN·m. A central point load W acts on each span. The collapse load W is:<\/p>","a":3,"s":"<p>Each span collapses as a propped cantilever (hinge over B and under the load): W(L/2)θ = Mp(θ + 2θ) → W = 6Mp/L = 120 kN.<br>Other options: A — 4Mp/L (simply supported); B — 8Mp/L (fixed beam); C — no basis.<\/p>","tag":""},{"id":"3.6.28","m":1,"o":["My/Mp","Mp/My","Area/plastic modulus","Collapse load/working load"],"q":"<p>The shape factor of a cross-section is defined as the ratio:<\/p>","a":1,"s":"<p>S = Mp/My = Zp/Z, always ≥ 1.<br>Other options: A — inverted; C — no such definition; D — this is the load factor.<\/p>","tag":""},{"id":"3.6.29"
