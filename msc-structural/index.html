ngth","miser : wealth","pauper : money"],"q":"<p>NOVICE : EXPERIENCE ::<\/p>","a":3,"s":"<p>Person : what they lack. A novice lacks experience; a pauper lacks money.<br>Other options: A, B, C — each person characteristically has, rather than lacks, the thing named.<\/p>","tag":""},{"id":"1.4.26","m":1,"o":["compass : speed","spirit level : horizontal","chain : angle","clinometer : depth"],"q":"<p>PLUMB BOB : VERTICAL ::<\/p>","a":1,"s":"<p>Instrument : reference line it establishes. A plumb bob gives the vertical; a spirit level gives the horizontal.<br>Other options: A — a compass gives direction; C — a chain measures distance; D — a clinometer measures slope angle.<\/p>","tag":""},{"id":"1.4.27","m":1,"o":["farm : tractor","forest : axe","mine : ore","kiln : clay"],"q":"<p>QUARRY : STONE ::<\/p>","a":2,"s":"<p>Site : material extracted there. Stone is quarried; ore is mined.<br>Other options: A, B — a tractor and an axe are tools; D — clay is fired in a kiln, not extracted from it.<\/p>","tag":""},{"id":"1.4.28","m":1,"o":["visible : see","edible : eat","inevitable : avoid","audible : hear"],"q":"<p>INCORRIGIBLE : REFORM ::<\/p>","a":2,"s":"<p>Incapable of being … : action. Incorrigible = cannot be reformed; inevitable = cannot be avoided.<br>Other options: A, B, D — these mean &#x27;can be&#x27; seen/eaten/heard (the opposite pattern).<\/p>","tag":""},{"id":"1.4.29","m":1,"o":["timber : fire","glass : impact","clay : shrinkage","concrete : compression"],"q":"<p>STEEL : TENSION ::<\/p>","a":3,"s":"<p>Material : type of stress it resists well. Steel is strong in tension; concrete is strong in compression.<br>Other options: A — timber burns; B — glass is weak under impact; C — clay is prone to shrinkage, not resistant to it.<\/p>","tag":""},{"id":"1.4.30","m":1,"o":["enlarge : photograph","condense : report","translate : language","edit : author"],"q":"<p>ABRIDGE : TEXT ::<\/p>","a":1,"s":"<p>Shorten : thing shortened. To abridge a text is to shorten it; to condense a report is to shorten it.<br>Other options: A — enlarge makes bigger (opposite direction); C — translating changes language, not length; D — an editor edits text, not the author.<\/p>","tag":""}]}]},{"n":2,"t":"Mathematics","subs":[{"k":"2.1","t":"Basic Mathematics","qs":[{"id":"2.1.1","m":1,"o":["5","7","2","3"],"q":"<p>If A = {1, 2, 3, 4} and B = {3, 4, 5}, the number of elements in the symmetric difference A Δ B is:<\/p>","a":3,"s":"<p>A Δ B = (A − B) ∪ (B − A) = {1, 2} ∪ {5} = {1, 2, 5}, so it has 3 elements.<br>Other options: A — that is n(A ∪ B); B — n(A) + n(B), counting common elements twice; C — that is n(A ∩ B).<\/p>","tag":""},{"id":"2.1.2","m":1,"o":["10","25","32","31"],"q":"<p>The number of subsets of a set containing 5 elements is:<\/p>","a":2,"s":"<p>A set with n elements has 2ⁿ subsets; 2⁵ = 32 (including ∅ and the set itself).<br>Other options: A — 5 × 2, not 2⁵; B — 5², not 2⁵; D — the number of proper subsets (2⁵ − 1).<\/p>","tag":""},{"id":"2.1.3","m":1,"o":["[2, 5)","[2, ∞) − {5}","(2, ∞)","ℝ − {5}"],"q":"<p>The domain of the real function f(x) = √(x − 2) / (x − 5) is:<\/p>","a":1,"s":"<p>Need x − 2 ≥ 0 (x ≥ 2) and the denominator x − 5 ≠ 0 (x ≠ 5).<br>Other options: A — drops all x &gt; 5, which are allowed; C — excludes x = 2 (where f = 0 is defined) and wrongly includes x = 5; D — ignores the square-root condition x ≥ 2.<\/p>","tag":""},{"id":"2.1.4","m":1,"o":["[−2, ∞)","ℝ","[7, ∞)","[3, ∞)"],"q":"<p>The range of f(x) = x² + 4x + 7, x ∈ ℝ, is:<\/p>","a":3,"s":"<p>f(x) = (x + 2)² + 3, minimum 3 at x = −2, unbounded above.<br>Other options: A — the x-coordinate of the vertex, not the minimum value; B — an upward parabola is bounded below; C — value at x = 0, not the minimum.<\/p>","tag":""},{"id":"2.1.5","m":1,"o":["11","7","14","49"],"q":"<p>If f(x) = 2x + 3 and g(x) = x², then (f ∘ g)(2) equals:<\/p>","a":0,"s":"<p>(f ∘ g)(2) = f(g(2)) = f(4) = 2·4 + 3 = 11.<br>Other options: B — f(2) only; C — f(2)·2, no composition; D — that is (g ∘ f)(2) = g(7).<\/p>","tag":""},{"id":"2.1.6","m":1,"o":["(x + 2)/(3 − x)","(x + 2)/(x − 3)","(x − 1)/(3x + 2)","(x − 2)/(x + 3)"],"q":"<p>The inverse of f(x) = (3x + 2)/(x − 1), x ≠ 1, is f⁻¹(x) =<\/p>","a":1,"s":"<p>Put y = (3x + 2)/(x − 1): xy − y = 3x + 2 ⇒ x(y − 3) = y + 2 ⇒ x = (y + 2)/(y − 3).<br>Other options: A — sign of the denominator reversed; C — that is the reciprocal 1/f(x), not the inverse; D — sign errors while solving for x.<\/p>","tag":""},{"id":"2.1.7","m":1,"o":["An odd function","Both even and odd","Neither even nor odd","An even function"],"q":"<p>The function f(x) = x³ + x on ℝ is:<\/p>","a":0,"s":"<p>f(−x) = −x³ − x = −f(x).<br>Other options: B — only f(x) = 0 is both; C — it satisfies the odd condition exactly; D — would need f(−x) = f(x).<\/p>","tag":""},{"id":"2.1.8","m":1,"o":["(0, 1)","[0, 1]","[1, ∞)","(0, 1]"],"q":"<p>The range of f(x) = 1/(1 + x²), x ∈ ℝ, is:<\/p>","a":3,"s":"<p>1 + x² ≥ 1, so 0 &lt; f(x) ≤ 1; the value 1 occurs at x = 0 and 0 is approached but never reached.<br>Other options: A — f(0) = 1 is attained; B — f never equals 0; C — that is the range of 1 + x².<\/p>","tag":""},{"id":"2.1.9","m":1,"o":["2√10","100","10","14"],"q":"<p>The distance between the points (2, −3) and (−4, 5) is:<\/p>","a":2,"s":"<p>d = √[(−4 − 2)² + (5 + 3)²] = √(36 + 64) = √100 = 10.<br>Other options: A — took Δy = 5 − 3 = 2 instead of 5 − (−3) = 8; B — forgot the square root; D — |Δx| + |Δy| = 6 + 8, not the Euclidean distance.<\/p>","tag":""},{"id":"2.1.10","m":1,"o":["(3, 4)","(5, 6)","(4, 5)","(−5, −4)"],"q":"<p>The point dividing the join of (1, 2) and (7, 8) internally in the ratio 1 : 2 is:<\/p>","a":0,"s":"<p>x = (1·7 + 2·1)/3 = 3, y = (1·8 + 2·2)/3 = 4.<br>Other options: B — ratio taken as 2 : 1; C — the mid-point (ratio 1 : 1); D — external division in the ratio 1 : 2.<\/p>","tag":""},{"id":"2.1.11","m":1,"o":["−4/3","3/4","4/3","−3/4"],"q":"<p>The slope of a line perpendicular to 3x − 4y + 7 = 0 is:<\/p>","a":0,"s":"<p>Slope of the given line = 3/4; perpendicular slope = −1/(3/4) = −4/3.<br>Other options: B — slope of the given line itself (parallel); C — reciprocal without the negative sign; D — negated but not inverted.<\/p>","tag":""},{"id":"2.1.12","m":1,"o":["2","10","0.4","6.4"],"q":"<p>The perpendicular distance of the point (1, 2) from the line 3x + 4y − 21 = 0 is:<\/p>","a":0,"s":"<p>d = |3·1 + 4·2 − 21| / √(3² + 4²) = 10/5 = 2.<br>Other options: B — forgot to divide by √(a² + b²); C — divided by 25 instead of 5; D — used +21 instead of −21: 32/5.<\/p>","tag":""},{"id":"2.1.13","m":1,"o":["30°","45°","90°","60°"],"q":"<p>The acute angle between the lines y = √3 x and y = x/√3 is:<\/p>","a":0,"s":"<p>The lines make 60° and 30° with the x-axis; the angle between them is 60° − 30° = 30°.<br>Other options: B — no basis; tan θ = (√3 − 1/√3)/(1 + 1) = 1/√3; C — the product of slopes is 1, not −1, so they are not perpendicular; D — the inclination of the first line only.<\/p>","tag":""},{"id":"2.1.14","m":1,"o":["Centre (−3, 4), radius 6","Centre (3, −4), radius √14","Centre (3, −4), radius 6","Centre (3, −4), radius 36"],"q":"<p>For the circle x² + y² − 6x + 8y − 11 = 0, the centre and radius are:<\/p>","a":2,"s":"<p>Centre (−g, −f) = (3, −4); r = √(g² + f² − c) = √(9 + 16 + 11) = 6.<br>Other options: A — signs of the centre reversed; B — used g² + f² + c = 9 + 16 − 11; D — that is r², not r.<\/p>","tag":""},{"id":"2.1.15","m":1,"o":["x² + y² − 4x + 2y + 20 = 0","x² + y² + 4x − 2y − 20 = 0","x² + y² − 4x + 2y − 20 = 0","x² + y² − 4x + 2y − 25 = 0"],"q":"<p>The equation of the circle with centre (2, −1) passing through (5, 3) is:<\/p>","a":2,"s":"<p>r² = 3² + 4² = 25; (x − 2)² + (y + 1)² = 25 ⇒ x² + y² − 4x + 2y + 5 − 25 = 0.<br>Other options: A — sign of the constant term wrong; B — centre taken as (−2, 1); D — dropped the +4 + 1 from expanding the squares.<\/p>","tag":""},{"id":"2.1.16","m":1,"o":["Focus (12, 0), directrix x = −12","Focus (3, 0), directrix x = −3","Focus (3, 0), directrix x = 3","Focus (0, 3), directrix y = −3"],"q":"<p>For the parabola y² = 12x, the focus and directrix are:<\/p>","a":1,"s":"<p>y² = 4ax with 4a = 12, a = 3: focus (a, 0), directrix x = −a.<br>Other options: A — used 4a instead of a; C — the directrix lies on the opposite side of the vertex; D — that belongs to x² = 12y.<\/p>","tag":""},{"id":"2.1.17","m":1,"o":["4/5","3/4","5/3","3/5"],"q":"<p>The eccentricity of the ellipse x²/25 + y²/16 = 1 is:<\/p>","a":3,"s":"<p>e = √(1 − b²/a²) = √(1 − 16/25) = 3/5.<br>Other options: A — b/a, not e; B — divided √(a² − b²) by b instead of a; C — inverted; an ellipse has e &lt; 1.<\/p>","tag":""},{"id":"2.1.18","m":1,"o":["5/3","√7/3","5/4","4/3"],"q":"<p>The eccentricity of the hyperbola x²/9 − y²/16 = 1 is:<\/p>","a":0,"s":"<p>e = √(1 + b²/a²) = √(1 + 16/9) = 5/3.<br>Other options: B — used the ellipse formula 1 − b²/a² (and it would be imaginary); C — divided by b instead of a; D — b/a, the slope of an asymptote.<\/p>","tag":""},{"id":"2.1.19","m":1,"o":["Ellipse","Circle","Parabola","Hyperbola"],"q":"<p>A conic section whose eccentricity is exactly 1 is a:<\/p>","a":2,"s":"<p>e = 1: parabola; e &lt; 1: ellipse; e &gt; 1: hyperbola; e = 0: circle.<br>Other options: A — needs 0 &lt; e &lt; 1; B — has e = 0; D — needs e &gt; 1.<\/p>","tag":""},{"id":"2.1.20","m":1,"o":["h² = ab","h² &gt; ab","h² = ab + c","h² &lt; ab"],"q":"<p>The general second-degree equation ax² + 2hxy + by² + 2gx + 2fy + c = 0 (non-degenerate) represents an ellipse when:<\/p>","a":3,"s":"<p>Discriminant test: h² &lt; ab ellipse, h² = ab parabola, h² &gt; ab hyperbola.<br>Other options: A — gives a parabola; B — gives a hyperbola; C — not a standard condition.<\/p>","tag":""},{"id":"2.1.21","m":1,"o":["13","169","19","√41"],"q":"<p>The distance between the points (1, 2, 3) and (4, 6, 15) is:<\/p>","a":0,"s":"<p>d = √(3² + 4² + 12²) = √169 = 13.<br>Other options: B — forgot the square root; C — sum of differences 3 + 4 + 12; D — dropped the z-difference.<\/p>","tag":""},{"id":"2.1.22","m":1,"o":["2/√5, −1/√5, 2/√5","2/3, −1/3, 2/3","2, −1, 2","2/5, −1/5, 2/5"],"q":"<p>The direction cosines of a line with direction ratios 2, −1, 2 are:<\/p>","a":1,"s":"<p>Divide by √(2² + 1² + 2²) = 3.<br>Other options: A — used √5 instead of √9; C — these are the ratios, not cosines (l² + m² + n² must be 1); D — divided by the sum 2 + 1 + 2 = 5 instead of the magnitude 3.<\/p>","tag":""},{"id":"2.1.23","m":1,"o":["1","2","3","0"],"q":"<p>If a line makes angles α, β, γ with the x, y, z axes, then sin²α + sin²β + sin²γ equals:<\/p>","a":1,"s":"<p>cos²α + cos²β + cos²γ = 1 ⇒ Σ sin² = 3 − 1 = 2.<br>Other options: A — that is Σ cos²; C — would require all cosines zero; D — not possible for real angles.<\/p>","tag":""},{"id":"2.1.24","m":1,"o":["13/21","13/√21","13","4/√21"],"q":"<p>The perpendicular distance of the point (2, 1, −1) from the plane x − 2y + 4z = 9 is:<\/p>","a":1,"s":"<p>d = |2 − 2 − 4 − 9| / √(1 + 4 + 16) = 13/√21.<br>Other options: A — divided by a² + b² + c² instead of its square root; C — did not divide by the normal&#x27;s magnitude; D — forgot the constant term −9.<\/p>","tag":""},{"id":"2.1.25","m":1,"o":["30°","90°","45°","60°"],"q":"<p>The angle between the planes 2x − y + z = 6 and x + y + 2z = 3 is:<\/p>","a":3,"s":"<p>cos θ = (2 − 1 + 2)/(√6 · √6) = 1/2.<br>Other options: A — took sin θ = 1/2; B — would need the dot product of normals to be 0; C — arithmetic slip; cos θ is exactly 1/2.<\/p>","tag":""},{"id":"2.1.26","m":1,"o":["Centre (1, −2, 3), radius 25","Centre (−1, 2, −3), radius 5","Centre (1, −2, 3), radius 5","Centre (1, −2, 3), radius √3"],"q":"<p>The centre and radius of the sphere x² + y² + z² − 2x + 4y − 6z − 11 = 0 are:<\/p>","a":2,"s":"<p>Centre (−u, −v, −w) = (1, −2, 3); r = √(1 + 4 + 9 + 11) = 5.<br>Other options: A — that is r²; B — signs of the centre reversed; D — used u² + v² + w² − d with d = +11.<\/p>","tag":""},{"id":"2.1.27","m":1,"o":["x + 2y + 3z = 20","2x + 3y + 4z = 0","2x + 3y + 4z = 20","2x + 3y + 4z = 9"],"q":"<p>The equation of the plane through (1, 2, 3) whose normal has direction ratios 2, 3, 4 is:<\/p>","a":2,"s":"<p>2(x − 1) + 3(y − 2) + 4(z − 3) = 0 ⇒ 2x + 3y + 4z = 2 + 6 + 12 = 20.<br>Other options: A — used the point as the normal; B — plane through the origin, not through (1, 2, 3); D — added the direction ratios instead of 2·1 + 3·2 + 4·3.<\/p>","tag":""},{"id":"2.1.28","m":1,"o":["1/6, 1/4, 1/2","6, 4, 2","2, 3, 6","12, 12, 12"],"q":"<p>The intercepts made on the x, y and z axes by the plane 2x + 3y + 6z = 12 are respectively:<\/p>","a":1,"s":"<p>Intercept form x/6 + y/4 + z/2 = 1.<br>Other options: A — reciprocals of the intercepts; C — the coefficients, not the intercepts; D — ignored the coefficients.<\/p>","tag":""},{"id":"2.1.29","m":1,"o":["2","−1/2","1/2","−2"],"q":"<p>Lines with direction ratios (1, −2, k) and (3, 1, 2) are perpendicular. The value of k is:<\/p>","a":1,"s":"<p>Perpendicular ⇒ 1·3 + (−2)·1 + 2k = 0 ⇒ 1 + 2k = 0.<br>Other options: A — both slips; C — sign slip; D — solved 1 + k/2 = 0.<\/p>","tag":""},{"id":"2.1.30","m":1,"o":["6","0","9","8"],"q":"<p>The number of functions from a set with 3 elements to a set with 2 elements is:<\/p>","a":3,"s":"<p>Each of the 3 elements can go to either of 2 images: 2³ = 8.<br>Other options: A — 3 × 2; B — that is the number of one-one functions (none exist since 3 &gt; 2); C — 3², the count in the other direction.<\/p>","tag":""}]},{"k":"2.2","t":"Algebra","qs":[{"id":"2.2.1","m":1,"o":["1","−5","−1","−33"],"q":"<p>The remainder when x³ − 3x² + 4x − 5 is divided by (x − 2) is:<\/p>","a":2,"s":"<p>Remainder theorem: p(2) = 8 − 12 + 8 − 5 = −1.<br>Other options: A — sign slip; B — the constant term only; D — evaluated p(−2) instead of p(2).<\/p>","tag":""},{"id":"2.2.2","m":1,"o":["19/4","13/4","25/4","37/4"],"q":"<p>If α and β are the roots of 2x² − 5x + 3 = 0, then α² + β² equals:<\/p>","a":1,"s":"<p>α + β = 5/2, αβ = 3/2; α² + β² = (α + β)² − 2αβ = 25/4 − 3 = 13/4.<br>Other options: A — took αβ = 3/4; C — that is (α + β)²; D — added 2αβ instead of subtracting.<\/p>","tag":""},{"id":"2.2.3","m":1,"o":["±3","±18","±6","±9"],"q":"<p>The equation x² + kx + 9 = 0 has equal roots when k equals:<\/p>","a":2,"s":"<p>Equal roots ⇒ discriminant k² − 36 = 0.<br>Other options: A — took k² = 9; B — used k² = 4·81; D — took k = ±c.<\/p>","tag":""},{"id":"2.2.4","m":1,"o":["5√2","7/√2","5","5/√2"],"q":"<p>The modulus of the complex number (3 + 4i)/(1 − i) is:<\/p>","a":3,"s":"<p>Modulus of a quotient: |z₁/z₂| = |3 + 4i|/|1 − i| = 5/√2.<br>Other options: A — multiplied the moduli; B — used 3 + 4 instead of √(3² + 4²); C — ignored the denominator.<\/p>","tag":""},{"id":"2.2.5","m":1,"o":["−i","−1","i","1"],"q":"<p>The value of i²⁰²⁵ (where i = √−1) is:<\/p>","a":2,"s":"<p>2025 = 4·506 + 1, so i²⁰²⁵ = i¹ = i.<br>Other options: A — remainder taken as 3; B — remainder taken as 2; D — remainder taken as 0.<\/p>","tag":""},{"id":"2.2.6","m":1,"o":["2π/3","−π/3","π/3","5π/6"],"q":"<p>The principal argument of z = −1 + i√3 is:<\/p>","a":0,"s":"<p>z lies in the second quadrant; reference angle tan⁻¹(√3) = π/3, so arg z = π − π/3.<br>Other options: B — tan⁻¹(√3/−1) taken directly from a calculator; C — reference angle only (first quadrant); D — used reference angle π/6.<\/p>","tag":""},{"id":"2.2.7","m":1,"o":["256","16i","−16","16"],"q":"<p>The value of (1 + i)⁸ is:<\/p>","a":3,"s":"<p>1 + i = √2 (cos π/4 + i sin π/4); by De Moivre, (1 + i)⁸ = (√2)⁸ (cos 2π + i sin 2π) = 16.<br>Other options: A — used 2⁸ instead of (√2)⁸; B — angle taken as 2π + π/2; C — angle taken as π.<\/p>","tag":""},{"id":"2.2.8","m":1,"o":["0","−4","−8","8"],"q":"<p>If ω is a non-real cube root of unity, then (1 + ω − ω²)³ equals:<\/p>","a":2,"s":"<p>1 + ω = −ω², so (1 + ω − ω²)³ = (−2ω²)³ = −8ω⁶ = −8.<br>Other options: A — assumed 1 + ω − ω² = 0; B — squared instead of cubed; D — sign lost when cubing −2.<\/p>","tag":""},{"id":"2.2.9","m":1,"o":["800","820","860","79"],"q":"<p>The sum of the first 20 terms of the A.P. 3, 7, 11, … is:<\/p>","a":1,"s":"<p>S = (n/2)[2a + (n − 1)d] = 10 × (6 + 76) = 820.<br>Other options: A — took the last term as 77: 10 × (3 + 77); C — used 20d instead of 19d; D — that is the 20th term.<\/p>","tag":""},{"id":"2.2.10","m":1,"o":["8","9","18","4.5"],"q":"<p>The sum to infinity of the G.P. 6, 2, 2/3, … is:<\/p>","a":1,"s":"<p>S∞ = a/(1 − r) = 6/(1 − 1/3) = 9.<br>Other options: A — summed only the first three terms (≈ 8.67) and rounded; C — divided by r instead of (1 − r); D — used 1 + r in the denominator.<\/p>","tag":""},{"id":"2.2.11","m":1,"o":["8","6.4","6","10"],"q":"<p>The harmonic mean of 4 and 16 is:<\/p>","a":1,"s":"<p>HM = 2ab/(a + b) = 128/20 = 6.4 (check: GM² = AM × HM ⇒ 64 = 10 × 6.4).<br>Other options: A — that is the GM; C — rounded / guessed; D — that is the AM.<\/p>","tag":""},{"id":"2.2.12","m":1,"o":["385","100","55","3025"],"q":"<p>The value of 1² + 2² + 3² + … + 10² is:<\/p>","a":0,"s":"<p>Σk² = n(n + 1)(2n + 1)/6 = 10·11·21/6 = 385.<br>Other options: B — only the last term; C — that is Σk; D — that is Σk³.<\/p>","tag":""},{"id":"2.2.13","m":1,"o":["277200","39916800","3326400","1108800"],"q":"<p>The number of distinct arrangements of all the letters of the word ENGINEERING is:<\/p>","a":0,"s":"<p>11 letters with E×3, N×3, G×2, I×2, R×1: 11!/(3!·3!·2!·2!) = 39916800/144 = 277200.<br>Other options: B — 11!, ignoring repeated letters; C — divided only by 3!·2!; D — divided only by 3!·3!.<\/p>","tag":""},{"id":"2.2.14","m":1,"o":["45","792","4200","350"],"q":"<p>A committee of 3 men and 2 women is to be formed from 7 men and 5 women. The number of ways is:<\/p>","a":3,"s":"<p>C(7, 3) × C(5, 2) = 35 × 10 = 350.<br>Other options: A — added 35 + 10 instead of multiplying; B — C(12, 5), ignoring the gender split; C — used permutations P(7, 3) × P(5, 2).<\/p>","tag":""},{"id":"2.2.15","m":1,"o":["9","15","45","10"],"q":"<p>If C(n, 2) = 45, then n equals:<\/p>","a":3,"s":"<p>n(n − 1)/2 = 45 ⇒ n² − n − 90 = 0 ⇒ n = 10.<br>Other options: A — solved n(n − 1) = 72; B — solved n(n − 1)/2 = 105; C — took C(n, 2) = n.<\/p>","tag":""},{"id":"2.2.16","m":1,"o":["70","45","35","20"],"q":"<p>The number of diagonals of a decagon (10-sided polygon) is:<\/p>","a":2,"s":"<p>C(10, 2) − 10 = 45 − 10 = 35, i.e. n(n − 3)/2.<br>Other options: A — forgot to divide by 2; B — C(10, 2) includes the 10 sides; D — used 2n.<\/p>","tag":""},{"id":"2.2.17","m":1,"o":["240","20","160","120"],"q":"<p>The coefficient of x³ in the expansion of (1 + 2x)⁶ is:<\/p>","a":2,"s":"<p>T₄ = C(6, 3)(2x)³ = 20 × 8 x³.<br>Other options: A — used C(6, 4) × 2⁴ (the x⁴ coefficient); B — omitted 2³; D — multiplied C(6, 3) by 6 instead of 2³.<\/p>","tag":""},{"id":"2.2.18","m":1,"o":["x &lt; −1 or x &gt; 4","−4 &lt; x &lt; 1","x &lt; 4","−1 &lt; x &lt; 4"],"q":"<p>The solution set of |2x − 3| &lt; 5 is:<\/p>","a":3,"s":"<p>−5 &lt; 2x − 3 &lt; 5 ⇒ −2 &lt; 2x &lt; 8.<br>Other options: A — that solves |2x − 3| &gt; 5; B — signs of the bounds reversed; C — dropped the lower bound.<\/p>","tag":""},{"id":"2.2.19","m":1,"o":["−3 ≤ x ≤ −2","2 ≤ x ≤ 3","2 &lt; x &lt; 3","x ≤ 2 or x ≥ 3"],"q":"<p>The solution set of the inequality x² − 5x + 6 ≤ 0 is:<\/p>","a":1,"s":"<p>(x − 2)(x − 3) ≤ 0 holds between the roots, inclusive.<br>Other options: A — root signs wrong; C — excludes the end points where equality holds; D — that is where the quadratic is ≥ 0.<\/p>","tag":""},{"id":"2.2.20","m":1,"o":["−43","−50","43","77"],"q":"<p>The value of the determinant with rows [2 3 1], [4 1 0], [1 2 5] is:<\/p>","a":0,"s":"<p>Expanding along R₁: 2(5 − 0) − 3(20 − 0) + 1(8 − 1) = 10 − 60 + 7 = −43.<br>Other options: B — dropped the third term; C — overall sign slip; D — added the second cofactor term instead of subtracting it.<\/p>","tag":""},{"id":"2.2.21","m":1,"o":["32","8","16","24"],"q":"<p>If A is a 3 × 3 matrix with |A| = 4, then |2A| equals:<\/p>","a":0,"s":"<p>For an n × n matrix, |kA| = kⁿ|A| = 2³ × 4.<br>Other options: B — used k|A|; C — that is |adj A| = |A|²; D — used 6|A|.<\/p>","tag":""},{"id":"2.2.22","m":1,"o":["[3 1; 5 2]","[2 −5; −1 3]","[−3 1; 5 −2]","[3 −1; −5 2]"],"q":"<p>The inverse of the matrix [2 1; 5 3] (rows separated by ;) is:<\/p>","a":3,"s":"<p>Here |A| = 6 − 5 = 1; A⁻¹ = (1/|A|) adj A = [d −b; −c a].<br>Other options: A — swapped diagonal but forgot to negate off-diagonal entries; B — transposed instead of forming the adjoint; C — negated the wrong elements.<\/p>","tag":""},{"id":"2.2.23","m":1,"o":["0","2","1","3"],"q":"<p>The rank of the matrix [1 2 3; 2 4 6; 1 1 1] is:<\/p>","a":1,"s":"<p>R₂ = 2R₁ so |A| = 0, but the 2 × 2 minor from R₁, R₃ (1·1 − 2·1 = −1) is non-zero.<br>Other options: A — only the zero matrix has rank 0; C — R₃ is not a multiple of R₁; D — the determinant is zero.<\/p>","tag":""},{"id":"2.2.24","m":1,"o":["4 and 3","−5 and −2","6 and 1","5 and 2"],"q":"<p>The eigenvalues of the matrix [4 1; 2 3] are:<\/p>","a":3,"s":"<p>λ² − (trace)λ + det = λ² − 7λ + 10 = 0.<br>Other options: A — diagonal entries (valid only for triangular matrices); B — sign error in the characteristic equation; C — product taken as 6 instead of 10.<\/p>","tag":""},{"id":"2.2.25","m":1,"o":["21","9","24","19"],"q":"<p>The product of the eigenvalues of the matrix [2 0 1; 1 3 2; 0 1 4] is:<\/p>","a":0,"s":"<p>Product of eigenvalues = |A| = 2(12 − 2) − 0 + 1(1 − 0) = 21.<br>Other options: B — that is the sum (trace); C — product of diagonal elements; D — sign slip in the last cofactor.<\/p>","tag":""},{"id":"2.2.26","m":1,"o":["−2, −2, 4","4, 10, 28","1, 4, 16","−2, −1, 4"],"q":"<p>A 3 × 3 matrix A has eigenvalues 1, 2 and 4. The eigenvalues of A² − 3A are:<\/p>","a":0,"s":"<p>If Ax = λx then (A² − 3A)x = (λ² − 3λ)x: 1 − 3, 4 − 6, 16 − 12.<br>Other options: B — used λ² + 3λ; C — eigenvalues of A² only; D — arithmetic slip for λ = 2.<\/p>","tag":""},{"id":"2.2.27","m":1,"o":["(2, 1)","(1, 1)","(1, −1)","(1, 2)"],"q":"<p>An eigenvector of [2 1; 1 2] corresponding to the eigenvalue 3 is:<\/p>","a":1,"s":"<p>(A − 3I)x = 0 ⇒ −x₁ + x₂ = 0 ⇒ x₁ = x₂.<br>Other options: A — A(2, 1) = (5, 4), not a multiple; C — eigenvector for λ = 1; D — A(1, 2) = (4, 5), not a multiple.<\/p>","tag":""},{"id":"2.2.28","m":1,"o":["It has n linearly independent eigenvectors","All its eigenvalues are non-zero","It is non-singular","It is upper triangular"],"q":"<p>An n × n matrix A is diagonalizable if and only if:<\/p>","a":0,"s":"<p>Then P (columns = eigenvectors) is invertible and P⁻¹AP = D.<br>Other options: B — same as non-singular; irrelevant; C — a singular matrix can be diagonalizable and a non-singular one may not be; D — triangular matrices with repeated eigenvalues need not be diagonalizable.<\/p>","tag":""},{"id":"2.2.29","m":1,"o":["4","1024","244","20"],"q":"<p>A 2 × 2 matrix A satisfies P⁻¹AP = D = diag(1, 3) for some invertible P. The trace of A⁵ is:<\/p>","a":2,"s":"<p>A⁵ = P D⁵ P⁻¹, so trace A⁵ = 1⁵ + 3⁵ = 1 + 243.<br>Other options: A — trace of A, not A⁵; B — (1 + 3)⁵; D — 5 × trace A.<\/p>","tag":""},{"id":"2.2.30","m":1,"o":["Z = 4 at (0, 2)","Z = 12 at (4, 0)","Z = 18 at (6, 0)","Z = 11 at (3, 1)"],"q":"<p>Maximize Z = 3x + 2y subject to x + y ≤ 4, x + 3y ≤ 6, x ≥ 0, y ≥ 0 (corner-point method). The optimum is:<\/p>","a":1,"s":"<p>Corners: (0, 0) → 0, (4, 0) → 12, (3, 1) → 11, (0, 2) → 4. Maximum 12 at (4, 0).<br>Other options: A — smaller value; C — (6, 0) violates x + y ≤ 4; D — the intersection point is a corner but not the best one.<\/p>","tag":""}]},{"k":"2.3","t":"Vector Analysis","qs":[{"id":"2.3.1","m":1,"o":["−4","0","−8","4"],"q":"<p>For a = 2i − j + 2k and b = i + 2j − 2k, the dot product a·b is:<\/p>","a":0,"s":"<p>a·b = 2·1 + (−1)·2 + 2·(−2) = 2 − 2 − 4.<br>Other options: B — assumed perpendicular; C — doubled; D — sign slip in the last product.<\/p>","tag":""},{"id":"2.3.2","m":1,"o":["60°","45°","90°","30°"],"q":"<p>The angle between the vectors i + j and j + k is:<\/p>","a":0,"s":"<p>cos θ = 1/(√2·√2) = 1/2.<br>Other options: B — took cos θ = 1/√2; C — the vectors share the j component, so a·b ≠ 0; D — took sin θ = 1/2.<\/p>","tag":""},{"id":"2.3.3","m":1,"o":["20","20/3","20/9","20/7"],"q":"<p>The scalar projection of a = 2i + 3j + 6k on b = i + 2j + 2k is:<\/p>","a":1,"s":"<p>a·b/|b| = (2 + 6 + 12)/3.<br>Other options: A — did not divide by |b|; C — divided by |b|² (that gives the vector-projection coefficient); D — divided by |a| = 7 (projection of b on a).<\/p>","tag":""},{"id":"2.3.4","m":1,"o":["−i − 5j − 3k","2i + 2j + 3k","−i + 5j − 3k","i − 5j + 3k"],"q":"<p>For a = i + 2j + 3k and b = 2i + j + k, the cross product a × b is:<\/p>","a":2,"s":"<p>a × b = (2·1 − 3·1)i − (1·1 − 3·2)j + (1·1 − 2·2)k = −i + 5j − 3k.<br>Other options: A — forgot the minus sign on the j cofactor; B — multiplied components term by term; D — that is b × a.<\/p>","tag":""},{"id":"2.3.5","m":1,"o":["14","24","5","10"],"q":"<p>The area of the parallelogram with adjacent sides a = 2i and b = 3j + 4k is:<\/p>","a":3,"s":"<p>a × b = 2i × (3j + 4k) = 6k − 8j; |a × b| = √(36 + 64) = 10.<br>Other options: A — added the components 6 + 8 of a × b instead of taking its magnitude; B — multiplied 2 × 3 × 4; C — that is the triangle&#x27;s area.<\/p>","tag":""},{"id":"2.3.6","m":1,"o":["5/2","1","3/2","−5/2"],"q":"<p>The value of λ for which 2i + λj + k and i − 2j + 3k are perpendicular is:<\/p>","a":0,"s":"<p>2·1 − 2λ + 1·3 = 0 ⇒ λ = 5/2.<br>Other options: B — dropped the k components (2 − 2λ = 0); C — solved 2 − 2λ + 1 = 0; D — sign slip.<\/p>","tag":""},{"id":"2.3.7","m":1,"o":["37","49","−7","7"],"q":"<p>The volume of the parallelepiped with coterminous edges 2i − 3j + 4k, i + 2j − k and 3i − j + 2k is:<\/p>","a":3,"s":"<p>[a b c] = 2(4 − 1) + 3(2 + 3) + 4(−1 − 6) = 6 + 15 − 28 = −7; volume = |−7|.<br>Other options: A — sign slip on the middle cofactor; B — sign errors making all terms positive; C — volume is the absolute value of the box product.<\/p>","tag":""},{"id":"2.3.8","m":1,"o":["2/3","3","−3/2","3/2"],"q":"<p>The vectors i + 2j + 3k, 2i + λj + k and i + j + k are coplanar when λ equals:<\/p>","a":3,"s":"<p>[a b c] = 1(λ − 1) − 2(2 − 1) + 3(2 − λ) = 3 − 2λ = 0.<br>Other options: A — inverted; B — dropped the factor 2; C — sign slip.<\/p>","tag":""},{"id":"2.3.9","m":1,"o":["(a·b)c − (a·c)b","(a·c)b + (a·b)c","(a·c)b − (a·b)c","(b·c)a − (a·b)c"],"q":"<p>The vector triple product a × (b × c) equals:<\/p>","a":2,"s":"<p>Standard BAC − CAB expansion.<br>Other options: A — the negative of the correct expansion; B — sign of the second term wrong; D — the vector outside the bracket never multiplies a in this expansion.<\/p>","tag":""},{"id":"2.3.10","m":1,"o":["9","27","6","3"],"q":"<p>If [a b c] = 3, then [a × b, b × c, c × a] equals:<\/p>","a":0,"s":"<p>[a × b, b × c, c × a] = [a b c]².<br>Other options: B — cubed; C — doubled; D — forgot it is squared.<\/p>","tag":""},{"id":"2.3.11","m":1,"o":["(a·b)(c·d) − (a·d)(b·c)","(a·c)(b·d) − (a·d)(b·c)","(a·c)(b·d) + (a·d)(b·c)","[a b c]d − [a b d]c"],"q":"<p>For any four vectors, (a × b)·(c × d) equals:<\/p>","a":1,"s":"<p>Lagrange&#x27;s identity (scalar product of four vectors).<br>Other options: A — wrong pairing; C — sign of the second term wrong; D — that is a vector, not a scalar.<\/p>","tag":""},{"id":"2.3.12","m":1,"o":["−1","0","2","1"],"q":"<p>For a = i, b = j, c = i + j and d = j + k, the value of (a × b)·(c × d) is:<\/p>","a":3,"s":"<p>(a·c)(b·d) − (a·d)(b·c) = 1·1 − 0·1 = 1 (check: k·(i − j + k) = 1).<br>Other options: A — sign slip; B — assumed the cross products are perpendicular; C — added the two products.<\/p>","tag":""},{"id":"2.3.13","m":1,"o":["0","3","1","[a b c]"],"q":"<p>If a′, b′, c′ form the reciprocal system of a, b, c, then a·a′ + b·b′ + c·c′ equals:<\/p>","a":1,"s":"<p>a′ = (b × c)/[a b c] etc., so a·a′ = b·b′ = c·c′ = 1.<br>Other options: A — that is a·b′ type products; C — each term is 1, there are three; D — the box product cancels.<\/p>","tag":""},{"id":"2.3.14","m":1,"o":["1/[a b c]","1","[a b c]","[a b c]²"],"q":"<p>If a′, b′, c′ form the reciprocal system of the non-coplanar vectors a, b, c, then [a′ b′ c′] equals:<\/p>","a":0,"s":"<p>Standard property: [a b c][a′ b′ c′] = 1.<br>Other options: B — only true when [a b c] = 1; C — the volumes are reciprocal, not equal; D — confused with [a × b, b × c, c × a].<\/p>","tag":""},{"id":"2.3.15","m":1,"o":["4i + 2j + 3k","4i + 2j + 6k","2i + 2j + 3k","4i + j + 6k"],"q":"<p>The gradient of φ = x²y + yz³ at the point (1, 2, 1) is:<\/p>","a":1,"s":"<p>∇φ = 2xy i + (x² + z³) j + 3yz² k = 4i + 2j + 6k.<br>Other options: A — used 3z² instead of 3yz²; C — dropped the factor y in two terms; D — forgot the z³ term in ∂φ/∂y.<\/p>","tag":""},{"id":"2.3.16","m":1,"o":["−37/3","37","37/3","√165"],"q":"<p>The directional derivative of φ = x²yz + 4xz² at (1, −2, −1) in the direction of 2i − j − 2k is:<\/p>","a":2,"s":"<p>∇φ = (2xyz + 4z², x²z, x²y + 8xz) = (8, −1, −10); dot with (2, −1, −2)/3 = (16 + 1 + 20)/3.<br>Other options: A — sign slip; B — did not convert the direction to a unit vector; D — that is |∇φ|, the maximum rate.<\/p>","tag":""},{"id":"2.3.17","m":1,"o":["36","3","6","9"],"q":"<p>The maximum rate of change of φ = x² + y² + z² at the point (1, 2, 2) is:<\/p>","a":2,"s":"<p>Maximum directional derivative = |∇φ| = |(2, 4, 4)| = 6.<br>Other options: A — |∇φ|², forgot the root; B — |r| at the point, not |∇φ|; D — the value of φ.<\/p>","tag":""},{"id":"2.3.18","m":1,"o":["4","2","6","0"],"q":"<p>The divergence of F = x²y i − 2xz j + 2yz k at (1, 1, 1) is:<\/p>","a":0,"s":"<p>div F = ∂(x²y)/∂x + ∂(−2xz)/∂y + ∂(2yz)/∂z = 2xy + 0 + 2y = 4.<br>Other options: B — kept only one term; C — added an extra 2z by differentiating 2yz with respect to y; D — confused with div curl.<\/p>","tag":""},{"id":"2.3.19","m":1,"o":["Solenoidal only","Neither solenoidal nor irrotational","Both solenoidal and irrotational","Irrotational only"],"q":"<p>The vector field F = yz i + zx j + xy k is:<\/p>","a":2,"s":"<p>div F = 0 + 0 + 0 = 0 and curl F = (x − x)i + (y − y)j + (z − z)k = 0.<br>Other options: A — curl is also zero; B — both are zero; D — divergence is also zero.<\/p>","tag":""},{"id":"2.3.20","m":1,"o":["div (grad φ) = 0","curl (div F) = 0","grad (div F) = 0","div (curl F) = 0"],"q":"<p>Which of the following identities holds for every twice continuously differentiable vector field F?<\/p>","a":3,"s":"<p>Mixed partials cancel; similarly curl (grad φ) = 0.<br>Other options: A — that is Laplace&#x27;s equation, true only for harmonic φ; B — div F is a scalar, curl is not defined for it; C — not identically zero.<\/p>","tag":""},{"id":"2.3.21","m":1,"o":["2","−2","−1","0"],"q":"<p>F = (x + 3y) i + (y − 2z) j + (x + az) k is solenoidal when a equals:<\/p>","a":1,"s":"<p>div F = 1 + 1 + a = 0.<br>Other options: A — sign slip; C — missed one of the unit terms; D — solenoidal needs div F = 0, not a = 0.<\/p>","tag":""},{"id":"2.3.22","m":1,"o":["1 and 0","3 and 0","3 and r","0 and 3"],"q":"<p>For the position vector r = xi + yj + zk, the values of ∇·r and ∇ × r are respectively:<\/p>","a":1,"s":"<p>∇·r = 1 + 1 + 1; ∇ × r = 0 since each component depends only on its own variable.<br>Other options: A — counted only one component; C — curl of r is the zero vector; D — values swapped.<\/p>","tag":""},{"id":"2.3.23","m":1,"o":["1/2","2/3","1/3","1"],"q":"<p>The line integral ∫ (x² dx + xy dy) along the straight line y = x from (0, 0) to (1, 1) is:<\/p>","a":1,"s":"<p>With y = x, dy = dx: ∫₀¹ (x² + x²) dx = 2/3.<br>Other options: A — used ∫₀¹ x dx; C — kept only the x² dx term; D — integrated 2x instead.<\/p>","tag":""},{"id":"2.3.24","m":1,"o":["4","12","16","20"],"q":"<p>The work done by F = 3x² i + (2xz − y) j + z k along the straight line from (0, 0, 0) to (2, 1, 3) is:<\/p>","a":2,"s":"<p>x = 2t, y = t, z = 3t: F·dr/dt = 24t² + (12t² − t) + 9t = 36t² + 8t; ∫₀¹ = 12 + 4.<br>Other options: A — integrated only the 8t part; B — integrated only the 36t² part; D — arithmetic slip (used 36t² + 16t).<\/p>","tag":""},{"id":"2.3.25","m":1,"o":["5","6","3","2"],"q":"<p>F = 2xy i + x² j + k is conservative with potential φ = x²y + z. The work done by F from (0, 0, 0) to (1, 2, 3) is:<\/p>","a":0,"s":"<p>Work = φ(1, 2, 3) − φ(0, 0, 0) = 1·2 + 3 = 5.<br>Other options: B — computed 1·2·3; C — used only the z term; D — omitted the z term.<\/p>","tag":""},{"id":"2.3.26","m":1,"o":["4π","16π","2π","8π"],"q":"<p>Using Green&#x27;s theorem, ∮ (x dy − y dx) taken anticlockwise around the circle x² + y² = 4 equals:<\/p>","a":3,"s":"<p>∮ (x dy − y dx) = ∬ (1 + 1) dA = 2 × area = 2 × 4π.<br>Other options: A — the area, without the factor 2; B — used r² = 8; C — used r = 1.<\/p>","tag":""},{"id":"2.3.27","m":1,"o":["1/2","0","1","3/2"],"q":"<p>By Green&#x27;s theorem, ∮ (xy dx + x² dy) taken anticlockwise round the unit square 0 ≤ x ≤ 1, 0 ≤ y ≤ 1 equals:<\/p>","a":0,"s":"<p>∬ (∂Q/∂x − ∂P/∂y) dA = ∬ (2x − x) dA = ∫₀¹ x dx = 1/2.<br>Other options: B — assumed the field is conservative; C — used ∂Q/∂x = 2x only; D — added ∂P/∂y instead of subtracting.<\/p>","tag":""},{"id":"2.3.28","m":1,"o":["16π","32π/3","32π","96π"],"q":"<p>The outward flux of F = x i + y j + z k through the sphere x² + y² + z² = 4 is:<\/p>","a":2,"s":"<p>Gauss: ∭ div F dV = 3 × (4/3)π(2)³ = 32π.<br>Other options: A — surface area 4πr²; B — volume only, forgot div F = 3; D — multiplied 3 by an extra 3.<\/p>","tag":""},{"id":"2.3.29","m":1,"o":["The line integral of grad φ to the difference of φ only","A double integral over a plane region to a triple integral","The surface integral of F over a closed surface to the volume integral of div F","The line integral of F round a closed curve to the surface integral of curl F over a surface bounded by it"],"q":"<p>Stokes&#x27; theorem relates:<\/p>","a":3,"s":"<p>∮ F·dr = ∬ (∇ × F)·n dS.<br>Other options: A — that is the fundamental theorem for line integrals; B — no such theorem; C — that is the Gauss divergence theorem.<\/p>","tag":""},{"id":"2.3.30","m":1,"o":["3/2","3","6","1"],"q":"<p>Using the divergence theorem, the outward flux of F = x² i + y² j + z² k over the unit cube 0 ≤ x, y, z ≤ 1 is:<\/p>","a":1,"s":"<p>∭ (2x + 2y + 2z) dV = 3 × ∫₀¹ 2x dx = 3 × 1.<br>Other options: A — dropped the factor 2; C — evaluated 2(x + y + z) at (1, 1, 1); D — integrated only 2x.<\/p>","tag":""}]},{"k":"2.4","t":"Calculus","qs":[{"id":"2.4.1","m":1,"o":["0","1","5/3","3/5"],"q":"<p>The value of lim(x→0) sin 5x / sin 3x is:<\/p>","a":2,"s":"<p>sin kx ≈ kx near 0, so the ratio → 5x/3x.<br>Other options: A — substituted x = 0 in the numerator only; B — cancelled &#x27;sin&#x27; without the arguments; D — inverted.<\/p>","tag":""},{"id":"2.4.2","m":1,"o":["e³","1","e⁶","e^(3/2)"],"q":"<p>The value of lim(x→∞) (1 + 3/x)^(2x) is:<\/p>","a":2,"s":"<p>lim (1 + a/x)^(bx) = e^(ab) = e^(3·2).<br>Other options: A — ignored the exponent factor 2; B — treated 1^∞ as 1; D — divided a by b.<\/p>","tag":""},{"id":"2.4.3","m":1,"o":["2","1","0","1/2"],"q":"<p>The value of lim(x→0) (1 − cos x)/x² is:<\/p>","a":3,"s":"<p>Applying L&#x27;Hôpital twice: sin x/(2x) → cos x/2 → 1/2 (or 1 − cos x = 2 sin²(x/2)).<br>Other options: A — inverted 1/2; B — confused with lim sin x/x; C — stopped after one substitution.<\/p>","tag":""},{"id":"2.4.4","m":1,"o":["−1/6","1/3","0","1/2"],"q":"<p>Using L&#x27;Hôpital&#x27;s rule, lim(x→0) (tan x − x)/x³ equals:<\/p>","a":1,"s":"<p>tan x = x + x³/3 + …, so (tan x − x)/x³ → 1/3.<br>Other options: A — that is the limit of (sin x − x)/x³; C — stopped at 0/0 without further differentiation; D — used the 1 − cos x series.<\/p>","tag":""},{"id":"2.4.5","m":1,"o":["6","0","9","3"],"q":"<p>f(x) = (x² − 9)/(x − 3) for x ≠ 3 and f(3) = k. For f to be continuous at x = 3, k must be:<\/p>","a":0,"s":"<p>lim(x→3) (x + 3) = 6 must equal f(3).<br>Other options: B — substituted x = 3 in the numerator; C — took lim = x²; D — took lim = x.<\/p>","tag":""},{"id":"2.4.6","m":1,"o":["Continuous but not differentiable","Differentiable but not continuous","Both continuous and differentiable","Neither continuous nor differentiable"],"q":"<p>At x = 0, the function f(x) = |x| is:<\/p>","a":0,"s":"<p>Left derivative −1 ≠ right derivative +1, though the limit equals f(0) = 0.<br>Other options: B — differentiability always implies continuity; C — the corner at 0 has unequal one-sided derivatives; D — |x| has no jump at 0.<\/p>","tag":""},{"id":"2.4.7","m":1,"o":["x·xˣ⁻¹","xˣ(1 + ln x)","xˣ(1 − ln x)","xˣ ln x"],"q":"<p>The derivative of y = xˣ (x &gt; 0) is:<\/p>","a":1,"s":"<p>ln y = x ln x ⇒ y′/y = ln x + 1.<br>Other options: A — used the power rule with a variable exponent; C — sign error; D — used the exponential rule only.<\/p>","tag":""},{"id":"2.4.8","m":1,"o":["−cot t","tan t","cot t","−tan t"],"q":"<p>If x = a cos t and y = a sin t, then dy/dx equals:<\/p>","a":0,"s":"<p>dy/dx = (dy/dt)/(dx/dt) = a cos t/(−a sin t).<br>Other options: B — inverted and lost the sign; C — lost the minus sign of dx/dt; D — inverted the ratio.<\/p>","tag":""},{"id":"2.4.9","m":1,"o":["12x²y","6x²y","2x³","6xy²"],"q":"<p>If u = x³y², then ∂²u/∂x∂y equals:<\/p>","a":1,"s":"<p>∂u/∂y = 2x³y; ∂/∂x of that = 6x²y.<br>Other options: A — doubled; C — that is ∂²u/∂y²; D — that is ∂²u/∂x².<\/p>","tag":""},{"id":"2.4.10","m":1,"o":["4u","5u","3u","u"],"q":"<p>If u = (x⁴ + y⁴)/(x + y), then by Euler&#x27;s theorem x ∂u/∂x + y ∂u/∂y equals:<\/p>","a":2,"s":"<p>u is homogeneous of degree 4 − 1 = 3, so x u_x + y u_y = n u = 3u.<br>Other options: A — took the degree of the numerator only; B — added the degrees; D — assumed degree 1.<\/p>","tag":""},{"id":"2.4.11","m":1,"o":["tan u","u","sin u","2 tan u"],"q":"<p>If u = sin⁻¹[(x² + y²)/(x + y)], then x ∂u/∂x + y ∂u/∂y equals:<\/p>","a":0,"s":"<p>sin u = (x² + y²)/(x + y) is homogeneous of degree 1: x u_x + y u_y = 1·sin u/cos u = tan u.<br>Other options: B — applied Euler&#x27;s theorem to u itself, which is not homogeneous; C — forgot to divide by the derivative of sin u; D — took the degree as 2.<\/p>","tag":""},{"id":"2.4.12","m":1,"o":["3","5","1","9"],"q":"<p>The local maximum value of f(x) = x³ − 6x² + 9x + 1 is:<\/p>","a":1,"s":"<p>f′ = 3(x − 1)(x − 3); f″(1) = −6 &lt; 0, so maximum at x = 1: f(1) = 1 − 6 + 9 + 1 = 5.<br>Other options: A — the x-coordinate of the minimum; C — that is the local minimum f(3); D — a coefficient, not a value of f.<\/p>","tag":""},{"id":"2.4.13","m":1,"o":["99","100","200","400"],"q":"<p>Two positive numbers have sum 20. The maximum value of their product is:<\/p>","a":1,"s":"<p>P = x(20 − x), P′ = 0 at x = 10, P = 10 × 10.<br>Other options: A — used 9 × 11; C — doubled; D — squared the sum.<\/p>","tag":""},{"id":"2.4.14","m":1,"o":["−5","−13","0","13"],"q":"<p>The minimum value of f(x, y) = x² + y² − 4x + 6y is:<\/p>","a":1,"s":"<p>Stationary point (2, −3); f = 4 + 9 − 8 − 18 = −13 (rt − s² = 4 &gt; 0, r &gt; 0 ⇒ minimum).<br>Other options: A — completed the square incorrectly (−4 − 1); C — value at the origin, not the minimum; D — sign slip.<\/p>","tag":""},{"id":"2.4.15","m":1,"o":["rt − s² &gt; 0 and r &lt; 0","rt − s² &lt; 0","rt − s² = 0","rt − s² &gt; 0 and r &gt; 0"],"q":"<p>For f(x, y) with r = f_xx, s = f_xy, t = f_yy at a stationary point, the point is a saddle point when:<\/p>","a":1,"s":"<p>rt − s² &gt; 0 gives an extremum (max if r &lt; 0, min if r &gt; 0); rt − s² &lt; 0 a saddle.<br>Other options: A — gives a maximum; C — test is inconclusive; D — gives a minimum.<\/p>","tag":""},{"id":"2.4.16","m":1,"o":["x²eˣ/2 + C","(x + 1)eˣ + C","x eˣ + C","(x − 1)eˣ + C"],"q":"<p>∫ x eˣ dx equals:<\/p>","a":3,"s":"<p>By parts: x eˣ − ∫ eˣ dx.<br>Other options: A — integrated x and eˣ separately; B — sign slip in integration by parts; C — forgot the second term.<\/p>","tag":""},{"id":"2.4.17","m":1,"o":["(1/2) tan⁻¹(x/2) + C","(1/4) tan⁻¹(x/2) + C","(1/4) ln|(x − 2)/(x + 2)| + C","tan⁻¹(x/2) + C"],"q":"<p>∫ dx/(x² + 4) equals:<\/p>","a":0,"s":"<p>∫ dx/(x² + a²) = (1/a) tan⁻¹(x/a) + C with a = 2.<br>Other options: B — used 1/a²; C — that is ∫ dx/(x² − 4); D — missed the factor 1/a.<\/p>","tag":""},{"id":"2.4.18","m":1,"o":["π/4","1","1/2","π/2"],"q":"<p>The value of ∫₀^(π/2) sin²x dx is:<\/p>","a":0,"s":"<p>sin²x = (1 − cos 2x)/2; ∫ = π/4 − 0.<br>Other options: B — integrated sin x instead; C — dropped π; D — took sin²x as 1.<\/p>","tag":""},{"id":"2.4.19","m":1,"o":["1/6","1/30","1/42","1/56"],"q":"<p>The value of ∫₀¹ x(1 − x)⁵ dx is:<\/p>","a":2,"s":"<p>Beta function B(2, 6) = 1!·5!/7! = 120/5040.<br>Other options: A — integrated (1 − x)⁵ only; B — used B(2, 5); D — used B(2, 7).<\/p>","tag":""},{"id":"2.4.20","m":1,"o":["π","2","0","π/2"],"q":"<p>The value of ∫₀^π x sin x dx is:<\/p>","a":0,"s":"<p>By parts: [−x cos x]₀^π + ∫ cos x dx = π + 0.<br>Other options: B — that is ∫₀^π sin x dx; C — assumed odd symmetry, which does not apply on [0, π]; D — halved.<\/p>","tag":""},{"id":"2.4.21","m":1,"o":["5/6","1/2","1/3","1/6"],"q":"<p>The area enclosed between the curves y = x² and y = x is:<\/p>","a":3,"s":"<p>They meet at x = 0, 1: ∫₀¹ (x − x²) dx = 1/2 − 1/3.<br>Other options: A — added the two areas; B — area under y = x only; C — area under y = x² only.<\/p>","tag":""},{"id":"2.4.22","m":1,"o":["4/3","16/3","8/3","2/3"],"q":"<p>The area bounded by the parabola y² = 4x and its latus rectum x = 1 is:<\/p>","a":2,"s":"<p>Area = 2∫₀¹ 2√x dx = 4 × (2/3).<br>Other options: A — only the half above the x-axis; B — doubled twice; D — integrated √x without the factor 2 and for one half only.<\/p>","tag":""},{"id":"2.4.23","m":1,"o":["64π/3","4π","16π/3","8π"],"q":"<p>The volume generated by revolving the region under y = √x, 0 ≤ x ≤ 4, about the x-axis is:<\/p>","a":3,"s":"<p>V = π∫₀⁴ y² dx = π∫₀⁴ x dx = π × 8.<br>Other options: A — used π∫ x² dx; B — halved; C — used π∫ y dx (did not square y).<\/p>","tag":""},{"id":"2.4.24","m":1,"o":["Order 2, degree 1","Order 1, degree 3","Order 2, degree 2","Order 2, degree 3/2"],"q":"<p>The order and degree of the differential equation [1 + (dy/dx)²]^(3/2) = d²y/dx² are:<\/p>","a":2,"s":"<p>Squaring to remove the fractional power: [1 + (y′)²]³ = (y″)²; highest derivative y″, its power 2.<br>Other options: A — read the degree before making the equation polynomial in derivatives; B — took y′ as the highest derivative; D — degree must be a positive integer.<\/p>","tag":""},{"id":"2.4.25","m":1,"o":["y = 1 + x²/2","y = eˣ","y = e^(x²)","y = e^(x²/2)"],"q":"<p>The solution of dy/dx = xy with y(0) = 1 is:<\/p>","a":3,"s":"<p>Separate: dy/y = x dx ⇒ ln y = x²/2 + C, C = 0.<br>Other options: A — only the first two terms of the series; B — integrated x as 1; C — forgot the 1/2.<\/p>","tag":""},{"id":"2.4.26","m":1,"o":["x²","2 ln x","e^(2x)","1/x²"],"q":"<p>The integrating factor of dy/dx + (2/x)y = x² is:<\/p>","a":0,"s":"<p>IF = e^(∫ 2/x dx) = e^(2 ln x) = x².<br>Other options: B — forgot to exponentiate; C — integrated 2/x as 2x; D — sign of the exponent wrong.<\/p>","tag":""},{"id":"2.4.27","m":1,"o":["−2","4","0","2"],"q":"<p>The equation (4x³y + y²) dx + (x⁴ + kxy) dy = 0 is exact when k equals:<\/p>","a":3,"s":"<p>∂M/∂y = 4x³ + 2y must equal ∂N/∂x = 4x³ + ky.<br>Other options: A — sign slip; B — matched the x³ coefficient; C — ignored the y² term.<\/p>","tag":""},{"id":"2.4.28","m":1,"o":["y = (C₁ + C₂x)e^(5x)","y = C₁ cos 2x + C₂ sin 3x","y = C₁e^(2x) + C₂e^(3x)","y = C₁e^(−2x) + C₂e^(−3x)"],"q":"<p>The general solution of y″ − 5y′ + 6y = 0 is:<\/p>","a":2,"s":"<p>Auxiliary equation m² − 5m + 6 = 0 ⇒ m = 2, 3.<br>Other options: A — treated as a repeated root; B — roots are real, not imaginary; D — root signs wrong.<\/p>","tag":""},{"id":"2.4.29","m":1,"o":["y = C₁e^(−2x) + C₂e^(3x)","y = e^(2x)(C₁ cos 3x + C₂ sin 3x)","y = e^(−3x)(C₁ cos 2x + C₂ sin 2x)","y = e^(−2x)(C₁ cos 3x + C₂ sin 3x)"],"q":"<p>The general solution of y″ + 4y′ + 13y = 0 is:<\/p>","a":3,"s":"<p>m² + 4m + 13 = 0 ⇒ m = −2 ± 3i.<br>Other options: A — treated complex roots as real; B — sign of the real part wrong; C — real and imaginary parts swapped.<\/p>","tag":""},{"id":"2.4.30","m":1,"o":["e^(3x)/20","e^(3x)/2","2e^(3x)","x e^(3x)"],"q":"<p>The particular integral of y″ − 3y′ + 2y = e^(3x) is:<\/p>","a":1,"s":"<p>PI = e^(ax)/f(a) with f(D) = D² − 3D + 2, f(3) = 9 − 9 + 2 = 2.<br>Other options: A — used f(3) = 9 + 9 + 2; C — multiplied by f(3) instead of dividing; D — 3 is not a root of the auxiliary equation, so no x factor.<\/p>","tag":""}]},{"k":"2.5","t":"Elementary Statistics and Probability","qs":[{"id":"2.5.1","m":1,"o":["6","40","10","8"],"q":"<p>The arithmetic mean of 4, 8, 6, 10 and 12 is:<\/p>","a":3,"s":"<p>Sum = 40, n = 5, mean = 40/5.<br>Other options: A — picked the middle value of the unsorted list; B — the sum, not the mean; C — divided by 4.<\/p>","tag":""},{"id":"2.5.2","m":1,"o":["7","9","6","8"],"q":"<p>The median of the data 7, 3, 9, 5, 11, 13 is:<\/p>","a":3,"s":"<p>Sorted: 3, 5, 7, 9, 11, 13; median = (7 + 9)/2.<br>Other options: A — took the 3rd value only; B — took the 4th value only; C — averaged the 2nd and 3rd sorted values (5 + 7)/2.<\/p>","tag":""},{"id":"2.5.3","m":1,"o":["36","39","34","42"],"q":"<p>For a moderately skewed distribution the mean is 40 and the median is 38. Using the empirical relation, the mode is about:<\/p>","a":2,"s":"<p>Mode = 3 Median − 2 Mean = 114 − 80.<br>Other options: A — used 2 Median − Mean; B — averaged mean and median; D — used 3 Mean − 2 Median.<\/p>","tag":""},{"id":"2.5.4","m":1,"o":["4","2","32","√(32/7)"],"q":"<p>The population standard deviation of 2, 4, 4, 4, 5, 5, 7, 9 is:<\/p>","a":1,"s":"<p>Mean 5; deviations² sum = 9 + 1 + 1 + 1 + 0 + 0 + 4 + 16 = 32; σ² = 32/8 = 4.<br>Other options: A — that is the variance; C — sum of squared deviations; D — sample SD (n − 1), not the population SD asked for.<\/p>","tag":""},{"id":"2.5.5","m":1,"o":["41","12","36","17"],"q":"<p>A data set has variance 4. If every value is multiplied by 3 and then increased by 5, the new variance is:<\/p>","a":2,"s":"<p>Var(aX + b) = a² Var(X) = 9 × 4; adding a constant does not change spread.<br>Other options: A — added the constant 5 to 9 × 4; a shift does not change variance; B — multiplied by a instead of a²; D — 3 × 4 + 5.<\/p>","tag":""},{"id":"2.5.6","m":1,"o":["500%","0.2%","20%","40%"],"q":"<p>A series has mean 50 and standard deviation 10. Its coefficient of variation is:<\/p>","a":2,"s":"<p>CV = σ/x̄ × 100 = 10/50 × 100.<br>Other options: A — x̄/σ × 100; B — wrote σ/x̄ = 0.2 as a percentage without multiplying by 100; D — used 2σ in the numerator.<\/p>","tag":""},{"id":"2.5.7","m":1,"o":["70","36","35","34"],"q":"<p>Group I has 20 observations with mean 30 and group II has 30 observations with mean 40. The combined mean is:<\/p>","a":1,"s":"<p>(20 × 30 + 30 × 40)/50 = 1800/50.<br>Other options: A — added the means; C — simple average of the two means; D — weights swapped.<\/p>","tag":""},{"id":"2.5.8","m":1,"o":["−1 ≤ r ≤ 1","0 ≤ r ≤ 1","−∞ &lt; r &lt; ∞","r ≥ 1"],"q":"<p>Karl Pearson&#x27;s correlation coefficient r always satisfies:<\/p>","a":0,"s":"<p>r = cov(X, Y)/(σx σy) and |cov| ≤ σx σy by the Cauchy–Schwarz inequality.<br>Other options: B — r can be negative; C — r is bounded; D — only ±1 at perfect linearity.<\/p>","tag":""},{"id":"2.5.9","m":1,"o":["0.5","0.4","−0.4","0.16"],"q":"<p>If the regression coefficients are b_yx = 0.8 and b_xy = 0.2, the correlation coefficient r is:<\/p>","a":1,"s":"<p>r = ±√(b_yx · b_xy) = √0.16, positive because both coefficients are positive.<br>Other options: A — arithmetic mean of the coefficients; C — sign must match the coefficients; D — forgot the square root.<\/p>","tag":""},{"id":"2.5.10","m":1,"o":["(26, 31)","(7, 4)","(5, 5.5)","(4, 7)"],"q":"<p>The two regression lines of a bivariate data set are 3x + 2y = 26 and 6x + y = 31. The means (x̄, ȳ) are:<\/p>","a":3,"s":"<p>Both lines pass through (x̄, ȳ): solving gives x = 4, y = 7.<br>Other options: A — used the constants; B — values swapped; C — solution of only the first line with x = 5.<\/p>","tag":""},{"id":"2.5.11","m":1,"o":["3","0.6","2.4","0.15"],"q":"<p>If cov(X, Y) = 12, σx = 4 and σy = 5, the correlation coefficient is:<\/p>","a":1,"s":"<p>r = 12/(4 × 5).<br>Other options: A — divided by 4 only; C — divided by 5 only; D — divided by 4 × 5 × 4.<\/p>","tag":""},{"id":"2.5.12","m":1,"o":["0.25","−0.5","0.75","0.5"],"q":"<p>For 5 pairs of ranks, Σd² = 10. Spearman&#x27;s rank correlation coefficient is:<\/p>","a":3,"s":"<p>ρ = 1 − 6Σd²/[n(n² − 1)] = 1 − 60/120.<br>Other options: A — squared the answer; B — computed 6Σd²/n(n²−1) − 1; C — used n(n² − 1) = 240: 1 − 60/240.<\/p>","tag":""},{"id":"2.5.13","m":1,"o":["2","0.5","1","0.25"],"q":"<p>If r = 0.5, σx = 2 and σy = 4, the regression coefficient of y on x (b_yx) is:<\/p>","a":2,"s":"<p>b_yx = r σy/σx = 0.5 × 4/2.<br>Other options: A — omitted r; B — took b_yx = r; D — that is b_xy = r σx/σy.<\/p>","tag":""},{"id":"2.5.14","m":1,"o":["1/6","5/12","5/36","1/9"],"q":"<p>Two fair dice are thrown. The probability that the sum is 8 is:<\/p>","a":2,"s":"<p>Favourable: (2,6), (3,5), (4,4), (5,3), (6,2) = 5 of 36.<br>Other options: A — that is the probability of sum 7; B — divided by 12 instead of 36; D — 4 favourable cases (missed (4,4)).<\/p>","tag":""},{"id":"2.5.15","m":1,"o":["1/52","4/13","17/52","1/4"],"q":"<p>A card is drawn from a well-shuffled pack of 52. The probability that it is a king or a heart is:<\/p>","a":1,"s":"<p>P = 4/52 + 13/52 − 1/52 = 16/52 (king of hearts counted once).<br>Other options: A — P(king and heart); C — counted the king of hearts twice; D — P(heart) only.<\/p>","tag":""},{"id":"2.5.16","m":1,"o":["0.3","0.9","0.2","0.7"],"q":"<p>A and B are independent events with P(A) = 0.5 and P(B) = 0.4. Then P(A ∪ B) is:<\/p>","a":3,"s":"<p>P(A ∪ B) = 0.5 + 0.4 − 0.5 × 0.4.<br>Other options: A — that is P(A ∩ B′) = 0.5 × 0.6 only; B — treated as mutually exclusive; C — that is P(A ∩ B).<\/p>","tag":""},{"id":"2.5.17","m":1,"o":["0.7","0.4","2.5","0.1"],"q":"<p>If P(A ∩ B) = 0.2 and P(B) = 0.5, then P(A | B) is:<\/p>","a":1,"s":"<p>P(A | B) = P(A ∩ B)/P(B).<br>Other options: A — added; C — inverted (a probability cannot exceed 1); D — multiplied instead of dividing.<\/p>","tag":""},{"id":"2.5.18","m":1,"o":["Not independent","Exhaustive","Independent only if P(A) = P(B)","Always independent"],"q":"<p>If A and B are mutually exclusive events with P(A) &gt; 0 and P(B) &gt; 0, then A and B are:<\/p>","a":0,"s":"<p>P(A ∩ B) = 0 ≠ P(A)P(B) &gt; 0.<br>Other options: B — exhaustive means P(A ∪ B) = 1, not implied; C — still P(A ∩ B) = 0; D — independence needs P(A ∩ B) = P(A)P(B).<\/p>","tag":""},{"id":"2.5.19","m":1,"o":["6/17","5/17","0.2","0.017"],"q":"<p>Machines A, B and C produce 50%, 30% and 20% of a factory&#x27;s bolts with defective rates 1%, 2% and 3% respectively. A bolt chosen at random is defective. The probability that it came from C is:<\/p>","a":0,"s":"<p>P(D) = 0.005 + 0.006 + 0.006 = 0.017; Bayes: P(C | D) = 0.006/0.017.<br>Other options: B — that is P(A | D); C — the prior P(C), ignoring the evidence; D — that is P(D).<\/p>","tag":""},{"id":"2.5.20","m":1,"o":["0.6","0.7","0.8","0.35"],"q":"<p>Urn I contains 3 red and 2 black balls; urn II contains 4 red and 1 black ball. An urn is chosen at random and a ball drawn. The probability that the ball is red is:<\/p>","a":1,"s":"<p>Total probability: ½(3/5) + ½(4/5) = 0.7.<br>Other options: A — used urn I only; C — used urn II only; D — forgot one of the urns.<\/p>","tag":""},{"id":"2.5.21","m":1,"o":["15/64","1/16","4/6","15/32"],"q":"<p>A fair coin is tossed 6 times. The probability of getting exactly 4 heads is:<\/p>","a":0,"s":"<p>C(6, 4)(½)⁶ = 15/64.<br>Other options: B — (½)⁴ only; C — ratio of heads to tosses; D — used (½)⁵.<\/p>","tag":""},{"id":"2.5.22","m":1,"o":["4 and 6","4 and 1.55","2.4 and 4","4 and 2.4"],"q":"<p>For a binomial distribution with n = 10 and p = 0.4, the mean and variance are:<\/p>","a":3,"s":"<p>Mean np = 4; variance npq = 10 × 0.4 × 0.6.<br>Other options: A — variance taken as nq; B — 1.55 is the SD, not the variance; C — swapped.<\/p>","tag":""},{"id":"2.5.23","m":1,"o":["16","12","7","4"],"q":"<p>A binomial distribution has mean 4 and variance 3. The number of trials n is:<\/p>","a":0,"s":"<p>q = 3/4, p = 1/4, n = 4/p.<br>Other options: B — used n = 4 × 3; C — added mean and variance; D — took n = mean.<\/p>","tag":""},{"id":"2.5.24","m":1,"o":["0.406","0.271","0.594","0.135"],"q":"<p>The number of calls per minute at an exchange follows a Poisson distribution with mean 2. The probability of at most one call in a minute is about (e⁻² = 0.1353):<\/p>","a":0,"s":"<p>P(0) + P(1) = e⁻²(1 + 2) = 3 × 0.1353.<br>Other options: B — P(1) only; C — 1 − P(X ≤ 1); D — P(0) only.<\/p>","tag":""},{"id":"2.5.25","m":1,"o":["1","0.5","2","√2"],"q":"<p>For a Poisson variable X, P(X = 1) = P(X = 2). The mean of X is:<\/p>","a":2,"s":"<p>λe^(−λ) = λ²e^(−λ)/2 ⇒ λ = 2.<br>Other options: A — solved λ = λ²; B — inverted; D — solved λ² = 2.<\/p>","tag":""},{"id":"2.5.26","m":1,"o":["0.2707","0.3679","0.8647","0.1353"],"q":"<p>The probability that a bolt is defective is 0.01. Using the Poisson approximation, the probability that a box of 200 bolts contains exactly one defective is (e⁻² = 0.1353):<\/p>","a":0,"s":"<p>λ = np = 2; P(1) = λe^(−λ) = 2 × 0.1353.<br>Other options: B — used λ = 1 (e⁻¹); C — P(X ≥ 1); D — P(0).<\/p>","tag":""},{"id":"2.5.27","m":1,"o":["0.0456","0.9772","0.4772","0.0228"],"q":"<p>Marks are normally distributed with mean 60 and SD 5. Given Φ(2) = 0.9772, the proportion of students scoring above 70 is:<\/p>","a":3,"s":"<p>z = (70 − 60)/5 = 2; P(Z &gt; 2) = 1 − 0.9772.<br>Other options: A — both tails; B — that is P(X &lt; 70); C — area between the mean and z = 2.<\/p>","tag":""},{"id":"2.5.28","m":1,"o":["99.73%","90%","95.45%","68.27%"],"q":"<p>For a normal distribution, the percentage of the area lying within μ ± 2σ is about:<\/p>","a":2,"s":"<p>Standard values: ±1σ 68.27%, ±2σ 95.45%, ±3σ 99.73%.<br>Other options: A — the ±3σ value; B — the ±1.645σ value; D — the ±1σ value.<\/p>","tag":""},{"id":"2.5.29","m":1,"o":["Mean, median and mode coincide","It is positively skewed","It is defined only for x ≥ 0","Its variance equals its mean"],"q":"<p>Which statement about the normal distribution is true?<\/p>","a":0,"s":"<p>The curve is symmetric and unimodal about μ; skewness is zero.<br>Other options: B — it is symmetric; C — it extends over −∞ &lt; x &lt; ∞; D — that is the Poisson property.<\/p>","tag":""},{"id":"2.5.30","m":1,"o":["0.3413","0.6826","0.1587","0.8413"],"q":"<p>X is normal with mean 50 and SD 10. Given Φ(1) = 0.8413, P(40 &lt; X &lt; 60) is:<\/p>","a":1,"s":"<p>z = ±1; P = 2Φ(1) − 1.<br>Other options: A — only one side of the mean; C — P(X &gt; 60); D — P(X &lt; 60).<\/p>","tag":""}]},{"k":"2.6","t":"Elementary Trigonometry and Logarithm","qs":[{"id":"2.6.1","m":1,"o":["(√6 + √2)/4","(√6 − √2)/4","(√3 + 1)/2","√3/2 + 1/2"],"q":"<p>The exact value of sin 75° is:<\/p>","a":0,"s":"<p>sin(45° + 30°) = (1/√2)(√3/2) + (1/√2)(1/2) = (√3 + 1)/(2√2).<br>Other options: B — that is sin 15°; C — forgot the factor 1/√2; D — added sin 60° and sin 30°.<\/p>","tag":""},{"id":"2.6.2","m":1,"o":["√3 − 1","2 + √3","1/√3","2 − √3"],"q":"<p>The exact value of tan 15° is:<\/p>","a":3,"s":"<p>tan(45° − 30°) = (1 − 1/√3)/(1 + 1/√3) = (√3 − 1)/(√3 + 1) = 2 − √3.<br>Other options: A — only the numerator; B — that is tan 75°; C — that is tan 30°.<\/p>","tag":""},{"id":"2.6.3","m":1,"o":["π/6","π/3","π/2","π/4"],"q":"<p>If tan A = 1/2 and tan B = 1/3 (A, B acute), then A + B equals:<\/p>","a":3,"s":"<p>tan(A + B) = (1/2 + 1/3)/(1 − 1/6) = 1.<br>Other options: A — took tan(A + B) = 1/√3; B — took tan(A + B) = √3; C — assumed the denominator vanishes.<\/p>","tag":""},{"id":"2.6.4","m":1,"o":["7/25","16/25","24/25","−7/25"],"q":"<p>If tan θ = 3/4, then cos 2θ equals:<\/p>","a":0,"s":"<p>cos 2θ = (1 − tan²θ)/(1 + tan²θ) = (7/16)/(25/16).<br>Other options: B — that is cos²θ; C — that is sin 2θ; D — sign slip.<\/p>","tag":""},{"id":"2.6.5","m":1,"o":["31/27","23/27","1","4/27"],"q":"<p>If sin θ = 1/3, then sin 3θ equals:<\/p>","a":1,"s":"<p>sin 3θ = 3 sin θ − 4 sin³θ = 1 − 4/27.<br>Other options: A — added the cube term; C — kept only 3 sin θ; D — kept only 4 sin³θ.<\/p>","tag":""},{"id":"2.6.6","m":1,"o":["25","5","7","1"],"q":"<p>The maximum value of 3 sin x + 4 cos x is:<\/p>","a":1,"s":"<p>a sin x + b cos x has maximum √(a² + b²) = √25.<br>Other options: A — forgot the square root; C — added the coefficients; D — the maximum of sin x alone.<\/p>","tag":""},{"id":"2.6.7","m":1,"o":["3/8","√3/8","√3/4","1/8"],"q":"<p>The value of sin 20° · sin 40° · sin 80° is:<\/p>","a":1,"s":"<p>sin θ sin(60° − θ) sin(60° + θ) = (1/4) sin 3θ; θ = 20° gives (1/4) sin 60°.<br>Other options: A — used sin 60° = 3/2; C — used (1/2) sin 3θ instead of (1/4) sin 3θ; D — that is cos 20° cos 40° cos 80°.<\/p>","tag":""},{"id":"2.6.8","m":1,"o":["1/8","1/4","√3/8","1/2"],"q":"<p>The value of cos 20° · cos 40° · cos 80° is:<\/p>","a":0,"s":"<p>cos θ cos(60° − θ) cos(60° + θ) = (1/4) cos 3θ; θ = 20° gives (1/4)(1/2).<br>Other options: B — omitted cos 60°; C — that is the sine product; D — that is cos 60° only.<\/p>","tag":""},{"id":"2.6.9","m":1,"o":["2 cos((C + D)/2) sin((C − D)/2)","2 cos((C + D)/2) cos((C − D)/2)","2 sin((C + D)/2) cos((C − D)/2)","sin(C + D)"],"q":"<p>The identity for sin C + sin D is:<\/p>","a":2,"s":"<p>Standard sum-to-product formula.<br>Other options: A — that is sin C − sin D; B — that is cos C + cos D; D — sine is not additive.<\/p>","tag":""},{"id":"2.6.10","m":1,"o":["−π/4","3π/4","π/2","π/4"],"q":"<p>The value of tan⁻¹2 + tan⁻¹3 is:<\/p>","a":1,"s":"<p>xy = 6 &gt; 1 with x, y &gt; 0, so the sum = π + tan⁻¹[(2 + 3)/(1 − 6)] = π − π/4.<br>Other options: A — took tan⁻¹(−1) directly; both angles are positive; C — assumed xy = 1; D — omitted the π correction needed when xy &gt; 1.<\/p>","tag":""},{"id":"2.6.11","m":1,"o":["π/2","π/4","0","π"],"q":"<p>For −1 ≤ x ≤ 1, sin⁻¹x + cos⁻¹x equals:<\/p>","a":0,"s":"<p>Complementary angles: if sin⁻¹x = θ then cos⁻¹x = π/2 − θ.<br>Other options: B — value at x = 1/√2 of each term, not the sum; C — only sin⁻¹x + sin⁻¹(−x) = 0; D — that is the value of cos⁻¹x + cos⁻¹(−x).<\/p>","tag":""},{"id":"2.6.12","m":1,"o":["π/3","−π/3","4π/3","2π/3"],"q":"<p>The principal value of cos⁻¹(−1/2) is:<\/p>","a":3,"s":"<p>Principal range of cos⁻¹ is [0, π]; cos⁻¹(−x) = π − cos⁻¹x = π − π/3.<br>Other options: A — that is cos⁻¹(1/2); B — outside [0, π]; C — outside [0, π].<\/p>","tag":""},{"id":"2.6.13","m":1,"o":["3/5","1","2/√5","4/5"],"q":"<p>The value of sin(2 tan⁻¹(1/2)) is:<\/p>","a":3,"s":"<p>sin 2θ = 2 tan θ/(1 + tan²θ) = 1/(5/4).<br>Other options: A — that is cos 2θ; B — took sin 2θ = 2 tan θ; C — computed 2 sin θ instead of sin 2θ.<\/p>","tag":""},{"id":"2.6.14","m":1,"o":["θ = nπ ± π/6","θ = nπ + π/6","θ = nπ + (−1)ⁿ π/6","θ = 2nπ ± π/6"],"q":"<p>The general solution of sin θ = 1/2 is:<\/p>","a":2,"s":"<p>sin θ = sin α ⇒ θ = nπ + (−1)ⁿ α, n ∈ ℤ.<br>Other options: A — includes −π/6, where sin θ = −1/2; B — that is the form for tan θ = tan α; D — that is the form for cos θ = cos α.<\/p>","tag":""},{"id":"2.6.15","m":1,"o":["θ = 2nπ ± π/3","θ = nπ + π/6","θ = nπ + π/3","θ = nπ + (−1)ⁿ π/3"],"q":"<p>The general solution of tan θ = √3 is:<\/p>","a":2,"s":"<p>tan θ = tan α ⇒ θ = nπ + α.<br>Other options: A — cosine form; B — π/6 has tan = 1/√3; D — sine form.<\/p>","tag":""},{"id":"2.6.16","m":1,"o":["1","4","2","3"],"q":"<p>The number of solutions of 2cos²x − 3cos x + 1 = 0 in 0 ≤ x &lt; 2π is:<\/p>","a":3,"s":"<p>(2cos x − 1)(cos x − 1) = 0 ⇒ cos x = 1/2 (x = π/3, 5π/3) or cos x = 1 (x = 0).<br>Other options: A — kept only cos x = 1; B — counted cos x = 1 twice (0 and 2π, but 2π is excluded); C — counted one value per root of the quadratic.<\/p>","tag":""},{"id":"2.6.17","m":1,"o":["12 cm","6√3 cm","3 cm","6 cm"],"q":"<p>In triangle ABC, a = 6 cm and A = 30°. The circumradius R is:<\/p>","a":3,"s":"<p>a/sin A = 2R ⇒ 2R = 6/0.5 = 12.<br>Other options: A — that is 2R; B — used cos A; C — computed a sin A.<\/p>","tag":""},{"id":"2.6.18","m":1,"o":["90°","60°","120°","150°"],"q":"<p>In triangle ABC with a = 3, b = 5 and c = 7, the angle C is:<\/p>","a":2,"s":"<p>cos C = (a² + b² − c²)/(2ab) = (9 + 25 − 49)/30 = −1/2.<br>Other options: A — assumed a right triangle; B — dropped the sign; D — took cos C = −√3/2.<\/p>","tag":""},{"id":"2.6.19","m":1,"o":["42 cm²","84 cm²","7056 cm²","105 cm²"],"q":"<p>The area of a triangle with sides 13 cm, 14 cm and 15 cm is:<\/p>","a":1,"s":"<p>s = 21; Δ = √(21 × 8 × 7 × 6) = √7056.<br>Other options: A — halved again; C — forgot the square root; D — used ½ × 14 × 15.<\/p>","tag":""},{"id":"2.6.20","m":1,"o":["17.32 cm²","20 cm²","10 cm²","40 cm²"],"q":"<p>In triangle ABC, a = 8 cm, b = 5 cm and C = 30°. Its area is:<\/p>","a":2,"s":"<p>Δ = ½ab sin C = ½ × 40 × ½.<br>Other options: A — used sin 60°; B — omitted ½; D — omitted both halves.<\/p>","tag":""},{"id":"2.6.21","m":1,"o":["4 units","8.125 units","6 units","2 units"],"q":"<p>The inradius of the triangle with sides 13, 14 and 15 units is:<\/p>","a":0,"s":"<p>r = Δ/s = 84/21.<br>Other options: B — that is the circumradius abc/(4Δ); C — took s − c = 21 − 15; D — divided by 2s.<\/p>","tag":""},{"id":"2.6.22","m":1,"o":["a = b sin C + c sin B","a = (b + c) cos A","a = b cos C + c cos B","a = b cos B + c cos C"],"q":"<p>In any triangle ABC, the projection formula states:<\/p>","a":2,"s":"<p>Side a equals the sum of the projections of b and c on it.<br>Other options: A — projections use cosines; B — no such identity; D — angles paired with the wrong sides.<\/p>","tag":""},{"id":"2.6.23","m":1,"o":["0.7781","1.8572","1.3801","2.0333"],"q":"<p>Given log 2 = 0.3010 and log 3 = 0.4771 (base 10), log 72 equals:<\/p>","a":1,"s":"<p>72 = 2³ × 3²: 3(0.3010) + 2(0.4771) = 0.9030 + 0.9542.<br>Other options: A — that is log 6; C — used 2³ × 3 = 24; D — used 2² × 3³ = 108.<\/p>","tag":""},{"id":"2.6.24","m":1,"o":["log(abc)","abc","0","1"],"q":"<p>For positive a, b, c (each ≠ 1), the value of logₐb · log_b c · log_c a is:<\/p>","a":3,"s":"<p>Change of base: (ln b/ln a)(ln c/ln b)(ln a/ln c) = 1.<br>Other options: A — added logs instead of multiplying ratios; B — confused log with exponent; C — products of logs do not add.<\/p>","tag":""},{"id":"2.6.25","m":1,"o":["3/2","1/2","2","2/3"],"q":"<p>The value of log₄8 is:<\/p>","a":0,"s":"<p>log₄8 = log₂8/log₂4 = 3/2.<br>Other options: B — log₄2; C — log₂4; D — inverted the change of base.<\/p>","tag":""},{"id":"2.6.26","m":1,"o":["x = 8","x = 5","x = 4","x = 4 or x = −2"],"q":"<p>The solution of log₂x + log₂(x − 2) = 3 is:<\/p>","a":2,"s":"<p>x(x − 2) = 8 ⇒ x = 4 or −2; x = −2 is rejected (log of negative).<br>Other options: A — solved x = 2³ only; B — solved x + (x − 2) = 8; D — did not check the domain.<\/p>","tag":""},{"id":"2.6.27","m":1,"o":["17","16","50","15"],"q":"<p>Given log 2 = 0.30103, the number of digits in 2⁵⁰ is:<\/p>","a":1,"s":"<p>log 2⁵⁰ = 15.0515; characteristic 15 ⇒ 15 + 1 digits.<br>Other options: A — added 2; C — the exponent; D — forgot to add 1 to the characteristic.<\/p>","tag":""},{"id":"2.6.28","m":1,"o":["log₆5","1","2","1/2"],"q":"<p>The value of 1/log₂6 + 1/log₃6 is:<\/p>","a":1,"s":"<p>= log₆2 + log₆3 = log₆6.<br>Other options: A — added 2 + 3; C — assumed each term is 1; D — multiplied instead of adding.<\/p>","tag":""},{"id":"2.6.29","m":1,"o":["−3 (written 3̄)","−2","−4","3"],"q":"<p>The characteristic of log₁₀ 0.00425 is:<\/p>","a":0,"s":"<p>0.00425 = 4.25 × 10⁻³; characteristic = −(number of zeros after the decimal point + 1) = −3.<br>Other options: B — counted only the zeros; C — counted one zero too many; D — sign lost.<\/p>","tag":""},{"id":"2.6.30","m":1,"o":["4","2","64","16"],"q":"<p>If logₓ(1/8) = −3/2, then x equals:<\/p>","a":0,"s":"<p>x^(−3/2) = 1/8 ⇒ x^(3/2) = 8 ⇒ x = 8^(2/3) = 4.<br>Other options: B — solved x³ = 8; C — solved x^(1/2) = 8; D — used x^(3/4).<\/p>","tag":""}]},{"k":"2.7","t":"Transforms","qs":[{"id":"2.7.1","m":1,"o":["2/s³","t³/3","1/s³","2/s²"],"q":"<p>The Laplace transform of t² is:<\/p>","a":0,"s":"<p>L{tⁿ} = n!/sⁿ⁺¹ with n = 2.<br>Other options: B — integrated instead of transforming; C — omitted n!; D — power of s one too low.<\/p>","tag":""},{"id":"2.7.2","m":1,"o":["1/(s − 3)","s/(s + 3)","1/(s + 3)","3/(s + 3)"],"q":"<p>The Laplace transform of e^(−3t) is:<\/p>","a":2,"s":"<p>L{e^(at)} = 1/(s − a), a = −3.<br>Other options: A — sign of a wrong; B — extra factor s; D — multiplied by 3.<\/p>","tag":""},{"id":"2.7.3","m":1,"o":["1/(s² + 4)","2/(s² − 4)","2/(s² + 4)","s/(s² + 4)"],"q":"<p>The Laplace transform of sin 2t is:<\/p>","a":2,"s":"<p>L{sin at} = a/(s² + a²).<br>Other options: A — missed the numerator a; B — that is L{sinh 2t}; D — that is L{cos 2t}.<\/p>","tag":""},{"id":"2.7.4","m":1,"o":["s/(s² − 3)","s/(s² − 9)","s/(s² + 9)","3/(s² − 9)"],"q":"<p>The Laplace transform of cosh 3t (s &gt; 3) is:<\/p>","a":1,"s":"<p>cosh 3t = (e^(3t) + e^(−3t))/2 ⇒ ½[1/(s − 3) + 1/(s + 3)] = s/(s² − 9).<br>Other options: A — used a instead of a²; C — that is L{cos 3t}; D — that is L{sinh 3t}.<\/p>","tag":""},{"id":"2.7.5","m":1,"o":["(s − 2)/((s − 2)² + 9)","(s + 2)/((s + 2)² + 9)","s/((s − 2)² + 9)","3/((s − 2)² + 9)"],"q":"<p>By the first shifting theorem, L{e^(2t) cos 3t} equals:<\/p>","a":0,"s":"<p>L{cos 3t} = s/(s² + 9); replace s by s − 2.<br>Other options: B — shifted the wrong way; C — shifted only the denominator; D — that is L{e^(2t) sin 3t}.<\/p>","tag":""},{"id":"2.7.6","m":1,"o":["−1/(s + 1)²","1/(s + 1)²","1/(s − 1)²","1/(s²(s + 1))"],"q":"<p>The Laplace transform of t e^(−t) is:<\/p>","a":1,"s":"<p>L{t} = 1/s², then s → s + 1.<br>Other options: A — sign slip from the derivative rule; C — shift direction wrong; D — multiplied the transforms.<\/p>","tag":""},{"id":"2.7.7","m":1,"o":["1/(s² + 1)²","−2s/(s² + 1)²","s/(s² + 1)²","2s/(s² + 1)²"],"q":"<p>The Laplace transform of t sin t is:<\/p>","a":3,"s":"<p>L{t f(t)} = −dF/ds with F = 1/(s² + 1).<br>Other options: A — missed the factor from differentiating; B — forgot the minus in −dF/ds; C — missed the factor 2.<\/p>","tag":""},{"id":"2.7.8","m":1,"o":["sF(s) − f(0)","−dF/ds","F(s)/s","sF(s) + f(0)"],"q":"<p>If L{f(t)} = F(s), then L{f′(t)} equals:<\/p>","a":0,"s":"<p>Integrating by parts: ∫₀^∞ e^(−st) f′ dt = [e^(−st) f]₀^∞ + s∫ e^(−st) f dt.<br>Other options: B — that is L{t f(t)}; C — that is the transform of the integral; D — sign of f(0) wrong.<\/p>","tag":""},{"id":"2.7.9","m":1,"o":["s²Y(s) + s y(0) + y′(0)","s²Y(s)","s²Y(s) − s y(0) − y′(0)","s²Y(s) − y(0) − s y′(0)"],"q":"<p>If L{y(t)} = Y(s), then L{y″(t)} equals:<\/p>","a":2,"s":"<p>Apply the first-derivative rule twice.<br>Other options: A — signs wrong; B — ignored the initial conditions; D — s multiplies y(0), not y′(0).<\/p>","tag":""},{"id":"2.7.10","m":1,"o":["F(s) − f(0)","F(s)/s","∫ₛ^∞ F(p) dp","sF(s)"],"q":"<p>If L{f(t)} = F(s), then L{∫₀ᵗ f(u) du} equals:<\/p>","a":1,"s":"<p>Integration in t corresponds to division by s.<br>Other options: A — no such rule; C — that is L{f(t)/t}; D — that is differentiation (with zero initial value).<\/p>","tag":""},{"id":"2.7.11","m":1,"o":["e^(−2s)","e^(2s)/s","e^(−2s)/s","1/s"],"q":"<p>The Laplace transform of the unit step function u(t − 2) is:<\/p>","a":2,"s":"<p>L{u(t − a)} = e^(−as)/s.<br>Other options: A — that is L{δ(t − 2)}; B — sign of the exponent wrong; D — that is L{u(t)}.<\/p>","tag":""},{"id":"2.7.12","m":1,"o":["2/(s − 1)³","2e^(s)/s³","e^(−s)/s³","2e^(−s)/s³"],"q":"<p>By the second shifting theorem, L{(t − 1)² u(t − 1)} equals:<\/p>","a":3,"s":"<p>L{f(t − a)u(t − a)} = e^(−as)F(s); F(s) = L{t²} = 2/s³.<br>Other options: A — used the first shifting theorem; B — sign of the exponent wrong; C — missed 2!.<\/p>","tag":""},{"id":"2.7.13","m":1,"o":["(1/3) sinh 3t","(1/3) sin 3t","sin 3t","cos 3t"],"q":"<p>The inverse Laplace transform of 1/(s² + 9) is:<\/p>","a":1,"s":"<p>L{sin 3t} = 3/(s² + 9), so divide by 3.<br>Other options: A — that corresponds to s² − 9; C — missed the factor 1/3; D — that has numerator s.<\/p>","tag":""},{"id":"2.7.14","m":1,"o":["e^(−t) cos 2t","e^(−t) cos 4t","e^(t) cos 2t","e^(−t) sin 2t"],"q":"<p>The inverse Laplace transform of (s + 1)/(s² + 2s + 5) is:<\/p>","a":0,"s":"<p>s² + 2s + 5 = (s + 1)² + 4; (s + 1)/((s + 1)² + 4) ↔ e^(−t) cos 2t.<br>Other options: B — used a² = 4 as a; C — shift sign wrong; D — that needs numerator 2.<\/p>","tag":""},{"id":"2.7.15","m":1,"o":["e^(−t)","t e^(−t)","1 + e^(−t)","1 − e^(−t)"],"q":"<p>The inverse Laplace transform of 1/[s(s + 1)] is:<\/p>","a":3,"s":"<p>Partial fractions: 1/s − 1/(s + 1).<br>Other options: A — only the second term; B — that is 1/(s + 1)²; C — sign slip in partial fractions.<\/p>","tag":""},{"id":"2.7.16","m":1,"o":["(t + 3) u(t + 3)","t u(t − 3)","t e^(−3t)","(t − 3) u(t − 3)"],"q":"<p>The inverse Laplace transform of e^(−3s)/s² is:<\/p>","a":3,"s":"<p>L⁻¹{1/s²} = t; the factor e^(−3s) delays it by 3 (second shifting).<br>Other options: A — shift direction wrong; B — did not shift the function itself; C — used the first shifting theorem.<\/p>","tag":""},{"id":"2.7.17","m":1,"o":["y = 3e^(−2t)","y = 3e^(2t)","y = e^(−2t)","y = 2e^(−3t)"],"q":"<p>Using Laplace transforms, the solution of y′ + 2y = 0 with y(0) = 3 is:<\/p>","a":0,"s":"<p>sY − 3 + 2Y = 0 ⇒ Y = 3/(s + 2).<br>Other options: B — sign slip; C — ignored the initial value; D — swapped the constants.<\/p>","tag":""},{"id":"2.7.18","m":1,"o":["y = sin 2t","y = 2 sin t","y = 2 cos t","y = 2 sinh t"],"q":"<p>Using Laplace transforms, the solution of y″ + y = 0 with y(0) = 0 and y′(0) = 2 is:<\/p>","a":1,"s":"<p>s²Y − 2 + Y = 0 ⇒ Y = 2/(s² + 1).<br>Other options: A — frequency confused with the amplitude; C — would need y(0) = 2; D — that solves y″ − y = 0.<\/p>","tag":""},{"id":"2.7.19","m":1,"o":["2/5","∞","0","3"],"q":"<p>For F(s) = (3s + 2)/(s² + 4s + 5), the initial value f(0⁺) given by the initial-value theorem is:<\/p>","a":3,"s":"<p>f(0⁺) = lim(s→∞) sF(s) = lim (3s² + 2s)/(s² + 4s + 5) = 3.<br>Other options: A — that is F(0); B — did not compare leading powers; C — that is lim(s→0) sF(s) (final-value form).<\/p>","tag":""},{"id":"2.7.20","m":1,"o":["(1/a) F(as)","F(s − a)","(1/a) F(s/a)","a F(as)"],"q":"<p>If L{f(t)} = F(s), then by the change-of-scale property L{f(at)} (a &gt; 0) equals:<\/p>","a":2,"s":"<p>Substitute τ = at in the defining integral.<br>Other options: A — argument scaled the wrong way; B — that is first shifting; D — inverse scaling.<\/p>","tag":""},{"id":"2.7.21","m":1,"o":["t + 1 − e^(−t)","1 − e^(−t)","t e^(−t)","t − 1 + e^(−t)"],"q":"<p>The inverse Laplace transform of 1/[s²(s + 1)] is:<\/p>","a":3,"s":"<p>1/[s²(s + 1)] = 1/s² − 1/s + 1/(s + 1).<br>Other options: A — signs of the partial-fraction constants reversed; B — that is L⁻¹{1/[s(s + 1)]}; C — multiplied inverse transforms.<\/p>","tag":""},{"id":"2.7.22","m":1,"o":["(2/π) ∫ f(x) sin nx dx over (−π, π)","(1/π) ∫ f(x) sin nx dx over (−π, π)","(1/π) ∫ f(x) cos nx dx over (−π, π)","(1/2π) ∫ f(x) sin nx dx over (−π, π)"],"q":"<p>For the Fourier series f(x) = a₀/2 + Σ(aₙ cos nx + bₙ sin nx) on (−π, π), the coefficient bₙ is:<\/p>","a":1,"s":"<p>Euler&#x27;s formula from orthogonality of sin nx on a 2π interval.<br>Other options: A — 2/π is used for half-range series over (0, π); C — that is aₙ; D — 1/2π is used only for the constant term when the series is written with a₀ (not a₀/2).<\/p>","tag":""},{"id":"2.7.23","m":1,"o":["Both sine and cosine terms","Only sine terms","Only cosine terms and a constant","Only the constant term"],"q":"<p>The Fourier series of an odd function on (−π, π) contains:<\/p>","a":1,"s":"<p>a₀ and aₙ vanish because f(x) cos nx is odd.<br>Other options: A — true only for functions with no symmetry; C — that is an even function; D — only for constant functions.<\/p>","tag":""},{"id":"2.7.24","m":1,"o":["π²/3","2π²/3","π²/6","2π³/3"],"q":"<p>For f(x) = x² on (−π, π), with the series written as a₀/2 + Σ aₙ cos nx, the coefficient a₀ is:<\/p>","a":1,"s":"<p>a₀ = (1/π) ∫₋π^π x² dx = (1/π)(2π³/3).<br>Other options: A — that is the constant term a₀/2; C — halved twice; D — forgot the factor 1/π.<\/p>","tag":""},{"id":"2.7.25","m":1,"o":["2(−1)ⁿ⁺¹/n","(−1)ⁿ/n","0","2/n"],"q":"<p>For f(x) = x on (−π, π), the Fourier sine coefficient bₙ is:<\/p>","a":0,"s":"<p>bₙ = (1/π) ∫ x sin nx dx = −(2/n) cos nπ.<br>Other options: B — lost the factor 2 and the sign; C — x is odd, so bₙ survive; aₙ vanish; D — ignored cos nπ = (−1)ⁿ.<\/p>","tag":""},{"id":"2.7.26","m":1,"o":["0","The series diverges at x = 0","1/2","1"],"q":"<p>f(x) = 0 for −π &lt; x &lt; 0 and f(x) = 1 for 0 &lt; x &lt; π (period 2π). By Dirichlet&#x27;s theorem, its Fourier series at x = 0 converges to:<\/p>","a":2,"s":"<p>At a jump the series converges to [f(0⁻) + f(0⁺)]/2 = (0 + 1)/2.<br>Other options: A — the left-hand limit; B — Dirichlet conditions guarantee convergence; D — the right-hand limit.<\/p>","tag":""},{"id":"2.7.27","m":1,"o":["2/(nπ) for all n","0 for odd n and 4/(nπ) for even n","4/(nπ) for odd n and 0 for even n","4/(nπ) for all n"],"q":"<p>The half-range sine series of f(x) = 1 on (0, π) has coefficients bₙ equal to:<\/p>","a":2,"s":"<p>bₙ = (2/π)∫₀^π sin nx dx = (2/nπ)(1 − (−1)ⁿ).<br>Other options: A — ignored the (1 − (−1)ⁿ) factor; B — parity reversed; D — even terms vanish.<\/p>","tag":""},{"id":"2.7.28","m":1,"o":["Extending f as an even function to (−L, L)","Extending f periodically with period L","Extending f as an odd function to (−L, L)","Setting f = 0 on (−L, 0)"],"q":"<p>A half-range cosine series of f(x) defined on (0, L) is obtained by:<\/p>","a":0,"s":"<p>An even extension leaves only a₀ and cosine terms (period 2L).<br>Other options: B — that gives a full series with period L; C — that gives the sine series; D — gives both sine and cosine terms.<\/p>","tag":""},{"id":"2.7.29","m":1,"o":["f(x) must be differentiable everywhere","f(x) has a finite number of finite discontinuities","f(x) has a finite number of maxima and minima","f(x) is absolutely integrable over the period"],"q":"<p>Which of the following is NOT one of the Dirichlet conditions for a Fourier series of f(x) over a period?<\/p>","a":0,"s":"<p>Dirichlet requires only piecewise continuity: finitely many discontinuities and extrema, and absolute integrability.<br>Other options: B — this is a Dirichlet condition; C — this is a Dirichlet condition; D — this is a Dirichlet condition.<\/p>","tag":""},{"id":"2.7.30","m":1,"o":["4/π","0","−2/π","−4/π"],"q":"<p>For f(x) = |x| on (−π, π), the Fourier cosine coefficient a₁ is:<\/p>","a":3,"s":"<p>aₙ = (2/π)∫₀^π x cos nx dx = 2[(−1)ⁿ − 1]/(πn²); n = 1 gives −4/π.<br>Other options: A — sign slip; B — aₙ vanish only for even n ≥ 2; C — lost the factor 2.<\/p>","tag":""}]}]},{"n":3,"t":"Structural Engineering","subs":[{"k":"3.1","t":"Stresses and Strains","qs":[{"id":"3.1.1","m":1,"o":["0.40 mm","1.59 mm","1.25 mm","3.18 mm"],"q":"<p>A steel rod of 20 mm diameter and 2 m length carries an axial tensile load of 50 kN. Take E = 200 GPa. The elongation of the rod is about:<\/p>","a":1,"s":"<p>A = π/4 × 20² = 314.16 mm². δ = PL/(AE) = 50 000 × 2000/(314.16 × 200 000) = 1.59 mm.<br>Other options: A — area taken as π × 20² (diameter used as radius); C — area taken as d² = 400 mm²; D — area taken as π/8 × d² (half the true area).<\/p>","tag":""},{"id":"3.1.2","m":1,"o":["50 GPa","100 GPa","80 GPa","160 GPa"],"q":"<p>For a material with E = 200 GPa and Poisson&#x27;s ratio ν = 0.25, the modulus of rigidity G is:<\/p>","a":2,"s":"<p>E = 2G(1 + ν) → G = 200/(2 × 1.25) = 80 GPa.<br>Other options: A — E/4; B — E/2 (ignores ν); D — E/(1 + ν), dropped the factor 2.<\/p>","tag":""},{"id":"3.1.3","m":1,"o":["166.7 GPa","95.2 GPa","76.9 GPa","500 GPa"],"q":"<p>For a material with E = 200 GPa and ν = 0.3, the bulk modulus K is about:<\/p>","a":0,"s":"<p>E = 3K(1 − 2ν) → K = 200/(3 × 0.4) = 166.7 GPa.<br>Other options: B — used (1 − ν) instead of (1 − 2ν); C — this is G = E/2(1 + ν); D — E/(1 − 2ν), forgot the factor 3.<\/p>","tag":""},{"id":"3.1.4","m":1,"o":["0.25","0.33","1.0","0.5"],"q":"<p>For a homogeneous, isotropic, linearly elastic material, the theoretical upper limit of Poisson&#x27;s ratio is:<\/p>","a":3,"s":"<p>K = E/3(1 − 2ν) must be positive and finite, so ν &lt; 0.5. ν = 0.5 means an incompressible material (rubber is close to it).<br>Other options: A — typical value for some metals, not the limit; B — typical for aluminium/steel range; C — would make K negative.<\/p>","tag":""},{"id":"3.1.5","m":1,"o":["1","2","3","4"],"q":"<p>The number of independent elastic constants for a homogeneous isotropic material is:<\/p>","a":1,"s":"<p>Of E, G, K and ν only two are independent; the other two follow from E = 2G(1 + ν) = 3K(1 − 2ν).<br>Other options: A — one constant cannot describe both volume and shape change; C, D — the extra constants are dependent (anisotropic materials need more).<\/p>","tag":""},{"id":"3.1.6","m":1,"o":["48 MPa tensile","96 MPa tensile","48 MPa compressive","96 MPa compressive"],"q":"<p>A steel rod is fixed between two rigid walls and its temperature is raised by 40 °C. Take α = 12 × 10⁻⁶ /°C and E = 200 GPa. The stress induced in the rod is:<\/p>","a":3,"s":"<p>σ = αΔT E = 12 × 10⁻⁶ × 40 × 200 000 = 96 MPa. Expansion is prevented, so the rod is pushed back: compressive.<br>Other options: A, B — heating a restrained rod gives compression, not tension; A, C — half the correct value.<\/p>","tag":""},{"id":"3.1.7","m":1,"o":["80 MPa compressive","120 MPa compressive","40 MPa compressive","Zero, since the gap absorbs the expansion"],"q":"<p>A 2 m long steel rod has a gap of 0.4 mm between its end and a rigid wall at room temperature. Its temperature is raised by 50 °C. Take α = 12 × 10⁻⁶ /°C and E = 200 GPa. The stress in the rod is:<\/p>","a":0,"s":"<p>Free expansion = 12 × 10⁻⁶ × 50 × 2000 = 1.2 mm. Prevented part = 1.2 − 0.4 = 0.8 mm. σ = E × 0.8/2000 = 80 MPa (compressive).<br>Other options: B — ignores the gap; C — subtracts the gap twice; D — the free expansion (1.2 mm) is more than the gap.<\/p>","tag":""},{"id":"3.1.8","m":1,"o":["0.0005","0.0008","0.0002","0.00035"],"q":"<p>A bar is subjected to an axial tensile stress of 100 MPa. Take E = 200 GPa and ν = 0.3. The volumetric strain of the bar is:<\/p>","a":2,"s":"<p>εv = ε(1 − 2ν) = (100/200 000) × (1 − 0.6) = 0.0005 × 0.4 = 0.0002.<br>Other options: A — only the axial strain; B — used (1 + 2ν); D — used (1 − ν).<\/p>","tag":""},{"id":"3.1.9","m":1,"o":["133.3 MPa","100 MPa","66.7 MPa","200 MPa"],"q":"<p>A compound bar consists of a steel rod (area 500 mm², E = 200 GPa) inside a copper tube (area 1000 mm², E = 100 GPa) of the same length. Both are compressed together by an axial load of 200 kN through rigid end plates. The stress in the copper tube is:<\/p>","a":1,"s":"<p>Equal strains → load shared in the ratio AE: 500 × 200 : 1000 × 100 = 1 : 1. Each carries 100 kN. σc = 100 000/1000 = 100 MPa (steel 200 MPa).<br>Other options: A — average stress, load/total area (200 kN/1500 mm²); C — load shared only in the ratio of E (copper 1/3 of 200 kN); D — this is the steel stress.<\/p>","tag":""},{"id":"3.1.10","m":1,"o":["The ratio of their moduli of elasticity","The ratio of their areas","The inverse ratio of their moduli of elasticity","Unity"],"q":"<p>In a compound bar of two materials under axial load (equal strains), the ratio of stresses in the two materials equals:<\/p>","a":0,"s":"<p>Same strain ε, so σ1/σ2 = E1ε/E2ε = E1/E2 (the modular ratio).<br>Other options: B — areas decide the load share only together with E; C — inverted; D — stresses are equal only if E1 = E2.<\/p>","tag":""},{"id":"3.1.11","m":1,"o":["0.2 N·mm/mm³","0.001 N·mm/mm³","0.05 N·mm/mm³","0.1 N·mm/mm³"],"q":"<p>A bar is stressed to 200 MPa within the elastic limit (E = 200 GPa). The strain energy stored per unit volume is:<\/p>","a":3,"s":"<p>u = σ²/2E = 200²/(2 × 200 000) = 0.1 N·mm/mm³ (= 100 kJ/m³).<br>Other options: A — σ²/E, missing th
